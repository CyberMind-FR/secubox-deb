name: Build SecuBox System Images

on:
  workflow_call:
    inputs:
      board:
        description: 'Target board'
        required: false
        type: string
        default: 'all'
      size:
        description: 'Image size (empty = use board default)'
        required: false
        type: string
        default: ''
      suite:
        description: 'Debian suite (bookworm = cible actuelle, trixie = portage)'
        required: false
        type: string
        default: 'bookworm'
    secrets:
      GPG_PRIVATE_KEY:
        required: false
  workflow_dispatch:
    inputs:
      board:
        description: 'Target board'
        required: true
        type: choice
        options:
          - mochabin
          # espressobin-v7 est REVENU dans la matrice par defaut (#1318) : la
          # raison de son exclusion (#503) — une jambe en echec qui sautait la
          # publication de TOUTES les autres — a ete corrigee depuis, le job
          # `release` portant desormais `if: !cancelled()` (#1294).
          - espressobin-v7
          # ultra reste a la demande : son `board/` est le plus maigre du parc
          # (ni extlinux/, ni boot-usb), donc le moins eprouve. On le rebranche
          # quand v7 aura tourne quelques fois — pas avant, et pas « parce que
          # c'est la meme famille ».
          - espressobin-ultra # a la demande — board/ incomplet, voir #1318
          - vm-x64
          - vm-arm64
          - rpi400
          - all
        default: vm-x64
      size:
        description: 'Image size (empty = use board default)'
        required: false
        default: ''
      suite:
        description: 'Debian suite'
        required: false
        type: choice
        options: [bookworm, trixie]
        default: bookworm
      kiosk:
        description: 'rpi400/rpi4 only: include GUI kiosk (chromium fullscreen dashboard)'
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

env:
  # SUITE PARAMÉTRABLE (#1294). Elle était figée à bookworm ; le portage Trixie
  # demande de construire les deux sans dupliquer le workflow. Le repli littéral
  # `bookworm` n'est pas décoratif : sans lui, un appel qui ne passe rien
  # produirait `--suite ` et debootstrap échouerait sur une suite vide.
  DEBIAN_SUITE: ${{ inputs.suite || github.event.inputs.suite || 'bookworm' }}

jobs:
  # LA MATRICE EST DERIVEE DES CARTES, PLUS CODEE EN DUR (#1318).
  #
  # Elle portait `profile: ["full","isp"]` pour TOUTES les cartes, et
  # `build-image.sh` applique `--profile` de maniere INCONDITIONNELLE : il
  # ecrase le `SECUBOX_PROFILE` que la carte declare dans son `config.mk`.
  #
  # L'ESPRESSObin dit d'elle-meme `SECUBOX_PROFILE=secubox-lite`, avec le
  # commentaire « RAM limitee 1-2 GB » et `SWAP_SIZE=512M`. La CI repondait
  # `full`, soit 95 modules sur un Armada 3720 dual-core A53 — le scenario
  # exact qui avait fait caler le rpi400 (140 unites, 4 Go, aucun swap), sauf
  # que cette carte a DEUX FOIS MOINS de memoire et QUATRE FOIS MOINS de coeurs.
  #
  # La carte sait ce qu'elle peut porter ; la matrice ne savait rien. Ecrire
  # les profils en YAML revenait a decider a la place de la carte, depuis
  # l'endroit le moins informe de la chaine. Le job ci-dessous LIT les cartes.
  matrice:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.calcul.outputs.include }}
    steps:
      - uses: actions/checkout@v5
      - id: calcul
        run: |
          set -euo pipefail
          cartes='${{ inputs.board || github.event.inputs.board || 'defaut' }}'
          [ "$cartes" = "all" ] && cartes=defaut
          m=$(python3 .github/scripts/matrice-images.py --cartes "$cartes")
          echo "$m" | python3 -m json.tool
          echo "include=$(echo "$m" | python3 -c 'import sys,json; print(json.dumps(json.load(sys.stdin)["include"]))')" >> "$GITHUB_OUTPUT"

  # Build system images
  build-image:
    needs: matrice
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.matrice.outputs.include) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Marge disque + swap
        uses: ./.github/actions/runner-headroom

      - name: Setup QEMU + binfmt
        # Tout sauf vm-x64 est arm64 — c'est la regle qu'applique deja, plus
        # bas, l'etape « Determine architecture ». Le test par sous-chaine qui
        # tenait ici ratait `rpi400`, qui ne contient ni « arm », ni
        # « espresso », ni « mocha » : le seul board arm64 dont le nom ne le dit
        # pas etait donc le seul a ne jamais recevoir l'emulation rapide. La
        # construction aboutissait quand meme — `Install build tools` installe
        # qemu-user-static, qui enregistre les gestionnaires — mais par le
        # chemin lent, d'ou des durees de 93 a 114 min contre un plafond de 90.
        if: matrix.board != 'vm-x64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            debootstrap qemu-user-static binfmt-support \
            parted dosfstools e2fsprogs rsync \
            gzip pigz xz-utils

      # PROVENANCE DES PAQUETS. L'etape ne demandait QUE « le dernier run
      # reussi de build-packages.yml » — sans aucun lien avec le commit
      # construit. Une image pouvait donc porter l'estampille d'un commit et
      # le contenu d'un autre, ce qui s'est produit trois fois en une journee
      # (#1308) :
      #   - une image bâtie a 13h44 a pris les paquets de la veille, parce
      #     qu'elle courait contre sa propre construction de paquets ;
      #   - un test cible sur UN SEUL paquet a suffi a empoisonner le
      #     pointeur : l'image suivante n'a trouve que 2 .deb.
      #
      # On tente d'abord l'agregat DU COMMIT construit. S'il n'existe pas
      # encore — cas normal quand paquets et image partent du meme push — on
      # retombe sur le dernier reussi, mais la provenance est IMPRIMEE. Le
      # silence etait le vrai defaut : se tromper de paquets est rattrapable,
      # ne pas savoir lesquels on a pris ne l'est pas.
      - name: Download package artifacts (commit exact)
        id: debs-exact
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: build-packages.yml
          name: secubox-debs-all
          commit: ${{ github.sha }}
          path: output/debs/
          if_no_artifact_found: warn
        continue-on-error: true

      - name: Download package artifacts (repli — dernier reussi)
        id: debs-fallback
        if: steps.debs-exact.outcome != 'success'
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: build-packages.yml
          name: secubox-debs-all
          path: output/debs/
          if_no_artifact_found: warn
        continue-on-error: true

      - name: Provenance des paquets
        run: |
          n=$(find output/debs -name '*.deb' 2>/dev/null | wc -l)
          if [ "${{ steps.debs-exact.outcome }}" = "success" ]; then
            echo "paquets : agregat DU COMMIT ${{ github.sha }}"
          else
            echo "paquets : REPLI sur le dernier run reussi de build-packages.yml"
            echo "          (aucun agregat pour ${{ github.sha }} au moment du telechargement)"
          fi
          echo "paquets : ${n} .deb disponibles"
          # Un agregat partiel est le piege observe : 2 .deb au lieu de 180,
          # parce qu'un run cible sur un seul paquet avait pris la place. La
          # selection par profil echouera plus loin faute de meta-paquet,
          # mais autant le dire ICI, ou la cause est encore lisible.
          if [ "$n" -lt 50 ]; then
            echo "::warning::agregat suspect — ${n} .deb seulement." \
                 "Un run de paquets cible a-t-il pris la place du dernier complet ?"
          fi

      - name: Verify profile is clean (#1112)
        run: |
          # Porte « propre » : refuse de builder si le profil référence un module
          # inexistant ou hors working-set (un module non fini ne peut pas entrer
          # dans l'image).
          bash scripts/verify-profile.sh ${{ matrix.profile }}

      - name: List available packages
        run: |
          echo "=== SecuBox packages to slipstream ==="
          ls output/debs/secubox-*.deb 2>/dev/null | wc -l || echo "0"
          ls output/debs/secubox-*.deb 2>/dev/null | xargs -I{} basename {} | sed 's/_.*$//' | sort -u || echo "No packages found"

      - name: Determine architecture
        id: arch
        run: |
          case "${{ matrix.board }}" in
            vm-x64)
              echo "arch=amd64" >> $GITHUB_OUTPUT
              echo "is_arm=false" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "arch=arm64" >> $GITHUB_OUTPUT
              echo "is_arm=true" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Build image for ${{ matrix.board }}
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Use slipstream if packages are available
          SLIPSTREAM_OPT=""
          if ls output/debs/secubox-*.deb >/dev/null 2>&1; then
            SLIPSTREAM_OPT="--slipstream"
            echo "Slipstream enabled: $(ls output/debs/secubox-*.deb | wc -l) packages"
          fi

          # Build with board-specific size (from board/*/config.mk)
          SIZE_OPT=""
          if [ -n "${{ inputs.size || github.event.inputs.size }}" ]; then
            SIZE_OPT="--size ${{ inputs.size || github.event.inputs.size }}"
          fi

          # rpi400/rpi4 GUI kiosk (chromium fullscreen dashboard). Ignored by
          # non-rpi boards (build-image.sh only forwards it to build-rpi-usb.sh).
          KIOSK_OPT=""
          if [ "${{ inputs.kiosk || github.event.inputs.kiosk }}" = "true" ]; then
            KIOSK_OPT="--kiosk"
          fi

          sudo -E bash image/build-image.sh \
            --board ${{ matrix.board }} \
            --profile ${{ matrix.profile }} \
            --suite ${{ env.DEBIAN_SUITE }} \
            --out output/ \
            $SIZE_OPT \
            $SLIPSTREAM_OPT \
            $KIOSK_OPT
          sudo chown -R $(id -u):$(id -g) output/
        # 90 min etait sous la duree reelle : les constructions rpi400 mesurees
        # tiennent 93, 105 et 114 min. Le plafond ne coupait donc pas une
        # derive, il coupait le travail normal.
        timeout-minutes: 180

      - name: List output
        run: |
          ls -lh output/

      - name: Generate checksums
        run: |
          cd output/
          sha256sum *.img.gz > SHA256SUMS 2>/dev/null || echo "No images found" > SHA256SUMS
          cat SHA256SUMS

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: secubox-${{ matrix.profile }}-${{ matrix.board }}-${{ env.DEBIAN_SUITE }}
          path: |
            output/*.img.gz
            output/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  # Collect all images and create release
  release:
    needs: build-image
    runs-on: ubuntu-latest
    # `!cancelled()` ET NON `success()` implicite. En dependance stricte, UNE
    # seule jambe de matrice en echec sautait la publication de TOUTES les
    # autres : sur v3.0.0-alpha.4, `mochabin/full` est tombe et les CINQ images
    # qui avaient abouti (isp-mochabin, isp/full-rpi400, isp/full-vm-x64) ne
    # sont jamais arrivees sur la release — elles ont fini en artefacts de
    # workflow, invisibles. `fail-fast: false` laisse les autres finir ; encore
    # faut-il que la publication ne soit pas tout-ou-rien (#1294).
    #
    # Le garde-fou « zero image » plus bas rattrape le cas ou TOUT a echoue :
    # sans lui, ce relachement publierait une release vide en silence.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}

    steps:
      # Le checkout passe EN PREMIER : l'action composite vit dans le depot, on
      # ne peut pas l'utiliser avant de l'avoir. Il etait plus bas, juste pour
      # les scripts d'image — il sert desormais aux deux.
      - name: Checkout
        uses: actions/checkout@v5

      - name: Marge disque + swap
        uses: ./.github/actions/runner-headroom

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: images/
          merge-multiple: true

      - name: Verify at least one image was built
        run: |
          # Contrepartie du `!cancelled()` ci-dessus. Une matrice entierement
          # en echec ne doit pas produire une release vide sans bruit.
          n=$(ls images/*.img.gz 2>/dev/null | wc -l)
          echo "images recuperees : $n"
          ls -lh images/*.img.gz 2>/dev/null || true
          if [ "$n" -eq 0 ]; then
            echo "::error::aucune image construite — la matrice a entierement echoue"
            exit 1
          fi
          if [ "$n" -lt 6 ]; then
            echo "::warning::$n image(s) sur 6 — des jambes de matrice ont echoue, publication partielle"
          fi

      - name: Generate combined checksums
        run: |
          cd images/
          # Remove individual SHA256SUMS files
          rm -f SHA256SUMS
          # Generate combined checksums
          sha256sum *.img.gz 2>/dev/null | sort > SHA256SUMS || echo "No images" > SHA256SUMS
          cat SHA256SUMS

      - name: Sign checksums
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "$GPG_PRIVATE_KEY" | gpg --batch --import
            cd images/
            gpg --clearsign SHA256SUMS
            mv SHA256SUMS.asc SHA256SUMS.gpg
          fi

      - name: Delete existing release assets (if any)
        run: |
          VERSION="${{ github.ref_name }}"
          if gh release view "$VERSION" &>/dev/null; then
            echo "Release $VERSION exists, deleting duplicate assets..."
            for file in images/*.img.gz images/SHA256SUMS images/SHA256SUMS.gpg image/create-qemu-arm64-vm.sh image/create-vbox-vm.sh; do
              [ -f "$file" ] || continue
              name=$(basename "$file")
              gh release delete-asset "$VERSION" "$name" --yes 2>/dev/null || true
            done
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            images/*.img.gz
            images/SHA256SUMS
            images/SHA256SUMS.gpg
            image/create-qemu-arm64-vm.sh
            image/create-vbox-vm.sh
          body: |
            ## SecuBox-DEB ${{ github.ref_name }} System Images

            Flashable system images for SecuBox appliances.

            ### Available Images

            | Image | Board | Architecture | Description |
            |-------|-------|--------------|-------------|
            | `secubox-mochabin-${{ env.DEBIAN_SUITE }}.img.gz` | MOCHAbin | arm64 | Marvell Armada 7040 (Pro) |
            | `secubox-rpi400-${{ env.DEBIAN_SUITE }}.img.gz` | Raspberry Pi 400 | arm64 | Pi 400 / Pi 4 |
            | `secubox-vm-x64-${{ env.DEBIAN_SUITE }}.img.gz` | VirtualBox/QEMU | amd64 | VM for testing |
            | `create-qemu-arm64-vm.sh` | QEMU ARM64 | script | Run ARM64 on x86 hosts |

            *ESPRESSObin v7 and Ultra board images are no longer published in
            scheduled releases (see #503).  Board support remains in tree and
            on-demand builds are available via workflow_dispatch.*

            ### Installation

            **ARM64 boards (MOCHAbin, Raspberry Pi 400):**
            ```bash
            # Flash to SD card or eMMC
            gunzip -c secubox-mochabin-${{ env.DEBIAN_SUITE }}.img.gz | sudo dd of=/dev/sdX bs=4M status=progress
            sync
            ```

            **VirtualBox (x64):**
            ```bash
            # Convert to VDI
            gunzip secubox-vm-x64-${{ env.DEBIAN_SUITE }}.img.gz
            VBoxManage convertfromraw secubox-vm-x64-${{ env.DEBIAN_SUITE }}.img secubox.vdi --format VDI

            # Create VM
            VBoxManage createvm --name SecuBox --ostype Debian_64 --register
            VBoxManage modifyvm SecuBox --memory 2048 --cpus 2 --nic1 nat
            VBoxManage storagectl SecuBox --name SATA --add sata
            VBoxManage storageattach SecuBox --storagectl SATA --port 0 --device 0 --type hdd --medium secubox.vdi
            ```

            ### Verification

            ```bash
            sha256sum -c SHA256SUMS
            gpg --verify SHA256SUMS.gpg
            ```

            ### Default Credentials

            - **SSH:** root / (SSH key only, set during firstboot)
            - **Web UI:** https://secubox.local:8443 (admin / generated at firstboot)

            ### Included Packages

            **124 SecuBox packages** across all security domains:
            - **Core:** hub, core, portal, system, console
            - **Security:** waf, auth, nac, threats, ipblock, mac-guard, hardening
            - **Networking:** wireguard, haproxy, dpi, qos, netmodes, vhost, cdn
            - **Applications:** mail, gitea, nextcloud, ollama, jellyfin, matrix
            - **SOC:** soc-agent, soc-gateway, soc-web
            - **Intel:** device-intel, vortex-dns, vortex-firewall, ai-insights
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
