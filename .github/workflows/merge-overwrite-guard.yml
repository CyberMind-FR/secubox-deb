# Garde-fou contre les fusions qui écrasent le travail de master (#1748).
# La fusion aff481735 (2026-08-17) a remis l'api/main.py de 12 paquets à leur version de
# juin ; personne ne l'a vu pendant six semaines. Un fichier .py modifié des deux côtés dont
# la fusion reprend un côté octet pour octet fait échouer la vérification.
#
# Exception voulue (rare) : étiqueter la PR « ecrasement-voulu » et en dire la raison.

name: Merge Overwrite Guard

on:
  pull_request:
  push:
    branches: [master]

jobs:
  garde:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ecrasement-voulu') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Fusion simulée de la PR (ou fusion poussée sur master)
        run: scripts/check-merge-overwrite.sh --commit HEAD
      - name: Fusions déjà contenues dans la branche de la PR
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          scripts/check-merge-overwrite.sh --range "origin/${{ github.base_ref }}..HEAD^2"
