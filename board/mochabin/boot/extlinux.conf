# SecuBox MOCHAbin — Distroboot Configuration
# Marvell Armada 7040 (Cortex-A72 quad-core)
# Auto-default after 3 seconds

DEFAULT secubox-5
TIMEOUT 30
PROMPT 1
MENU TITLE SecuBox MOCHAbin Boot Menu

LABEL secubox-5
    MENU LABEL 5. SecuBox 6.12.85-5secubox — tous systemes de fichiers + ksmbd + CFS_BANDWIDTH
    # Image BRUTE, pas vmlinuz : booti (arm64) ne demarre pas une image
    # compressee gzip. L entree qui pointait sur /vmlinuz-6.12.85 (14 Mo, gzip)
    # echouait donc en silence, et le menu retombait sur mpcie-fix — un noyau
    # du 2 juin. C est pour cela que trois deploiements successifs n ont jamais
    # pris.
    KERNEL /Image-secubox-5
    INITRD /initrd.img-6.12.85
    FDT /armada-7040-mochabin-mpcie-fix.dtb
    APPEND root=/dev/mmcblk0p2 rootfstype=ext4 rw rootwait console=ttyS0,115200

LABEL secubox-3
    MENU LABEL 3. SecuBox 6.12.85-3secubox + WiFi mesh stack (mt76x2u/ath10k/ath9k_htc) [NEW]
    KERNEL /vmlinuz-6.12.85
    INITRD /initrd.img-6.12.85
    FDT /armada-7040-mochabin-mpcie-fix.dtb
    APPEND root=/dev/mmcblk0p2 rootfstype=ext4 rw rootwait console=ttyS0,115200

LABEL mpcie-fix
    MENU LABEL 2. SecuBox 6.12.85 + mPCIe USB PHY (previous default, supports EP06 + RTL-SDR)
    KERNEL /Image-mpcie-fix
    INITRD /initrd.img-mpcie-fix
    FDT /armada-7040-mochabin-mpcie-fix.dtb
    APPEND root=/dev/mmcblk0p2 rootfstype=ext4 rw rootwait console=ttyS0,115200

LABEL nftables
    MENU LABEL 1. Kernel 6.6.137 nftables (legacy)
    KERNEL /Image-nft
    FDT /armada-7040-mochabin-nft.dtb
    APPEND root=/dev/mmcblk0p2 rootfstype=ext4 rw rootwait console=ttyS0,115200
