# SecuBox MOCHAbin — Distroboot Configuration
# Marvell Armada 7040 (Cortex-A72 quad-core)
# U-Boot / Tow-Boot reads this file via the extlinux/pxe protocol.
#
# Menu behaviour:
#   PROMPT 1  → show the menu on serial console (Tab cycles entries)
#   TIMEOUT 30 → auto-select DEFAULT after 3 s if no key pressed
#   DEFAULT mpcie-fix → boots the v0.4.0-compatible kernel (EP06 mPCIe
#     USB PHY fix + RTL-SDR working). The legacy `nftables` kernel
#     stays available as a manual fallback. Setting DEFAULT here is
#     critical — without an auto-default, U-Boot waits indefinitely
#     for an operator key press on the serial console (issue observed
#     2026-05-23 after a reboot left gk2 unreachable until manual
#     intervention at the console).

DEFAULT mpcie-fix
TIMEOUT 30
PROMPT 1
MENU TITLE SecuBox MOCHAbin Boot Menu

LABEL nftables
    MENU LABEL 1. Kernel 6.6.137 nftables (legacy)
    KERNEL /Image-nft
    FDT /armada-7040-mochabin-nft.dtb
    APPEND root=/dev/mmcblk0p2 rootfstype=ext4 rw rootwait console=ttyS0,115200

LABEL mpcie-fix
    MENU LABEL 2. SecuBox 6.12.85 + mPCIe USB PHY (default, supports EP06 + RTL-SDR)
    KERNEL /Image-mpcie-fix
    INITRD /initrd.img-mpcie-fix
    FDT /armada-7040-mochabin-mpcie-fix.dtb
    APPEND root=/dev/mmcblk0p2 rootfstype=ext4 rw rootwait console=ttyS0,115200 net.ifnames=0 initcall_blacklist=leds_pca955x_init
