# Corrige a la main (#999).
#
# La version derivee par `profilectl scan` decrivait un runtime `native` avec
# une unite hote inexistante, sans conteneur ni domaine portail. Le module
# etait donc injoignable par le waker : son vhost rendait une page brute au
# lieu d'etre reveille. Le fichier derive invite lui-meme a cette correction.
id        = "spiderfoot"
category  = "security"
runtime   = "lxc"
lxc       = "spiderfoot"
exposure  = "public"
units     = []
lifecycle = "on-demand"
priority  = 40
portal    = { domain = "spiderfoot.gk2.secubox.in" }
