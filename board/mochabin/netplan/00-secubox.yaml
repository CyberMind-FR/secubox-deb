# SecuBox MOCHAbin base network (router mode).
# WAN = eth2 (DHCP from upstream, e.g. Freebox), reliably the default route.
# lan0-3 = DSA switch ports (optional so a link-down port never wedges boot).
# br-lxc = LXC container bridge.
network:
  version: 2
  renderer: networkd
  ethernets:
    eth1:
      optional: true
    eth2:
      dhcp4: true
      dhcp6: false
      # PAS `optional: true` — c'est l'interface de GESTION (#998).
      #
      # `optional: true` fait emettre RequiredForOnline=no, donc
      # systemd-networkd-wait-online ne compte JAMAIS cette interface comme en
      # ligne : l'unite expirait et echouait a chaque demarrage, meme avec
      # --any, meme quand eth2 etait parfaitement `routable (configured)`.
      #
      # lan0..lan3 gardent `optional: true` a juste titre : ce sont les ports
      # du switch, sans cable la plupart du temps.
      optional: false
      dhcp4-overrides:
        use-routes: true
        route-metric: 100
      # Pas d'adresse ni de route fixes (#3088). L'ancien secours statique en .200 (#913) était
      # l'adresse de gk2 : toute autre MOCHAbin du réseau la prenait (conflit ARP constaté au banc le
      # 2026-10-24). gk2 tient .200 de son bail DHCP.
    lan0: {optional: true}
    lan1: {optional: true}
    lan2: {optional: true}
    lan3: {optional: true}
  bridges:
    br-lxc:
      interfaces: []
      addresses: [10.100.0.1/24]
      optional: true
