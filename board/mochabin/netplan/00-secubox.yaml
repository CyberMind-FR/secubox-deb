# SecuBox MOCHAbin base network (router mode).
# WAN = eth2 (DHCP from upstream, e.g. Freebox), reliably the default route.
# lan0-3 = DSA switch ports (optional so a link-down port never wedges boot).
# br-lxc = LXC container bridge.
network:
  version: 2
  renderer: networkd
  ethernets:
    eth1:
      optional: true
    eth2:
      dhcp4: true
      dhcp6: false
      # PAS `optional: true` — c'est l'interface de GESTION (#998).
      #
      # `optional: true` fait emettre RequiredForOnline=no, donc
      # systemd-networkd-wait-online ne compte JAMAIS cette interface comme en
      # ligne : l'unite expirait et echouait a chaque demarrage, meme avec
      # --any, meme quand eth2 etait parfaitement `routable (configured)`.
      #
      # lan0..lan3 gardent `optional: true` a juste titre : ce sont les ports
      # du switch, sans cable la plupart du temps.
      optional: false
      dhcp4-overrides:
        use-routes: true
        route-metric: 100
      # Static fallback so the box is always reachable at 192.168.1.200 even
      # when DHCP never leases (issue #913). Kept at a HIGHER route-metric than
      # the DHCP route (100) so the lease wins whenever it exists; the static
      # default only carries traffic when DHCP is down. This IP belongs on the
      # WAN (eth2), never on lan0 — secubox-wan-link-guard strips any parasite
      # copy that appears on lan0.
      addresses:
        - 192.168.1.200/24
      routes:
        - to: default
          via: 192.168.1.254
          metric: 200
    lan0: {optional: true}
    lan1: {optional: true}
    lan2: {optional: true}
    lan3: {optional: true}
  bridges:
    br-lxc:
      interfaces: []
      addresses: [10.100.0.1/24]
      optional: true
