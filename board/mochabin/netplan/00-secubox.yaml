# SecuBox MOCHAbin base network (router mode).
# WAN = eth2 (DHCP from upstream, e.g. Freebox), reliably the default route.
# lan0-3 = DSA switch ports (optional so a link-down port never wedges boot).
# br-lxc = LXC container bridge.
network:
  version: 2
  renderer: networkd
  ethernets:
    eth1:
      optional: true
    eth2:
      dhcp4: true
      dhcp6: false
      optional: true
      dhcp4-overrides:
        use-routes: true
        route-metric: 100
    lan0: {optional: true}
    lan1: {optional: true}
    lan2: {optional: true}
    lan3: {optional: true}
  bridges:
    br-lxc:
      interfaces: []
      addresses: [10.100.0.1/24]
      optional: true
