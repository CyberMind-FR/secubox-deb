# /etc/netplan/00-secubox.yaml — x64 Live (Bare Metal) — Bootstrap Config
# This is a minimal bootstrap configuration for real AMD64 hardware.
# secubox-net-detect.service will generate the proper config at first boot.
#
# Strategy: Enable DHCP on ALL detected Ethernet interfaces initially.
# secubox-net-detect will refine this to router mode (WAN + br-lan).
network:
  version: 2
  renderer: networkd

  ethernets:
    # Bootstrap: Enable DHCP on all ethernet interfaces for initial connectivity.
    # This ensures we get an IP regardless of interface naming (eno1, enp2s0, …).
    # After first boot, secubox-net-detect rewrites this with proper WAN/LAN split.
    #
    # WAN fallback (closes #370): the en*/eth* matches also carry a static
    # 192.168.1.55/24 + gw 192.168.1.254. systemd-networkd accepts DHCP
    # and static at the same time — DHCP routes use the configured low
    # metric (100 / 200), the static gets metric 1000, so DHCP wins when
    # available and the static keeps the appliance reachable when not.
    # Caveat: if multiple interfaces match the pattern, both will try to
    # take 192.168.1.55 and one will fail with address-in-use. In practice
    # bare-metal boxes have ONE primary NIC; multi-NIC operators run
    # net-detect to refine the layout anyway.

    eth-dhcp:
      match:
        name: "en*"
      dhcp4: true
      dhcp6: false
      dhcp4-overrides:
        use-dns: true
        use-routes: true
        route-metric: 100
      optional: true
      addresses: [192.168.1.55/24]
      nameservers:
        addresses: [1.1.1.1, 8.8.8.8]
      routes:
        - to: default
          via: 192.168.1.254
          metric: 1000

    eth-legacy:
      match:
        name: "eth*"
      dhcp4: true
      dhcp6: false
      dhcp4-overrides:
        use-dns: true
        use-routes: true
        route-metric: 200
      optional: true
      addresses: [192.168.1.55/24]
      nameservers:
        addresses: [1.1.1.1, 8.8.8.8]
      routes:
        - to: default
          via: 192.168.1.254
          metric: 1000

  bridges:
    # br-lan: Pre-defined but empty - secubox-net-detect populates interfaces
    br-lan:
      interfaces: []
      addresses:
        - 192.168.10.1/24
      dhcp4: false
      optional: true
      parameters:
        stp: false
        forward-delay: 0

# Note: At first boot, secubox-net-detect.service will:
# 1. Detect board type (x64-baremetal) and available interfaces
# 2. Determine WAN (first interface with link/DHCP response)
# 3. Assign remaining interfaces to br-lan
# 4. Rewrite this file with explicit interface names
#
# To force re-detection: rm /var/lib/secubox/.net-configured && reboot
