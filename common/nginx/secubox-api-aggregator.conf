# SecuBox-Deb :: route générique des API vers l'agrégateur (#1537)
#
# Incluse APRÈS secubox.d/*.conf dans le site « secubox » (443 et localhost:80).
# Sans elle, sur une box installée sans HAProxy, toute API agrégée
# (/api/v1/messagerie, sbxid, premier-pas…) tombait sur la page HTML de repli :
# le kiosque ne pouvait parler à aucun module. Un module qui a sa propre route
# dans secubox.d/ (préfixe plus long) garde la priorité.
location /api/ {
    proxy_pass http://unix:/run/secubox/aggregator.sock;
    include /etc/nginx/snippets/secubox-proxy.conf;
    # Les clients sont des XHR : l'amont rend déjà un JSON d'erreur correct.
    proxy_intercept_errors off;
}
