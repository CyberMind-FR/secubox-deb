# HALLS DU PARC (#1672) — les Halls des nœuds relayés par cette box (hall.gk3…),
# autorisés à ENCADRER ses services. Un vhost les ajoute à sa politique par
# `frame-ancestors … $sbx_halls_parc`. La liste est tenue par
# `secubox-halls-parc` (alimenté par secubox-relais-maillage) ; sans elle, la
# variable est vide et rien n'est élargi. Jamais de joker : *.secubox.in
# laisserait n'importe quel site publié encadrer les services.
map $host $sbx_halls_parc {
    include /var/lib/secubox/halls-parc/nginx.map*;
}
