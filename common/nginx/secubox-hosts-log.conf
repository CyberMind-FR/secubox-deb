# SecuBox — journal commun porte par le DOMAINE demande
#
# Nginx tient un journal par SITE (`<nom>_access.log`), pas par domaine. Un
# bloc server qui sert « anibal-amiot.com », « .fr » et « .net » ecrit donc
# tout dans un seul fichier nomme d'apres le site : impossible d'attribuer une
# visite a l'un des trois. Ce journal-ci ajoute `$host` en premier champ, ce
# qui rend chaque domaine identifiable.
#
# Il s'ajoute aux journaux existants, il ne les remplace pas.
#
# JAMAIS DE JETON EN CLAIR DANS UN JOURNAL (#3691). PeerTube passe son jeton
# d'acces dans l'URL de socket.io (`?accessToken=`), le Hall ses jetons d'acces
# (`?jeton=`) : la requete et le referent sont journalises avec la valeur de tout
# parametre dont le nom porte un secret (token, jeton, jwt, api_key, secret,
# password, auth, sig, session ; casse indifferente) remplacee par MASQUE. Trois
# passes : trois jetons dans une meme URL. Au-dela, et pour les journaux
# d'erreurs (aucun format ne s'y applique), secubox-masquer-jetons-journaux
# repasse toutes les heures. Limite connue : un nom encode en %XX n'est pas reconnu.
map $request $sbx_requete_1 {
    "~*^(.*?[?&;][A-Za-z0-9_.-]*(?:token|jeton|jwt|api_?key|secret|passw(?:or)?d|auth|sig|signature|session)=)(?!MASQUE)[^&;\s]+(.*)$" "$1MASQUE$2";
    default $request;
}
map $sbx_requete_1 $sbx_requete_2 {
    "~*^(.*?[?&;][A-Za-z0-9_.-]*(?:token|jeton|jwt|api_?key|secret|passw(?:or)?d|auth|sig|signature|session)=)(?!MASQUE)[^&;\s]+(.*)$" "$1MASQUE$2";
    default $sbx_requete_1;
}
map $sbx_requete_2 $sbx_requete {
    "~*^(.*?[?&;][A-Za-z0-9_.-]*(?:token|jeton|jwt|api_?key|secret|passw(?:or)?d|auth|sig|signature|session)=)(?!MASQUE)[^&;\s]+(.*)$" "$1MASQUE$2";
    default $sbx_requete_2;
}
map $http_referer $sbx_referent_1 {
    "~*^(.*?[?&;][A-Za-z0-9_.-]*(?:token|jeton|jwt|api_?key|secret|passw(?:or)?d|auth|sig|signature|session)=)(?!MASQUE)[^&;\s]+(.*)$" "$1MASQUE$2";
    default $http_referer;
}
map $sbx_referent_1 $sbx_referent {
    "~*^(.*?[?&;][A-Za-z0-9_.-]*(?:token|jeton|jwt|api_?key|secret|passw(?:or)?d|auth|sig|signature|session)=)(?!MASQUE)[^&;\s]+(.*)$" "$1MASQUE$2";
    default $sbx_referent_1;
}

log_format sbx_host '$host $remote_addr - - [$time_local] "$sbx_requete" '
                    '$status $body_bytes_sent "$sbx_referent" "$http_user_agent"';

# Le format « combined » de nginx, jetons masques : pour les journaux propres a
# un site dont les URL portent un jeton (PeerTube).
log_format sbx_masque '$remote_addr - $remote_user [$time_local] "$sbx_requete" '
                      '$status $body_bytes_sent "$sbx_referent" "$http_user_agent"';

access_log /var/log/nginx/secubox-hosts.log sbx_host;
