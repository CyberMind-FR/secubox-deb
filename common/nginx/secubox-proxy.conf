# /etc/nginx/snippets/secubox-proxy.conf
# Paramètres communs pour tous les proxies vers les sockets Unix SecuBox

proxy_http_version 1.1;
proxy_set_header   Host              $host;
proxy_set_header   X-Real-IP         $remote_addr;
proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header   X-Forwarded-Proto $scheme;
proxy_set_header   Connection        "";

proxy_read_timeout    300s;
proxy_connect_timeout 5s;
proxy_send_timeout    30s;

proxy_buffering    off;
proxy_cache        off;

# Passer le header Authorization pour JWT
proxy_set_header   Authorization     $http_authorization;

# VERDICT LAN POUR LA LECTURE GARDEE (#1256).
#
# La ligne qui transmet le verdict n'est PAS ici : elle est ajoutee par le
# postinst de secubox-core, et seulement si nginx l'accepte.
#
# POURQUOI. Elle vaut `proxy_set_header X-SecuBox-LAN $lan_client;`, et
# `$lan_client` est defini par conf.d/secubox-lan-geo.conf, livre par
# secubox-hub — qui depend de secubox-core, donc core ne peut pas dependre de
# hub en retour. Sur une board sans ce fichier, `nginx -t` echouerait sur une
# variable inconnue et casserait TOUTE la configuration nginx, pas seulement
# la lecture gardee.
#
# Le postinst ajoute donc la ligne, teste, et la retire si le test echoue.
# Sans elle, secubox_core.auth.require_lecture ne voit aucune marque LAN et
# exige un jeton : le mode tableau de bord ne s'applique pas. C'est le bon
# sens de panne — on perd un affichage, pas une barriere.

# Some upstream FastAPI services also emit CORS headers via CORSMiddleware.
# Strip them here so nginx is the sole authority — otherwise browsers see
# `Access-Control-Allow-Origin: *, *` and reject cross-origin requests.
proxy_hide_header  Access-Control-Allow-Origin;
proxy_hide_header  Access-Control-Allow-Methods;
proxy_hide_header  Access-Control-Allow-Headers;
proxy_hide_header  Access-Control-Allow-Credentials;
proxy_hide_header  Access-Control-Max-Age;
proxy_hide_header  Access-Control-Expose-Headers;

# CORS headers for cross-origin requests
add_header Access-Control-Allow-Origin '*' always;
add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
add_header Access-Control-Allow-Headers 'Authorization, Content-Type, Accept' always;
add_header Access-Control-Max-Age 86400 always;

# Handle preflight OPTIONS requests
if ($request_method = 'OPTIONS') {
    add_header Access-Control-Allow-Origin '*';
    add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS';
    add_header Access-Control-Allow-Headers 'Authorization, Content-Type, Accept';
    add_header Access-Control-Max-Age 86400;
    add_header Content-Length 0;
    add_header Content-Type text/plain;
    return 204;
}
