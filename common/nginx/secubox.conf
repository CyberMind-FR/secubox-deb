# /etc/nginx/sites-available/secubox
# SecuBox Modular Nginx Configuration
# Each module drops its config in /etc/nginx/secubox.d/*.conf

# ── HTTPS Frontend ─────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name secubox.local _;

    ssl_certificate     /etc/secubox/tls/cert.pem;
    ssl_certificate_key /etc/secubox/tls/key.pem;
    ssl_protocols       TLSv1.3 TLSv1.2;
    ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # ── Static files (htdocs from modules) ──
    root /usr/share/secubox/www;
    index index.html;

    # ── Styled error pages (SecuBox charter) ──
    error_page 500 502 503 504 /errors/50x.html;
    location = /errors/50x.html { internal; alias /usr/share/secubox-core/www/50x.html; default_type text/html; }

    # LE HALL EST LA PORTE D'ENTREE (#1294).
    #
    # Correspondance EXACTE : prime sur le `location /` prefixe ci-dessous,
    # mais ne capture QUE la racine nue. Les chemins profonds restent servis.
    #
    # DEUX FORMES DU HALL COEXISTENT : secubox-webos le sert sous /hall/,
    # SBX OS (la meme chose en PWA) sous /sbxos/. On TESTE la presence du
    # repertoire au lieu de rediriger en aveugle : sur une image ou seul
    # SBX OS est installe, /hall/ n'existe pas et une redirection fixe
    # rendrait un 404 la ou du contenu existe.
    #
    # `if` est a manier avec precaution dans nginx ; `return` est l'une des
    # deux seules directives sures a l'interieur (avec `rewrite ... last`).
    #
    # 302 et non 301 : le choix de la page d'accueil est une decision de
    # produit. Un 301 serait mis en cache dur par les navigateurs et
    # survivrait a un changement d'avis.
    location = / {
        if (-d /usr/share/secubox/www/hall)  { return 302 /hall/;  }
        if (-d /usr/share/secubox/www/sbxos) { return 302 /sbxos/; }
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, immutable";
    }

    # ── Modular API endpoints ──
    # Each module installs its own snippet in /etc/nginx/secubox.d/
    include /etc/nginx/secubox.d/*.conf;

    # ── Health check (no auth) ──
    location /health {
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }
}

# ── HTTP Server (fallback for kiosk/local access) ──────────────────
# For localhost/kiosk, serve content directly without redirect
# External access on port 80 redirects to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name localhost 127.0.0.1 192.168.255.1;

    root /usr/share/secubox/www;
    index index.html;

    # ── Styled error pages (SecuBox charter) ──
    error_page 500 502 503 504 /errors/50x.html;
    location = /errors/50x.html { internal; alias /usr/share/secubox-core/www/50x.html; default_type text/html; }

    # LE HALL EST LA PORTE D'ENTREE (#1294).
    #
    # Correspondance EXACTE : prime sur le `location /` prefixe ci-dessous,
    # mais ne capture QUE la racine nue. Les chemins profonds restent servis.
    #
    # DEUX FORMES DU HALL COEXISTENT : secubox-webos le sert sous /hall/,
    # SBX OS (la meme chose en PWA) sous /sbxos/. On TESTE la presence du
    # repertoire au lieu de rediriger en aveugle : sur une image ou seul
    # SBX OS est installe, /hall/ n'existe pas et une redirection fixe
    # rendrait un 404 la ou du contenu existe.
    #
    # `if` est a manier avec precaution dans nginx ; `return` est l'une des
    # deux seules directives sures a l'interieur (avec `rewrite ... last`).
    #
    # 302 et non 301 : le choix de la page d'accueil est une decision de
    # produit. Un 301 serait mis en cache dur par les navigateurs et
    # survivrait a un changement d'avis.
    location = / {
        if (-d /usr/share/secubox/www/hall)  { return 302 /hall/;  }
        if (-d /usr/share/secubox/www/sbxos) { return 302 /sbxos/; }
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Modular API endpoints (same as HTTPS)
    include /etc/nginx/secubox.d/*.conf;

    # Health check
    location /health {
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }
}

# ── Redirect other HTTP → HTTPS ────────────────────────────────────
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}
