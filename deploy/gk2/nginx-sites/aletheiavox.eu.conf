# aletheiavox.eu — apex metablog site (servi sur :8900, fronté par HAProxy/WAF TLS)
#
# Calqué sur ganimed.fr.conf. Le contenu est celui du site `aletheia`, déjà
# servi sous aletheia.gk2.secubox.in : un seul répertoire, deux domaines — pas
# de copie, qui divergerait.
#
# Ce fichier est maintenu à la main et non généré : il porte le point ACME et
# la redirection www, que le bloc généré par MetaBlogizer n'a pas. Depuis
# #1016, le générateur s'efface explicitement devant un domaine déjà servi ici,
# au lieu de dépendre de l'ordre alphabétique des noms de fichiers.
server {
    include snippets/secubox-errorpages.conf;
    listen 0.0.0.0:8900;
    server_name aletheiavox.eu;
    root /srv/metablogizer/sites/aletheia/public;
    index index.html index.htm;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; default_type text/plain; }
    location / { try_files $uri $uri/ /index.html; }
    access_log /var/log/nginx/aletheiavox.eu_access.log;
    access_log /var/log/nginx/secubox-hosts.log sbx_host;
    error_log  /var/log/nginx/aletheiavox.eu_error.log;
}

# www.aletheiavox.eu → 301 → apex (canonique). Le point ACME reste ouvert pour
# le renouvellement du certificat, qui porte les deux noms.
server {
    include snippets/secubox-errorpages.conf;
    listen 0.0.0.0:8900;
    server_name www.aletheiavox.eu;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; default_type text/plain; }
    location / { return 301 https://aletheiavox.eu$request_uri; }
    access_log /var/log/nginx/aletheiavox.eu_access.log;
    access_log /var/log/nginx/secubox-hosts.log sbx_host;
}
