# Fichier MAINTENU À LA MAIN — prioritaire sur le bloc généré metablogizer
# (chargé avant « metablogizer » dans l'ordre alphabétique ; noms_pris_ailleurs
# le respecte à la régénération). anibal-amiot.COM canonique ; les autres
# domaines et l'ancienne URL redirigent en 301 (demande auteur, 2026-08-21).

# --- Canonique : anibal-amiot.com sert le contenu ---
server {
    listen 0.0.0.0:8900;
    server_name anibal-amiot.com;
    # HSTS — la chaîne HTTP→HTTPS est en place (HAProxy redirige, cert LE valide) ;
    # le navigateur n'atteint ce backend qu'en HTTPS. 6 mois pour commencer ;
    # escalade possible (includeSubDomains une fois www confirmé, puis preload).
    add_header Strict-Transport-Security "max-age=15768000" always;
    root /srv/metablogizer/sites/anibal-amiot/public;
    index index.html;

    # 301 de l'ancienne URL vers l'accueil.
    location = /tirage-livree-hermes.html { return 301 /; }

    # Redirections serveur (ex-.htaccess, inopérant sous nginx) — demande auteur.
    location = "/motifs (4).html" { return 301 /creation-motifs-yi-king.html; }
    location = /pages.html        { return 301 /fonds-ecran.html; }
    location = /index.html {
        # /index.html explicite (requête client) → /. On teste $request_uri
        # (l'URI d'origine, inchangée sur redirection interne) pour NE PAS
        # attraper le fallback interne de `/` (try_files/index → /index.html),
        # qui doit servir l'accueil, pas boucler.
        if ($request_uri ~ "^/index\.html($|\?)") { return 301 /; }
        try_files /index.html =404;
    }

    location ~ /\. { deny all; return 404; }
    location ~* (?:\.(?:bak|old|orig|save|swp|tmp)(?:[-._][^/]*)?|\.pre[-0-9][^/]*|~)$ { deny all; return 404; }
    location / { try_files $uri $uri/ /index.html; }
}

# --- Les autres domaines redirigent en 301 vers le canonique ---
server {
    listen 0.0.0.0:8900;
    server_name anibal-amiot.fr www.anibal-amiot.fr
                anibal-amiot.net www.anibal-amiot.net
                www.anibal-amiot.com;
    return 301 https://anibal-amiot.com$request_uri;
}
