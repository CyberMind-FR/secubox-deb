# Transition Companion 1.x -> 2.0 (#3683) : l'ancienne PWA servie ici (/data/companion/www, avec son proxy d'API)
# n'existe plus. L'APK, version.json et la page d'association sont livrés par le paquet secubox-companion sur le vhost
# d'administration : https://admin.gk2.secubox.in/companion/. Les anciennes URL y sont redirigées.
# À retirer, avec l'entrée HAProxy, une fois les installations 1.x mises à jour.
server {
    listen 9080;
    server_name companion.gk2.secubox.in;
    add_header X-Content-Type-Options nosniff always;
    location / { return 301 https://admin.gk2.secubox.in/companion/; }
}
