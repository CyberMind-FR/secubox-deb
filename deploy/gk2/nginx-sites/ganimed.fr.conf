# ganimed.fr — apex metablog site (served on :8900, fronted by HAProxy/WAF TLS)
server {
    include snippets/secubox-errorpages.conf;
    listen 0.0.0.0:8900;
    server_name ganimed.fr;
    root /srv/metablogizer/sites/ganimed;
    index index.html index.htm;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; default_type text/plain; }
    location / { try_files $uri $uri/ /index.html; }
    access_log /var/log/nginx/ganimed.fr_access.log;
    access_log /var/log/nginx/secubox-hosts.log sbx_host;
    error_log  /var/log/nginx/ganimed.fr_error.log;
}

# www.ganimed.fr → 301 → apex (canonical). ACME challenge kept for cert renewals.
server {
    include snippets/secubox-errorpages.conf;
    listen 0.0.0.0:8900;
    server_name www.ganimed.fr;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; default_type text/plain; }
    location / { return 301 https://ganimed.fr$request_uri; }
    access_log /var/log/nginx/ganimed.fr_access.log;
    access_log /var/log/nginx/secubox-hosts.log sbx_host;
}
