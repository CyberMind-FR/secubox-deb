<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" role="img" aria-labelledby="t d">
  <title id="t">SecuBox OS — bannière</title>
  <desc id="d">Œil à six anneaux (AUTH, WALL, BOOT, MIND, ROOT, MESH), titre SecuBox OS, chiffres clés et état.</desc>
  <defs>
    <!-- Palette de la vue maître (jetons sbx) -->
    <linearGradient id="fond" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070C1C"/>
      <stop offset="55%" stop-color="#0A1226"/>
      <stop offset="100%" stop-color="#070C1C"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <!-- Six piles -->
    <linearGradient id="auth" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#FF8C00"/><stop offset="100%" stop-color="#FF6600"/></linearGradient>
    <linearGradient id="wall" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#FFD700"/><stop offset="100%" stop-color="#FFAA00"/></linearGradient>
    <linearGradient id="boot" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#E63946"/><stop offset="100%" stop-color="#C51D2A"/></linearGradient>
    <linearGradient id="mind" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#9370DB"/><stop offset="100%" stop-color="#6E40C9"/></linearGradient>
    <linearGradient id="root" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#4ADE80"/><stop offset="100%" stop-color="#16A34A"/></linearGradient>
    <linearGradient id="mesh" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#60A5FA"/><stop offset="100%" stop-color="#2563EB"/></linearGradient>
    <filter id="lueur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="flou"/>
      <feMerge><feMergeNode in="flou"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grille" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1B2745" stroke-width=".6"/>
    </pattern>
  </defs>

  <!-- Fond, grille, halo -->
  <rect width="800" height="200" rx="16" fill="url(#fond)"/>
  <rect width="800" height="200" rx="16" fill="url(#grille)" opacity=".55"/>
  <ellipse cx="400" cy="100" rx="300" ry="110" fill="url(#halo)"/>
  <rect x=".5" y=".5" width="799" height="199" rx="16" fill="none" stroke="#243457"/>

  <!-- Œil gauche : six anneaux -->
  <g transform="translate(104 100)">
    <circle r="78" fill="none" stroke="url(#mesh)" stroke-width="4" opacity=".9"/>
    <circle r="67" fill="none" stroke="url(#root)" stroke-width="4" opacity=".9"/>
    <circle r="56" fill="none" stroke="url(#mind)" stroke-width="4" opacity=".9"/>
    <circle r="45" fill="none" stroke="url(#boot)" stroke-width="4" opacity=".9"/>
    <circle r="34" fill="none" stroke="url(#wall)" stroke-width="4" opacity=".9"/>
    <circle r="23" fill="none" stroke="url(#auth)" stroke-width="4" opacity=".9"/>
    <circle r="14" fill="#60A5FA" filter="url(#lueur)"/>
    <circle r="7.5" fill="#070C1C"/>
    <circle r="3.5" fill="#E8EEFB"/>
  </g>

  <!-- Titre -->
  <g transform="translate(400 52)" text-anchor="middle">
    <text y="0" fill="#E8EEFB" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="34" font-weight="700" letter-spacing="-.5" filter="url(#lueur)">SecuBox OS</text>
    <text y="24" fill="#8A9BC3" font-family="Inter, system-ui, sans-serif" font-size="13">Appliance de sécurité réseau souveraine · cible ANSSI CSPN</text>
  </g>

  <!-- Chiffres clés -->
  <g transform="translate(400 112)" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">
    <g transform="translate(-150 0)">
      <rect x="-46" y="-16" width="92" height="56" rx="12" fill="#0F1830" stroke="#243457"/>
      <text y="6" fill="#4ADE80" font-size="22" font-weight="700">1 203</text>
      <text y="26" fill="#8A9BC3" font-size="9" letter-spacing="1.2">PAQUETS</text>
    </g>
    <g transform="translate(-50 0)">
      <rect x="-46" y="-16" width="92" height="56" rx="12" fill="#0F1830" stroke="#243457"/>
      <text y="6" fill="#60A5FA" font-size="22" font-weight="700">118</text>
      <text y="26" fill="#8A9BC3" font-size="9" letter-spacing="1.2">MODULES</text>
    </g>
    <g transform="translate(50 0)">
      <rect x="-46" y="-16" width="92" height="56" rx="12" fill="#0F1830" stroke="#243457"/>
      <text y="6" fill="#FBBF24" font-size="18" font-weight="700">TLS 1.3</text>
      <text y="26" fill="#8A9BC3" font-size="9" letter-spacing="1.2">WAF · NFT</text>
    </g>
    <g transform="translate(150 0)">
      <rect x="-46" y="-16" width="92" height="56" rx="12" fill="#0F1830" stroke="#243457"/>
      <text y="6" fill="#C084FC" font-size="15" font-weight="700">3.0.0-α18</text>
      <text y="26" fill="#8A9BC3" font-size="9" letter-spacing="1.2">VERSION</text>
    </g>
  </g>

  <!-- Œil droit : état -->
  <g transform="translate(696 100)">
    <circle r="56" fill="none" stroke="url(#mesh)" stroke-width="3" opacity=".7" stroke-dasharray="15 5"/>
    <circle r="45" fill="none" stroke="url(#root)" stroke-width="3" opacity=".7" stroke-dasharray="12 4"/>
    <circle r="34" fill="none" stroke="url(#mind)" stroke-width="3" opacity=".7" stroke-dasharray="10 3"/>
    <circle r="24" fill="none" stroke="url(#wall)" stroke-width="3" opacity=".7"/>
    <circle r="15" fill="#4ADE80" filter="url(#lueur)"/>
    <text y="4" fill="#0F2E24" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" font-weight="700" text-anchor="middle">OK</text>
  </g>

  <!-- Légende des six piles -->
  <g transform="translate(400 182)" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9" fill="#8A9BC3" letter-spacing=".8">
    <g transform="translate(-180 0)"><circle r="4.5" fill="#FF8C00"/><text x="10" y="3.5">AUTH</text></g>
    <g transform="translate(-120 0)"><circle r="4.5" fill="#FFD700"/><text x="10" y="3.5">WALL</text></g>
    <g transform="translate(-60 0)"><circle r="4.5" fill="#E63946"/><text x="10" y="3.5">BOOT</text></g>
    <g transform="translate(0 0)"><circle r="4.5" fill="#9370DB"/><text x="10" y="3.5">MIND</text></g>
    <g transform="translate(60 0)"><circle r="4.5" fill="#4ADE80"/><text x="10" y="3.5">ROOT</text></g>
    <g transform="translate(120 0)"><circle r="4.5" fill="#60A5FA"/><text x="10" y="3.5">MESH</text></g>
  </g>

  <text x="788" y="190" fill="#8A9BC3" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="8" text-anchor="end" opacity=".7">CyberMind © 2026</text>
</svg>
