<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc"><title id="title">Flux de démarrage AMD64</title><desc id="desc">UEFI charge GRUB, puis SecuBox, firstboot, le réseau et SBXOS.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#00d4ff"/></marker><style>text{font-family:Arial,sans-serif;fill:#e8e6d9}.t{font-size:18px;font-weight:bold}.s{font-size:13px;fill:#a9abb7}.b{fill:#151520;stroke:#00d4ff;stroke-width:2}.l{stroke:#00d4ff;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1200" height="330" fill="#0a0a0f"/><text x="600" y="42" text-anchor="middle" class="t" fill="#c9a84c">Démarrage SecuBox AMD64</text><g><rect x="35" y="120" width="150" height="88" rx="10" class="b"/><rect x="260" y="120" width="150" height="88" rx="10" class="b"/><rect x="485" y="120" width="150" height="88" rx="10" class="b"/><rect x="710" y="120" width="150" height="88" rx="10" class="b"/><rect x="935" y="120" width="220" height="88" rx="10" class="b"/></g><g class="l"><path d="M185 164H250"/><path d="M410 164H475"/><path d="M635 164H700"/><path d="M860 164H925"/></g><g text-anchor="middle"><text x="110" y="154" class="t">UEFI x64</text><text x="110" y="178" class="s">firmware</text><text x="335" y="154" class="t">GRUB</text><text x="335" y="178" class="s">entrée SecuBox</text><text x="560" y="154" class="t">Système</text><text x="560" y="178" class="s">Debian / nftables</text><text x="785" y="154" class="t">First boot</text><text x="785" y="178" class="s">identité, TLS, réseau</text><text x="1045" y="154" class="t">SBXOS</text><text x="1045" y="178" class="s">frontal et services</text></g><text x="600" y="275" text-anchor="middle" class="s">Premier démarrage : modifier les identifiants, vérifier TLS et créer la baseline.</text></svg>
