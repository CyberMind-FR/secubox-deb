  <path d="M600 305V355" class="line"/><rect x="450" y="365" width="300" height="70" rx="12" fill="#33202a" stroke="#e63946" class="box"/><text x="600" y="407" text-anchor="middle" class="label">SBXWAF</text>
  <path d="M600 435V485" class="line"/><rect x="420" y="495" width="360" height="76" rx="12" fill="#1f3030" stroke="#00ff41" class="box"/><text x="600" y="530" text-anchor="middle" class="label">SBXOS Hall</text><text x="600" y="553" text-anchor="middle" class="sub">distribution contrôlée des modules</text>
  <path d="M600 571V610 M120 610H1080" stroke="#00d4ff" stroke-width="3" fill="none"/><g fill="#151520" stroke="#6e40c9" stroke-width="2"><rect x="50" y="630" width="140" height="72" rx="10"/><rect x="245" y="630" width="140" height="72" rx="10"/><rect x="440" y="630" width="140" height="72" rx="10"/><rect x="635" y="630" width="140" height="72" rx="10"/><rect x="830" y="630" width="140" height="72" rx="10"/><rect x="1025" y="630" width="140" height="72" rx="10"/></g><g class="line"><path d="M120 610V630"/><path d="M315 610V630"/><path d="M510 610V630"/><path d="M705 610V630"/><path d="M900 610V630"/><path d="M1095 610V630"/></g><g class="label" text-anchor="middle"><text x="120" y="673">Nextcloud</text><text x="315" y="673">Mail</text><text x="510" y="673">Radio</text><text x="705" y="673">BBS</text><text x="900" y="673">PeerTube</text><text x="1095" y="673">API</text></g>
