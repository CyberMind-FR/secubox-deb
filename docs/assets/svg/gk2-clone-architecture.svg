<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Architecture GK2 Clone</title><desc id="desc">Internet traverse HAProxy et SBXWAF vers SBXOS Hall, qui distribue six services.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#00d4ff"/></marker><style>text{font-family:Arial,sans-serif;fill:#e8e6d9}.label{font-size:24px;font-weight:700}.sub{font-size:15px;fill:#a9abb7}.box{stroke-width:2}.line{stroke:#00d4ff;stroke-width:3;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1200" height="760" fill="#0a0a0f"/><text x="600" y="48" text-anchor="middle" class="label" fill="#c9a84c">SecuBox-DEB — GK2 Clone</text><text x="600" y="76" text-anchor="middle" class="sub">Chaîne logique de publication et de services</text>
  <rect x="450" y="105" width="300" height="70" rx="12" fill="#182433" stroke="#00d4ff" class="box"/><text x="600" y="147" text-anchor="middle" class="label">Internet</text>
