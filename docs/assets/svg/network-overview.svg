<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc"><title id="title">Vue réseau GK2 Clone</title><desc id="desc">Poste hôte, NAT VirtualBox, SecuBox et réseaux optionnels de laboratoire.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#00d4ff"/></marker><style>text{font-family:Arial,sans-serif;fill:#e8e6d9}.t{font-size:20px;font-weight:bold}.s{font-size:14px;fill:#a9abb7}.box{fill:#151520;stroke:#00d4ff;stroke-width:2}.opt{fill:#1f1a30;stroke:#6e40c9;stroke-width:2}.line{stroke:#00d4ff;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect width="1200" height="500" fill="#0a0a0f"/><text x="600" y="42" text-anchor="middle" class="t" fill="#c9a84c">Vue réseau — GK2 Clone AMD64</text><rect x="55" y="175" width="220" height="135" rx="12" class="box"/><text x="165" y="215" text-anchor="middle" class="t">Poste hôte</text><text x="165" y="246" text-anchor="middle" class="s">Navigateur / SSH</text><text x="165" y="273" text-anchor="middle" class="s">localhost:9443 · :2222</text><rect x="420" y="175" width="220" height="135" rx="12" class="box"/><text x="530" y="215" text-anchor="middle" class="t">NAT</text><text x="530" y="246" text-anchor="middle" class="s">VirtualBox / libvirt</text><text x="530" y="273" text-anchor="middle" class="s">2222→22 · 9443→443</text><rect x="785" y="145" width="290" height="195" rx="12" class="box"/><text x="930" y="190" text-anchor="middle" class="t">SecuBox GK2 Clone</text><text x="930" y="221" text-anchor="middle" class="s">WAN VirtIO · firewall nftables</text><text x="930" y="248" text-anchor="middle" class="s">HAProxy / SBXWAF / SBXOS</text><text x="930" y="286" text-anchor="middle" class="s">HTTPS:443 · SSH:22</text><path d="M275 242H410" class="line"/><path d="M640 242H775" class="line"/><rect x="835" y="385" width="190" height="70" rx="10" class="opt"/><text x="930" y="414" text-anchor="middle" class="t">LAN laboratoire</text><text x="930" y="438" text-anchor="middle" class="s">Host-only / bridge</text><path d="M930 340V375" class="line"/><text x="600" y="105" text-anchor="middle" class="s">Mode recommandé : NAT pour le bootstrap ; bridge seulement après sécurisation.</text></svg>
