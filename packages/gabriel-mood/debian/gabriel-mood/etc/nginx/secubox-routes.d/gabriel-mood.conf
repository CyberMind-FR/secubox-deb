# /etc/nginx/secubox-routes.d/gabriel-mood.conf
#
# `secubox-routes.d` et PAS `secubox.d` : seul le premier est inclus par les
# vhosts. Un fragment déposé dans le second n'est jamais lu, et l'on cherche
# longtemps pourquoi une route « pourtant installée » rend 404.

location /gabriel-mood/ {
    alias /usr/share/secubox/www/gabriel-mood/;
    try_files $uri $uri/ /gabriel-mood/index.html;

    # LE MICRO EST UNE PERMISSION, ET ELLE SE DÉCLARE. Sans `microphone=(self)`,
    # une page encadrée ne peut pas l'obtenir : le navigateur refuse avant même
    # de demander à l'utilisateur, et l'on croit à un bug de code.
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'self' https://hall.gk2.secubox.in https://hall.gk2.net; base-uri 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
}

location /api/mood {
    proxy_pass http://unix:/run/secubox/gabriel-mood.sock:/api/mood;
    include /etc/nginx/snippets/secubox-proxy.conf;
}

location /ws/mood {
    # ON N'INCLUT PAS `secubox-proxy.conf` ICI, ET C'EST DÉLIBÉRÉ.
    #
    # Ce snippet pose `proxy_http_version 1.1` — donc une redéclaration ici est
    # un doublon que nginx refuse — mais surtout il pose
    # `proxy_set_header Connection ""`, ce qui est exactement le CONTRAIRE de
    # ce qu'une WebSocket demande. Inclure le snippet puis « corriger » par
    # dessus donnerait une configuration qui se contredit à la lecture, et dont
    # le comportement dépendrait de l'ordre. On écrit donc ce dont on a besoin,
    # en toutes lettres.
    proxy_pass http://unix:/run/secubox/gabriel-mood.sock:/ws/mood;
    proxy_http_version 1.1;

    # `Upgrade` et `Connection` sont des en-têtes « hop-by-hop » : nginx les
    # retire d'office, et sans ces deux lignes la négociation échoue en 400
    # sans rien expliquer.
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization     $http_authorization;

    # Le flux dure aussi longtemps que la personne parle. Le délai par défaut
    # (60 s) couperait toute session restée silencieuse plus d'une minute.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}
