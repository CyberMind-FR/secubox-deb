# VHOST DÉDIÉ : mood.gk2.secubox.in
#
# POURQUOI IL EN FAUT UN. Le micro, dans une iframe, exige une chaîne de
# délégation complète : le document parent doit déléguer la permission
# (`allow="microphone"` sur l'iframe ET son propre `Permissions-Policy`), et le
# document encadré doit l'autoriser pour SON origine. Servi sous un préfixe de
# l'admin, ce module partageait l'origine du panneau — dont la politique n'a
# aucune raison de parler du micro. Une origine à lui rend la chaîne lisible et
# la permission révocable d'un seul endroit.
#
# C'est aussi le motif /micro–/mega du Hall : la carte encadre `/micro.html`,
# l'agrandissement ouvre `/` sur ce même hôte. Les deux se synchronisent par
# `BroadcastChannel`, ce qui n'est possible qu'entre documents de MÊME ORIGINE
# — donc servis par ce vhost, tous les deux.
server {
    listen 9080;
    server_name mood.gk2.secubox.in;

    # HTTPS PARTOUT. Ce vhost est servi en direct par nginx, hors des vhosts
    # gérés par haproxyctl : il n'hérite pas de la redirection clair→TLS de
    # HAProxy. L'ACME est intercepté en amont et n'atteint jamais ce bloc.
    if ($http_x_forwarded_proto = "http") { return 301 https://$host$request_uri; }

    # ET SURTOUT : `getUserMedia` N'EXISTE PAS HORS CONTEXTE SÉCURISÉ. En
    # clair, l'API est simplement absente de l'objet `navigator` — le bouton
    # « écouter » échouerait sur un « undefined » incompréhensible plutôt que
    # sur un refus explicite.

    include /etc/nginx/snippets/exposure/mood.gk2.secubox.in.conf;

    root /usr/share/secubox/www/gabriel-mood;
    index index.html;

    # LA PERMISSION DU MICRO, DÉCLARÉE. Sans cette ligne, une page encadrée ne
    # peut pas l'obtenir : le navigateur refuse AVANT même de demander à
    # l'utilisateur, et l'on croit à un bug de code.
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=(), interest-cohort=()" always;
    # `frame-ancestors` nomme le Hall et lui seul : c'est CE côté-ci qui décide
    # qui peut l'encadrer.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'self' https://hall.gk2.secubox.in https://hall.gk2.net; base-uri 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://unix:/run/secubox/gabriel-mood.sock:/api/;
        include /etc/nginx/snippets/secubox-proxy.conf;
    }

    location /ws/mood {
        # ON N'INCLUT PAS `secubox-proxy.conf` : il pose `proxy_http_version`
        # (doublon refusé par nginx) et surtout `Connection ""`, l'exact
        # contraire de ce qu'une WebSocket demande.
        proxy_pass http://unix:/run/secubox/gabriel-mood.sock:/ws/mood;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Le flux dure tant que la personne parle ; le défaut de 60 s couperait
        # toute session silencieuse plus d'une minute.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
