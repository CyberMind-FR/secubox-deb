# debian/secubox.yaml — fiche de ce module pour l'App Store.
# SANS CE FICHIER, LE MODULE N'EXISTE PAS POUR L'APP STORE : le catalogue est
# généré à la construction en parcourant les secubox.yaml du monorepo.

name: gabriel-mood
category: analysis
tier: lite
description: "SecuBox — indices prosodiques de la voix, analyses localement (Gabriel Mood)"

# LA DESCRIPTION LONGUE DIT CE QUE LE MODULE NE FAIT PAS, et c'est délibéré :
# une fiche d'App Store se lit avant d'installer, c'est-à-dire au seul moment
# où l'on décide. « Détecteur d'humeur » laisserait croire à un diagnostic.
description_longue: |
  Mesure ce qu'une voix fait entendre — hauteur, énergie, débit, irrégularité,
  couleur spectrale — et n'en tire que des INDICES.

  Il ne lit pas les émotions. Les grandeurs mesurées suivent l'activation (on
  parle plus haut, plus fort et plus vite quand on est activé, quelle qu'en
  soit la cause) ; rien dans le signal ne distingue de façon fiable la joie de
  la colère. La confiance affichée est plafonnée, et aucun état n'est affirmé
  tant que le module n'a pas appris VOTRE ordinaire.

  À n'utiliser ni pour évaluer quelqu'un, ni pour décider quoi que ce soit le
  concernant.

  Le micro est celui de votre navigateur. L'audio traverse le réseau local,
  est analysé sur la box, et disparaît : aucun échantillon n'est écrit sur le
  disque, et le service ne peut techniquement pas ouvrir de connexion réseau.

# Aucune dépendance SecuBox : le module est autonome (Go pur, socket unix).
# `nginx` est une recommandation, pas une exigence — l'API répond sans lui.
depends: []
