# SecuBox :: Accès — route d'API montée dans les vhosts qui incluent secubox.d.
#
# LES DEUX SURFACES SONT SÉPARÉES EN DEUX `location`, et ce n'est pas cosmétique.
# `/invitation/` et `/session/` sont OUVERTES — un inconnu doit pouvoir les
# atteindre, c'est tout le propos. `/file/` et `/profils/` sont la surface
# d'administration. Les monter par un seul préfixe `/api/v1/acces/` exposerait
# les secondes partout où l'on veut les premières.
location /api/v1/acces/invitation/ {
    proxy_pass http://unix:/run/secubox/aggregator.sock:/api/v1/acces/invitation/;
    proxy_set_header Host $host;
    # Le QR encode l'URL par laquelle la requête est ARRIVÉE.
    proxy_set_header X-Forwarded-Host $host;
    # Monté dans un vhost PARTAGÉ : la page est sous /acces/, pas à la racine.
    proxy_set_header X-Acces-Racine /acces/;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Une demande d'accès tient en quelques centaines d'octets.
    client_max_body_size 16k;
}

location /api/v1/acces/session/ {
    proxy_pass http://unix:/run/secubox/aggregator.sock:/api/v1/acces/session/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 8k;
}

location /api/v1/acces/ {
    proxy_pass http://unix:/run/secubox/aggregator.sock:/api/v1/acces/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 16k;
}

location /acces/ {
    alias /usr/share/secubox/www/acces/;
    index index.html;
    # Une extension de fichier dit « je veux CE fichier ». Sans cette borne, un
    # fichier absent repartirait en index.html avec un 200 — et une page HTML
    # servie à la place d'un script se diagnostique très mal.
    try_files $uri $uri/ =404;
}
