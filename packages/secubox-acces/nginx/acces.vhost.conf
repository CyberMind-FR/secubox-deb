# SecuBox :: ACCÈS — vhost dédié (#1344).
#
# POURQUOI UN VHOST À PART. Le parcours d'admission vivait sous le panneau
# d'administration, c'est-à-dire derrière une porte que le demandeur n'a par
# définition pas encore franchie. On donnait donc à un inconnu l'adresse d'un
# panneau d'admin — ce qui se lit mal, et ce qui expose une surface qui n'a rien
# à faire là.
#
# Ici, la page est SERVIE EN STATIQUE et seule l'API passe par le socket : le
# formulaire s'ouvre même si le service dort, et dit alors ce qu'il en est.
server {
    listen 9080;
    server_name acces.gk2.secubox.in;

    location ^~ /.well-known/acme-challenge/ { root /usr/share/secubox/www; try_files $uri =404; }

    # LES DEUX SURFACES SONT SÉPARÉES, et sur ce vhost c'est vital : il est
    # ouvert aux inconnus. `/invitation/` et `/session/` doivent l'être ;
    # `/file/` et `/profils/` sont la surface d'administration et restent
    # protégées par le jeton — mais on ne les monte QUE parce que
    # l'administrateur peut vouloir trancher depuis cette page.
    location /api/v1/acces/ {
        proxy_pass http://unix:/run/secubox/acces.sock:/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Le QR encode l'URL par laquelle la requête est ARRIVÉE.
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SUR CE VHOST, LA PAGE EST À LA RACINE. Sans cet en-tête le QR
        # encoderait « /acces/ », qui ne tombe juste ici que par le repli
        # try_files — une URL fausse qui marche par accident.
        proxy_set_header X-Acces-Racine /;
        client_max_body_size 16k;
        proxy_read_timeout 30s;
    }

    location / {
        root /usr/share/secubox/www/acces;
        index index.html;
        # Une extension de fichier dit « je veux CE fichier ». Sans cette borne,
        # `appareil.js` absent repartirait en index.html avec un 200 — et un
        # module ES qui reçoit du HTML échoue d'une façon illisible.
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/acces_access.log;
    error_log  /var/log/nginx/acces_error.log;
}
