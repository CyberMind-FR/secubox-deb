# SecuBox Ad Guard Configuration

[general]
enabled = true
log_level = "info"

[blocklists]
# Update interval in hours (0 = manual only)
auto_update_hours = 24

# Enabled blocklist sources
sources = ["stevenblack", "oisd", "hagezi"]

[delayed_blocking]
# Default delay in hours before blocking queued domains
default_delay_hours = 24

# Require manual approval for delayed blocks
require_approval = true

[statistics]
# Retention period for detection logs in days
retention_days = 30

# Enable per-device tracking
track_devices = true

[dns_integration]
# Integration with Unbound/Vortex DNS
enabled = false
unbound_blocklist = "/var/lib/unbound/blocklist.conf"

[adblock_tv]
# POC « DNS AdBlock TV » (#1943) : mesure du filtrage DNS par appareil (OBSERVE / BLOCK). INACTIF par défaut ; l'état (appareils, modes)
# vit dans /var/lib/secubox/ad-guard/dnstv/etat.json, géré par l'API et l'interface — pas ici.
# Les compteurs de plus de `retention_jours` jours sont purgés chaque jour.
retention_jours = 30

[adblock_tv_auto]
# Mode « auto » (#1954) : seuils de DÉPART, mesurés sur UNE TV et UNE application — à calibrer sur plusieurs jours réels.
# declencheurs : domaines d'insertion publicitaire dont la requête ouvre une « coupure » (fenêtre de 60 s) pour la détection.
declencheurs = ["fwmrm.net"]
# Rafale : refus par minute vers un même domaine, pendant `duree_rafale_min` minutes consécutives. Étalon mesuré en lecture NORMALE : ~10/min.
seuil_refus_min = 60
duree_rafale_min = 5
# Requêtes depuis le début de l'essai pour juger l'appareil « actif » (un appareil éteint ne déclenche jamais de retrait).
min_requetes_actif = 100

# Ajout automatique des TV et streamers (#1959) : seuils de DÉPART, mesurés sur deux TV et une application — à calibrer.
# L'ajout est activé par l'administrateur dans le panneau (`ajout_auto`, faux par défaut) ; ces valeurs ne font que le cadrer.
min_declencheurs = 5        # requêtes vers un serveur d'insertion publicitaire sur 2 jours
min_services = 2            # services de contenu ou de qualité vidéo distincts
max_par_jour = 3            # nouveaux appareils par 24 h
delai_s = 3600              # un changement du périmètre au plus par heure (chacun coûte un rechargement d'Unbound, ≈ 10 s sans DNS)
retrait_jours = 7           # une adresse d'un appareil ajouté automatiquement, non vue depuis, est retirée (une reste toujours)
min_appareils_agreg = 2     # appareils où un domaine est confirmé par l'administrateur pour entrer dans le profil agrégé

# Détection PERMANENTE (#2047), fausse par défaut : à activer par l'administrateur (avec `auto_essai` dans le panneau).
# confirmation_auto : un essai (24 h) sans régression devient une règle confirmée à l'échéance au lieu d'être retiré ; un appareil
#   trop peu actif pour éprouver la règle voit l'essai prolongé d'une période ; une rafale de refus ou la disparition du contenu
#   habituel retirent la règle.
# declencheurs_pub : un hôte de pub connu des listes (advertising, tracking), MÊME DÉJÀ BLOQUÉ, ouvre la fenêtre de détection :
#   les hôtes nouveaux qui y apparaissent deviennent des candidats (utile quand le service n'utilise pas fwmrm.net).
confirmation_auto = false
declencheurs_pub = false

