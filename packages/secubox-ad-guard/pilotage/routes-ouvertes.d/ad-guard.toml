# Écritures ouvertes au porteur délégué du pilotage (#3126, L5 ; R-L5-12, #3279 en version minimale).
# Installé dans /usr/share/secubox/pilotage/routes-ouvertes.d/ad-guard.toml (root, 0644). Seules les écritures
# que la page www/ad-guard/index.html appelle (blocage, blocage différé, apprentissage, adblock TV). Webhooks,
# liste blanche, détection et maintenance ne sont pas ouvertes.

[[routes]]
methodes = ["POST"]
chemins = [
    "^/blocklist/(add|update)$",
    "^/delayed$",
    "^/delayed/process$",
    "^/delayed/[^/]+/approve$",
    "^/learn/(run|thresholds)$",
    "^/adblock-tv/(etat|mode|clients|custom|sonde)$",
    "^/adblock-tv/auto/detection/reglage$",
    "^/adblock-tv/auto/reglage/auto-essai$",
    "^/adblock-tv/auto/appareils/[^/]+/(puits|ignorer|autoriser|ca-ne-marche-plus)$",
    "^/adblock-tv/auto/regles/[^/]+/(essayer|rejeter|confirmer|retirer|rouvrir)$",
    "^/adblock-tv/simple/appareils/[^/]+/protection$",
    "^/adblock-tv/simple/suspects/legitime$",
    # Lot 3 SBX TV PRIVACY (#3374) : gestes de l'administrateur depuis la page /tv-privacy/ relayée. La route LAMBDA
    # `/adblock-tv/protection/usager/debloquer` n'est PAS ouverte : le kiosque appelle l'API locale du maître avec la session
    # de l'usager (et `require_personne` refuse de toute façon le porteur délégué).
    "^/adblock-tv/protection/(observe|pause|reprendre|exceptions)$",
    # Lot 4 (#3374) : reprise manuelle de nDPId après une pause de charge.
    "^/adblock-tv/protection/dpi/reprendre$",
    # Lot 5b (#3374) : choix différés de l'assistant « En direct » (administrateur). Le compteur du kiosque n'est pas une écriture.
    "^/adblock-tv/protection/assistant/(choix|annuler|guide)$",
]

[[routes]]
methodes = ["DELETE"]
chemins = [
    "^/blocklist/[^/]+$",
    "^/adblock-tv/clients/[^/]+$",
]
