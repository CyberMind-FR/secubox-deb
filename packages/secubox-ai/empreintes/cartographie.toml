# Cartographie d'Internet (#3795). Shodan n'a pas d'agent HTTP documenté : pas d'entrée (aucun trait sourcé).
# Zmap ne parle pas HTTP : seule la couche DPI (rythme des ports) le verrait, absente aujourd'hui : pas d'entrée.
# Masscan : seul son agent HTTP de bannière est documenté (couche waf) ; jamais nommé sur ce seul trait.

[[outil]]
nom = "Censys"
source = "relevé gk2 2026-11-15 (tests/donnees/menaces.jsonl)"
[[outil.trait]]
type = "agent"
couche = "waf"
motif = "CensysInspect/"

[[outil]]
nom = "Cortex Xpanse"
source = "relevé gk2 2026-11-15 (tests/donnees/menaces.jsonl)"
[[outil.trait]]
type = "agent"
couche = "waf"
motif = "Hello from Palo Alto Networks"

[[outil]]
nom = "zgrab"
source = "https://github.com/zmap/zgrab2/blob/master/modules/http/scanner.go#L61 (branche master consultée le 2026-11-18 : « Mozilla/5.0 zgrab/0.x »)"
[[outil.trait]]
type = "agent"
couche = "waf"
motif = "zgrab/"

[[outil]]
nom = "Masscan"
source = "https://github.com/robertdavidgraham/masscan/blob/master/src/proto-http.c#L389-L391 (branche master consultée le 2026-11-18 : « User-Agent: ivre-masscan/1.3 https://github.com/robertdavidgraham/ »)"
[[outil.trait]]
type = "agent"
couche = "waf"
motif = "masscan/"
