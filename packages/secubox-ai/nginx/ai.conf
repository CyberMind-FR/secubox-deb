# /etc/nginx/secubox-routes.d/ai.conf — secubox-ai (#3583), patron du composant SearXNG (#3581).
#
# API seulement : la page /ai/ est servie par la racine statique du vhost d'administration
# (/usr/share/secubox/www/ai/), sans alias ni try_files (MODULE-COMPLIANCE, AURORA-REFERENCE § 9).
# Gardes dans l'API (require_jwt partout sauf /health) ; pas d'error_page : les erreurs restent en JSON.
# AUCUNE exposition publique : ni vhost, ni nom, ni route WAF.
#
# Les réglages propres à une route vivent dans des locations EXACTES imbriquées : le snippet commun fixe déjà
# proxy_read_timeout (300 s) au niveau de la location principale, et nginx refuse un doublon au même niveau. Une
# location imbriquée hérite des en-têtes du snippet (dont les marqueurs vidés et le verdict LAN) tant qu'elle ne pose
# aucun proxy_set_header ; proxy_pass et rewrite, eux, ne s'héritent pas : ils sont répétés.
# Corps : 1 Mo par défaut (nginx) ; 100 Mo pour les seuls dépôts de fichier ; 8 Mo pour le dialogue (image jointe de
# 4 Mo au plus, en base64 dans le JSON) ; 32 Mo pour l'import de mémoire (20 M caractères au plus, plafond de l'API).
location /api/v1/ai/ {
    rewrite ^/api/v1/ai/(.*)$ /$1 break;
    proxy_pass http://unix:/run/secubox/ai.sock;
    include /etc/nginx/snippets/secubox-proxy.conf;
    # Analyse de code : 200 000 caractères, échappés dans le JSON.
    client_max_body_size 2m;

    # Dialogue en flux NDJSON : rien en tampon, et un démarrage à froid du moteur puis la lecture d'un long contexte
    # peuvent laisser plusieurs minutes sans ligne ; borne large (le travail, lui, est borné par l'API).
    location = /api/v1/ai/essai/flux {
        rewrite ^/api/v1/ai/(.*)$ /$1 break;
        proxy_pass http://unix:/run/secubox/ai.sock;
        proxy_buffering off;
        proxy_read_timeout 7200s;
        proxy_send_timeout 7200s;
        client_max_body_size 8m;
    }

    # Dépôts de fichier en corps brut (pas de base64), écrits au fil de l'eau par l'API : transmis sans tampon disque
    # de nginx. Plafonds de l'API : 100 Mo (documents), 50 Mo (médias).
    location = /api/v1/ai/documents/fichier {
        rewrite ^/api/v1/ai/(.*)$ /$1 break;
        proxy_pass http://unix:/run/secubox/ai.sock;
        client_max_body_size 100m;
        proxy_request_buffering off;
        proxy_read_timeout 900s;
    }
    location = /api/v1/ai/medias/entree {
        rewrite ^/api/v1/ai/(.*)$ /$1 break;
        proxy_pass http://unix:/run/secubox/ai.sock;
        client_max_body_size 100m;
        proxy_request_buffering off;
        proxy_read_timeout 900s;
    }

    location = /api/v1/ai/memoire-import {
        rewrite ^/api/v1/ai/(.*)$ /$1 break;
        proxy_pass http://unix:/run/secubox/ai.sock;
        client_max_body_size 32m;
    }
}
