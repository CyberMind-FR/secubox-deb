# /etc/nginx/secubox-routes.d/annuaire-routes.conf — Installed by secubox-annuaire.
# Annuaire-Miroir trust substrate API, served by the standalone
# secubox-annuaire.service over /run/secubox/annuaire.sock (no aggregator dependency).
location /api/v1/annuaire/ {
    rewrite ^/api/v1/annuaire/(.*)$ /$1 break;
    proxy_pass http://unix:/run/secubox/annuaire.sock;
    include /etc/nginx/snippets/secubox-proxy.conf;
    proxy_intercept_errors on;
}
