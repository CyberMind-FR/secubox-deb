# /etc/nginx/secubox.d/annuaire.conf — Installed by secubox-annuaire.
# Static Annuaire UI. The /api/v1/annuaire/ route lives in
# secubox-routes.d/annuaire-routes.conf (the authoritative API include).

location /annuaire/ {
    alias /usr/share/secubox/www/annuaire/;
    index index.html;
    try_files $uri $uri/ /annuaire/index.html;
}
