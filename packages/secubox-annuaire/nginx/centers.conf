# /etc/nginx/secubox.d/centers.conf — Installed by secubox-annuaire.
# Static "Centres & Grants" UI (Task 9). It calls the same
# /api/v1/annuaire/ API prefix as www/annuaire/ (routed by
# secubox-routes.d/annuaire-routes.conf, already installed) — no separate
# API route needed here.

location /centers/ {
    alias /usr/share/secubox/www/centers/;
    index index.html;
    try_files $uri $uri/ /centers/index.html;
}
