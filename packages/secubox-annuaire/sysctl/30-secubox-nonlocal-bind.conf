# Installed by secubox-annuaire. Allow services to bind IP addresses that are
# not (yet) present on an interface — e.g. nginx binding the wg-mesh address
# 10.10.0.x:8799 for the Annuaire federation listener before wg-quick@wg-mesh
# has finished bringing the interface up at boot. Without this, a specific-IP
# `listen` directive fails and takes nginx down board-wide. This mirrors the
# standard HAProxy/keepalived VIP-binding configuration.
net.ipv4.ip_nonlocal_bind = 1
