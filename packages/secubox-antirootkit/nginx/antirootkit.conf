# /etc/nginx/secubox.d/antirootkit.conf — Installed by secubox-antirootkit.
# Anti-Rootkit panel: exec forensic log + alert queue + manual
# quarantine-prep, served by the standalone secubox-antirootkit.service over
# /run/secubox/antirootkit.sock (dedicated socket, no aggregator dependency).

location /api/v1/antirootkit/ {
    rewrite ^/api/v1/antirootkit/(.*)$ /$1 break;
    proxy_pass http://unix:/run/secubox/antirootkit.sock;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

location /antirootkit/ {
    alias /usr/share/secubox/www/antirootkit/;
    index index.html;
    try_files $uri $uri/ /antirootkit/index.html;
}
