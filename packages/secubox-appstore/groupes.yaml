# GROUPES — une fonctionnalité, plusieurs paquets (#1323).
#
# POURQUOI PAS LES CATÉGORIES. Le catalogue en a déjà (`media`, `security`…),
# mais une catégorie RANGE quand un groupe PROPOSE : on ne veut pas installer
# « les 14 modules classés média », on veut « écouter et regarder chez soi »,
# c'est-à-dire trois modules choisis qui marchent ensemble. Une catégorie est
# exhaustive et neutre ; un groupe est un avis.
#
# CE FICHIER EST UN AVIS, ET IL S'ASSUME. Chaque groupe dit ce qu'il apporte et
# ce qu'il coûte. Un module cité ici doit exister au catalogue — le générateur
# refuse le contraire plutôt que de livrer un bouton qui échouera.
#
# L'ORDRE EST UNE LOGIQUE, PAS UN HASARD. On descend du socle vers l'agrément :
# ce qui fait tenir le lien (Socle FAI), ce qui le protège (Bouclier), ce qui
# donne une adresse (Nuage, Correspondance), puis ce qu'on en fait (Média,
# Publication, Veille, Maison). Un groupe cité plus haut ne dépend jamais d'un
# groupe cité plus bas — c'est ce qui rend l'ordre lisible pour qui installe.
#
# Format volontairement plat (pas de PyYAML dans la chaîne de construction) :
#   groupe: <identifiant>
#   label: <nom lisible>
#   description: "<une phrase>"
#   modules:
#     - secubox-<nom>

groupe: isp
label: Socle FAI
description: "Être son propre opérateur : résolution, routage, partage et garde du lien."
modules:
  - secubox-isp
  - secubox-dns
  - secubox-dns-guard
  - secubox-vortex-dns
  - secubox-netmodes
  - secubox-qos
  - secubox-nac
  - secubox-wan-link-guard


groupe: bouclier
label: Bouclier
description: "Voir et arrêter ce qui frappe : pare-feu applicatif, inspection de flux et bannissement."
modules:
  - secubox-waf
  - secubox-waf-ng
  - secubox-dpi
  - secubox-ipblock
  - secubox-antirootkit


groupe: nuage
label: Nuage personnel
description: "Ses fichiers et ses photos chez soi, partagés sans intermédiaire."
modules:
  - secubox-nextcloud
  - secubox-photoprism
  - secubox-smb


groupe: correspondance
label: Correspondance
description: "Écrire et recevoir : courrier, messagerie chiffrée et relais social."
modules:
  - secubox-mail
  - secubox-signal
  - secubox-mastodon

groupe: media
label: Média
description: "Écouter et regarder chez soi : radio, balados et vidéo, servis par la box."
modules:
  - secubox-radio
  - secubox-podcaster
  - secubox-peertube
  - secubox-lyrion


groupe: publication
label: Publication
description: "Publier : sites statiques, billets et dépôt de fichiers éphémères."
modules:
  - secubox-metablogizer
  - secubox-billets
  - secubox-droplet


groupe: veille
label: Veille
description: "Suivre ce qui se dit : agrégation de sources, fil d'actualité et forum local."
modules:
  - secubox-metanews
  - secubox-cyberfeed
  - secubox-bbs
  - secubox-socialrelay


groupe: maison
label: Maison connectée
description: "Piloter le domicile : passerelle Zigbee, courtier MQTT et vidéosurveillance."
# `homeassistant` et `roundcube` ne sont pas des paquets SecuBox : ils vivent
# en conteneur, hors catalogue. Un groupe ne cite que ce qui s'installe ici.
modules:
  - secubox-zigbee
  - secubox-mqtt
  - secubox-frigate

