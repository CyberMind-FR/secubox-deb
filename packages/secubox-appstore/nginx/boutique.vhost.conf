# boutique.<domaine> — la boutique client de l'App Store (#3150).
# Exposé par HAProxy -> sbxwaf -> nginx:9080. L'administration reste sur admin.<domaine>/appstore/.
# Ce vhost ne sert que la page, ses fiches et TROIS appels de l'API : les lectures du catalogue et
# l'installation d'un module. Le reste de l'API (configuration, demandes distantes) n'y est pas joignable.
# La session est celle du cookie SSO du domaine de la box ; l'installation exige toujours un administrateur.

# Le Hall de CETTE box peut encadrer la boutique (hall.<domaine>) ; $sbx_halls_parc vient de secubox-core.
map $host $sbx_boutique_hall {
    ~^boutique\.(?<sbx_boutique_dom>.+)$  "https://hall.$sbx_boutique_dom";
    default                               "";
}

server {
    include snippets/secubox-waking.conf;
    include snippets/secubox-errorpages.conf;
    listen 9080;
    # Joker : la boutique de CETTE box sous son propre domaine ; aucun nom propre à une box n'est livré.
    server_name boutique.*;

    if ($http_x_forwarded_proto = "http") { return 301 https://$host$request_uri; }

    root /usr/share/secubox/www/appstore;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self' $sbx_boutique_hall $sbx_halls_parc; base-uri 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /                       { try_files /boutique.html =404; }
    location = /boutique.html          { try_files /boutique.html =404; }
    location = /boutique-fiches.json   { try_files /boutique-fiches.json =404; }

    location ~ ^/api/v1/appstore/(catalog|groupes|jobs)$ {
        rewrite ^/api/v1/appstore/(.*)$ /$1 break;
        proxy_pass http://unix:/run/secubox/appstore.sock;
        include /etc/nginx/snippets/secubox-proxy.conf;
        proxy_intercept_errors on;
    }
    location ~ ^/api/v1/appstore/module/[a-z0-9][a-z0-9.+-]*/action/install$ {
        rewrite ^/api/v1/appstore/(.*)$ /$1 break;
        proxy_pass http://unix:/run/secubox/appstore.sock;
        include /etc/nginx/snippets/secubox-proxy.conf;
        proxy_intercept_errors on;
    }

    location / { return 404; }
}
