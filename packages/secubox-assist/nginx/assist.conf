# /etc/nginx/secubox.d/assist.conf — Installed by secubox-assist.
# Static "Assistance" operator panel + API proxy to the assist socket.

location /assist/ {
    alias /usr/share/secubox/www/assist/;
    index index.html;
    try_files $uri $uri/ /assist/index.html;
}

# Strip the /api/v1/assist/ prefix with an explicit rewrite (the proven pattern
# used by the waf/picobrew dedicated-socket vhosts). A bare `proxy_pass
# unix:…:/;` does NOT reliably strip the prefix for unix upstreams, so the
# assist API would 404 on the un-stripped path. See project_gk2_nginx_multimaster_blocker.
location /api/v1/assist/ {
    rewrite ^/api/v1/assist/(.*)$ /$1 break;
    proxy_pass http://unix:/run/secubox/assist.sock;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_http_version 1.1;
}
