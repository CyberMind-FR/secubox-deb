# SecuBox :: sbxid — entrée d'administration (#1466).
#
# L'Identity Manager est servi par le HALL (/identite/) : c'est l'origine où
# vivent les clés d'appareil. L'entrée du menu admin (/sbxid/) y renvoie, vue
# Administration ouverte. Chargé aussi par le vhost du Hall (secubox-routes.d
# est commun) : d'où un chemin distinct de /identite/, qui y ferait doublon.
location = /sbxid { return 302 /sbxid/; }
location /sbxid/ {
    set $sbxid_hall $host;
    if ($host ~* ^admin\.(.+)$) { set $sbxid_hall hall.$1; }
    return 302 https://$sbxid_hall/identite/#admin;
}
