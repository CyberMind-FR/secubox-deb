  SecuBox #1466 — entrée d'administration de l'Identity Manager.
  Le gestionnaire vit dans le Hall (/identite/), l'origine des clés d'appareil ;
  cette page n'existe que pour le menu admin, et y renvoie (nginx le fait déjà
  en 302 : ceci est le repli).
-->
<html lang="fr"><head><meta charset="utf-8"><title>Identité SBX OS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{margin:0;display:grid;place-items:center;min-height:100vh;background:#0b0d12;color:#e8e6d9;font:15px system-ui,sans-serif}a{color:#00d4ff}</style>
</head><body>
<p>Ouverture de l'Identity Manager… <a id="l" href="/identite/#admin">continuer</a></p>
<script>
  // #2872 : sans Hall (profil minimal), le gestionnaire s'ouvre sur CETTE origine ; avec Hall, comme avant. Sonde de meme origine (le Hall publie /hall/).
  fetch('/hall/', { method: 'HEAD', credentials: 'same-origin' }).then(function (r) { return r.ok; }, function () { return false; }).then(function (hall) {
    var u = hall ? 'https://' + location.hostname.replace(/^admin\./, 'hall.') + '/identite/#admin' : '/identite/#admin';
    document.getElementById('l').href = u;
    (window.top || window).location.replace(u);
  });
</script>
</body></html>
