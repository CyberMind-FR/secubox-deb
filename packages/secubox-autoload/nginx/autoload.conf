# Auto-Load : enrôlement (preuve = le jeton) et panel (garde = administrateur), #2190.
# Les routes de box (progression, pré-rapport) n'existent PAS ici : elles ne sont servies que dans le tunnel, sur 10.64.0.1:8470.
location /api/v1/autoload/ {
    client_max_body_size 128k;
    proxy_pass http://unix:/run/secubox/autoload.sock:/api/v1/autoload/;      # URI explicite : la convention des autres modules (le préfixe est remplacé, ici par lui-même)
    include /etc/nginx/snippets/secubox-proxy.conf;
    proxy_intercept_errors on;
}
