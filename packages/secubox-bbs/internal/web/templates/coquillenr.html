  Coquille newsroom GÉNÉRIQUE (#1114) pour les pages autonomes qui n'ont pas de
  colonne centrale propre (compte…). Même masthead (avmast, avec l'alerte MP en
  haut à droite), mêmes rails (avrubriques/avacces à gauche, avrail à droite)
  que l'accueil et le fil ; le corps de la page est RÉUTILISÉ via
  {{template "corps"}} (défini par compte.html, etc.). bbs.css fournit les
  classes du corps, newsroom.css est chargée APRÈS et l'emporte sur la coquille.
-->
{{define "pagenr"}}<!doctype html><html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{if .Titre}}{{.Titre}} — {{end}}{{.Site}}</title>
<meta name="sbx-no-health-banner">
<link rel="stylesheet" href="/static/bbs.css?v={{.VCSS}}">
<link rel="stylesheet" href="/static/newsroom.css?v={{.VCSS}}">
</head><body>
{{template "avmast" .}}
<div class="wrap">
  <aside class="rail">
    {{template "avrubriques" .}}
    {{template "avacces" .}}
  </aside>
  <main class="feed">
    {{template "corps" .}}
  </main>
  <aside class="rail rr">
    {{template "avrail" .}}
  </aside>
</div>
<script src="/static/coquille.js?v={{.VCSS}}" defer></script>
</body></html>{{end}}
