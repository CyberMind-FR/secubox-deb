{{define "corps"}}
<div class="ph"><div><h1 class="serif">{{.Titre}}</h1><p>{{.Intro}}</p></div></div>
{{if .Cards}}<div class="grid g2">{{range .Cards}}
  <div class="card pad">
    <div class="row" style="margin-bottom:6px">{{range .Pills}}<span class="pill {{.Class}}">{{.Text}}</span>{{end}}</div>
    <h3 style="font-size:15px">{{.Title}}</h3>
    <div class="d" style="color:var(--dim);font-size:12.5px;margin-top:2px">{{.Sub}}</div>
    {{if .Link}}<div class="row" style="margin-top:11px"><a class="btn sm" href="{{.Link}}">{{.LinkText}}</a></div>{{end}}
  </div>
{{end}}</div>{{else}}
<div class="card pad" style="color:var(--dim)">{{.Vide}}</div>
{{end}}
{{if .Note}}<div class="note m" style="margin-top:16px">{{.Note}}</div>{{end}}
{{end}}
