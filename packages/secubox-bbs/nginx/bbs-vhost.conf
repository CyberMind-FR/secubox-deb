# SecuBox-Deb :: BBS — vhost de l'interface MEMBRE.
#
# Servi sur bbs.<domaine>, distinct du panneau d'administration :
#
#   admin.<domaine>/bbs/   panneau sysop (terminal cyan), derriere la porte
#                          d'administration
#   bbs.<domaine>/         interface membre (la maquette), ouverte au public
#                          pour ce qui est public, et a elle seule
#
# Les separer n'est pas cosmetique : la surface publique ne doit pas partager
# un vhost avec l'administration de la board. Une erreur de configuration sur
# l'une n'expose alors pas l'autre.
#
# TOUT passe par le service, y compris les fichiers statiques : ils sont
# embarques dans le binaire. Aucun `root` ici, donc aucun repertoire a servir
# par erreur.
#
# Ce fichier est active a la main (voir README) : l'ajout d'un vhost demande
# aussi une entree HAProxy et un enregistrement DNS, qu'un paquet ne doit pas
# decider seul.
server {
    listen 9080;
    server_name bbs.gk2.secubox.in;

    # Reveil de phase 2 : si le service dort, la page d'attente s'affiche au
    # lieu d'un 502 nu.
    include snippets/secubox-waking.conf;

    # ── ENTRER AVEC SA SESSION SECUBOX (#1360) ────────────────────────────
    #
    # Quelqu'un entré dans SBX OS — par SIGNATURE, sans mot de passe — arrivait
    # ici et se voyait demander un pseudonyme et un mot de passe qu'il n'a
    # jamais eus. Deux authentifications pour une personne, dont l'une était
    # infranchissable.
    #
    # CE QUI REND L'EN-TÊTE DIGNE DE FOI, et c'est la CONJONCTION qui compte :
    #
    #   1. le démon BBS n'écoute QUE sur un socket unix — aucun client ne
    #      l'atteint, seul nginx lui parle ;
    #   2. `proxy_set_header` ci-dessous ÉCRASE ce que le client aurait envoyé,
    #      avec la valeur que NOUS avons obtenue de /auth/verify.
    #
    # Retirer l'une des deux ouvre la porte à qui sait écrire un en-tête.
    location = /sbx/entrer {
        auth_request /__sbx_verifie_secubox;
        auth_request_set $sbx_membre $upstream_http_remote_user;
        auth_request_set $sbx_profil $upstream_http_remote_groups;
        # PAS DE SESSION N'EST PAS UNE ERREUR : c'est le cas de tout visiteur
        # qui n'est pas passé par SBX OS. On lui montre le formulaire.
        error_page 401 403 = @sbx_sans_session;

        proxy_pass http://unix:/run/secubox/bbs.sock:/sbx/entrer$is_args$args;
        proxy_set_header X-SecuBox-LAN $lan_client;   # verdict LAN (#1354)
        proxy_set_header Host $host;
        proxy_set_header X-Sbx-Membre $sbx_membre;
        proxy_set_header X-Sbx-Profil $sbx_profil;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /__sbx_verifie_secubox {
        internal;
        proxy_pass http://unix:/run/secubox/aggregator.sock:/api/v1/auth/auth/verify;
        proxy_set_header X-SecuBox-LAN $lan_client;   # verdict LAN (#1354)
        # Une vérification n'a pas besoin du corps de la requête, et le lui
        # passer ferait relire un envoi de fichier à chaque page.
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    location @sbx_sans_session { return 302 /login; }

    location / {
        # DÉFENSE EN PROFONDEUR : on efface l'en-tête pour TOUT le reste. Aucun
        # autre gestionnaire ne le lit aujourd'hui — mais un jour où l'un le
        # lirait, un client pourrait l'avoir posé lui-même. Il ne coûte rien de
        # fermer cette porte avant qu'elle n'existe.
        proxy_set_header X-Sbx-Membre "";
        proxy_set_header X-Sbx-Profil "";
        proxy_pass http://unix:/run/secubox/bbs.sock:/;
        include /etc/nginx/snippets/secubox-proxy.conf;
        # Les depots de fichiers de la bibliotheque peuvent etre volumineux ;
        # une limite basse se manifesterait par un 413 au pire moment.
        client_max_body_size 512m;
    }

    # L'API d'administration N'EST PAS exposee sur le vhost public. Elle exige
    # deja un jeton, mais ne pas l'exposer du tout est une garde de plus, et
    # celle-la ne depend d'aucune verification.
    location /api/v1/bbs/ {
        return 404;
    }
}
