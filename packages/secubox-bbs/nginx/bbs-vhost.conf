# SecuBox-Deb :: BBS — vhost de l'interface MEMBRE.
#
# Servi sur bbs.<domaine>, distinct du panneau d'administration :
#
#   admin.<domaine>/bbs/   panneau sysop (terminal cyan), derriere la porte
#                          d'administration
#   bbs.<domaine>/         interface membre (la maquette), ouverte au public
#                          pour ce qui est public, et a elle seule
#
# Les separer n'est pas cosmetique : la surface publique ne doit pas partager
# un vhost avec l'administration de la board. Une erreur de configuration sur
# l'une n'expose alors pas l'autre.
#
# TOUT passe par le service, y compris les fichiers statiques : ils sont
# embarques dans le binaire. Aucun `root` ici, donc aucun repertoire a servir
# par erreur.
#
# Ce fichier est active a la main (voir README) : l'ajout d'un vhost demande
# aussi une entree HAProxy et un enregistrement DNS, qu'un paquet ne doit pas
# decider seul.
server {
    listen 9080;
    server_name bbs.gk2.secubox.in;

    # Reveil de phase 2 : si le service dort, la page d'attente s'affiche au
    # lieu d'un 502 nu.
    include snippets/secubox-waking.conf;

    location / {
        proxy_pass http://unix:/run/secubox/bbs.sock:/;
        include /etc/nginx/snippets/secubox-proxy.conf;
        # Les depots de fichiers de la bibliotheque peuvent etre volumineux ;
        # une limite basse se manifesterait par un 413 au pire moment.
        client_max_body_size 512m;
    }

    # L'API d'administration N'EST PAS exposee sur le vhost public. Elle exige
    # deja un jeton, mais ne pas l'exposer du tout est une garde de plus, et
    # celle-la ne depend d'aucune verification.
    location /api/v1/bbs/ {
        return 404;
    }
}
