# SecuBox-Deb :: BBS — route de l'agregateur.
#
# Deux surfaces, deux traitements :
#
#   /bbs/         panneau SYSOP, servi en statique par l'agregateur
#   /api/v1/bbs/  API du module, mandatee vers la socket unix
#
# L'interface MEMBRE n'est pas ici : elle vit sur son propre vhost
# (bbs.<domaine>), parce qu'elle s'adresse a un autre public et n'a rien a
# faire derriere la porte d'administration.

location /api/v1/bbs/ {
    proxy_pass http://unix:/run/secubox/bbs.sock:/api/v1/bbs/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # L'API rend du JSON court ; une reponse lente signale un probleme plutot
    # qu'un gros transfert.
    proxy_read_timeout 60s;
}
