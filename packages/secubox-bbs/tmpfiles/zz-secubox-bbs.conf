# SecuBox-Deb :: BBS — repertoires d'execution.
#
# Le prefixe `zz-` fait trier ce fichier APRES celui qui cree /run/secubox :
# une regle qui s'appliquerait avant recreerait le parent avec le mauvais
# proprietaire, et toutes les autres unites perdraient leur socket.
#
# /run/secubox lui-meme n'est PAS declare ici : il appartient a secubox-core.
d /var/lib/secubox/bbs         0750 secubox-bbs secubox -
d /var/lib/secubox/bbs/content 0750 secubox-bbs secubox -
d /var/lib/secubox/bbs/files   0750 secubox-bbs secubox -
d /etc/secubox/secrets/bbs     0700 secubox-bbs secubox -
d /var/backups/secubox         0750 root        secubox -
