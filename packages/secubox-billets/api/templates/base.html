<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="sbx-no-health-banner" content="1">
<title>{% block title %}{{ site_title }}{% endblock %}</title>
<link rel="stylesheet" href="/static/newsroom.css?v=nr9">
<link rel="alternate" type="application/atom+xml" title="{{ site_title }}" href="/feed.xml">
<link rel="alternate" type="application/feed+json" title="{{ site_title }}" href="/feed.json">
{% block head %}{% endblock %}
</head>
<body>
<header class="mast">
  <div class="mast-top">
    <span class="l">◆ gazette souveraine</span>
    <span>{{ tagline }}</span>
    <span class="r">● public</span>
  </div>
  <div class="mast-main">
    <a class="logo" href="/"><img class="mark medaille" src="/static/bbs-logo.svg?v=1" alt="A" width="44" height="44"><span class="logo-t"><span class="logo-h">{{ site_title }}</span><span class="sub">la face publique · AletheiaVox</span></span></a>
    <button type="button" class="ibtn" data-act="theme" style="margin-left:auto"
            aria-label="Basculer clair / sombre" title="Clair / sombre (t)">◐</button>
  </div>
</header>
<div class="pub">
  <main class="feed">
  {% block content %}{% endblock %}
  </main>
</div>
<footer class="pub-footer"><a href="/feed.xml">Atom</a> · <a href="/feed.json">JSON</a> · billets · gk2</footer>
<script src="/static/billets.js?v=7" defer></script>
</body>
</html>
