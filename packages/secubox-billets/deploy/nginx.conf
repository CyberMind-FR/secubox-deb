# billets vhost. In SecuBox this listens on the internal nginx port and is
# fronted by HAProxy (TLS 1.3) -> sbxwaf -> here; standalone, terminate TLS here
# (certbot) and redirect :80 -> :443. Proxies to the uvicorn Unix socket; nginx
# serves /static directly. nginx must be able to read the socket — its worker
# user (www-data) is added to the `secubox` group by the package postinst.
server {
    listen 8910;
    server_name billets.example.com;

    # Static assets straight from disk (CSP-safe: same origin).
    location /static/ {
        alias /usr/lib/secubox/billets/api/static/;
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # User-uploaded media (re-encoded + EXIF-stripped by the app before write).
    location /media/ {
        alias /var/lib/secubox/billets/media/;
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://unix:/run/secubox/billets.sock;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # LE PROTOCOLE VIENT DE HAPROXY, PAS DE NOUS (#1269). nginx est un
        # hop INTERNE en clair : `$scheme` y vaut toujours « http », et le
        # module en concluait qu'il servait en clair — permaliens en http://,
        # `_secure()` faux, cookies retombes en SameSite=Lax. HAProxy pose
        # l'en-tete sur ses deux frontends, on le transmet tel quel.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        client_max_body_size 6m;   # images up to 5 MiB + form overhead
    }
}
