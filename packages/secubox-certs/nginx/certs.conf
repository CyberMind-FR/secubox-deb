# SecuBox Certs - Certificate Manager API

location /certs/ {
    alias /usr/share/secubox/www/certs/;
    index index.html;
    try_files $uri $uri/ /certs/index.html;
}

location /api/v1/certs/ {
    proxy_pass http://unix:/run/secubox/aggregator.sock:/api/v1/certs/;
    include /etc/nginx/snippets/secubox-proxy.conf;
}
