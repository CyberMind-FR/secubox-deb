# SecuBox (#1819) : le renouvellement passe par secubox-certbot, qui démarre
# certbot même quand une dérive pip casse sa pile Python.
[Service]
ExecStart=
ExecStart=/usr/sbin/secubox-certbot -q renew --no-random-sleep-on-renew
