# Inclus par le serveur d'administration (include /etc/nginx/secubox-routes.d/*.conf). Pas une route d'API, pas un vhost :
# seulement le type MIME de l'APK et la non-mise en cache des fichiers que l'appli compare pour ses mises à jour.
location = /companion/secubox-companion.apk {
    types { }
    default_type application/vnd.android.package-archive;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
}
location = /companion/version.json {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
}
