# La console TUI est la partie HEADLESS de l'interface locale (#2332) : elle prend la tty1 quand le kiosque WebUI est désactivé ou absent (box sans écran, port série, démarrage sans X).
# Quand le kiosque est activé elle reste éteinte : deux interfaces ne se disputent pas l'écran.
[Unit]
ConditionPathExists=!/var/lib/secubox/.kiosk-enabled
