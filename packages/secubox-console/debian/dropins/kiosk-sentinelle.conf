# Le kiosque WebUI ne démarre que sur une box AVEC écran et kiosque activé (#2332). Sa sentinelle était testée dans un ExecStartPre (`[ -f .kiosk-enabled ] || exit 1`) : sur une box sans tête
# l'unité ÉCHOUAIT au lieu d'être ignorée, et le moteur de profils (qui démarre ce que le profil liste) annulait tout l'apply (« état non atteint », piège de #2315). En condition d'unité,
# le démarrage est IGNORÉ proprement. La console TUI (secubox-console) prend alors le relais sur la tty1.
[Unit]
ConditionPathExists=/var/lib/secubox/.kiosk-enabled
