# File des tâches de fond (ref #4036) : lue à chaque lancement par /usr/lib/secubox/tache-fifo,
# aucun service à redémarrer après une modification.

[file]
# false : chaque tâche part tout de suite, comme avant la file.
actif = true
# Nombre de tâches de collecte autorisées en même temps (1 à 16). Valeur illisible = 2.
concurrence = 2
