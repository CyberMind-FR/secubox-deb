# SecuBox-Deb :: routage des conteneurs (#1721)
#
# Les conteneurs de br-lxc (10.100.0.0/24) ne sortent que si l'hôte route.
# 99-secubox-hardening.conf (secubox-hardening) pose ip_forward = 0 ; ce
# fichier doit passer APRÈS lui dans l'ordre alphabétique (préfixe « zz »),
# quel que soit son répertoire, pour gagner. Le pare-feu reste juge : sur une
# box installée par l'image, la chaîne forward est en policy drop et
# n'accepte que br-lxc vers l'extérieur (secubox-lxc-reseau).
#
# Même nom que le fichier posé à la main sur gk2 le 2026-05-27 : là où il
# existe dans /etc/sysctl.d, c'est lui qui prime (contenu identique).
net.ipv4.ip_forward = 1
net.ipv4.conf.all.forwarding = 1
