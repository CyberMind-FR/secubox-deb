# SecuBox — cadence des minuteurs (incident de charge du 2026-08-12).
#
# QUATORZE minuteurs tiraient toutes les 30 a 60 s, et TOUS au meme instant :
# releve a 08:14:5x, ils se declenchaient dans la meme seconde. Chacun reveille
# un processus Python sur une board qui paginait deja (6 Go de swap sur 8, 161
# Mo de RAM libre, charge a 77). C'est le TROUPEAU qui faisait la charge, pas
# la frequence prise isolement.
#
# RandomizedDelaySec compte AUTANT que l'intervalle : sans lui, allonger les
# periodes garde les reveils groupes, seulement plus espaces.
#
# Ces reglages sont livres par secubox-core parce que la decision est
# board-wide : chaque paquet garde son minuteur, le rythme d'ensemble se decide
# ici. Les poser a la main sur la board les aurait fait disparaitre a la
# premiere reinstallation propre.
[Timer]
OnUnitActiveSec=120s
RandomizedDelaySec=30s
