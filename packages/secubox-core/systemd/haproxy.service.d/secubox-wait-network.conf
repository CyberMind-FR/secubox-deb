# SecuBox — ordonnancement du frontal TLS (#998)
#
# `Wants=` et NON `Requires=`.
#
# Avec `Requires=`, l'echec du job de secubox-network-ready fait ABANDONNER
# celui de HAProxy — sans que HAProxy ne journalise quoi que ce soit. C'est
# exactement ce qui s'est produit le 2026-08-06 : la board est restee 53
# minutes sans HTTPS apres un redemarrage, et le journal d'HAProxy etait vide,
# ce qui rendait la panne indiagnosticable.
#
# Un frontal TLS doit demarrer meme quand l'attente reseau a echoue : sans
# reseau il n'ecoutera rien, mais il ecoutera des que le reseau viendra. Mort,
# il n'ecoutera jamais.
[Unit]
After=secubox-network-ready.service
Wants=secubox-network-ready.service

# ── Le frontal TLS ne doit dependre d'AUCUNE cible tardive ──────────────────
#
# HAProxy est livre avec `WantedBy=multi-user.target`. Or cette cible n'est
# atteinte qu'apres TOUS les services qu'elle rassemble : le 2026-08-07, un
# service lent a tenu son job pendant tout son demarrage, la cible
# n'a jamais ete atteinte, et le job d'HAProxy n'a JAMAIS ete tente — journal
# vide, 443 muet, board sans HTTPS jusqu'a intervention manuelle.
#
# Ce n'etait pas la premiere fois : la veille, c'etait une boucle
# `secubox-netboot-confirm-healthy`. Le point commun n'est pas le service
# fautif, c'est la DEPENDANCE : tant que le frontal TLS est derriere
# multi-user.target, n'importe quel service lent coupe HTTPS.
#
# On le rattache donc a network-online.target — atteinte tot, et la SEULE
# chose dont un frontal ait reellement besoin. Le lien est pose par le
# postinst (un [Install] en drop-in n'est pas honore par `systemctl enable`).
#
# `After=` est aussi reduit : secubox-streamlit-routes n'a rien a faire devant
# un frontal TLS, et rsyslog encore moins — HAProxy sait journaliser sans lui.
[Unit]
After=
After=network-online.target secubox-network-ready.service
Wants=network-online.target
