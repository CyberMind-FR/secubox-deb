# SecuBox — ordonnancement du frontal TLS (#998)
#
# `Wants=` et NON `Requires=`.
#
# Avec `Requires=`, l'echec du job de secubox-network-ready fait ABANDONNER
# celui de HAProxy — sans que HAProxy ne journalise quoi que ce soit. C'est
# exactement ce qui s'est produit le 2026-08-06 : la board est restee 53
# minutes sans HTTPS apres un redemarrage, et le journal d'HAProxy etait vide,
# ce qui rendait la panne indiagnosticable.
#
# Un frontal TLS doit demarrer meme quand l'attente reseau a echoue : sans
# reseau il n'ecoutera rien, mais il ecoutera des que le reseau viendra. Mort,
# il n'ecoutera jamais.
[Unit]
After=secubox-network-ready.service
Wants=secubox-network-ready.service
