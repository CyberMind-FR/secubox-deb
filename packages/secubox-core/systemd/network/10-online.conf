# SecuBox — le pont LXC ne compte pas pour « en ligne » (#1497).
#
# br-lxc est un pont interne, souvent SANS porteuse sur une box neuve (aucun
# conteneur démarré). Sans cette ligne, systemd-networkd le jugeait requis et
# déclarait la box « offline » alors que le WAN routait : systemd-timesyncd
# ne synchronisait jamais l'horloge (codes TOTP refusés au premier login) et
# network-online.target n'était jamais atteint honnêtement.
#
# Livré ici plutôt que dans les six install-lxc.sh qui écrivent le .network :
# un drop-in s'applique aussi aux fichiers déjà posés sur les box existantes.
[Link]
RequiredForOnline=no
