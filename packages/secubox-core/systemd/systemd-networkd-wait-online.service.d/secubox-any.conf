# SecuBox — ne pas attendre les ports sans cable (#998)
#
# Par defaut, systemd-networkd-wait-online attend que TOUTES les interfaces
# gerees soient configurees. Or `lan0`..`lan3` sont les ports du switch de la
# board : sans cable, ils restent `no-carrier / configuring` indefiniment.
# L'unite echouait donc a chaque demarrage, et son echec se propageait.
#
# `--any` : le reseau est considere pret des qu'UNE interface est en ligne.
# C'est la semantique voulue ici — la board a une seule interface de gestion,
# les autres sont facultatives.
[Service]
ExecStart=
ExecStart=/lib/systemd/systemd-networkd-wait-online --any
