d /run/secubox 1777 root root -
# #623 — defense-in-depth: guarantee the SHARED secubox parents stay traversable
# (0755) at boot and on every `systemd-tmpfiles --create`, so if a module postinst
# momentarily re-clobbers one to 0750 it self-heals before the next
# secubox-dirs-guard.timer tick. Mode-only (owner `-`) to mirror the owner-agnostic
# dirs-guard and never fight secubox-core's / a module's own ownership.
d /var/lib/secubox 0755 - - -
d /var/log/secubox 0755 - - -
d /var/cache/secubox 0755 - - -
d /etc/secubox 0755 - - -
d /usr/share/secubox 0755 - - -
# /etc/secubox/secrets — UN SEUL PROPRIÉTAIRE, secubox-core (#1689).
# root:secubox 0750 : les membres du groupe secubox traversent, les autres
# modules reçoivent une ACL de traversée (bbs, mesh…). Cinq paquets imposaient
# chacun le leur (root 0700, secubox 0700, secubox-mesh 0700) : chaque 0700
# remettait le masque ACL à zéro et coupait tous les autres — la flotte perdait
# gk3 (clé d'annuaire devenue illisible). Rétabli au démarrage et à chaque
# `systemd-tmpfiles --create` ; recalcule le masque ACL (r-x).
d /etc/secubox/secrets 0750 root secubox -
