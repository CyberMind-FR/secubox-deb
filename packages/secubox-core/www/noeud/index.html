  SecuBox #3821 — ACCUEIL DU NOM DE NŒUD (<nœud>.<zone>, le nom nu de la box). Profil Aurora (.claude/AURORA-REFERENCE.md).

  Le nom nu d'une box exposée par son frontal répondait 404 : il montre le dé SecuBox, qui tourne sans fin. Depuis #3938 c'est le
  dé holographique en 3D réelle (WebGL 2, /_noeud/de3d.js), posé sur un échiquier dans le cercle central de la mire ; sans WebGL 2,
  sur erreur ou rendu trop lent, le dé du Hall (<sbx-dice>, même source que packages/secubox-webos/www/hall) prend sa place, et
  seulement alors. Le tout livré par secubox-core sous www/noeud/ et servi sous /_noeud/ par le vhost généré par secubox-noeud :
  une box sans le Hall sert son accueil (#3883). Polices Unbounded et JetBrains Mono (OFL) hébergées ici, police du système en attendant.

  Aucune donnée, aucun appel réseau, aucune ressource extérieure : la page ne lit que son propre nom d'hôte.
  En fond, la mire de télévision des pages d'erreur (#3885), sans texte et aria-hidden : SVG écrit dans la page (#3886).
  Sous prefers-reduced-motion le dé tourne au quart de vitesse, sans rebond ni parallaxe ; localStorage sbx_de=fige le fige.
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>SecuBox</title>
<style>
@font-face{font-family:"Unbounded";font-style:normal;font-weight:200 900;font-display:swap;src:url(/_noeud/polices/unbounded-latin.woff2) format("woff2")}
@font-face{font-family:"JetBrains Mono";font-style:normal;font-weight:100 800;font-display:swap;src:url(/_noeud/polices/jetbrains-mono-latin.woff2) format("woff2")}
:root{--fond:#060d1b;--trait:rgba(86,150,255,.22);--trait2:rgba(86,150,255,.38);--texte:#eaf1ff;--doux:#9fb3d6;--faible:#6f84a8;
  --cyan:#29b6f6;--bleu:#3b82f6;--vert:#2ecc71}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{min-height:100vh;min-height:100dvh;overflow:hidden;color:var(--texte);
  font-family:"IBM Plex Sans","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:radial-gradient(ellipse 70% 60% at 85% 0%,rgba(59,130,246,.2),transparent 70%),
             radial-gradient(ellipse 60% 55% at 0% 100%,rgba(41,182,246,.10),transparent 70%),var(--fond)}
/* #3886 : mire de télévision en fond (dessin des pages d'erreur #3885, sans texte), le dé au centre de son cercle.
   --d, --x, --y : diamètre et centre du cercle (r=350) ; ces valeurs sont exactes pour un SVG en 1200×800 « meet », le script les
   remplace par l'échelle réelle du SVG (barres mobiles, zoom) et agrandit le dé sur un écran étroit en hauteur. */
:root{--d:min(58.333vw,87.5vh);--x:50vw;--y:50vh}
.mire{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;color:var(--trait2)}
.mire .fin{opacity:.55}
.scene{position:fixed;left:var(--x);top:var(--y);width:var(--d);height:var(--d);transform:translate(-50%,-50%);display:grid;place-items:center}
#de3d{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;display:block;opacity:0;transition:opacity .6s}
#de3d.pret{opacity:1}
#de3d[hidden]{display:none}
.repli{display:grid;place-items:center;padding-bottom:13%}
.repli::before{content:"";position:absolute;inset:12%;border-radius:50%;
  background:radial-gradient(circle,rgba(41,182,246,.22),rgba(59,130,246,.06) 55%,transparent 72%);filter:blur(18px)}
sbx-dice{position:relative;z-index:1}
/* Le nom, dans le bas du cercle, sur un voile sombre (contraste ≥ 4,5:1) ; sous le cercle (--t) sur un écran étroit.
   --n, --z : longueurs du nom et de l'adresse, la taille s'y ajuste ; au-delà, retour à la ligne. */
.nom{position:fixed;left:var(--x);top:calc(var(--y) + var(--d)*.463);transform:translate(-50%,-100%);z-index:1;--l:calc(var(--d)*.6);
  width:max-content;max-width:var(--l);text-align:center;pointer-events:none;isolation:isolate}
.nom::before{content:"";position:absolute;inset:-34% -42%;z-index:-1;
  background:radial-gradient(closest-side,rgba(4,10,22,.92) 45%,rgba(4,10,22,.86) 62%,rgba(4,10,22,.4) 82%,transparent)}
h1{font-family:"Unbounded","Arial Black",system-ui,sans-serif;font-weight:900;letter-spacing:.01em;line-height:1.02;overflow-wrap:anywhere;color:#eaf6ff;
  font-size:max(1.1rem,min(clamp(1.7rem,calc(var(--d)*.112),8rem),calc(var(--l)/(var(--n,7)*.86))));padding:.04em .08em .2em;margin-bottom:-.1em}
@supports ((background-clip:text) or (-webkit-background-clip:text)){
  h1{background:linear-gradient(100deg,#fff 0%,#8fe9ff 22%,#b9a3ff 44%,#ff9be0 62%,#ffe3a6 80%,#fff 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 1px 0 rgba(255,255,255,.35)) drop-shadow(0 3px 2px rgba(0,6,20,.9)) drop-shadow(0 0 22px rgba(41,182,246,.45))}
}
/* Les lettres ne s'animent que sur un vrai GPU à l'aise (classe posée par le script) : redessiner ce filtre coûte plus que le dé. */
.vif h1{background-size:260% 100%;animation:irise 9s linear infinite}
@keyframes irise{to{background-position:-260% 0}}
.zone{display:inline-block;max-width:100%;margin-top:.7em;font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;font-weight:500;line-height:1.3;
  font-size:max(.75rem,min(clamp(.75rem,calc(var(--d)*.0225),1.5rem),calc(var(--l)*.72/(var(--z,14)*.74 + 2.2))));letter-spacing:clamp(.4px,calc(var(--d)*.003),.14em);
  color:#d9ecff;overflow-wrap:anywhere;padding:.42em 1.1em;border:1px solid rgba(143,233,255,.5);border-radius:1.4em;background:rgba(4,12,30,.86);
  box-shadow:0 0 18px rgba(41,182,246,.25),inset 0 0 12px rgba(167,139,250,.18)}
@media(prefers-reduced-motion:reduce){.vif h1{animation:none}}
.zone:empty{display:none}
.etroit .rond{display:none}
.etroit .nom{top:var(--t);transform:translate(-50%,-50%);--l:min(92vw,40rem)}
.etroit .nom::before{display:none}
.etroit h1{font-size:max(1.1rem,min(clamp(2.2rem,10.4vw,4rem),calc(var(--l)/(var(--n,7)*.86))))}
.etroit .zone{font-size:max(.75rem,min(clamp(.82rem,3.3vw,1.1rem),calc(var(--l)/(var(--z,14)*.74 + 2.4))))}
.marque{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);z-index:1;padding:.1em .9em;border-radius:1em;background:var(--fond);
  font-family:"Unbounded",system-ui,sans-serif;font-weight:500;font-size:.72rem;line-height:1.2;color:#9fb3d6;letter-spacing:.3em;text-transform:uppercase;white-space:nowrap}
.marque b{color:#8fe9ff;font-weight:900}
@media(max-height:420px){.marque{bottom:2px;font-size:.62rem}}
@media(prefers-reduced-motion:reduce){#de3d{transition:none}}
@media(forced-colors:active){h1{background:none;color:CanvasText;filter:none}.vif h1{animation:none}.zone,.marque{color:CanvasText;background:Canvas}.nom::before{display:none}}
</style>
</head>
<body>
<svg class="mire" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid meet" aria-hidden="true" focusable="false">
  <defs>
    <g id="roue" fill="none" stroke="currentColor">
      <circle r="92" stroke-width="4"/>
      <circle r="20" stroke-width="4"/><circle r="9" fill="currentColor"/>
      <g stroke-width="2.5">
        <path d="M-88 -6H-24M-88 6H-24M24 -6H88M24 6H88M-6 -88V-24M6 -88V-24M-6 24V88M6 24V88"/>
        <path d="M-80 -14H-26M-80 14H-26M26 -14H80M26 14H80M-14 -80V-26M14 -80V-26M-14 26V80M14 26V80"/>
        <path d="M-58 -58L-40 -40M58 -58L40 -40M-58 58L-40 40M58 58L40 40"/>
      </g>
    </g>
  </defs>
  <rect x="10" y="10" width="1180" height="780" rx="44" fill="none" stroke="currentColor" stroke-width="6"/>
  <rect x="34" y="34" width="1132" height="732" rx="24" fill="none" stroke="currentColor" stroke-width="2.5"/>
  <g class="fin" stroke="currentColor" stroke-width="2">
    <path d="M34 150H1166M34 300H1166M34 500H1166M34 650H1166"/>
    <path d="M190 34V766M340 34V766M860 34V766M1010 34V766"/>
  </g>
  <use href="#roue" x="190" y="170"/><use href="#roue" x="1010" y="170"/>
  <use href="#roue" x="190" y="630"/><use href="#roue" x="1010" y="630"/>
  <g class="rond">
    <circle id="rond" cx="600" cy="400" r="350" fill="var(--fond)" stroke="currentColor" stroke-width="4"/>
    <g class="fin" stroke="currentColor" stroke-width="2"><path d="M600 50V120M600 680V750M250 400H320M880 400H950"/></g>
  </g>
</svg>
<main>
  <div class="scene" id="scene"><canvas id="de3d" width="64" height="64" role="img" aria-label="Dé SecuBox en rotation sur un échiquier"></canvas></div>
  <div class="nom">
    <h1 id="noeud">SecuBox</h1>
    <p class="zone" id="zone"></p>
  </div>
  <p class="marque"><b>SecuBox</b> · nœud</p>
</main>
<script src="/_noeud/de3d.js"></script>
<script>
(function(){
  'use strict';
  var $=function(i){ return document.getElementById(i); };
  // Le nom de la page est celui de l'hôte demandé, rien d'autre : textContent seulement.
  var h=(location.hostname||'').toLowerCase(), i=h.indexOf('.');
  if(/^[a-z0-9.-]{1,253}$/.test(h) && i>0){
    var n=h.slice(0,i);
    $('noeud').textContent=n;
    $('zone').textContent=h;
    document.title=n+' · SecuBox';
    document.documentElement.style.setProperty('--n',String(n.length)); document.documentElement.style.setProperty('--z',String(h.length));
  }
  // Le dé remplit exactement le cercle r=350 de la mire : échelle et centre lus du SVG lui-même. Écran étroit en hauteur : le
  // cercle de la mire est petit, le dé l'agrandit (92 % de la largeur) et le cercle dessiné s'efface.
  var racine=document.documentElement, mire=document.querySelector('.mire'), scene=$('scene'), cv=$('de3d'), de=null;
  function place(){
    var r=mire.getBoundingClientRect(), e=Math.min(r.width/1200,r.height/800), d=700*e, x=r.left+r.width/2, y=r.top+r.height/2;
    var etroit=r.width<=700 && r.height>r.width*1.15;
    if(etroit){ d=Math.min(r.width*.92,r.height-210); y=r.top+Math.max(d/2+8,Math.min(r.height*.44,r.height-d/2-150)); }
    racine.classList.toggle('etroit',etroit);
    racine.style.setProperty('--t',(y+d/2+r.bottom-34)/2+'px');
    racine.style.setProperty('--d',d+'px'); racine.style.setProperty('--x',x+'px'); racine.style.setProperty('--y',y+'px');
    if(de) de.setAttribute('size',String(Math.round(Math.max(96,Math.min(720,d*(etroit?.82:.6))))));
  }
  addEventListener('resize',place);
  if(window.ResizeObserver) new ResizeObserver(place).observe(mire);
  place();
  // Repli : le dé du Hall, chargé seulement ici.
  function repli(raison){
    if(de) return;
    cv.hidden=true; racine.classList.remove('vif'); scene.classList.add('repli'); scene.setAttribute('data-repli',raison||'');
    de=document.createElement('sbx-dice');
    [['id','de'],['speed','3'],['fov','40'],['role','img'],['aria-label','Dé SecuBox en rotation']].forEach(function(a){ de.setAttribute(a[0],a[1]); });
    place(); scene.appendChild(de);
    var s=document.createElement('script'); s.src='/_noeud/sbx-dice.js'; document.body.appendChild(s);
  }
  if(!window.SbxDe3d){ repli('moteur absent'); return; }
  var faces=[0,1,2,3,4,5].map(function(k){ return '/_noeud/dice/face-'+k+'.jpg'; });
  window.SbxDe3d.demarrer(cv,faces,{repli:repli,
    pret:function(aise){ cv.classList.add('pret'); racine.classList.toggle('vif',aise); },
    charge:function(){ racine.classList.remove('vif'); }}).then(function(m){ window.sbxDe3d=m; });
})();
</script>
</body>
</html>
