  SecuBox #3821 — ACCUEIL DU NOM DE NŒUD (<nœud>.<zone>, le nom nu de la box). Profil Aurora (.claude/AURORA-REFERENCE.md).

  Le nom nu d'une box exposée par son frontal répondait 404 : il montre désormais le dé SecuBox, en plein écran,
  qui tourne sans fin. Le moteur est celui du Hall (<sbx-dice>, « SecuBox Dice 3D ») et ses six faces, de même source
  que le Hall (packages/secubox-webos/www/hall), livrés avec cette page par secubox-core sous www/noeud/ et servis sous
  /_noeud/ par le vhost généré par secubox-noeud : une box sans le Hall sert son accueil (#3883).

  Aucune donnée, aucun appel réseau, aucune ressource extérieure : la page ne lit que son propre nom d'hôte.
  En fond, la mire de télévision des pages d'erreur (#3885), sans texte et aria-hidden : SVG écrit dans la page (#3886).
  Sous prefers-reduced-motion le dé tourne au quart de vitesse (comportement du composant) ; localStorage
  sbx_de=fige le fige sur la face SecuBox.
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>SecuBox</title>
<style>
:root{--fond:#060d1b;--trait:rgba(86,150,255,.22);--trait2:rgba(86,150,255,.38);--texte:#eaf1ff;--doux:#9fb3d6;--faible:#6f84a8;
  --cyan:#29b6f6;--bleu:#3b82f6;--vert:#2ecc71}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{min-height:100vh;min-height:100dvh;overflow:hidden;color:var(--texte);
  font-family:"IBM Plex Sans","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:radial-gradient(ellipse 70% 60% at 85% 0%,rgba(59,130,246,.2),transparent 70%),
             radial-gradient(ellipse 60% 55% at 0% 100%,rgba(41,182,246,.10),transparent 70%),var(--fond)}
main{position:relative;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(14px,3vh,32px);padding:16px;text-align:center}
.scene{position:relative;display:grid;place-items:center;min-width:0}
.scene::before{content:"";position:absolute;inset:8%;border-radius:50%;
  background:radial-gradient(circle,rgba(41,182,246,.22),rgba(59,130,246,.06) 55%,transparent 72%);filter:blur(18px)}
.scene::after{content:"";position:absolute;left:18%;right:18%;bottom:-6%;height:9%;border-radius:50%;
  background:radial-gradient(ellipse,rgba(0,0,0,.55),transparent 70%)}
sbx-dice{position:relative;z-index:1}
/* #3886 : mire de télévision en fond (dessin des pages d'erreur #3885, sans texte), le dé au centre de son cercle. */
.mire{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;color:var(--trait2)}
.mire .fin{opacity:.55}
main>*{position:relative;z-index:1}
h1{font-size:clamp(2rem,7vw,4.2rem);font-weight:800;letter-spacing:.04em;line-height:1;min-width:0;overflow-wrap:anywhere}
.zone{margin-top:.55em;font-size:clamp(.8rem,2.4vw,1rem);color:var(--doux);letter-spacing:.08em;overflow-wrap:anywhere}
.marque{position:absolute;left:0;right:0;bottom:14px;font-size:.72rem;color:var(--faible);letter-spacing:.18em;text-transform:uppercase}
.marque b{color:var(--cyan);font-weight:700}
</style>
</head>
<body>
<svg class="mire" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid meet" aria-hidden="true" focusable="false">
  <defs>
    <g id="roue" fill="none" stroke="currentColor">
      <circle r="92" stroke-width="4"/>
      <circle r="20" stroke-width="4"/><circle r="9" fill="currentColor"/>
      <g stroke-width="2.5">
        <path d="M-88 -6H-24M-88 6H-24M24 -6H88M24 6H88M-6 -88V-24M6 -88V-24M-6 24V88M6 24V88"/>
        <path d="M-80 -14H-26M-80 14H-26M26 -14H80M26 14H80M-14 -80V-26M14 -80V-26M-14 26V80M14 26V80"/>
        <path d="M-58 -58L-40 -40M58 -58L40 -40M-58 58L-40 40M58 58L40 40"/>
      </g>
    </g>
  </defs>
  <rect x="10" y="10" width="1180" height="780" rx="44" fill="none" stroke="currentColor" stroke-width="6"/>
  <rect x="34" y="34" width="1132" height="732" rx="24" fill="none" stroke="currentColor" stroke-width="2.5"/>
  <g class="fin" stroke="currentColor" stroke-width="2">
    <path d="M34 150H1166M34 300H1166M34 500H1166M34 650H1166"/>
    <path d="M190 34V766M340 34V766M860 34V766M1010 34V766"/>
  </g>
  <use href="#roue" x="190" y="170"/><use href="#roue" x="1010" y="170"/>
  <use href="#roue" x="190" y="630"/><use href="#roue" x="1010" y="630"/>
  <circle cx="600" cy="400" r="350" fill="var(--fond)" stroke="currentColor" stroke-width="4"/>
  <g class="fin" stroke="currentColor" stroke-width="2"><path d="M600 50V120M600 680V750M250 400H320M880 400H950"/></g>
</svg>
<main>
  <div class="scene"><sbx-dice id="de" size="280" speed="3" fov="40" role="img" aria-label="Dé SecuBox en rotation"></sbx-dice></div>
  <div>
    <h1 id="noeud">SecuBox</h1>
    <p class="zone" id="zone"></p>
  </div>
  <p class="marque"><b>SecuBox</b> · nœud</p>
</main>
<script>
(function(){
  'use strict';
  // Le nom de la page est celui de l'hôte demandé, rien d'autre : textContent seulement.
  var h=(location.hostname||'').toLowerCase(), i=h.indexOf('.');
  if(/^[a-z0-9.-]{1,253}$/.test(h) && i>0){
    var n=h.slice(0,i);
    document.getElementById('noeud').textContent=n;
    document.getElementById('zone').textContent=h;
    document.title=n+' · SecuBox';
  }
  // Le dé occupe la page : 86 % de la largeur ou 62 % de la hauteur (le plus petit), entre 140 et 720 px.
  var de=document.getElementById('de'), attente=0;
  function taille(){
    attente=0;
    var s=Math.round(Math.max(140,Math.min(720,innerWidth*0.86,innerHeight*0.62)));
    if(String(s)!==de.getAttribute('size')) de.setAttribute('size',String(s));
  }
  addEventListener('resize',function(){ if(!attente) attente=requestAnimationFrame(taille); });
  taille();
})();
</script>
<script src="/_noeud/sbx-dice.js"></script>
</body>
</html>
