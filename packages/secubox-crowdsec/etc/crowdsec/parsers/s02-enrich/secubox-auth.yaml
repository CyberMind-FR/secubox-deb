# SecuBox Authentication Parser
# Detects failed authentication attempts on SecuBox WebUI
name: secubox/secubox-auth
description: "Parse SecuBox authentication events from nginx logs"
filter: "evt.Parsed.program == 'nginx' && evt.Meta.http_path contains 'api/v1' && evt.Meta.http_path contains 'login'"
onsuccess: next_stage
statics:
  - meta: service
    value: secubox-webui
  - meta: log_type
    value: secubox_auth
# Tag failed auth attempts (401 on login endpoints)
nodes:
  - filter: "evt.Meta.http_status == '401'"
    statics:
      - meta: auth_failure
        value: "true"
