# SecuBox WebUI Authentication Brute-Force Detection
type: leaky
name: secubox/secubox-auth-bf
description: "Detect brute-force on SecuBox WebUI authentication"
filter: "evt.Meta.log_type == 'secubox_auth' && evt.Meta.auth_failure == 'true'"
groupby: evt.Meta.source_ip
distinct: evt.Meta.http_path
capacity: 5
leakspeed: 30s
blackhole: 5m
reprocess: true
labels:
  service: secubox-webui
  type: bruteforce
  remediation: true
