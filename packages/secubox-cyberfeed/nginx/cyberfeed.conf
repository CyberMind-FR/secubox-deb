# Cyberfeed Dashboard static files
location /cyberfeed/ {
    alias /usr/share/secubox/www/cyberfeed/;
    index index.html;
    try_files $uri $uri/ /cyberfeed/index.html;
}

# Cyberfeed API proxy
location /api/v1/cyberfeed/ {
    proxy_pass http://unix:/run/secubox/aggregator.sock:/api/v1/cyberfeed/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}
