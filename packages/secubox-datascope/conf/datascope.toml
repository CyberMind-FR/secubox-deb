# SecuBox DataScope — /etc/secubox/datascope.toml (#3853). Valeurs absentes = défauts du paquet.
# Les variables SECUBOX_DATASCOPE_DB, _CACHE, _NAC_DB, _NETSTATS, _MODULES et _POPULATIONS priment (tests).

[stockage]
# Le postinst règle « base » sur /data/secubox-datascope/datascope.db si /data est un point de montage.
base = "/var/lib/secubox-datascope/datascope.db"
cache = "/var/cache/secubox/datascope"

[sources]
nac_db = "/var/lib/secubox/nac/devices.db"
netstats = "/var/lib/secubox/hub/netstats.json"
modules = "/var/cache/secubox/health/modules.json"
populations = "/var/lib/secubox/waf/populations.json"
modules_perime_s = 300
