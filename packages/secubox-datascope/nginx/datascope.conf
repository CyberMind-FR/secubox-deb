# API DataScope (#3853) : socket dédiée, lecture seule, gardes côté API.
location /api/v1/datascope/ {
    proxy_pass http://unix:/run/secubox/datascope.sock:/api/v1/datascope/;
    proxy_set_header X-SecuBox-LAN $lan_client;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}
