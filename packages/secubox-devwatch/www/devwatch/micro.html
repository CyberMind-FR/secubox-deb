<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DevWatch — vue micro</title>
<style>
  :root{ --fond:#ffffff; --texte:#131722; --muted:#5b6478; --faint:#8a93a6; --border:#e2e6f0;
         --border-soft:#eef1f7; --cyan:#0784a8; --up:#0f9d54; --gold:#b7810a; --sunk:#eef1f7; --surf2:#f5f7fc; }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --fond:#141a26; --texte:#e7ebf4; --muted:#8791a6; --faint:#5e6779; --border:#232b3b;
    --border-soft:#1b2230; --cyan:#28d6ff; --up:#35d07f; --gold:#f0b429; --sunk:#0c1017; --surf2:#10151f; } }
  :root[data-theme="dark"]{ --fond:#141a26; --texte:#e7ebf4; --muted:#8791a6; --faint:#5e6779; --border:#232b3b;
    --border-soft:#1b2230; --cyan:#28d6ff; --up:#35d07f; --gold:#f0b429; --sunk:#0c1017; --surf2:#10151f; }
  *{box-sizing:border-box}
  html,body{margin:0; height:100%; overflow:hidden; scrollbar-width:none}
  html::-webkit-scrollbar,body::-webkit-scrollbar{display:none}
  body{background:var(--fond); color:var(--texte); font-family:"IBM Plex Sans",Inter,system-ui,sans-serif; font-size:14px}
  .num{font-variant-numeric:tabular-nums; letter-spacing:-.01em}
  .mw{display:flex; flex-direction:column; height:100%; padding:.6rem .7rem; gap:.4rem}
  .h{display:flex; align-items:center; gap:7px}
  .h .ic{font-size:1rem} .h b{font-size:.86rem; letter-spacing:-.01em}
  .h .live{margin-left:auto; display:inline-flex; align-items:center; gap:5px; font-size:.56rem;
    letter-spacing:.09em; text-transform:uppercase; color:var(--up); font-weight:700}
  .dot{width:6px; height:6px; border-radius:50%; background:var(--up); animation:p 2.2s ease-out infinite}
  @keyframes p{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--up) 55%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
  .repo{font-family:"IBM Plex Mono",monospace; font-size:.6rem; color:var(--faint); margin-top:-2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .hero{display:flex; align-items:flex-end; gap:9px; padding:6px 0 8px; border-bottom:1px solid var(--border-soft)}
  .hero .v{font-weight:800; font-size:2rem; line-height:.9}
  .hero .meta{display:flex; flex-direction:column; gap:1px; padding-bottom:3px}
  .hero .meta .l{font-size:.6rem; color:var(--faint); text-transform:uppercase; letter-spacing:.07em; font-weight:600}
  .hero .meta .t{font-family:"IBM Plex Mono",monospace; font-size:.66rem; font-weight:600; color:var(--up)}
  .mini{display:grid; grid-template-columns:1fr 1fr 1fr; gap:5px; margin:8px 0}
  .mini .m{background:var(--surf2); border-radius:8px; padding:6px 5px; text-align:center}
  .mini .m .e{font-size:.82rem} .mini .m .n{font-weight:700; font-size:.78rem; margin-top:1px}
  .mini .m .g{font-size:.5rem; color:var(--faint); text-transform:uppercase; letter-spacing:.04em}
  .mevo{display:flex; align-items:flex-end; gap:3px; height:24px; padding:2px 0 3px; border-bottom:1px solid var(--border-soft)}
  .mevo i{flex:1; min-width:3px; border-radius:2px 2px 0 0; background:var(--muted); opacity:.5; transition:opacity .15s}
  .mevo i.major{background:var(--cyan); opacity:.85} .mevo i.minor{background:var(--gold); opacity:.7}
  .mevo i.latest{opacity:1; outline:1px solid var(--cyan); outline-offset:1px}
  .commit{display:flex; align-items:center; gap:6px; font-family:"IBM Plex Mono",monospace; font-size:.64rem;
    padding:6px 0 7px; border-top:1px solid var(--border-soft); color:var(--muted)}
  .commit .sha{color:var(--cyan); font-weight:600} .commit .msg{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; min-width:0}
  .loop{display:flex; align-items:center; gap:9px; padding:7px 0 2px; border-top:1px solid var(--border-soft)}
  .ring{width:32px; height:32px; border-radius:50%; flex:0 0 auto; position:relative; display:grid; place-items:center;
    background:conic-gradient(var(--gold) calc(var(--p,2)*1%), color-mix(in srgb,var(--gold) 16%,transparent) 0); animation:spin 8s linear infinite}
  .ring::after{content:""; width:23px; height:23px; border-radius:50%; background:var(--fond)}
  .ring i{position:absolute; font-style:normal; font-size:.6rem}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loop .txt b{font-size:.78rem; font-weight:800; color:var(--gold)} .loop .txt small{display:block; font-size:.56rem; color:var(--faint)}
  .pied{margin-top:auto; display:flex; align-items:center; gap:6px; padding-top:.3rem; border-top:1px solid var(--border);
    font-size:.56rem; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); text-decoration:none; cursor:pointer; background:none; border-left:0; border-right:0; border-bottom:0; width:100%; text-align:left}
  .pied:hover{color:var(--cyan)} .pied .grow{flex:1}
  @media (prefers-reduced-motion: reduce){ .dot,.ring{animation:none} }
</style>

<div class="mw">
  <div>
    <div class="h"><span class="ic">🛰️</span><b>DevWatch</b><span class="live"><span class="dot"></span>direct</span></div>
    <div class="repo" id="repo">…</div>
  </div>
  <div class="hero"><span class="v num" id="today">—</span>
    <div class="meta"><span class="l">commits aujourd’hui</span><span class="t" id="trend"></span></div></div>
  <div class="mini">
    <div class="m"><div class="e">⏱️</div><div class="n num" id="hours">—</div><div class="g">cumulé</div></div>
    <div class="m"><div class="e">🏷️</div><div class="n" id="rel">—</div><div class="g">release</div></div>
    <div class="m"><div class="e">🌱</div><div class="n num" id="co2">—</div><div class="g">CO₂e</div></div>
  </div>
  <div class="mevo" id="mevo" title="Évolution des versions"></div>
  <div class="commit" id="commit" hidden><span class="sha" id="csha"></span><span class="msg" id="cmsg"></span></div>
  <div class="loop"><div class="ring" id="ring"><i>💶</i></div>
    <div class="txt"><b id="pct">—</b><small id="fund"></small></div></div>
  <button class="pied" id="pied" type="button"><span class="grow">le suivi complet</span><span id="quota"></span> ↗</button>
</div>

<script>
(function(){
  "use strict";
  var API='/api/v1/devwatch', nf=new Intl.NumberFormat('fr-FR');
  var el=function(id){return document.getElementById(id);};
  function n(v){ return (v==null||isNaN(v))?'—':nf.format(Math.round(v)); }
  function esc(t){ return String(t==null?'':t).replace(/[&<>"]/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c];}); }

  function render(s){
    if(!s || s.warming){ el('repo').textContent=(s&&s.repo&&s.repo.full)||'préchauffage…'; return; }
    el('repo').textContent=(s.repo&&s.repo.full)||'';
    var cad=s.cadence||{}, ar=cad.arrows||{}, e=s.emancipation||{}, f=s.fund||{}, r=s.latest_release, lc=(s.latest_commits||[])[0];
    el('today').textContent = cad.today!=null?cad.today:'—';
    if(ar.weekly){ var w=ar.weekly; el('trend').textContent=(w.dir==='up'?'↗ +':w.dir==='down'?'↘ ':'→ ')+(w.pct||0)+' % / 7 j'; }
    el('hours').textContent=n((e.time||{}).hours)+' h';
    el('rel').textContent=esc(r?r.tag:'—');
    el('co2').textContent=((e.carbon||{}).co2_t!=null?nf.format(e.carbon.co2_t):'—')+' t';
    // Mini bargraphe d'évolution des versions (dernières releases).
    var ev=(s.evolutions||[]).slice(-9);
    el('mevo').innerHTML = ev.map(function(x){
      var h=Math.max(20,(x.weight||26))+'%';
      var cls=(x.type==='major'?'major':x.type==='minor'?'minor':'')+(x.latest?' latest':'');
      return '<i class="'+cls.trim()+'" style="height:'+h+'" title="'+esc(x.tag||'')+'"></i>';
    }).join('');
    if(lc){ el('csha').textContent=lc.sha; el('cmsg').textContent=lc.message; el('commit').hidden=false; }
    var pct=Math.max(0,Math.min(100,f.pct||0));
    el('ring').style.setProperty('--p', Math.max(2,pct));
    el('pct').textContent=n(pct)+' %'; el('pct').style.color=f.seeking?'var(--gold)':'';
    el('fund').textContent='campagne · '+n(f.sponsor_recu)+' € / '+n(f.depenses_cumulees)+' €'+(f.seeking?' · sponsor ?':'');
    var m=s.meta||{}; el('quota').textContent = m.rate_left!=null?('quota '+m.rate_left):'';
  }
  function charge(){
    fetch(API+'/summary',{headers:{'Accept':'application/json'}})
      .then(function(r){return r.ok?r.json():null;}).then(function(s){ if(s) render(s); }).catch(function(){});
  }
  charge(); setInterval(charge, 120000);

  // Clic : ouvrir le suivi complet. Embarqué -> on demande au Hall (sbx:'ouvre');
  // autonome -> navigation directe vers le tableau de bord.
  el('pied').addEventListener('click', function(){
    if(parent!==window){ try{ parent.postMessage({sbx:'ouvre', id:'devwatch'}, '*'); return; }catch(e){} }
    location.href='/devwatch/';
  });

  (function(){ var t=new URLSearchParams(location.search).get('theme');
    if(t==='dark'||t==='light') document.documentElement.setAttribute('data-theme',t); })();
  addEventListener('message',function(ev){ var d=ev.data; if(d&&d.sbx==='theme'&&(d.theme==='dark'||d.theme==='light')) document.documentElement.setAttribute('data-theme',d.theme); });
})();
</script>
