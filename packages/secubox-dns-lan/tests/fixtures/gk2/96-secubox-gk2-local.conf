# Vue LOCALE des services gk2 (#split-horizon).
#
# Sans elle, gitea.gk2.secubox.in — comme tous les autres — resout vers l IP
# PUBLIQUE depuis le reseau local. Or la box ne fait pas de retour en epingle
# sur sa propre adresse publique : le nom est donc injoignable de l interieur,
# alors meme que le service tourne a deux metres. C est ce qui rendait les
# adresses « incorrectes en local » et obligeait a forcer la resolution a la
# main pour chaque test.
#
#  fait porter la reponse a TOUT le sous-domaine : un seul
# enregistrement couvre hall, bbs, radio, admin, gitea et les suivants, sans
# avoir a tenir une liste qui se perimerait au premier service ajoute.
server:
    local-zone: "gk2.secubox.in." redirect
    local-data: "gk2.secubox.in. A 192.168.1.200"
