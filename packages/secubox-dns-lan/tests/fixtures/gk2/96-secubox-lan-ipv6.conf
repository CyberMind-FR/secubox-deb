# DNS du LAN en IPv6 : la Freebox annonce son propre resolveur IPv6 (fd0f:ee:b0::1), qui repond l IP publique pour les noms
# internes (ex. voicestudio.gk3, reserve au LAN). gk2 repond en IPv6 pour que le champ « DNS IPv6 personnalise » de Freebox OS
# puisse le designer. Acces limite au /64 du LAN et au ULA de la Freebox : jamais un resolveur ouvert.
server:
    ip-freebind: yes
    interface: 2a01:e0a:dec:c4e0:f2ad:4eff:fe27:889b
    interface: 2a01:e0a:dec:c4e0::200
    access-control: 2a01:e0a:dec:c4e0::/64 allow
    access-control: fd0f:ee:b0::/64 allow
