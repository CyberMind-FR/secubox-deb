# Studio natif de VoiceStudio : reserve au reseau local (secubox-voicestudio >= 0.5.1). Les postes locaux atteignent la box
# gk3 DIRECTEMENT (sans passer par la box de bordure, son WAF et sa limite de 120 s). Les noms voisins (hall.gk3, admin.gk3…)
# gardent leur resolution publique : seule cette adresse est redirigee.
server:
    local-zone: "voicestudio.gk3.secubox.in." transparent
    local-data: "voicestudio.gk3.secubox.in. 300 IN A 192.168.1.9"
