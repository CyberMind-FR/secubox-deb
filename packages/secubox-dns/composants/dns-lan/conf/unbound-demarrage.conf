# Au démarrage de gk2, ~250 unités démarrent ensemble : Unbound, qui charge les listes du filtrage
# et de la publicité (centaines de milliers de zones), dépassait les 90 s par défaut. systemd le
# tuait puis le relançait : DNS du LAN coupé ~4 min à chaque redémarrage (#2018). Type=notify :
# le délai ne retarde rien, Unbound signale « prêt » dès qu'il a fini.
[Service]
TimeoutStartSec=600
