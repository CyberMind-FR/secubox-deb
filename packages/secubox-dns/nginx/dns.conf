# /etc/nginx/secubox.d/dns.conf
# Installed by secubox-dns package
location /api/v1/dns/ {
    proxy_pass http://unix:/run/secubox/aggregator.sock:/api/v1/dns/;
    include /etc/nginx/snippets/secubox-proxy.conf;
}
