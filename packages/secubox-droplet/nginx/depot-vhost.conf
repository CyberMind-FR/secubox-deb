# SecuBox-Deb :: Droplet — vhost de l'ESPACE DE DEPOT public (#1026).
#
# Servi sur depot.<domaine>, distinct du panneau d'administration :
#
#   admin.<domaine>/droplet/   publication de fichiers, derriere la porte
#                              d'administration
#   depot.<domaine>/           espace de depot, ouvert a des inconnus
#
# LES SEPARER N'EST PAS COSMETIQUE. Ce vhost-ci est le seul de la board qu'on
# ouvre en ECRITURE a n'importe qui. Le faire cohabiter avec l'administration
# ferait qu'une erreur de configuration sur l'un exposerait l'autre.
#
# CE VHOST N'EXPOSE QUE TROIS ROUTES, et jamais l'API complete du module. La
# liste des depots, la publication de sites, la gestion des webhooks restent
# hors d'atteinte ici — elles exigent deja un jeton, mais ne pas les exposer du
# tout est une garde de plus, et celle-la ne depend d'aucune verification.
#
# Ce fichier est active a la main : un vhost demande aussi une entree HAProxy,
# une route WAF et un enregistrement DNS, qu'un paquet ne doit pas decider seul.
server {
    listen 9080;
    server_name depot.gk2.secubox.in;

    # La page de depot, et rien d'autre du repertoire.
    location = / {
        root /usr/share/secubox/www;
        try_files /droplet/depot.html =404;
    }

    # LE DEPOT LUI-MEME. Voir secubox.d/droplet.conf pour le detail des
    # reglages ; ils sont repris ici parce qu'un vhost ne partage pas les
    # `location` d'un autre.
    location = /api/v1/droplet/depot {
        proxy_pass http://unix:/run/secubox/aggregator.sock:/api/v1/droplet/depot;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # LE PROTOCOLE VIENT DE HAPROXY, PAS DE NOUS (#1269). nginx est un
        # hop INTERNE en clair : `$scheme` y vaut toujours « http », et le
        # module en concluait qu'il servait en clair — permaliens en http://,
        # `_secure()` faux, cookies retombes en SameSite=Lax. HAProxy pose
        # l'en-tete sur ses deux frontends, on le transmet tel quel.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection        "";

        # Le defaut nginx est UN megaoctet : sans cette valeur, le premier
        # depot d'une archive serait refuse par nginx avec un 413 que notre
        # code ne verrait jamais passer.
        client_max_body_size 4g;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        client_body_timeout 3600s;
    }

    # Les plafonds, que la page lit pour les annoncer AVANT l'envoi.
    location = /api/v1/droplet/depot/reglages {
        proxy_pass http://unix:/run/secubox/aggregator.sock:/api/v1/droplet/depot/reglages;
        include /etc/nginx/snippets/secubox-proxy.conf;
    }

    # TOUT LE RESTE EST REFUSE. Un prefixe ouvert laisserait passer demain une
    # route ajoutee au module sans qu'on y pense — c'est ainsi qu'une surface
    # publique s'elargit toute seule.
    location / { return 404; }

    access_log /var/log/nginx/depot.gk2_access.log;
    error_log  /var/log/nginx/depot.gk2_error.log;
}
