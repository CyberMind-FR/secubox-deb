# droplet API
location /api/v1/droplet/ {
    proxy_pass http://unix:/run/secubox/aggregator.sock:/api/v1/droplet/;
    include /etc/nginx/snippets/secubox-proxy.conf;
    proxy_intercept_errors on;
}

# L'ESPACE DE DEPOT A SES PROPRES REGLES (#1026).
#
# CE BLOC N'INCLUT PAS `secubox-proxy.conf`, VOLONTAIREMENT. Le snippet fixe
# deja `proxy_http_version`, `proxy_read_timeout` et `proxy_send_timeout` ;
# nginx refuse une directive en double et REJETTE ALORS LA CONFIGURATION
# ENTIERE. Une seule ligne redondante ici empeche tout le serveur de recharger
# — ce qui a ete constate deux fois en posant ce fichier. Les quelques en-tetes
# necessaires sont donc reecrits, et rien de plus.
#
# CORS EST ABSENT, et c'est voulu : la page de depot est servie par la meme
# origine que cette route. Autoriser `*` sur un point d'entree public en
# ecriture permettrait a n'importe quel site de faire deposer un visiteur a son
# insu.
location = /api/v1/droplet/depot {
    proxy_pass http://unix:/run/secubox/aggregator.sock:/api/v1/droplet/depot;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # LE PROTOCOLE VIENT DE HAPROXY, PAS DE NOUS (#1269). nginx est un
        # hop INTERNE en clair : `$scheme` y vaut toujours « http », et le
        # module en concluait qu'il servait en clair — permaliens en http://,
        # `_secure()` faux, cookies retombes en SameSite=Lax. HAProxy pose
        # l'en-tete sur ses deux frontends, on le transmet tel quel.
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header Connection        "";

    # LE DEFAUT NGINX EST UN MEGAOCTET. Sans cette valeur, le premier depot
    # d'une archive serait refuse par nginx avec un 413 que notre code ne
    # verrait jamais passer — et le message d'erreur ne viendrait pas de nous.
    client_max_body_size 4g;

    # ON NE MET PAS LE CORPS EN TAMPON SUR DISQUE AVANT DE LE TRANSMETTRE. Le
    # tampon nginx ecrirait quatre gigaoctets dans /var/lib/nginx avant que
    # notre code ne voie le premier octet : le disque prendrait le depot en
    # double, et le deposant attendrait sans que rien ne progresse.
    proxy_request_buffering off;
    proxy_buffering off;

    # Un televersement lent sur une liaison domestique depasse largement les
    # trois cents secondes du snippet. Expirer au milieu ferait tout
    # recommencer, sur une connexion qui est deja la plus fragile du parcours.
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;
    client_body_timeout 3600s;
}
