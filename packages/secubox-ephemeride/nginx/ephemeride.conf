# Éphéméride : route de l'API sur l'origine d'administration. Le Hall n'inclut PAS secubox-routes.d : sa propre route est
# dans hall.vhost.conf (secubox-webos).
location /api/v1/ephemeride/ {
    proxy_pass http://unix:/run/secubox/ephemeride.sock:/;
    include /etc/nginx/snippets/secubox-proxy.conf;
}
