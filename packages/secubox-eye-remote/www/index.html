<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>SecuBox Eye Remote</title>
    <style>
        body { font-family: 'JetBrains Mono', monospace; background: #0a0a0f; color: #e8e6d9; margin: 20px; }
        .status { padding: 20px; border: 1px solid #c9a84c; border-radius: 8px; margin: 20px 0; }
        .connected { border-color: #00ff41; }
        .disconnected { border-color: #e63946; }
        h1 { color: #c9a84c; }
        .metric { display: inline-block; margin: 10px; padding: 10px; background: #1a1a1f; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>● SecuBox Eye Remote</h1>
    <div id="status" class="status disconnected">
        <h2>Status: <span id="conn-status">Checking...</span></h2>
        <p>Interface: <span id="interface">-</span></p>
        <p>Peer IP: <span id="peer-ip">-</span></p>
        <p>Mode: <span id="gadget-mode">-</span></p>
    </div>
    <div id="metrics">
        <div class="metric">CPU: <span id="cpu">-</span>%</div>
        <div class="metric">MEM: <span id="mem">-</span>%</div>
        <div class="metric">TEMP: <span id="temp">-</span>°C</div>
    </div>
    <script>
        async function refresh() {
            try {
                const r = await fetch('/api/v1/eye-remote/status');
                const d = await r.json();
                document.getElementById('conn-status').textContent = d.connected ? 'Connected' : 'Disconnected';
                document.getElementById('status').className = 'status ' + (d.connected ? 'connected' : 'disconnected');
                document.getElementById('interface').textContent = d.interface || '-';
                document.getElementById('peer-ip').textContent = d.peer_ip || '-';
                document.getElementById('gadget-mode').textContent = d.gadget_mode || '-';
            } catch(e) { console.error(e); }
        }
        setInterval(refresh, 5000);
        refresh();
    </script>
</body>
</html>
