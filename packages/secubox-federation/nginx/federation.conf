# /etc/nginx/secubox-routes.d/federation.conf — fédération SBX (#1389).
#
# Lu par le serveur d'administration seulement. Les écritures (join, renew)
# n'exigent pas de jeton : elles exigent une PREUVE — la signature de la clé
# dont le demandeur réclame l'identité — vérifiée par sbx-certd.
location ^~ /api/federation/ {
    client_max_body_size 32k;
    proxy_pass http://unix:/run/secubox/federation.sock;
    include /etc/nginx/snippets/secubox-proxy.conf;
}
location ^~ /api/cert/ {
    client_max_body_size 32k;
    proxy_pass http://unix:/run/secubox/federation.sock;
    include /etc/nginx/snippets/secubox-proxy.conf;
}
# App Store fédéré (#1391). Distinct de /api/v1/appstore (le catalogue des
# modules) : ici les OBJETS SBX signés — métablogs d'abord. L'installation
# exige un administrateur, vérifié par sbx-certd auprès de secubox-auth.
location ^~ /api/appstore/ {
    client_max_body_size 32k;
    proxy_pass http://unix:/run/secubox/federation.sock;
    include /etc/nginx/snippets/secubox-proxy.conf;
}
