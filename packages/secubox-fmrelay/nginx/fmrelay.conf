# /etc/nginx/secubox.d/fmrelay.conf
# Installed by secubox-fmrelay (#377).
#
# Per MODULE-GUIDELINES.md §4 REQUIRED (dual-vhost):
#   /api/v1/fmrelay/ → host FastAPI on Unix socket
#   /fmrelay/        → SecuBox admin static page (alias). NOT a proxy.
#
# fmrelay has no "real app web UI" of its own — it produces an Icecast
# mount that the webradio module serves and Lyrion ingests. So unlike
# lyrion/grafana/etc, there's no <module>.gk2.secubox.in vhost; the
# admin page's "Open Webradio →" button instead points at the existing
# webradio vhost (URL read from /api/v1/fmrelay/access at runtime).

location /api/v1/fmrelay/ {
    auth_request /__sbx_auth_verify;
    error_page 401 = @sbx_auth_login;
    rewrite ^/api/v1/fmrelay/(.*)$ /$1 break;
    proxy_pass http://unix:/run/secubox/fmrelay.sock;
    include /etc/nginx/snippets/secubox-proxy.conf;
}

# SecuBox admin static page for the FM relay.
location /fmrelay/ {
    auth_request /__sbx_auth_verify;
    error_page 401 = @sbx_auth_login;
    alias /usr/share/secubox/www/fmrelay/;
    index index.html;
    try_files $uri $uri/ /fmrelay/index.html;
}
