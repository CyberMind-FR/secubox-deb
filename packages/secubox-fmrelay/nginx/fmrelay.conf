# /etc/nginx/secubox.d/fmrelay.conf
# Installed by secubox-fmrelay (#377).
#
# Per MODULE-GUIDELINES.md §4 REQUIRED (dual-vhost):
#   /api/v1/fmrelay/ → host FastAPI on Unix socket
#   /fmrelay/        → SecuBox admin static page (alias). NOT a proxy.
#
# fmrelay has no "real app web UI" of its own — it produces an Icecast
# mount that the webradio module serves and Lyrion ingests. So unlike
# lyrion/grafana/etc, there's no <module>.gk2.secubox.in vhost; the
# admin page's "Open Webradio →" button instead points at the existing
# webradio vhost (URL read from /api/v1/fmrelay/access at runtime).

location /api/v1/fmrelay/ {
    auth_request /__sbx_auth_verify;
    error_page 401 = @sbx_auth_login;
    rewrite ^/api/v1/fmrelay/(.*)$ /$1 break;
    proxy_pass http://unix:/run/secubox/aggregator.sock:/api/v1/fmrelay/;
    include /etc/nginx/snippets/secubox-proxy.conf;
}

# HTTPS proxy to the icecast2 mount on 127.0.0.1:8888 so the admin
# webui's <audio> element can play the stream without mixed-content
# blocking (the admin page is served over HTTPS by HAProxy → nginx).
# Auth-gated like everything else on admin.gk2.secubox.in (LAN clients
# are bypassed by /__sbx_auth_verify).
location /fmrelay-stream/ {
    auth_request /__sbx_auth_verify;
    error_page 401 = @sbx_auth_login;
    proxy_pass http://127.0.0.1:8888/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Streaming sanity: disable buffering, drop the default 60s read
    # timeout so a paused player doesn't get bumped, allow ICY headers.
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_pass_request_headers on;
    proxy_ignore_headers X-Accel-Buffering;
}

# SecuBox admin static page for the FM relay.
location /fmrelay/ {
    auth_request /__sbx_auth_verify;
    error_page 401 = @sbx_auth_login;
    alias /usr/share/secubox/www/fmrelay/;
    index index.html;
    try_files $uri $uri/ /fmrelay/index.html;
}
