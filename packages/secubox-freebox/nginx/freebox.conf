# Route du connecteur Freebox (lecture : session ou jeton ; écriture : administrateur).
location /api/v1/freebox/ {
    proxy_pass http://unix:/run/secubox/freebox.sock:/;
    include /etc/nginx/snippets/secubox-proxy.conf;
}
