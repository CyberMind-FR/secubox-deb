# packages/secubox-frigate/conf/frigate.nginx.conf
# Installed into the aggregator/webui nginx config (see secubox-hub sites-enabled)
# alongside the other module location snippets.
#
# secubox-frigate — API shim (local socket) + placeholder UI.
# NOTE: the Frigate UI itself is fronted by gk2 HAProxy → mitmproxy_inspector
# → mesh → amd64 (NO waf_bypass — the whole point is that the Frigate UI is
# WAF-inspected like every other public vhost). This file only serves the
# local shim API + the placeholder page; it does NOT define the public vhost
# or bypass the WAF. See README.md for the gk2-side exposure runbook.

location /api/v1/frigate/ {
    proxy_pass http://unix:/run/secubox/frigate.sock:/api/v1/frigate/;
    include /etc/nginx/snippets/secubox-proxy.conf;
    proxy_intercept_errors on;
}

location /frigate/ {
    alias /usr/share/secubox/www/frigate/;
    index index.html;
    try_files $uri $uri/ /frigate/index.html;
}
