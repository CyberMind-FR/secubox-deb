# /etc/nginx/sites-available/grafana.conf — public vhost grafana.gk2.secubox.in
# Installed by secubox-grafana (dual-vhost split per MODULE-GUIDELINES §4).
#
# Routing:
#   Browser → HAProxy:443 (TLS, cert /data/haproxy/certs/grafana.gk2.secubox.in.pem)
#          → mitmproxy WAF (entry in /srv/mitmproxy/haproxy-routes.json INSIDE the LXC)
#          → nginx:9080 (this vhost)
#          → Grafana LXC at 10.100.0.70:3000
#
# Operator prerequisites (NOT done by this snippet):
#   1. DNS A record grafana.gk2.secubox.in → public IP
#   2. TLS cert in /data/haproxy/certs/grafana.gk2.secubox.in.pem
#   3. haproxyctl vhost add grafana.gk2.secubox.in nginx_vhosts ssl
#   4. mitmproxy route INSIDE the LXC:
#        lxc-attach -n mitmproxy -- python3 -c \
#          "import json; p='/srv/mitmproxy/haproxy-routes.json'; d=json.load(open(p)); \
#           d['grafana.gk2.secubox.in']=['192.168.1.200',9080]; json.dump(d, open(p,'w'), indent=2, sort_keys=True)"
#        lxc-attach -n mitmproxy -- systemctl restart mitmproxy
#
# Grafana inside the LXC MUST be reconfigured: root_url with the new
# domain + `serve_from_sub_path = false` (was true for the /grafana/
# subpath proxy that is now forbidden). See install-lxc.sh.

server {
    listen 0.0.0.0:9080;
    server_name grafana.gk2.secubox.in;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/secubox/www;
        try_files $uri =404;
    }

    sub_filter_types text/html;
    sub_filter_once on;
    sub_filter "</body>" '<script src="/shared/health-banner.js"></script></body>';

    location /shared/ {
        add_header Access-Control-Allow-Origin "*" always;
        alias /usr/share/secubox/www/shared/;
    }

    # Grafana UI proxied to the LXC at root path.
    location / {
        # LAN-only default-deny gate (ex-SSO Authelia décommissionné ;
        # voir zz-sbx-authgate.conf).
        auth_request /__sbx_auth_verify;
        error_page 401 = @sbx_auth_login;

        proxy_pass http://10.100.0.70:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Grafana Live (SSE / WebSocket)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_buffering off;
        proxy_read_timeout 86400;
    }

    # Re-declared per-server because auth_request lives at server scope.
    # LAN-only default-deny — matches zz-sbx-authgate.conf's current
    # (post-Authelia) semantics.
    location = /__sbx_auth_verify {
        internal;
        if ($lan_client) { return 204; }
        return 403;
    }
    location @sbx_auth_login {
        return 403;
    }

    access_log /var/log/nginx/grafana_access.log;
    error_log  /var/log/nginx/grafana_error.log;
}
