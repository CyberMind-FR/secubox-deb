# /etc/nginx/secubox.d/grafana.conf
# Installed by secubox-grafana.
#
# Per MODULE-GUIDELINES.md §4 REQUIRED (dual-vhost):
#   /api/v1/grafana/  → host FastAPI on Unix socket
#   /grafana/         → SecuBox admin static page (alias). NOT a proxy.
#                       Real Grafana UI lives at its own vhost
#                       grafana.gk2.secubox.in (see grafana-vhost.conf).

location /api/v1/grafana/ {
    auth_request /__sbx_auth_verify;
    error_page 401 = @sbx_auth_login;
    rewrite ^/api/v1/grafana/(.*)$ /$1 break;
    proxy_pass http://unix:/run/secubox/aggregator.sock:/api/v1/grafana/;
    include /etc/nginx/snippets/secubox-proxy.conf;
}

# SecuBox admin static page for Grafana. NOT a proxy to the Grafana UI.
location /grafana/ {
    auth_request /__sbx_auth_verify;
    error_page 401 = @sbx_auth_login;
    alias /usr/share/secubox/www/grafana/;
    index index.html;
    try_files $uri $uri/ /grafana/index.html;
}
