# SecuBox Kernel Hardening — sysctl configuration
# ANSSI/CIS Benchmark recommendations for security appliances
# Install: /etc/sysctl.d/99-secubox-hardening.conf

# ══════════════════════════════════════════════════════════════════
# KERNEL SECURITY
# ══════════════════════════════════════════════════════════════════

# Restrict kernel pointer exposure
kernel.kptr_restrict = 2

# Restrict dmesg access to root
kernel.dmesg_restrict = 1

# Restrict perf_event access
kernel.perf_event_paranoid = 3

# Disable kexec (live kernel replacement)
kernel.kexec_load_disabled = 1

# Enable ASLR (Address Space Layout Randomization)
kernel.randomize_va_space = 2

# Restrict core dumps
kernel.core_pattern = |/bin/false
fs.suid_dumpable = 0

# Disable SysRq key (except sync+reboot)
kernel.sysrq = 176

# Restrict unprivileged user namespaces
kernel.unprivileged_userns_clone = 0

# Restrict BPF JIT to root
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2

# Restrict ptrace to direct children only
kernel.yama.ptrace_scope = 1

# ══════════════════════════════════════════════════════════════════
# NETWORK SECURITY — IPv4
# ══════════════════════════════════════════════════════════════════

# Disable IP forwarding (enable only if routing needed)
# Note: SecuBox router modes will override this
net.ipv4.ip_forward = 0

# Disable source routing
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0

# Disable ICMP redirects (we are not a router by default)
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# Enable reverse path filtering (anti-spoofing)
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# Log martian packets (spoofed, source-routed, redirects)
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1

# Ignore ICMP broadcast requests (smurf attack prevention)
net.ipv4.icmp_echo_ignore_broadcasts = 1

# Ignore bogus ICMP error responses
net.ipv4.icmp_ignore_bogus_error_responses = 1

# Enable TCP SYN cookies (SYN flood protection)
net.ipv4.tcp_syncookies = 1

# Disable TCP timestamps (fingerprinting protection)
net.ipv4.tcp_timestamps = 0

# TCP hardening
net.ipv4.tcp_rfc1337 = 1
net.ipv4.tcp_sack = 0

# ══════════════════════════════════════════════════════════════════
# NETWORK SECURITY — IPv6
# ══════════════════════════════════════════════════════════════════

# Disable IPv6 router advertisements
net.ipv6.conf.all.accept_ra = 0
net.ipv6.conf.default.accept_ra = 0

# Disable IPv6 redirects
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0

# Disable IPv6 source routing
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0

# ══════════════════════════════════════════════════════════════════
# FILESYSTEM SECURITY
# ══════════════════════════════════════════════════════════════════

# Restrict access to kernel logs
kernel.printk = 3 3 3 3

# Protect hardlinks and symlinks
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2

# ══════════════════════════════════════════════════════════════════
# MEMORY SECURITY
# ══════════════════════════════════════════════════════════════════

# Restrict mmap to prevent NULL pointer dereference attacks
vm.mmap_min_addr = 65536

# Prevent memory overcommit
vm.overcommit_memory = 0

# ── Épuisement d'états TCP (#3735) ─────────────────────────────────────
# Famille Sockstress (fenêtre nulle tenue indéfiniment), clôtures laissées en FIN_WAIT (côté Windows : MS13-018), TCP
# STOMP de Mirai : chaque connexion que l'autre bout refuse de terminer garde de la mémoire noyau et une entrée de
# suivi. On raccourcit ce que coûte une connexion abandonnée, sans toucher aux connexions vivantes.
net.ipv4.tcp_fin_timeout = 20
# 0 vaut 8 pour le noyau : une socket orpheline (fermée, données non acquittées) n'est relancée que 2 fois.
net.ipv4.tcp_orphan_retries = 2
# Plafond des sockets orphelines : au-delà, le noyau les détruit (« too many orphaned sockets ») au lieu de manquer de
# mémoire (gk2 : 8 Go, 32768 par défaut).
net.ipv4.tcp_max_orphans = 8192
net.ipv4.tcp_max_syn_backlog = 4096
# Suivi des connexions : « - » = ignoré si le module nf_conntrack n'est pas chargé au moment du chargement.
-net.netfilter.nf_conntrack_tcp_timeout_fin_wait = 30
-net.netfilter.nf_conntrack_tcp_timeout_close_wait = 30
-net.netfilter.nf_conntrack_tcp_timeout_last_ack = 30
# 5 jours par défaut : une connexion établie puis muette (STOMP) occupait la table presque une semaine. 1 jour ; une
# connexion vivante (ssh, WireGuard est en UDP) se rafraîchit à chaque paquet.
-net.netfilter.nf_conntrack_tcp_timeout_established = 86400
