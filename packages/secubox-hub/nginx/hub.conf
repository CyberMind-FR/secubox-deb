# /etc/nginx/secubox-routes.d/hub.conf (copie aussi dans secubox.d/, jamais lue)
# Installed by secubox-hub package
#
# Hub API (Phase 7 — agrégateur). Le module `hub` est servi par
# secubox-aggregator (aggregator.toml) ; secubox-hub.service sur :8001 est
# un vestige, désactivé sur gk2. La route vivante pointait encore sur :8001
# → 502 sur tout /api/v1/hub/ après le redémarrage du 2026-09-17.
location /api/v1/hub/ {
    proxy_pass http://unix:/run/secubox/aggregator.sock:/api/v1/hub/;
    include /etc/nginx/snippets/secubox-proxy.conf;
    proxy_intercept_errors on;
}
