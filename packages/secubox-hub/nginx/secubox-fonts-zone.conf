# Zone de cache des polices Google servies par la box (#1875).
# Les navigateurs ne contactent plus Google : ils demandent /cdn/fonts/… au
# vhost, qui sert depuis ce cache (snippets/secubox-fonts.conf).
proxy_cache_path /var/cache/secubox/fonts levels=1:2 keys_zone=sbx_fonts:10m
                 max_size=200m inactive=365d use_temp_path=off;
