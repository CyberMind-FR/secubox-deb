# /etc/nginx/conf.d/secubox-lan-geo.conf
# Shipped by secubox-hub (moved here from the decommissioned ex-SSO IdP package).
#
# Defines $lan_client = 1 for trusted internal networks. Consumed by the
# auth-gate stub in zz-sbx-authgate.conf: LAN/LXC/localhost clients pass the
# gate, everything else is denied (default-deny). The dashboard at
# admin.<host> is auth-free from inside, denied from outside.
#
# Add new internal ranges here (route subnets, VPN pools) — do NOT add public
# IPs.

# Relais de confiance (#1754) : SEULEMENT les adresses propres de la box. Elles sont
# engendrées dans /etc/nginx/conf.d/secubox-real-ip-local.conf par secubox-realip
# (une `set_real_ip_from` par adresse locale, 127.0.0.1 compris), car l'IP LAN
# change d'une box à l'autre. Avant, des plages entières étaient crues
# (192.168.1.0/24, 10.100.0.0/24…) : tout poste de ces plages dictait son adresse,
# donc son verdict $lan_client, par un simple en-tête X-Forwarded-For.
# Le relais réel est HAProxy → sbxwaf → nginx, qui se présente avec une adresse de la box.
set_real_ip_from 127.0.0.1;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

geo $lan_client {
    default        0;
    127.0.0.0/8    1;   # localhost
    192.168.1.0/24 1;   # primary LAN (gk2 / SecuBox dashboards)
    192.168.255.0/24 1; # secondary lan3 segment
    10.55.0.0/24   1;   # eye-br0 bridge (eye-remote / Pi Zero W)
    10.100.0.0/24  1;   # br-lxc (Lyrion / Grafana / ... LXCs)
    10.0.3.0/24    1;   # lxcbr0 (legacy LXC default bridge)
}
