# /etc/nginx/conf.d/secubox-redirect.conf
# Shipped by secubox-hub. http-context → s'applique à TOUS les server{} :9080.
#
# CHAÎNE : Navigateur → HAProxy:443 (TLS 1.3) → sbxwaf → nginx:9080 (clair).
#
# nginx génère automatiquement une redirection quand un chemin de répertoire
# est demandé sans « / » final (ex. /metrics → /metrics/). Avec le défaut
# `absolute_redirect on`, il construit un Location ABSOLU à partir de SA
# propre écoute (http, :9080) — qu'il croit être l'adresse publique :
#
#     GET /metrics  →  301 Location: http://admin.gk2.secubox.in:9080/metrics/
#
# Le navigateur suit alors vers du HTTP EN CLAIR sur le port interne 9080 :
# sortie du HTTPS + fuite du port backend (downgrade de sécurité), et l'URL
# n'est de toute façon pas exposée publiquement → page cassée.
#
# `absolute_redirect off` force un Location RELATIF (« /metrics/ ») : le
# navigateur conserve le schéma + hôte + port d'origine (https://…:443).
# N'affecte QUE les redirections auto-générées ; les `return 301 https://…`
# explicites (SSO, ACME) gardent leur URL absolue telle quelle.
absolute_redirect off;
