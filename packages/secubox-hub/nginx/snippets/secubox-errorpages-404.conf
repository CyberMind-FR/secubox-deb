# Page 404 SecuBox (mire, #3885), a inclure dans un bloc server{} a cote de
# secubox-errorpages.conf.
#
# UNIQUEMENT DANS UN VHOST SANS `proxy_intercept_errors on` (ni au niveau
# server, ni dans une location, ni via secubox-waking.conf ou
# secubox-routes.d/) : avec l'interception, nginx remplacerait le 404 JSON
# d'une API proxifiee par cette page HTML. Sans elle, seuls les 404 produits
# par nginx lui-meme (fichier statique absent) sont habilles.
# Garde : scripts/tests/test_pages_erreur_3885.py.
error_page 404 /_sbx_404.html;
location = /_sbx_404.html { root /etc/secubox/errorpages; internal; try_files /404.html =404; }
