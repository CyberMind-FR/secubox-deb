# Pages d erreur SecuBox, a inclure dans un bloc server{}.
#
# CHAQUE CODE SA PAGE. La version precedente renvoyait 500, 502, 503 ET 504
# vers un unique fichier (_sbx_err_5xx.html, lien vers 503.html) : un visiteur
# voyait « service momentanement arrete » alors que la passerelle avait en
# realite depasse son delai. Les pages existaient, elles n etaient pas servies.
error_page 500 /_sbx_500.html;
error_page 502 /_sbx_502.html;
error_page 503 /_sbx_503.html;
error_page 504 /_sbx_504.html;

# `internal` : joignables par redirection interne seulement, jamais en les
# demandant directement — sinon on ajoute quatre URL publiques inutiles.
location = /_sbx_500.html { root /etc/secubox/errorpages; internal; try_files /500.html =500; }
location = /_sbx_502.html { root /etc/secubox/errorpages; internal; try_files /502.html =502; }
location = /_sbx_503.html { root /etc/secubox/errorpages; internal; try_files /503.html =503; }
location = /_sbx_504.html { root /etc/secubox/errorpages; internal; try_files /504.html =504; }
