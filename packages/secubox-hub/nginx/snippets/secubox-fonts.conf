# Polices Google via le cache de la box (#1875). À inclure dans un server{} :
#   include snippets/secubox-fonts*.conf;
# (joker : un vhost reste valide si le snippet est absent.)
# Pages : href="/cdn/fonts/css/css2?family=…"  (au lieu de fonts.googleapis.com)
location /cdn/fonts/css/ {
    proxy_pass https://fonts.googleapis.com/;
    proxy_ssl_server_name on;
    proxy_set_header Host fonts.googleapis.com;
    # UA fixe : Google varie le CSS selon l'UA ; un seul format (woff2) en cache.
    proxy_set_header User-Agent "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36";
    proxy_set_header Accept-Encoding "";
    proxy_set_header Cookie "";
    proxy_cache sbx_fonts;
    proxy_cache_valid 200 30d;
    proxy_cache_use_stale error timeout updating;
    sub_filter_types text/css;
    sub_filter_once off;
    sub_filter 'https://fonts.gstatic.com/' '/cdn/fonts/s/';
    add_header Cache-Control "public, max-age=86400";
    add_header Access-Control-Allow-Origin "*" always;
}
location /cdn/fonts/s/ {
    proxy_pass https://fonts.gstatic.com/;
    proxy_ssl_server_name on;
    proxy_set_header Host fonts.gstatic.com;
    proxy_set_header Cookie "";
    proxy_cache sbx_fonts;
    proxy_cache_valid 200 365d;
    proxy_cache_use_stale error timeout updating;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Access-Control-Allow-Origin "*" always;
}
