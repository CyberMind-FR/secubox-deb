# /etc/nginx/sites-available/webui.conf
# Installé par le paquet secubox-hub — vhost principal du panneau (#987).
#
# Ce fichier a vécu des mois SUR LA BOARD UNIQUEMENT, empaqueté par personne.
# Il portait donc chaque correctif à la main, et aucun ne survivait à une
# recréation du fichier. Sa version vivante est reprise ici telle quelle : le
# paquet ne change rien au comportement observé, il rend seulement durable ce
# qui existait déjà.
#
# C'est un CONFFILE (chemin sous /etc) : dpkg conserve les modifications
# locales lors d'une mise à jour au lieu de les écraser, et signale la
# divergence. Une modification faite ici sur la board sera donc préservée —
# mais elle doit remonter dans ce fichier, sans quoi elle repart en dérive.
#
# Les routes par module vivent dans /etc/nginx/secubox-routes.d/, inclus en
# fin de bloc serveur : c'est le mécanisme prévu pour qu'un paquet déclare sa
# propre route sans toucher à ce fichier. Préférer TOUJOURS cette voie à
# l'ajout d'une location ici.

# Default server - catches all non-admin domains
server {
    include snippets/secubox-errorpages.conf;
    listen 0.0.0.0:9080 default_server;
    server_name _;
    root /usr/share/secubox/www;

    # Serve wrong-domain page for all requests
    # ACME challenge webroot
    location /.well-known/acme-challenge/ {
        root /usr/share/secubox/www;
        allow all;
    }

    location / {
        try_files /shared/wrong-domain.html =404;
    }

    location /shared/ {
        # CORS for CDN banner injection
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        alias /usr/share/secubox/www/shared/;
    }
}

# Main admin server - only admin.gk2.secubox.in
server {
    include snippets/secubox-errorpages.conf;
    listen 0.0.0.0:9080;
    server_name admin.gk2.secubox.in 192.168.1.200 localhost;
    # Health Banner injection
    sub_filter_types text/html;
    sub_filter_once on;
    sub_filter "</body>" '<script src="/shared/health-banner.js"></script></body>';
    root /usr/share/secubox/www;
    index index.html;

    # LES COPIES DE SAUVEGARDE NE SONT PAS DU CONTENU (#1034).
    #
    # Seize fichiers `.bak` / `.pre*` trainaient sous cette racine et nginx les
    # servait comme n'importe quelle page : `health-banner.js.pre750` et
    # `cookies/index.html.pre749` s'obtenaient en 200 par leur simple nom. Rien
    # ne les listait — rien ne les protegeait non plus. Une copie oubliee est du
    # code d'hier, publie sans qu'on l'ait decide.
    #
    # LE MOTIF EXIGE UN CHIFFRE OU UN TIRET APRES `.pre` : sans cela il
    # attraperait `.presentation`, et une garde qui bloque du vrai contenu est
    # desactivee dans la semaine. Meme raison pour les autres suffixes, ancres
    # en FIN de nom.
    location ~* (?:\.(?:bak|old|orig|save|swp|tmp|rpmsave)(?:[-._][^/]*)?|\.dpkg-(?:old|dist|new|bak)|\.pre[-0-9][^/]*|~)$ {
        deny all;
        return 404;
    }

    # Shared resources - must be accessible for error pages
    location /shared/ {
        # CORS for CDN banner injection
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        alias /usr/share/secubox/www/shared/;
    }

    # Error pages
    # error_page 4xx VOLONTAIREMENT ABSENTE au niveau serveur (#986).
    #
    # Placee ici, elle remplacait le corps de TOUTE reponse 400/401/403 par
    # la page HTML /shared/error.html — y compris celles des routes /api/,
    # servies a des clients XHR. login.html recevait donc du HTML la ou il
    # attendait du JSON : "JSON.parse: unexpected character at line 1
    # column 1". Mesure : l aggregateur renvoyait bien
    # {"detail":"Token Bearer ou session manquant"}, nginx le jetait.
    #
    # proxy_intercept_errors off dans les locations /api/ NE SUFFIT PAS :
    # la substitution avait lieu quand meme. La directive est donc portee
    # par les seules locations de navigation, ci-dessous.
    # error_page 5xx : meme traitement que les 4xx (#990). Au niveau serveur,
    # elle remplacait le corps de TOUTE reponse 5xx par la page HTML — y
    # compris celles des routes /api/. C'est ce qui a masque le vrai defaut du
    # TOTP : un code valide provoquait un 500 (PermissionError sur
    # /etc/secubox), l'utilisateur voyait "JSON.parse: unexpected character" et
    # cherchait du cote de son authentificateur. Une erreur serveur maquillee
    # en erreur de parsing coute des heures de diagnostic.
    #
    # Portee aux locations de navigation, avec les 4xx.

    # API error handler - return JSON for backend errors
    location @api_error {
        default_type application/json;
        return 503 '{"status":"error","code":503,"message":"Service unavailable"}';
    }

    # Clean URL: /login -> /login.html
    location = /login {
        try_files /login.html =404;
    }

    # Revalidate versioned webui assets so a package deploy is picked up
    # immediately (ETag makes revalidation a cheap 304). Fixes stale UI
    # after every module update.
    location ^~ /luci-static/ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        # Page d erreur brandee pour la NAVIGATION seulement (#986) : un
        # humain qui tombe sur un 403 merite une page lisible, un client
        # XHR merite le JSON de l amont.
        error_page 400 401 403 /shared/error.html?code=$status&uri=$uri;
        error_page 500 502 503 504 /shared/error.html?code=$status&uri=$uri;
        try_files $uri $uri/ @fallback;
    }

    # Fallback to unknown-module page for 404
    location @fallback {
        try_files /shared/unknown-module.html =404;
    }

    location /api/ {
        proxy_pass http://unix:/run/secubox/aggregator.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # off (et non on) : ces locations servent des clients XHR. Avec
        # l interception, un 401 de l amont etait remplace par la page HTML
        # /shared/error.html tout en gardant un content-type JSON — d ou le
        # "JSON.parse: unexpected character" sur login.html. L amont renvoie
        # deja un corps JSON correct : on le laisse passer.
        proxy_intercept_errors off;
    }

    # Eye Remote Dashboard static files
    # Eye Remote Mode Control API
    location /eye-remote/mode/ {
        proxy_pass http://10.55.0.2:8081/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /eye-remote/ {
        alias /usr/share/secubox/www/eye-remote/;
        index index.html;
        try_files $uri $uri/ /eye-remote/index.html;
    }

    # Eye Remote API proxy (to pizero-metrics on USB gadget)
    location /api/v1/eye-remote/ {
        proxy_pass http://10.55.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        # off (et non on) : ces locations servent des clients XHR. Avec
        # l interception, un 401 de l amont etait remplace par la page HTML
        # /shared/error.html tout en gardant un content-type JSON — d ou le
        # "JSON.parse: unexpected character" sur login.html. L amont renvoie
        # deja un corps JSON correct : on le laisse passer.
        proxy_intercept_errors off;
    }

    # CrowdSec Dashboard static files
    location /crowdsec/ {
        alias /usr/share/secubox/www/crowdsec/;
        index index.html;
        try_files $uri $uri/ /crowdsec/index.html;
    }

    # CrowdSec API proxy
    location /api/v1/crowdsec/ {
        proxy_pass http://unix:/run/secubox/aggregator.sock:/api/v1/crowdsec/;
        include /etc/nginx/snippets/secubox-proxy.conf;
        # off (et non on) : ces locations servent des clients XHR. Avec
        # l interception, un 401 de l amont etait remplace par la page HTML
        # /shared/error.html tout en gardant un content-type JSON — d ou le
        # "JSON.parse: unexpected character" sur login.html. L amont renvoie
        # deja un corps JSON correct : on le laisse passer.
        proxy_intercept_errors off;
    }

    # SOC Dashboard static files
    location /soc/ {
        alias /usr/share/secubox/www/soc/;
        index index.html;
        try_files $uri $uri/ /soc/index.html;
    }

    location /api/v1/soc/ {
        proxy_pass http://unix:/run/secubox/aggregator.sock:/api/v1/soc/;
        include /etc/nginx/snippets/secubox-proxy.conf;
        # off (et non on) : ces locations servent des clients XHR. Avec
        # l interception, un 401 de l amont etait remplace par la page HTML
        # /shared/error.html tout en gardant un content-type JSON — d ou le
        # "JSON.parse: unexpected character" sur login.html. L amont renvoie
        # deja un corps JSON correct : on le laisse passer.
        proxy_intercept_errors off;
    }

    # ACME Certificate Manager


    # WAF Dashboard static files
    location /waf/ {
        alias /usr/share/secubox/www/waf/;
        index index.html;
        try_files $uri $uri/ /waf/index.html;
    }

    location /api/v1/waf/ {
        rewrite ^/api/v1/waf/(.*)$ /$1 break;
        proxy_pass http://unix:/run/secubox/waf.sock;
        include /etc/nginx/snippets/secubox-proxy.conf;
        # off (et non on) : ces locations servent des clients XHR. Avec
        # l interception, un 401 de l amont etait remplace par la page HTML
        # /shared/error.html tout en gardant un content-type JSON — d ou le
        # "JSON.parse: unexpected character" sur login.html. L amont renvoie
        # deja un corps JSON correct : on le laisse passer.
        proxy_intercept_errors off;
    }
    location /api/v1/picobrew/ {
        rewrite ^/api/v1/picobrew/(.*)$ /$1 break;
        proxy_pass http://unix:/run/secubox/picobrew.sock;
        include /etc/nginx/snippets/secubox-proxy.conf;
    }
    location /api/v1/assist/ {
        rewrite ^/api/v1/assist/(.*)$ /$1 break;
        proxy_pass http://unix:/run/secubox/assist.sock;
        include /etc/nginx/snippets/secubox-proxy.conf;
    }
    location /api/v1/release/ {
        rewrite ^/api/v1/release/(.*)$ /$1 break;
        proxy_pass http://unix:/run/secubox/release.sock;
        include /etc/nginx/snippets/secubox-proxy.conf;
    }
    location /api/v1/ndpid/ {
        proxy_pass http://unix:/run/secubox/ndpid.sock;
        include /etc/nginx/snippets/secubox-proxy.conf;
    }
    location /api/v1/mitmproxy/ {
        proxy_pass http://unix:/run/secubox/mitmproxy.sock;
        include /etc/nginx/snippets/secubox-proxy.conf;
    }

    # System Hub Dashboard static files
    location /system/ {
        alias /usr/share/secubox/www/system/;
        index index.html;
        try_files $uri $uri/ /system/index.html;
    }

    location /api/v1/publish/ {
        proxy_pass http://unix:/run/secubox/aggregator.sock:/api/v1/publish/;
        include /etc/nginx/snippets/secubox-proxy.conf;
    }

    location /api/v1/system/ {
        proxy_pass http://unix:/run/secubox/aggregator.sock:/api/v1/system/;
        include /etc/nginx/snippets/secubox-proxy.conf;
        # off (et non on) : ces locations servent des clients XHR. Avec
        # l interception, un 401 de l amont etait remplace par la page HTML
        # /shared/error.html tout en gardant un content-type JSON — d ou le
        # "JSON.parse: unexpected character" sur login.html. L amont renvoie
        # deja un corps JSON correct : on le laisse passer.
        proxy_intercept_errors off;
    }

    # Metrics Dashboard static files
    location /metrics/ {
        alias /usr/share/secubox/www/metrics/;
        index index.html;
        try_files $uri $uri/ /metrics/index.html;
    }

    location /api/v1/metrics/ {
        proxy_pass http://unix:/run/secubox/metrics.sock:/api/v1/metrics/;
        include /etc/nginx/snippets/secubox-proxy.conf;
        # off (et non on) : ces locations servent des clients XHR. Avec
        # l interception, un 401 de l amont etait remplace par la page HTML
        # /shared/error.html tout en gardant un content-type JSON — d ou le
        # "JSON.parse: unexpected character" sur login.html. L amont renvoie
        # deja un corps JSON correct : on le laisse passer.
        proxy_intercept_errors off;
    }
    # NetBoot (#737) — UI statique + API (socket dédié, app servie à la racine)
    location /netboot/ {
        alias /usr/share/secubox/www/netboot/;
        index index.html;
        try_files $uri $uri/ /netboot/index.html;
    }
    location /api/v1/netboot/ {
        rewrite ^/api/v1/netboot/(.*)$ /$1 break;
        proxy_pass http://unix:/run/secubox/netboot.sock;
        include /etc/nginx/snippets/secubox-proxy.conf;
        # off (et non on) : ces locations servent des clients XHR. Avec
        # l interception, un 401 de l amont etait remplace par la page HTML
        # /shared/error.html tout en gardant un content-type JSON — d ou le
        # "JSON.parse: unexpected character" sur login.html. L amont renvoie
        # deja un corps JSON correct : on le laisse passer.
        proxy_intercept_errors off;
    }


    # Additional API routes
    location /api/v1/wireguard/ {
        proxy_pass http://unix:/run/secubox/aggregator.sock:/api/v1/wireguard/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api/v1/vhost/ {
        proxy_pass http://unix:/run/secubox/aggregator.sock:/api/v1/vhost/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api/v1/haproxy/ {
        proxy_pass http://unix:/run/secubox/aggregator.sock:/api/v1/haproxy/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api/v1/dns/ {
        proxy_pass http://unix:/run/secubox/aggregator.sock:/api/v1/dns/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api/v1/netdata/ {
        proxy_pass http://unix:/run/secubox/aggregator.sock:/api/v1/netdata/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api/v1/dpi/ {
        proxy_pass http://unix:/run/secubox/aggregator.sock:/api/v1/dpi/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api/v1/nac/ {
        proxy_pass http://unix:/run/secubox/aggregator.sock:/api/v1/nac/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api/v1/qos/ {
        proxy_pass http://unix:/run/secubox/aggregator.sock:/api/v1/qos/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api/v1/auth/ {
        proxy_pass http://unix:/run/secubox/auth.sock;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api/v1/glances/ {
        proxy_pass http://unix:/run/secubox/aggregator.sock:/api/v1/glances/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api/v1/health-doctor/ {
        proxy_pass http://unix:/run/secubox/aggregator.sock:/api/v1/health-doctor/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    # Vortex-DNS Dashboard static files
    location /vortex-dns/ {
        alias /usr/share/secubox/www/vortex-dns/;
        index index.html;
        try_files $uri $uri/ /vortex-dns/index.html;
    }

    location /api/v1/vortex-dns/ {
        proxy_pass http://unix:/run/secubox/aggregator.sock:/api/v1/vortex-dns/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Dynamic API routes
    include /etc/nginx/secubox-routes.d/*.conf;
}
