<!-- SecuBox · Appareils (#2212) : liste et fiche d'un appareil, source de vérité = NAC. -->
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecuBox — Appareils</title>
    <link rel="stylesheet" href="/shared/sidebar-light.css">
    <style>
        :root{--fond:#060d1b;--trait:rgba(86,150,255,.22);--trait2:rgba(86,150,255,.38);--texte:#eaf1ff;--doux:#9fb3d6;--faible:#6f84a8;
          --cyan:#29b6f6;--vert:#2ecc71;--rouge:#ff4d5e;--orange:#ff9f1c}
        *{box-sizing:border-box}
        html,body{margin:0;min-height:100%}
        body{background:radial-gradient(1200px 520px at 85% -10%,rgba(59,130,246,.2),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(255,77,94,.10),transparent 60%),var(--fond);
             color:var(--texte);font-family:"IBM Plex Sans","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.3}
        .principal{min-width:0;margin-left:220px;padding-top:48px}
        @media (max-width:900px),(hover:none) and (pointer:coarse){.principal{margin-left:0}}
        body.mobile-mode .principal{margin-left:0}
        .cadre{container-type:inline-size;padding:10px}
        .app{border:1px solid var(--trait2);border-radius:16px;background:linear-gradient(160deg,rgba(15,32,64,.92),rgba(7,15,32,.96));box-shadow:0 0 0 1px rgba(41,182,246,.10),0 0 38px rgba(41,182,246,.08);padding:14px;display:grid;gap:12px;min-width:0}
        .app>*{min-width:0}
        header.page{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px} header.page h1{margin:0;font-size:1.35rem;font-weight:800} .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
        .btn{font:inherit;font-size:.74rem;padding:5px 12px;border-radius:8px;border:1px solid var(--trait2);background:rgba(10,22,46,.7);color:var(--texte);cursor:pointer;text-decoration:none;display:inline-block}
        .btn:hover{border-color:var(--cyan)} .btn:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
        .banner.err,#erreur{border:1px solid var(--rouge);background:rgba(255,77,94,.1);border-radius:10px;padding:8px 12px;font-size:.8rem} [hidden]{display:none!important}
        section{display:grid;gap:8px} section h2{margin:0;font-size:.95rem} .count{color:var(--faible);font-weight:400}
        .grille{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
        .carte{display:flex;flex-direction:column;gap:3px;border:1px solid var(--trait);border-left:3px solid var(--faible);border-radius:10px;padding:9px 11px;background:rgba(8,18,38,.5);color:var(--texte);text-decoration:none;min-width:0}
        a.carte:hover{border-color:var(--cyan)} a.carte:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
        .carte.ok{border-left-color:var(--vert)} .carte.degrade{border-left-color:var(--orange)}
        .carte b{overflow-wrap:anywhere;font-size:.9rem} .carte small,.carte span{color:var(--doux);font-size:.76rem;overflow-wrap:anywhere} .carte .n{font-weight:700}
        .vide{color:var(--faible);font-size:.8rem;padding:6px 2px}
        ul.alertes{list-style:none;margin:0;padding:0;display:grid;gap:6px} ul.alertes li{border:1px solid var(--trait);border-radius:8px;padding:6px 10px;font-size:.8rem;overflow-wrap:anywhere;background:rgba(8,18,38,.5)}
        a{color:var(--cyan)}
    </style>
</head>
<body>
    <nav class="sidebar" id="sidebar"></nav>
    <main class="principal"><div class="cadre"><div class="app">
        <header class="page"><h1 id="titre">📱 Appareils</h1><div class="actions"><a class="btn" href="/apercu/">← Vue d'ensemble</a></div></header>
        <div id="erreur" class="banner err" hidden></div>
        <section id="liste"><h2>Appareils connus <span id="nb" class="count"></span></h2><div id="appareils" class="grille"></div></section>
        <section id="fiche" hidden><h2>Fiche</h2><div id="detail" class="grille"></div><h2>Flux déduits du DNS <span class="count">(6 dernières heures)</span></h2><div id="flux" class="grille"></div><p id="flux-limite" class="vide"></p><h2>Événements récents</h2><ul id="events" class="alertes"></ul><p><a href="#">← Tous les appareils</a></p></section>
    </div></div></main>
    <script src="/shared/sidebar.js"></script>
    <script src="appareil.js" defer></script>
</body>
</html>
