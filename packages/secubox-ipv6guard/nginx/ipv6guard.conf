# Route de l'API IPv6 Guardian pour l'agrégateur / l'administration (secubox-routes.d). Le Hall a la sienne, authentifiée.
location /api/v1/ipv6guard/ {
    proxy_pass http://unix:/run/secubox/ipv6guard.sock:/;
    include /etc/nginx/snippets/secubox-proxy.conf;
}
