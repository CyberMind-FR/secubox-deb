# /etc/nginx/sites-available/jellyfin.conf — Jellyfin media server public vhost
# Installed by secubox-jellyfin. Symlinked into sites-enabled by the postinst.
#
# Public chain — Browser → HAProxy:443 (TLS1.3, cert) → sbxwaf(:8085) →
# nginx:9080 (jellyfin.gk2.secubox.in) → Jellyfin LXC :8096. Operator wires the
# HAProxy SNI ACL + ACME cert + the WAF route in haproxy-routes.json separately
# (CLAUDE.md convention; mirrors lyrion/peertube).
#
# Jellyfin uses absolute asset paths, so it MUST live at the vhost root — never
# proxy it under a subpath. WebSocket upgrade is forwarded for live playback
# session events.
server {
    listen 0.0.0.0:9080;
    server_name jellyfin.gk2.secubox.in;

    # ACME HTTP-01 challenge — outside any gate so LE renewals work from the
    # public internet. MUST come before the catch-all proxy.
    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/secubox/www;
        try_files $uri =404;
    }

    # Health-banner injection (consistent with sibling vhosts).
    sub_filter_types text/html;
    sub_filter_once on;
    sub_filter "</body>" '<script src="/shared/health-banner.js"></script></body>';

    # Shared assets — banner JS, error pages (LAN-only for consistency).
    location /shared/ {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        add_header Access-Control-Allow-Origin "*" always;
        alias /usr/share/secubox/www/shared/;
    }

    # Jellyfin web UI + API proxied to the LXC at root.
    location / {
        proxy_pass http://10.100.0.170:8096;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # WebSocket upgrade for Jellyfin live session / playback events.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    access_log /var/log/nginx/jellyfin_access.log;
    error_log  /var/log/nginx/jellyfin_error.log;
}
