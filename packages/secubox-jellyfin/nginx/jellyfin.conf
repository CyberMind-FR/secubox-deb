# /etc/nginx/secubox.d/jellyfin.conf + /etc/nginx/secubox-routes.d/jellyfin.conf
# Installed by secubox-jellyfin.
#
#   /api/v1/jellyfin/ → host FastAPI on its OWN Unix socket
#                       (/run/secubox/jellyfin.sock — secubox-jellyfin.service),
#                       used by the admin webui JS.
#
#                       INVARIANT — jellyfin is a DEDICATED-socket module and
#                       must NOT be folded into the secubox-aggregator: its API
#                       (a) sudo's the root jellyfinctl actuator (needs
#                       NoNewPrivileges=no, which the aggregator does not grant)
#                       and (b) runs a startup background /status cache task
#                       (mounted sub-apps get no lifespan on the aggregator).
#
#   /jellyfin/        → SecuBox admin static page (alias). NOT a proxy to the
#                       Jellyfin web UI. The real media UI lives at its own
#                       vhost jellyfin.gk2.secubox.in (see
#                       /etc/nginx/sites-available/jellyfin.conf) where Jellyfin
#                       serves at the root path so its absolute asset URLs work.

location /api/v1/jellyfin/ {
    rewrite ^/api/v1/jellyfin/(.*)$ /$1 break;
    proxy_pass http://unix:/run/secubox/jellyfin.sock;
    include /etc/nginx/snippets/secubox-proxy.conf;
}

# SecuBox admin webui for Jellyfin. Static HTML + JS calling /api/v1/jellyfin/
# for status/partners and a prominent link to the real media UI at the
# dedicated subdomain. NOT a proxy to Jellyfin.
location /jellyfin/ {
    alias /usr/share/secubox/www/jellyfin/;
    index index.html;
    try_files $uri $uri/ /jellyfin/index.html;
}
