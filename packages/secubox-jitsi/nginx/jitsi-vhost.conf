# SecuBox Jitsi — vhost public, servi par le nginx de l'HÔTE.
#
# Installé par le paquet dans /etc/nginx/sites-available/ et lié depuis
# sites-enabled/ par le postinst. Empaqueté délibérément plutôt qu'écrit à la
# main : une route posée à la main disparaît à la réinstallation du paquet, et
# personne ne s'en aperçoit avant la panne.
#
# Chaîne : HAProxy (TLS public) -> ce vhost (:9080) -> nginx DU CONTENEUR (:443).
#
# POURQUOI :443 ET NON :80. Le vhost que génère jitsi-meet dans le conteneur
# n'écoute en clair que pour rediriger en 301 vers https ; l'application n'est
# servie que sur :443. On pourrait neutraliser cette redirection, mais ce
# fichier est généré par le paquet jitsi-meet et serait réécrit à sa prochaine
# mise à jour — exactement la classe de dérive qu'on passe son temps à réparer
# ici. On proxifie donc vers son :443, certificat auto-signé compris.
#
# proxy_ssl_verify off : le certificat du conteneur est auto-signé, et il n'y a
# rien à vérifier — le saut se fait sur un bridge local entre deux processus de
# la même machine. Le vrai certificat est présenté par HAProxy, en amont.

map $http_upgrade $jitsi_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 0.0.0.0:9080;
    server_name meet.gk2.secubox.in meet.maegia.tv;

    # ACME HTTP-01 — hors de tout proxy, pour que les renouvellements
    # aboutissent depuis l'internet public. DOIT précéder le catch-all.
    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/secubox/www;
        try_files $uri =404;
    }

    location / {
        proxy_pass https://10.100.0.190;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Jitsi est INTÉGRALEMENT WebSocket : la signalisation XMPP passe par
        # /xmpp-websocket, et sans la mise à niveau la page se charge puis
        # reste inerte — aucune conférence ne se forme. Le map ci-dessus évite
        # d'envoyer `Connection: upgrade` sur les requêtes ordinaires.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $jitsi_connection_upgrade;

        # Une conférence tient une WebSocket ouverte aussi longtemps qu'elle
        # dure. Le défaut de 60 s la couperait en pleine réunion.
        proxy_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    access_log /var/log/nginx/jitsi_access.log;
    error_log  /var/log/nginx/jitsi_error.log;
}
