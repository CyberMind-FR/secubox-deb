# Kiosque distant (#3330) : webapp statique de l'administration du maître, derrière HAProxy -> sbxwaf -> nginx comme le reste.
# Aucun script ni style intégré : CSP stricte, même origine seulement (les API sont celles du maître, /api/v1/...).
# add_header dans une location annule l'héritage du server : tout le jeu est reposé ici.
location ^~ /kiosque/ {
    root /usr/share/secubox/www;
    index index.html;
    try_files $uri $uri/ =404;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-cache" always;
    location ~ /\. { return 404; }
    location = /kiosque/manifest.webmanifest {
        root /usr/share/secubox/www;
        default_type application/manifest+json;
        add_header Content-Security-Policy "default-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache" always;
    }
}
