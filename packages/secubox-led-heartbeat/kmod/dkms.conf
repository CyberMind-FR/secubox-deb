# DKMS du pilote leds-is31fl319x (LED RGB IS31FL3199 du MOCHAbin) : le noyau
# Debian stock n'active pas CONFIG_LEDS_IS31FL319X (#3290).
# @VERSION@ est remplacé au build du paquet (debian/rules) par la version amont
# de secubox-led-heartbeat ; les sources sont installées dans
# /usr/src/secubox-leds-<version>/.
# Ne s'ajoute à DKMS que sur un MOCHAbin (secubox-led-dkms, appelé par le postinst).

PACKAGE_NAME="secubox-leds"
PACKAGE_VERSION="@VERSION@"
BUILT_MODULE_NAME[0]="leds-is31fl319x"
DEST_MODULE_LOCATION[0]="/updates/dkms"
MAKE[0]="make KVER=${kernelver} KDIR=${kernel_source_dir}"
CLEAN="make KDIR=${kernel_source_dir} clean"
AUTOINSTALL="yes"
