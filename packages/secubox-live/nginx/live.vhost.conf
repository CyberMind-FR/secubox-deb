# live.<domaine> — page PUBLIQUE de l'état du réseau (#3351). Exposé par HAProxy -> sbxwaf -> nginx:9080.
# Lecture seule : la page, ses fichiers et UNE route d'API (l'état agrégé, sans adresse). Derrière sbxwaf, l'adresse
# vue ici est celle du relais : la limite est donc globale (le fichier ne change qu'une fois par minute).
limit_req_zone $binary_remote_addr zone=secubox_live:1m rate=600r/m;

server {
    include snippets/secubox-errorpages.conf;
    listen 9080;
    server_name live.*;

    if ($http_x_forwarded_proto = "http") { return 301 https://$host$request_uri; }

    root /usr/share/secubox/www/live;

    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /             { try_files /index.html =404; }
    location = /index.html   { try_files /index.html =404; }
    location = /live.css     { try_files /live.css =404; }
    location = /live.js      { try_files /live.js =404; }
    location = /carte.js     { try_files /carte.js =404; }

    location = /api/v1/live/etat {
        limit_req zone=secubox_live burst=100 nodelay;
        limit_except GET { deny all; }
        proxy_pass http://unix:/run/secubox/live.sock:/etat;
        proxy_set_header Host $host;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_hide_header Set-Cookie;
    }

    location / { return 404; }
}
