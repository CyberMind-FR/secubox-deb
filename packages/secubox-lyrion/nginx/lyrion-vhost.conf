# /etc/nginx/sites-available/lyrion.conf — Lyrion Music Server vhost
# Installed by secubox-lyrion (#248). Operator enables with:
#   ln -s ../sites-available/lyrion.conf /etc/nginx/sites-enabled/
#   systemctl reload nginx
#
# Two server blocks:
#   1. LAN direct (port 9000) — http://192.168.1.200:9000/ → LXC
#      No TLS, no WAF. For internal use only.
#   2. Public chain (port 9080) — Browser → HAProxy:443 (cert) → mitmproxy WAF
#      → nginx:9080 (lyrion.gk2.secubox.in) → LXC. Operator wires cert + HAProxy
#      ACL + mitmproxy route separately (see #246 yacy for the recipe).
#
# Lyrion Music Server uses absolute paths internally (/skin/EN/..., /html/..., …)
# so it MUST live at vhost root — never proxy it under a subpath without
# rewriting the assets, or skins will 404 / 502.
#
# Player support (Squeezelite, iPeng, …) needs slimproto on TCP:3483. That is
# OUTSIDE this nginx vhost — operator adds nftables DNAT 192.168.1.200:3483 →
# 10.100.0.100:3483 (and matching FORWARD rule for the LXC bridge).

# ── 1. LAN direct (no TLS) ─────────────────────────────────────────────────
server {
    listen 0.0.0.0:9000;
    server_name 192.168.1.200 lyrion.local localhost _;

    # Shared assets — banner JS, error pages
    location /shared/ {
        add_header Access-Control-Allow-Origin "*" always;
        alias /usr/share/secubox/www/shared/;
    }

    # LMS web UI proxied to the LXC at root
    location / {
        proxy_pass http://10.100.0.100:9000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    access_log /var/log/nginx/lyrion_lan_access.log;
    error_log  /var/log/nginx/lyrion_lan_error.log;
}

# ── 2. Public lyrion.gk2.secubox.in (via HAProxy + mitmproxy) ──────────────
#
# IMPORTANT: LMS has no auth of its own (protectSettings was disabled in
# #248). The LAN-only default-deny gate below is the only protection —
# internet visitors (non-LAN) are refused (403).
#
# acme-challenge is exempt from the gate (its own location block above the
# gated `/`) so Let's Encrypt renewals can hit it from outside.
server {
    listen 0.0.0.0:9080;
    server_name lyrion.gk2.secubox.in;

    # ACME HTTP-01 challenge — outside the LAN gate so renewals work from
    # the public internet. MUST come before the catch-all proxy.
    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/secubox/www;
        try_files $uri =404;
    }

    # Health Banner injection (consistent with sibling vhosts).
    sub_filter_types text/html;
    sub_filter_once on;
    sub_filter "</body>" '<script src="/shared/health-banner.js"></script></body>';

    # Shared assets — banner JS, error pages (LAN-only for consistency)
    location /shared/ {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        add_header Access-Control-Allow-Origin "*" always;
        alias /usr/share/secubox/www/shared/;
    }

    # LMS web UI proxied to the LXC at root. LAN-only default-deny gate
    # (ex-SSO Authelia décommissionné ; voir zz-sbx-authgate.conf).
    location / {
        auth_request /__sbx_auth_verify;
        error_page 401 = @sbx_auth_login;

        proxy_pass http://10.100.0.100:9000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Re-declared per-server because auth_request lives at server scope.
    # LAN-only default-deny — matches zz-sbx-authgate.conf's current
    # (post-Authelia) semantics.
    location = /__sbx_auth_verify {
        internal;
        if ($lan_client) { return 204; }
        return 403;
    }
    location @sbx_auth_login {
        return 403;
    }

    access_log /var/log/nginx/lyrion_access.log;
    error_log  /var/log/nginx/lyrion_error.log;
}
