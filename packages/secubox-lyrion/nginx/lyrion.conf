# /etc/nginx/secubox.d/lyrion.conf + /etc/nginx/secubox-routes.d/lyrion.conf
# Installed by secubox-lyrion (#244)
#
# Authelia exposes:
#   /api/v1/lyrion/   → host FastAPI on Unix socket (CTL surface + /verify)
#   /lyrion/              → LXC at 10.100.0.100:9000 (native Authelia portal UI)
#
# The public vhost auth.maegia.tv lives in /etc/nginx/sites-available/lyrion.conf
# (separate file) so the canonical hub vhost only carries the /lyrion/ subpath.

location /api/v1/lyrion/ {
    rewrite ^/api/v1/lyrion/(.*)$ /$1 break;
    proxy_pass http://unix:/run/secubox/lyrion.sock;
    include /etc/nginx/snippets/secubox-proxy.conf;
}

# Lyrion Music Server web UI (LXC :9000). LMS has no authentication of
# its own (protectSettings disabled in #248 to make settings reachable
# behind nginx reverse-proxy), so this location is LAN-only.
#
# Internet visitors hitting the canonical hub vhost get 403; LAN clients
# (127.0.0.1 + RFC1918) get full access.
#
# When secubox-authelia v1.0.2+ implements /verify properly, replace the
# allow/deny with `auth_request /__sbx_auth_verify;`. The block below is
# ready for that swap.
location /lyrion/ {
    # Will be re-enabled with secubox-authelia v1.0.2+ /verify:
    #   auth_request /__sbx_auth_verify;
    #   error_page 401 = @sbx_auth_login;
    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;

    proxy_pass http://10.100.0.100:9000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_read_timeout 300s;

    # Health-banner injection on the SSO login page (per #244 spec).
    sub_filter_types text/html;
    sub_filter_once on;
    sub_filter "</body>" '<script src="/shared/health-banner.js"></script></body>';
}

