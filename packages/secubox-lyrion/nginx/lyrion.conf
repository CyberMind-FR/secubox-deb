# /etc/nginx/secubox.d/lyrion.conf + /etc/nginx/secubox-routes.d/lyrion.conf
# Installed by secubox-lyrion.
#
# Two distinct surfaces on the canonical hub vhost (admin.gk2.secubox.in):
#
#   /api/v1/lyrion/   → host FastAPI on its OWN Unix socket
#                       (/run/secubox/lyrion.sock — secubox-lyrion.service),
#                       CTL: status, players, now-playing, scan trigger.
#                       Used by the admin page JS below.
#
#                       INVARIANT — lyrion is a DEDICATED-socket module and
#                       must NOT be folded into the secubox-aggregator. Its
#                       now-playing/players handlers do blocking LMS JSON-RPC
#                       on every request; on the shared ~110-module aggregator
#                       event loop a slow LMS call wedges the whole gateway
#                       (board-wide 502 SPOF, #763). Mirrors auth/metrics.
#                       secubox-aggregator-migrate keeps lyrion in its
#                       EXCLUDE list so a migrate run won't re-point this
#                       route at aggregator.sock.
#   /lyrion/          → SecuBox admin static page (alias). NOT a proxy to
#                       the LMS web UI. The real music UI lives at its own
#                       vhost lyrion.gk2.secubox.in (LAN-only gate via
#                       /etc/nginx/sites-available/lyrion.conf). That
#                       vhost serves LMS at its root path so the Material
#                       skin's absolute asset URLs (/material/, /cometd/,
#                       /css/, /js/) work — reverse-proxying LMS under a
#                       subpath silently breaks all of those (#244 history).
#
# auth_request gates BOTH endpoints behind the shared LAN-only default-deny
# stub (/__sbx_auth_verify + @sbx_auth_login de zz-sbx-authgate.conf) —
# ex-SSO retiré.

# SERVI PAR L'AGREGATEUR, PAS PAR LE SOCKET DU MODULE. `lyrion` est
# `on-demand` et son unite dort ; la route vers `lyrion.sock` rendait donc 502
# des que la page d'admin l'interrogeait, sans rien pour la reveiller (le
# waker ne reveille que sur les vhosts de sites). L'agregateur, lui, repond
# toujours — et sans allumer le LXC, qui n'a pas a l'etre pour afficher un
# etat. Le `rewrite` disparait avec le socket : l'agregateur attend le chemin
# COMPLET, c'est lui qui demultiplexe.
location /api/v1/lyrion/ {
    auth_request /__sbx_auth_verify;
    error_page 401 = @sbx_auth_login;
    proxy_pass http://unix:/run/secubox/aggregator.sock:/api/v1/lyrion/;
    include /etc/nginx/snippets/secubox-proxy.conf;
}

# SecuBox admin webui for Lyrion. Static HTML + JS calling /api/v1/lyrion/
# for status and a prominent link to the real music UI at the dedicated
# subdomain. NOT a proxy to LMS.
location /lyrion/ {
    auth_request /__sbx_auth_verify;
    error_page 401 = @sbx_auth_login;

    alias /usr/share/secubox/www/lyrion/;
    index index.html;
    try_files $uri $uri/ /lyrion/index.html;
}
