location /api/v1/magicmirror/ { proxy_pass http://unix:/run/secubox/aggregator.sock:/api/v1/magicmirror/; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
location /magicmirror/ { alias /usr/share/secubox/www/magicmirror/; try_files $uri $uri/ /magicmirror/index.html; }
