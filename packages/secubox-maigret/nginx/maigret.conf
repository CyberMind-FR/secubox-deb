# /etc/nginx/secubox.d/maigret.conf
# Installed by secubox-maigret package
#
# Auth-gated with the shared SecuBox auth stub (`/__sbx_auth_verify` +
# `@sbx_auth_login`, shipped by secubox-hub: LAN passes, else denied). The API
# is ALSO JWT-gated in the app (require_jwt) — this is defense-in-depth and
# matches the peer pattern (fmrelay/grafana).

# Maigret web frontend (management panel)
location /maigret/ {
    auth_request /__sbx_auth_verify;
    error_page 401 = @sbx_auth_login;
    alias /usr/share/secubox/www/maigret/;
    index index.html;
    try_files $uri $uri/ /maigret/index.html;
}

# Maigret API
location /api/v1/maigret/ {
    auth_request /__sbx_auth_verify;
    error_page 401 = @sbx_auth_login;
    proxy_pass http://unix:/run/secubox/maigret.sock:/;
    include /etc/nginx/snippets/secubox-proxy.conf;
}
