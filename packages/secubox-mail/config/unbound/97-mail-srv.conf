# Task 11 (#1169) — empaquetage de la dérive board-only : SRV mail en
# split-horizon Unbound (RFC 6186 client autodiscovery). Fichier DÉDIÉ,
# distinct du drop-in split-horizon principal du board : ne jamais les
# fusionner — ce drop-in est posé/retiré indépendamment par ce paquet, et
# doit rester additif (Unbound charge tout unbound.conf.d/*.conf, l'ordre
# n'importe pas entre fichiers distincts).
server:
    local-data: "_imaps._tcp.secubox.in. 3600 IN SRV 0 1 993 mail.secubox.in."
    local-data: "_submission._tcp.secubox.in. 3600 IN SRV 0 1 587 mail.secubox.in."
    local-data: "_submissions._tcp.secubox.in. 3600 IN SRV 0 1 465 mail.secubox.in."
    local-data: "_pop3s._tcp.secubox.in. 3600 IN SRV 0 1 995 mail.secubox.in."
