# Task 11 (#1169) — empaquetage de la dérive board-only : autoconfig
# RFC 6186 (Thunderbird & co). Trois chemins servent le MÊME fichier :
# le chemin "board" historique (/autoconfig/config-v1.1.xml, déjà en
# place avant l'empaquetage), le chemin RÉELLEMENT servi en production
# (/mail/config-v1.1.xml — revue finale #1169, tidy 4 : le snippet packagé
# divergeait de l'URL vivante du board) et le chemin standard RFC 6186
# (/.well-known/autoconfig/mail/config-v1.1.xml) que les clients mail
# interrogent par défaut sur le domaine principal.
location /autoconfig/ {
    alias /usr/share/secubox/www/autoconfig/;
    default_type application/xml;
}

location = /mail/config-v1.1.xml {
    default_type application/xml;
    alias /usr/share/secubox/www/autoconfig/config-v1.1.xml;
}

location = /.well-known/autoconfig/mail/config-v1.1.xml {
    alias /usr/share/secubox/www/autoconfig/config-v1.1.xml;
    default_type application/xml;
}
