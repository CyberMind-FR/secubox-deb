# mail API — composant VITAL, INDÉPENDANT de l'agrégateur (#1173).
# On route vers le service dédié `mail.sock` plutôt que l'agrégateur in-process :
# ce dernier sert ~110 modules sur une seule boucle (SPOF + congestion) et garde
# une copie PÉRIMÉE des routes tant qu'il n'a pas redémarré — d'où des 404 sur les
# endpoints fraîchement livrés. `mail.sock` (secubox-mail.service) est toujours à
# jour (redémarré avec le paquet).
#
# `mail.sock` sert à la RACINE (/status, /socle/status…) : on strippe le préfixe
# /api/v1/mail via l'URI du proxy_pass (« :/ »), comme nextcloud.conf.
#
# Résilient à désactivation/désinstallation : service arrêté → socket absente →
# nginx renvoie un 502 propre (la conf reste valide, `nginx -t` passe) ; paquet
# retiré → dpkg supprime ce snippet et /api/v1/mail retombe sur l'agrégateur.
location /api/v1/mail/ {
    proxy_pass http://unix:/run/secubox/mail.sock:/;
    include /etc/nginx/snippets/secubox-proxy.conf;
    proxy_intercept_errors on;
}
