# Module antivirus Rspamd — déposé UNIQUEMENT quand `mailctl antivirus on`
# (drapeau [mail.antivirus].enabled, off par défaut). `mailctl antivirus off`
# retire ce fichier ; son absence désactive le module sans autre action.
#
# clamd ne vit PAS dans ce conteneur (budget mémoire de 384 Mo, #496) : il tourne dans le LXC
# `clamav` du paquet secubox-clamav (#1912), endormi tant que personne n'en a besoin. Rspamd
# parle au mandataire de l'hôte (10.100.0.1:3310), qui réveille le LXC à la première connexion
# et le rendort après 10 min d'inactivité.
# ATTENTION : ne PAS entourer de `antivirus { … }`. Un fichier local.d/<module>.conf est déjà
# fusionné DANS la section du module ; l'envelopper donne `antivirus { antivirus { … } }`, que
# Rspamd lit comme un scanner nommé « antivirus » (« unknown antivirus type: antivirus », « cannot
# add rule ») et le module est alors désactivé EN SILENCE — c'était le cas de ce gabarit.
clamav {
  type = "clamav";
  servers = "10.100.0.1:3310";
  # Démarrage à froid du LXC (base comprise) : jusqu'à ~90 s pour le premier message après un
  # long repos. Les suivants répondent en quelques centaines de millisecondes.
  timeout = 120.0;
  max_size = 50000000;
  # ÉCHEC DU SCANNER = LAISSER PASSER, MAIS VISIBLEMENT : le symbole CLAM_VIRUS_FAIL est posé
  # sur le message (en-têtes de diagnostic, statistiques). Jamais une perte silencieuse.
  # Pour refuser plutôt que laisser passer : force_actions sur CLAM_VIRUS_FAIL (docs).
  symbol = "CLAM_VIRUS";
  action = "reject";
  log_clean = false;
}
