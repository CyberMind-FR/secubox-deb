# Phase 2: single domain (secubox.in / default). Phase 3 widens via selector_map.
allow_username_mismatch = true;
try_fallback = true;
sign_local = true;
sign_authenticated = true;
selector = "default";
path = "/etc/rspamd-keys/$domain/$selector.key";
