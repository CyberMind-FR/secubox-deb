# Ajoute X-Spam-Status: Yes/No (compatible SpamAssassin) sur le mail scoré par
# Rspamd, consommé par le sieve par défaut du socle (#1169) pour ranger le spam
# dans Junk. x-spam-level ajoute les astérisques, x-spamd-result le détail.
use = ["x-spam-status", "x-spam-level", "x-spamd-result", "authentication-results"];
authenticated_headers = ["authentication-results"];
