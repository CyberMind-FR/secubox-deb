# SecuBox-Deb :: Mastodon — vhost de l'instance federee.
#
# LIVRE MAIS NON ACTIVE : activer un vhost demande aussi une entree HAProxy et
# un enregistrement DNS, qu'un paquet ne decide pas seul.
#
# La federation est bavarde : les autres instances poussent des messages en
# continu. Les delais et tailles ci-dessous ne sont pas du confort, ils evitent
# des echecs qui se traduiraient chez les autres par « votre instance ne repond
# plus ».
server {
    listen 9080;
    server_name social.gk2.secubox.in;

    client_max_body_size 80m;      # televersements de medias
    keepalive_timeout 70;

    location / {
        proxy_pass http://10.100.0.200:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # `https` EN DUR, PAS $scheme. Ce vhost ecoute en clair sur 9080
        # derriere HAProxy, qui termine le TLS : $scheme vaut donc `http`, et
        # Mastodon repond alors par une redirection permanente vers HTTPS —
        # une boucle qui ne se voit qu'a l'usage.
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 90s;
    }

    # Le flux temps reel est en WebSocket : sans ces deux en-tetes la connexion
    # est fermee par nginx et le fil ne se met plus a jour tout seul.
    location /api/v1/streaming {
        proxy_pass http://10.100.0.200:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
    }
}
