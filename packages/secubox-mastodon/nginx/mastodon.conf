# SecuBox-Deb :: Mastodon — route de l'agregateur.
#
# Seule l'API du module passe ici : le panneau est servi en statique, et
# l'instance elle-meme vit sur SON vhost (voir conf/mastodon.nginx.conf).
location /api/v1/mastodon/ {
    proxy_pass http://unix:/run/secubox/mastodon.sock:/api/v1/mastodon/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}
