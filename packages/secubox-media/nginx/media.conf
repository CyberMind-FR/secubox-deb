# /etc/nginx/secubox.d/media.conf + /etc/nginx/secubox-routes.d/media.conf
# Installé par secubox-media. La route va dans les DEUX répertoires : seul
# secubox-routes.d est inclus par le vhost principal (#989).
location /api/v1/media/ {
    proxy_pass http://unix:/run/secubox/media.sock:/;
    include /etc/nginx/snippets/secubox-proxy.conf;
}
