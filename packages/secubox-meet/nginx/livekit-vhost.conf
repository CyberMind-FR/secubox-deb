# SecuBox Meet — vhost public livekit.<domaine> (signalisation LiveKit),
# servi par le nginx de l'HÔTE.
#
# Chaîne : HAProxy (TLS public) -> sbxwaf -> ce vhost (:9080) -> LiveKit du
# conteneur (:7880). Seule la SIGNALISATION (WebSocket) passe ici ; les médias
# circulent en 7881/TCP et 7882/UDP, ouverts par une décision explicite
# (meetctl media-expose), jamais par l'installation du paquet.

map $http_upgrade $livekit_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 9080;
    # Joker : aucun nom propre à une box n'est livré.
    server_name livekit.*;

    # Pages d'erreur SecuBox quand le conteneur est arrêté ou en cours de provisionnement (502/503/504 produits par
    # nginx lui-même), au lieu de la page nginx par défaut. Pas de proxy_intercept_errors : les erreurs renvoyées par
    # Meet ou LiveKit (JSON de l'API) passent telles quelles.
    include snippets/secubox-errorpages.conf;

    # ACME HTTP-01 — hors de tout proxy.
    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/secubox/www;
        try_files $uri =404;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://10.100.0.195:7880;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $livekit_connection_upgrade;

        # Une réunion tient sa WebSocket ouverte aussi longtemps qu'elle dure.
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    access_log /var/log/nginx/livekit_access.log;
    error_log  /var/log/nginx/livekit_error.log;
}
