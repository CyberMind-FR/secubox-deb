# /etc/nginx/secubox-routes.d/meet.conf — installé par secubox-meet.
# API de l'hôte (état, exposition des médias) sur /run/secubox/meet.sock, et
# page d'administration /meet/.
location /api/v1/meet/ {
    rewrite ^/api/v1/meet/(.*)$ /$1 break;
    proxy_pass http://unix:/run/secubox/meet.sock;
    include /etc/nginx/snippets/secubox-proxy.conf;
    proxy_intercept_errors on;
}

location /meet/ {
    alias /usr/share/secubox/www/meet/;
    try_files $uri $uri/ /meet/index.html;
}
