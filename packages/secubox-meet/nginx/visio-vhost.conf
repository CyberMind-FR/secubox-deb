# SecuBox Meet — vhost public visio.<domaine>, servi par le nginx de l'HÔTE.
#
# Installé par le paquet dans /etc/nginx/sites-available/visio.conf et lié depuis
# sites-enabled/ par le postinst.
# Chaîne : HAProxy (TLS public) -> sbxwaf -> ce vhost (:9080) -> nginx DU CONTENEUR (:80).
#
# Le nginx du conteneur sert le front de Meet et relaie /api/ vers son backend
# Django. Django impose https (SECURE_SSL_REDIRECT) : il se fie à l'en-tête
# X-Forwarded-Proto, posé ici explicitement à « https » — la terminaison TLS a
# eu lieu en amont, chez HAProxy. Pas de redirection 301 ici : elle bouclerait.
#
# Pas de politique de sécurité de contenu ni de contrôle d'encadrement : Meet envoie ses
# propres en-têtes, et l'intégration dans le Hall se règle ailleurs.

map $http_upgrade $meet_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 9080;
    # Joker : la visio de CETTE box sous son propre domaine ; aucun nom propre
    # à une box n'est livré.
    server_name visio.*;

    # Pages d'erreur SecuBox quand le conteneur est arrêté ou en cours de provisionnement (502/503/504 produits par
    # nginx lui-même), au lieu de la page nginx par défaut. Pas de proxy_intercept_errors : les erreurs renvoyées par
    # Meet ou LiveKit (JSON de l'API) passent telles quelles.
    include snippets/secubox-errorpages.conf;

    # ACME HTTP-01 — hors de tout proxy, pour que les renouvellements aboutissent.
    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/secubox/www;
        try_files $uri =404;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Envois de fichiers (arrière-plans, avatars) : le défaut de 1 Mo est trop bas.
    client_max_body_size 50m;

    location / {
        proxy_pass http://10.100.0.195:80;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Mise à niveau WebSocket (le map ci-dessus évite d'envoyer
        # « Connection: upgrade » sur les requêtes ordinaires).
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $meet_connection_upgrade;

        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    access_log /var/log/nginx/meet_access.log;
    error_log  /var/log/nginx/meet_error.log;
}
