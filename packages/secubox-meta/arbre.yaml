# L'ARBRE DES MÉTAPAQUETS (#1397) — source unique ; debian/control en est tiré
# par gen-meta.py, et un test refuse un control qui aurait divergé.
#
#   sbxos                    le Hall et tous ses composants
#    └─ secubox              la box elle-même
#        └─ secubox-fonction-*   une intention (se protéger, écrire, publier…)
#            └─ secubox-service-*   un service qui marche (courrier, WAF…)
#                └─ secubox-<module>   les paquets réels
#
# TROIS FORCES DE LIEN, pas une :
#   requiert    → Depends     sans lui, le nœud ne fonctionne pas
#   recommande  → Recommends  installé par défaut, retirable sans casser
#   suggere     → Suggests    POC, bouchon, matériel spécifique, vestige :
#                             jamais installé sans le demander
# Un module vide ou d'usage marginal n'est JAMAIS « requiert ». Un paquet qui
# n'existe que pour une architecture non plus (le métapaquet est `all`).
#
# PROFILER, C'EST CHOISIR UN NŒUD : `apt install secubox-service-mail` pose le
# courrier seul ; `secubox-fonction-correspondance` tout l'écrit ; `secubox`
# la box ; `sbxos` la box et son Hall. `--no-install-recommends` réduit chaque
# nœud à son strict nécessaire.
#
# Format plat (pas de PyYAML dans la chaîne de construction) :
#   meta: <paquet>      niveau: racine|fonction|service
#   label / description
#   requiert: / recommande: / suggere:   listes « - paquet »
#
# hors-arbre : paquets volontairement absents de l'arbre (transitionnels,
# décommissionnés, anciens métapaquets). Le générateur exige que CHAQUE paquet
# du dépôt soit dans l'arbre OU ici — un module neuf oublié casse la
# construction, pas l'installation.

hors-arbre:
  - secubox-mail-lxc          # transitionnel → secubox-mail
  - secubox-webmail           # transitionnel → secubox-mail
  - secubox-acces             # transitionnel → secubox-sbxid (#1424)
  - secubox-soc-gateway       # décommissionné (console de flotte jamais déployée)
  - secubox-hub               # remplacé par portal (Replaces << 1.9.6)
  - secubox-full              # anciens métapaquets d'image, conservés tels quels
  - secubox-lite
  - secubox-isp
  - secubox-profil-socle
  - secubox-profil-defense
  - secubox-profil-reseau
  - secubox-profil-media
  - secubox-profil-provision
  - secubox-profil-complet


