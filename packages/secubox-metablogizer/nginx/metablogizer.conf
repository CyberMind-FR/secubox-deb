# /etc/nginx/secubox.d/metablogizer.conf
# Installed by secubox-metablogizer package

# Mosaic wall thumbnails (#956/#977) — served directly from the capture
# cache, NEVER proxied to the FastAPI backend. A static PNG that changes
# once every few hours (metablog-shots.timer, api/shots.py) has no business
# waking up this module's single-worker asyncio event loop 172 times per
# page load — measured on the board at 140-470ms per request through
# Python, ~37s for a full 172-tile wall even at browser-typical concurrency
# (6). nginx serves the same bytes with sendfile(), no event loop involved.
#
# This regex location wins over the `/api/v1/metablogizer/` prefix location
# below regardless of file order: nginx always prefers a matching regex
# location over any prefix location. The first capture group excludes names
# starting with `.` — same rule `_site_dirs()`/`scan_sites()` already apply
# when listing sites — closing the `../../etc/passwd`-style traversal this
# alias would otherwise be exposed to (the FastAPI route this bypasses
# guards the same case via `_safe_key()`, see
# api/tests/test_site_screenshot_route.py::test_404_for_traversal_attempt).
#
# `Cache-Control: public, max-age=31536000, immutable` is safe ONLY because
# the frontend appends `?v=<captured_at>` to this URL (see GET /sites:
# `screenshot_captured_at`, api/sites_scan.py) — a recapture changes
# `captured_at`, which changes the URL, so a browser can never keep serving
# a vignette past its own recapture. `add_header` without `always` only
# applies to successful responses, so a missing screenshot (404, site never
# captured yet) is never cached — the frontend's <img onerror> already
# falls back to the tile's emoji placeholder in that case (see
# www/metablogizer/index.html), unaffected by which layer returned the 404.
location ~ ^/api/v1/metablogizer/site/([^./][^/]*)/screenshot$ {
    alias /var/cache/secubox/metablogizer/shots/$1/screenshot.png;
    # The URL has no `.png` extension (same path the FastAPI route below
    # answers to) — nginx's mime.types lookup keys off the REQUEST URI's
    # extension, not the aliased file's real name, so without this the
    # response would fall through to `default_type` (octet-stream) instead
    # of matching image/png. Scoped to this location only.
    default_type image/png;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Thumb-Source "nginx-static-alias" always;
    access_log off;
}

location /api/v1/metablogizer/ {
    proxy_pass http://unix:/run/secubox/metablogizer.sock:/;
    include /etc/nginx/snippets/secubox-proxy.conf;
}
