# VHOST DÉDIÉ DE METABLOGIZER (#1323).
#
# POURQUOI IL N'EN AVAIT PAS. Le panneau vivait uniquement sous
# `admin.gk2.secubox.in/metablogizer/`, et le Hall en tirait les conséquences :
# sa fiche portait `mode:"admin"` avec, en commentaire, « metablogizer n'a pas
# de vhost public (421) ». Le 421 était donc ATTENDU — mais il reste un 421
# pour qui tape l'adresse, et l'adresse est la première chose qu'on essaie.
#
# Tous les autres services en ont un. Celui-ci gère cent soixante-dix sites et
# n'avait pas de porte à son nom.
#
# CE QUI LE PROTÈGE. Les points d'entrée de l'API sont derrière `require_jwt`,
# ce qui est une vraie serrure — contrairement au tableau WAF, dont les routes
# ne demandaient rien et ne tenaient que par l'enceinte du panneau. On pose
# quand même le filtre d'exposition, à « lan » par défaut : publier la console
# qui pilote la publication de tous les sites n'est pas une décision qu'un
# paquet doit prendre à la place de l'opérateur.
server {
    listen 9080;
    server_name metablogizer.gk2.secubox.in;

    # HTTPS PARTOUT. Ce vhost est servi en direct par nginx (hors des vhosts
    # gérés par haproxyctl) : il n'hérite pas de la redirection clair→TLS de
    # HAProxy, on la pose donc ici. HAProxy termine le TLS et transmet le
    # schéma réel dans X-Forwarded-Proto ; l'ACME est intercepté en amont et
    # n'atteint jamais ce bloc, le renouvellement n'est pas cassé.
    if ($http_x_forwarded_proto = "http") { return 301 https://$host$request_uri; }

    # Filtre d'exposition : présent = appliqué. Créé à « lan » par le postinst
    # s'il manque, jamais écrasé ensuite (secubox-exposure en est l'éditeur).
    include /etc/nginx/snippets/exposure/metablogizer.gk2.secubox.in.conf;

    root /usr/share/secubox/www/metablogizer;
    index index.html;

    # EMBARQUEMENT DANS LE HALL, ET LUI SEUL. `frame-ancestors 'self'` ne
    # suffirait pas : l'origine du Hall n'est pas celle de cette page. Un joker
    # ouvrirait la porte à n'importe quel site — on nomme les deux noms du Hall
    # et rien d'autre. C'est CE côté-ci qui décide qui peut l'encadrer ; la
    # liste du Hall, elle, ne dit que ce que le Hall accepte d'afficher.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'self' https://hall.gk2.secubox.in https://hall.gk2.net; base-uri 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    # Une console d'administration n'a rien à faire dans un index de moteur.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Les vignettes de la mosaïque, servies par nginx et jamais par le backend.
    # Le commentaire de metablogizer.conf explique pourquoi : cent soixante-douze
    # requêtes PNG à travers une boucle asyncio à un seul ouvrier, c'est
    # trente-sept secondes de mur ; avec sendfile(), c'est instantané.
    location ~ ^/api/v1/metablogizer/site/([^./][^/]*)/screenshot$ {
        alias /var/cache/secubox/metablogizer/shots/$1/screenshot.png;
        default_type image/png;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /api/v1/metablogizer/ {
        proxy_pass http://unix:/run/secubox/metablogizer.sock:/;
        # LE SNIPPET POSE DÉJÀ ce qu'il faut au flux de l'assistant de
        # publication : `proxy_buffering off` et `proxy_read_timeout 300s`. Les
        # réécrire ici n'ajoutait rien et faisait échouer `nginx -t` sur une
        # directive en double — la garde du postinst a refusé d'activer le
        # vhost, ce qui a laissé la box exactement dans l'état où elle était.
        include /etc/nginx/snippets/secubox-proxy.conf;
    }

    location = /health {
        proxy_pass http://unix:/run/secubox/metablogizer.sock:/health;
        include /etc/nginx/snippets/secubox-proxy.conf;
        access_log off;
    }
}
