# La capture lance un NAVIGATEUR COMPLET. Sur une board a quatre coeurs, rien ne
# justifie qu'elle prenne plus d'un cinquieme de la machine : une vignette n'est
# jamais urgente.
#
# NICE NE BORNE RIEN — il baisse la priorite, il ne plafonne pas. Quand les
# autres processus attendent le disque, ce qui est l'etat permanent d'une
# machine qui pagine, le processus « poli » recupere tout le temps libre et
# sature quand meme. CPUQuota est un plafond dur.
[Service]
CPUQuota=20%
Nice=19
IOSchedulingClass=idle
