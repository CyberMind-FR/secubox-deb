# Les captures lancaient chromium TOUTES LES DEUX MINUTES. Une vignette n'est
# reprise que si elle manque, si la tentative precedente a echoue, ou si le site
# a change : le passage periodique ne sert donc qu'a RATTRAPER ce qui manque,
# pas a rafraichir. Une fois par heure suffit largement, avec de l'etalement
# pour ne pas retomber avec les autres reveils.
[Timer]
OnUnitActiveSec=60min
RandomizedDelaySec=10min
