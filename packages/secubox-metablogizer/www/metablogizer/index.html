<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecuBox - MetaBlogizer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/shared/crt-light.css">
    <link rel="stylesheet" href="/shared/sidebar-light.css">
    <style>
        :root {
            /* P31 Phosphor spectrum */
            --p31-peak: #00dd44;
            --p31-hot: #00ff55;
            --p31-mid: #009933;
            --p31-dim: #006622;
            --p31-ghost: #003311;
            --p31-decay: #ffb347;
            --p31-decay-dim: #cc7722;
            /* Tube glass */
            --tube-light: #e8f5e9;
            --tube-pale: #c8e6c9;
            --tube-soft: #a5d6a7;
            /* Legacy mappings */
            --bg-dark: var(--tube-light);
            --bg-card: var(--tube-pale);
            --bg-sidebar: var(--tube-black);
            --border: var(--tube-soft);
            --text: var(--tube-dark);
            --text-dim: var(--p31-dim);
            --primary: var(--p31-peak);
            --cyan: var(--p31-peak);
            --green: var(--p31-peak);
            --red: #ff4466;
            --yellow: var(--p31-decay);
            --orange: var(--p31-decay-dim);
            --purple: #a371f7;
            /* Bloom effects */
            --bloom-text: 0 0 2px var(--p31-peak), 0 0 6px var(--p31-peak), 0 0 14px rgba(51,255,102,0.5);
            --bloom-soft: 0 0 6px var(--p31-peak), 0 0 14px rgba(51,255,102,0.5);
            --bloom-amber: 0 0 3px var(--p31-decay), 0 0 10px rgba(255,179,71,0.4);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Courier Prime', 'Courier New', monospace;
            background: var(--tube-light);
            background-image: radial-gradient(ellipse at 50% 40%, rgba(51,255,102,0.025) 0%, transparent 70%);
            color: var(--tube-dark);
            display: flex;
            min-height: 100vh;
        }
        .sidebar { width: 220px; background: var(--bg-dark); border-right: 1px solid var(--border); position: fixed; height: 100vh; }
        .main { flex: 1; margin-left: 220px; padding: 1.5rem; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
        .header h1 { font-size: 1.5rem; }
        .btn { padding: 0.5rem 1rem; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text); cursor: pointer; margin-left: 0.5rem; }
        .btn:hover { background: var(--bg-dark); }
        .btn.primary { background: rgba(88,166,255,0.1); border-color: var(--primary); color: var(--primary); }
        .btn.success { background: rgba(63,185,80,0.1); border-color: var(--green); color: var(--green); }
        .btn.danger { background: rgba(248,81,73,0.1); border-color: var(--red); color: var(--red); }
        .tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 1rem; }
        .tab { padding: 0.75rem 1.5rem; cursor: pointer; border-bottom: 2px solid transparent; color: var(--text-dim); }
        .tab:hover { color: var(--text); }
        .tab.active { color: var(--primary); border-bottom-color: var(--primary); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-bottom: 1.5rem; }
        .stat-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; text-align: center; }
        .stat-card .value { font-size: 2rem; font-weight: bold; color: var(--purple); }
        .stat-card .label { font-size: 0.75rem; color: var(--text-dim); }
        .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 1.25rem; margin-bottom: 1.5rem; }
        .card h2 { font-size: 1rem; margin-bottom: 1rem; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 0.6rem; text-align: left; border-bottom: 1px solid var(--border); font-size: 0.875rem; }
        th { color: var(--text-dim); font-size: 0.75rem; text-transform: uppercase; }
        .badge { padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.75rem; }
        .badge.published { background: rgba(63,185,80,0.2); color: var(--green); }
        .badge.draft { background: rgba(139,148,158,0.2); color: var(--text-dim); }
        th[data-sort] { cursor: pointer; user-select: none; }
        th[data-sort]:hover { color: var(--primary); }
        .sort-ind { font-size: 0.8em; color: var(--primary); }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; align-items: center; justify-content: center; }
        .modal.show { display: flex; }
        .modal-content { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 1.5rem; min-width: 400px; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.25rem; font-size: 0.8rem; color: var(--text-dim); }
        .form-group input { width: 100%; padding: 0.5rem; border: 1px solid var(--border); border-radius: 4px; background: var(--bg-dark); color: var(--text); }
        .form-actions { display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1rem; }
    
        /* CRT Enhancements */
        .main { margin-left: 220px; padding: 1.5rem; }

        .header h1 {
            color: var(--p31-hot);
            text-shadow: var(--bloom-text);
            font-weight: 700;
            letter-spacing: 0.05em;
        }

        .badge {
            font-family: 'Courier Prime', monospace;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            border: 1px solid;
        }
        .badge-blue, .badge-primary { background: rgba(51,255,102,0.1); border-color: var(--p31-peak); color: var(--p31-peak); }
        .badge-green { background: rgba(51,255,102,0.15); border-color: var(--p31-peak); color: var(--p31-peak); text-shadow: var(--bloom-soft); }
        .badge-cyan { background: rgba(51,255,102,0.1); border-color: var(--p31-mid); color: var(--p31-mid); }
        .badge-purple { background: rgba(163,113,247,0.1); border-color: #a371f7; color: #a371f7; }
        .badge-yellow, .badge-amber { background: rgba(255,179,71,0.1); border-color: var(--p31-decay); color: var(--p31-decay); }
        .badge-red { background: rgba(255,68,102,0.1); border-color: #ff4466; color: #ff4466; }

        .btn {
            font-family: 'Courier Prime', monospace;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            border: 1px solid var(--tube-soft);
            background: var(--tube-pale);
            color: var(--p31-mid);
            transition: all 0.2s;
        }
        .btn:hover {
            border-color: var(--p31-dim);
            color: var(--p31-peak);
            text-shadow: var(--bloom-soft);
            box-shadow: 0 0 12px rgba(51,255,102,0.1);
        }
        .btn-green, .btn-primary, .btn.primary, .btn.success {
            border-color: var(--p31-peak);
            color: var(--p31-peak);
            background: rgba(51,255,102,0.1);
        }
        .btn-green:hover, .btn-primary:hover, .btn.primary:hover, .btn.success:hover {
            background: rgba(51,255,102,0.2);
            box-shadow: 0 0 16px rgba(51,255,102,0.2);
        }
        .btn-red, .btn.danger {
            border-color: #ff4466;
            color: #ff4466;
            background: rgba(255,68,102,0.1);
        }
        .btn-red:hover, .btn.danger:hover {
            background: rgba(255,68,102,0.2);
        }
        .btn-blue {
            border-color: var(--p31-mid);
            color: var(--p31-mid);
            background: rgba(51,255,102,0.05);
        }
        .btn-blue:hover {
            border-color: var(--p31-peak);
            color: var(--p31-peak);
        }

        .card {
            background: var(--tube-pale);
            border: 1px solid var(--tube-soft);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.3);
        }
        .card:hover {
            border-color: var(--p31-dim);
            box-shadow: 0 0 8px rgba(51,255,102,0.05), inset 0 0 20px rgba(0,0,0,0.3);
        }
        .card-title, .card-header h2 {
            color: var(--p31-decay);
            text-shadow: var(--bloom-amber);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            font-size: 0.85rem;
        }

        .stat-card {
            background: var(--tube-pale);
            border: 1px solid var(--tube-soft);
        }
        .stat-value, .stat-card .value {
            text-shadow: 0 0 10px currentColor;
        }
        .stat-label, .stat-card .label {
            color: var(--p31-dim);
            letter-spacing: 0.15em;
        }
        .stat-card.cyan .value, .stat-card.green .value { color: var(--p31-peak); }
        .stat-card.yellow .value { color: var(--p31-decay); }
        .stat-card.red .value { color: #ff4466; }

        table, .table {
            font-family: 'Courier Prime', monospace;
        }
        th, .table th {
            color: var(--p31-decay);
            text-shadow: var(--bloom-amber);
            letter-spacing: 0.15em;
            border-bottom: 1px solid var(--p31-ghost);
        }
        td, .table td {
            border-bottom: 1px solid var(--p31-ghost);
            color: var(--p31-mid);
        }
        tr:hover, .table tr:hover {
            background: rgba(51,255,102,0.03);
        }

        .status-dot.active, .status-running {
            color: var(--p31-peak);
            text-shadow: var(--bloom-soft);
        }
        .status-dot.active {
            background: var(--p31-peak);
            box-shadow: 0 0 8px var(--p31-peak);
        }

        .toast {
            background: var(--tube-pale);
            border: 1px solid var(--p31-dim);
            font-family: 'Courier Prime', monospace;
        }
        .toast-success { border-color: var(--p31-peak); }
        .toast-error { border-color: #ff4466; }

        .modal {
            background: rgba(0,0,0,0.85);
        }
        .modal-content {
            background: var(--tube-pale);
            border: 1px solid var(--p31-dim);
            box-shadow: 0 0 30px rgba(51,255,102,0.1);
        }
        .modal-title {
            color: var(--p31-decay);
            text-shadow: var(--bloom-amber);
            letter-spacing: 0.1em;
        }

        .tabs {
            background: var(--tube-pale);
            border-bottom: 1px solid var(--p31-ghost);
        }
        .tab {
            color: var(--p31-dim);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            font-size: 0.8rem;
        }
        .tab:hover { color: var(--p31-mid); }
        .tab.active {
            color: var(--p31-peak);
            text-shadow: var(--bloom-soft);
            border-bottom-color: var(--p31-peak);
        }

        input, select, textarea {
            font-family: 'Courier Prime', monospace;
            background: var(--tube-light);
            border: 1px solid var(--tube-soft);
            color: var(--p31-mid);
            padding: 0.5rem;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--p31-dim);
            box-shadow: 0 0 8px rgba(51,255,102,0.1);
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--tube-light); }
        ::-webkit-scrollbar-thumb { background: var(--p31-dim); }
        ::-webkit-scrollbar-thumb:hover { background: var(--p31-mid); }

        /* Empty states */
        .empty { color: var(--p31-dim); }

        /* Mobile responsive header tools */
        .header-tools {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        @media (max-width: 768px) {
            .main { margin-left: 0; }

            .header {
                flex-direction: column;
                gap: 1rem;
                align-items: stretch;
            }

            .header h1 {
                font-size: 1.2rem;
                text-align: center;
            }

            .header-tools {
                justify-content: center;
            }

            .header-tools .btn {
                flex: 1;
                min-width: 100px;
                text-align: center;
                padding: 0.75rem 0.5rem;
            }

            .stats-row {
                grid-template-columns: 1fr;
            }

            .tabs {
                overflow-x: auto;
                flex-wrap: nowrap;
            }

            .tab {
                flex-shrink: 0;
                padding: 0.75rem 1rem;
            }

            table {
                display: block;
                overflow-x: auto;
            }

            th, td {
                white-space: nowrap;
                min-width: 80px;
            }
        }

        /* Touch-friendly buttons */
        @media (pointer: coarse) {
            .btn {
                min-height: 44px;
                padding: 0.75rem 1rem;
            }

            .tab {
                min-height: 44px;
            }
        }
    </style>
</head>
<body class="crt-light">
    <nav class="sidebar" id="sidebar"></nav>
    <script src="/shared/sidebar.js"></script>
    <main class="main">
        <header class="header">
            <h1>MetaBlogizer - Static Sites</h1>
            <div class="header-tools">
                <button class="btn primary" onclick="republishAll()" title="Republish all sites">⟲ Republish All</button>
                <button class="btn success" onclick="showCreateSite()">+ New Site</button>
                <button class="btn" onclick="refresh()">↻ Refresh</button>
            </div>
        </header>

        <div class="tabs">
            <div class="tab active" onclick="showTab('sites')">Sites</div>
        </div>

        <div class="tab-content active" id="tab-sites">
            <div class="stats-row">
                <div class="stat-card"><div class="value" id="site-count">-</div><div class="label">Total Sites</div></div>
                <div class="stat-card"><div class="value" id="published-count">-</div><div class="label">Published</div></div>
                <div class="stat-card"><div class="value" id="nginx-status">-</div><div class="label">Nginx</div></div>
            </div>
            <div class="card">
                <h2>Sites</h2>
                <div class="filter-row" style="margin-bottom:0.5rem">
                    <input type="search" id="filter" placeholder="Filter by name or domain…"
                           oninput="applyFilter()"
                           style="width:100%;padding:0.5rem;background:var(--bg-dark);color:var(--text);border:1px solid var(--border);border-radius:4px;font-family:inherit">
                </div>
                <table>
                    <thead><tr>
                        <th data-sort="name" onclick="sortBy('name', this)">Name <span class="sort-ind"></span></th>
                        <th data-sort="domain" onclick="sortBy('domain', this)">Domain <span class="sort-ind"></span></th>
                        <th data-sort="version" onclick="sortBy('version', this)">Version <span class="sort-ind"></span></th>
                        <th>Streamlit</th>
                        <th data-sort="last_updated" onclick="sortBy('last_updated', this)">Updated <span class="sort-ind"></span></th>
                        <th>Status</th>
                        <th>Size</th>
                        <th>Actions</th>
                    </tr></thead>
                    <tbody id="site-list"><tr><td colspan="8">Loading...</td></tr></tbody>
                </table>
            </div>
        </div>

    </main>

    <div class="modal" id="create-modal">
        <div class="modal-content">
            <h3>Create Site</h3>
            <div class="form-group"><label>Site Name</label><input type="text" id="new-name" placeholder="my-blog"></div>
            <div class="form-group"><label>Domain</label><input type="text" id="new-domain" placeholder="blog.example.com"></div>
            <div class="form-actions">
                <button class="btn" onclick="hideModal('create-modal')">Cancel</button>
                <button class="btn success" onclick="createSite()">Create</button>
            </div>
        </div>
    </div>

    <script>
        const API = '/api/v1/metablogizer';
        // Read BOTH token keys like every working module (hub/portal set both);
        // reading only sbx_token missed a valid token stored under secubox_token.
        const token = () => localStorage.getItem('sbx_token') || localStorage.getItem('secubox_token');
        const headers = () => ({ 'Content-Type': 'application/json', ...(token() ? { 'Authorization': 'Bearer ' + token() } : {}) });

        async function api(path, opts = {}) {
            try {
                let res = await fetch(API + path, { ...opts, headers: headers(), credentials: 'same-origin' });
                if (res.status === 401) {
                    // A stale localStorage Bearer can shadow a valid SSO session
                    // cookie (require_jwt prefers the Bearer when present). Retry
                    // cookie-only WITHOUT destroying the token — the shared
                    // sidebar and other components rely on it; nuking it on a
                    // transient 401 cascades everything to the login page.
                    res = await fetch(API + path, { ...opts, headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin' });
                }
                if (res.status === 401) { window.location.href = '/login.html?redirect=' + encodeURIComponent(location.pathname); return {}; }
                const ct = res.headers.get('content-type') || '';
                if (!res.ok || !ct.includes('application/json')) {
                    console.warn('api()', path, 'status=' + res.status, 'content-type=' + ct);
                    return {};
                }
                return await res.json();
            } catch (e) { console.warn('api()', path, 'threw', e); return {}; }
        }

        function showTab(name) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelector(`[onclick="showTab('${name}')"]`).classList.add('active');
            document.getElementById('tab-' + name).classList.add('active');
        }

        async function loadStatus() {
            const d = await api('/status');
            document.getElementById('site-count').textContent = d.site_count || 0;
            document.getElementById('published-count').textContent = d.published_count || 0;
            document.getElementById('nginx-status').textContent = d.running ? 'Running' : 'Stopped';
            document.getElementById('nginx-status').style.color = d.running ? 'var(--green)' : 'var(--red)';
        }

        // ─── Sort + filter + polling state ───
        let currentSort = { field: null, dir: 'asc' };
        let pollTimer = null;

        function relativeTime(iso) {
            if (!iso) return '—';
            const d = new Date(iso);
            const diff = (Date.now() - d.getTime()) / 1000;
            if (isNaN(diff)) return iso;
            if (diff < 60) return `${Math.floor(diff)}s ago`;
            if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
            if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
            return `${Math.floor(diff / 86400)}d ago`;
        }

        function applyFilter() {
            const q = (document.getElementById('filter')?.value || '').toLowerCase().trim();
            document.querySelectorAll('.site-row').forEach(tr => {
                const name = (tr.dataset.name || '').toLowerCase();
                const domain = (tr.dataset.domain || '').toLowerCase();
                const match = !q || name.includes(q) || domain.includes(q);
                tr.style.display = match ? '' : 'none';
            });
        }

        function sortBy(field, thEl) {
            if (currentSort.field === field) {
                currentSort.dir = currentSort.dir === 'asc' ? 'desc' : 'asc';
            } else {
                currentSort = { field, dir: 'asc' };
            }
            document.querySelectorAll('th[data-sort] .sort-ind').forEach(s => s.textContent = '');
            const ind = thEl.querySelector('.sort-ind');
            if (ind) ind.textContent = currentSort.dir === 'asc' ? ' ▲' : ' ▼';
            applySortToDOM();
        }

        function applySortToDOM() {
            const tbody = document.getElementById('site-list');
            if (!tbody) return;
            const rows = Array.from(tbody.querySelectorAll('tr.site-row'));
            const field = currentSort.field;
            const dir = currentSort.dir === 'asc' ? 1 : -1;
            rows.sort((a, b) => {
                const av = (a.dataset[field] || '') + '';
                const bv = (b.dataset[field] || '') + '';
                if (av === '' && bv !== '') return 1;
                if (bv === '' && av !== '') return -1;
                return av.localeCompare(bv, undefined, { numeric: true }) * dir;
            });
            rows.forEach(r => tbody.appendChild(r));
        }

        function installPolling() {
            if (pollTimer) return;
            pollTimer = setInterval(() => {
                if (!document.hidden) refresh();
            }, 60000);
        }

        function escAttr(s) {
            return String(s == null ? '' : s)
                .replace(/&/g, '&amp;').replace(/"/g, '&quot;')
                .replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function siteTooltip(s) {
            const lines = [];
            lines.push(`📛 Name: ${s.name}`);
            lines.push(`🌐 Domain: ${s.domain}`);
            lines.push(`🚦 Status: ${s.published ? '✅ Published' : '📝 Draft'}`);
            if (s.version) lines.push(`🏷️ Version: ${s.version}`);
            if (s.title) lines.push(`📰 Title: ${s.title}`);
            if (s.description) lines.push(`📝 ${s.description}`);
            if (s.category) lines.push(`📂 Category: ${s.category}`);
            if (Array.isArray(s.tags) && s.tags.length) lines.push(`🏷️ Tags: ${s.tags.join(', ')}`);
            if (s.streamlit_app) lines.push(`🎨 Streamlit: ${s.streamlit_app}`);
            if (s.port) lines.push(`🔌 Port: ${s.port}`);
            if (s.size) lines.push(`📦 Size: ${s.size}`);
            if (s.last_updated) lines.push(`🕐 Updated: ${s.last_updated}`);
            return escAttr(lines.join('\n'));
        }

        async function loadSites() {
            const d = await api('/sites');
            const list = document.getElementById('site-list');
            const sites = d.sites || [];
            if (!sites.length) { list.innerHTML = '<tr><td colspan="8" style="color:var(--text-dim)">No sites</td></tr>'; return; }
            list.innerHTML = sites.map(s => {
                const tip = siteTooltip(s);
                const url = `http://${s.domain}`;
                const streamlitCell = s.streamlit_app
                    ? `<a href="https://gitea.gk2.secubox.in/gandalf/${s.streamlit_app}" target="_blank" title="${s.streamlit_app}">🎨</a>`
                    : '<span style="color:var(--text-dim)">—</span>';
                const versionCell = s.version
                    ? `<a href="https://gitea.gk2.secubox.in/gandalf/metablog-${s.name}/releases" target="_blank"><code style="color:var(--primary)">${s.version}</code></a>`
                    : '<span style="color:var(--text-dim)">—</span>';
                const updatedCell = s.last_updated
                    ? `<span title="${s.last_updated}">${relativeTime(s.last_updated)}</span>`
                    : '<span style="color:var(--text-dim)">—</span>';
                return `<tr class="site-row" title="${tip}" data-name="${s.name}" data-domain="${s.domain}" data-version="${s.version || ''}" data-last_updated="${s.last_updated || ''}">
                    <td><strong><a href="site.html?name=${s.name}" style="color:var(--text)">${s.name}</a></strong></td>
                    <td><a href="${url}" target="_blank" rel="noopener" style="color:var(--p31-mid);text-decoration:none" title="${tip}">🌐 ${s.domain} ↗</a></td>
                    <td>${versionCell}</td>
                    <td style="text-align:center">${streamlitCell}</td>
                    <td>${updatedCell}</td>
                    <td><span class="badge ${s.published ? 'published' : 'draft'}">${s.published ? '✅ Published' : '📝 Draft'}</span></td>
                    <td>${s.size || '-'}</td>
                    <td>
                        ${s.published ?
                            `<a href="${url}" target="_blank" class="btn" style="padding:2px 8px;font-size:0.7rem">View</a>
                             <button class="btn" onclick="unpublishSite('${s.name}')" style="padding:2px 8px;font-size:0.7rem">Unpublish</button>` :
                            `<button class="btn success" onclick="publishSite('${s.name}')" style="padding:2px 8px;font-size:0.7rem">Publish</button>`}
                        <button class="btn" onclick="deploySite('${s.name}')" title="Update content — git pull from repo" style="padding:2px 8px;font-size:0.7rem">🔄</button>
                        <button class="btn" onclick="uploadSiteContent('${s.name}')" title="Upgrade content — upload .zip / .tar.gz / .html" style="padding:2px 8px;font-size:0.7rem">⬆</button>
                        <button class="btn danger" onclick="deleteSite('${s.name}')" style="padding:2px 8px;font-size:0.7rem">Delete</button>
                    </td>
                </tr>`;
            }).join('');
            if (currentSort.field) applySortToDOM();
            applyFilter();
        }

        function showModal(id) { document.getElementById(id).classList.add('show'); }
        function hideModal(id) { document.getElementById(id).classList.remove('show'); }
        function showCreateSite() { showModal('create-modal'); }

        async function createSite() {
            const name = document.getElementById('new-name').value.trim();
            const domain = document.getElementById('new-domain').value.trim() || undefined;
            const r = await api('/site', { method: 'POST', body: JSON.stringify({ name, domain }) });
            if (r.success) { hideModal('create-modal'); refresh(); }
            else alert('Error: ' + (r.detail || 'Failed'));
        }

        async function publishSite(name) {
            const r = await api('/site/' + name + '/publish', { method: 'POST' });
            if (r.success) refresh();
        }

        async function unpublishSite(name) {
            const r = await api('/site/' + name + '/unpublish', { method: 'POST' });
            if (r.success) refresh();
        }

        async function deleteSite(name) {
            if (!confirm('Delete site ' + name + '?')) return;
            const r = await api('/site/' + name, { method: 'DELETE' });
            if (r.success) refresh();
        }

        // Quick-access: pull latest content from the site's git repo (same as
        // the Gitea webhook, triggered on demand).
        async function deploySite(name) {
            const r = await api('/site/' + name + '/deploy', { method: 'POST' });
            if (r && r.success) {
                alert(r.updated
                    ? '✓ ' + name + ' updated: ' + String(r.from).slice(0, 8) + ' → ' + String(r.to).slice(0, 8)
                    : '• ' + name + ' already up to date');
                refresh();
            } else {
                alert('Update failed for ' + name + (r && r.detail ? ': ' + r.detail : ''));
            }
        }

        // Quick-access: upgrade content by uploading a .zip / .tar.gz / .html.
        // Uses a transient hidden file input; the multipart POST needs the raw
        // FormData body (no JSON Content-Type), so it calls fetch directly with
        // the same auth headers/cookie strategy as api().
        function uploadSiteContent(name) {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.zip,.tar.gz,.tgz,.html,.htm';
            input.onchange = async () => {
                const f = input.files && input.files[0];
                if (!f) return;
                const fd = new FormData();
                fd.append('file', f);
                const t = token();
                const auth = t ? { 'Authorization': 'Bearer ' + t } : {};
                try {
                    let res = await fetch(API + '/site/' + name + '/upload',
                        { method: 'POST', headers: auth, body: fd, credentials: 'same-origin' });
                    if (res.status === 401) {
                        res = await fetch(API + '/site/' + name + '/upload',
                            { method: 'POST', body: fd, credentials: 'same-origin' });
                    }
                    if (res.status === 401) { window.location.href = '/login.html?redirect=' + encodeURIComponent(location.pathname); return; }
                    const d = await res.json().catch(() => ({}));
                    if (res.ok && d.success) { alert('✓ ' + name + ' content upgraded (' + (d.kind || 'ok') + ')'); refresh(); }
                    else alert('Upload failed for ' + name + (d.detail ? ': ' + d.detail : ''));
                } catch (e) {
                    alert('Upload failed for ' + name + ': ' + e);
                }
            };
            input.click();
        }

        async function republishAll() {
            const btn = event.target;
            const origText = btn.textContent;
            btn.textContent = '⟲ Publishing...';
            btn.disabled = true;
            try {
                const r = await api('/republish-all', { method: 'POST' });
                if (r.success) {
                    alert('✓ Published ' + r.sites_published + ' sites');
                    refresh();
                } else {
                    alert('Error: ' + (r.message || 'Failed to republish'));
                }
            } finally {
                btn.textContent = origText;
                btn.disabled = false;
            }
        }

        function refresh() { loadStatus(); loadSites(); }
        refresh();
        installPolling();
    </script>
    <script src="/shared/crt-engine.js"></script>
</body>
</html>
