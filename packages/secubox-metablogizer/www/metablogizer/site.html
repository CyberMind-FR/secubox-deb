<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecuBox — Site details</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Cinzel:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/shared/crt-light.css">
    <link rel="stylesheet" href="/shared/sidebar-light.css">
    <style>
        :root {
            --p31-peak: #00dd44; --p31-hot: #00ff55; --p31-mid: #009933;
            --p31-dim: #006622; --p31-decay: #ffb347; --p31-decay-dim: #cc7722;
            --tube-light: #e8f5e9; --tube-pale: #c8e6c9; --tube-soft: #a5d6a7;
            --bg-dark: var(--tube-light); --bg-card: var(--tube-pale);
            --border: var(--tube-soft); --text: #1b2c1b; --text-dim: var(--p31-dim);
            --primary: var(--p31-peak); --green: var(--p31-peak);
            --red: #ff4466; --yellow: var(--p31-decay);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Courier Prime', 'Courier New', monospace;
            background: var(--tube-light);
            color: var(--text);
            display: flex;
            min-height: 100vh;
        }
        .main {
            flex: 1;
            padding: 2rem;
            max-width: 1100px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            align-items: baseline;
            gap: 1rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.75rem;
        }
        .header h1 {
            font-family: 'Cinzel', serif;
            font-weight: 500;
            color: var(--primary);
            font-size: 2rem;
        }
        .badge {
            display: inline-block;
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .badge.published { background: rgba(0,221,68,0.2); color: var(--green); border: 1px solid var(--green); }
        .badge.draft { background: rgba(255,179,71,0.2); color: var(--yellow); border: 1px solid var(--yellow); }
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 1rem 1.25rem;
            margin-bottom: 1rem;
        }
        .card h2 {
            font-family: 'Cinzel', serif;
            font-weight: 500;
            color: var(--text);
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
        }
        dl { display: grid; grid-template-columns: 12rem 1fr; gap: 0.4rem 1rem; }
        dt { color: var(--text-dim); }
        dd { color: var(--text); word-break: break-word; }
        dd code { background: var(--bg-dark); padding: 0.1rem 0.4rem; border-radius: 3px; color: var(--primary); }
        .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .btn {
            display: inline-block;
            padding: 0.5rem 0.9rem;
            background: var(--bg-dark);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 4px;
            text-decoration: none;
            font-family: inherit;
            font-size: 0.9rem;
            cursor: pointer;
        }
        .btn:hover { border-color: var(--primary); color: var(--primary); }
        .btn.primary { background: var(--primary); color: var(--bg-dark); border-color: var(--primary); }
        .btn.success { background: var(--green); color: var(--bg-dark); border-color: var(--green); }
        .btn[hidden] { display: none !important; }
        .hint { color: var(--text-dim); font-size: 0.9rem; }
        .error { color: var(--red); }
        a { color: var(--primary); }
        .aliases { list-style: none; display: flex; flex-wrap: wrap; gap: 0.4rem; }
        .aliases li a {
            display: inline-block; padding: 0.1rem 0.5rem;
            border: 1px solid var(--border); border-radius: 3px;
            text-decoration: none; font-size: 0.85rem;
        }
        .aliases li a:hover { border-color: var(--primary); }
        #snapshot { max-width: 100%; border: 1px solid var(--border); border-radius: 4px; display: none; }
        label { color: var(--text-dim); }
        input, textarea {
            width: 100%; font-family: inherit; font-size: 0.9rem; padding: 0.4rem;
            background: var(--bg-dark); color: var(--text);
            border: 1px solid var(--border); border-radius: 4px;
        }
        input:focus, textarea:focus { outline: none; border-color: var(--primary); }
        dl.form { grid-template-columns: 12rem 1fr; align-items: start; }
        .ok { color: var(--green); }
    </style>
</head>
<body class="crt-light">
    <nav class="sidebar" id="sidebar"></nav>
    <script src="/shared/sidebar.js"></script>
    <main class="main">
        <div id="error-box"></div>

        <header class="header">
            <h1 id="site-name">…</h1>
            <span id="status-badge" class="badge"></span>
            <a href="index.html" class="btn" style="margin-left:auto">← Back to list</a>
        </header>

        <div class="card">
            <h2>Metadata</h2>
            <dl id="meta-dl"></dl>
        </div>

        <div class="card">
            <h2>Snapshot</h2>
            <a id="snapshot-link" target="_blank" rel="noopener">
                <img id="snapshot" alt="Aperçu du site">
            </a>
            <p id="snapshot-empty" class="hint" hidden>Pas encore de vignette — capturée hors-ligne par le shotter (metablog-shots).</p>
        </div>

        <div class="card">
            <h2>Quick links</h2>
            <div class="actions">
                <a id="link-live" class="btn primary" target="_blank" rel="noopener">🌐 Live site</a>
                <a id="link-source" class="btn" target="_blank" rel="noopener" hidden>🐙 Source</a>
                <a id="link-gitea" class="btn" target="_blank" rel="noopener" hidden>🦊 Miroir Gitea</a>
                <a id="link-streamlit" class="btn success" target="_blank" rel="noopener" hidden>🎨 Streamlit app</a>
            </div>
        </div>

        <div class="card">
            <h2>Paramétrer les détails</h2>
            <form id="edit-form">
                <dl class="form">
                    <dt><label for="f-title">Title</label></dt>
                    <dd><input id="f-title" type="text" autocomplete="off"></dd>
                    <dt><label for="f-description">Description</label></dt>
                    <dd><textarea id="f-description" rows="2"></textarea></dd>
                    <dt><label for="f-category">Category</label></dt>
                    <dd><input id="f-category" type="text" autocomplete="off"></dd>
                    <dt><label for="f-tags">Tags</label></dt>
                    <dd><input id="f-tags" type="text" autocomplete="off" placeholder="séparés par des virgules"></dd>
                    <dt><label for="f-source">Source (GitHub)</label></dt>
                    <dd><input id="f-source" type="url" autocomplete="off" placeholder="https://github.com/user/repo.git"></dd>
                    <dt><label for="f-gitea">Miroir Gitea</label></dt>
                    <dd><input id="f-gitea" type="url" autocomplete="off" placeholder="https://gitea.gk2.secubox.in/gandalf/…"></dd>
                    <dt><label for="f-aliases">Aliases</label></dt>
                    <dd><textarea id="f-aliases" rows="3" placeholder="un domaine par ligne"></textarea></dd>
                </dl>
                <div class="actions" style="margin-top:0.75rem">
                    <button type="submit" class="btn primary">💾 Enregistrer</button>
                    <span id="save-status" class="hint"></span>
                </div>
            </form>
        </div>

        <div class="card hint">
            <p>For tag history and deploys, see the <strong>Releases</strong> tab on the Gitea repo (auth required).</p>
        </div>
    </main>

    <script>
        const API = '/api/v1/metablogizer';

        function headers() {
            // Read BOTH token keys like every working module (hub/portal set both).
            const t = localStorage.getItem('sbx_token') || localStorage.getItem('secubox_token');
            return t ? { 'Authorization': `Bearer ${t}` } : {};
        }

        async function api(path) {
            try {
                let res = await fetch(API + path, { headers: headers(), credentials: 'same-origin' });
                if (res.status === 401) {
                    // Stale Bearer may shadow a valid SSO cookie — retry
                    // cookie-only WITHOUT destroying the token (non-destructive).
                    res = await fetch(API + path, { credentials: 'same-origin' });
                }
                if (res.status === 401) { if (!/\/login\.html$/.test(location.pathname)) window.location.href = '/login.html?redirect=' + encodeURIComponent(location.pathname); return null; }
                const ct = res.headers.get('content-type') || '';
                if (!res.ok || !ct.includes('application/json')) {
                    console.warn('api()', path, 'status=' + res.status, 'content-type=' + ct);
                    return null;
                }
                return await res.json();
            } catch (e) { console.warn('api()', path, 'threw', e); return null; }
        }

        function relativeTime(iso) {
            if (!iso) return '—';
            const d = new Date(iso);
            const diff = (Date.now() - d.getTime()) / 1000;
            if (isNaN(diff)) return iso;
            if (diff < 60) return `${Math.floor(diff)}s ago`;
            if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
            if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
            return `${Math.floor(diff / 86400)}d ago`;
        }

        function esc(s) {
            return String(s).replace(/[&<>"']/g, c => (
                {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        function row(label, value) {
            const dt = document.createElement('dt'); dt.textContent = label;
            const dd = document.createElement('dd'); dd.innerHTML = value;
            return [dt, dd];
        }

        let currentName = null;

        function render(d) {
            currentName = d.name;
            document.getElementById('site-name').textContent = d.name;
            const badge = document.getElementById('status-badge');
            badge.textContent = d.published ? 'Published' : 'Draft';
            badge.className = 'badge ' + (d.published ? 'published' : 'draft');

            const dl = document.getElementById('meta-dl');
            dl.textContent = '';
            const dash = '<span style="color:var(--text-dim)">—</span>';
            const text = v => (v ? esc(v) : dash);
            const versionCell = d.version ? `<code>${esc(d.version)}</code>` : dash;
            const lastUpdatedCell = d.last_updated
                ? `${esc(d.last_updated)} <span style="color:var(--text-dim)">(${esc(relativeTime(d.last_updated))})</span>`
                : dash;
            const tagsCell = (d.tags && d.tags.length)
                ? d.tags.map(t => `<code>${esc(t)}</code>`).join(' ')
                : dash;
            // Aliases : noms supplémentaires servant le même site (validés côté
            // serveur avant écriture). Rendus en liens, échappés par prudence.
            const aliasesCell = (d.aliases && d.aliases.length)
                ? `<ul class="aliases">${d.aliases.map(a =>
                    `<li><a href="https://${encodeURIComponent(a)}/" target="_blank" rel="noopener">${esc(a)}</a></li>`
                  ).join('')}</ul>`
                : dash;

            const fields = [
                ['Domain',       text(d.domain)],
                ['Aliases',      aliasesCell],
                ['Version',      versionCell],
                ['Last updated', lastUpdatedCell],
                ['Title',        text(d.title)],
                ['Description',  text(d.description)],
                ['Category',     text(d.category)],
                ['Tags',         tagsCell],
            ];
            for (const [k, v] of fields) {
                row(k, v).forEach(el => dl.appendChild(el));
            }

            // Vignette snapshot : servie par l'endpoint existant (produite
            // hors-ligne). 404 tant qu'aucune capture → on montre l'indice.
            const snap = document.getElementById('snapshot');
            const snapLink = document.getElementById('snapshot-link');
            const snapEmpty = document.getElementById('snapshot-empty');
            const snapUrl = `${API}/site/${encodeURIComponent(d.name)}/screenshot`;
            snap.onload = () => { snap.style.display = 'block'; snapEmpty.hidden = true; };
            snap.onerror = () => { snap.style.display = 'none'; snapEmpty.hidden = false; };
            snap.src = snapUrl;
            snapLink.href = `https://${d.domain}/`;

            document.getElementById('link-live').href = `https://${d.domain}/`;
            // Liens source : plus de Gitea deviné. On n'affiche que ce qui est
            // déclaré dans site.json (source_url = amont GitHub, gitea_repo = miroir).
            const src = document.getElementById('link-source');
            if (d.source_url) { src.href = d.source_url; src.hidden = false; }
            const gitea = document.getElementById('link-gitea');
            if (d.gitea_repo) { gitea.href = d.gitea_repo; gitea.hidden = false; }
            const streamlit = document.getElementById('link-streamlit');
            if (d.streamlit_app) {
                streamlit.href = `https://gitea.gk2.secubox.in/gandalf/${encodeURIComponent(d.streamlit_app)}`;
                streamlit.hidden = false;
            }

            // Pré-remplir le formulaire d'édition.
            document.getElementById('f-title').value = d.title || '';
            document.getElementById('f-description').value = d.description || '';
            document.getElementById('f-category').value = d.category || '';
            document.getElementById('f-tags').value = (d.tags || []).join(', ');
            document.getElementById('f-source').value = d.source_url || '';
            document.getElementById('f-gitea').value = d.gitea_repo || '';
            document.getElementById('f-aliases').value = (d.aliases || []).join('\n');
        }

        function splitList(raw, sep) {
            return raw.split(sep).map(s => s.trim()).filter(Boolean);
        }

        async function saveDetails(ev) {
            ev.preventDefault();
            if (!currentName) return;
            const status = document.getElementById('save-status');
            const val = id => document.getElementById(id).value.trim();
            // null EFFACE le champ côté serveur ; on envoie null pour un champ vidé.
            const orNull = v => (v === '' ? null : v);
            const body = {
                title: orNull(val('f-title')),
                description: orNull(val('f-description')),
                category: orNull(val('f-category')),
                tags: splitList(val('f-tags'), ','),
                source_url: orNull(val('f-source')),
                gitea_repo: orNull(val('f-gitea')),
                aliases: splitList(val('f-aliases'), '\n'),
            };
            status.textContent = 'Enregistrement…';
            status.className = 'hint';
            try {
                const t = localStorage.getItem('sbx_token') || localStorage.getItem('secubox_token');
                const res = await fetch(`${API}/site/${encodeURIComponent(currentName)}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', ...(t ? { 'Authorization': `Bearer ${t}` } : {}) },
                    credentials: 'same-origin',
                    body: JSON.stringify(body),
                });
                if (res.ok) {
                    const out = await res.json();
                    status.textContent = '✓ Enregistré';
                    status.className = 'hint ok';
                    if (out.site) render(out.site);
                } else if (res.status === 422) {
                    const err = await res.json().catch(() => ({}));
                    const detail = err.detail && err.detail.errors ? err.detail.errors.join(' · ') : 'validation refusée';
                    status.textContent = '✗ ' + detail;
                    status.className = 'hint error';
                } else {
                    status.textContent = '✗ Échec (' + res.status + ')';
                    status.className = 'hint error';
                }
            } catch (e) {
                status.textContent = '✗ ' + e;
                status.className = 'hint error';
            }
        }

        function showError(msg) {
            document.getElementById('error-box').innerHTML =
                `<div class="card error">${msg}</div>`;
        }

        async function loadSite() {
            const name = new URLSearchParams(location.search).get('name');
            if (!name) { showError('Missing <code>?name=…</code> parameter.'); return; }
            const d = await api(`/site/${encodeURIComponent(name)}`);
            if (!d || !d.name) { showError(`Site <strong>${name}</strong> not found.`); return; }
            render(d);
        }

        document.getElementById('edit-form').addEventListener('submit', saveDetails);
        loadSite();
    </script>
</body>
</html>
