# /etc/nginx/secubox.d/metalogizer.conf
# Installed by secubox-metalogizer package

# Metalogizer frontend
location /metalogizer/ {
    alias /usr/share/secubox/www/metalogizer/;
    index index.html;
    try_files $uri $uri/ /metalogizer/index.html;
}

# Metalogizer API
location /api/v1/metalogizer/ {
    proxy_pass http://unix:/run/secubox/metalogizer.sock:/;
    include /etc/nginx/snippets/secubox-proxy.conf;
}
