# /etc/nginx/secubox-routes.d/devwatch.conf
# Installed by secubox-devwatch — auto-registered on install, removed on purge.

# Static frontend: vhost dashboard (index), Hall cardlet (micro), admin panel.
location /devwatch/ {
    alias /usr/share/secubox/www/devwatch/;
    index index.html;
    try_files $uri $uri/ /devwatch/index.html;
}

# API backend (Unix socket). Summary is public/read; admin writes are JWT-gated
# by the app itself.
location /api/v1/devwatch/ {
    proxy_pass http://unix:/run/secubox/devwatch.sock:/;
    include /etc/nginx/snippets/secubox-proxy.conf;
}
