# /etc/nginx/secubox-routes.d/searxng.conf — composant searxng de secubox-metanews (#3581).
#
# API seulement : la page /searxng/ est servie par la racine statique du vhost d'administration
# (/usr/share/secubox/www/searxng/), sans alias ni try_files (MODULE-COMPLIANCE, AURORA-REFERENCE § 9).
# Gardes dans l'API (require_lecture, require_jwt) ; pas d'error_page : les erreurs restent en JSON.
# AUCUNE exposition publique : ni vhost, ni nom, ni route WAF. SearXNG lui-même n'écoute que sur br-lxc.
location /api/v1/searxng/ {
    rewrite ^/api/v1/searxng/(.*)$ /$1 break;
    proxy_pass http://unix:/run/secubox/searxng.sock;
    include /etc/nginx/snippets/secubox-proxy.conf;
}
