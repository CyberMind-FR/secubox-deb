<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MetaNews · observer le monde</title>
<style>
:root{
  --bg:#0c1116; --panel:#131b22; --ink:#e8ecf0; --mut:#8b98a6; --line:#233039;
  --cyan:#2fd0f5; --cyan-s:rgba(47,208,245,.12); --mint:#4ade80; --amber:#e0b355;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;align-items:baseline;gap:.6em;flex-wrap:wrap;margin-bottom:2px}
h1{font-size:1.5rem;margin:0;letter-spacing:.02em}
.tagline{color:var(--mut);font-size:.85rem;font-family:ui-monospace,"JetBrains Mono",monospace}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0}
.tab{font:600 11px/1 ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;
  padding:7px 12px;border:1px solid var(--line);border-radius:20px;background:var(--panel);
  color:var(--mut);cursor:pointer}
.tab.on{color:var(--cyan);border-color:var(--cyan)}
.srch{width:100%;padding:9px 12px;background:var(--panel);border:1px solid var(--line);border-radius:8px;
  color:var(--ink);font-size:.95rem;margin-bottom:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px;overflow:hidden}
.card h2{font-size:1.15rem;margin:0 0 6px}
.vign{float:left;width:108px;height:108px;object-fit:cover;border-radius:10px;margin:2px 14px 8px 0;background:#0000000f}
.card .foot{clear:both}
@media(max-width:520px){.vign{width:74px;height:74px}}
.meta{font-family:ui-monospace,monospace;font-size:11px;color:var(--mut);display:flex;gap:8px 14px;flex-wrap:wrap;margin-bottom:8px}
.meta b{color:var(--cyan)}
.conf{display:inline-block;height:6px;width:56px;background:var(--line);border-radius:3px;overflow:hidden;vertical-align:middle}
.conf>i{display:block;height:100%;background:var(--cyan)}
.dek{color:var(--ink);margin:6px 0 10px}
.tags{color:var(--cyan);font-family:ui-monospace,monospace;font-size:12px;margin-bottom:6px}
.src{color:var(--mut);font-size:.85rem;margin-bottom:10px}
.foot{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:600 12px/1 ui-monospace,monospace;letter-spacing:.04em;padding:8px 12px;border-radius:8px;
  border:1px solid var(--line);background:transparent;color:var(--cyan);cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--cyan)}
.srcs{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px;display:none}
.srcs.open{display:block}
.srcs a{display:block;color:var(--cyan);font-size:.9rem;padding:3px 0;text-decoration:none}
.srcs .t{color:var(--mut);font-size:.8rem}
.empty{color:var(--mut);text-align:center;padding:40px 0}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>📡 MetaNews</h1><span class="tagline">observer le monde</span></header>
  <div class="tabs" id="tabs"></div>
  <input class="srch" id="q" placeholder="🔎 rechercher un événement, un lieu, une personne…">
  <div id="flux"><p class="empty">Chargement…</p></div>
</div>
<script>
const API="/api/v1/metanews";
let cat="une";
const CATS=[["une","À la une"],["general","Général"],["france","France"],["international","Monde"],
  ["tech","Tech"],["cyber","Cyber"],["economie","Éco"],["science","Science"]];
function el(h){const d=document.createElement("div");d.innerHTML=h;return d.firstElementChild}
function tabs(){const t=document.getElementById("tabs");t.innerHTML="";
  for(const[k,lbl]of CATS){const b=el(`<button class="tab${k===cat?" on":""}">${lbl}</button>`);
    b.onclick=()=>{cat=k;tabs();charger()};t.appendChild(b)}}
function ilya(ts){if(!ts)return"";const s=Math.max(1,Math.floor(Date.now()/1000-ts));
  if(s<3600)return`il y a ${Math.floor(s/60)} min`;if(s<86400)return`il y a ${Math.floor(s/3600)} h`;
  return`il y a ${Math.floor(s/86400)} j`}
function carte(t){
  const c=el(`<div class="card"></div>`);
  const conf=Math.round((t.confidence||0)*100);
  const vign=t.vignette?`<img class="vign" src="${API}/img?u=${encodeURIComponent(t.vignette)}" alt="" loading="lazy">`:"";
  c.innerHTML=`
    ${vign}
    <h2>${esc(t.title)}</h2>
    <div class="meta"><span><b>${t.sources_count}</b> source(s)</span>
      <span>maj ${ilya(t.updated_at)}</span>
      <span>confiance <span class="conf"><i style="width:${conf}%"></i></span> ${conf}%</span></div>
    ${t.summary?`<p class="dek">${esc(t.summary)}</p>`:""}
    ${(t.tags||[]).length?`<div class="tags">${t.tags.map(esc).join(" ")}</div>`:""}
    <div class="src">${(t.source_names||[]).map(esc).join(" · ")}</div>
    <div class="foot">
      <button class="btn bsrc">Sources ${t.sources_count}</button>
      <button class="btn bdisc">💬 Discuter${t.bbs_thread_id?" ✓":""}</button>
    </div>
    <div class="srcs"></div>`;
  const box=c.querySelector(".srcs");
  c.querySelector(".bsrc").onclick=async()=>{
    if(box.classList.contains("open")){box.classList.remove("open");return}
    const r=await fetch(`${API}/topics/${t.id}/sources`).then(r=>r.json());
    box.innerHTML=(r.sources||[]).map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener nofollow">
      ${esc(s.name)} — <span class="t">${esc(s.title)}</span></a>`).join("")||`<span class="t">—</span>`;
    box.classList.add("open");
  };
  c.querySelector(".bdisc").onclick=async(e)=>{
    const tok=localStorage.getItem("sbx_token")||"";
    const r=await fetch(`${API}/topics/${t.id}/discuss`,{method:"POST",
      headers:{"Authorization":"Bearer "+tok}}).then(r=>r.json()).catch(()=>({ok:false}));
    if(r.ok){e.target.textContent="💬 Discuter ✓";if(r.slug)window.open("/t/"+r.slug,"_blank")}
    else e.target.textContent="💬 connectez-vous";
  };
  return c;
}
function esc(s){return String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
async function charger(){
  const f=document.getElementById("flux");const q=document.getElementById("q").value.trim();
  let url=q?`${API}/search?q=${encodeURIComponent(q)}`:`${API}/topics?category=${cat}`;
  let d;try{d=await fetch(url).then(r=>r.json())}catch(e){f.innerHTML=`<p class="empty">hors ligne</p>`;return}
  const ts=d.topics||[];
  if(!ts.length){f.innerHTML=`<p class="empty">Aucun événement pour l'instant — MetaNews observe.</p>`;return}
  f.innerHTML="";ts.forEach(t=>f.appendChild(carte(t)));
}
let deb;document.getElementById("q").addEventListener("input",()=>{clearTimeout(deb);deb=setTimeout(charger,250)});
tabs();charger();setInterval(charger,60000);
</script>
</body>
</html>
