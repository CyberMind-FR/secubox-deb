<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MetaNews · observer le monde</title>
<style>
/* DESIGN SOMBRE D'ABORD, ET C'EST ASSUME : :root nu reste la palette sombre.
   Mais embarquee dans un Hall CLAIR, la page restait sombre au milieu d'une
   interface claire (#1268). On ajoute donc le miroir, avec la meme rigueur que
   pour un design clair d'abord : la requete media couvre l'etat « systeme »
   ou aucun attribut n'est pose, et [data-theme] couvre le choix explicite —
   qui doit gagner dans les DEUX sens, sinon la bascule ne marche qu'a
   l'aller. */
:root{
  --bg:#0c1116; --panel:#131b22; --ink:#e8ecf0; --mut:#8b98a6; --line:#233039;
  --cyan:#2fd0f5; --cyan-s:rgba(47,208,245,.12); --mint:#4ade80; --amber:#e0b355;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f6f8fa; --panel:#ffffff; --ink:#16202a; --mut:#5b6b7a; --line:#dde5ec;
    --cyan:#0d7f9e; --cyan-s:rgba(13,127,158,.10); --mint:#1f9d55; --amber:#a1701a;
  }
}
:root[data-theme="light"]{
  --bg:#f6f8fa; --panel:#ffffff; --ink:#16202a; --mut:#5b6b7a; --line:#dde5ec;
  --cyan:#0d7f9e; --cyan-s:rgba(13,127,158,.10); --mint:#1f9d55; --amber:#a1701a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;align-items:baseline;gap:.6em;flex-wrap:wrap;margin-bottom:2px}
h1{font-size:1.5rem;margin:0;letter-spacing:.02em}
.tagline{color:var(--mut);font-size:.85rem;font-family:ui-monospace,"JetBrains Mono",monospace}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0}
.tab{font:600 11px/1 ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;
  padding:7px 12px;border:1px solid var(--line);border-radius:20px;background:var(--panel);
  color:var(--mut);cursor:pointer}
.tab.on{color:var(--cyan);border-color:var(--cyan)}
.srch{width:100%;padding:9px 12px;background:var(--panel);border:1px solid var(--line);border-radius:8px;
  color:var(--ink);font-size:.95rem;margin-bottom:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px;overflow:hidden}
.card h2{font-size:1.15rem;margin:0 0 6px}
.vign{float:left;width:108px;height:108px;object-fit:cover;border-radius:10px;margin:2px 14px 8px 0;background:#0000000f}
.card .foot{clear:both}
@media(max-width:520px){.vign{width:74px;height:74px}}
.meta{font-family:ui-monospace,monospace;font-size:11px;color:var(--mut);display:flex;gap:8px 14px;flex-wrap:wrap;margin-bottom:8px}
.meta b{color:var(--cyan)}
.conf{display:inline-block;height:6px;width:56px;background:var(--line);border-radius:3px;overflow:hidden;vertical-align:middle}
.conf>i{display:block;height:100%;background:var(--cyan)}
.dek{color:var(--ink);margin:6px 0 10px}
.tags{color:var(--cyan);font-family:ui-monospace,monospace;font-size:12px;margin-bottom:6px}
.src{color:var(--mut);font-size:.85rem;margin-bottom:10px}
.src .src-tag{cursor:default;transition:color .12s,border-color .12s;border-bottom:1px solid transparent}
.src .src-tag:hover{color:var(--cyan);border-bottom-color:var(--cyan)}
.foot{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:600 12px/1 ui-monospace,monospace;letter-spacing:.04em;padding:8px 12px;border-radius:8px;
  border:1px solid var(--line);background:transparent;color:var(--cyan);cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--cyan)}
.srcs{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px;display:none}
.srcs.open{display:block}
.srcs a{display:block;color:var(--cyan);font-size:.9rem;padding:3px 0;text-decoration:none}
.srcs .t{color:var(--mut);font-size:.8rem}
.empty{color:var(--mut);text-align:center;padding:40px 0}
header{display:flex;align-items:baseline;gap:.6em;flex-wrap:wrap}
.gear{margin-left:auto;font:600 12px ui-monospace,monospace;background:var(--panel);border:1px solid var(--line);color:var(--cyan);border-radius:8px;padding:7px 12px;cursor:pointer}
.gear:hover{border-color:var(--cyan)}
#admin{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:8px 0 16px}
.adhead{display:flex;gap:10px;align-items:baseline;margin-bottom:10px}
.admut{color:var(--mut);font-size:.8rem;font-family:ui-monospace,monospace}
.hint{margin:12px 0 0;font-size:.78rem;line-height:1.45}
.addform{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.addform input,.addform select{background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 10px;font-size:.9rem}
.addform input#afurl{flex:1;min-width:180px}
.addform button{background:var(--cyan);color:#04222a;border:0;border-radius:8px;padding:8px 12px;font-weight:700;cursor:pointer}
.srow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:.9rem}
.srow .snm{font-weight:600;min-width:110px}
.srow .surl{color:var(--mut);font-family:ui-monospace,monospace;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.srow .scat{font-family:ui-monospace,monospace;font-size:10px;color:var(--cyan);text-transform:uppercase}
.sbadge{font-family:ui-monospace,monospace;font-size:10px;padding:2px 7px;border-radius:20px;border:1px solid var(--line)}
.sbadge.ok{color:var(--mint);border-color:var(--mint)}
.sbadge.err{color:#e8686e;border-color:#e8686e}
.sbadge.off{color:var(--mut)}
.srow button{background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:4px 8px;font-size:11px;cursor:pointer}
.srow button:hover{border-color:var(--cyan);color:var(--cyan)}
/* Carrousel des 10 dernières news (vignette + auto-rotation) */
.carou{position:relative;margin:8px 0 14px;overflow:hidden;border-radius:14px}
.cartrack{display:flex;gap:10px;transition:transform .55s ease;will-change:transform}
/* EN EMBARQUE, PAS DE BANDEAU (#1194c). Le Hall porte deja le titre et le
   contexte du service ; le repeter dans le cadre vole une hauteur qui doit
   revenir aux news. Le bouton Sources part avec — il rejoindra la megabarre
   contextuelle du Hall (a faire, cote Hall). */
html.sbx-embed header{display:none}
html.sbx-embed .wrap{padding-top:8px}
.retour{margin:0 0 12px}
.retour .btn{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer}
.ccard-mn{flex:0 0 224px;position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--panel)}
.ccard-mn img{width:100%;height:100%;object-fit:cover;display:block}
.ccard-mn .ph{width:100%;height:100%;display:grid;place-items:center;font-size:2rem;opacity:.4}
.ccard-mn .cap{position:absolute;inset:auto 0 0 0;padding:24px 10px 9px;color:#fff;font-weight:600;font-size:.82rem;line-height:1.2;
  background:linear-gradient(transparent,rgba(0,0,0,.85));display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ccard-mn .cbadge{position:absolute;top:8px;right:8px;font-family:ui-monospace,monospace;font-size:11px;font-weight:700;background:rgba(0,0,0,.55);color:#fff;border-radius:20px;padding:2px 8px}
.ccard-mn .cbadge.on{background:var(--cyan);color:#04222a}
.carnav{position:absolute;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;border:0;background:rgba(0,0,0,.5);color:#fff;font-size:20px;cursor:pointer;display:grid;place-items:center}
.carnav:hover{background:var(--cyan);color:#04222a}
.carnav.prev{left:6px}.carnav.next{right:6px}
@media(max-width:520px){.ccard-mn{flex-basis:180px}}
</style>
</head>
<body>
<script>
  // MEME REGLE QUE BILLETS : `?embed=1` que le Hall pose, ou la simple presence
  // d'un cadre — le parametre peut manquer sur un lien interne, le cadre non.
  try {
    var _q = new URLSearchParams(location.search).get('embed') === '1';
    if (_q || window.top !== window.self) {
      document.documentElement.classList.add('sbx-embed');
    }
  } catch (e) {}
</script>
<div class="wrap">
  <header><h1>📡 MetaNews</h1><span class="tagline">observer le monde</span>
    <button class="gear" id="gear" title="Gérer les flux / sources" aria-label="Sources">⚙ Sources</button></header>
  <section id="admin" hidden>
    <div class="adhead"><b>Flux &amp; sources</b> <span class="admut" id="adcount"></span>
      <span class="admut" id="adtok"></span></div>
    <form id="addform" class="addform">
      <input id="afname" placeholder="Nom (ex. Le Monde)" required>
      <input id="afurl" placeholder="URL du flux RSS/Atom" required>
      <select id="afcat">
        <option value="general">général</option><option value="france">France</option>
        <option value="international">international</option><option value="tech">tech</option>
        <option value="cyber">cyber</option><option value="economie">éco</option>
        <option value="science">science</option><option value="local">local</option>
      </select>
      <button type="submit">+ Ajouter</button>
    </form>
    <div id="adlist"></div>
    <p class="admut hint">Autres sources : Atom géré ; Mastodon/fédiverse à venir (Peek/Poke).
      Les <b>groupes Facebook</b> n'exposent pas de RSS — il faudra un pont (RSS-Bridge)
      côté connecteur, pas un flux direct.</p>
  </section>
  <div class="tabs" id="tabs"></div>
  <div class="carou" id="carou" hidden>
    <div class="cartrack" id="cartrack"></div>
    <button class="carnav prev" id="carprev" aria-label="précédent">‹</button>
    <button class="carnav next" id="carnext" aria-label="suivant">›</button>
  </div>
  <input class="srch" id="q" placeholder="🔎 rechercher un événement, un lieu, une personne…">
  <div id="flux"><p class="empty">Chargement…</p></div>
</div>
<script>
const API="/api/v1/metanews";
let cat="une";
const CATS=[["une","À la une"],["general","Général"],["france","France"],["international","Monde"],
  ["tech","Tech"],["cyber","Cyber"],["economie","Éco"],["science","Science"]];
function el(h){const d=document.createElement("div");d.innerHTML=h;return d.firstElementChild}
function tabs(){const t=document.getElementById("tabs");t.innerHTML="";
  for(const[k,lbl]of CATS){const b=el(`<button class="tab${k===cat?" on":""}">${lbl}</button>`);
    b.onclick=()=>{cat=k;tabs();charger()};t.appendChild(b)}}
function ilya(ts){if(!ts)return"";const s=Math.max(1,Math.floor(Date.now()/1000-ts));
  if(s<3600)return`il y a ${Math.floor(s/60)} min`;if(s<86400)return`il y a ${Math.floor(s/3600)} h`;
  return`il y a ${Math.floor(s/86400)} j`}
function carte(t){
  const c=el(`<div class="card"></div>`);
  c.id="sujet-"+t.id;   // ancre : le lien du cardlet vise #<id> (voir viseHash)
  const conf=Math.round((t.confidence||0)*100);
  const vign=t.vignette?`<img class="vign" src="${API}/img?u=${encodeURIComponent(t.vignette)}" alt="" loading="lazy">`:"";
  c.innerHTML=`
    ${vign}
    <h2>${esc(t.title)}</h2>
    <div class="meta"><span><b>${t.sources_count}</b> source(s)</span>
      <span>maj ${ilya(t.updated_at)}</span>
      <span>confiance <span class="conf"><i style="width:${conf}%"></i></span> ${conf}%</span></div>
    ${(t.tags||[]).length?`<div class="tags">${t.tags.map(esc).join(" ")}</div>`:""}
    <div class="src">${(t.source_names||[]).map(esc).join(" · ")}</div>
    <p class="dek"${t.summary?"":" hidden"}>${esc(t.summary||"")}</p>
    <div class="foot">
      <button class="btn bsrc">Sources ${t.sources_count}</button>
      <button class="btn bdisc">💬 Discuter${t.bbs_thread_id?" ✓":""}</button>
    </div>
    <div class="srcs"></div>`;
  const box=c.querySelector(".srcs");
  c.querySelector(".bsrc").onclick=async()=>{
    if(box.classList.contains("open")){box.classList.remove("open");return}
    const r=await fetch(`${API}/topics/${t.id}/sources`).then(r=>r.json());
    const sources=(r.sources||[]);
    box.innerHTML=sources.map(s=>`<a href="${esc(surfUrl(s.url))}" data-orig="${esc(s.url)}" data-img="${esc(s.image||"")}" data-titre="${esc(s.title||"")}" data-resume="${esc(s.summary||"")}" target="_blank" rel="noopener nofollow" title="via le proxy SecuBox — ${esc(s.url)}">
      🛰️ ${esc(s.name)} — <span class="t">${esc(s.title)}</span></a>`).join("")||`<span class="t">—</span>`;
    box.classList.add("open");
    // ── SURVOL D'UNE SOURCE : APERCU DE SON ANGLE (#1237, etendu #1240) ───────
    // Survoler une source remplace le TITRE, la VIGNETTE et le TEXTE de synthese
    // par ceux PROPRES a cette source ; en sortant on revient a la synthese.
    // ON PREFERE LA LIGNE DE SOURCES VISIBLE (les noms sous le titre) comme
    // surface de survol : on compare les angles SANS deplier. La liste depliee
    // garde aussi le survol.
    const vignEl=c.querySelector(".vign"), dekEl=c.querySelector(".dek"), h2El=c.querySelector("h2");
    const vignOrig=vignEl?vignEl.getAttribute("src"):null;
    const dekOrig=dekEl?dekEl.textContent:"", dekHid=dekEl?dekEl.hidden:false;
    const h2Orig=h2El?h2El.textContent:"";
    const survol=(elt)=>{
      elt.addEventListener("mouseenter",()=>{
        const img=elt.getAttribute("data-img"), titre=elt.getAttribute("data-titre")||"";
        if(vignEl && img){ vignEl.src=`${API}/img?u=${encodeURIComponent(img)}`; }
        if(h2El && titre){ h2El.textContent=titre; }
        if(dekEl){ const txt=elt.getAttribute("data-resume")||titre||""; if(txt){ dekEl.textContent=txt; dekEl.hidden=false; } }
      });
      elt.addEventListener("mouseleave",()=>{
        if(vignEl && vignOrig){ vignEl.src=vignOrig; }
        if(h2El){ h2El.textContent=h2Orig; }
        if(dekEl){ dekEl.textContent=dekOrig; dekEl.hidden=dekHid; }
      });
    };
    box.querySelectorAll("a").forEach(survol);
    // La ligne de sources VISIBLE devient des tags survolables, source par source.
    const srcLine=c.querySelector(".src");
    if(srcLine && sources.length){
      srcLine.innerHTML=sources.map(s=>`<span class="src-tag" data-img="${esc(s.image||"")}" data-titre="${esc(s.title||"")}" data-resume="${esc(s.summary||"")}" title="${esc(s.name)}">${esc(s.name)}</span>`).join(" · ");
      srcLine.querySelectorAll(".src-tag").forEach(survol);
    }
  };
  c.querySelector(".bdisc").onclick=async(e)=>{
    const tok=localStorage.getItem("sbx_token")||"";
    const r=await fetch(`${API}/topics/${t.id}/discuss`,{method:"POST",
      headers:{"Authorization":"Bearer "+tok}}).then(r=>r.json()).catch(()=>({ok:false}));
    if(r.ok){e.target.textContent="💬 Discuter ✓";if(r.slug)window.open("/t/"+r.slug,"_blank")}
    else e.target.textContent="💬 connectez-vous";
  };
  return c;
}
function esc(s){return String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}

// ── LIRE LES SOURCES A TRAVERS LE PROXY SURF (#1337) ────────────────────────
// Un lien d'article externe part par le relais de la box : pisteurs coupes,
// pubs retirees, contenu servi. On reecrit l'hote en son origine par-site
// (meme aplatissement que relais.py : '-' double, '.' en '-'), pour TOUTES les
// sources, pas seulement quelques-unes.
function surfOrigine(host){
  var plat = String(host||"").trim().toLowerCase().replace(/-/g,"--").replace(/\./g,"-");
  return "surf-"+plat+".gk2.secubox.in";
}
function surfUrl(u){
  try{
    var url = new URL(u);
    if(url.protocol!=="http:" && url.protocol!=="https:") return u;
    return "https://"+surfOrigine(url.hostname)+url.pathname+url.search+url.hash;
  }catch(e){ return u; }
}
async function charger(){
  const f=document.getElementById("flux");const q=document.getElementById("q").value.trim();
  let url=q?`${API}/search?q=${encodeURIComponent(q)}`:`${API}/topics?category=${cat}`;
  let d;try{d=await fetch(url).then(r=>r.json())}catch(e){f.innerHTML=`<p class="empty">hors ligne</p>`;return}
  const ts=d.topics||[];
  if(!ts.length){f.innerHTML=`<p class="empty">Aucun événement pour l'instant — MetaNews observe.</p>`;return}
  f.innerHTML="";ts.forEach(t=>f.appendChild(carte(t)));
}
let deb;document.getElementById("q").addEventListener("input",()=>{clearTimeout(deb);deb=setTimeout(charger,250)});
// ── OUVRIR UN SUJET DEPUIS LE HALL (#1194b) ─────────────────────────────────
// Le cardlet MetaNews pointe ses liens vers `#<id>`. Le front n'en faisait RIEN
// — il rendait toujours le flux global, et le clic « tombait sur le frontend »
// au lieu de la news. On lit donc le fragment : on va chercher LE sujet, on
// l'affiche seul, et on ouvre ses sources d'emblee — la « news item » demandee,
// avec les liens vers les articles reels.
async function ouvreSujet(id){
  const f=document.getElementById("flux");
  let d;
  try{ d=await fetch(`${API}/topics/${encodeURIComponent(id)}`).then(r=>r.json()); }
  catch(e){ return false; }
  if(!d||!d.ok||!d.topic) return false;
  f.innerHTML="";
  const bar=el(`<div class="retour"><button class="btn" id="btnretour">← tous les événements</button></div>`);
  f.appendChild(bar);
  const c=carte(d.topic); f.appendChild(c);
  document.getElementById("btnretour").onclick=()=>{ history.replaceState(null,"","#"); location.hash=""; charger(); };
  const b=c.querySelector(".bsrc"); if(b) b.click();   // sources ouvertes : la news
  c.scrollIntoView({block:"start"});
  return true;
}
function viseHash(){
  const h=decodeURIComponent((location.hash||"").replace(/^#/,"")).trim();
  if(h){ ouvreSujet(h); return true; }
  return false;
}
window.addEventListener("hashchange",viseHash);

// LES SOURCES EXTERNES S'OUVRENT EN SURF, DANS LE HALL (#1337). Embarque, on ne
// remplace pas le Hall (target=_blank ouvrirait un onglet nu) : on lui demande
// d'ouvrir l'adresse a travers le proxy, en overlay. Autonome, le href surf
// agit normalement.
if(document.documentElement.classList.contains("sbx-embed")){
  document.addEventListener("click", ev=>{
    const a = ev.target.closest && ev.target.closest("a[data-orig]");
    if(!a) return;
    ev.preventDefault();
    try{ parent.postMessage({sbx:"surf", url:a.dataset.orig}, "*"); }catch(e){}
  }, true);
}

tabs();
// Au chargement : si un sujet est visé, on l'ouvre ; sinon le flux normal.
if(!viseHash()) charger();
// Le rafraichissement periodique NE DOIT PAS ecraser une vue ciblee : sans ce
// garde, un sujet ouvert depuis le Hall disparaissait au bout d'une minute,
// remplace par le flux global — le bug d'origine, revenu par la porte de service.
setInterval(()=>{ if(!location.hash) charger(); },60000);

// ── SOURCES DANS LA MEGABARRE DU HALL (#1194e) ──────────────────────────────
// En embarque, le bouton « Sources » du bandeau est masque (le Hall porte le
// contexte). On POUSSE plutot la liste des flux dans la megabarre contextuelle
// du Hall, et on reagit a un clic — le service sait ce que « ouvrir cette
// source » veut dire, le Hall non.
if(document.documentElement.classList.contains('sbx-embed')){
  (async function(){
    let d; try{ d=await fetch(`${API}/sources`).then(r=>r.json()); }catch(e){ return; }
    const src=(d&&d.sources)||[];
    const items=[{cle:'__gerer', label:'Gérer les flux', icon:'⚙'}].concat(
      src.map(s=>({
        cle:'src:'+s.id,
        label:s.name,
        badge:s.category||'',
        icon: s.enabled ? (s.last_error?'⚠':'●') : '○'
      })));
    try{ parent.postMessage({sbx:'contexte', id:'metanews', titre:'Sources', items}, '*'); }catch(e){}
  })();
  window.addEventListener('message', ev=>{
    const m=ev.data; if(!m || m.sbx!=='contexte-choix') return;
    // Tout choix revele la gestion des flux — l'action du bouton « Sources »,
    // desormais declenchee depuis la megabarre.
    const admin=document.getElementById('admin');
    if(admin){ admin.hidden=false; loadSources(); admin.scrollIntoView({block:'start'}); }
  });
}

// ── Admin : gestion des flux ────────────────────────────────────────────────
const gear=document.getElementById("gear"), admin=document.getElementById("admin");
const gid=id=>document.getElementById(id);
function tok(){return localStorage.getItem("sbx_token")||""}
function authH(){return tok()?{"Authorization":"Bearer "+tok()}:{}}
gear.onclick=()=>{admin.hidden=!admin.hidden;if(!admin.hidden)loadSources();};
async function loadSources(){
  const d=await fetch(`${API}/sources`).then(r=>r.json()).catch(()=>({sources:[]}));
  const L=gid("adlist");L.innerHTML="";
  (d.sources||[]).forEach(s=>{
    const st=s.enabled?(s.last_error?`<span class="sbadge err" title="${esc(s.last_error)}">err</span>`:`<span class="sbadge ok">ok</span>`):`<span class="sbadge off">off</span>`;
    const row=el(`<div class="srow"><span class="snm">${esc(s.name)}</span>${st}<span class="scat">${esc(s.category)}</span><span class="surl">${esc(s.url)}</span></div>`);
    const bt=el(`<button>${s.enabled?"désactiver":"activer"}</button>`);
    bt.onclick=()=>patchSource(s.id,{enabled:!s.enabled});
    const bd=el(`<button title="Supprimer">🗑</button>`);
    bd.onclick=()=>{if(confirm("Supprimer « "+s.name+" » ?"))delSource(s.id)};
    row.appendChild(bt);row.appendChild(bd);L.appendChild(row);
  });
  gid("adcount").textContent=(d.sources||[]).length+" flux";
  gid("adtok").textContent=tok()?"":"— connectez-vous pour gérer";
}
async function patchSource(id,body){
  await fetch(`${API}/sources/${id}`,{method:"PATCH",headers:{...authH(),"Content-Type":"application/json"},body:JSON.stringify(body)});
  loadSources();
}
async function delSource(id){await fetch(`${API}/sources/${id}`,{method:"DELETE",headers:authH()});loadSources();}
gid("addform").addEventListener("submit",async e=>{
  e.preventDefault();
  const body={name:gid("afname").value.trim(),url:gid("afurl").value.trim(),category:gid("afcat").value,enabled:true};
  const r=await fetch(`${API}/sources`,{method:"POST",headers:{...authH(),"Content-Type":"application/json"},body:JSON.stringify(body)}).then(r=>r.json()).catch(()=>({ok:false}));
  if(r.ok){gid("afname").value="";gid("afurl").value="";loadSources();}
  else alert("échec — jeton requis (connectez-vous).");
});

// ── Carrousel des 10 dernières news (vignette + auto-rotation) ───────────────
const carou=gid("carou"), cartrack=gid("cartrack");
let carIdx=0, carTimer=null, carN=0;
const CARW=234; // 224 carte + 10 gap
async function loadCarou(){
  const d=await fetch(`${API}/topics?category=une`).then(r=>r.json()).catch(()=>({topics:[]}));
  const ts=(d.topics||[]).slice(0,10);
  if(!ts.length){carou.hidden=true;return}
  carou.hidden=false; cartrack.innerHTML="";
  ts.forEach(t=>{
    const img=t.vignette?`<img src="${API}/img?u=${encodeURIComponent(t.vignette)}" alt="" loading="lazy">`:`<div class="ph">📡</div>`;
    const bd=`<span class="cbadge${t.sources_count>1?' on':''}">🔗 ${t.sources_count}</span>`;
    cartrack.appendChild(el(`<div class="ccard-mn" role="listitem">${img}${bd}<span class="cap">${esc(t.title)}</span></div>`));
  });
  carN=ts.length; carIdx=0; carGo(0); carAuto();
}
function carGo(i){carIdx=(i%carN+carN)%carN; cartrack.style.transform=`translateX(-${carIdx*CARW}px)`;}
function carAuto(){
  if(carTimer)clearInterval(carTimer);
  if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  carTimer=setInterval(()=>carGo(carIdx+1),4000);
}
carou.addEventListener("mouseenter",()=>{if(carTimer)clearInterval(carTimer)});
carou.addEventListener("mouseleave",carAuto);
document.addEventListener("visibilitychange",()=>{if(document.hidden){if(carTimer)clearInterval(carTimer)}else carAuto()});
gid("carprev").onclick=()=>{carGo(carIdx-1);carAuto()};
gid("carnext").onclick=()=>{carGo(carIdx+1);carAuto()};
loadCarou(); setInterval(loadCarou,120000);
</script>

<script>
// THEME HERITE DE L'HOTE (#1268). Encadree par le Hall, la page decidait seule
// de son clair/sombre : un Hall clair affichait un cadre sombre en son milieu.
// Le parametre donne le theme d'ARRIVEE, le message donne les bascules
// SUIVANTES — et jamais par rechargement du cadre, qui perdrait la position.
// On n'accepte que deux valeurs : une valeur libre venue de l'URL n'a rien a
// faire dans un attribut du document.
(function () {
  var t = new URLSearchParams(location.search).get('theme');
  if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
  addEventListener('message', function (ev) {
    var d = ev.data;
    if (!d || d.sbx !== 'theme') return;
    if (d.theme === 'dark' || d.theme === 'light') {
      document.documentElement.setAttribute('data-theme', d.theme);
    }
  });
})();
</script>
