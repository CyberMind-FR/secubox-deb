  SecuBox #1262 — vue MICRO de MetaNews : la carte que le service sert lui-même.

  POURQUOI ELLE TOURNE. Une carte figée ne montre qu'un sujet sur soixante, et
  ce sujet-là n'est pas plus important que le suivant : l'agrégation n'est
  visible QUE dans le défilement. La vignette avance, et la liste avance avec
  elle — deux rythmes séparés donneraient l'impression de deux fils sans
  rapport, alors qu'ils disent la même chose.

  Le survol met la rotation en pause : on ne lit pas un titre qui s'échappe.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MetaNews — vue micro</title>
<style>
  :root { --fond:#ffffff; --texte:#1a1a22; --muted:#6b6b7a; --border:#e2e2ea; --accent:#5b46b8; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --fond:#14141c; --texte:#e8e6d9; --muted:#8a8a99;
      --border:#2a2a36; --accent:#9d8bf0; }
  }
  :root[data-theme="dark"] { --fond:#14141c; --texte:#e8e6d9; --muted:#8a8a99;
    --border:#2a2a36; --accent:#9d8bf0; }

  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; scrollbar-width:none; }
  html::-webkit-scrollbar, body::-webkit-scrollbar { width:0; display:none; }
  body { background:var(--fond); color:var(--texte);
         font-family:"Inter",system-ui,sans-serif; font-size:14px; line-height:1.45; }

  .mw { display:flex; flex-direction:column; height:100%; padding:.6rem .7rem; gap:.4rem; }
  .tete { display:flex; align-items:baseline; gap:.4rem; }
  .tete .ic { font-size:1rem; }
  .tete b { font-size:.88rem; }
  .tete .n { margin-left:auto; font-size:.56rem; letter-spacing:.08em;
             text-transform:uppercase; color:var(--muted); font-variant-numeric:tabular-nums; }

  .une { position:relative; border-radius:10px; overflow:hidden; height:96px;
         background:var(--border); flex:0 0 auto; display:block; text-decoration:none; }
  .une img { width:100%; height:100%; object-fit:cover; display:block;
             transition:opacity .35s ease; }
  .une .voile { position:absolute; inset:auto 0 0 0; padding:.4rem .5rem .35rem;
                background:linear-gradient(transparent, rgba(0,0,0,.82)); color:#fff; }
  .une .t { font-size:.76rem; font-weight:650; line-height:1.22;
            display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .une .src { position:absolute; top:6px; right:6px; background:rgba(0,0,0,.62); color:#fff;
              border-radius:20px; padding:1px 7px; font-size:.6rem;
              font-variant-numeric:tabular-nums; }
  .une.pas-d-image img { display:none; }
  .une.pas-d-image { background:linear-gradient(135deg,var(--accent),var(--border)); }

  /* LES PARTIES DU SUJET (#1262b) : hashtags, sources+métriques, source courante. */
  .parts { display:flex; flex-direction:column; gap:2px; flex:0 0 auto; }
  .parts .tags { color:var(--accent); font-family:ui-monospace,monospace; font-size:.6rem; line-height:1.3;
                 display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .parts .tags:empty { display:none; }
  .parts .srcs { display:flex; align-items:baseline; gap:5px; font-size:.62rem; color:var(--muted); line-height:1.3; }
  .parts .srcs .mx { flex:0 0 auto; font-variant-numeric:tabular-nums; color:var(--texte); font-weight:600; }
  .parts .srcs .nm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
  .parts .cur { font-size:.6rem; color:var(--accent); font-weight:600; line-height:1.3;
                overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-height:.85em; }

  .top { display:flex; flex-direction:column; gap:.1rem; }
  .top .tt { font-size:.55rem; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); }
  .top a { display:flex; align-items:baseline; gap:.34rem; font-size:.69rem; line-height:1.3;
           color:var(--texte); text-decoration:none; }
  .top a:hover .nm { text-decoration:underline; color:var(--accent); }
  .top .nm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; flex:1; }
  .top .c { flex:0 0 auto; font-size:.6rem; color:var(--muted); font-variant-numeric:tabular-nums; }
  /* La SUITE du texte de la news survolée, en place de la liste (#1240b). */
  .top .apercu { font-size:.68rem; line-height:1.42; color:var(--texte); margin-top:.05rem;
                 display:-webkit-box; -webkit-line-clamp:5; -webkit-box-orient:vertical; overflow:hidden; }

  .pied { margin-top:auto; display:flex; align-items:center; gap:6px; padding-top:.3rem;
          border-top:1px solid var(--border); font-size:.57rem; letter-spacing:.07em;
          text-transform:uppercase; color:var(--muted); text-decoration:none; }
  .pied .grow { flex:1; }
  .pied:hover { color:var(--accent); }
  /* Le point de rotation dit que la carte est VIVANTE : sans lui, un contenu
     qui change tout seul passe pour un bug d'affichage. */
  .pouls { width:5px; height:5px; border-radius:50%; background:var(--accent);
           animation:bat 2.4s ease-in-out infinite; }
  @keyframes bat { 0%,100%{opacity:.28} 50%{opacity:1} }
  @media (prefers-reduced-motion: reduce) { .pouls { animation:none; opacity:.7 } }
  .vide { font-size:.72rem; color:var(--muted); }
  /* SPICY (#1360) — filet dégradé sous l'en-tête + chiffres à halo. */
  .tete { position:relative; padding-bottom:5px; }
  .tete::after { content:""; position:absolute; left:0; right:0; bottom:0; height:2px; border-radius:2px;
    background:linear-gradient(90deg, var(--accent), #28d6ff, #f0b429); opacity:.9; }
  .tete .n, .parts .srcs .mx { text-shadow:0 0 12px color-mix(in srgb, var(--accent) 35%, transparent); }
  /* Aide reverse-design : anneaux + pastilles (aide.js, inline plus bas). */
  .sbxaide-ring { position:absolute; border:2px solid var(--accent); border-radius:8px; z-index:41;
    box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent); pointer-events:none; transition:.18s; }
  .sbxaide-pin { position:absolute; transform:translate(-50%,-50%); min-width:18px; height:18px; border-radius:10px;
    z-index:42; background:var(--accent); color:#fff; font-weight:800; font-size:.66rem; display:grid; place-items:center;
    padding:0 5px; box-shadow:0 2px 6px rgba(0,0,0,.45); pointer-events:none; }
</style>

<div class="mw">
  <div class="tete"><span class="ic">🗞️</span><b>MetaNews</b><span class="n" id="n">…</span></div>

  <a class="une" id="une" href="/" target="_top">
    <img id="une-img" alt="">
    <span class="src" id="une-src"></span>
    <span class="voile"><span class="t" id="une-t">lecture des sujets…</span></span>
  </a>

  <!-- LES PARTIES DU SUJET COURANT (#1262b), sous le titre : hashtags, sources
       agrégées + métriques, et la SOURCE COURANTE pendant la rotation. -->
  <div class="parts" id="parts">
    <div class="tags" id="parts-tags"></div>
    <div class="srcs"><span class="mx" id="parts-mx"></span><span class="nm" id="parts-nm"></span></div>
    <div class="cur" id="parts-cur"></div>
  </div>

  <div class="top" id="top"><div class="tt">↻ en rotation</div></div>

  <a class="pied" href="/" target="_top"><span class="pouls" id="pouls"></span>
    <span id="pied-t">observer le monde</span><span class="grow"></span><span id="rang"></span></a>
</div>

<script>
(function () {
  "use strict";
  var API = '/api/v1/metanews/topics?limit=24';
  var sujets = [], i = 0, enPause = false;

  var esc = function (t) {
    return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) {
      return ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' })[c];
    });
  };
  var el = function (id) { return document.getElementById(id); };

  function lien(s) { return '/#' + encodeURIComponent(s.id || ''); }

  // DÉDOUBLONNE les noms de sources (source_names répète le même média autant de
  // fois qu'il a d'articles) — on veut la LISTE des médias, pas leur fréquence.
  function noms(arr) {
    var vu = {}, out = [];
    (arr || []).forEach(function (nm) { nm = String(nm == null ? '' : nm).trim();
      if (nm && !vu[nm]) { vu[nm] = 1; out.push(nm); } });
    return out;
  }
  // Peint les PARTIES d'un sujet sous le titre : hashtags, métriques + sources.
  function poseParts(s) {
    var tg = (s.tags || []).slice(0, 6).map(esc).join(' ');
    el('parts-tags').innerHTML = tg;
    var uniq = noms(s.source_names), n = Number(s.sources_count || 0) || uniq.length;
    var imp = Math.round(Number(s.importance || 0));
    el('parts-mx').textContent = '🔗 ' + n + (imp ? ' · ⚡' + imp : '');
    el('parts-nm').textContent = uniq.slice(0, 5).join(' · ') + (uniq.length > 5 ? ' +' + (uniq.length - 5) : '');
    el('parts-cur').textContent = '';   // pas de source courante hors rotation
  }

  function montre() {
    if (!sujets.length) return;
    var s = sujets[i % sujets.length];
    var une = el('une'), img = el('une-img');
    // On ne pose l'image QUE si elle existe : une source vide laisse le
    // navigateur afficher l'icône de fichier cassé, ce qui salit la carte.
    if (s.vignette) { une.classList.remove('pas-d-image'); img.src = s.vignette; }
    else { une.classList.add('pas-d-image'); img.removeAttribute('src'); }
    une.href = lien(s);
    el('une-t').textContent = s.title || '—';
    var n = Number(s.sources_count || 0);
    el('une-src').textContent = n ? n + ' src' : '';
    poseParts(s);   // hashtags + sources + métriques du sujet courant, sous le titre

    // La liste suit la vignette : elle montre CE QUI VIENT, pas le début du
    // classement. Deux rythmes séparés donneraient deux fils sans rapport.
    var suite = [], k;
    for (k = 1; k <= 3 && k < sujets.length; k++) suite.push(sujets[(i + k) % sujets.length]);
    el('top').innerHTML = '<div class="tt">↻ en rotation</div>' + suite.map(function (t) {
      return '<a href="' + esc(lien(t)) + '" data-id="' + esc(t.id || '') + '" data-titre="'
        + esc(t.title || '') + '" target="_top" title="' + esc(t.title) + '">'
        + '<span class="nm">' + esc(t.title || '—') + '</span>'
        + '<span class="c">' + (Number(t.sources_count || 0) || '') + '</span></a>';
    }).join('');
    el('rang').textContent = ((i % sujets.length) + 1) + '/' + sujets.length;
  }

  function tourne() { if (!enPause && sujets.length) { i++; montre(); } }

  // LE SURVOL SUSPEND L'AUTO-ROTATION (#1266). On ne lit pas un titre qui
  // s'échappe sous le curseur — mais surtout, tant qu'on survole, la rotation
  // automatique (tourne, 6 s) ne doit PAS refaire montre() : elle re-rendrait la
  // liste et la vignette, effaçant l'aperçu manuel qu'on est en train de lire.
  //
  // On lie donc mouseenter/mouseleave à la RACINE `.mw`, SANS capture. C'est tout
  // l'intérêt de ces deux événements : ils ne se déclenchent qu'en entrant ou
  // sortant du cardlet ENTIER, en ignorant les passages d'un enfant à l'autre.
  // L'ancienne écoute en capture sur `document` les captait pour CHAQUE enfant :
  // en balayant la liste, `enPause` retombait à false entre deux liens et l'auto
  // reprenait, parasitant justement la rotation manuelle qu'on voulait protéger.
  var racine = document.querySelector('.mw');
  if (racine) {
    racine.addEventListener('mouseenter', function () { enPause = true; });
    racine.addEventListener('mouseleave', function () { enPause = false; stopAp(); montre(); });
  }

  // ── APERÇU AU SURVOL D'UNE NEWS DE LA LISTE (#1240b) ──────────────────────
  // Survoler une news de la liste fait ROTATIONNER la vignette et le titre sur
  // SES sources (média + nom, source par source), et remplace la liste par la
  // SUITE du texte de cette news (le résumé propre à la source affichée).
  // L'agrégation se lit alors sans quitter la carte.
  var apTimer = null, srcCache = {};
  function stopAp() { if (apTimer) { clearInterval(apTimer); apTimer = null; } }
  // rotationne la VIGNETTE + le TITRE sur les sources ; avecTexte=true remplace
  // en plus la liste par la SUITE du texte (résumé de la source affichée).
  function rotationne(srcs, titre, avecTexte) {
    if (!srcs || !srcs.length) return;
    var j = 0;
    var pas = function () {
      var s = srcs[j % srcs.length], une = el('une'), img = el('une-img');
      if (s.image) { une.classList.remove('pas-d-image'); img.src = '/api/v1/metanews/img?u=' + encodeURIComponent(s.image); }
      else { une.classList.add('pas-d-image'); img.removeAttribute('src'); }
      el('une-t').textContent = s.title || titre;
      el('une-src').textContent = s.name || '';
      // LA SOURCE COURANTE (#1262b) : le média dont on montre l'angle, sous le titre.
      var pc = el('parts-cur'); if (pc) pc.textContent = s.name ? ('🛰️ ' + s.name) : '';
      if (avecTexte) {
        el('top').innerHTML = '<div class="tt">🛰️ ' + esc(s.name || 'source') + '</div>'
          + '<div class="apercu">' + esc(String(s.summary || s.title || '—').slice(0, 240)) + '</div>';
      }
      j++;
    };
    pas();
    if (srcs.length > 1) apTimer = setInterval(pas, 2200);   // rotation si plusieurs
  }
  function avecSources(id, cb) {
    if (srcCache[id]) { cb(srcCache[id]); return; }
    fetch('/api/v1/metanews/topics/' + encodeURIComponent(id) + '/sources',
          { headers: { 'Accept': 'application/json' } })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) { var s = (d && d.sources) || []; srcCache[id] = s; cb(s); })
      .catch(function () {});
  }
  // VIGNETTE PRINCIPALE : aperçu COMPLET — vignette+titre rotationnés ET la SUITE
  // du texte remplace la liste.
  el('une').addEventListener('mouseenter', function () {
    if (!sujets.length) return;
    var s = sujets[i % sujets.length];
    if (s && s.id) { stopAp(); avecSources(s.id, function (srcs) { rotationne(srcs, s.title || '', true); }); }
  });
  el('une').addEventListener('mouseleave', function () { stopAp(); montre(); });
  // LIEN D'UNE NEWS « À SUIVRE » : preview de la VIGNETTE+TITRE seulement (rotation
  // des sources si plusieurs), PAS le texte détaillé — la liste reste en place.
  el('top').addEventListener('mouseover', function (ev) {
    var a = ev.target.closest ? ev.target.closest('a[data-id]') : null;
    if (!a || a === el('top')._h) return;
    el('top')._h = a; stopAp();
    avecSources(a.getAttribute('data-id'), function (srcs) { rotationne(srcs, a.getAttribute('data-titre') || '', false); });
  });
  el('top').addEventListener('mouseleave', function () { el('top')._h = null; stopAp(); montre(); });

  function charge() {
    fetch(API, { headers: { 'Accept': 'application/json' } })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        sujets = (d && d.topics) || [];
        el('n').textContent = sujets.length ? sujets.length + ' sujets' : '';
        if (!sujets.length) {
          el('une-t').textContent = 'Aucun sujet agrégé';
          el('pouls').style.animation = 'none';
          return;
        }
        montre();
      })
      .catch(function () { el('une-t').textContent = 'MetaNews injoignable'; });
  }

  charge();
  setInterval(tourne, 6000);
  // Le fond bouge en dizaines de minutes : recharger plus souvent afficherait
  // les mêmes sujets en chargeant la box.
  setInterval(charge, 300000);

  (function () {
    var t = new URLSearchParams(location.search).get('theme');
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
  })();

  // RESTER DANS LE HALL (#1266). Un lien de cardlet en target="_top" REMPLACE
  // le Hall par le service : on perd la mosaique, la barre media et tout ce
  // qui joue. Encadre, on demande donc au Hall d'embarquer la page ; hors
  // cadre, le lien fonctionne normalement — la carte reste une page valide,
  // et c'est ce repli qui autorise a garder target="_top" dans le HTML.
  document.addEventListener('click', function (ev) {
    if (parent === window) return;
    var a = ev.target && ev.target.closest ? ev.target.closest('a[href]') : null;
    if (!a || ev.defaultPrevented || ev.button !== 0 || ev.metaKey || ev.ctrlKey) return;
    ev.preventDefault();
    try { parent.postMessage({ sbx: 'ouvre', id: 'metanews', url: a.href }, '*'); } catch (e) {}
  }, true);

  addEventListener('message', function (ev) {
    var d = ev.data;
    if (!d || d.sbx !== 'theme') return;
    if (d.theme === 'dark' || d.theme === 'light') {
      document.documentElement.setAttribute('data-theme', d.theme);
    }
  });
})();
</script>

<!-- Aide reverse-design (#1360) — inline (cross-origin : pas d'accès à aide.js
     du Hall). Anneaux + pastilles SUR le contenu (sans voile) + report des zones
     à la bulle dédiée du Hall, au signal {sbx:'aide'} du ❓. -->
<script>
(function(){
  function post(m){ if(window.parent!==window){ try{window.parent.postMessage(m,'*'); }catch(e){} } }
  var root=document.querySelector('.mw'); if(!root) return;
  if(getComputedStyle(root).position==='static') root.style.position='relative';
  var on=false,tmr=null,nodes=[];
  function ZONES(){ return [
    {el:document.querySelector('.tete'),   label:'En-tête — MetaNews et son pouls (carte vivante)'},
    {el:document.getElementById('une'),    label:'À la une — le sujet en vedette (image + titre)'},
    {el:document.getElementById('parts'),  label:'Détails — hashtags, sources agrégées, source courante'},
    {el:document.getElementById('top'),    label:'En rotation — les sujets suivants / l’aperçu survolé'},
    {el:document.querySelector('.pied'),   label:'Pied — ouvrir MetaNews en grand'}
  ]; }
  function clear(){ nodes.forEach(function(n){n.remove();}); nodes=[]; }
  function draw(){ clear(); var rr=root.getBoundingClientRect(), Z=ZONES();
    Z.forEach(function(x,k){ if(!x.el)return; var r=x.el.getBoundingClientRect(); if(r.width<2||r.height<2)return;
      var ring=document.createElement('div'); ring.className='sbxaide-ring';
      ring.style.left=(r.left-rr.left-2)+'px'; ring.style.top=(r.top-rr.top-2)+'px';
      ring.style.width=(r.width+4)+'px'; ring.style.height=(r.height+4)+'px'; root.appendChild(ring); nodes.push(ring);
      var pin=document.createElement('div'); pin.className='sbxaide-pin'; pin.textContent=(k+1);
      pin.style.left=(r.left-rr.left+10)+'px'; pin.style.top=(r.top-rr.top)+'px'; root.appendChild(pin); nodes.push(pin);
    });
    report(rr,Z);
  }
  function report(rr,Z){ rr=rr||root.getBoundingClientRect(); Z=Z||ZONES();
    post({sbx:'aide-zones',slice:'',vw:rr.width,vh:rr.height,
      zones:Z.map(function(x){ if(!x.el)return null; var r=x.el.getBoundingClientRect(); if(r.width<2||r.height<2)return null;
        return {label:x.label,x:r.left-rr.left,y:r.top-rr.top,w:r.width,h:r.height};}).filter(Boolean)}); }
  function show(v){ on=v; if(v){ draw(); if(tmr)clearInterval(tmr); tmr=setInterval(draw,500);} else { if(tmr){clearInterval(tmr);tmr=null;} clear(); } }
  window.addEventListener('message',function(ev){var d=ev.data; if(!d)return; if(d.sbx==='aide')show(!!d.on); else if(d.sbx==='aide?')report();});
  window.addEventListener('resize',function(){ if(on)draw(); });
})();
</script>
