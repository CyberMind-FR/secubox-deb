# Vhost MetaNews — meme montage que la radio/podcaster : port 9080 partage,
# pas de porte auth_request (HAProxy tient la frontiere LAN/WAN). Le demon sert
# lui-meme sa page, ses statiques et /api/v1/metanews/.
server {
    listen 9080;
    server_name metanews.gk2.secubox.in;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/secubox/www;
        try_files $uri =404;
    }

    location /shared/ {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        alias /usr/share/secubox/www/shared/;
    }

    location / {
        proxy_pass http://unix:/run/secubox/metanews.sock:;
        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    access_log /var/log/nginx/metanews_access.log;
    error_log  /var/log/nginx/metanews_error.log;
}
