# SecuBox Metoblizer nginx configuration

location /api/v1/metoblizer/ {
    proxy_pass http://unix:/run/secubox/metoblizer.sock;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /metoblizer/ {
    alias /usr/share/secubox/www/metoblizer/;
    try_files $uri $uri/ /metoblizer/index.html;
}
