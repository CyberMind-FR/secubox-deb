<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecuBox Metoblizer</title>
    <link rel="stylesheet" href="/luci-static/resources/secubox/common.css">
    <style>
        .event-list { max-height: 400px; overflow-y: auto; }
        .event-item {
            padding: 8px 12px;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .event-item:hover { background: var(--bg-hover); }
        .event-severity {
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            text-transform: uppercase;
        }
        .event-severity.info { background: var(--cyber-cyan); color: var(--cosmos-black); }
        .event-severity.warning { background: var(--gold-hermetic); color: var(--cosmos-black); }
        .event-severity.error { background: var(--cinnabar); color: white; }
        .event-severity.critical { background: var(--void-purple); color: white; }
        .event-module { color: var(--text-muted); font-size: 0.85rem; }
        .event-time { color: var(--text-muted); font-size: 0.75rem; margin-left: auto; }
        .banner-preview {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
        }
        .banner-preview.info { background: var(--cyber-cyan); color: var(--cosmos-black); }
        .banner-preview.success { background: var(--matrix-green); color: var(--cosmos-black); }
        .banner-preview.warning { background: var(--gold-hermetic); color: var(--cosmos-black); }
        .banner-preview.error { background: var(--cinnabar); color: white; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: var(--glass-bg);
            padding: 16px;
            border-radius: 8px;
            text-align: center;
        }
        .stat-value { font-size: 2rem; font-weight: bold; color: var(--cyber-cyan); }
        .stat-label { font-size: 0.85rem; color: var(--text-muted); }
    </style>
    <link rel="stylesheet" href="/shared/hybrid-dark.css">
</head>
<body class="hybrid-dark">
    <div class="container">
        <header class="page-header">
            <h1>Metoblizer</h1>
            <p class="subtitle">Centralized Log Aggregator</p>
        </header>

        <div id="banner-container"></div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="events-count">-</div>
                <div class="stat-label">Total Events</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="modules-count">-</div>
                <div class="stat-label">Modules</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="warnings-count">-</div>
                <div class="stat-label">Warnings</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="errors-count">-</div>
                <div class="stat-label">Errors</div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <h2>Recent Events</h2>
                <button class="btn btn-sm" onclick="refresh()">Refresh</button>
            </div>
            <div class="event-list" id="event-list">
                <div class="loading">Loading events...</div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <h2>Presence Events</h2>
            </div>
            <div id="presence-list">
                <div class="loading">Loading...</div>
            </div>
        </div>
    </div>

    <script>
        const API = '/api/v1/metoblizer';

        async function fetchSummary() {
            try {
                const r = await fetch(`${API}/summary`);
                const data = await r.json();

                document.getElementById('events-count').textContent = data.events_count || 0;
                document.getElementById('modules-count').textContent = data.modules_configured || 0;
                document.getElementById('warnings-count').textContent = data.severity_breakdown?.warning || 0;
                document.getElementById('errors-count').textContent =
                    (data.severity_breakdown?.error || 0) + (data.severity_breakdown?.critical || 0);

                if (data.banner_active && data.banner) {
                    showBanner(data.banner);
                }
            } catch (e) {
                console.error('Summary fetch failed:', e);
            }
        }

        async function fetchEvents() {
            try {
                const r = await fetch(`${API}/recent?limit=50`);
                const data = await r.json();

                const list = document.getElementById('event-list');
                if (!data.events || data.events.length === 0) {
                    list.innerHTML = '<div class="empty-state">No events yet</div>';
                    return;
                }

                list.innerHTML = data.events.map(e => `
                    <div class="event-item">
                        <span class="event-severity ${e.severity || 'info'}">${e.severity || 'info'}</span>
                        <span class="event-module">${e.module}</span>
                        <span class="event-name">${e.event}</span>
                        <span class="event-time">${formatTime(e.timestamp)}</span>
                    </div>
                `).join('');
            } catch (e) {
                console.error('Events fetch failed:', e);
                document.getElementById('event-list').innerHTML =
                    '<div class="error">Failed to load events</div>';
            }
        }

        async function fetchPresence() {
            try {
                const r = await fetch(`${API}/presence`);
                const data = await r.json();

                const list = document.getElementById('presence-list');
                if (!data.events || data.events.length === 0) {
                    list.innerHTML = '<div class="empty-state">No presence events</div>';
                    return;
                }

                list.innerHTML = data.events.map(e => `
                    <div class="event-item">
                        <span class="event-module">${e.module || 'unknown'}</span>
                        <span class="event-name">${e.event || 'presence'}</span>
                        <span class="event-time">${formatTime(e.timestamp)}</span>
                    </div>
                `).join('');
            } catch (e) {
                console.error('Presence fetch failed:', e);
            }
        }

        function showBanner(banner) {
            const container = document.getElementById('banner-container');
            container.innerHTML = `
                <div class="banner-preview ${banner.type || 'info'}">
                    ${banner.message}
                    ${banner.dismissible ? '<button onclick="this.parentElement.remove()">×</button>' : ''}
                </div>
            `;
        }

        function formatTime(ts) {
            if (!ts) return '';
            try {
                const d = new Date(ts);
                return d.toLocaleTimeString();
            } catch {
                return ts;
            }
        }

        function refresh() {
            fetchSummary();
            fetchEvents();
            fetchPresence();
        }

        // Initial load
        refresh();
        // Auto-refresh every 30 seconds
        setInterval(refresh, 30000);
    </script>
</body>
</html>
