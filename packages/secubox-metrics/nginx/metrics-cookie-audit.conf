# /etc/nginx/secubox-routes.d/metrics-cookie-audit.conf — installe par secubox-metrics.
#
# Audit des cookies (RGPD / ePrivacy, #159) : ingest, report, summary. Ces
# routes sont servies par le demon metrics mais vivent HORS de /api/v1/metrics/,
# chemin qu'appellent le bandeau de sante (SECUBOX_COOKIE_AUDIT_SUMMARY, pose
# par sbxwaf), le portail et cookie-inventory.js. Sans cette location, la
# `location /api/` generique les enverrait a l'agregateur, qui ne les connait
# pas (#1777, ref #1748).
#
# secubox-proxy.conf porte le verdict LAN (X-SecuBox-LAN) dont depend
# require_lecture, et les en-tetes CORS.
location /api/v1/cookie-audit/ {
    proxy_pass http://unix:/run/secubox/metrics.sock:/api/v1/cookie-audit/;
    include /etc/nginx/snippets/secubox-proxy.conf;
    # Clients XHR : on laisse passer le corps JSON des 4xx de l'amont.
    proxy_intercept_errors off;
    # Un instantane de cookies tient en quelques kilo-octets.
    client_max_body_size 64k;
}
