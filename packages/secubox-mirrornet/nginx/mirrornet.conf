# API MirrorNet v1 (#3645) : socket dédiée, gardes côté API. Jamais de vhost public. Dépôt de versions de jeux de
# données (#3653) : corps jusqu'au plafond de l'API (256 Mio par défaut), transmis en flux sans tampon disque nginx.
# Dépôt d'une version : SEULE route au corps volumineux, transmis en flux. Ailleurs 1 Mio : FastAPI lit le corps avant la
# garde, un envoi géant sans session ne doit pas dépasser la mémoire du service.
location ~ "^/api/v1/mirrornet/datasets/[0-9a-f]{16,64}/versions$" {
    proxy_pass http://unix:/run/secubox/mirrornet.sock;
    proxy_set_header X-SecuBox-LAN $lan_client;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    client_max_body_size 256m;
    proxy_request_buffering off;
}
location /api/v1/mirrornet/ {
    proxy_pass http://unix:/run/secubox/mirrornet.sock:/api/v1/mirrornet/;
    proxy_set_header X-SecuBox-LAN $lan_client;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    client_max_body_size 1m;
}
