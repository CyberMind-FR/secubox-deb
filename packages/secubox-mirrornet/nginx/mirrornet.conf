# API MirrorNet v1 (#3645) : socket dédiée, lecture seule en phase 2, gardes côté API. Jamais de vhost public.
location /api/v1/mirrornet/ {
    proxy_pass http://unix:/run/secubox/mirrornet.sock:/api/v1/mirrornet/;
    proxy_set_header X-SecuBox-LAN $lan_client;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}
