# Phase 7.B (#498) — SecuBox honeypot routes.
#
# Bot signatures we observe daily : scanners probing for /wp-admin, /.env,
# /.git/config, /phpmyadmin, /server-status, /.htaccess, /admin/login.php,
# common CVE paths (/cgi-bin, /actuator/env, /api/v1/.env).
#
# Strategy : return a stable 200 OK with empty body. The scanner records
# the response but the slowloris/scrape doesn't trigger CrowdSec http-probing
# scenario (which needs 404s). Instead we log to a dedicated file that the
# WAF's threats.log path also reads — repeat hits cross BAN_THRESHOLD →
# Phase 7.A LAPI alert → nft drop.
#
# This file is included from the main vhosts via :
#   include /etc/nginx/secubox-routes.d/honeypot.conf;
#
# NB : exact paths chosen are EXTREMELY UNLIKELY to be hit by a legitimate
# user. If your site needs /wp-admin (you run WordPress), comment it out
# below and rely on the WAF pattern matching instead.

# WordPress probes
location ~ ^/(wp-admin|wp-login|wp-includes|wp-content|xmlrpc\.php)(/|$) {
    access_log /var/log/nginx/honeypot.log secubox_honeypot;
    return 200 "";
}

# Environment files + git exposure (= top recon target)
location ~ ^/(\.env|\.git/config|\.htaccess|\.htpasswd|composer\.json|package\.json|\.DS_Store)$ {
    access_log /var/log/nginx/honeypot.log secubox_honeypot;
    return 200 "";
}

# Common admin paths
location ~ ^/(phpmyadmin|pma|myadmin|adminer|server-status|server-info)(/|$) {
    access_log /var/log/nginx/honeypot.log secubox_honeypot;
    return 200 "";
}

# Spring Boot Actuator / framework leaks
location ~ ^/(actuator|management|api/v1/\.env|api/health|debug/pprof)(/|$) {
    access_log /var/log/nginx/honeypot.log secubox_honeypot;
    return 200 "";
}

# CVE-style paths : Log4Shell, ProxyShell, etc.
location ~ ^/(autodiscover|ews/exchange|owa|powershell)(/|$) {
    access_log /var/log/nginx/honeypot.log secubox_honeypot;
    return 200 "";
}
