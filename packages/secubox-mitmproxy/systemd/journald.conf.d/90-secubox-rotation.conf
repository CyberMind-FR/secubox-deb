# Phase 6.P (#496) — bound journal disk use.
# Default install lets the journal grow to ~10% of /var space (multi-GB on
# 8-32GB systems). On SecuBox hardware with mixed workloads, that creates
# memory pressure (queue retention) and slow journalctl queries.
#
# 200M is plenty for a 2-week sliding window of operational logs.

[Journal]
SystemMaxUse=200M
SystemMaxFileSize=20M
MaxRetentionSec=2week
# Forwarding to syslog doubles disk write cost. systemd-journald is
# already the authoritative log store on SecuBox-Deb.
ForwardToSyslog=no
