# Phase 6.O (#496) : Transparent Huge Pages 'always' causes compaction stalls
# on Armada under memory pressure. madvise lets apps opt-in (none here do),
# which avoids the stalls.
w /sys/kernel/mm/transparent_hugepage/enabled - - - - madvise
