<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecuBox - WAF Threats &amp; Enforcement</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/shared/crt-light.css">
    <link rel="stylesheet" href="/shared/sidebar-light.css">
    <style>
      :root{--p31-peak:#00dd44;--p31-hot:#00ff55;--p31-mid:#009933;--p31-dim:#006622;--p31-decay:#ffb347;--tube-light:#e8f5e9;--tube-pale:#c8e6c9;--tube-soft:#a5d6a7;--bg-card:var(--tube-pale);--border:var(--tube-soft);--text-dim:var(--p31-dim);--red:#ff4466;--bloom-text:0 0 2px var(--p31-peak),0 0 6px var(--p31-peak);--bloom-soft:0 0 6px var(--p31-peak)}
      *{box-sizing:border-box;margin:0;padding:0}
      body{font-family:'Courier Prime','Courier New',monospace;background:var(--tube-light);color:#0a0a0f;display:flex;min-height:100vh}
      .main{flex:1;padding:1.2rem 1.5rem;max-width:1100px;margin:auto}
      .header{display:flex;justify-content:space-between;align-items:center;padding:1rem 1.5rem;border:1px solid var(--border);background:var(--bg-card);margin-bottom:1.5rem}
      h1{font-size:1.3rem;color:var(--p31-hot);text-shadow:var(--bloom-text);letter-spacing:0.05em}
      .badge{font-size:0.7rem;background:var(--p31-peak);color:#0a0a0f;padding:0.2rem 0.6rem;border-radius:99px;font-weight:bold}
      .badge.off{background:#666;color:#fff}
      .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem;margin-bottom:1.5rem}
      .card{background:var(--bg-card);border:1px solid var(--border);padding:1rem;text-align:center;box-shadow:var(--bloom-soft)}
      .card .v{font-size:1.8rem;color:var(--p31-hot);font-weight:bold;display:block;text-shadow:var(--bloom-text)}
      .card .l{font-size:0.75rem;color:var(--text-dim)}
      .section{background:var(--bg-card);border:1px solid var(--border);padding:1rem;margin-bottom:1.2rem}
      .section h2{color:var(--p31-hot);font-size:1rem;margin-bottom:0.7rem;padding-bottom:0.4rem;border-bottom:1px solid var(--border)}
      table{width:100%;border-collapse:collapse;font-size:0.84rem}
      th,td{text-align:left;padding:0.4rem 0.6rem;border-bottom:1px solid var(--border)}
      th{color:var(--p31-hot);background:rgba(0,221,68,0.06)}
      code{background:#1a1a25;color:var(--p31-hot);padding:0.1rem 0.4rem;border-radius:2px;font-size:0.78rem}
      .empty{color:var(--text-dim);font-style:italic;padding:1rem;text-align:center}
    </style>
</head>
<body>
<nav class="sidebar" id="sidebar"></nav>
<div class="main">
    <div class="header">
      <h1>🛡 WAF Threats &amp; Enforcement</h1>
      <span class="badge" id="bridge-badge">…</span>
    </div>

    <div class="grid">
      <div class="card"><span class="v" id="bans-pushed">0</span><span class="l">🚫 Bans pushed (CrowdSec)</span></div>
      <div class="card"><span class="v" id="bans-failed">0</span><span class="l">❌ Bans failed</span></div>
      <div class="card"><span class="v" id="rl-offenders">0</span><span class="l">⏳ Rate-limit offenders</span></div>
      <div class="card"><span class="v" id="hp-hits">0</span><span class="l">🍯 Honeypot hits (1h)</span></div>
      <div class="card"><span class="v" id="blocked">0</span><span class="l">🛑 WAF blocked</span></div>
      <div class="card"><span class="v" id="warnings">0</span><span class="l">⚠ WAF warnings</span></div>
    </div>

    <div class="section">
      <h2>📜 Recent bans (origin = secubox-waf)</h2>
      <table id="bans-table"><thead><tr><th>IP</th><th>Scenario</th><th>Expiration</th></tr></thead>
        <tbody id="bans-tbody"><tr><td colspan="3" class="empty">loading…</td></tr></tbody>
      </table>
    </div>

    <div class="section">
      <h2>🔍 Recent threats (last 20)</h2>
      <table id="threats-table"><thead><tr><th>Time</th><th>IP</th><th>Category</th><th>Host</th><th>Path</th></tr></thead>
        <tbody id="threats-tbody"><tr><td colspan="5" class="empty">loading…</td></tr></tbody>
      </table>
    </div>
</div>

<script src="/shared/sidebar.js"></script>
<script>
const API = '/api/v1/mitmproxy/waf';
function headers() {
    const t = localStorage.getItem('secubox_token');
    return t ? { 'Authorization': 'Bearer ' + t } : {};
}
async function refresh() {
    try {
        const r = await fetch(API + '/enforcement', { headers: headers() });
        if (!r.ok) throw new Error(r.status);
        const d = await r.json();
        document.getElementById('bridge-badge').textContent = d.bridge_enabled ? '✓ Bridge ON' : '○ Bridge OFF';
        document.getElementById('bridge-badge').className = 'badge' + (d.bridge_enabled ? '' : ' off');
        document.getElementById('bans-pushed').textContent = d.bans_pushed;
        document.getElementById('bans-failed').textContent = d.bans_failed;
        document.getElementById('rl-offenders').textContent = d.rate_limit_offenders;
        document.getElementById('hp-hits').textContent = d.honeypot_hits_last_hour;
        document.getElementById('blocked').textContent = d.blocked;
        document.getElementById('warnings').textContent = d.warnings;

        const btb = document.getElementById('bans-tbody');
        if (!d.recent_bans || !d.recent_bans.length) {
            btb.innerHTML = '<tr><td colspan="3" class="empty">aucun ban actif</td></tr>';
        } else {
            btb.innerHTML = d.recent_bans.map(b =>
                '<tr><td><code>' + b.ip + '</code></td><td>' + (b.scenario || '?') + '</td><td>' + (b.expiration || '?') + '</td></tr>'
            ).join('');
        }

        const ttb = document.getElementById('threats-tbody');
        if (!d.recent_threats || !d.recent_threats.length) {
            ttb.innerHTML = '<tr><td colspan="5" class="empty">aucun threat récent</td></tr>';
        } else {
            ttb.innerHTML = d.recent_threats.map(t =>
                '<tr><td>' + (t.timestamp || '?').slice(11, 19) +
                '</td><td><code>' + (t.client_ip || '?') + '</code></td>' +
                '<td>' + (t.category || '?') + '</td>' +
                '<td>' + (t.host || '?') + '</td>' +
                '<td><code>' + (t.path || '?').slice(0, 50) + '</code></td></tr>'
            ).join('');
        }
    } catch (e) {
        document.getElementById('bridge-badge').textContent = 'err ' + e.message;
    }
}
refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
