# SecuBox Modem API
# /etc/nginx/secubox.d/modem.conf

# Modem static files
location /modem/ {
    alias /usr/share/secubox/www/modem/;
    try_files $uri $uri/ /modem/index.html;
}

# Modem API (REST)
location /api/v1/modem/ {
    proxy_pass http://unix:/run/secubox/modem.sock:/;
    include /etc/nginx/snippets/secubox-proxy.conf;
}

# WebSocket for AT terminal
location /api/v1/modem/at/console {
    proxy_pass http://unix:/run/secubox/modem.sock:/api/v1/modem/at/console;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 86400;
}
