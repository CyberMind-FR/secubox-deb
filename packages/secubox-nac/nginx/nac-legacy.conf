# mac-guard, device-intel et iot-guard sont servis par nac (Client Guardian) depuis #817 ;
# #2050 (S1) retire leurs paquets : les anciennes adresses mènent ici.
# Pages : 301 vers /nac/. API : 410 (les routes de données ont changé de forme, pas de 308 aveugle).
location = /mac-guard { return 301 /nac/; }
location /mac-guard/ { return 301 /nac/; }
location /api/v1/mac-guard/ { return 410; }

location = /device-intel { return 301 /nac/; }
location /device-intel/ { return 301 /nac/; }
location /api/v1/device-intel/ { return 410; }

location = /iot-guard { return 301 /nac/; }
location /iot-guard/ { return 301 /nac/; }
location /api/v1/iot-guard/ { return 410; }
