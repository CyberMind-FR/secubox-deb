# SecuBox nDPId API proxy
location /api/v1/ndpid/ {
    proxy_pass http://unix:/run/secubox/ndpid.sock:/api/v1/ndpid/;
    include /etc/nginx/snippets/secubox-proxy.conf;
}

# nDPId dashboard static files
location /ndpid/ {
    alias /usr/share/secubox/www/ndpid/;
    index index.html;
    try_files $uri $uri/ =404;
}
