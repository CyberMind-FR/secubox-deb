# /etc/secubox/netboot.toml — secubox-netboot (#737)
[server]
# hôte HTTP servant images/boot.fit + TFTP (réutilise apt.secubox.in ou un vhost dédié)
http_base = "http://boot.gk2.secubox.in:8099"
tftp_root = "/srv/secubox/netboot/tftp"

[overlay]
max_tries = 3            # bootcount avant rollback usine auto
key_hint  = "secubox-netboot"

[security]
require_signed_fit = true   # refuse de poser un overlay non signé
confirm_required   = true   # toute action overlay/flash exige confirm=true
