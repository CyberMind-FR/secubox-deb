# SecuBox-Deb :: vhost serveur de boot (#737) — boot.<board>.secubox.in
#
# EXCEPTION DOCTRINE ASSUMÉE : U-Boot/wget ne sait pas TLS ni s'authentifier.
# Ce vhost est donc HTTP SIMPLE, HORS WAF, en LECTURE SEULE, et ne sert QUE des
# artefacts à intégrité garantie par SIGNATURE FIT (boot.fit / sbx-uboot.fit).
# Aucun secret, aucune écriture, aucune route applicative ici. À binder sur
# l'interface LAN uniquement (pas d'exposition Internet).
#
# Les U-Boot fetchent : http://boot.gk2.secubox.in/<board-id>/boot.fit
# Repli TFTP en parallèle (tftpd-hpa, même racine /srv/secubox/netboot/tftp).

server {
    listen 80;
    # LAN only — adapter/compléter par l'IP LAN du serveur de boot.
    listen 192.168.1.200:80;
    server_name boot.gk2.secubox.in;

    root /srv/secubox/netboot/http;
    autoindex off;
    sendfile on;
    tcp_nopush on;
    server_tokens off;

    # seuls les artefacts de boot, lecture seule
    location / {
        add_header X-SecuBox-NetBoot "signed-fit" always;
        try_files $uri =404;
    }

    # interdit tout sauf GET/HEAD
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    access_log /var/log/nginx/netboot-access.log;
    error_log  /var/log/nginx/netboot-error.log;
}
