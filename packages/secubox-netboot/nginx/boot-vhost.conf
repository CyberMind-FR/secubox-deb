# SecuBox-Deb :: vhost serveur de boot (#737) — boot.<board>.secubox.in
#
# EXCEPTION DOCTRINE ASSUMÉE : U-Boot/wget ne sait pas TLS ni s'authentifier.
# Ce vhost est donc HTTP SIMPLE, HORS WAF, en LECTURE SEULE, et ne sert QUE des
# artefacts à intégrité garantie par SIGNATURE FIT (boot.fit / sbx-uboot.fit).
# Aucun secret, aucune écriture, aucune route applicative ici. À binder sur
# l'interface LAN uniquement (pas d'exposition Internet).
#
# Les U-Boot fetchent : http://boot.<domaine>:8099/<board-id>/boot.fit
# Repli TFTP en parallèle (tftpd-hpa, même racine /srv/secubox/netboot/tftp).

server {
    # Gabarit (#3100/#3117) : `secubox-netboot-serve up` remplace le marqueur d'adresse
    # par l'adresse privée de CETTE box (SBX_NETBOOT_ADRESSE, sinon la source de
    # la route par défaut). Jamais 0.0.0.0 : le live n'est servi qu'au LAN.
    listen @ADRESSE_LAN@:8099;
    # Seul bloc sur cette adresse:port, il répond de toute façon ; boot.*
    # nomme le service de CETTE box sans livrer de nom propre à une box.
    server_name boot.*;

    root /srv/secubox/netboot/http;
    autoindex off;
    sendfile on;
    tcp_nopush on;
    server_tokens off;

    # seuls les artefacts de boot, lecture seule
    location / {
        # LAN seulement (le live, son système et les images eMMC) : dans le gabarit même, plus par un snippet.
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        add_header X-SecuBox-NetBoot "signed-fit" always;
        try_files $uri =404;
    }

    # lot de flash signé (#3100) : code de jonction à usage unique + ancre du maître, remis au live
    # d'une box en cours de flash. LAN seulement ; 6 par heure et par adresse (limite faite par l'API).
    location = /lot-flash {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://unix:/run/secubox/netboot.sock:/lot-flash;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-SecuBox-Netboot-Lot "1";
        # adresse du maître que le live a jointe : portée par le code de jonction (#3100)
        proxy_set_header X-SecuBox-Adresse-Serveur $server_addr;
        # route sans jeton : aucun verdict LAN ni maillage transmis, un client ne peut pas les forger
        proxy_set_header X-SecuBox-LAN "";
        proxy_set_header X-SecuBox-Maillage "";
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    # interdit tout sauf GET/HEAD
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    access_log /var/log/nginx/netboot-access.log;
    error_log  /var/log/nginx/netboot-error.log;
}
