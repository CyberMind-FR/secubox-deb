# SecuBox-Deb :: netboot SERVER — artefacts de boot servis aux U-Boot (#737)
# /sbxboot/<board-id>/boot.fit (+ images) : SANS auth (U-Boot ne s'authentifie pas)
# — l'intégrité est garantie par la SIGNATURE FIT, pas par le transport. Statique,
# autoindex off, lecture seule. Racine alimentée par secubox-netboot-publish.
location /sbxboot/ {
    alias /srv/secubox/netboot/http/;
    autoindex off;
    # gros fichiers (images) : pas de buffering, sendfile
    sendfile on;
    tcp_nopush on;
    add_header X-SecuBox-NetBoot "signed-fit" always;
    try_files $uri =404;
}
