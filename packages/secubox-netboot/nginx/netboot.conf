# SecuBox-Deb :: netboot route (#737). App FastAPI servie à la racine du socket
# (/probe, /status, ...) → on retire le préfixe (motif rewrite, cf. WAF).
location /netboot/ {
    alias /usr/share/secubox/www/netboot/;
    index index.html;
    try_files $uri $uri/ /netboot/index.html;
}
location /api/v1/netboot/ {
    rewrite ^/api/v1/netboot/(.*)$ /$1 break;
    proxy_pass http://unix:/run/secubox/netboot.sock;
    include /etc/nginx/snippets/secubox-proxy.conf;
    proxy_intercept_errors on;
}
