# /etc/nginx/secubox.d/newsbin.conf
# Installed by secubox-newsbin -- auto-registered on install, removed on purge
location /api/v1/newsbin/ {
    proxy_pass http://unix:/run/secubox/newsbin.sock:/;
    include /etc/nginx/snippets/secubox-proxy.conf;
}
