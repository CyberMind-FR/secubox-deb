# /etc/nginx/sites-available/nextcloud.conf — Nextcloud public vhost
# Installed by secubox-nextcloud (#282). Operator enables with:
#   ln -s ../sites-available/nextcloud.conf /etc/nginx/sites-enabled/
#   systemctl reload nginx
#
# Public chain: Browser → HAProxy:443 (cert) → sbxwaf → nginx:9080
#               (nc.gk2.secubox.in) → LXC Apache (10.100.0.21:80).
# Operator wires the HAProxy SNI ACL, the sbxwaf haproxy-routes.json
# entry, and the ACME cert separately (CLAUDE.md WAF rule).
#
# Nextcloud uses absolute asset paths (/core/img/…, /apps/…, /index.php/…)
# so it MUST live at vhost root — never proxy under a subpath without an
# elaborate sub_filter rewrite.

# Entrée sans mot de passe (#1562) — voir location = /sbx/entrer.
map $sbx_nc $sbx_nc_entree {
    ""      "/index.php/login?direct=1";
    default "/index.php/apps/user_saml/saml/login?originalUrl=https://$host/apps/files/";
}
# Le chemin court /login passe par la réécriture Apache, qui PERD la requête :
# user_saml n'y voit jamais direct=1. Tout GET /login part donc sur
# /index.php/login?direct=1, où le paramètre arrive (le formulaire poste déjà
# sur /index.php/login, direct dans le corps).
#
# AVEC une session SecuBox (cookie secubox_session du domaine de la box), le
# même GET part sur /sbx/entrer : le compte s'ouvre sans formulaire (#1665),
# qu'on arrive de « Mes comptes », d'un favori ou de l'adresse tapée. Le
# formulaire reste joignable à la main (?direct=1) et après une déconnexion
# (?clear=1). Pas de boucle : /sbx/entrer sans compte lié rend le formulaire
# direct, et une session refusée y retombe aussi (@sbx_sans_session).
map "$request_method:$uri:$arg_direct:$arg_clear" $sbx_nc_login_get {
    "GET:/login::"                auto;
    "~^GET:/login:"               form;
    "GET:/index.php/login::"      auto;
    "~^GET:/index.php/login::"    form;   # ?clear=1 sans direct
    default                       "";
}
map "$sbx_nc_login_get:$cookie_secubox_session" $sbx_nc_login_direct {
    "~^auto:.+"  2;
    "~^auto:$"   1;
    "~^form:"    1;
    default      0;
}

server {
    listen 9080;
    listen [::]:9080;
    server_name nc.gk2.secubox.in nextcloud.gk2.secubox.in;

    # ACME HTTP-01 challenge — outside SSO so renewals work from the
    # public internet. MUST come before the catch-all proxy.
    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/secubox/www;
        try_files $uri =404;
    }

    # Health Banner injection (consistent with sibling vhosts).
    sub_filter_types text/html;
    sub_filter_once on;
    sub_filter "</body>" '<script src="/shared/health-banner.js"></script></body>';

    # Shared assets — banner JS, error pages (LAN-only).
    location /shared/ {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        add_header Access-Control-Allow-Origin "*" always;
        alias /usr/share/secubox/www/shared/;
    }

    # Nextcloud Apache proxied to the LXC at root. NC handles its own
    # auth (web login, app-passwords for mobile, OAuth) — no gate here.
    #
    # No auth_request gate on purpose (#394): the official Nextcloud mobile
    # client uses HTTP Basic with an app-password and carries no browser
    # cookie, so gating /remote.php/webdav/* + /ocs/* would 401→redirect and
    # lock the mobile client out. NC's own login is the protection.
    # ── ENTRER AVEC SA SESSION SECUBOX, SANS MOT DE PASSE (#1562) ──────────
    # Même modèle que le BBS (#1360) : /auth/verify contrôle la session, et
    # l'en-tête X-Sbx-Nextcloud-User est ÉCRASÉ ici avec la valeur obtenue,
    # VIDÉ partout ailleurs (location /), et ignoré par l'Apache du conteneur
    # s'il ne vient pas de l'hôte. user_saml (mode variable d'environnement)
    # ouvre ce compte ; le formulaire et les mots de passe d'application des
    # clients mobiles (#394) restent tels quels (back-ends multiples).
    location = /sbx/entrer {
        auth_request /__sbx_verifie_secubox;
        auth_request_set $sbx_nc $upstream_http_remote_sbx_nextcloud;
        error_page 401 403 = @sbx_sans_session;
        # « Lecture LAN » : /auth/verify répond 200 SANS identité — ce n'est pas
        # une session. Pas de compte lié : le formulaire, comme avant. Choisi
        # par la map $sbx_nc_entree et NON par un `if` : un `if` s'évalue à la
        # phase rewrite, AVANT auth_request, et verrait toujours $sbx_nc vide.
        proxy_pass http://10.100.0.21:80$sbx_nc_entree;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Sbx-Nextcloud-User $sbx_nc;
    }

    location = /__sbx_verifie_secubox {
        internal;
        proxy_pass http://unix:/run/secubox/aggregator.sock:/api/v1/auth/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    location @sbx_sans_session { return 302 /index.php/login?direct=1; }

    location / {
        proxy_set_header X-Sbx-Nextcloud-User "";   # jamais venu d'un client (#1562)
        # user_saml en mode variable d'environnement renvoie TOUT GET /login
        # sans « direct=1 » vers son entrée SSO — sans en-tête, « non
        # provisionné » : le formulaire disparaîtrait pour tout le monde. Le
        # POST du formulaire porte direct dans son corps, on ne le touche pas.
        if ($sbx_nc_login_direct = 2) { return 302 /sbx/entrer; }
        if ($sbx_nc_login_direct = 1) { return 302 /index.php/login?direct=1&$args; }
        proxy_pass http://10.100.0.21:80/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 300s;
        client_max_body_size 0;        # large Nextcloud uploads
        proxy_request_buffering off;
    }

    # (ex-gate SSO retiré en #394 — NC s'authentifie lui-même.)

    access_log /var/log/nginx/nextcloud_access.log;
    access_log /var/log/nginx/secubox-hosts.log sbx_host;
    error_log  /var/log/nginx/nextcloud_error.log;
}
