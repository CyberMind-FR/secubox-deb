# /etc/secubox/oidc.toml — fournisseur OpenID Connect de la box (#1589).
#
# L'ÉMETTEUR est l'adresse publique sous laquelle le Hall sert /oidc/ ; les
# services (PhotoPrism, Mastodon…) la connaissent et la comparent à l'« iss »
# de chaque id_token. La changer invalide les connexions en cours.
issuer = "https://hall.gk2.secubox.in/oidc"

# Domaine des adresses de courriel synthétiques (personne sans boîte liée) ;
# vide = dérivé de l'émetteur (hall.<domaine> → <domaine>).
domaine_mail = ""
