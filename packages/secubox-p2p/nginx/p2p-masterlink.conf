# SecuBox-Deb :: secubox-p2p — écouteur d'enrôlement MirrorNet, port 7331 (#1360)
#
# sbx-mesh-invite et sbx-mesh-join visent http://<maître>:7331/api/v1/p2p/
# master-link/…. Or `API_PORT = 7331` n'était qu'une constante : le module sert
# une socket unix, et le paquet ne livrait AUCUN écouteur. Le protocole
# d'enrôlement était donc injoignable sur tout maître Debian.
#
# LAN SEULEMENT, et seulement les routes master-link : l'enrôlement fait entrer
# un pair dans le mesh WireGuard. La jonction valide elle-même son jeton ; on
# réduit en plus la surface à ceux qui sont déjà sur le réseau local.
# #2883 : une box rattachee par wg-autoload ou wg-mesh arrive par son tunnel,
# pas par le LAN : elle recevait 403. Ces deux reseaux d'administration sont
# admis pour CET ecouteur seulement ; le jeton reste valide par le module.
geo $p2p_enrol_tunnel {
    default        0;
    10.64.0.0/16   1;   # wg-autoload (Auto-Load)
    10.10.0.0/24   1;   # wg-mesh
}
map "$lan_client$p2p_enrol_tunnel" $p2p_enrol_ok {
    default 0;
    "~1"    1;
}

# #3133 : la source est dans le maillage wg-mesh -> X-SecuBox-Pair: 1. nginx écrase l'en-tête à chaque requête,
# un client ne peut donc pas le forger.
geo $remote_addr $p2p_pair_maille {
    default        0;
    10.10.0.0/24   1;
}

server {
    listen 7331;
    server_name _;

    location /api/v1/p2p/master-link/ {
        if ($p2p_enrol_ok = 0) { return 403; }
        proxy_pass http://unix:/run/secubox/p2p.sock:/master-link/;
        proxy_set_header Host $host;
        proxy_set_header X-SecuBox-LAN $lan_client;   # verdict LAN (#1354)
        proxy_set_header X-SecuBox-Pair $p2p_pair_maille;   # pair du maillage (#3133)
        proxy_read_timeout 30s;
    }
    location / { return 404; }
}
