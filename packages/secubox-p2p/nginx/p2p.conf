# p2p API
location /api/v1/p2p/ {
    proxy_pass http://unix:/run/secubox/p2p.sock:/;
    include /etc/nginx/snippets/secubox-proxy.conf;
    # #3133 : X-SecuBox-Pair n'est posé (jeton secret) que par l'écouteur 7331 du maillage ; ici on le VIDE toujours
    # (défense en profondeur : sans le jeton exact, l'en-tête ne vaut rien de toute façon).
    proxy_set_header X-SecuBox-Pair "";
    proxy_intercept_errors on;
}
