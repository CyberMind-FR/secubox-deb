# /etc/nginx/sites-available/peertube.conf — PeerTube public vhost.
# BACKPORTÉ dans le paquet (#390) : jusqu'ici hand-managé sur gk2, désormais
# versionné ici et posé en conffile ; activé par symlink en postinst.
#
# Public chain: Browser → HAProxy:443 (cert) → nginx:9080 (peertube.gk2.secubox.in)
#               → conteneur PeerTube (10.100.0.120:9000).
#
# Bypasses mitmproxy WAF intentionally — video streaming and large uploads
# are high-volume binary that the WAF cannot meaningfully inspect, and the
# admin/auth endpoints are gated by PeerTube's own user system. Matches the
# documented gitea exception pattern.

server {
    include snippets/secubox-errorpages.conf;
    listen 0.0.0.0:9080;
    server_name peertube.gk2.secubox.in;
    include snippets/secubox-waking.conf;  # secubox phase-2 wake splash (nginx-sync)

    # Large file uploads (videos). PeerTube enforces its own size cap.
    client_max_body_size 8G;

    # ACME HTTP-01 challenge — outside WAF for renewals.
    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/secubox/www;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://10.100.0.120:9000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;

        # WebTorrent + live streams use long-lived connections.
        proxy_read_timeout 7d;
        proxy_send_timeout 7d;
        proxy_buffering    off;
        proxy_request_buffering off;

        # WebSockets (live chat, P2P tracker handshake).
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $http_connection;
    }

    access_log /var/log/nginx/peertube_access.log;
    access_log /var/log/nginx/secubox-hosts.log sbx_host;
    error_log  /var/log/nginx/peertube_error.log;
}
