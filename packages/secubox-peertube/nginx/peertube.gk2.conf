# /etc/nginx/sites-available/peertube.conf — PeerTube public vhost.
# BACKPORTÉ dans le paquet (#390) : jusqu'ici hand-managé sur gk2, désormais
# versionné ici et posé en conffile ; activé par symlink en postinst.
#
# Public chain: Browser → HAProxy:443 (cert) → nginx:9080 (peertube.gk2.secubox.in)
#               → conteneur PeerTube (10.100.0.120:9000).
#
# Bypasses sbxwaf intentionally — video streaming and large uploads
# are high-volume binary that the WAF cannot meaningfully inspect, and the
# admin/auth endpoints are gated by PeerTube's own user system. Matches the
# documented gitea exception pattern.

server {
    # Le reveil PRECEDE les pages d'erreur : les deux declarent `error_page 502 503 504`, nginx retient la premiere (#2251).
    include snippets/secubox-waking.conf;  # secubox phase-2 wake splash (nginx-sync)
    include snippets/secubox-errorpages.conf;
    listen 0.0.0.0:9080;
    server_name peertube.gk2.secubox.in peertube.*;

    # Large file uploads (videos). PeerTube enforces its own size cap.
    client_max_body_size 8G;

    # ACME HTTP-01 challenge — outside WAF for renewals.
    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/secubox/www;
        try_files $uri =404;
    }

    # ── ENTRER AVEC SA SESSION SECUBOX, SANS MOT DE PASSE (#1562) ──────────
    # Même modèle que le BBS et le Cloud : /auth/verify contrôle la session ;
    # X-Sbx-Peertube-User est ÉCRASÉ sur la route d'authentification du greffon
    # peertube-plugin-secubox-sso et VIDÉ partout ailleurs. Le greffon n'ouvre
    # qu'un compte existant qui lui est rattaché ; sinon, le formulaire.
    location = /sbx/entrer {
        # Adresse stable ; le greffon renvoie vers sa route versionnée.
        proxy_pass http://10.100.0.120:9000/plugins/secubox-sso/router/entrer;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Sbx-Peertube-User "";
    }

    location ~ ^/plugins/secubox-sso/[^/]+/auth/secubox$ {
        auth_request /__sbx_verifie_secubox;
        auth_request_set $sbx_pt $upstream_http_remote_sbx_peertube;
        error_page 401 403 = @sbx_sans_session;
        proxy_pass http://10.100.0.120:9000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Sbx-Peertube-User $sbx_pt;
    }

    location = /__sbx_verifie_secubox {
        internal;
        proxy_pass http://unix:/run/secubox/aggregator.sock:/api/v1/auth/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    location @sbx_sans_session { return 302 /login; }

    location / {
        proxy_set_header X-Sbx-Peertube-User "";   # jamais venu d'un client (#1562)
        proxy_pass http://10.100.0.120:9000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;

        # WebTorrent + live streams use long-lived connections.
        proxy_read_timeout 7d;
        proxy_send_timeout 7d;
        proxy_buffering    off;
        proxy_request_buffering off;

        # WebSockets (live chat, P2P tracker handshake).
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $http_connection;
    }

    access_log /var/log/nginx/peertube_access.log;
    access_log /var/log/nginx/secubox-hosts.log sbx_host;
    error_log  /var/log/nginx/peertube_error.log;
}
