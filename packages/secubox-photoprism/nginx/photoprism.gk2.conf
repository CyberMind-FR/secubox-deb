# /etc/nginx/sites-available/photoprism.conf — PhotoPrism public vhost.
# BACKPORTÉ dans le paquet : jusqu'ici hand-managé sur gk2, désormais versionné
# ici et posé en conffile ; activé par symlink en postinst.
#
# Public chain: Browser → HAProxy:443 (cert) → nginx:9080 (photoprism.gk2.secubox.in)
#               → conteneur PhotoPrism (10.100.0.130:2342).
#
# Bypasses mitmproxy WAF intentionally — photo uploads are high-volume
# binary the WAF cannot meaningfully inspect, and PhotoPrism handles
# its own auth. Matches the documented gitea + peertube exception pattern.

server {
    include snippets/secubox-errorpages.conf;
    listen 0.0.0.0:9080;
    server_name photoprism.gk2.secubox.in;
    include snippets/secubox-waking.conf;  # secubox phase-2 wake splash (nginx-sync)

    client_max_body_size 2G;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/secubox/www;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://10.100.0.130:2342;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering    off;
        proxy_request_buffering off;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $http_connection;
    }

    access_log /var/log/nginx/photoprism_access.log;
    access_log /var/log/nginx/secubox-hosts.log sbx_host;
    error_log  /var/log/nginx/photoprism_error.log;
}
