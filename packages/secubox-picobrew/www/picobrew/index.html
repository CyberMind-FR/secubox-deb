<!DOCTYPE html>
<!-- SPDX-License-Identifier: LicenseRef-CMSD-1.0 -->
<html lang="fr" class="hybrid-dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SecuBox — PicoBrew</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/hybrid-dark.css">
<style>
  :root{
    --p31-dim:#6b7b8b; --bg-dark:#0d1117; --bg-card:rgba(30,40,55,.8);
    --bg-row:rgba(20,30,45,.6); --border:rgba(100,150,200,.2); --text:#e8e6d9;
    --cyan:#00d4ff; --red:#ff4466; --green:#00dd44;
  }
  body{font-family:'Courier Prime',monospace;color:var(--text);background:var(--bg-dark)}
  .main{display:flex;flex-direction:column;height:100vh;box-sizing:border-box}
  .bar{display:flex;justify-content:space-between;align-items:center;gap:.6rem;flex-wrap:wrap;
    padding:.55rem .8rem;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;margin-bottom:.6rem}
  .bar h1{font-size:1.05rem;color:var(--cyan);text-shadow:0 0 8px var(--cyan);margin:0}
  .bar .st{font-size:.72rem;color:var(--p31-dim);margin-left:.6rem}
  .dot{display:inline-block;width:.6rem;height:.6rem;border-radius:50%;background:var(--p31-dim);margin-right:.3rem;vertical-align:middle}
  .dot.on{background:var(--green);box-shadow:0 0 6px var(--green)} .dot.off{background:var(--red)}
  .btns{display:flex;flex-wrap:wrap;gap:.4rem}
  .btn{font-family:inherit;font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;
    color:var(--text);background:var(--bg-row);border:1px solid var(--border);border-radius:6px;
    padding:.4rem .75rem;cursor:pointer;transition:border-color .15s,box-shadow .15s}
  .btn:hover{border-color:var(--cyan);box-shadow:0 0 8px rgba(0,212,255,.4)}
  .btn.primary{border-color:var(--cyan);color:var(--cyan)}
  .btn[disabled]{opacity:.4;cursor:not-allowed}
  .frame-wrap{flex:1;position:relative;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:#fff}
  iframe{width:100%;height:100%;border:0;display:block}
  .placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    text-align:center;color:var(--p31-dim);font-size:.9rem;background:var(--bg-dark);padding:2rem}
  .toast{position:fixed;bottom:1rem;right:1rem;background:var(--cyan);color:#07121a;padding:.6rem 1rem;
    border-radius:6px;font-size:.8rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
  .toast.show{opacity:1} .toast.error{background:var(--red);color:#fff}
  @media(max-width:768px){.main{margin-left:0}}
</style>
</head>
<body class="hybrid-dark">
<nav class="sidebar" id="sidebar"></nav>
<script src="/shared/sidebar.js"></script>

<main class="main">
  <div class="bar">
    <div>
      <h1 style="display:inline">🍺 PicoBrew</h1>
      <span class="st" id="st"><span class="dot" id="dot"></span>chargement…</span>
    </div>
    <div class="btns">
      <button class="btn" id="b-start" onclick="act('start','Démarrage')">▶ Démarrer</button>
      <button class="btn" id="b-stop" onclick="act('stop','Arrêt')">⏹ Arrêter</button>
      <button class="btn" onclick="load()">↻ Rafraîchir</button>
      <a class="btn primary" id="a-open" href="https://picobrew.gk2.secubox.in/" target="_blank" rel="noopener">↗ Plein écran</a>
    </div>
  </div>

  <div class="frame-wrap">
    <iframe id="app" title="Interface PicoBrew" referrerpolicy="no-referrer"></iframe>
    <div class="placeholder" id="ph">Conteneur à l'arrêt — démarre-le pour afficher l'interface PicoBrew.</div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
// L'interface complète de picobrew_pico est embarquée via son sous-domaine
// LAN-confiné (même domaine parent → cert wildcard valide, pas de mixed-content).
const APP_URL = 'https://picobrew.gk2.secubox.in/';
const API = '/api/v1/picobrew';
const $ = (id) => document.getElementById(id);

function toast(msg, isErr) {
  const t = $('toast'); t.textContent = msg;
  t.className = 'toast show' + (isErr ? ' error' : '');
  setTimeout(() => { t.className = 'toast'; }, 2600);
}
async function J(path, opts) {
  const r = await fetch(API + path, Object.assign({credentials:'same-origin'}, opts||{}));
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
async function load() {
  try {
    const d = await J('/status');
    const running = !!d.running;
    $('dot').className = 'dot ' + (running ? 'on' : 'off');
    const sha = (d.pinned_sha && d.pinned_sha !== 'none') ? d.pinned_sha.slice(0,8) : '—';
    $('st').innerHTML = '<span class="dot ' + (running?'on':'off') + '"></span>' +
      (d.error ? d.error : (running ? 'en marche' : 'à l\'arrêt')) +
      ' · ' + (d.ip || '—') + ' · v' + sha;
    $('b-start').disabled = running; $('b-stop').disabled = !running;
    const app = $('app'), ph = $('ph');
    if (running) {
      if (app.getAttribute('src') !== APP_URL) app.setAttribute('src', APP_URL);
      ph.style.display = 'none';
    } else {
      app.removeAttribute('src'); ph.style.display = 'flex';
    }
  } catch (e) {
    $('st').innerHTML = '<span class="dot off"></span>panel injoignable (' + e.message + ')';
    toast('Statut indisponible : ' + e.message, true);
  }
}
async function act(verb, label) {
  try {
    const d = await J('/' + verb, {method:'POST'});
    toast(d && d.ok === false ? (label + ' a échoué') : (label + ' demandé'), d && d.ok === false);
  } catch (e) { toast(label + ' impossible : ' + e.message, true); }
  setTimeout(load, 1500);
}
load();
</script>
</body>
</html>
