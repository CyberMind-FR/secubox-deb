# Administration du pilotage (#3126) : chemin normal, derrière HAProxy -> sbxwaf -> nginx. Jamais exposée sur une IP de tunnel.
# Toutes les routes portent require_jwt (administrateur réel). Préfixe retiré : l'application sert à la racine.
location /api/v1/pilotage/ {
    rewrite ^/api/v1/pilotage/(.*)$ /$1 break;
    proxy_pass http://unix:/run/secubox/pilotage.sock;
    include /etc/nginx/snippets/secubox-proxy.conf;
    # en-têtes du vhost d'une box légère : posés par SON server nginx seulement, effacés ici
    proxy_set_header X-SecuBox-Version-Page "";
    proxy_set_header X-SecuBox-Pilotage-Box "";
    proxy_intercept_errors on;
}

# L5 tâche 5 : les routes du vhost d'une box légère (relais, connexion à portée) ne sont jointes QUE par le server nginx généré
# pour cette box (secubox-pilotage-vhost), jamais par l'administration du maître.
location ^~ /api/v1/pilotage/relais/ {
    return 404;
}
location ^~ /api/v1/pilotage/vhost/ {
    return 404;
}
