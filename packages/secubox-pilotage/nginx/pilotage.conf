# Administration du pilotage (#3126) : chemin normal, derrière HAProxy -> sbxwaf -> nginx. Jamais exposée sur une IP de tunnel.
# Toutes les routes portent require_jwt (administrateur réel). Préfixe retiré : l'application sert à la racine.
location /api/v1/pilotage/ {
    rewrite ^/api/v1/pilotage/(.*)$ /$1 break;
    proxy_pass http://unix:/run/secubox/pilotage.sock;
    include /etc/nginx/snippets/secubox-proxy.conf;
    proxy_intercept_errors on;
}
