# Installé par secubox-pilotage (#3126). nginx lie 10.10.0.1:8472 et 10.64.0.1:8472 ; si wg-mesh / wg-autoload montent après nginx, un
# `listen` sur une adresse absente fait tomber nginx pour toute la box. Même valeur que le sysctl de secubox-annuaire (30-...) : sans conflit.
net.ipv4.ip_nonlocal_bind = 1
