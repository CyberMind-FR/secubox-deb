  SecuBox — Console de pilotage du maître (#3702), profil Aurora (.claude/AURORA-REFERENCE.md).
  DONNÉES RÉELLES : /api/v1/pilotage (flotte, catalogue, macros, exécutions, flux d'une exécution) ; toutes les routes exigent un
  administrateur réel. Liste fermée : un bouton par action du catalogue, aucune commande libre. XSS-strict : toute valeur de l'API est
  posée par createElement/textContent, jamais en HTML ; aucun attribut d'événement en ligne.
  Flux : fetch + ReadableStream avec Authorization ; la page s'abonne au flux de l'exécution AVANT de la relire (rien de perdu entre
  les deux) ; reprise après coupure seulement si l'exécution est encore en cours. Zoom des panneaux : mise en page seule, aucun appel.
  ?embed=1 : sans menu ; ?demo=1 : données fictives, rien n'est envoyé.
-->
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecuBox — Console de pilotage</title>
    <link rel="stylesheet" href="/shared/sidebar-light.css">
    <style>
        :root{--fond:#060d1b;--trait:rgba(86,150,255,.22);--trait2:rgba(86,150,255,.38);--texte:#eaf1ff;--doux:#9fb3d6;--faible:#6f84a8;
          --cyan:#29b6f6;--bleu:#3b82f6;--vert:#2ecc71;--rouge:#ff4d5e;--orange:#ff9f1c;--violet:#a78bfa;--jaune:#ffd23f}
        *{box-sizing:border-box}
        html,body{margin:0;min-height:100%}
        body{background:radial-gradient(1200px 520px at 85% -10%,rgba(59,130,246,.2),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(41,182,246,.10),transparent 60%),var(--fond);
             color:var(--texte);font-family:"IBM Plex Sans","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.35;font-variant-numeric:tabular-nums}
        body.emb{scrollbar-width:none} body.emb::-webkit-scrollbar{display:none} body.emb #sidebar{display:none}
        .principal{min-width:0}
        body:not(.emb) .principal{margin-left:220px;padding-top:48px}
        @media (max-width:900px),(hover:none) and (pointer:coarse){body:not(.emb) .principal{margin-left:0}}
        body.mobile-mode:not(.emb) .principal{margin-left:0}
        .cadre{container-type:inline-size;container-name:a;padding:10px}
        .app{border:1px solid var(--trait2);border-radius:16px;background:linear-gradient(160deg,rgba(15,32,64,.92),rgba(7,15,32,.96));box-shadow:0 0 0 1px rgba(41,182,246,.10),0 0 38px rgba(41,182,246,.18);padding:12px;display:grid;gap:10px;align-content:start}
        .app>*{min-width:0}
        .tete{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
        .marque{display:flex;gap:10px;align-items:center;min-width:0} .marque b{font-size:1.35rem;font-weight:800;display:block} .marque small{color:var(--cyan);font-size:.72rem;letter-spacing:.06em;overflow-wrap:anywhere}
        .commande{flex:1 1 220px;min-width:0;display:flex;align-items:center;gap:8px;min-height:42px;padding:0 10px;border-radius:10px;border:1px solid var(--trait2);background:rgba(6,13,27,.8)}
        .commande:focus-within{border-color:var(--cyan)}
        .commande input{flex:1;min-width:0;background:transparent;border:0;color:var(--texte);font:inherit;outline:none}
        kbd{font:inherit;font-size:.68rem;color:var(--doux);border:1px solid var(--trait2);border-radius:5px;padding:1px 5px;white-space:nowrap}
        .actif{border:1px solid var(--vert);color:var(--vert);background:rgba(46,204,113,.12);border-radius:999px;padding:3px 12px;font-size:.72rem;font-weight:700;white-space:nowrap}
        .actif.hors{border-color:var(--rouge);color:var(--rouge);background:rgba(255,77,94,.12)} .actif.neutre{border-color:var(--faible);color:var(--doux);background:rgba(159,179,214,.12)}
        .btn{font:inherit;font-size:.78rem;min-height:34px;padding:4px 12px;border-radius:8px;border:1px solid var(--trait2);background:rgba(10,22,46,.7);color:var(--texte);cursor:pointer}
        .btn:hover{border-color:var(--cyan)} .btn:focus-visible,.tuile:focus-visible,.lien:focus-visible,.puce:focus-visible{outline:2px solid var(--cyan);outline-offset:2px} .btn:disabled{opacity:.5;cursor:default}
        .btn.primaire{background:rgba(41,182,246,.18);border-color:var(--cyan);color:#d9f2ff}
        .btn.forte{border-color:rgba(255,159,28,.7);background:rgba(255,159,28,.10)} .btn.danger{border-color:rgba(255,77,94,.7);background:rgba(255,77,94,.10)}
        .btn.sm{min-height:30px;padding:2px 9px;font-size:.72rem}
        .icone{min-width:34px;display:inline-flex;align-items:center;justify-content:center;padding:4px}
        .demo{background:var(--orange);color:#1a1000;text-align:center;font-weight:700;border-radius:8px;padding:3px 8px;font-size:.78rem}
        .info{background:var(--cyan);color:#04202a;text-align:center;font-weight:700;border-radius:8px;padding:3px 8px;font-size:.78rem} .info a{color:#04202a}
        .message{font-size:.82rem;min-height:0;overflow-wrap:anywhere} .message:empty{display:none}
        .message{border:1px solid var(--trait2);border-radius:10px;padding:7px 12px;background:rgba(41,182,246,.08)} .message.grave{border-color:var(--rouge);background:rgba(255,77,94,.10);color:#ffd9de}
        #panneaux{display:flex;flex-wrap:wrap;gap:6px;flex:1 1 100%} #panneaux[hidden]{display:none}
        #panneaux .btn[aria-current="true"]{background:var(--cyan);border-color:var(--cyan);color:#04202a;font-weight:600}
        /* suggestions de la barre de commande */
        .suggestions{border:1px solid var(--trait2);border-radius:12px;background:rgba(4,10,21,.92);padding:8px}
        .suggestions[hidden]{display:none}
        .sugg-titre{font-size:.68rem;letter-spacing:.06em;color:var(--faible);margin:0 0 6px;overflow-wrap:anywhere}
        .sugg-liste{list-style:none;margin:0;padding:0;display:grid;gap:4px}
        .sugg{width:100%;display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;text-align:left;font:inherit;color:var(--texte);background:transparent;border:1px solid transparent;border-radius:9px;padding:6px 8px;cursor:pointer;min-height:40px}
        .sugg:hover,.sugg:focus-visible,.sugg.premiere{border-color:var(--trait2);background:rgba(41,182,246,.08);outline:none}
        .sugg .type{font-size:.66rem;border:1px solid var(--trait2);border-radius:999px;padding:0 7px;color:var(--doux)} .sugg .type.macro{color:var(--violet);border-color:var(--violet)}
        .sugg .sous{color:var(--doux);font-size:.74rem;flex:1 1 160px;min-width:0;overflow-wrap:anywhere}
        /* grille de la console */
        .grille{display:grid;gap:10px;grid-template-columns:minmax(0,1fr);align-items:start}
        .colonne{display:grid;gap:10px;min-width:0;align-content:start}
        @container a (min-width:760px){.grille{grid-template-columns:240px minmax(0,1fr)} .colonne.droite{grid-column:1/-1;grid-template-columns:repeat(2,minmax(0,1fr))}}
        @container a (min-width:1100px){.grille{grid-template-columns:250px minmax(0,1fr) 290px} .colonne.droite{grid-column:auto;grid-template-columns:minmax(0,1fr)}}
        .pan{border:1px solid var(--trait);border-radius:12px;padding:10px 12px;background:rgba(10,22,46,.6);min-width:0}
        .pan-tete{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-bottom:8px}
        .pan-tete h3{margin:0;font-size:.88rem;flex:1 1 auto;min-width:0;overflow-wrap:anywhere}
        .note{color:var(--faible);font-size:.72rem}
        .vide{color:var(--faible);font-size:.78rem;padding:4px 0}
        /* zoom des panneaux */
        .console.zoom .grille{grid-template-columns:minmax(0,1fr)}
        .console.zoom .colonne{display:contents}
        .console.zoom .zoomable:not(.agrandi),.console.zoom .hors-zoom{display:none}
        .console.zoom[data-zoom="pan-flotte"] #actions-pan{display:block}
        .console.zoom .agrandir{display:none}
        .zoomable.agrandi{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(41,182,246,.12)}
        /* flotte */
        .puces{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
        .puce{font:inherit;font-size:.72rem;min-height:30px;padding:0 10px;border-radius:999px;border:1px solid var(--trait2);background:transparent;color:var(--texte);cursor:pointer}
        .puce[aria-pressed="true"]{background:var(--cyan);border-color:var(--cyan);color:#04202a;font-weight:600}
        .flotte-liste{display:grid;gap:4px;max-height:430px;overflow:auto}
        .console.zoom .flotte-liste{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));max-height:none}
        .boite{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 8px;border-radius:10px;border:1px solid var(--trait);cursor:pointer;min-width:0}
        .boite:hover{border-color:var(--trait2)} .boite.cochee{border-color:var(--cyan);background:rgba(41,182,246,.10)} .boite.muette{opacity:.7;cursor:default}
        .boite input{width:16px;height:16px;accent-color:var(--cyan);flex:none}
        .boite .pt{width:8px;height:8px;border-radius:50%;background:var(--vert);flex:none} .boite.muette .pt{background:var(--rouge)}
        .boite b{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .boite small{font-size:.68rem;color:var(--doux);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%} .boite.muette small{color:#ff8a95}
        /* actions */
        .actions{display:grid;gap:8px;grid-template-columns:repeat(2,minmax(0,1fr))}
        @container a (min-width:560px){.actions{grid-template-columns:repeat(4,minmax(0,1fr))}}
        .tuile{font:inherit;display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:9px 10px;border-radius:12px;border:1px solid var(--trait);background:linear-gradient(160deg,rgba(18,40,78,.7),rgba(8,18,38,.7));color:var(--texte);text-align:left;cursor:pointer;min-width:0;min-height:56px}
        .tuile:hover{border-color:var(--trait2)} .tuile span{font-size:.7rem;color:var(--doux);overflow-wrap:anywhere}
        .tuile.forte{border-color:rgba(255,159,28,.6);background:rgba(255,159,28,.08)} .tuile.forte span{color:var(--orange)}
        .tuile.danger{border-color:rgba(255,77,94,.6);background:rgba(255,77,94,.08)} .tuile.danger span{color:var(--rouge)}
        /* journal en direct */
        .flux-etat{font-size:.74rem;color:var(--faible)} .flux-etat.ok{color:var(--vert)} .flux-etat.coupe{color:var(--orange)}
        .filtres{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:8px} .filtres[hidden]{display:none}
        .filtres label{display:flex;align-items:center;gap:6px;font-size:.74rem;color:var(--doux)}
        select,.filtres input,.champ input{font:inherit;font-size:.8rem;color:var(--texte);background:rgba(6,13,27,.8);border:1px solid var(--trait2);border-radius:8px;min-height:34px;padding:0 8px;min-width:0}
        select:focus,.filtres input:focus,.champ input:focus{outline:none;border-color:var(--cyan)}
        .terminal{background:#040a15;border:1px solid var(--trait);border-radius:10px;padding:8px 12px;font-family:ui-monospace,"IBM Plex Mono",Menlo,monospace;font-size:.8rem;line-height:1.65;height:320px;overflow:auto}
        .console.zoom .terminal{height:560px}
        @container a (max-width:719px){.console.zoom .terminal{height:420px}}
        .ligne{overflow-wrap:anywhere} .ligne .h{color:var(--faible)} .ligne .qui{color:var(--cyan)} .ligne .qui.qui-macro{color:var(--violet)}
        .ligne .pts{color:var(--faible)} .ligne .det{color:var(--doux)}
        .e-vert{color:var(--vert)} .e-cyan{color:var(--cyan)} .e-orange{color:var(--orange)} .e-rouge{color:var(--rouge)} .e-faible{color:var(--faible)}
        .lien{font:inherit;color:var(--cyan);background:none;border:0;padding:0 2px;text-decoration:underline;cursor:pointer;text-align:left}
        .lien:hover{color:#7fd3fb}
        /* macros */
        .macros-liste{display:grid;gap:6px}
        .macro{border:1px solid var(--trait);border-radius:10px;padding:7px 9px;display:grid;gap:3px;min-width:0}
        .macro.en-cours{border-color:var(--cyan);background:rgba(41,182,246,.08)}
        .macro .l1{display:flex;align-items:center;gap:8px} .macro .l1 b{flex:1 1 auto;min-width:0;overflow-wrap:anywhere} .macro .l2{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
        .macro small{color:var(--doux);font-size:.7rem;overflow-wrap:anywhere}
        .badge{font-size:.66rem;border:1px solid var(--trait2);border-radius:999px;padding:0 7px;color:var(--doux);white-space:nowrap}
        .badge.cyan{color:var(--cyan);border-color:var(--cyan)} .badge.violet{color:var(--violet);border-color:var(--violet)}
        /* box maintenant */
        .mesures{display:grid;gap:6px}
        .mes{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;font-size:.8rem} .mes .k{color:var(--doux)}
        .barre{grid-column:1/-1;height:6px;border-radius:3px;background:rgba(159,179,214,.16);overflow:hidden} .barre i{display:block;height:100%;background:var(--vert)} .barre i.haut{background:var(--orange)} .barre i.crit{background:var(--rouge)}
        .services{margin-top:10px;display:grid;gap:5px} .services .titre{font-size:.66rem;letter-spacing:.06em;color:var(--faible)}
        .service{display:flex;align-items:center;gap:8px;min-height:36px;padding:0 4px 0 8px;border:1px solid rgba(255,77,94,.4);border-radius:9px;min-width:0}
        .service span{flex:1;min-width:0;overflow-wrap:anywhere;font-size:.8rem}
        /* fenêtres intégrées (jamais de boîte native) */
        .fond{position:fixed;inset:0;background:rgba(2,6,16,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100}
        .fond[hidden]{display:none}
        .fenetre{background:#0b1830;border:1px solid var(--trait2);border-radius:14px;padding:14px 16px;max-width:520px;width:100%;max-height:90vh;overflow:auto;display:grid;gap:10px}
        .fenetre h3{margin:0;font-size:1rem;overflow-wrap:anywhere}
        .champ{display:grid;gap:4px} .champ label{color:var(--doux);font-size:.76rem} .champ input{width:100%}
        .boutons{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
        .choix{display:flex;flex-wrap:wrap;gap:6px}
        .plan-box{display:grid;gap:4px;border:1px solid var(--trait);border-radius:10px;padding:8px} .plan-box b{overflow-wrap:anywhere}
        .fen-msg{font-size:.8rem;color:#ffd9de;overflow-wrap:anywhere} .fen-msg:empty{display:none}
        @container a (max-width:719px){kbd{display:none}}
    </style>
</head>
<body>
    <nav class="sidebar" id="sidebar"></nav>
    <main class="principal"><div class="cadre"><div class="app console" id="console">
        <header class="tete">
            <div class="marque">
                <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#29b6f6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="14" rx="2" fill="rgba(41,182,246,.14)"/><path d="m7 9 3 2.5L7 14M12 14h5"/><path d="M8 21h8"/></svg>
                <div><b>Pilotage</b><small id="sous-titre">TR-369 · MAÎTRE</small></div>
            </div>
            <label class="commande">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9fb3d6" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
                <input type="text" id="commande" autocomplete="off" spellcheck="false" aria-label="Chercher une action, une macro ou une box" aria-controls="suggestions" placeholder="Action, macro ou box…">
                <kbd>Ctrl K</kbd>
            </label>
            <span class="actif neutre" id="pastille">LECTURE…</span>
            <button type="button" class="btn" id="reduire" hidden>Réduire <kbd>Échap</kbd></button>
            <nav id="panneaux" aria-label="Panneaux de la console" hidden>
                <button type="button" class="btn" data-panneau="pan-flotte">Flotte</button>
                <button type="button" class="btn" data-panneau="pan-journal">Journal en direct</button>
                <button type="button" class="btn" data-panneau="pan-macros">Macros</button>
                <button type="button" class="btn" data-panneau="pan-box" id="nav-box">Box · maintenant</button>
            </nav>
        </header>
        <div class="demo" id="demo" hidden>DÉMONSTRATION — données fictives, rien n'est envoyé aux box</div>
        <div class="info" id="session" hidden>Aucune mesure : session requise. <a href="/login.html">Se connecter</a></div>
        <div class="message" id="message" role="status" aria-live="polite"></div>
        <div class="suggestions" id="suggestions" hidden>
            <p class="sugg-titre" id="sugg-titre"></p>
            <ul class="sugg-liste" id="sugg-liste"></ul>
        </div>

        <div class="grille">
            <section class="pan zoomable" id="pan-flotte" aria-labelledby="t-flotte">
                <div class="pan-tete">
                    <h3 id="t-flotte">Flotte</h3><span class="note" id="n-cibles">0 cible</span>
                    <button type="button" class="btn icone agrandir" data-panneau="pan-flotte" aria-label="Agrandir le panneau Flotte" title="Agrandir"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg></button>
                </div>
                <div class="puces" id="filtres" role="group" aria-label="Filtrer la flotte"></div>
                <div class="flotte-liste" id="flotte-liste"></div>
            </section>

            <div class="colonne centre">
                <section class="hors-zoom" id="actions-pan" aria-label="Actions du catalogue">
                    <div class="actions" id="actions"></div>
                </section>
                <section class="pan zoomable" id="pan-journal" aria-labelledby="t-journal">
                    <div class="pan-tete">
                        <h3 id="t-journal">Journal en direct</h3>
                        <span class="flux-etat" id="flux-etat">aucune exécution suivie</span>
                        <button type="button" class="btn sm" id="arreter" hidden>Arrêter</button>
                        <button type="button" class="btn sm" id="pause" aria-pressed="false">Pause</button>
                        <button type="button" class="btn icone agrandir" data-panneau="pan-journal" aria-label="Agrandir le panneau Journal en direct" title="Agrandir"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg></button>
                    </div>
                    <div class="filtres" id="journal-filtres" hidden>
                        <label>Box <select id="f-box"><option value="">toutes</option></select></label>
                        <label>Niveau <select id="f-niveau"><option value="">tout</option><option value="grave">écarts et échecs</option></select></label>
                        <input type="text" id="f-texte" aria-label="Filtrer le journal" placeholder="Filtrer le journal">
                    </div>
                    <div class="terminal" id="journal" role="log" aria-live="polite"></div>
                </section>
            </div>

            <div class="colonne droite">
                <section class="pan zoomable" id="pan-macros" aria-labelledby="t-macros">
                    <div class="pan-tete">
                        <h3 id="t-macros">Macros</h3>
                        <button type="button" class="btn sm" id="macro-nouvelle">Nouvelle</button>
                        <button type="button" class="btn icone agrandir" data-panneau="pan-macros" aria-label="Agrandir le panneau Macros" title="Agrandir"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg></button>
                    </div>
                    <div class="macros-liste" id="macros-liste"></div>
                </section>
                <section class="pan zoomable" id="pan-box" aria-labelledby="box-titre">
                    <div class="pan-tete">
                        <h3 id="box-titre">Box · maintenant</h3>
                        <button type="button" class="btn icone agrandir" data-panneau="pan-box" aria-label="Agrandir le panneau de la box" title="Agrandir"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg></button>
                    </div>
                    <div id="box-corps"><p class="vide">Cochez une box dans la Flotte.</p></div>
                </section>
            </div>
        </div>
    </div></div></main>

    <!-- petite fenêtre intégrée : paramètre d'une action (unité, paquet, nom) -->
    <div class="fond" id="fenetre" hidden>
        <div class="fenetre" role="dialog" aria-modal="true" aria-labelledby="fenetre-titre">
            <h3 id="fenetre-titre"></h3>
            <div id="fenetre-corps"></div>
            <div class="fen-msg" id="fenetre-msg"></div>
            <div class="boutons"><button type="button" class="btn" id="fenetre-annuler">Annuler</button></div>
        </div>
    </div>
    <!-- écran de lancement (rempli par ouvrirLancement ; plan détaillé : tâche 8) -->
    <div class="fond" id="lancement" hidden>
        <div class="fenetre" role="dialog" aria-modal="true" aria-labelledby="lancement-titre">
            <h3 id="lancement-titre"></h3>
            <div id="lancement-corps"></div>
            <div class="fen-msg" id="lancement-msg"></div>
            <div class="boutons"><button type="button" class="btn" id="lancement-annuler">Annuler</button><button type="button" class="btn primaire" id="lancement-ok">Lancer</button></div>
        </div>
    </div>

    <script src="/shared/sidebar.js"></script>
    <script>
        const API = '/api/v1/pilotage';
        const Q = new URLSearchParams(location.search), DEMO = !!Q.get('demo');
        if (Q.get('embed')) document.body.classList.add('emb');
        const $ = id => document.getElementById(id);
        const ZOOM_CLE = 'pilotage.console.zoom', JOURNAL_MAX = 500, TAMPON_MAX = 1 << 20, ATTENTE_MAX = 500, ACTUALISER_MS = 30000;

        function el(tag, cls, txt) { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = String(txt); return e; }
        function clear(e) { while (e.firstChild) e.removeChild(e.firstChild); }
        function token() { try { return localStorage.getItem('sbx_token') || ''; } catch (e) { return ''; } }
        function entetes(extra) { const h = Object.assign({}, extra || {}), t = token(); if (t) h.Authorization = 'Bearer ' + t; return h; }
        function sessionLire(cle) { try { return sessionStorage.getItem(cle); } catch (e) { return null; } }
        function sessionEcrire(cle, v) { try { sessionStorage.setItem(cle, v); } catch (e) { /* page utilisable sans */ } }
        const enc = s => encodeURIComponent(String(s));
        const nb = v => (typeof v === 'number' && Number.isFinite(v) ? v : null);
        const tiret = (v, unite) => (nb(v) == null ? '—' : v.toLocaleString('fr-FR') + (unite ? ' ' + unite : ''));
        const heure = ms => new Date(ms).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        const sans = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');

        // ---- accès à l'API (même origine, jeton en Authorization) ----
        function detail(d) {
            const x = d && d.detail != null ? d.detail : d;
            if (typeof x === 'string') return x;
            if (Array.isArray(x)) return x.map(e => (e && e.msg) || '').filter(Boolean).join(' ; ');
            return x ? JSON.stringify(x) : '';
        }
        async function api(chemin, options) {
            if (DEMO) throw new Error('démonstration : aucune requête envoyée');
            const opt = options || {};
            const o = { method: opt.method || 'GET', headers: entetes({ Accept: 'application/json' }), credentials: 'same-origin', cache: 'no-store' };
            if (opt.corps !== undefined) { o.headers['Content-Type'] = 'application/json'; o.body = JSON.stringify(opt.corps); }
            const r = await fetch(API + chemin, o);
            let d = null;
            try { d = await r.json(); } catch (e) { d = null; }
            if (r.status === 401) sessionRequise();
            if (!r.ok) { const err = new Error('refusé (HTTP ' + r.status + ')' + (detail(d) ? ' : ' + String(detail(d)).slice(0, 300) : '')); err.statut = r.status; throw err; }
            return d;
        }
        function sessionRequise() { $('session').hidden = false; pastille('SESSION REQUISE', 'neutre'); }
        function message(texte, grave) { const m = $('message'); m.textContent = texte || ''; m.className = 'message' + (grave ? ' grave' : ''); hauteur(); }
        function pastille(texte, cls) { const p = $('pastille'); p.textContent = texte; p.className = 'actif' + (cls ? ' ' + cls : ''); }

        // ---- état de la page ----
        let catalogue = [], boxes = [], groupes = {}, macros = [], executionsEnCours = new Set();
        let filtre = 'toutes', cochees = [], boxCourante = null, boxDetail = null, zoom = null;
        let courant = null, enPause = false, attente = [];

        const LIBELLES = {
            'reboot': 'redémarrer la box', 'maj-paquets': 'mettre à jour les paquets SecuBox', 'installer': 'installer une appli de la boutique',
            'service-demarrer': 'démarrer un service', 'service-arreter': 'arrêter un service', 'service-redemarrer': 'relancer un service',
            'renommer': 'renommer la box', 'renouveler': 'renouveler les secrets', 'interface-distante': 'passer en interface distante',
            'interface-locale': 'revenir en interface locale' };
        const PARAMS = { unite: 'Unité (service systemd)', paquet: 'Paquet (secubox-…)', nom: 'Nouveau nom' };
        const GROUPES = [
            { id: 'releve', titre: 'Relevé', sous: 'CPU, mémoire, services · 60 s', special: 'releve' },
            { id: 'maj', titre: 'Mettre à jour', sous: 'paquets SecuBox', actions: ['maj-paquets'] },
            { id: 'service', titre: 'Service…', sous: 'démarrer, arrêter, relancer', actions: ['service-demarrer', 'service-arreter', 'service-redemarrer'] },
            { id: 'installer', titre: 'Installer…', sous: 'appli de la boutique', actions: ['installer'] },
            { id: 'interface', titre: 'Interface…', sous: 'locale ou distante', actions: ['interface-locale', 'interface-distante'] },
            { id: 'support', titre: 'Support', sous: 'session limitée · box cliente', special: 'support' },
            { id: 'secrets', titre: 'Secrets / Renommer', sous: 'confirmation forte', actions: ['renouveler', 'renommer'] },
            { id: 'reboot', titre: 'Redémarrer', sous: 'confirmation forte', actions: ['reboot'] }];
        const ETATS = { ok: ['ok', 'vert'], terminee: ['terminée', 'vert'], en_cours: ['en cours', 'cyan'], en_attente: ['en attente', 'faible'],
            passee: ['passée', 'faible'], ecart: ['écart', 'orange'], echec: ['échec', 'rouge'], non_lancee: ['non lancée', 'faible'],
            sautee: ['sautée', 'faible'], interrompue: ['interrompue', 'orange'], arretee: ['arrêtée', 'orange'], accepte: ['acceptée', 'cyan'],
            consentement: ['accord du détenteur attendu', 'orange'], refuse: ['refusée', 'rouge'], sans_reponse: ['sans réponse', 'rouge'] };
        const GRAVES = ['ecart', 'echec', 'refuse', 'sans_reponse'];
        const MESURES = { memoire_dispo_mo: 'mémoire dispo', cpu_pct: 'CPU', swap_utilise_pct: 'swap', services_en_echec: 'services en échec' };

        const action = cle => catalogue.find(a => a.cle === cle);
        const boxDe = cle => boxes.find(b => b.cle === cle);
        const cliente = b => b.reseau !== 'maillage';
        const ciblesCochees = () => cochees.map(boxDe).filter(b => b && b.cochable);

        function nomMaitre() {
            if (DEMO) return 'DÉMO';
            const l = String(location.hostname || '').split('.').filter(x => x && !/^\d+$/.test(x) && x !== 'admin' && x !== 'www');
            return l.length ? l[0].toUpperCase() : '—';
        }

        // ---- flotte ----
        function sousTexte(b) {
            if (!b.en_ligne) { const j = nb(b.vu_le) != null ? Math.max(0, Math.floor((Date.now() / 1000 - b.vu_le) / 86400)) : null; return j == null ? 'muette' : 'muette ' + j + ' j'; }
            return [b.materiel && b.materiel !== 'autre' ? b.materiel : null, b.interface === 'distante' ? 'légère' : null, cliente(b) ? 'cliente' : null,
                b.agent_version || null].filter(Boolean).join(' · ') || '—';
        }
        function filtresFlotte() {
            const f = [['toutes', 'Toutes', null]];
            Object.keys(groupes.materiel || {}).sort().forEach(m => { if ((groupes.materiel[m] || []).length) f.push(['m:' + m, m === 'autre' ? 'Autres' : m, groupes.materiel[m]]); });
            const it = groupes.interface || {}, et = groupes.etat || {};
            if ((it.legeres || []).length) f.push(['legeres', 'Légères', it.legeres]);
            if ((et.en_ligne || []).length) f.push(['en_ligne', 'En ligne', et.en_ligne]);
            if ((et.muettes || []).length) f.push(['muettes', 'Muettes', et.muettes]);
            return f;
        }
        function rendreFlotte() {
            const f = filtresFlotte(), zone = $('filtres');
            if (!f.some(x => x[0] === filtre)) filtre = 'toutes';
            clear(zone);
            f.forEach(([id, lib]) => { const p = el('button', 'puce', lib); p.type = 'button'; p.dataset.filtre = id; p.setAttribute('aria-pressed', String(id === filtre)); zone.append(p); });
            const garde = (f.find(x => x[0] === filtre) || [])[2];
            const liste = $('flotte-liste'); clear(liste);
            cochees = cochees.filter(c => { const b = boxDe(c); return b && b.cochable; });
            const visibles = boxes.filter(b => !garde || garde.indexOf(b.cle) >= 0);
            if (!visibles.length) liste.append(el('p', 'vide', boxes.length ? 'Aucune box dans ce groupe.' : 'Aucune box connue du maître.'));
            visibles.forEach(b => {
                const l = el('label', 'boite' + (b.cochable ? '' : ' muette') + (cochees.indexOf(b.cle) >= 0 ? ' cochee' : ''));
                const c = el('input'); c.type = 'checkbox'; c.dataset.cle = b.cle; c.checked = cochees.indexOf(b.cle) >= 0; c.disabled = !b.cochable;
                c.setAttribute('aria-label', 'Cibler ' + b.nom);
                l.append(c, el('span', 'pt'), el('b', null, b.nom), el('small', null, sousTexte(b)));
                if (!b.cochable) l.title = 'box muette : jamais cochable';
                liste.append(l);
            });
            const n = ciblesCochees().length;
            $('n-cibles').textContent = n + (n > 1 ? ' cibles' : ' cible');
        }
        $('filtres').addEventListener('click', e => { const p = e.target.closest('[data-filtre]'); if (!p) return; filtre = p.dataset.filtre; rendreFlotte(); });
        $('flotte-liste').addEventListener('change', e => {
            const c = e.target.closest('input[data-cle]'); if (!c) return;
            cochees = cochees.filter(x => x !== c.dataset.cle);
            if (c.checked) { cochees.push(c.dataset.cle); choisirBox(c.dataset.cle); }
            else if (boxCourante === c.dataset.cle) choisirBox(cochees.length ? cochees[cochees.length - 1] : null);
            rendreFlotte();
        });

        // ---- actions du catalogue ----
        function rendreActions() {
            const zone = $('actions'); clear(zone);
            const rangees = new Set();
            const groupesVus = GROUPES.map(g => Object.assign({}, g, { actions: (g.actions || []).filter(k => action(k)) }))
                .filter(g => g.special || g.actions.length);
            groupesVus.forEach(g => g.actions.forEach(k => rangees.add(k)));
            const autres = catalogue.map(a => a.cle).filter(k => !rangees.has(k));
            if (autres.length) groupesVus.push({ id: 'autres', titre: 'Autres…', sous: 'actions du catalogue', actions: autres });
            groupesVus.forEach(g => {
                const fortes = g.actions.filter(k => action(k).forte);
                const t = el('button', 'tuile' + (g.actions.indexOf('reboot') >= 0 ? ' danger' : (fortes.length && fortes.length === g.actions.length ? ' forte' : '')));
                t.type = 'button'; t.dataset.groupe = g.id;
                t.append(el('b', null, g.titre), el('span', null, g.sous));
                zone.append(t);
            });
            zone.groupes = groupesVus;
        }
        $('actions').addEventListener('click', e => {
            const t = e.target.closest('[data-groupe]'); if (!t) return;
            const g = ($('actions').groupes || []).find(x => x.id === t.dataset.groupe); if (!g) return;
            if (g.special === 'releve') return releve();
            if (g.special === 'support') return support();
            if (g.actions.length === 1) return declencher(g.actions[0]);
            ouvrirFenetre(g.titre, g.actions);
        });
        function declencher(cle) {
            const a = action(cle); if (!a) return;
            if (a.parametres.length) return ouvrirFenetre(a.cle, [a.cle]);
            lancerAction(a.cle, {});
        }

        // petite fenêtre intégrée : un champ par paramètre, un bouton par action
        function ouvrirFenetre(titre, cles) {
            $('fenetre-titre').textContent = titre + (ciblesCochees().length ? ' · ' + ciblesCochees().map(b => b.nom).join(', ') : '');
            const corps = $('fenetre-corps'); clear(corps); $('fenetre-msg').textContent = '';
            const params = [];
            cles.forEach(k => action(k).parametres.forEach(p => { if (params.indexOf(p) < 0) params.push(p); }));
            params.forEach(p => {
                const c = el('div', 'champ'), id = 'param-' + p, l = el('label', null, PARAMS[p] || p), i = el('input');
                l.htmlFor = id; i.id = id; i.type = 'text'; i.autocomplete = 'off'; i.spellcheck = false; i.maxLength = 120; i.dataset.param = p;
                c.append(l, i); corps.append(c);
            });
            const choix = el('div', 'choix');
            cles.forEach(k => {
                const a = action(k), b = el('button', 'btn' + (k === 'reboot' ? ' danger' : a.forte ? ' forte' : ''), LIBELLES[k] ? LIBELLES[k][0].toUpperCase() + LIBELLES[k].slice(1) : k);
                b.type = 'button'; b.dataset.action = k; if (a.forte) b.title = 'confirmation forte : nom de chaque box retapé';
                choix.append(b);
            });
            corps.append(choix);
            $('fenetre').hidden = false;
            const premier = corps.querySelector('input, button'); if (premier) premier.focus();
        }
        function fermerFenetre() { $('fenetre').hidden = true; }
        $('fenetre-annuler').addEventListener('click', fermerFenetre);
        $('fenetre-corps').addEventListener('click', e => {
            const b = e.target.closest('[data-action]'); if (!b) return;
            const a = action(b.dataset.action), args = {};
            for (const p of a.parametres) {
                const i = $('fenetre-corps').querySelector('[data-param="' + p + '"]'), v = i ? i.value.trim() : '';
                if (!v) { $('fenetre-msg').textContent = 'Renseignez : ' + (PARAMS[p] || p) + '.'; if (i) i.focus(); return; }
                args[p] = v;
            }
            fermerFenetre();
            lancerAction(a.cle, args);
        });
        $('fenetre-corps').addEventListener('keydown', e => {
            if (e.key !== 'Enter' || !e.target.matches('input')) return;
            const b = $('fenetre-corps').querySelectorAll('[data-action]'); if (b.length === 1) { e.preventDefault(); b[0].click(); }
        });

        // ---- lancement : direct (une box, rien de fort) ou écran de lancement ----
        function lancerAction(cle, args, cibles) {
            const a = action(cle), cib = cibles || ciblesCochees();
            if (!a) return message('Action inconnue du catalogue : ' + cle, true);
            if (!cib.length) return message('Cochez au moins une box en ligne dans la Flotte.', true);
            const titre = cle + Object.keys(args).sort().map(k => ' ' + args[k]).join('');
            if (!a.forte && cib.length === 1) return envoyer('/executions/action', { action: cle, args: args }, cib, {}, titre);
            ouvrirLancement({ titre: titre, chemin: '/executions/action', corps: { action: cle, args: args }, cibles: cib, forte: a.forte });
        }
        function macroForte(m) { return (m.etapes || []).some(e => e && e.type === 'action' && action(e.action) && action(e.action).forte); }
        function lancerMacro(m) {
            let cib = ciblesCochees();
            if (!cib.length) cib = (m.cibles || []).map(boxDe).filter(b => b && b.cochable);
            if (!cib.length) return message('Cochez au moins une box en ligne pour lancer « ' + m.nom + ' ».', true);
            const chemin = '/macros/' + enc(m.id) + '/lancer', forte = macroForte(m);
            if (!forte && cib.length === 1) return envoyer(chemin, {}, cib, {}, m.nom);
            ouvrirLancement({ titre: m.nom, chemin: chemin, corps: {}, cibles: cib, forte: forte, macro: m });
        }
        // box cliente : la session de support ouverte est jointe ; sans elle, l'API refuse et son message est affiché
        async function supportsOuverts(cibles) {
            const s = {}, maintenant = Date.now() / 1000;
            for (const b of cibles.filter(cliente)) {
                try {
                    const l = await api('/boxes/' + enc(b.cle) + '/support');
                    const o = (Array.isArray(l) ? l : []).find(x => x && x.etat === 'ouvert' && (nb(x.fin) == null || x.fin > maintenant));
                    if (o) s[b.cle] = o.id;
                } catch (e) { /* refus rendu par le lancement */ }
            }
            return s;
        }
        // rend un message d'erreur (dans la page) ou '' si l'exécution est lancée et suivie
        async function envoyer(chemin, corps, cibles, confirmations, titre) {
            if (DEMO) { message('Démonstration : « ' + titre + ' » n\'est pas envoyé.'); return ''; }
            const support = await supportsOuverts(cibles);
            try {
                const d = await api(chemin, { method: 'POST', corps: Object.assign({}, corps, { cibles: cibles.map(b => b.cle), confirmations: confirmations, support: support }) });
                message('« ' + titre + ' » lancé sur ' + cibles.map(b => b.nom).join(', ') + '.');
                if (d && nb(d.execution) != null) suivreExecution(d.execution);
                return '';
            } catch (e) { message(e.message, true); return e.message; }
        }

        // écran de lancement (la tâche 8 y ajoute le plan simulé par box et par étape)
        let planLancement = null;
        function ouvrirLancement(plan) {
            planLancement = plan;
            $('lancement-titre').textContent = 'Lancer « ' + plan.titre + ' »';
            const corps = $('lancement-corps'); clear(corps); $('lancement-msg').textContent = '';
            if (plan.cibles.length > 1)
                corps.append(el('p', 'note', 'Une box après l\'autre : ' + plan.cibles[1].nom + ' ne commence qu\'une fois ' + plan.cibles[0].nom + ' revenue et son relevé sain.'));
            plan.cibles.forEach(b => {
                const bloc = el('div', 'plan-box'); bloc.append(el('b', null, b.nom));
                if (cliente(b)) bloc.append(el('small', 'note', 'box cliente : la session de support ouverte par son détenteur tient lieu de confirmation'));
                else if (plan.forte) {
                    const c = el('div', 'champ'), id = 'conf-' + b.cle.replace(/[^A-Za-z0-9_-]/g, '_'), l = el('label', null, 'Retapez « ' + b.nom + ' »'), i = el('input');
                    l.htmlFor = id; i.id = id; i.type = 'text'; i.autocomplete = 'off'; i.spellcheck = false; i.dataset.cle = b.cle; i.dataset.nom = b.nom;
                    c.append(l, i); bloc.append(c);
                }
                corps.append(bloc);
            });
            majLancer();
            $('lancement').hidden = false;
            const f = corps.querySelector('input') || $('lancement-ok'); f.focus();
        }
        function majLancer() {
            const champs = [...$('lancement-corps').querySelectorAll('input[data-cle]')];
            const k = champs.filter(i => i.value === i.dataset.nom).length;
            $('lancement-ok').disabled = k < champs.length;
            $('lancement-ok').textContent = champs.length ? 'Lancer (' + k + ' noms sur ' + champs.length + ')' : 'Lancer';
        }
        function fermerLancement() { $('lancement').hidden = true; planLancement = null; }
        $('lancement-corps').addEventListener('input', majLancer);
        $('lancement-annuler').addEventListener('click', fermerLancement);
        $('lancement-ok').addEventListener('click', async () => {
            const p = planLancement; if (!p) return;
            const conf = {};
            $('lancement-corps').querySelectorAll('input[data-cle]').forEach(i => { conf[i.dataset.cle] = i.value; });
            $('lancement-ok').disabled = true;
            const err = await envoyer(p.chemin, p.corps, p.cibles, conf, p.titre);
            if (planLancement !== p) return;
            if (err) { $('lancement-msg').textContent = err; majLancer(); } else fermerLancement();
        });

        async function releve() {
            const cib = ciblesCochees();
            if (!cib.length) return message('Cochez au moins une box en ligne dans la Flotte.', true);
            if (DEMO) return message('Démonstration : le relevé n\'est pas demandé.');
            const faits = [], refus = [];
            for (const b of cib) {
                try { await api('/boxes/' + enc(b.cle) + '/releve', { method: 'POST', corps: { duree_s: 60 } }); faits.push(b.nom); journalLocal(b, 'relevé 60 s', 'en_cours', 'demandé'); }
                catch (e) { refus.push(b.nom + ' : ' + e.message); }
            }
            message((faits.length ? 'Relevé de 60 s demandé sur ' + faits.join(', ') + '. ' : '') + refus.join(' · '), refus.length > 0);
        }
        async function support() {
            const cib = ciblesCochees().filter(cliente);
            if (!cib.length) return message('Le support concerne une box cliente : cochez-en une.', true);
            if (DEMO) return message('Démonstration : aucune session de support demandée.');
            const lignes = [];
            for (const b of cib) {
                try { const d = await api('/boxes/' + enc(b.cle) + '/support', { method: 'POST', corps: { duree_min: 30 } }); lignes.push(b.nom + ' : ' + ((ETATS[d && d.etat] || [d && d.etat])[0] || 'demandée')); }
                catch (e) { lignes.push(b.nom + ' : ' + e.message); }
            }
            message('Session de support (30 min) — ' + lignes.join(' · '));
        }

        // ---- macros ----
        function resumeEtape(e) {
            if (!e || typeof e !== 'object') return '?';
            if (e.type === 'releve') return 'relevé ' + e.duree_s + ' s';
            if (e.type === 'action') return String(e.action) + Object.keys(e.args || {}).sort().map(k => ' ' + e.args[k]).join('');
            if (e.type === 'condition') return 'si ' + (MESURES[e.mesure] || e.mesure) + ' ' + e.op + ' ' + e.seuil;
            if (e.type === 'comparer') return 'comparer ' + e.avant + '/' + e.apres;
            if (e.type === 'attendre') return 'attendre ' + e.delai_s + ' s';
            return String(e.type);
        }
        function rendreMacros() {
            const zone = $('macros-liste'); clear(zone);
            if (!macros.length) { zone.append(el('p', 'vide', 'Aucune macro.')); return; }
            macros.forEach(m => {
                const enCours = executionsEnCours.has(m.id) || (courant && courant.macroId === m.id && !courant.fini);
                const d = el('div', 'macro' + (enCours ? ' en-cours' : '')), l1 = el('div', 'l1'), l2 = el('div', 'l2');
                const b = el('button', 'btn sm' + (macroForte(m) ? ' forte' : ''), 'Lancer'); b.type = 'button'; b.dataset.macro = m.id;
                b.setAttribute('aria-label', 'Lancer ' + m.nom);
                l1.append(el('b', null, m.nom), b); d.append(l1);
                if (enCours) l2.append(el('span', 'badge cyan', 'en cours'));
                else if (m.programmation && m.programmation.quotidien) l2.append(el('span', 'badge violet', 'chaque nuit ' + m.programmation.quotidien));
                if (m.livree) l2.append(el('span', 'badge', 'livrée'));
                const et = m.etapes || [];
                l2.append(el('small', null, et.length + (et.length > 1 ? ' étapes · ' : ' étape · ') + et.map(resumeEtape).join(' → ')));
                d.append(l2);
                zone.append(d);
            });
        }
        $('macros-liste').addEventListener('click', e => { const b = e.target.closest('[data-macro]'); if (!b) return; const m = macros.find(x => x.id === b.dataset.macro); if (m) lancerMacro(m); });
        function ouvrirEditeur() { message('L\'éditeur de macro n\'est pas encore disponible sur cette console.'); }
        $('macro-nouvelle').addEventListener('click', () => ouvrirEditeur());

        // ---- la box choisie, maintenant ----
        function choisirBox(cle) {
            boxCourante = cle; boxDetail = null;
            rendreBox();

        }
