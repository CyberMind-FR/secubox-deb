# Le dé tient jusqu au kiosque, qui arrête Plymouth lui-même (#3525). Sans kiosque : arrêt standard.
[Service]
ExecStart=
ExecStart=/bin/sh -c '[ -f /var/lib/secubox/.kiosk-enabled ] || exec /usr/bin/plymouth --wait'
