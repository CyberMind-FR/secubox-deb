# podcaster.gk2.secubox.in — public SecuBox Podcaster portal (no-auth listener).
# Exposed via HAProxy -> mitmproxy_inspector (WAF) -> nginx:9080 (ref #761).
# The portal is served at the domain root; the admin UI stays on
# admin.gk2.secubox.in/podcaster/.
server {
    include snippets/secubox-errorpages.conf;
    listen 9080;
    server_name podcaster.gk2.secubox.in;
    include snippets/secubox-waking.conf;  # secubox phase-2 wake splash (nginx-sync)

    root /usr/share/secubox/www/podcaster/portal;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API backend (Unix socket). Episode media + share feed stream through here.
    location /api/v1/podcaster/ {
        proxy_pass http://unix:/run/secubox/podcaster.sock:/;
        include /etc/nginx/snippets/secubox-proxy.conf;
        client_max_body_size 0;
    }
}
