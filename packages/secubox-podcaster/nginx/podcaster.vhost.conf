# podcaster.<domaine> — public SecuBox Podcaster portal (no-auth listener).
# Exposed via HAProxy -> sbxwaf_inspector (WAF) -> nginx:9080 (ref #761).
# The portal is served at the domain root; the admin UI stays on
# admin.<domaine>/podcaster/.
server {
    # Le reveil PRECEDE les pages d'erreur : les deux declarent `error_page 502 503 504`, nginx retient la premiere (#2251).
    include snippets/secubox-waking.conf;  # secubox phase-2 wake splash (nginx-sync)
    include snippets/secubox-errorpages.conf;
    listen 9080;
    # Joker : le service de CETTE box sous son propre domaine (#3117) ;
    # aucun nom propre à une box n'est livré.
    server_name podcaster.*;

    # Polices Google servies par le cache de la box (#1875).
    include snippets/secubox-fonts*.conf;

    root /usr/share/secubox/www/podcaster/portal;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API backend (Unix socket). Episode media + share feed stream through here.
    location /api/v1/podcaster/ {
        proxy_pass http://unix:/run/secubox/podcaster.sock:/;
        include /etc/nginx/snippets/secubox-proxy.conf;
        client_max_body_size 0;
    }
}
