<!DOCTYPE html>
<!-- SPDX-License-Identifier: LicenseRef-CMSD-1.0 -->
<!-- SecuBox-Deb :: Podcaster PUBLIC portal (no auth) — CyberMind https://cybermind.fr -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Podcasts · SecuBox</title>
<style>
  :root{
    --cosmos-black:#0a0a0f; --gold-hermetic:#c9a84c; --void-purple:#6e40c9;
    --cyber-cyan:#00d4ff; --matrix-green:#00ff41; --text-primary:#e8e6d9;
    --text-muted:#6b6b7a; --panel:#13131c; --line:#23232f;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#15101f,#0a0a0f 60%);
    color:var(--text-primary);font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
  header{max-width:1000px;margin:0 auto;padding:38px 20px 18px;text-align:center}
  header .em{font-size:42px}
  header h1{margin:8px 0 4px;font-size:30px;letter-spacing:2px;color:var(--gold-hermetic)}
  header p{color:var(--text-muted);margin:0}
  .subs{display:inline-flex;gap:10px;margin-top:16px;flex-wrap:wrap;justify-content:center}
  .subs a{color:var(--cyber-cyan);text-decoration:none;border:1px solid var(--cyber-cyan);
    padding:8px 14px;border-radius:24px;font-size:13px}
  .subs a:hover{background:rgba(0,212,255,.1)}
  .filters{max-width:1000px;margin:18px auto 0;padding:0 20px;display:flex;gap:8px;flex-wrap:wrap}
  .chip{font-size:12px;padding:6px 12px;border-radius:20px;border:1px solid var(--line);
    color:var(--text-muted);cursor:pointer}
  .chip.on{color:var(--void-purple);border-color:var(--void-purple);background:rgba(110,64,201,.12)}
  main{max-width:1000px;margin:18px auto 60px;padding:0 20px}
  .ep{display:flex;gap:14px;align-items:center;padding:14px;border:1px solid var(--line);
    border-radius:12px;margin-bottom:12px;background:var(--panel)}
  .ep .n{font-size:20px;color:var(--void-purple);width:30px;text-align:center}
  .ep .meta{flex:1;min-width:0}
  .ep .meta b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
  .ep .meta span{color:var(--text-muted);font-size:12px}
  audio{height:38px;max-width:300px}
  .ep a.dl{color:var(--matrix-green);text-decoration:none;border:1px solid var(--matrix-green);
    border-radius:8px;padding:7px 10px;font-size:13px;white-space:nowrap}
  .ep a.dl:hover{background:rgba(0,255,65,.1)}
  .zipbar{max-width:1000px;margin:14px auto 0;padding:0 20px}
  .zipbar a{color:var(--gold-hermetic);text-decoration:none;border:1px solid var(--gold-hermetic);
    border-radius:24px;padding:8px 16px;font-size:13px}
  .zipbar a:hover{background:rgba(201,168,76,.12)}
  .empty{text-align:center;color:var(--text-muted);padding:60px}
  footer{text-align:center;color:var(--text-muted);font-size:11px;padding:24px}
  footer a{color:var(--text-muted)}
  @media(max-width:680px){.ep{flex-wrap:wrap}audio{max-width:100%;width:100%}}
  /* EMBARQUÉ DANS LE HALL (#1238b) : le Hall porte déjà le titre du service et
     la mégabarre. On retire donc le grand en-tête (logo + RSS) et la barre de
     filtres — les flux sont POUSSÉS dans la mégabarre contextuelle du Hall,
     comme MetaNews. La liste des épisodes remonte en haut. */
  html.sbx-embed header,
  html.sbx-embed .filters{display:none}
  html.sbx-embed main{margin-top:10px}
</style>
</head>
<body>
<script>
  // Même règle que MetaNews / Billets : `?embed=1` posé par le Hall, ou la
  // simple présence d'un cadre. Posé AVANT tout rendu, pour ne pas voir le
  // grand en-tête clignoter avant de disparaître.
  try{
    var _e = new URLSearchParams(location.search).get('embed')==='1';
    if(_e || window.top!==window.self) document.documentElement.classList.add('sbx-embed');
  }catch(e){}
</script>
<header>
  <div class="em">🎙️</div>
  <h1 id="title">Podcasts</h1>
  <p id="sub">Relayed locally by SecuBox · listen freely</p>
  <div class="subs">
    <a id="rss" href="/api/v1/podcaster/share/feed.xml" target="_blank">📡 Subscribe (RSS)</a>
    <a id="copy" href="#" onclick="copyRss(event)">🔗 Copy feed URL</a>
  </div>
</header>
<div class="filters" id="filters"></div>
<div class="zipbar" id="zipbar"></div>
<main><div id="list" class="empty">Loading…</div></main>
<footer>SecuBox Podcaster · <a href="https://cybermind.fr" target="_blank">CyberMind</a></footer>

<script>
const API="/api/v1/podcaster";
let DATA={episodes:[],feeds:{}}, FILT=null;
function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function rssUrl(){return location.origin+API+"/share/feed.xml"}
function copyRss(e){e.preventDefault();navigator.clipboard.writeText(rssUrl()).then(()=>{
  const a=document.getElementById("copy");a.textContent="✓ Copied";setTimeout(()=>a.textContent="🔗 Copy feed URL",1800)})}
async function load(){
  let d; try{d=await fetch(API+"/public/library").then(r=>r.json())}
  catch(e){document.getElementById("list").innerHTML='<div class="empty">Portal unavailable.</div>';return}
  DATA=d;
  document.getElementById("title").textContent=d.title||"Podcasts";
  document.getElementById("rss").href=API+"/share/feed.xml";
  const fl=document.getElementById("filters");
  const feeds=Object.keys(d.feeds||{});
  fl.innerHTML=(feeds.length>1?[`<span class="chip ${FILT===null?'on':''}" onclick="setF(null)">All</span>`]:[])
    .concat(feeds.map(f=>`<span class="chip ${FILT===f?'on':''}" onclick="setF('${esc(f).replace(/'/g,"")}')">${esc(f)} · ${d.feeds[f]}</span>`)).join("");
  render();
  pousseMegabarre(feeds,d.feeds||{});
}

// FLUX DANS LA MÉGABARRE CONTEXTUELLE DU HALL (#1238b). Embarqué, la barre de
// filtres est masquée (le Hall porte le contexte) : on POUSSE plutôt la liste
// des officines dans la mégabarre, et on réagit à un clic — le service sait ce
// que « filtrer sur ce flux » veut dire, le Hall non. Même contrat que MetaNews.
function estEmbed(){return document.documentElement.classList.contains('sbx-embed')}
// L'item ACTIF prend un ✓ (le Hall ne marque pas seul l'item choisi d'un menu
// pousse) : sans ce retour, un clic dans la megabarre « ne selectionne pas »
// visiblement. On re-pousse apres chaque choix pour rafraichir la coche.
function pousseMegabarre(feeds,compte){
  if(!estEmbed() || feeds.length<2) return;
  const items=[{cle:'__all', label:'Tous les épisodes', icon: FILT===null?'✓':'🎧'}].concat(
    feeds.map(f=>({cle:'feed:'+f, label:f, badge:String(compte[f]||''), icon: FILT===f?'✓':'📡'})));
  try{ parent.postMessage({sbx:'contexte', id:'podcaster', titre:'Officines', items}, '*'); }catch(e){}
}
function choixOfficine(cle){
  if(cle==='__all') setF(null);
  else if(cle.indexOf('feed:')===0) setF(cle.slice(5));
  // Retour visuel : la coche suit la selection, et la liste a defile en haut.
  pousseMegabarre(Object.keys(DATA.feeds||{}), DATA.feeds||{});
  try{ document.getElementById('list').scrollIntoView({block:'start'}); }catch(e){}
}
if(document.documentElement.classList.contains('sbx-embed')){
  window.addEventListener('message', ev=>{
    const m=ev.data; if(!m || m.sbx!=='contexte-choix' || !m.cle) return;
    choixOfficine(m.cle);
  });
}
function setF(f){FILT=f;render(true)}
let LIST_SIG="";
function render(force){
  const list=document.getElementById("list");
  let eps=DATA.episodes||[];
  if(FILT) eps=eps.filter(e=>e.feed===FILT);
  // ZIP-all button when a single feed is in view
  const zb=document.getElementById("zipbar");
  const fid=eps.length?eps[0].feed_id:null;
  zb.innerHTML=(FILT&&fid!=null)
    ? `<a href="${API}/public/feed/${fid}/zip">⬇ Download all (ZIP) · ${esc(FILT)}</a>` : "";
  if(!eps.length){list.innerHTML='<div class="empty">No episodes published yet.</div>';LIST_SIG="";return}
  // Don't rebuild the list (which would destroy a playing <audio>) when nothing
  // changed, or while the user is actively listening — only on explicit actions.
  const sig=(FILT||"all")+"|"+eps.map(e=>e.id).join(",");
  const playing=[...list.querySelectorAll("audio")].some(a=>!a.paused&&!a.ended);
  if(!force && (sig===LIST_SIG || playing)) return;
  LIST_SIG=sig;
  list.innerHTML=eps.map((e,i)=>{
    const date=e.pubdate?new Date(e.pubdate*1000).toLocaleDateString():"";
    return `<div class="ep"><div class="n">${i+1}</div>
      <div class="meta"><b>${esc(e.title)}</b><span>${esc(e.feed)} · ${date} ${e.duration?'· '+esc(e.duration):''}</span></div>
      <audio controls preload="none" src="${API}/media/${e.id}"></audio>
      <a class="dl" href="${API}/media/${e.id}" download title="Download">⬇</a></div>`;
  }).join("");
}
// ── BUS MÉDIA DU HALL (#1238c) ─────────────────────────────────────────────
// La page pleine jouait son audio « à cru » : pas de pastille, pas de rangée
// dans la barre média, aucune coordination — elle coupait la radio sans
// arbitrage. On l'inscrit au bus, comme le cardlet micro : elle ANNONCE ce
// qu'elle joue (le Hall arbitre alors radio/podcast/vidéo), OBÉIT aux commandes
// de la barre, et ne tient qu'UN flux à la fois. Embarquée uniquement.
(function busMedia(){
  if(parent===window) return;   // hors cadre, personne n'écoute
  var actif=null;
  function infos(a){
    var ep=a&&a.closest?a.closest('.ep'):null;
    var b=ep&&ep.querySelector('.meta b'), s=ep&&ep.querySelector('.meta span');
    return { titre: b?b.textContent:'Podcaster', sous: s?s.textContent.split(' · ')[0]:'' };
  }
  function annonce(fin){
    var a=actif, i=a?infos(a):{titre:'Podcaster',sous:''};
    try{ parent.postMessage({ sbx:'media', id:'podcaster',
      titre:i.titre, sous:i.sous, joue:!!(a&&!a.paused), t:a?a.currentTime||0:0,
      d:a?a.duration||0:0, fin:!!fin }, '*'); }catch(e){}
  }
  // UN SEUL FLUX : quand un <audio> démarre, on met les autres en pause — et on
  // prévient le cardlet micro (même clé d'état) pour qu'il se taise aussi.
  document.addEventListener('play', function(e){
    var a=e.target; if(!a||a.tagName!=='AUDIO') return;
    document.querySelectorAll('audio').forEach(function(o){ if(o!==a && !o.paused) o.pause(); });
    actif=a; annonce();
    try{ localStorage.setItem('sbx.podcaster.etat', JSON.stringify({ep:(a.src||'').split('/').pop(),t:Math.floor(a.currentTime||0),joue:true})); }catch(x){}
  }, true);
  document.addEventListener('pause', function(e){ if(e.target===actif) annonce(); }, true);
  document.addEventListener('ended', function(e){ if(e.target===actif) annonce(true); }, true);
  // Un battement régulier tient la rangée vivante (sinon retirée au bout de
  // ~10s). ON BAT MEME EN PAUSE (#1238c) : un flux mis en pause — par exemple
  // par le demarrage d'un peertube — doit GARDER sa pastille pour qu'on puisse
  // le reprendre. Sans battement en pause, le Hall le purgeait et la pastille
  // disparaissait. On ne s'arrete qu'a la fin (fin:true) ou a la fermeture.
  setInterval(function(){ if(actif) annonce(); }, 2000);
  // Commandes de la barre du Hall.
  // REPRISE DEPUIS LA CARTE MICRO (#1266b). Ouvrir la vue pleine ne doit plus
  // COUPER le podcast : le micro a enregistré (même origine) l'épisode + la
  // position ; on les relit et on REPREND exactement là. Si l'autoplay est
  // accordé (le clic d'ouverture vaut geste), la reprise est transparente et la
  // barre bascule sur la vue pleine (anti-doublon) sans blanc ; sinon l'épisode
  // est prêt et calé, et la CARTE continue de jouer — dans les deux cas, plus de
  // silence à l'ouverture.
  (function reprend(){
    var raw; try{ raw=localStorage.getItem('sbx.podcaster.etat'); }catch(e){ return; }
    var st; try{ st=JSON.parse(raw||'null'); }catch(e){ return; }
    if(!st || !st.ep || !st.joue) return;
    var essais=0, iv=setInterval(function(){
      var a=document.querySelector('audio[src*="/media/'+st.ep+'"]');
      if(a){
        clearInterval(iv);
        var lance=function(){ try{ if(st.t) a.currentTime=st.t; }catch(e){} a.play().catch(function(){}); };
        if(a.readyState>=1){ lance(); }
        else { a.preload='metadata'; a.addEventListener('loadedmetadata', lance, {once:true}); try{ a.load(); }catch(e){} }
      } else if(++essais>40){ clearInterval(iv); }   // ~10 s d'attente du rendu
    }, 250);
  })();
  addEventListener('message', function(ev){
    var d=ev.data; if(!d || d.sbx!=='cmd') return;
    var a=actif;
    if(d.action==='toggle'){ if(a){ a.paused?a.play().catch(function(){}):a.pause(); } }
    else if(d.action==='pause'){ if(a && !a.paused) a.pause(); }
    else if(d.action==='stop'){ if(a){ a.pause(); annonce(true); } }
    else if(d.action==='vol' && typeof d.v==='number'){ if(a){ a.volume=Math.min(1,Math.max(0,d.v)); if(a.volume>0) a.muted=false; } }
    else if(d.action==='muet'){ if(a) a.muted=!!d.v; }
  });
})();

load();setInterval(load,15000);
</script>
</body>
</html>
