  SecuBox #1238 — vue MICRO du Podcaster : la carte que le service sert lui-même.

  POURQUOI ELLE EXISTE. Le Hall composait cette carte à sa place, et il lui
  manquait ce qui compte le plus : les commandes. On voyait un titre et des
  compteurs, on ne pouvait pas écouter. Un lecteur qu'on ne peut pas lancer
  n'est pas un lecteur.

  UN SEUL FLUX PAR OFFICINE. Cette page tient UNE balise audio, jamais deux :
  lancer un épisode remplace le précédent. Deux flux d'une même officine se
  couvriraient l'un l'autre.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Podcaster — vue micro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<!-- BARRE DE SLICES partagée (#1352). Le vhost podcaster.gk2 a pour racine ce
     dossier `portal/` et ne sert PAS /shared/ (il n'est pas packagé) : on
     VERSIONNE donc une copie de la lib ici, à côté du micro, référencée en
     relatif. Copie identique à secubox-sbxui/www/slicebar.* (source de vérité).-->
<link rel="stylesheet" href="slicebar.css">
<script src="slicebar.js"></script>
<style>
  /* PALETTE LOCALE. La feuille partagée /shared/hybrid-skin.css n'est PAS
     servie par ce vhost : nginx rendait index.html à sa place, le navigateur
     refusait le type MIME, et la carte s'affichait sans aucun style. On porte
     donc les quelques variables dont on a besoin — une carte doit tenir debout
     seule, elle est servie par son propre service. */
  :root { --bg-card:#ffffff; --text:#111827; --muted:#6b7280;
          --border:#e5e7eb; --cyan:#7c3aed; }
  /* MÊME POLICE QUE LA RADIO ET LE RESTE DES CARTES (#1238). Le corps n'en
     déclarait aucune : titre, source et « à suivre » retombaient sur le serif
     par défaut du navigateur, seule la ligne du bas portait Courier Prime. La
     carte jurait à côté de la radio. On la pose sur le document — tout hérite. */
  html, body { margin: 0; height: 100%; overflow: hidden;
               scrollbar-width: none; background: var(--bg-card, #fff); color: var(--text, #111);
               /* MÊME POLICE QUE LA RADIO (#1238, corrigé) : sans-serif système,
                  pas Courier Prime — le monospace déformait les glyphes de
                  commande média (⏮ ▶ ⏭ ♥ 🔊 ⧉) et jurait à côté de la radio. */
               font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif; }
  /* THÈME HÉRITÉ DE L'HÔTE. Encadrée, la carte décidait seule de son
     clair/sombre et restait blanche sur un Hall sombre. */
  :root[data-theme="dark"] { --bg-card:#14141c; --text:#e8e6d9; --muted:#6b6b7a;
                             --border:#2a2a38; --cyan:#8b5cf6; }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) { --bg-card:#14141c; --text:#e8e6d9; --muted:#6b6b7a;
                                      --border:#2a2a38; --cyan:#8b5cf6; }
  }
  html::-webkit-scrollbar, body::-webkit-scrollbar { width: 0; display: none; }

  .mp { display: flex; flex-direction: column; min-height: 100%;
        padding: .7rem .8rem; box-sizing: border-box; gap: .5rem; }
  /* La carte fait la taille de son contenu (#1238) : elle mesure et l'annonce
     au Hall. Plus d'espaceur elastique qui poussait le pied en bas d'un cadre
     trop grand — le contenu se tasse en haut, la carte se dimensionne dessus. */
  .prog { margin-top: .35rem; }

  .cmd { display: flex; align-items: center; gap: .45rem; }
  .cmd button { width: 30px; height: 30px; border-radius: 50%;
                border: 1px solid var(--border); background: var(--bg-card);
                color: var(--text); font-size: .78rem; line-height: 1; cursor: pointer; padding: 0; }
  .cmd button:hover { border-color: var(--cyan); }
  /* Le bouton de lecture avait un fond var(--cyan) — non défini dans ce
     contexte : le fond retombait sur transparent et le ▶ blanc devenait
     INVISIBLE. Une couleur littérale en secours, jamais une variable seule
     pour ce qui doit absolument se voir. */
  .cmd button.gros { width: 38px; height: 38px; font-size: .95rem;
                     background: var(--cyan, #7c3aed); border-color: var(--cyan, #7c3aed);
                     color: #fff; }
  .cmd button:disabled { opacity: .35; cursor: default; }
  .cmd .vol { flex: 1 1 auto; min-width: 34px; max-width: 76px; accent-color: var(--cyan); }
  .cmd #detach { margin-left: auto; }
  /* Le favori dit son ETAT, pas son action : plein quand il l'est, creux
     sinon. Un cœur identique dans les deux cas ne renseigne sur rien. */
  .cmd #fav[aria-pressed="true"] { color: #e0405f; border-color: #e0405f; }

  .np { display: flex; gap: .55rem; min-height: 0; }
  /* LA POCHETTE DU FLUX, PAS UN PICTOGRAMME (#1284). 🎙️ disait « ceci est un
     podcast » — ce qu'on savait déjà. La pochette dit LEQUEL, et c'est la
     seule chose que la vignette pouvait apprendre. Le dégradé reste dessous :
     il sert de fond le temps du chargement, et de repli quand le flux n'a pas
     de pochette. */
  .np .vign { width: 52px; height: 52px; border-radius: 9px; flex: 0 0 auto;
              display: grid; place-items: center; font-size: 1.5rem; color: #fff;
              overflow: hidden; position: relative;
              background: linear-gradient(135deg, #c87832, #e0654f); }
  .np .vign img { position: absolute; inset: 0; width: 100%; height: 100%;
                  object-fit: cover; display: none; }
  .np .vign img.ok { display: block; }
  .np .txt { min-width: 0; }
  .np b { display: block; font-size: .82rem; line-height: 1.25;
          display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .np .src { font-size: .68rem; color: var(--muted); white-space: nowrap;
             overflow: hidden; text-overflow: ellipsis; }
  /* DÉTAIL DU FLUX COURANT (#1238) : sous le nom du flux, une date miniature et
     le rang dans la bibliothèque (rang/somme, ex. 3/40) — on sait quand la
     piste est parue et où l'on en est dans la pile. */
  .np .det { display: flex; align-items: baseline; gap: .4rem; margin-top: .12rem;
             font-size: .62rem; color: var(--muted); }
  .np .det .dt { font-variant-numeric: tabular-nums; }
  .np .det .rg { margin-left: auto; font-variant-numeric: tabular-nums;
                 letter-spacing: .02em; color: var(--cyan); }

  .prog { height: .3rem; border-radius: 3px; background: var(--border); overflow: hidden; cursor: pointer; }
  .prog i { display: block; height: 100%; width: 0; background: var(--cyan); }
  .bas { display: flex; align-items: center; gap: .5rem; margin-top: .15rem;
         font-family: 'Courier Prime', monospace; font-size: .72rem; color: var(--muted); }
  .bas .t { font-variant-numeric: tabular-nums; }
  .bas a { margin-left: auto; color: var(--muted); text-decoration: none; letter-spacing: .06em; text-transform: uppercase; }
  .bas a:hover { color: var(--cyan); }
  /* À SUIVRE (#1252). La carte disait ce qui joue et rien de ce qui vient :
     on ne pouvait ni anticiper, ni choisir sans ouvrir la bibliothèque. Trois
     titres suffisent — au-delà, la carte redevient une bibliothèque, et la
     bibliothèque a déjà sa page. Un clic saute directement à l'épisode. */
  /* « À SUIVRE » DESCENDU D'UN CRAN ET AGRANDI (#1238). Le bloc était tassé
     contre la barre de progression et écrit trop petit pour se lire d'un coup
     d'œil : on le décolle (margin-top) et on gonfle titres, rangs et items
     pour que la suite du programme soit vraiment lisible. */
  .suite { display: flex; flex-direction: column; gap: .22rem; margin: .55rem 0 .15rem; }
  .suite .tt { font-size: .66rem; letter-spacing: .08em; text-transform: uppercase;
               color: var(--muted); margin-bottom: .18rem; }
  .suite button { display: flex; align-items: baseline; gap: .4rem; width: 100%;
                  background: none; border: 0; padding: .14rem 0; cursor: pointer;
                  font: inherit; font-size: .78rem; color: var(--text);
                  text-align: left; line-height: 1.3; }
  .suite button:hover .nm { text-decoration: underline; }
  /* À GAUCHE, LA DATE PLUTÔT QUE LE RANG (#1238) : un « 1 2 3 » n'apprenait
     rien ; la date de parution situe chaque épisode à venir. */
  .suite .rg { flex: 0 0 auto; color: var(--muted); font-size: .66rem;
               min-width: 3.6em; }
  .suite .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .suite .vide { font-size: .74rem; color: var(--muted); }
  /* SPICY (#1360) — accent dégradé + halo + barre de progression vive. */
  .cmd { position:relative; padding-bottom:5px; }
  .cmd::after { content:""; position:absolute; left:0; right:0; bottom:0; height:2px; border-radius:2px;
    background:linear-gradient(90deg, var(--cyan), #28d6ff, #f0b429); opacity:.85; }
  #titre, #temps { text-shadow:0 0 10px color-mix(in srgb, var(--cyan) 32%, transparent); }
  .prog i, #barre { background:linear-gradient(90deg, var(--cyan), #28d6ff) !important; }
  .sbxaide-ring { position:absolute; border:2px solid var(--cyan); border-radius:8px; z-index:41;
    box-shadow:0 0 0 3px color-mix(in srgb,var(--cyan) 20%,transparent); pointer-events:none; transition:.18s; }
  .sbxaide-pin { position:absolute; transform:translate(-50%,-50%); min-width:18px; height:18px; border-radius:10px; z-index:42;
    background:var(--cyan); color:#fff; font-weight:800; font-size:.66rem; display:grid; place-items:center; padding:0 5px;
    box-shadow:0 2px 6px rgba(0,0,0,.45); pointer-events:none; }
  /* ── SLICER partagé (SBXSliceBar, #1352) ─────────────────────────────────
     La carte podcaster est en AUTO-HAUTEUR : la barre est donc INLINE (pas
     fixée), posée avant .bas pour que annonceHaut la compte. --cyan est déjà
     l'accent podcaster ; --line rend un filet discret dans les deux thèmes. */
  .pc-slbox { margin-top:.4rem; border-top:2px solid transparent;
    border-image:linear-gradient(90deg,var(--cyan),#28d6ff,#f0b429) 1;
    --line:rgba(128,132,148,.28); }
  .pc-slbox .sbx-bar { border-top:none; padding:6px 0 0; }
  .pc-slbox .sbx-dots button.on { box-shadow:0 0 10px -1px var(--cyan); }
</style>

<div class="mp">
  <!-- MÊME JEU DE COMMANDES QUE LA RADIO, plus les deux que le podcast exige :
       précédent et suivant. Une radio est un flux qu'on ne parcourt pas ; une
       bibliothèque, si. Le reste est identique pour que le geste soit le même
       d'une carte à l'autre — c'est tout l'intérêt d'un gabarit commun. -->
  <div class="cmd">
    <button id="rafr" type="button" title="Rafraîchir la bibliothèque" aria-label="Rafraîchir">⟳</button>
    <button id="prev" type="button" title="Épisode précédent" aria-label="Épisode précédent">⏮</button>
    <button id="pp" class="gros" type="button" title="Lecture / pause" aria-label="Lecture ou pause">▶</button>
    <button id="next" type="button" title="Épisode suivant" aria-label="Épisode suivant">⏭</button>
    <button id="fav" type="button" title="Marquer comme favori" aria-pressed="false" aria-label="Favori">♥</button>
    <button id="muet" type="button" title="Couper le son" aria-label="Couper le son">🔊</button>
    <input id="vol" class="vol" type="range" min="0" max="1" step="0.05" value="1"
           title="Volume" aria-label="Volume">
    <button id="detach" type="button" title="Détacher — continue en surfant" aria-label="Détacher">⧉</button>
  </div>

  <div class="np">
    <div class="vign" id="vign">🎙️<img id="pochette" alt=""></div>
    <div class="txt"><b id="titre">Bibliothèque</b><div class="src" id="src">—</div>
      <div class="det" id="det" hidden><span class="dt" id="date"></span><span class="rg" id="rang"></span></div></div>
  </div>

  <div class="prog" id="prog"><i id="barre"></i></div>

  <div class="suite" id="suite"><div class="tt">⏭ à suivre</div><span class="vide">lecture de la bibliothèque…</span></div>

  <div class="bas">
    <span class="t" id="temps">0:00</span>
    <a href="/" id="biblio" target="_top">📚 bibliothèque</a>
  </div>
</div>

<audio id="son" preload="none"></audio>

<script>
  // Le thème vient de l'hôte (#1241) : deux valeurs acceptées, pas davantage —
  // une valeur libre venue de l'URL n'a rien à faire dans un attribut du
  // document. Posé AVANT tout rendu, sinon la carte clignote du mauvais thème.
  try {
    const t = new URLSearchParams(location.search).get('theme');
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}

  // Le Hall dit le thème par MESSAGE plutôt que de recharger le cadre (#1243) :
  // recharger couperait le son et remettrait le lecteur au début. On applique
  // sans rien recharger. Deux valeurs acceptées, comme pour le paramètre.
  addEventListener("message", ev => {
    const d = ev.data;
    if (!d || d.sbx !== "theme") return;
    if (d.theme === "dark" || d.theme === "light") {
      document.documentElement.setAttribute("data-theme", d.theme);
    }
  });

  const API = '/api/v1/podcaster';
  // eps = liste PARCOURUE (filtrée par le slicer) ; allEps = bibliothèque
  // complète ; playEp = épisode réellement chargé dans <audio> (découplé du
  // parcours, pour que la barre média du Hall dise ce qui JOUE, pas ce qu'on
  // survole). filtre : null (Récents) · 'fav' · feed_id.
  let allEps = [], feedsList = [], eps = [], idx = 0, playEp = null,
      filtre = null, repris = false, slBar = null;
  const son = document.getElementById('son');
  const el = id => document.getElementById(id);
  const fmt = t => { t = Math.floor(t || 0); return Math.floor(t / 60) + ':' + ('0' + (t % 60)).slice(-2); };
  // DATE MINIATURE (#1238). `pubdate` est un epoch en secondes ; 0 ou absent =
  // pas de date connue, on rend une chaine vide plutot qu'un « 1970 » trompeur.
  // Format compact « 12 aoû », l'annee seulement si ce n'est pas l'annee en
  // cours — une date de podcast tient sur trois signes le plus souvent.
  const AN = new Date().getFullYear();
  function fmtDate(ts) {
    ts = Number(ts) || 0; if (ts <= 0) return '';
    const d = new Date(ts * 1000); if (isNaN(d.getTime())) return '';
    const opt = d.getFullYear() === AN ? { day: 'numeric', month: 'short' }
                                       : { day: 'numeric', month: 'short', year: '2-digit' };
    return d.toLocaleDateString('fr-FR', opt).replace('.', '');
  }

  async function charge() {
    try {
      const r = await fetch(API + '/public/library', { headers: { 'Accept': 'application/json' } });
      if (!r.ok) throw 0;
      const d = await r.json();
      allEps = d.episodes || [];
      feedsList = d.feeds || [];
    } catch (e) { allEps = []; feedsList = []; }
    batisSlicer();                 // une fois : Récents · Favoris · un flux par podcast
    eps = episodesDe(filtre);
    // Reprise de lecture : une seule fois (au premier chargement), sur la vue
    // courante. Un rafraîchissement ne doit pas relancer le son au début.
    if (eps.length && !repris) { repris = true; if (reprendEtat()) return; }
    rendVue();
  }

  // ── SLICES (#1352) : plusieurs vues de la MÊME carte, filtrées côté client
  // depuis la bibliothèque. Récents (tout) · Favoris (♥ locaux) · un flux par
  // podcast. Le parcours change ; la LECTURE en cours continue (playEp).
  function episodesDe(f) {
    if (f === 'fav') { const s = favs(); return allEps.filter(e => s.includes(e.id)); }
    if (f == null)   return allEps.slice(0, 40);
    return allEps.filter(e => String(e.feed_id) === String(f)).slice(0, 40);
  }
  function rendVue() {
    if (!eps.length) {
      el('titre').textContent = (filtre === 'fav') ? 'Aucun favori'
                              : (filtre != null)   ? 'Aucun épisode dans ce flux'
                                                   : 'Bibliothèque vide';
      el('src').textContent = ''; el('det').hidden = true;
      ['pp', 'prev', 'next'].forEach(i => el(i).disabled = true);
      el('suite').innerHTML = '<div class="tt">⏭ à suivre</div><span class="vide">—</span>';
      annonceHaut();
      return;
    }
    ['pp', 'prev', 'next'].forEach(i => el(i).disabled = false);
    montre();   // recale prev/next selon idx
  }
  function appliqueFiltre() { eps = episodesDe(filtre); idx = 0; rendVue(); }
  function batisSlicer() {
    if (slBar || !window.SBXSliceBar) return;
    const defs = [{ label: '🆕 Récents', f: null }, { label: '⭐ Favoris', f: 'fav' }]
      .concat((feedsList || []).slice(0, 6).map(fd => ({ label: '📻 ' + (fd.title || 'Flux'), f: fd.id })));
    const box = document.createElement('div'); box.className = 'pc-slbox';
    const mp = document.querySelector('.mp'), bas = document.querySelector('.bas');
    if (mp && bas) mp.insertBefore(box, bas); else (mp || document.body).appendChild(box);
    slBar = window.SBXSliceBar(box, {
      autoMs: 0, pauseOnHover: false,   // preview au survol conservé (filtre client, pas de fetch)
      slices: defs.map(s => ({ label: s.label })),
      onShow: function (k) { filtre = defs[k] ? defs[k].f : null; appliqueFiltre(); }
    });
  }

  function montre() {
    const e = eps[idx] || {};
    el('titre').textContent = e.title || '—';
    el('src').textContent = e.feed || '';
    // DÉTAIL DU FLUX COURANT : date de parution (miniature) + rang/somme dans
    // la bibliothèque (ex. 3/40). On masque la ligne s'il n'y a rien a dire.
    const dt = fmtDate(e.pubdate);
    const rg = eps.length ? (idx + 1) + '/' + eps.length : '';
    el('date').textContent = dt;
    el('rang').textContent = rg;
    el('det').hidden = !(dt || rg);
    el('prev').disabled = idx <= 0;
    el('next').disabled = idx >= eps.length - 1;
    montreFav();
    montreSuite();
    pochette(e);
    annonceHaut();
  }

  // Ce qui vient APRÈS la piste courante, pas le début de la bibliothèque :
  // une liste qui ne bouge pas quand on avance ne dit rien de la suite.
  // On ne remplace la pochette que si le FLUX change : la reposer a chaque
  // rendu la ferait clignoter a chaque seconde de lecture.
  function pochette(e) {
    var img = el('pochette');
    if (!img) return;
    var fid = e && e.feed_id;
    if (!fid) { img.classList.remove('ok'); img.removeAttribute('src'); return; }
    if (img.dataset.fid === String(fid)) return;
    img.dataset.fid = String(fid);
    img.classList.remove('ok');
    // `onload` avant `src` : une image en cache peut se charger avant que
    // l'ecouteur ne soit pose. Et si elle echoue, on garde le degrade plutot
    // que l'icone de fichier casse.
    img.onload = function () { img.classList.add('ok'); };
    img.onerror = function () { img.classList.remove('ok'); };
    img.src = API + '/feeds/' + encodeURIComponent(fid) + '/cover';
  }

  function montreSuite() {
    const box = el('suite');
    const a_venir = eps.slice(idx + 1, idx + 4);
    let html = '<div class="tt">⏭ à suivre</div>';
    if (!a_venir.length) {
      html += '<span class="vide">fin de la bibliothèque</span>';
    } else {
      html += a_venir.map((e, i) =>
        '<button type="button" data-i="' + (idx + 1 + i) + '" title="' + esc(e.title || '') + '">'
        // La DATE plutot que le rang : un « 1 2 3 » n'apprenait rien. Repli sur
        // le rang si l'episode n'a pas de date connue.
        + '<span class="rg">' + esc(fmtDate(e.pubdate) || String(i + 1)) + '</span>'
        + '<span class="nm">' + esc(e.title || '—') + '</span></button>').join('');
    }
    box.innerHTML = html;
  }

  // DÉCLARATION DE FONCTION, pas `const` : montre() peut s'exécuter depuis une
  // reprise d'état avant que la ligne ne soit évaluée, et une const encore en
  // zone morte lève une ReferenceError — la panne exacte déjà rencontrée sur
  // le Hall (#1247).
  function esc(t) {
    return String(t == null ? '' : t).replace(/[&<>"]/g,
      c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  }

  // Délégation : la liste est reconstruite à chaque piste, un écouteur par
  // bouton fuirait à chaque rendu.
  document.getElementById('suite').addEventListener('click', ev => {
    const b = ev.target.closest('button[data-i]');
    if (b) joue(Number(b.dataset.i));
  });

  function joue(i) {
    if (i < 0 || i >= eps.length) return;
    idx = i; playEp = eps[idx]; montre();
    // UNE seule source à la fois : on remplace, on n'empile pas.
    son.src = API + '/media/' + eps[idx].id;
    son.play().catch(() => { el('pp').textContent = '▶'; });
  }

  el('pp').addEventListener('click', () => {
    if (!son.src) { joue(idx); return; }
    son.paused ? son.play() : son.pause();
  });
  el('prev').addEventListener('click', () => joue(idx - 1));
  el('next').addEventListener('click', () => joue(idx + 1));
  // CONTINUITÉ MICRO → VUE PLEINE (#1266b). On ENREGISTRE ce qu'on joue (épisode
  // + position + intention) : la vue pleine, MÊME ORIGINE, le relira au montage
  // et reprendra EXACTEMENT là — ouvrir l'embed ne coupe plus le podcast, il
  // continue. Sans ça, la vue pleine démarrait vide, la barre passait sur elle
  // (anti-doublon) et la carte, orpheline, se taisait.
  function sauveEtat() {
    try {
      localStorage.setItem('sbx.podcaster.etat', JSON.stringify({
        ep: (playEp || eps[idx] || {}).id || '', t: Math.floor(son.currentTime || 0),
        joue: !son.paused, quand: Date.now()
      }));
    } catch (e) {}
  }
  son.addEventListener('play',  () => { el('pp').textContent = '❚❚'; sauveEtat(); });
  son.addEventListener('pause', () => { el('pp').textContent = '▶'; sauveEtat(); });
  son.addEventListener('ended', () => joue(idx + 1));
  var _dernSauve = 0;
  son.addEventListener('timeupdate', () => {
    const d = son.duration || 0;
    el('barre').style.width = (d ? son.currentTime / d * 100 : 0) + '%';
    el('temps').textContent = fmt(son.currentTime);
    var n = Date.now(); if (n - _dernSauve > 5000) { _dernSauve = n; sauveEtat(); }
  });
  // Se déplacer dans l'épisode : sans cela, un épisode d'une heure ne se
  // parcourt pas, et la barre n'est qu'une décoration.
  el('prog').addEventListener('click', ev => {
    if (!son.duration) return;
    const r = ev.currentTarget.getBoundingClientRect();
    son.currentTime = ((ev.clientX - r.left) / r.width) * son.duration;
  });

  // ── AUTO-HAUTEUR : LA CARTE FAIT LA TAILLE DE SON CONTENU (#1238) ──────────
  //
  // Une hauteur fixe rognait le bas (barre du bas invisible) ou laissait du
  // vide selon le nombre d'episodes « a suivre ». On MESURE le contenu reel et
  // on l'ANNONCE ; le Hall ajuste l'iframe. Le bas de la ligne `.bas` (dernier
  // element) donne la hauteur reelle, independamment du cadre courant. Le Hall
  // borne la valeur, donc un contenu casse ne peut pas faire exploser la carte.
  function annonceHaut() {
    if (parent === window) return;
    try {
      requestAnimationFrame(() => {
        const bas = document.querySelector('.bas');
        const h = Math.ceil((bas ? bas.getBoundingClientRect().bottom
                                 : document.body.scrollHeight) + 12);
        if (h > 0) parent.postMessage({ sbx: 'carte-haut', id: 'podcaster', h: h }, '*');
      });
    } catch (e) {}
  }
  addEventListener('load', annonceHaut);
  addEventListener('resize', annonceHaut);

  // ── ANNONCE À LA BARRE DU HALL (#1246) ────────────────────────────────────
  //
  // Le Hall ne peut pas toucher notre <audio> : origines différentes, et c'est
  // heureux. On ANNONCE donc notre état, il COMMANDE. Le contrat tient en deux
  // messages, et l'origine du destinataire n'est pas devinée : on répond à qui
  // nous encadre, personne d'autre.
  function annonce(fin) {
    if (parent === window) return;   // hors cadre, personne n'écoute
    const e = playEp || eps[idx] || {};   // ce qui JOUE, pas ce qu'on parcourt
    try {
      parent.postMessage({
        sbx: 'media', id: 'podcaster',
        // VIGNETTE DE SOURCE (#1266b) : la pochette du flux courant, pour que la
        // barre média montre CE podcast — distincte selon l'épisode. URL absolue
        // (origine podcaster) car c'est le Hall qui l'affichera.
        vignette: (e && e.feed_id) ? (location.origin + API + '/feeds/' + encodeURIComponent(e.feed_id) + '/cover') : '',
        titre: e.title || 'Bibliothèque', sous: e.feed || '',
        joue: !son.paused, t: son.currentTime || 0, d: son.duration || 0,
        fin: !!fin
      }, '*');
    } catch (err) {}
  }
  ['play', 'pause', 'ended', 'loadedmetadata'].forEach(ev => son.addEventListener(ev, () => annonce()));
  // Un battement régulier : sans lui, la barre du Hall considérerait le flux
  // mort au bout de dix secondes de lecture silencieuse (un long morceau sans
  // interaction) et retirerait la rangée.
  setInterval(() => { if (!son.paused) annonce(); }, 2000);

  addEventListener('message', ev => {
    const d = ev.data;
    if (!d || d.sbx !== 'cmd') return;
    if (d.action === 'toggle') { son.paused ? son.play().catch(() => {}) : son.pause(); }
    else if (d.action === 'next') joue(idx + 1);
    else if (d.action === 'prev') joue(idx - 1);
    else if (d.action === 'stop') { son.pause(); annonce(true); }
    // `pause` n'est pas `toggle` (#1276) : le Hall s'en sert pour faire taire
    // un doublon ou laisser la place a une video. Une bascule relancerait ce
    // qui etait deja a l'arret.
    else if (d.action === 'pause') { if (!son.paused) son.pause(); }
    // VOLUME ET COUPURE PILOTES PAR LA BARRE (#1267). Deux flux peuvent jouer
    // ensemble : sans reglage par flux, on ne peut pas baisser la radio pour
    // entendre le podcast. On repasse par les memes commandes locales, sinon
    // le curseur de la carte cesse de dire la verite sur ce qu'on entend.
    else if (d.action === 'vol' && typeof d.v === 'number') {
      son.volume = Math.min(1, Math.max(0, d.v));
      if (son.volume > 0) son.muted = false;
      const c = el('vol'); if (c) c.value = String(son.volume);
      el('muet').textContent = son.muted ? '🔇' : '🔊';
    } else if (d.action === 'muet') {
      son.muted = !!d.v;
      el('muet').textContent = son.muted ? '🔇' : '🔊';
    }
  });

  // ── ÉTAT PERSISTANT (#1242) ───────────────────────────────────────────────
  //
  // Le lecteur mourait à chaque changement de page : on revenait, il était muet
  // et au début. La radio, elle, garde son état — c'est ce qu'on attend d'un
  // lecteur, et c'est ce qui manquait.
  //
  // On retient l'épisode, la position et l'intention de lecture. Au retour, on
  // remet le tout en place. Ce n'est PAS le flux qui survit — un <audio> ne
  // traverse pas un rechargement — mais la reprise est si proche qu'on ne fait
  // pas la différence : à la seconde près, et le direct pour la radio.
  //
  // La position est enregistrée AU FIL de la lecture, pas à la fermeture : une
  // page fermée brutalement ne prévient pas, et « beforeunload » n'est pas
  // garanti sur mobile.
  const ETAT = 'sbx.podcaster.etat';
  let dernierEnr = 0;
  function retiensEtat(){
    const e = playEp || eps[idx]; if (!e) return;
    try{
      localStorage.setItem(ETAT, JSON.stringify({
        ep: e.id, t: Math.floor(son.currentTime || 0), joue: !son.paused
      }));
    }catch(err){}
  }
  function reprendEtat(){
    let d = null;
    try{ d = JSON.parse(localStorage.getItem(ETAT) || 'null'); }catch(err){}
    if (!d || !d.ep) return false;
    const i = eps.findIndex(x => String(x.id) === String(d.ep));
    if (i < 0) return false;
    idx = i; playEp = eps[idx]; montre();
    son.src = API + '/media/' + eps[idx].id;
    // La position se pose une fois les métadonnées lues : plus tôt, elle est
    // ignorée en silence et l'épisode repart du début.
    son.addEventListener('loadedmetadata', () => { son.currentTime = d.t || 0; }, { once: true });
    // On ne relance PAS tout seul si le navigateur l'interdit : un bouton qui
    // reste sur ▶ alors qu'on a demandé la lecture est trompeur.
    if (d.joue) son.play().catch(() => { el('pp').textContent = '▶'; });
    return true;
  }
  son.addEventListener('timeupdate', () => {
    // Une écriture par seconde suffit : à chaque image, on écrirait soixante
    // fois pour le même résultat.
    const n = Date.now();
    if (n - dernierEnr > 1000) { dernierEnr = n; retiensEtat(); }
  });
  ['play','pause','ended'].forEach(ev => son.addEventListener(ev, retiensEtat));

  // UN SEUL FLUX PAR OFFICINE, MÊME ENTRE ONGLETS. Un second onglet qui lance
  // la lecture met celui-ci en pause : deux fois le même podcast, décalés, ne
  // s'écoutent pas.
  addEventListener('storage', ev => {
    if (ev.key !== ETAT || son.paused) return;
    try{
      const d = JSON.parse(ev.newValue || 'null');
      if (d && d.joue) son.pause();
    }catch(err){}
  });

  // 📚 BIBLIOTHÈQUE — OUVRIR EMBARQUÉ DANS LE HALL (#1238). `target=_top`
  // faisait sortir TOUT le Hall vers le site podcaster ; la matrice SBXOS veut
  // qu'un lien de service de la box s'ouvre EMBARQUÉ dans le Hall, comme les
  // autres cartes. On annonce donc `sbx:'ouvre'` au Hall (il fait
  // openService('podcaster','embed')). Hors cadre — carte servie seule — on
  // laisse le lien agir normalement (accès direct).
  el('biblio').addEventListener('click', ev => {
    if (parent === window) return;   // autonome : le lien direct convient
    ev.preventDefault();
    try { parent.postMessage({ sbx: 'ouvre', id: 'podcaster' }, '*'); } catch (e) {}
  });

  // FAVORIS. Retenus par épisode, côté navigateur : le service n'expose pas
  // encore de point d'entrée pour cela, et inventer une écriture qu'il ne sait
  // pas relire ferait un bouton qui ment. On garde donc localement, et le jour
  // où l'API existera, cette liste s'y déversera.
  const FAVS = 'sbx.podcaster.favoris';
  const favs = () => { try { return JSON.parse(localStorage.getItem(FAVS) || '[]'); } catch (e) { return []; } };
  function montreFav() {
    const e = eps[idx];
    el('fav').setAttribute('aria-pressed', String(!!e && favs().includes(e.id)));
  }
  el('fav').addEventListener('click', () => {
    const e = eps[idx]; if (!e) return;
    const l = favs(), i = l.indexOf(e.id);
    if (i < 0) l.push(e.id); else l.splice(i, 1);
    try { localStorage.setItem(FAVS, JSON.stringify(l)); } catch (err) {}
    montreFav();
  });

  // Rafraîchir : la bibliothèque s'enrichit en arrière-plan, rien ne le disait.
  el('rafr').addEventListener('click', () => { charge(); });

  // Muet et volume, comme à la radio. L'icône dit l'état RÉEL, pas l'action —
  // un bouton qui montre « couper » alors que le son est déjà coupé induit en
  // erreur au premier coup d'œil.
  el('muet').addEventListener('click', () => {
    son.muted = !son.muted;
    el('muet').textContent = son.muted ? '🔇' : '🔊';
  });
  el('vol').addEventListener('input', ev => {
    son.volume = Number(ev.target.value);
    if (son.volume > 0 && son.muted) { son.muted = false; el('muet').textContent = '🔊'; }
  });

  // DÉTACHER. On passe la position : un podcast est positionnel, le reprendre
  // au début serait une perte. La radio n'en a pas besoin, elle rejoint le
  // direct.
  el('detach').addEventListener('click', () => {
    const e = eps[idx];
    const u = new URL(location.href);
    u.searchParams.set('ep', e ? e.id : '');
    u.searchParams.set('t', Math.floor(son.currentTime || 0));
    window.open(u.toString(), 'sbxpodcaster',
      'width=380,height=340,menubar=no,toolbar=no,location=no,resizable=yes');
  });

  // Reprise après détachement : on rouvre où l'on en était.
  (function reprise(){
    try{
      const q = new URLSearchParams(location.search);
      const ep = q.get('ep'), t = Number(q.get('t') || 0);
      if (!ep) return;
      const attendre = setInterval(() => {
        if (!eps.length) return;
        clearInterval(attendre);
        const i = eps.findIndex(x => String(x.id) === String(ep));
        if (i < 0) return;
        joue(i);
        son.addEventListener('loadedmetadata', () => { son.currentTime = t; }, { once: true });
      }, 200);
    }catch(e){}
  })();

  charge();
</script>

<!-- Aide reverse-design (#1360) — inline (cross-origin). -->
<script>
(function(){
  function post(m){ if(window.parent!==window){ try{window.parent.postMessage(m,'*'); }catch(e){} } }
  var root=document.querySelector('.mp'); if(!root) return;
  if(getComputedStyle(root).position==='static') root.style.position='relative';
  var on=false,tmr=null,nodes=[];
  function ZONES(){ return [
    {el:document.querySelector('.cmd'),  label:'Commandes — lecture, précédent/suivant, favori, volume, détacher'},
    {el:document.querySelector('.np'),   label:'En cours — pochette, titre, source de l’épisode'},
    {el:document.getElementById('prog'), label:'Progression — cliquable pour se déplacer'},
    {el:document.getElementById('suite'),label:'À suivre — la file d’épisodes de la bibliothèque'},
    {el:document.querySelector('.bas'),  label:'Bas — temps écoulé + accès à la bibliothèque'}
  ]; }
  function clear(){ nodes.forEach(function(n){n.remove();}); nodes=[]; }
  function draw(){ clear(); var rr=root.getBoundingClientRect(), Z=ZONES();
    Z.forEach(function(x,k){ if(!x.el)return; var r=x.el.getBoundingClientRect(); if(r.width<2||r.height<2)return;
      var ring=document.createElement('div'); ring.className='sbxaide-ring';
      ring.style.left=(r.left-rr.left-2)+'px'; ring.style.top=(r.top-rr.top-2)+'px';
      ring.style.width=(r.width+4)+'px'; ring.style.height=(r.height+4)+'px'; root.appendChild(ring); nodes.push(ring);
      var pin=document.createElement('div'); pin.className='sbxaide-pin'; pin.textContent=(k+1);
      pin.style.left=(r.left-rr.left+10)+'px'; pin.style.top=(r.top-rr.top)+'px'; root.appendChild(pin); nodes.push(pin);
    });
    report(rr,Z);
  }
  function report(rr,Z){ rr=rr||root.getBoundingClientRect(); Z=Z||ZONES();
    post({sbx:'aide-zones',slice:'',vw:rr.width,vh:rr.height,
      zones:Z.map(function(x){ if(!x.el)return null; var r=x.el.getBoundingClientRect(); if(r.width<2||r.height<2)return null;
        return {label:x.label,x:r.left-rr.left,y:r.top-rr.top,w:r.width,h:r.height};}).filter(Boolean)}); }
  function show(v){ on=v; if(v){ draw(); if(tmr)clearInterval(tmr); tmr=setInterval(draw,500);} else { if(tmr){clearInterval(tmr);tmr=null;} clear(); } }
  window.addEventListener('message',function(ev){var d=ev.data; if(!d)return; if(d.sbx==='aide')show(!!d.on); else if(d.sbx==='aide?')report();});
  window.addEventListener('resize',function(){ if(on)draw(); });
})();
</script>
