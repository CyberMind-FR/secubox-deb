# /etc/nginx/secubox.d/premier-pas-session.conf — posé par le POSTINST de secubox-premier-pas, à certaines conditions seulement (#2731).
#
# L'ouverture distante de l'assistant (#2725) ne se fie qu'au verdict LAN de nginx, `X-SecuBox-LAN: 1`. Ce verdict est posé par la ligne
# `proxy_set_header X-SecuBox-LAN $lan_client;` de snippets/secubox-proxy.conf, que le postinst de secubox-core n'ajoute QUE si
# conf.d/secubox-lan-geo.conf (livré par secubox-hub) existe à ce moment-là. Dans une image où core est configuré avant hub, elle manque, et rien
# ne la remet : l'assistant distant répondait « pas du réseau local » à un poste du LAN.
#
# Ce bloc pose l'en-tête lui-même, pour cette seule route. `proxy_set_header` REMPLACE toute valeur présentée par le client : il n'est pas
# forgeable. On ne refait PAS le verdict en Python ni en `geo` local : derrière HAProxy, `$remote_addr` vaut 127.0.0.1 pour tout le monde.
#
# Installé seulement si (1) le fichier GeoIP du Hub existe — sinon `$lan_client` est inconnue et `nginx -t` casserait TOUTE la configuration —,
# (2) snippets/secubox-proxy.conf ne pose pas déjà l'en-tête, (3) `nginx -t` passe ; sinon le postinst le retire.
location = /api/v1/premier-pas/session {
    proxy_pass http://unix:/run/secubox/aggregator.sock;
    include /etc/nginx/snippets/secubox-proxy.conf;
    proxy_set_header X-SecuBox-LAN $lan_client;
    proxy_intercept_errors off;
}
