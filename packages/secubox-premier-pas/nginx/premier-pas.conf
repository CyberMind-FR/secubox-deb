# /etc/nginx/secubox.d/premier-pas.conf — installé par secubox-premier-pas (#2730).
#
# LES PAGES DE L'ASSISTANT NE SE METTENT PAS EN CACHE DUR. `location /` du site pose `expires 1h` et `Cache-Control: public, immutable` sur tout
# fichier statique ; `immutable` interdit au navigateur de revérifier, même sur un rechargement simple. Constaté sur un RPi400 : après la mise à
# jour du paquet, le navigateur et le kiosque relancé affichaient l'ANCIENNE page pendant une heure. Ces pages changent à chaque version et leur
# écran dépend de l'état de la box : `no-cache` (revalider à chaque affichage ; l'ETag rend la revalidation peu coûteuse).
#
# `add_header` dans une location REMPLACE ceux du serveur : on répète donc les quatre en-têtes de sécurité de common/nginx/secubox.conf.
# Le défaut général de `location /` (HTML « immutable ») est une décision sur tout le site : on n'y touche pas ici.
location ~ ^/premier-pas(-maitre)?/ {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
}
