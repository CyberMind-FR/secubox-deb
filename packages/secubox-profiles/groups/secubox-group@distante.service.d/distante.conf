# #3126 L5 tâche 7 — groupe du profil léger « distante » : liste livrée par secubox-profiles, veille de 600 s pour
# les seuls modules d'affichage (hub, hardening : réveillés par la première requête du maître). dns-guard, ad-guard
# et wireguard ne dorment jamais (filtrage et tunnel). Le premier ExecStart= vide efface celui du gabarit.
[Service]
ExecStart=
ExecStart=/usr/sbin/secubox-groupd --fichier /usr/share/secubox/profiles/groups/distante.conf --veille 600 --veille-modules hub,hardening
