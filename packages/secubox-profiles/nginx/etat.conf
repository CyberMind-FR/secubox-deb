# Gabarit nginx « etat » (#3126 L5 tâche 7) : SEUL site du profil léger « distante » (posé par secubox-profilectl,
# api/front_web.py, dans sites-available/secubox-etat). Une seule page, statique, écrite par l'agent de pilotage
# (/run/secubox/pilotage/etat.html : nom, maître joignable, mains liées, mémoire, services en échec ; aucun secret).
# LAN seulement (réseaux privés, lien local, boucle locale), aucun relais vers une API, aucun autre fichier servi.
# La CSP n'autorise que la feuille de style de la page, par son empreinte (etat.EmpreinteStyle de l'agent, vérifiée
# par tests/test_profil_distante_3126.py).
server {
    # Écoute sur l'adresse LAN de la box seulement (R-L5-34 M1) : fichier posé par secubox-profilectl à l'allègement
    # (première IPv4 privée hors maillage et Auto-Load ; à défaut 127.0.0.1), jamais toutes les interfaces. nftables
    # (DEFAULT DROP côté WAN) reste la barrière de fond ; les allow/deny ci-dessous la doublent.
    include /etc/nginx/secubox-etat-ecoute.conf;
    server_name _;
    server_tokens off;

    allow 127.0.0.1;
    allow ::1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    allow fc00::/7;
    allow fe80::/10;
    deny all;

    add_header Content-Security-Policy "default-src 'none'; style-src 'sha256-BbU/zLNWiA6KAger+0RgJr7c2s5osYIWEX51N6vPbCQ='; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;

    location = /etat {
        limit_except GET { deny all; }
        default_type text/html;
        charset utf-8;
        alias /run/secubox/pilotage/etat.html;
    }
    location = / {
        return 302 /etat;
    }
    location / {
        return 404;
    }
}
