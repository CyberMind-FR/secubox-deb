# Gabarit nginx « etat » (#3126 L5 tâche 7) : SEUL site du profil léger « distante » (posé par secubox-profilectl,
# api/front_web.py, dans sites-available/secubox-etat). Une seule page, statique, écrite par l'agent de pilotage
# (/run/secubox/pilotage/etat.html : nom, maître joignable, mains liées, mémoire, services en échec ; aucun secret).
# LAN seulement (sous-réseau du LAN de la box et boucle locale), aucun relais vers une API, aucun autre fichier servi.
# La CSP n'autorise que la feuille de style de la page, par son empreinte (etat.EmpreinteStyle de l'agent, vérifiée
# par tests/test_profil_distante_3126.py).
server {
    # Écoute et accès (R-L5-34) : /etc/nginx/secubox-etat-ecoute.conf, posé par secubox-profilectl à l'allègement, porte
    # `listen 80;` + `allow <sous-réseau du LAN>;` (br-lan, sinon première interface privée hors route par défaut, wg-*,
    # maillage et Auto-Load), ou `listen 127.0.0.1:80;` sans LAN. Aucune adresse figée : nginx démarre même si l'adresse
    # change ou arrive après lui. Le port 80 côté WAN reste fermé par nftables (DEFAULT DROP) ; deny all double la barrière.
    include /etc/nginx/secubox-etat-ecoute.conf;
    allow 127.0.0.1;
    allow ::1;
    deny all;
    server_name _;
    server_tokens off;

    add_header Content-Security-Policy "default-src 'none'; style-src 'sha256-BbU/zLNWiA6KAger+0RgJr7c2s5osYIWEX51N6vPbCQ='; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;

    location = /etat {
        limit_except GET { deny all; }
        default_type text/html;
        charset utf-8;
        alias /run/secubox/pilotage/etat.html;
    }
    location = / {
        return 302 /etat;
    }
    location / {
        return 404;
    }
}
