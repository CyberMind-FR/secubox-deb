# SecuBox phase-2 wake splash (#896) — shipped by secubox-profiles to
# /etc/nginx/snippets/secubox-waking.conf.
#
# One-include: `secubox-wakectl nginx-sync` adds exactly ONE line to each
# on-demand vhost's server {} block:
#     include snippets/secubox-waking.conf;
# and this snippet supplies everything else (server-level directives, inherited
# by the vhost's proxy locations):
#
#   * proxy_intercept_errors — let nginx catch the backend's gateway errors;
#   * proxy_connect_timeout 3s — fail FAST when an on-demand app is still
#     booting (connection refused / no route), so the splash is served before
#     HAProxy/sbxwaf time out and return their own 504;
#   * error_page 502 503 504 → le WAKER, qui tire le reveil ET rend la page
#     d'attente (503 + Retry-After, le navigateur reessaie tout seul). Repli
#     sur la page statique si le waker lui-meme est indisponible.
#
# SCOPE (deliberate trade-off — keeps the wiring a single include line): these
# directives are SERVER-level, so they also cover any co-located proxy location
# in the same vhost (e.g. an `/api/… -> aggregator.sock` block). Intended for
# on-demand vhosts that front ONE app (the common case: yacy, gitea, …). If a
# co-located backend independently returns 5xx (e.g. a wedged aggregator), that
# location will serve the HTML splash instead of the app's own error body. Only
# add this include to vhosts where that is acceptable; a vhost mixing an
# on-demand app with an always-on API on a different backend should scope
# proxy_intercept_errors + error_page to the app's own location instead.
proxy_intercept_errors on;
proxy_connect_timeout 3s;
# Un 5xx DECLENCHE LE REVEIL, il ne se contente pas de l'annoncer (#999).
#
# La version precedente servait un fichier statique : une belle page, et rien
# derriere. Le reveil n'avait lieu qu'en phase 1, pour les vhosts deja connus
# comme « a la demande ». Un vhost tombe par accident — conteneur arrete apres
# un redemarrage — affichait donc la page d'attente indefiniment sans que rien
# ne le releve. Constate le 2026-08-06 : 11 conteneurs arretes, aucun releve.
#
# On route donc l'erreur vers le WAKER : la meme requete tire le reveil et rend
# la page. La garde de wake() reste entiere — un module inconnu n'est pas
# demarre, il obtient seulement la page et son nom au journal.
error_page 502 503 504 = @sbx_wake;

location @sbx_wake {
    internal;
    proxy_pass http://unix:/run/secubox/waker.sock:/_wake/$host;
    proxy_set_header Host $host;
    proxy_set_header X-SecuBox-Origin-Status $upstream_status;

    # Le reveil ne doit jamais faire attendre la page. Le waker rend la main
    # tout de suite (fire-and-forget) ; ces delais courts sont une ceinture,
    # au cas ou lui-meme serait indisponible.
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;

    # proxy_intercept_errors off : les reponses du waker passent TELLES QUELLES.
    #
    # Il n'y a volontairement PAS de `error_page` ici. Le premier jet en posait
    # un vers la page statique, pour couvrir un waker injoignable — mais il
    # interceptait aussi les 502 DELIBERES du waker (module always-on en panne
    # reelle, cf. templates/down.html) et jetait leur corps. L'utilisateur
    # recevait alors la page brute de nginx : exactement ce que ce fragment
    # existe pour supprimer.
    #
    # On ne peut pas distinguer « nginx n'a pas joint le waker » d'« le waker
    # a repondu 502 » : les deux arrivent en 502. Entre les deux, on choisit de
    # laisser passer la reponse du waker — c'est le cas frequent et le seul qui
    # porte une explication. Waker injoignable reste le cas rare, et degrade
    # alors vers la page par defaut de nginx.
    proxy_intercept_errors off;
}


