# SecuBox phase-2 wake splash (#896) — shipped by secubox-profiles to
# /etc/nginx/snippets/. When an on-demand backend is up but its app is still
# booting, its proxy returns 502/503/504; intercept that and serve the terminal
# splash (auto-refreshing, same page the waker serves for phase 1) instead of a
# raw gateway error. To enable on an on-demand vhost, add INSIDE its server {}:
#     include snippets/secubox-waking.conf;
# and in that vhost's proxy location:
#     proxy_intercept_errors on;
#     proxy_connect_timeout 3s;   # fail fast so the splash beats HAProxy/sbxwaf timeouts
error_page 502 503 504 =503 /__sbx_waking.html;
location = /__sbx_waking.html {
    internal;
    alias /usr/share/secubox/www/waking/waking.html;
    default_type text/html;
    add_header Retry-After 3 always;
    add_header Cache-Control "no-store" always;
}
