#
# SecuBox-Deb :: profiles — politique de cycle de vie par défaut
#
# À QUOI SERT CE FICHIER. `secubox-profilectl scan` dérive un manifeste par
# unité secubox-*.service, mais refuse — à raison — de DEVINER si un module
# peut dormir : se tromper couperait un service qu'on croyait joignable. Sans
# indication, tout retombe donc sur `always-on`, le défaut sûr, et le sleeper
# tourne sans rien avoir à endormir. C'est exactement ce qu'on a constaté sur
# une image neuve : 86 manifestes dérivés, aucun avec une ligne `lifecycle`.
#
# D'OÙ VIENNENT CES VALEURS. Elles ne sont pas inventées : ce sont celles de
# gk2, en production, accumulées module par module. Elles ne se déduisent
# d'aucun champ — ni `portal_domain` (aucun manifeste n'en porte), ni la
# table de routes WAF (66 des 70 `on-demand` n'ont aucune route). C'est du
# jugement opérationnel, et il n'existait que dans /etc/secubox/modules.d/
# d'une seule machine, sans qu'aucun paquet ne le possède. Même sédimentation
# que les répertoires de #1307 : invisible en production, absent partout
# ailleurs. Ce fichier le met sous version (#1308).
#
# CE QUI PRIME SUR QUOI. Un manifeste existant fait toujours autorité — scan
# n'écrase pas sans --force. Cette politique ne s'applique qu'au moment de la
# DÉRIVATION, pour un module qu'on découvre. Un module absent d'ici garde
# `always-on` : ne rien savoir ne justifie jamais d'endormir.
#
# Un module `protected` reste `always-on` quoi qu'on écrive ici — cf.
# lifecycle.effective_lifecycle : on ne laisse jamais dormir le cœur.

# Toujours actifs — infrastructure dont l'arrêt casserait le reste.
[lifecycle]
"dpi"                        = "always-on"
# API APPELÉE PAR LE PANNEAU, SERVIE PAR SON PROPRE BACKEND (#1322). Le waker
# ne réveille que sur les vhosts de sites ; un module dont nginx route
# `/api/v1/<mod>/` vers SON socket (et non `aggregator.sock`) rend donc 502
# dans l'admin dès que le sleeper l'a endormi, sans rien pour le réveiller.
# Constaté sur `metablogizer` : trois rechutes en une matinée, service
# `inactive`+`disabled` sans trace au journal, et le `POST /webhook` des
# déploiements GitHub muet avec lui. Critère de tri : route nginx propre
# + appelée par une page de /usr/share/secubox/www = always-on.
"metablogizer"               = "always-on"
# Capteur de SECURITE : un service qui surveille ne doit jamais dormir,
# et sa route passe par son propre socket (l'agregateur ne declenche pas
# son demarrage, cf. secubox-sentinelle-gsm/nginx/sentinelle-gsm.conf).
"sentinelle-gsm"             = "always-on"
"podcaster"                  = "always-on"
"dpi-flowcap"                = "always-on"
"mail"                       = "always-on"
"waf"                        = "always-on"
"ytsas"                      = "always-on"

# Éveillés d'avance : ils participent au sleep/wake mais démarrent tôt.
eye-network_at_              = "eager"

# À la demande — l'essentiel du parc. Endormis après inactivité,
