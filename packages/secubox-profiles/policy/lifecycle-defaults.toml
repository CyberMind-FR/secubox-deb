# ── Classe de réveil ──────────────────────────────────────────────────────
# `urgent` dort plus difficilement (seuil d'inactivité multiplié par 4) et
# dispose d'un budget de réveil plus court — cf. lifecycle.idle_threshold et
# lifecycle.wake_budget. Réservé à ce dont la latence se voit tout de suite.
# Tout ce qui n'est pas listé ici est `normal`.
[wake_class]
"dpi"                        = "urgent"
"haproxy"                    = "urgent"
"waf"                        = "urgent"
