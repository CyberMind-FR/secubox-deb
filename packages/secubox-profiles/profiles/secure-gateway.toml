name  = "secure-gateway"
label = "Secure Gateway — appliance durcie"
# #2909 : zkp et assistance ne font partie d'aucun profil ; leurs entrees de menu sont masquees.
menu_off = ["zkp", "assist"]
# #3258 : minuteries de l'union (api/minuteurs.py) que ce profil RALLUMERAIT et qui relanceraient un service qu'il
# arrête : streamlit-idle (Requires=secubox-streamlit.service), metrics-publish (Wants=secubox-annuaire.service).
minuteurs_off = ["streamlit-idle", "metrics-publish"]
on = [
  # Pilotage distant (#3126, R-L5-34) : toute box reste télé-administrable par son maître.
  "pilotage-agent",
  "aggregator", "auth", "certs", "core", "dns",
  "dns-guard", "dns-provider", "exposure", "haproxy", "hardening", "ipblock",
  "users", "vortex-firewall", "waf", "waf-ng", "waf-ratelimit",
  "console", "kiosk",
]
