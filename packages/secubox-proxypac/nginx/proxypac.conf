# secubox-proxypac — PAC file + WebUI API
#
# The /proxy.pac allow/deny below matches on $remote_addr. Behind the board's
# HAProxy -> sbxwaf -> nginx chain, $remote_addr is 127.0.0.1 UNLESS the real_ip
# module rewrites it from X-Forwarded-For. That rewrite (set_real_ip_from /
# real_ip_header) is shipped by secubox-hub (nginx/secubox-lan-geo.conf, http
# context) — hence the Depends: secubox-hub. Without it, `allow 127.0.0.1` would
# whitelist every proxied request and expose the PAC (internal mesh topology).
# ATTENTION — CE FICHIER PEUT ETRE INCLUS DANS UN BLOC QUE NGINX NE CHOISIT
# JAMAIS (#1034). Il l'etait : le bloc qui l'incluait declarait
# `server_name ~^admin\.gk2\.secubox\.in$` — un nom REGEX — tandis qu'un autre
# bloc revendiquait le meme nom en EXACT. Or nginx retient toujours le nom exact
# avant la regex. La `location` ci-dessous existait donc dans la configuration
# chargee, sans jamais servir une seule requete : rien n'echouait, rien ne se
# journalisait, elle etait simplement morte.
#
# C'est pourquoi le vhost WPAD (wpad-vhost.conf) sert desormais `/proxy.pac`
# LUI-MEME, sur son propre nom, sans dependre de l'inclusion ci-dessous.
location = /proxy.pac {
    default_type application/x-ns-proxy-autoconfig;
    alias /var/lib/secubox/proxypac/proxy.pac;
    add_header Cache-Control "max-age=300";
    allow 127.0.0.1;
    allow 192.168.0.0/16;
    allow 10.10.0.0/24;
    deny all;
}
location /api/v1/proxypac/ {
    proxy_pass http://unix:/run/secubox/aggregator.sock:/api/v1/proxypac/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}
