# secubox-proxypac — WPAD auto-discovery vhost (LAN + mesh only, never public)
server {
    # Listen on the internal SecuBox nginx port (HAProxy fronts :80/:443 and
    # routes wpad.<domain> here by Host). A bare `listen 80;` collides with
    # HAProxy's :80 and makes EVERY `nginx -s reload` abort on the bind, so
    # config changes silently stop applying board-wide. See
    # project_gk2_nginx_multimaster_blocker.
    listen 9080;
    server_name wpad.gk2.secubox.in;
    # `127.0.0.1` EST AUTORISE PARCE QUE C'EST L'ADRESSE VUE DERRIERE HAPROXY
    # tant que `real_ip` n'a pas reecrit `X-Forwarded-For` (rewrite livre par
    # secubox-hub). Sans elle, la chaine HAProxy -> sbxwaf -> nginx se refusait
    # elle-meme le PAC, et les sondes locales aussi.
    allow 127.0.0.1;
    allow 192.168.0.0/16;
    allow 10.10.0.0/24;
    deny all;

    # LES DEUX NOMS DESIGNENT LE MEME FICHIER, ET C'EST VOULU.
    #
    # `/wpad.dat` est le nom qu'un systeme cherche tout seul (WPAD). `/proxy.pac`
    # est celui qu'un humain saisit dans les preferences d'un navigateur, et
    # celui que porte la documentation. N'en servir qu'un revient a casser
    # l'autre : `/proxy.pac` rendait 404 ici, et sur `admin` il rendait 200 avec
    # une page HTML — ce qui est PIRE qu'un 404, puisque le navigateur la
    # telecharge, echoue a l'analyser, et reste silencieusement sans proxy.
    location = /wpad.dat {
        default_type application/x-ns-proxy-autoconfig;
        alias /var/lib/secubox/proxypac/proxy.pac;
    }
    location = /proxy.pac {
        default_type application/x-ns-proxy-autoconfig;
        alias /var/lib/secubox/proxypac/proxy.pac;
        add_header Cache-Control "max-age=300";
    }
}
