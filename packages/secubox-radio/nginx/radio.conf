# Vhost public de la radio.
#
# LE DEMON NE VOIT QUE CE QUE NGINX LUI DIT. Les en-tetes d'identite sont poses
# APRES verification et ECRASENT ce que le client aurait envoye : sans ce
# `proxy_set_header` inconditionnel, n'importe qui se declarerait sysop.
server {
    listen 9081;
    server_name radio.gk2.secubox.in;

    # L'identite vient de la porte SecuBox partagee.
    auth_request /__sbx_auth_verify;
    auth_request_set $sbx_user    $upstream_http_x_sbx_user;
    auth_request_set $sbx_user_id $upstream_http_x_sbx_user_id;
    auth_request_set $sbx_role    $upstream_http_x_sbx_role;

    location = /__sbx_auth_verify {
        internal;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        return 204;
    }

    location / {
        proxy_pass http://unix:/run/secubox/radio.sock:;
        proxy_set_header Host $host;
        # ECRASEMENT INCONDITIONNEL : c'est la garde qui compte.
        proxy_set_header X-Sbx-User    $sbx_user;
        proxy_set_header X-Sbx-User-Id $sbx_user_id;
        proxy_set_header X-Sbx-Role    $sbx_role;

        # Les clips se servent en plages : un auditeur qui rejoint le direct
        # demande « a partir de 3 min 41 ». La mise en tampon des reponses
        # casserait cela.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
