# Vhost de la radio — MEME MONTAGE QUE LE PODCASTER.
#
# Port 9080 partage, pas de porte `auth_request` : sur cette board le LAN est
# de confiance et le WAN ne l'est pas, et c'est HAProxy qui tient cette
# frontiere. Ajouter une porte ici n'aurait rien ferme de plus et aurait fait
# diverger la radio des autres modules.
#
# UNE SEULE `location` : le demon sert lui-meme sa page, ses fichiers statiques,
# `/media/` et `/api/v1/radio/`. Le chemin est transmis ENTIER — le demon monte
# aussi ses routes sans prefixe, pour repondre a l'agregateur qui, lui, le
# retire.
server {
    listen 9080;
    server_name radio.gk2.secubox.in;
    include snippets/secubox-waking.conf;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/secubox/www;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://unix:/run/secubox/radio.sock:;
        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # LES CLIPS SE SERVENT EN PLAGES : la mise en tampon casserait le
        # positionnement, et un auditeur qui rejoint le direct attendrait le
        # telechargement complet avant d'entendre quoi que ce soit.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
    }

    access_log /var/log/nginx/radio_access.log;
    error_log  /var/log/nginx/radio_error.log;
}
