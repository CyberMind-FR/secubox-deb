# Vhost de la radio — MEME MONTAGE QUE LE PODCASTER.
#
# Port 9080 partage, pas de porte `auth_request` : sur cette board le LAN est
# de confiance et le WAN ne l'est pas, et c'est HAProxy qui tient cette
# frontiere. Ajouter une porte ici n'aurait rien ferme de plus et aurait fait
# diverger la radio des autres modules.
#
# UNE SEULE `location` : le demon sert lui-meme sa page, ses fichiers statiques,
# `/media/` et `/api/v1/radio/`. Le chemin est transmis ENTIER — le demon monte
# aussi ses routes sans prefixe, pour repondre a l'agregateur qui, lui, le
# retire.
server {
    listen 9080;
    server_name radio.gk2.secubox.in;
    include snippets/secubox-errorpages.conf;
    include snippets/secubox-waking.conf;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/secubox/www;
        try_files $uri =404;
    }

    # LES RESSOURCES PARTAGEES, servies comme chez les autres modules.
    #
    # SANS ELLES, LA BANNIERE DE SANTE SE DEVERSE EN TEXTE BRUT en bas de page :
    # son script se charge, ne trouve ni sa feuille de style ni ses ressources,
    # et rend une liste de metriques nue sur toute la hauteur. Le defaut est
    # spectaculaire et sa cause invisible — la page « marche », elle est juste
    # illisible.
    location /shared/ {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        alias /usr/share/secubox/www/shared/;
    }

    # ROUTES COURTES = ADMINISTRATION (#1430). Le démon les monte avec
    # parAdmin (sysop), en tenant pour acquis qu'on n'y arrive QUE par la porte
    # d'administration (qui retire le préfixe /api/v1/radio). Or ce vhost passe
    # le chemin tel quel : https://radio.gk2/current rendait la vue sysop au
    # public. La page publique n'emploie que /api/v1/radio/… ; le reste : 404.
    location ~ ^/(current|playlist|propositions|pistes|chat|suivante|stats|replay)(/|$) {
        return 404;
    }

    location / {
        proxy_pass http://unix:/run/secubox/radio.sock:;
        # Ces en-têtes DÉCLARENT une identité : seule une porte a le droit de
        # les poser, jamais le client (#1430). X-Sbx-Radio-Sysop reste : c'est
        # un secret, comparé en temps constant par le démon.
        proxy_set_header X-Sbx-User-Id "";
        proxy_set_header X-Sbx-User    "";
        proxy_set_header X-Sbx-Role    "";
        proxy_set_header X-SecuBox-LAN $lan_client;   # verdict LAN (#1354)
        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # LES CLIPS SE SERVENT EN PLAGES : la mise en tampon casserait le
        # positionnement, et un auditeur qui rejoint le direct attendrait le
        # telechargement complet avant d'entendre quoi que ce soit.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
    }

    access_log /var/log/nginx/radio_access.log;
    error_log  /var/log/nginx/radio_error.log;
    access_log /var/log/nginx/secubox-hosts.log sbx_host;
}
