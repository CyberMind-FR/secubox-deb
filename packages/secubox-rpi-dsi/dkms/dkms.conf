# DKMS de l'écran officiel Raspberry Pi 7" (DSI) sur noyau Debian (#3399).
# Les sources viennent du paquet linux-source-<maj.min> à chaque noyau : rien n'est
# vendu ici hormis les patches (GPL-2.0). @VERSION@ remplacé par debian/rules.
# Un échec (source absente, version différente, patch refusé, compilation) fait
# échouer la construction entière : aucun des 4 modules n'est installé.

PACKAGE_NAME="secubox-rpi-dsi"
PACKAGE_VERSION="@VERSION@"
BUILD_EXCLUSIVE_ARCH="^aarch64$"
MAKE[0]="bash ./secubox-rpi-dsi-build build ${kernelver} ${kernel_source_dir}"
CLEAN="rm -rf src build"
BUILT_MODULE_NAME[0]="vc4"
BUILT_MODULE_LOCATION[0]="build/vc4/"
DEST_MODULE_LOCATION[0]="/updates/dkms"
BUILT_MODULE_NAME[1]="tc358762"
BUILT_MODULE_LOCATION[1]="build/tc358762/"
DEST_MODULE_LOCATION[1]="/updates/dkms"
BUILT_MODULE_NAME[2]="panel-simple"
BUILT_MODULE_LOCATION[2]="build/panel-simple/"
DEST_MODULE_LOCATION[2]="/updates/dkms"
BUILT_MODULE_NAME[3]="edt-ft5x06"
BUILT_MODULE_LOCATION[3]="build/edt-ft5x06/"
DEST_MODULE_LOCATION[3]="/updates/dkms"
AUTOINSTALL="yes"
