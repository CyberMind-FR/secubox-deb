# HAProxy stream-mode frontend/backend for RustDesk TCP ports.
# Installed to /etc/haproxy/secubox-streams/rustdesk-stream.cfg.
# Loaded by secubox-haproxy's main haproxy.cfg via an include directive.
#
# UDP signal port (21116/udp) is NOT handled here — see install-lxc.sh's
# nftables DNAT rule (mitmproxy / HAProxy cannot inspect raw UDP).

frontend rustdesk-stream-21115
    mode tcp
    bind :21115
    default_backend rustdesk-lxc-21115

frontend rustdesk-stream-21116-tcp
    mode tcp
    bind :21116
    default_backend rustdesk-lxc-21116

frontend rustdesk-stream-21117
    mode tcp
    bind :21117
    default_backend rustdesk-lxc-21117

backend rustdesk-lxc-21115
    mode tcp
    server hbbs-natutil 10.100.0.90:21115 check

backend rustdesk-lxc-21116
    mode tcp
    server hbbs-signal 10.100.0.90:21116 check

backend rustdesk-lxc-21117
    mode tcp
    server hbbr-relay 10.100.0.90:21117 check
