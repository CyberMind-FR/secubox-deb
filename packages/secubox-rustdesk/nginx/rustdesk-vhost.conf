# /etc/nginx/sites-available/rustdesk.conf — public vhost rustdesk.gk2.secubox.in
# Installed by secubox-rustdesk (dual-vhost split per MODULE-GUIDELINES §4).
#
# Routing:
#   Browser → HAProxy:443 (TLS cert /data/haproxy/certs/rustdesk.gk2.secubox.in.pem)
#          → mitmproxy WAF (entry in /srv/mitmproxy/haproxy-routes.json INSIDE LXC)
#          → nginx:9080 (this vhost)
#          → RustDesk web admin LXC at 10.100.0.90:21114
#
# This vhost is for the WEB admin only. The signal/relay TCP/UDP ports
# (21115-21119) are HAProxy stream + nftables DNAT and are NOT covered here.
#
# Operator prerequisites (NOT done by this snippet):
#   1. DNS A record rustdesk.gk2.secubox.in → public IP
#   2. TLS cert in /data/haproxy/certs/rustdesk.gk2.secubox.in.pem
#   3. haproxyctl vhost add rustdesk.gk2.secubox.in nginx_vhosts ssl
#   4. mitmproxy route INSIDE the LXC:
#        lxc-attach -n mitmproxy -- python3 -c \
#          "import json; p='/srv/mitmproxy/haproxy-routes.json'; d=json.load(open(p)); \
#           d['rustdesk.gk2.secubox.in']=['192.168.1.200',9080]; json.dump(d, open(p,'w'), indent=2, sort_keys=True)"
#        lxc-attach -n mitmproxy -- systemctl restart mitmproxy

server {
    listen 0.0.0.0:9080;
    server_name rustdesk.gk2.secubox.in;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/secubox/www;
        try_files $uri =404;
    }

    sub_filter_types text/html;
    sub_filter_once on;
    sub_filter "</body>" '<script src="/shared/health-banner.js"></script></body>';

    location /shared/ {
        add_header Access-Control-Allow-Origin "*" always;
        alias /usr/share/secubox/www/shared/;
    }

    # RustDesk web admin proxied to the LXC at root path.
    location / {
        auth_request /__sbx_auth_verify;
        error_page 401 = @sbx_auth_login;

        proxy_pass http://10.100.0.90:21114/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 86400;
    }

    location = /__sbx_auth_verify {
        internal;
        proxy_pass http://unix:/run/secubox/authelia.sock:/verify;
        proxy_set_header Host $host;
        proxy_set_header X-Original-URL $scheme://$host$request_uri;
        proxy_set_header X-Forwarded-Method $request_method;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Uri $request_uri;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location @sbx_auth_login {
        return 302 https://sso.gk2.secubox.in/?rd=https://$host$request_uri;
    }

    access_log /var/log/nginx/rustdesk_access.log;
    error_log  /var/log/nginx/rustdesk_error.log;
}
