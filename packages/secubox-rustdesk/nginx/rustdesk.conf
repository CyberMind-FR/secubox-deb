# /etc/nginx/secubox.d/rustdesk.conf
# Installed by secubox-rustdesk.
#
# Per MODULE-GUIDELINES.md §4 REQUIRED (dual-vhost):
#   /api/v1/rustdesk/ → host FastAPI on Unix socket
#   /rustdesk/        → SecuBox admin static page (alias). NOT a proxy.
#                       Real RustDesk web admin (port 21114) lives at
#                       rustdesk.gk2.secubox.in (see rustdesk-vhost.conf).
#
# The signal / relay TCP/UDP ports (21115-21119) are HAProxy stream + nftables
# DNAT (see /etc/haproxy/secubox-streams/rustdesk-stream.cfg + install-lxc.sh).
# Those are unaffected by the dual-vhost split — they never go through nginx.

location /api/v1/rustdesk/ {
    auth_request /__sbx_auth_verify;
    error_page 401 = @sbx_auth_login;
    rewrite ^/api/v1/rustdesk/(.*)$ /$1 break;
    proxy_pass http://unix:/run/secubox/aggregator.sock:/api/v1/rustdesk/;
    include /etc/nginx/snippets/secubox-proxy.conf;
}

# SecuBox admin static page for RustDesk. NOT a proxy to the web admin.
location /rustdesk/ {
    auth_request /__sbx_auth_verify;
    error_page 401 = @sbx_auth_login;
    alias /usr/share/secubox/www/rustdesk/;
    index index.html;
    try_files $uri $uri/ /rustdesk/index.html;
}
