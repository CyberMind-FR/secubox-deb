# /etc/nginx/secubox.d/rustdesk.conf
# Installed by secubox-rustdesk (#234)
#
# Web admin UI (port 21114) only — the raw signal/relay TCP ports go
# through HAProxy stream-mode (see /etc/haproxy/secubox-streams/rustdesk-stream.cfg)
# and the UDP signal port goes through nftables DNAT (see install-lxc.sh).

location /api/v1/rustdesk/ {
    rewrite ^/api/v1/rustdesk/(.*)$ /$1 break;
    proxy_pass http://unix:/run/secubox/rustdesk.sock;
    include /etc/nginx/snippets/secubox-proxy.conf;
}

# Native RustDesk web admin (iframe target from /rustdesk/index.html)
location /rustdesk/ {
    proxy_pass http://10.100.0.90:21114/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_read_timeout 86400;
}
