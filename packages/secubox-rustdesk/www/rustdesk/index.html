<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SecuBox — RustDesk</title>
<link rel="stylesheet" href="/shared/crt-light.css">
<link rel="stylesheet" href="/shared/sidebar-light.css">
    <link rel="stylesheet" href="/shared/hybrid-dark.css">
<style>
  html, body { margin: 0; padding: 0; height: 100%; }
  .layout { display: grid; grid-template-columns: 260px 1fr; height: 100vh; }
  .rd-frame { border: 0; width: 100%; height: 100%; background: var(--bg-1, #0f1320); }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.5rem 1rem; background: var(--bg-2, #181c2c);
    border-bottom: 1px solid var(--border, #2a3354);
    color: var(--void-main, #6e40c9);
    font-family: 'JetBrains Mono', monospace; font-size: 0.85rem;
  }
  .topbar .actions a { color: var(--void-main); margin-left: 1rem; text-decoration: none; }
  .topbar .actions a:hover { text-decoration: underline; }
  .threefold {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 1rem; padding: 1rem; background: var(--bg-1);
  }
  .threefold article {
    background: var(--bg-2); border: 1px solid var(--border);
    padding: 0.75rem 1rem; border-radius: 4px;
  }
  .threefold h3 {
    margin: 0 0 0.5rem 0; color: var(--void-main);
    font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em;
  }
  .threefold .v { font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; }
  .container { display: flex; flex-direction: column; height: 100vh; }
  .iframe-wrap { flex: 1; }
</style>
</head>
<body class="crt-light hybrid-dark">

<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>
  <div class="container">
    <div class="topbar">
      <div><strong>SecuBox</strong> · RustDesk — self-hosted remote desktop</div>
      <div class="actions">
        <a href="/" title="Back to SecuBox hub">← hub</a>
        <a href="#" id="open-native" title="Open native RustDesk admin">native UI</a>
      </div>
    </div>

    <section class="threefold">
      <article><h3>Components</h3><div class="v" id="components-v">loading…</div></article>
      <article><h3>Status</h3><div class="v" id="status-v">loading…</div></article>
      <article><h3>Access</h3><div class="v" id="access-v">loading…</div></article>
    </section>

    <div class="iframe-wrap">
      <iframe class="rd-frame" src="/rustdesk/" title="RustDesk admin UI" referrerpolicy="no-referrer"></iframe>
    </div>
  </div>
</div>

<script src="/shared/sidebar.js"></script>
<script>
(function() {
  function getToken() { return localStorage.getItem('sbx_token'); }
  function checkAuth() {
    if (!getToken()) {
      window.location.href = '/login.html?redirect=' + encodeURIComponent(window.location.pathname);
      return false;
    }
    return true;
  }
  if (!checkAuth()) {
    document.body.innerHTML = '<div style="padding:2rem;color:var(--void-main);">Redirecting to login...</div>';
    return;
  }

  function get(path) {
    return fetch('/api/v1/rustdesk' + path, {
      headers: { 'Authorization': 'Bearer ' + getToken() }
    }).then(r => r.ok ? r.json() : Promise.reject(r.status));
  }

  get('/components').then(d => {
    document.getElementById('components-v').innerHTML =
      d.components.map(c => '<div>' + c.name + ': <strong>' + c.state + '</strong></div>').join('');
  }).catch(() => { document.getElementById('components-v').textContent = 'unavailable'; });

  get('/status').then(d => {
    const colourVar = d.overall === 'green' ? 'root-main' : d.overall === 'yellow' ? 'wall-main' : 'auth-main';
    document.getElementById('status-v').innerHTML =
      '<span style="color:var(--' + colourVar + ')">' + (d.overall || 'unknown').toUpperCase() + '</span>';
  }).catch(() => { document.getElementById('status-v').textContent = 'unavailable'; });

  get('/access').then(d => {
    var access = d.access || [];
    document.getElementById('access-v').innerHTML =
      access.map(a => '<div>' + a.scope + ': <span style="font-size:0.7rem">' + a.url + '</span></div>').join('');
    // Single source of truth for the "native UI" button — point at the
    // web admin URL (`public` HTTPS first, `lan` HTTP fallback). The
    // rustdesk:// signal/relay scopes are skipped — they're for the
    // client app, not the web admin.
    var pub = access.find(a => a.scope === 'public');
    var lan = access.find(a => a.scope === 'lan');
    var target = (pub && pub.url) || (lan && lan.url) || '#';
    var btn = document.getElementById('open-native');
    if (btn) { btn.href = target; btn.target = '_blank'; btn.rel = 'noopener'; }
  }).catch(() => { document.getElementById('access-v').textContent = 'unavailable'; });
})();
</script>
</body>
</html>
