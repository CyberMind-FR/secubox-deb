# saas-relay API
location /api/v1/saas-relay/ {
    proxy_pass http://unix:/run/secubox/aggregator.sock:/api/v1/saas-relay/;
    include /etc/nginx/snippets/secubox-proxy.conf;
    proxy_intercept_errors on;
}
