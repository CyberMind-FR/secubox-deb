#
# identity.gk2.secubox.in → le Hall (#1422). L'Identity Manager est servi
# PAR LE HALL parce que la clé de l'appareil vit dans l'IndexedDB de CETTE
# origine : servi ailleurs, il ne verrait pas la clé et ne pourrait pas faire
# signer un certificat par l'appareil. Ce nom-ci n'est donc qu'un raccourci.
server {
    listen 9080;
    # Le Hall du MÊME domaine que ce nom (#1723) — hall.gk2 figé renvoyait gk3 chez gk2.
    server_name ~^identity\.(?<sbx_dom>[a-z0-9][a-z0-9.-]*[a-z0-9])$;
    location ^~ /.well-known/acme-challenge/ { root /usr/share/secubox/www; try_files $uri =404; }
    location / { return 301 https://hall.$sbx_dom/identite/; }
}
