# /etc/nginx/secubox-routes.d/sbxos.conf — installé par secubox-sbxos.

location /sbxos/ {
    alias /usr/share/secubox/www/sbxos/;
    index index.html;
    # Repli SPA : une route inconnue rend la coquille, qui décide ensuite.
    try_files $uri $uri/ /sbxos/index.html;

    # MAIS PAS POUR LES FICHIERS. Un repli qui vaut pour tout masque les
    # absences : une icône manquante ressortait en `text/html`, 200, avec la
    # coquille dedans — et une PWA dont les icônes sont des pages HTML NE
    # S'INSTALLE PAS, sans que rien ne le signale.
    #
    # Une extension de fichier dit « je veux CE fichier », pas « je veux une
    # route ». Elle doit donc échouer en 404 quand il n'est pas là.
    location ~ ^/sbxos/(?<fichier>.+\.(?:png|jpe?g|webp|svg|ico|css|js|mjs|json|webmanifest|woff2?|mp4|webm))$ {
        alias /usr/share/secubox/www/sbxos/$fichier;
        # `=404` explicite : sans lui, `alias` sur un fichier absent rend un
        # 404 de nginx, mais la règle reste lisible en le disant.
        try_files "" =404;
    }

    # LE SERVICE WORKER NE DOIT JAMAIS ÊTRE MIS EN CACHE PAR LE NAVIGATEUR.
    # C'est LUI qui gère les caches ; s'il est lui-même servi depuis le cache
    # HTTP, une version corrigée peut rester invisible pendant des jours et
    # continuer de servir l'ancienne coquille. C'est le piège classique des PWA.
    location = /sbxos/offline/sw.js {
        alias /usr/share/secubox/www/sbxos/offline/sw.js;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/sbxos/" always;
    }

    # Le manifeste d'application doit être relu : c'est lui qui porte le nom,
    # les icônes et les raccourcis.
    location = /sbxos/manifest.webmanifest {
        alias /usr/share/secubox/www/sbxos/manifest.webmanifest;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }

    # Le manifeste de la MINE change quand un profil change : jamais de cache.
    location ~ ^/sbxos/mine/.*\.json$ {
        alias /usr/share/secubox/www/sbxos/mine/$1;
        add_header Cache-Control "no-store" always;
    }
}
