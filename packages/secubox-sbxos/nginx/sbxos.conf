# /etc/nginx/secubox-routes.d/sbxos.conf — installé par secubox-sbxos.

# SBX OS N'EST PLUS SERVI PAR LE PANNEAU D'ADMINISTRATION (#1353).
#
# Il l'était, et c'était un contresens sur les deux : l'administration doit
# rester INTERNE, et SBX OS est la porte publique — le Hall qui tient dans la
# poche. Le Hall le sert désormais.
#
# LA VRAIE RAISON EST TECHNIQUE. La clé privée de l'appareil vit dans
# IndexedDB, rangée PAR ORIGINE. Servi depuis admin.gk2, SBX OS ne voyait pas
# la clé créée par la carlette d'accès sur hall.gk2 : deux identités pour un
# seul appareil, et aucune ouverture automatique possible.
#
# 302 et non 301 : un 301 mémorisé par les navigateurs survivrait à un
# changement d'avis.
location = /sbxos/ { return 302 https://hall.gk2.secubox.in/sbxos/; }
location = /sbxos  { return 302 https://hall.gk2.secubox.in/sbxos/; }
location ~ ^/sbxos/(.*)$ { return 302 https://hall.gk2.secubox.in/sbxos/$1; }
