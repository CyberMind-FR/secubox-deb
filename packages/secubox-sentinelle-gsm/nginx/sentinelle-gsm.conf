# /etc/nginx/secubox.d/sentinelle-gsm.conf + /etc/nginx/secubox-routes.d/sentinelle-gsm.conf
# Installed by secubox-sentinelle-gsm (#237).
#
# Host control plane only. The SDR + gr-gsm + analyzer all run on the host
# (LAN-internal). No port to reverse-proxy beyond the FastAPI socket.

# CE CAPTEUR PASSE PAR SON PROPRE SOCKET, PAS PAR L'AGREGATEUR (#1323).
# Deux raisons, l'une mecanique et l'autre de fond :
#
#  1. L'agregateur MONTE l'application mais ne declenche pas son demarrage :
#     `/alerts` et `/trusted` y repondent 500 — « alert_sink not initialised ».
#     Seul le service autonome execute le hook qui ouvre le puits d'alertes.
#  2. Le `rewrite ... break` qui precedait rendait de toute facon la route
#     inoperante : une URI reecrite dans la location fait IGNORER la partie URI
#     du `proxy_pass`, si bien que `/api/v1/sensor/gsm/status` arrivait sur la
#     RACINE de l'agregateur — 404. Toute la page /sentinelle/ etait morte.
#
# Le service est un capteur de securite : il reste `always-on` (cf.
# lifecycle-defaults.toml), donc ce socket ne s'endort pas sous lui.
location /api/v1/sensor/gsm/ {
    proxy_pass http://unix:/run/secubox/sentinelle-gsm.sock:/;
    include /etc/nginx/snippets/secubox-proxy.conf;
}
