# SecuBox-Deb :: SBX-SIGNAL — configuration
# /etc/secubox/signal.toml

[daemon]
socket   = "/run/secubox/signal.sock"
log_dir  = "/var/log/secubox/signal"
state_dir = "/var/lib/secubox/signal"

[backend]
# Fourni par secubox-signal-engine. signal-cli n'est dans AUCUNE Debian :
# c'est pourquoi un paquet separe l'embarque (cf. RFC §3).
signal_cli = "/usr/lib/secubox/signal/bin/signal-cli"
# Duree au-dela de laquelle un appel au backend est abandonne. La JVM demarre
# lentement sur arm64 ; 60 s n'est pas excessif au premier lancement.
timeout_sec = 60

[retention]
# LE CONTENU DES MESSAGES N'EST PAS CONSERVE PAR DEFAUT, et ce choix n'est pas
# technique. Une box qui archive des conversations chiffrees de bout en bout
# devient une cible d'un interet tout autre, et deplace la responsabilite
# juridique sur son exploitant. Passer ceci a `true` est une decision qui
# engage — pas un reglage de confort.
store_body = false
hours = 24

[attachments]
max_bytes = 104857600   # 100 Mio — limite Signal cote service
hours = 24

[sentinel]
# Relais des alertes vers Signal. Socket ABSENTE => relais inactif, et le
# module reste utilisable comme messagerie : on ne fait pas dependre la
# messagerie du detecteur.
events_socket = "/run/secubox/sentinel-events.sock"
enabled = true
destination = ""        # numero E.164 ou identifiant de groupe

# GARDE-FOU ANTI-AVALANCHE, non negociable. Au-dela de ce seuil horaire, les
# alertes sont agregees en UN message de synthese. Une tempete d'evenements ne
# doit devenir ni une tempete de notifications, ni un epuisement du quota du
# compte lie.
max_per_hour = 20
