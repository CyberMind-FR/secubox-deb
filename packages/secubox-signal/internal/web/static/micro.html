  SBX-SIGNAL — cardlet /micro, encadree par le Hall.
  Le Hall porte deja la session : ce document ne demande PAS de JWT, sinon il
  serait blanc pour tout le monde.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signal</title>
<link rel="stylesheet" href="/shared/sbxui/spicy.css">
<style>
  /* Palette COMPLETE en clair sur :root, redefinie pour le sombre dans les
     deux etats — media query ET [data-theme]. Une couleur qui n'existerait
     que dans un bloc sombre laisserait la cardlet illisible dans l'autre. */
  :root { --fond:#ffffff; --texte:#1a1a22; --muted:#6b6b7a; --bord:#e2e2ea;
          --accent:#3a76f0; --ok:#2f9e5f; --off:#8a8a93; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --fond:#14141c; --texte:#e8e6d9;
      --muted:#8a8a99; --bord:#2a2a36; --accent:#6f9bff; }
  }
  :root[data-theme="dark"] { --fond:#14141c; --texte:#e8e6d9; --muted:#8a8a99;
    --bord:#2a2a36; --accent:#6f9bff; }

  /* Fond EXPLICITE : un body transparent emprunte le fond de l'hote et rend
     le texte illisible des que les deux themes divergent. */
  body { margin:0; background:var(--fond); color:var(--texte);
         font:13px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; }
  .sig { display:flex; flex-direction:column; gap:.55rem; padding:.7rem .8rem; }
  .sig-tete { display:flex; align-items:center; gap:.5rem; }
  .sig-pastille { width:.6rem; height:.6rem; border-radius:50%;
                  background:var(--off); flex:0 0 auto; }
  .sig-pastille[data-etat="up"] { background:var(--ok); }
  .sig-compte { color:var(--muted); font-variant-numeric:tabular-nums; }
  .sig-corps { color:var(--muted); }
  .sig-pied { display:flex; justify-content:space-between; font-size:.85em;
              color:var(--muted); border-top:1px solid var(--bord); padding-top:.4rem; }
</style>

<div class="sig">
  <div class="sig-tete">
    <span class="sig-pastille" id="pastille" aria-hidden="true"></span>
    <strong>Signal</strong>
    <span class="sig-compte" id="compte">…</span>
  </div>
  <div class="sig-corps" id="corps">chargement…</div>
  <div class="sig-pied"><span id="etat"></span><span id="ver"></span></div>
</div>

<script>
// THEME. Le Hall le passe de deux facons : en parametre a l'ouverture, puis
// par postMessage quand l'utilisateur en change sans recharger. Ignorer l'une
// des deux laisse la cardlet a contretemps du reste du Hall.
(function () {
  var t = new URLSearchParams(location.search).get('theme');
  if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
})();
addEventListener('message', function (e) {
  var d = e.data;
  if (!d || d.sbx !== 'theme') return;
  if (d.theme === 'dark' || d.theme === 'light') {
    document.documentElement.setAttribute('data-theme', d.theme);
  }
});

const $ = (id) => document.getElementById(id);

async function rafraichir() {
  try {
    const h = await (await fetch('/api/v1/signal/healthz', { credentials:'same-origin' })).json();
    $('pastille').dataset.etat = h.backend === 'up' ? 'up' : 'off';
    $('compte').textContent =
      h.backend === 'unlinked' ? 'non appairé' :
      h.backend === 'up'       ? 'lié'         : 'backend absent';
    // L'historique exige un jeton que la cardlet encadree n'a pas. On affiche
    // donc l'etat et on le DIT — un vide ressemblerait a « aucun message ».
    $('corps').textContent = h.backend === 'up'
      ? 'Ouvrir pour lire les conversations'
      : 'Appairer un compte depuis la page du module';
    $('etat').textContent = h.status === 'ok' ? 'démon actif' : '';
    $('ver').textContent = 'v' + (h.version || '');
  } catch (e) {
    $('pastille').dataset.etat = 'off';
    $('compte').textContent = 'injoignable';
    $('corps').textContent = 'Le démon ne répond pas';
  }
}
rafraichir();
setInterval(rafraichir, 15000);
</script>
