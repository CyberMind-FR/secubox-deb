# SecuBox-Deb :: SBX-SIGNAL — vhost
server {
    listen 9089;
    server_name signal.gk2.secubox.in;

    # Le schema est DECIDE, pas lu : derriere le double mandataire HAProxy puis
    # nginx, $scheme vaut http et ecraserait le https d'HAProxy.
    if ($http_x_forwarded_proto = "http") { return 301 https://$host$request_uri; }

    root /usr/share/secubox/www/signal;
    index index.html;

    # frame-ancestors 'self' https://hall... est OBLIGATOIRE : sans lui, la
    # carlette encadree herite du 'none' serveur et n'affiche rien, meme en
    # meme-origine. connect-src inclut wss: pour le flux d'evenements.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' wss://signal.gk2.secubox.in; frame-ancestors 'self' https://hall.gk2.secubox.in https://hall.gk2.net; base-uri 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    access_log /var/log/nginx/secubox-hosts.log sbx_host;

    location /shared/ {
        alias /usr/share/secubox/www/shared/;
        expires 1h;
        access_log off;
        try_files $uri =404;
    }

    location /api/v1/signal/ {
        proxy_pass http://unix:/run/secubox/signal.sock:/api/v1/signal/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # Le WebSocket exige Upgrade/Connection explicites : sans eux nginx
    # retombe en HTTP/1.1 sans bascule et le client voit un 200 muet.
    location /api/v1/signal/ws {
        proxy_pass http://unix:/run/secubox/signal.sock:/api/v1/signal/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location = /micro {
        proxy_pass http://unix:/run/secubox/signal.sock:/api/v1/signal/micro;
        proxy_set_header Host $host;
    }

    location = / { try_files /index.html =404; }
}
