#
# CE FICHIER NE CREE PLUS LES REPERTOIRES D'ETAT, et c'est deliberе.
#
# systemd-tmpfiles REFUSE d'agir sur une transition de proprietaire :
#
#   Detected unsafe path transition /var/lib/secubox (owned by secubox)
#     -> /var/lib/secubox/signal (owned by secubox-signal)
#
# C'est une protection, pas un bogue — tmpfiles se garde de suivre un chemin
# dont un maillon appartient a un autre utilisateur. Nos repertoires d'etat
# sont precisement dans ce cas : /var/lib/secubox appartient a `secubox`,
# notre sous-arbre a `secubox-signal`.
#
# Les regles etaient donc INOPERANTES et bruyantes : un avertissement a chaque
# demarrage pour un travail que le postinst et les ExecStartPre de l'unite
# font deja, eux, correctement. Constate a l'installation sur gk2 (#1309).
#
# Ne rien declarer vaut mieux que declarer ce qui ne peut pas s'appliquer.
