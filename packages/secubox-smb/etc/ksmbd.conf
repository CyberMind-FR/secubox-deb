; SecuBox-Deb :: ksmbd — partage SMB servi depuis le noyau
; CyberMind — https://cybermind.fr
;
; ksmbd sert les fichiers depuis l'espace noyau : pas d'aller-retour vers un
; processus utilisateur a chaque lecture, la ou smbd (Samba) recopie les
; donnees entre noyau et espace utilisateur. Sur 4 coeurs Armada deja charges,
; c'est la difference entre saturer le lien et le sous-employer.
;
; PERIMETRE : LAN uniquement. Aucune exposition WAN, ni via HAProxy. Le
; drop-in nft (zz-secubox-smb.nft) n'ouvre 445 que depuis le reseau local ;
; ce fichier ne fait que refuser tout le reste par configuration.

[global]
	netbios name = SECUBOX
	server string = SecuBox
	workgroup = WORKGROUP

	; SMB1 est exclu : protocole obsolete, non chiffre, et sa negociation
	; est le vecteur historique des attaques de retrogradation.
	server min protocol = SMB3_00
	server signing = mandatory

	; Aucun acces anonyme. Un partage qui expose /data ne s'ouvre pas a un
	; invite : `map to guest = bad user` transformerait chaque erreur de
	; frappe d'identifiant en session invitee.
	map to guest = never
	restrict anonymous = 2

	; Ecoute cantonnee a l'interface LAN. Sans cela, ksmbd ecouterait aussi
	; sur les bridges LXC et les interfaces WireGuard.
	bind interfaces only = yes
	interfaces = eth2

	; Les fichiers deposes restent lisibles par les services qui consomment
	; ces repertoires (mediatheques), sans etre executables.
	create mask = 0664
	directory mask = 0775

[data]
	; EXPOSITION ASSUMEE (#997). /data contient les sauvegardes, les
	; configurations et les rootfs des conteneurs — donc leurs secrets. Ces
	; memes chemins sont volontairement EXCLUS du module medias (#995) pour
	; eviter un chemin d'exfiltration vers une cle USB.
	;
	; L'exposition a ete demandee explicitement. Elle tient parce qu'elle est
	; cantonnee au LAN, authentifiee et chiffree — retirer l'une de ces trois
	; conditions rend ce partage indefendable.
	comment = Donnees SecuBox
	path = /data
	read only = no
	guest ok = no
	writeable = yes

; ── Partages generes : un par support REELLEMENT monte ─────────────────────
;
; POURQUOI UN PARTAGE PAR SUPPORT, ET NON UN SEUL SUR /media/secubox-media :
;
;   ksmbd NE TRAVERSE PAS les points de montage a l'interieur d'un partage.
;   Verifie sur cette board : un montage lie place sous la racine partagee
;   apparait VIDE cote client alors que son contenu existe. Un partage unique
;   sur la racine montrerait donc les noms des supports et rien dedans.
;
;   Second motif, plus grave : un point de montage NON MONTE reste un
;   repertoire ordinaire du systeme de fichiers racine. Expose en ecriture, un
;   client y deposant des fichiers croirait remplir sa cle alors qu'il
;   remplirait l'eMMC — et ses donnees ne seraient pas sur le support.
;
; `smbctl sync-shares` regenere le bloc ci-dessous a partir des montages
; reels. Ne pas editer a la main : tout ce qui suit le marqueur est ecrase.

; >>> SECUBOX-SMB AUTO-SHARES >>>
; <<< SECUBOX-SMB AUTO-SHARES <<<
