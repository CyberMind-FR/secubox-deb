  SecuBox #1264 — vue MICRO de SocialRelay : la carte que le service sert
  lui-même. Même raison que MetaNews : une passerelle qui agrège plusieurs
  réseaux n'est pas visible dans un post figé, elle l'est dans le défilement.
  On tourne, et chaque tour dit AUSSI de quel réseau vient ce qu'on lit.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SocialRelay — vue micro</title>
<style>
  :root { --fond:#ffffff; --texte:#1a1a22; --muted:#6b6b7a; --border:#e2e2ea; --accent:#1f7a58; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --fond:#14141c; --texte:#e8e6d9; --muted:#8a8a99;
      --border:#2a2a36; --accent:#4fc38f; }
  }
  :root[data-theme="dark"] { --fond:#14141c; --texte:#e8e6d9; --muted:#8a8a99;
    --border:#2a2a36; --accent:#4fc38f; }

  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; scrollbar-width:none; }
  html::-webkit-scrollbar, body::-webkit-scrollbar { width:0; display:none; }
  body { background:var(--fond); color:var(--texte);
         font-family:"Inter",system-ui,sans-serif; font-size:14px; line-height:1.45; }

  .mw { display:flex; flex-direction:column; height:100%; padding:.6rem .7rem; gap:.4rem; }
  .tete { display:flex; align-items:baseline; gap:.4rem; }
  .tete .ic { font-size:1rem; }
  .tete b { font-size:.88rem; }
  .tete .n { margin-left:auto; font-size:.56rem; letter-spacing:.08em;
             text-transform:uppercase; color:var(--muted); font-variant-numeric:tabular-nums; }

  /* LE MEDIA REMPLIT LA CARTE (#1285). Une vignette de 56 px a cote d'un texte,
     c'est un timbre-poste : on ne distingue ni le visage ni la scene, et
     l'image n'apprend rien. Elle occupe donc le fond, le texte passe par
     dessus — c'est ainsi qu'un reseau social se lit, et c'est deja ce que fait
     MetaNews. Sans image, le degrade prend sa place plutot qu'un rectangle
     vide. */
  .une { position:relative; display:block; height:104px; border-radius:10px;
         overflow:hidden; text-decoration:none; color:inherit; flex:0 0 auto;
         background:linear-gradient(135deg,var(--accent),var(--border)); }
  .une .vign { position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
               display:block; transition:opacity .35s ease; }
  .une .vign.cache { display:none; }
  /* UNE VIDÉO A UNE PREMIÈRE IMAGE (#1313). L'ignorer parce qu'elle n'est pas
     un fichier image laissait un dégradé nu là où le post montrait quelque
     chose. On la pose SANS la lire — `preload="metadata"` donne la vignette,
     rien de plus : une carte ne démarre pas une vidéo sans qu'on le demande. */
  .une video.vign { object-fit:cover; }
  .une .film { position:absolute; top:6px; left:6px; width:22px; height:22px;
               border-radius:50%; display:grid; place-items:center; font-size:.62rem;
               background:rgba(0,0,0,.62); color:#fff; }
  /* Plusieurs médias : des points, pas des flèches. On ne pilote pas un
     diaporama depuis une vignette de 250 px — on dit seulement qu'il y en a
     d'autres, et lesquels sont passés. */
  .une .points { position:absolute; top:8px; right:8px; display:flex; gap:3px; }
  .une .points i { width:5px; height:5px; border-radius:50%;
                   background:rgba(255,255,255,.42); }
  .une .points i.on { background:#fff; }
  .une .voile { position:absolute; inset:auto 0 0 0; padding:.35rem .45rem .3rem;
                background:linear-gradient(transparent, rgba(0,0,0,.86)); color:#fff; }
  .une .qui { display:flex; align-items:baseline; gap:.3rem; font-size:.6rem;
              color:rgba(255,255,255,.82); }
  .une .res { font-weight:650; }
  .une .cps { font-size:.75rem; line-height:1.25; margin-top:.08rem; color:#fff;
              display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }

  .top { display:flex; flex-direction:column; gap:.1rem; }
  .top .tt { font-size:.55rem; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); }
  .top a { display:flex; align-items:baseline; gap:.34rem; font-size:.69rem; line-height:1.3;
           color:var(--texte); text-decoration:none; }
  .top a:hover .nm { text-decoration:underline; color:var(--accent); }
  .top .rs { flex:0 0 auto; font-size:.72rem; }
  .top .nm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; flex:1; }
  .top .dt { flex:0 0 auto; font-size:.58rem; color:var(--muted); font-variant-numeric:tabular-nums; }

  .pied { margin-top:auto; display:flex; align-items:center; gap:6px; padding-top:.3rem;
          border-top:1px solid var(--border); font-size:.57rem; letter-spacing:.07em;
          text-transform:uppercase; color:var(--muted); text-decoration:none; }
  .pied .grow { flex:1; }
  .pied:hover { color:var(--accent); }
  .pouls { width:5px; height:5px; border-radius:50%; background:var(--accent);
           animation:bat 2.4s ease-in-out infinite; }
  @keyframes bat { 0%,100%{opacity:.28} 50%{opacity:1} }
  @media (prefers-reduced-motion: reduce) { .pouls { animation:none; opacity:.7 } }
  .vide { font-size:.72rem; color:var(--muted); }
</style>

<div class="mw">
  <div class="tete"><span class="ic">🔄</span><b>SocialRelay</b><span class="n" id="n">…</span></div>

  <a class="une" id="une" href="/" target="_top">
    <span id="une-media"></span>
    <span class="voile">
      <span class="qui"><span class="res" id="une-res"></span><span id="une-a"></span>
        <span id="une-d"></span></span>
      <span class="cps" id="une-c">lecture du relais…</span>
    </span>
  </a>

  <div class="top" id="top"><div class="tt">↻ en rotation</div></div>

  <a class="pied" href="/" target="_top"><span class="pouls" id="pouls"></span>
    <span>passerelle sociale</span><span class="grow"></span><span id="rang"></span></a>
</div>

<script>
(function () {
  "use strict";
  // CINQ, PAS VINGT (#1285). Une carte qui parcourt vingt billets met deux
  // minutes a revenir au premier : on ne verrait jamais deux fois la meme
  // chose, et rien ne s'imprimerait. Les cinq derniers tournent en trente-cinq
  // secondes — c'est un carrousel, pas un archivage.
  var API = '/api/v1/socialrelay/feed?limit=5';
  var posts = [], i = 0, enPause = false;

  var ICONE = { mastodon:'🐘', facebook:'📘', bluesky:'🦋', x:'✖️', instagram:'📸', rss:'📰' };
  var esc = function (t) {
    return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) {
      return ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' })[c];
    });
  };
  var el = function (id) { return document.getElementById(id); };

  function depuis(sec) {
    var s = Math.max(0, Date.now() / 1000 - Number(sec || 0));
    if (s < 3600) return Math.round(s / 60) + ' min';
    if (s < 86400) return Math.round(s / 3600) + ' h';
    return Math.round(s / 86400) + ' j';
  }
  // TOUS LES MÉDIAS, pas seulement les images. Une vidéo a une première image
  // et vaut donc d'être montrée ; c'est le <img> qui ne savait pas la lire, pas
  // le post qui n'avait rien à donner.
  function medias(p) {
    return (p.medias || []).filter(function (x) { return x && x.url; });
  }

  var glisse = null;   // rotation des médias À L'INTÉRIEUR d'un post

  function poseMedia(p) {
    var z = el('une-media'), l = medias(p), k = 0;
    if (glisse) { clearInterval(glisse); glisse = null; }
    if (!l.length) { z.innerHTML = ''; return; }

    function pose(n) {
      var m = l[n % l.length];
      var pts = l.length > 1
        ? '<span class="points">' + l.map(function (_, j) {
            return '<i class="' + (j === (n % l.length) ? 'on' : '') + '"></i>';
          }).join('') + '</span>'
        : '';
      if (m.kind === 'video') {
        // `muted` ET `preload="metadata"` : on veut l'image, jamais le son ni
        // le téléchargement du fichier entier dans une vignette.
        z.innerHTML = '<video class="vign" muted playsinline preload="metadata" '
          + 'src="' + esc(m.url) + '#t=0.1"></video>'
          + '<span class="film">▶</span>' + pts;
      } else {
        z.innerHTML = '<img class="vign" alt="" src="' + esc(m.url) + '">' + pts;
      }
    }
    pose(0);
    // Plus court que la rotation des posts : on doit voir les deux images d'un
    // même post avant qu'il ne cède la place au suivant.
    if (l.length > 1) glisse = setInterval(function () { pose(++k); }, 2600);
  }
  function texte(p) {
    return String(p.text || '').replace(/\s+/g, ' ').trim() || '(sans texte)';
  }

  function montre() {
    if (!posts.length) return;
    var p = posts[i % posts.length];
    poseMedia(p);
    el('une').href = p.url || '/';
    el('une-res').textContent = (ICONE[p.network] || '🌐') + ' ' + (p.network || '');
    el('une-a').textContent = '· ' + (p.author || '');
    el('une-d').textContent = '· ' + depuis(p.published_at);
    el('une-c').textContent = texte(p);

    var suite = [], k;
    for (k = 1; k <= 3 && k < posts.length; k++) suite.push(posts[(i + k) % posts.length]);
    el('top').innerHTML = '<div class="tt">↻ en rotation</div>' + suite.map(function (q) {
      return '<a href="' + esc(q.url || '/') + '" target="_top" title="' + esc(texte(q)) + '">'
        + '<span class="rs">' + (ICONE[q.network] || '🌐') + '</span>'
        + '<span class="nm">' + esc(texte(q)) + '</span>'
        + '<span class="dt">' + esc(depuis(q.published_at)) + '</span></a>';
    }).join('');
    el('rang').textContent = ((i % posts.length) + 1) + '/' + posts.length;
  }

  document.addEventListener('mouseenter', function () { enPause = true; }, true);
  document.addEventListener('mouseleave', function () { enPause = false; }, true);

  function charge() {
    fetch(API, { headers: { 'Accept': 'application/json' } })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        posts = (d && d.posts) || [];
        el('n').textContent = posts.length ? posts.length + ' billets' : '';
        if (!posts.length) {
          el('une-c').textContent = 'Aucun billet relayé';
          el('pouls').style.animation = 'none';
          return;
        }
        montre();
      })
      .catch(function () { el('une-c').textContent = 'SocialRelay injoignable'; });
  }

  charge();
  setInterval(function () { if (!enPause && posts.length) { i++; montre(); } }, 7000);
  setInterval(charge, 300000);

  (function () {
    var t = new URLSearchParams(location.search).get('theme');
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
  })();

  // RESTER DANS LE HALL (#1266). Un lien de cardlet en target="_top" REMPLACE
  // le Hall par le service : on perd la mosaique, la barre media et tout ce
  // qui joue. Encadre, on demande donc au Hall d'embarquer la page ; hors
  // cadre, le lien fonctionne normalement — la carte reste une page valide,
  // et c'est ce repli qui autorise a garder target="_top" dans le HTML.
  document.addEventListener('click', function (ev) {
    if (parent === window) return;
    var a = ev.target && ev.target.closest ? ev.target.closest('a[href]') : null;
    if (!a || ev.defaultPrevented || ev.button !== 0 || ev.metaKey || ev.ctrlKey) return;
    ev.preventDefault();
    try { parent.postMessage({ sbx: 'ouvre', id: 'socialrelay', url: a.href }, '*'); } catch (e) {}
  }, true);

  addEventListener('message', function (ev) {
    var d = ev.data;
    if (!d || d.sbx !== 'theme') return;
    if (d.theme === 'dark' || d.theme === 'light') {
      document.documentElement.setAttribute('data-theme', d.theme);
    }
  });
})();
</script>
