# /etc/nginx/secubox.d/spiderfoot.conf
# Installed by secubox-spiderfoot — auto-registered on install, removed on purge
#
# Every location is auth-gated with the shared SecuBox auth stub
# (`/__sbx_auth_verify` + `@sbx_auth_login`, shipped by secubox-hub's
# zz-sbx-authgate.conf: LAN clients pass, everything else denied — default-deny
# CSPN posture). SpiderFoot has NO native auth, so gating the UI proxy here is
# the ONLY thing standing between the browser and a live OSINT tool — it must
# match the peer pattern (fmrelay/grafana/lyrion).

# Management panel (this module's own static WebUI)
location = /spiderfoot/ {
    auth_request /__sbx_auth_verify;
    error_page 401 = @sbx_auth_login;
    alias /usr/share/secubox/www/spiderfoot/;
    index index.html;
    try_files $uri $uri/ /spiderfoot/index.html;
}
location /spiderfoot/ {
    auth_request /__sbx_auth_verify;
    error_page 401 = @sbx_auth_login;
    alias /usr/share/secubox/www/spiderfoot/;
    index index.html;
    try_files $uri $uri/ /spiderfoot/index.html;
}

# Lifecycle API (unix socket, aggregator-served). JWT-gated in the app AND
# auth-gated here.
location /api/v1/spiderfoot/ {
    auth_request /__sbx_auth_verify;
    error_page 401 = @sbx_auth_login;
    proxy_pass http://unix:/run/secubox/spiderfoot.sock:/;
    include /etc/nginx/snippets/secubox-proxy.conf;
}

# SpiderFoot's OWN web UI + REST — reverse-proxied to the container LAN IP.
# The UI is reachable ONLY through this auth-gated location; SpiderFoot is
# NEVER bound to a host port (see spiderfootctl: `sf.py -l <ip>:<port>`).
#
# DEPLOY NOTE: SpiderFoot generates ABSOLUTE URLs for its own assets/links, so
# serving it under a stripped subpath (/spiderfoot-ui/ -> /) may need adjusting
# at deploy time — either configure SpiderFoot's own root/base path (its `-l`
# / config supports a URL prefix) or front it on a dedicated subdomain. This
# location is the validated BASELINE; the exact subpath rewrite is VALIDATED
# AT DEPLOY.
location /spiderfoot-ui/ {
    auth_request /__sbx_auth_verify;
    error_page 401 = @sbx_auth_login;
    proxy_pass http://10.100.0.43:5001/;
    include /etc/nginx/snippets/secubox-proxy.conf;
    proxy_read_timeout 300s;
}
