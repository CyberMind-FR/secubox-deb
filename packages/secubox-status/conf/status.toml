# SecuBox Status Live v2 — /etc/secubox/status.toml (#3605). Valeurs absentes = défauts du paquet.

[status]
# Identifiant d'affichage (vide = nom court de la machine). L'identité réelle viendra du DID (jalon 2).
node_id = ""
node_role = "agent"        # « aggregator » sur la seule box qui rassemble la flotte (gk2)

[history]
retention_days = 90

[sources.vhosts]
enabled = true
path = "/var/cache/secubox/health/status.json"
stale_after_seconds = 300

[sources.modules]
enabled = true
path = "/var/cache/secubox/health/modules.json"
stale_after_seconds = 300

[sources.profiles]
enabled = true
path = "/var/lib/secubox/profiles/validation/releve.json"
stale_after_seconds = 900

[public]
expose_resources = false
expose_module_inventory = false
