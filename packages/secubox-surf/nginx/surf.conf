# SecuBox Surf — POC de relais MITM (hors chaine d'inspection).
#
# HAProxy route toute origine `surf-*.<domaine>` ici en BYPASS (jamais
# l'inspection : ce serveur relaie du contenu externe, possiblement hostile).
# nginx la passe telle quelle au serveur ASGI, qui lit l'hote CIBLE dans l'en-
# tete Host — c'est ce Host, une origine par site, qui fait l'isolation.
server {
    listen 9080;
    # Regex : toutes les origines par-site du relais, en un seul bloc. Un seul
    # label `surf-<site aplati>` sous le domaine de CETTE box, quel qu'il soit
    # (#3117) — aucun nom propre à une box n'est livré. Les noms exacts et les
    # jokers des autres vhosts passent avant toute regex.
    server_name ~^surf-[^.]+\..+$;

    # Le corps peut etre un televersement ; on ne borne pas ici, le serveur le
    # fait. Les reponses relayees peuvent etre volumineuses (pages de 1 Mo+).
    client_max_body_size 64m;
    proxy_buffering off;

    location / {
        proxy_pass http://unix:/run/secubox/surf.sock;
        # LE HOST EST TRANSMIS TEL QUEL — c'est lui qui nomme la cible. Le
        # reecrire romprait tout le mecanisme.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        # COPIE CARBONE (#1235) : un rendu headless d'article lourd prend ~50s
        # sur arm64 ; 30s coupaient avant (504). On laisse jusqu'a 120s.
        proxy_read_timeout 120s;
        proxy_connect_timeout 30s;
    }
}
