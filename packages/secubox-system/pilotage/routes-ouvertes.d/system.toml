# Écritures ouvertes au porteur délégué du pilotage (#3126, L5 ; R-L5-12, #3279 en version minimale).
# Installé dans /usr/share/secubox/pilotage/routes-ouvertes.d/system.toml (root, 0644). Seules les écritures que
# les pages du module appellent : www/system/index.html (actions rapides, paquets, réglages, kiosque, carte) et
# la vue portée system-hub (diagnostics, planification des sauvegardes). Les sessions restent refusées par la
# liste de refus de secubox_core.auth ; restore_config n'est pas ouverte.

[[routes]]
methodes = ["POST"]
chemins = [
    "^/service_control$",
    "^/restart_services$",
    "^/reload_firewall$",
    "^/sync_time$",
    "^/clear_cache$",
    "^/backup$",
    "^/reboot$",
    "^/shutdown$",
    "^/apply_updates$",
    "^/settings$",
    "^/kiosk/(enable|disable)$",
    "^/board/detect$",
    "^/delete_diagnostic$",
    "^/set_backup_schedule$",
]
