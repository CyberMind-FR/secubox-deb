# #3002 — demandes de mise a jour apt : ecrites par l'API (secubox), drainees par secubox-maj.service (root).
d /run/secubox/system      0775 secubox secubox -
d /run/secubox/system/maj  0775 secubox secubox -
d /var/lib/secubox/system  0755 root    root    -
# #3401 : demandes d'acces SSH (deposees par l'API, drainees par secubox-ssh.service) et leurs resultats
d /run/secubox/system/ssh            0770 secubox secubox -
d /run/secubox/system/ssh-resultats  0770 secubox secubox -
