# Cache des CDN statiques de sbxmitm (#2804). Le parent /var/cache/secubox reste 0755 (partagé) ; le moteur ne l'utilise que si une instance l'active
# (toolbox-ng-worker-N.env). Vidable à tout moment : ce n'est qu'un cache.
d /var/cache/secubox     0755 -               -       - -
d /var/cache/secubox/cdn 0755 secubox-toolbox secubox - -
