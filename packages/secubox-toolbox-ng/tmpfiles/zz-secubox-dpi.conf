# SecuBox-Deb :: sbxdpi state dirs
#
# Le snapshot DPI vit sur le SSD /data (916 Go), JAMAIS sur l'eMMC racine
# (15 Go — un gros fichier la remplit et fait tomber SQLite des autres modules).
# Il est PETIT (cartes plafonnées, ~10-30 Ko) et réécrit atomiquement. On crée
# /data/secubox/sbxdpi au bon propriétaire (secubox-toolbox) sans toucher au
# parent partagé /data/secubox (tenu par secubox). Aussi le dossier des sockets
# nDPIsrvd, /run/secubox/ndpi (tmpfs).
d /data/secubox/sbxdpi 0750 secubox-toolbox secubox-toolbox - -
d /run/secubox/ndpi 0755 secubox-toolbox secubox-toolbox - -
# SBX TV Privacy lot 4 (#3374) : agrégat par appareil (cibles d'ad-guard seulement), lu par ad-guard (groupe secubox, setgid).
d /run/secubox/sbxdpi 2750 secubox-toolbox secubox - -
# Lot 4 (#3374) passe 3 : cibles de sbxdpi, écrites par root seul (secubox-adguard-tv dpi-cibles), lues par sbxdpi. Parent /run/secubox
# est root:root (secubox-core) : pas de « unsafe path transition ».
d /run/secubox/sbxdpi-cibles 0750 root secubox-toolbox - -
