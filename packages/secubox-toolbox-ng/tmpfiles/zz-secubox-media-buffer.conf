# SecuBox-Deb :: toolbox-ng R4 media buffer (#812)
#
# Rolling on-disk store for whole-file media capture (mediabuffer.go) — feature
# flagged OFF by default (--media-buffer=false / SBX_MEDIA_BUFFER_ARGS unset in
# the worker's env file, see secubox-toolbox-ng-worker@.service). The directory
# is pre-created regardless so an operator can flip the flag on without a
# manual mkdir/chown step.
#
# Ownership reconciles two different service users (see project_etc_secubox_traversal):
#   WRITER = sbxmitm workers run as  secubox-toolbox  (worker@.service User=)
#   READER = secubox-dpi / aggregator run as  secubox
# The dir is owned by the writer (secubox-toolbox) with the reader's group
# (secubox), mode 2750: writer=rwx, reader-group=r-x, world=none (media bytes may
# be personal/sensitive — never world-readable). The SETGID bit (leading 2) makes
# every session subdir + object file + metatag log the writer creates INHERIT
# group `secubox`, so the 0640/0750 objects stay group-readable by the dpi reader.
# Without setgid the writer (not a member of group secubox) gets EACCES on every
# capture and the feature silently no-ops (errors are swallowed by design).
# The parent /data/secubox stays 0755 so sibling packages can create subdirs.
# zz- prefix: sort AFTER any base /data or /data/secubox creator.
d /data/secubox              0755 secubox         secubox - -
d /data/secubox/media-buffer 2750 secubox-toolbox secubox - -
