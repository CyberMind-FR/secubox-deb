# SecuBox-Deb :: toolbox-ng R4 media buffer (#812)
#
# Rolling on-disk store for whole-file media capture (mediabuffer.go) — feature
# flagged OFF by default (--media-buffer=false / SBX_MEDIA_BUFFER_ARGS unset in
# the worker's env file, see secubox-toolbox-ng-worker@.service). The directory
# is pre-created regardless so an operator can flip the flag on without a
# manual mkdir/chown step. 0750 secubox:secubox — never world-readable (media
# bytes may be personal/sensitive); the parent /data/secubox is 0755 so
# sibling packages can create their own subdirs there.
# zz- prefix: sort AFTER any base /data or /data/secubox creator.
d /data/secubox              0755 secubox secubox - -
d /data/secubox/media-buffer 0750 secubox secubox - -
