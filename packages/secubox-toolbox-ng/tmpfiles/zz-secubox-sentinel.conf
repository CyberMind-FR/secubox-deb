# SecuBox-Deb :: sbx-sentinel state dirs (#823)
#
# Pre-create the Sentinel verdict-store + live-feed overlay dirs owned by the
# daemon/feeds user (secubox-toolbox) so the bbolt store and the atomic overlay
# swaps work the moment the units are enabled — no manual mkdir at cutover.
# zz- prefix: sort AFTER any base /var/lib/secubox creator; the parent stays
# whatever the base owns (never re-chowned here — see project memory on the
# /var/lib/secubox 0755 traversal constraint).
d /var/lib/secubox/sentinel 0750 secubox-toolbox secubox-toolbox - -
d /var/lib/secubox/sentinel/overlay 0750 secubox-toolbox secubox-toolbox - -
