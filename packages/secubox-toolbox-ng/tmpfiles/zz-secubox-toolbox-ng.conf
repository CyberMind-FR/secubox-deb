# SecuBox-Deb :: toolbox-ng media reverse-catcher (#736)
# The catcher runs as secubox-toolbox and APPENDS here; mediaflow runs as secubox
# and READS it (as "other", 0644). Pre-create the file owned by the WRITER so a
# stale wrong-owner file left in the sticky /run/secubox by a previous boot can't
# make the worker's append silently fail (O_APPEND on a file it doesn't own ->
# permission denied -> the catcher disables itself). /run is tmpfs, so this also
# guarantees a clean, correctly-owned file every boot.
#
# The parent is the canonical 1777 root:root sticky runtime dir; declared here too
# so this entry never races ahead of whoever else creates it (idempotent).
# zz- prefix: sort AFTER any base /run/secubox creator.
d /run/secubox 1777 root root - -
f /run/secubox/media-catch.jsonl 0644 secubox-toolbox secubox-toolbox - -
