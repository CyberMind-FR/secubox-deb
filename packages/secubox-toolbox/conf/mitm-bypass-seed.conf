# SecuBox ToolBoX :: Anti-Track v2 (#633) cert-pinned bypass SEED (package-owned).
# TLS passthrough (NOT decrypted) — required for apps with cert pinning / E2E.
# This is the package default; operator additions go in mitm-bypass.conf,
# auto-learned hosts in mitm-bypass-dynamic.conf. All three are merged into
# ignore_hosts by secubox-toolbox-mitm-wg-launch. Regex, one per line, # comments.

# Signal — pinned certs, E2E
(.+\.)?signal\.org
(.+\.)?signal\.com

# WhatsApp — cert pinning
(.+\.)?whatsapp\.net
(.+\.)?whatsapp\.com

# Telegram — pinned + custom protocols
(.+\.)?telegram\.org
(.+\.)?telegram\.me

# Apple Push / iMessage / FaceTime — pinned
(.+\.)?push\.apple\.com
(.+\.)?gateway\.icloud\.com
(.+\.)?apple-cloudkit\.com

# Bank apps (common French banks) — pinned + ANSSI requirement
(.+\.)?bnpparibas\.net
(.+\.)?creditmutuel\.fr
(.+\.)?ca-.*\.fr
(.+\.)?banquepopulaire\.fr
(.+\.)?caisse-epargne\.fr
(.+\.)?societegenerale\.fr

# Google Play Services & GMS APIs — cert pinning via Network Security Config
# Android apps using google-services pin the Google CA; user-installed CAs
# are rejected → handshake fail. Whitelist = passthrough (opaque to mitm).
(.+\.)?googleapis\.com
(.+\.)?google-analytics\.com
(.+\.)?gstatic\.com
(.+\.)?googleusercontent\.com
android\.clients\.google\.com

# Meta/Facebook stack — pinned by FB/Instagram/WhatsApp/Messenger
(.+\.)?facebook\.com
(.+\.)?facebook\.net
(.+\.)?fbcdn\.net
(.+\.)?instagram\.com

# Phase 6.M (#496) : pinned device telemetry + ad networks (Chrome
# retry storms — silently 100+ failures/min before whitelist added)
(.+\.)?miui\.com
(.+\.)?xiaomi\.com
(.+\.)?socdm\.com
(.+\.)?adform\.net
(.+\.)?rubiconproject\.com
(.+\.)?smartadserver\.com
(.+\.)?indexww\.com
(.+\.)?spot\.im
(.+\.)?fwmrm\.net
(.+\.)?amazon-adsystem\.com
(.+\.)?wct-[0-9]+\.com
(.+\.)?trustpilot\.com
iphone-ld\.apple\.com
