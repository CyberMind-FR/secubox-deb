# ── pinned-API endpoints : NOT media, but MUST pass through ────────────────────
# Programmatic API clients that certificate-PIN (or skip the system trust store)
# reject our MITM CA and break entirely. These are JSON APIs, never HTML browse
# pages, so splicing them blinds the MITM to nothing the user actually reads.
# (claude.ai web is deliberately NOT here — the browser trusts our CA, so it is
# MITM'd normally and still gets the transparency banner.)
api.anthropic.com    # Claude API (Claude Code / SDK clients cert-pin → must splice)
