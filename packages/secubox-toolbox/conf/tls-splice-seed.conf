# SecuBox toolbox :: SNI-splice seed (#649, R4 doctrine #736)
#
# R4 / ANALYST doctrine: MITM EVERYTHING by default — the transparency banner
# and the media reverse-catcher need to see every flow, and performance is
# explicitly secondary to visibility. So this list is NO LONGER a performance
# media-passthrough list. It now holds ONLY hosts that genuinely BREAK under
# MITM (certificate pinning / non-standard TLS), where splicing is the only way
# they work at all. "Only effective splicing is applied."
#
# Suffix-matched (subdomains included). One host suffix per line.
# Add a host here ONLY when MITM provably breaks it (hard TLS failure), never
# for speed. Everything else is decrypted so it gets the banner + URL capture.
#
# ── pinned-API / MITM-incompatible endpoints ─────────────────────────────────
anthropic.com        # Claude API + Claude Code/SDK (api/s-cdn/statsig subdomains all cert-pin → whole domain must splice)
claude.ai            # Claude web app — cert-pinned
openai.com           # ChatGPT app/API + auth + assets (api/ios/chat/auth/cdn) — native app cert-pins
chatgpt.com          # ChatGPT web/app primary domain — cert-pinned
oaistatic.com        # ChatGPT static-assets shard — cert-pinned
oaiusercontent.com   # ChatGPT user-content shard — cert-pinned
