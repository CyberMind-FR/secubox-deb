  # ───────────── Government FR (sensitive citizen data) ─────────────
  - pattern: "*.service-public.fr"
    reason: "French government services, MITM forbidden"
    category: government
    quality_expected: A
  - pattern: "*.impots.gouv.fr"
    reason: "French tax service, MITM forbidden"
