# SecuBox Toolbox — backend HAProxy `toolbox_landing` (#986).
#
# Installé dans /etc/haproxy/cfg.d/, que `haproxyctl generate` concatène à la
# configuration produite. Empaqueté ici plutôt que dans secubox-haproxy parce
# que c'est le portail toolbox qu'il sert : le paquet qui fournit le service
# déclare sa propre route.
#
# Ce backend n'existait QUE dans le haproxy.cfg vivant de la board, ajouté à la
# main. C'est l'une des deux entrées qui bloquaient la garde anti-dérive et
# rendaient inerte toute modification de haproxy.toml — une régénération
# réussie l'aurait supprimé, et le vhost kbin.gk2.secubox.in serait tombé.
#
# Sert kbin.gk2.secubox.in : réécrit / -> /landing, les autres chemins passent
# tels quels.
backend toolbox_landing
    mode http
    # Rewrite / -> /landing for the kbin vhost (other paths pass through)
    http-request replace-path ^/$ /landing
    timeout server 10s
    server toolbox 10.99.0.1:8088 check
