# Garde d'administration toolbox (#1783), incluse par chaque route d'admin de
# toolbox.conf. L'en-tête de garde n'est posé qu'APRÈS auth_request : sans
# administrateur réel, la requête n'atteint jamais l'application. Le snippet du
# jeton (secubox-toolbox-garde.conf) est écrit par le postinst, lisible de root
# seul ; absent, l'include ne charge rien et l'application refuse tout.
auth_request /__sbx_toolbox_admin;
limit_req zone=sbx_toolbox_admin burst=40 nodelay;
limit_req_status 429;
include /etc/nginx/snippets/secubox-proxy.conf;
include /etc/nginx/snippets/secubox-toolbox-garde*.conf;
proxy_intercept_errors on;
