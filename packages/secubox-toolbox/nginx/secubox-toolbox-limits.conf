# Phase 7 (#498) — rate-limit zone for the toolbox admin dashboard.
#
# Goes in nginx http context (/etc/nginx/conf.d/) so the zone is
# declared once and the per-location limit_req can reference it.
# Defends against runaway browser tabs / accidentally-stacked
# setInterval timers that turn refreshAll() into 100+ hits/sec.

limit_req_zone $binary_remote_addr zone=sbx_toolbox_admin:10m rate=20r/s;
