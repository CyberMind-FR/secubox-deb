# SecuBox ToolBoX nginx route — #475 + Phase 7 (#498) rate-limit.
#
# /admin/* gets a per-IP rate-limit (20 r/s, burst 40 nodelay) so a
# misbehaving dashboard tab can't drag the aggregator under. The
# captive-portal-facing /api/v1/toolbox/ path stays unrestricted.
location ^~ /api/v1/toolbox/admin/ {
    limit_req zone=sbx_toolbox_admin burst=40 nodelay;
    limit_req_status 429;
    proxy_pass http://10.99.0.1:8088/admin/;
    include /etc/nginx/snippets/secubox-proxy.conf;
    proxy_intercept_errors on;
}
location ^~ /api/v1/toolbox/ {
    proxy_pass http://10.99.0.1:8088/;
    include /etc/nginx/snippets/secubox-proxy.conf;
    proxy_intercept_errors on;
}
location ^~ /toolbox/ {
    alias /usr/share/secubox/www/toolbox/;
    index index.html;
    try_files $uri $uri/ =404;
}
