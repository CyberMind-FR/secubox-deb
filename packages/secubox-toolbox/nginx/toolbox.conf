# SecuBox ToolBoX nginx route — #475 + Phase 7 (#498) rate-limit.
#
# /admin/* gets a per-IP rate-limit (20 r/s, burst 40 nodelay) so a
# misbehaving dashboard tab can't drag the aggregator under. The
# captive-portal-facing /api/v1/toolbox/ path stays unrestricted.
#
# ADMINISTRATION (#1783) : chaque route d'administration inclut
# snippets/secubox-toolbox-admin.conf — `auth_request` sur
# /auth/verify?exige=admin (administrateur réel, le prédicat de require_jwt,
# tranché par le module qui détient le secret JWT : toolbox tourne sous son
# propre compte et ne le lit pas), puis l'en-tête de garde que l'application
# exige sur ces routes. Les routes hors /admin/ sont en correspondance EXACTE :
# le préfixe `^~ /api/v1/toolbox/` plus bas arrêterait toute expression
# régulière avant qu'elle soit essayée.
location = /__sbx_toolbox_admin {
    internal;
    proxy_pass http://unix:/run/secubox/aggregator.sock:/api/v1/auth/auth/verify?exige=admin;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
}
location ^~ /api/v1/toolbox/admin/ {
    include /etc/nginx/snippets/secubox-toolbox-admin.conf;
    proxy_pass http://10.99.0.1:8088/admin/;
}
location = /api/v1/toolbox/rlevel/peer {
    include /etc/nginx/snippets/secubox-toolbox-admin.conf;
    proxy_pass http://10.99.0.1:8088/rlevel/peer;
}
location = /api/v1/toolbox/rlevel/peers {
    include /etc/nginx/snippets/secubox-toolbox-admin.conf;
    proxy_pass http://10.99.0.1:8088/rlevel/peers;
}
location = /api/v1/toolbox/exit_country {
    include /etc/nginx/snippets/secubox-toolbox-admin.conf;
    proxy_pass http://10.99.0.1:8088/exit_country;
}
location = /api/v1/toolbox/vpn/client {
    include /etc/nginx/snippets/secubox-toolbox-admin.conf;
    proxy_pass http://10.99.0.1:8088/vpn/client;
}
location = /api/v1/toolbox/vpn/clients {
    include /etc/nginx/snippets/secubox-toolbox-admin.conf;
    proxy_pass http://10.99.0.1:8088/vpn/clients;
}
location = /api/v1/toolbox/tor/bridge {
    include /etc/nginx/snippets/secubox-toolbox-admin.conf;
    proxy_pass http://10.99.0.1:8088/tor/bridge;
}
location = /api/v1/toolbox/tor/bridges {
    include /etc/nginx/snippets/secubox-toolbox-admin.conf;
    proxy_pass http://10.99.0.1:8088/tor/bridges;
}
location ^~ /api/v1/toolbox/ {
    proxy_pass http://10.99.0.1:8088/;
    include /etc/nginx/snippets/secubox-proxy.conf;
    proxy_intercept_errors on;
}
location ^~ /toolbox/ {
    alias /usr/share/secubox/www/toolbox/;
    index index.html;
    try_files $uri $uri/ =404;
}
