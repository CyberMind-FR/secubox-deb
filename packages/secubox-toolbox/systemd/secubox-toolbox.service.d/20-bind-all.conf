# Phase 7 (#498) — bind captive portal on 0.0.0.0:8088 so WG R3 peers
# can reach 10.99.0.1:8088 via DNAT (their JS verification probe loads
# /qr/splash.png from that endpoint). With --host 10.99.0.1 the address
# is bound only on the wlan iface, which is often linkdown.

[Service]
ExecStart=
ExecStart=/usr/bin/python3 -m uvicorn secubox_toolbox.app:app --host 0.0.0.0 --port 8088 --workers 1 --backlog 200 --limit-concurrency 100 --log-level warning
