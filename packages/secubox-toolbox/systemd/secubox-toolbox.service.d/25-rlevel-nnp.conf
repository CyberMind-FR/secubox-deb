# rlevel-per-peer : le portail délègue les mutations R-level à
# /usr/sbin/sbxmitm-policyctl via `sudo -n` (sudoers scopé à 5 verbes figés).
# NoNewPrivileges=true (durcissement du portail public) empêche tout sudo →
# le contrôle R-level par webui échoue. On le lève ICI : le blast-radius reste
# borné par le sudoers (aucune commande arbitraire, 5 verbes pinnés), aligné
# sur le pattern projet webui→sudo→ctl (aggregator NNP=false).
[Service]
NoNewPrivileges=false
