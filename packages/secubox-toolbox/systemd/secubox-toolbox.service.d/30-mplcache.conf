# #785 — persistent matplotlib cache dir. The service runs as secubox-toolbox
# with HOME=/nonexistent, so without MPLCONFIGDIR matplotlib rebuilds its font
# cache in a fresh /tmp dir on EVERY process start (tens of seconds on the ARM
# board) and the first report PDF render is pathologically slow. Point it at a
# persistent, service-owned dir (created by debian/postinst) so the font cache
# is built once and reused across restarts.
[Service]
Environment=MPLCONFIGDIR=/var/cache/secubox/toolbox/mpl
