# SecuBox ToolBoX — /run state owned by the MITM worker uid (secubox-toolbox).
# The R3 sbxmitm workers (user secubox-toolbox) append media discoveries here;
# without this the file could be pre-created by another uid (secubox) → the
# workers' O_WRONLY open fails and media-catch silently drops everything (#801).
# systemd-tmpfiles-setup runs at boot BEFORE services, so the workers always
# find a writable file. World-readable so the portal reader can aggregate it.
f /run/secubox/media-catch.jsonl 0644 secubox-toolbox secubox - -
