#
# Phase 7 follow-up (#498) — answer DNS queries from wg-toolbox peers and
# from captive-AP clients. Installed at /etc/unbound/unbound.conf.d/.
#
# Without this drop-in unbound only binds 127.0.0.1:53. WG peers send
# their resolver queries to 10.99.1.1 (wg-toolbox server IP) or, on
# legacy configs, to 10.99.0.1 (captive AP — may be down). ip-transparent
# lets unbound bind to addresses whose interface isn't up yet at start.

server:
    interface: 10.99.1.1
    interface: 10.99.0.1
    ip-transparent: yes
    access-control: 10.99.0.0/16 allow
