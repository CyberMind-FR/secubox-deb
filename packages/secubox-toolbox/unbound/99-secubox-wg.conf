#
# Phase 7 follow-up (#498) — answer DNS queries from wg-toolbox peers and
# from captive-AP clients. Installed at /etc/unbound/unbound.conf.d/.
#
# Without this drop-in unbound only binds 127.0.0.1:53. WG peers send
# their resolver queries to 10.99.1.1 (wg-toolbox server IP) or, on
# legacy configs, to 10.99.0.1 (captive AP — may be down). ip-transparent
# lets unbound bind to addresses whose interface isn't up yet at start.

server:
    # LA BOUCLE LOCALE D'ABORD, ET CE N'EST PAS DECORATIF (#1294).
    #
    # Le commentaire ci-dessus dit vrai — « sans ce drop-in unbound ne lie que
    # 127.0.0.1:53 » — mais en tire la mauvaise conclusion. Dans unbound,
    # declarer `interface:` NE S'AJOUTE PAS au defaut : il le REMPLACE. Ce
    # fichier ajoutait donc les adresses WireGuard en RETIRANT la boucle
    # locale, que son auteur croyait conservee.
    #
    # Consequence, constatee en demarrant une image trixie : unbound tournait,
    # repondait sur 10.99.x et 10.100.x, et la machine elle-meme n'avait
    # AUCUNE resolution. unbound-resolvconf, qui ecrit resolv.conf, n'avait
    # rien a y pointer.
    interface: 127.0.0.1
    interface: ::1
    interface: 10.99.1.1
    interface: 10.99.0.1
    ip-transparent: yes
    access-control: 127.0.0.0/8 allow
    access-control: ::1 allow
    access-control: 10.99.0.0/16 allow
