# PAC : routage automatique .onion -> Tor. Servi en MIME PAC, LAN-only.
location = /tor.pac {
    alias /usr/share/secubox/www/tor/tor.pac;
    types { } default_type application/x-ns-proxy-autoconfig;
    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;
}

# SecuBox Tor API proxy
location /api/v1/tor/ {
    proxy_pass http://unix:/run/secubox/tor.sock:/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

# Tor web frontend
location /tor/ {
    alias /usr/share/secubox/www/tor/;
    try_files $uri $uri/ /tor/index.html;
}
