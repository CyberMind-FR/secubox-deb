# /etc/nginx/secubox-routes.d/torrent-routes.conf — Installed by secubox-torrent.
# This is the dir the deployed admin webui.conf actually includes
# (`include /etc/nginx/secubox-routes.d/*.conf;`, see common/nginx/webui.conf)
# — NOT the legacy /etc/nginx/secubox.d/ dir.
#
# torrent is LXC-native: the WebTorrent engine runs entirely inside its
# dedicated LXC (lxc/app/), there is no host-side process the aggregator
# could load. Without this file the admin panel's /api/v1/torrent/ calls
# 404 — the companion PWA vhost
# (secubox-companion/deploy/nginx-companion.conf) already proxies the same
# path, only the admin vhost was missing it.
#
# The LXC's address is static, not resolved at request time: install-lxc.sh
# assigns it to the container's veth (`lxc.net.0.ipv4.address = $LXC_IP/24`,
# default 10.100.0.160, overridable via SECUBOX_LXC_IP) and it is recorded as
# [lxc].ip in /etc/secubox/torrent.toml. The public vhost (nginx/torrent.conf)
# and the companion route already hardcode this same address — kept
# consistent with both here rather than introducing a third resolution
# mechanism for one more route.
location /api/v1/torrent/ {
    include /etc/nginx/snippets/secubox-proxy.conf;
    proxy_pass http://10.100.0.160:8090;
}
