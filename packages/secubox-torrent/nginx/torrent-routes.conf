# /etc/nginx/secubox-routes.d/torrent-routes.conf — Installed by secubox-torrent.
# This is the dir the deployed admin webui.conf actually includes
# (`include /etc/nginx/secubox-routes.d/*.conf;`, see common/nginx/webui.conf)
# — NOT the legacy /etc/nginx/secubox.d/ dir.
#
# L'API DU MODULE EST SUR L'HOTE, PAS DANS LE CONTENEUR. Cette route visait
# le LXC (10.100.0.160:8090), qui est `on-demand` : eteint, nginx rendait 502.
# La cardlet `quick.html?svc=torrent` du Hall interroge cette route en boucle —
# 908 requetes en 502 sur gk2 le 2026-09-22, le tiers du journal d'erreur.
#
# Le commentaire d'origine disait « no host-side process the aggregator could
# load » : c'est faux. `secubox-torrent` livre bien une API hote, montee par
# l'agregateur, et c'est LA BONNE : elle repond meme conteneur eteint
# (`/status` rend `enabled:false`) et porte `/container/{start,stop,restart,
# install}` — de quoi AFFICHER l'etat et REDEMARRER le conteneur, ce qu'un
# proxy direct vers le conteneur eteint ne pourra jamais faire.
#
# Le moteur WebTorrent lui-meme reste dans le LXC : c'est le vhost public
# (nginx/torrent.conf) qui l'expose, et lui seul a besoin de l'adresse.
# ROUTE SCINDÉE (#1773). #1322 avait tout envoyé à l'agrégateur, sur la foi
# d'une API hôte qui était alors la version Transmission/docker remise par
# une fusion : les routes du moteur (/list, /add, /files…) n'aboutissaient
# plus. Désormais :
#  - l'API hôte (état, recherche, Usenet) → agrégateur : elle répond même
#    moteur endormi, sans 502 — l'objectif de #1322 ;
#  - le reste → le moteur WebTorrent dans son LXC ; endormi, une réponse JSON
#    503 au lieu d'un 502 brut.
location ~ ^/api/v1/torrent/(health|status|recherche|sources|nzb/) {
    include /etc/nginx/snippets/secubox-proxy.conf;
    proxy_pass http://unix:/run/secubox/aggregator.sock;
}
location /api/v1/torrent/ {
    include /etc/nginx/snippets/secubox-proxy.conf;
    proxy_pass http://10.100.0.160:8090;
    proxy_intercept_errors on;
    error_page 502 504 = @torrent_endormi;
}
location @torrent_endormi {
    default_type application/json;
    return 503 '{"error": "asleep", "detail": "moteur torrent endormi ou arrêté"}';
}
