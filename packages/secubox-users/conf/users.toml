# SecuBox :: Utilisateurs (#1375)
[users]
# CRÉATION FORCÉE : les services dans lesquels tout nouvel utilisateur reçoit
# un compte, et que « Créer partout » complète. Gérés : email (boîte + webmail),
# nextcloud, peertube, gitea.
services_par_defaut = ["email", "nextcloud", "peertube"]

# Envoi d'un mot de passe provisoire à l'adresse de récupération. Vides, ces
# réglages reprennent ceux du relais de /etc/secubox/metrics.toml [rapport].
smtp_hote = ""
smtp_port = 25
expediteur = ""
