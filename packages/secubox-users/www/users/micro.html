  SBX OS #1297 — LA CARLETTE « ACCÈS », vue /micro du Hall.

  UNE SEULE CARLETTE, TROIS VISAGES. C'est le point de conception : on ne fait
  pas une carlette pour l'administrateur et une autre pour le demandeur. La même
  vignette montre à chacun ce qui le concerne, parce que c'est le MÊME sujet vu
  des deux bouts — une demande d'accès.

    ADMIN      la file : qui attend, avec quelle empreinte, accepter/refuser
    DEMANDEUR  SA demande : son empreinte à faire comparer, et où elle en est
    INCONNU    le formulaire : nom, appareil, un mot — et c'est tout

  LE VISAGE SE DÉDUIT, IL NE SE CHOISIT PAS. On interroge la file : 200 → admin.
  401/403 → on regarde si CET appareil a une demande en cours. Sinon → le
  formulaire. Aucun réglage, aucun bouton de bascule : l'écran est celui de la
  situation.

  L'EMPREINTE EST LE CŒUR DES DEUX PREMIERS VISAGES, et c'est le remplaçant du
  QR code : six groupes de quatre, affichés en chasse fixe des DEUX CÔTÉS. On
  les compare d'un regard, on ne les recopie pas.
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accès</title>
<style>
  :root {
    --fond:#0f172a; --carte:#172033; --bord:rgba(148,163,184,.22);
    --encre:#e2e8f0; --terne:#94a3b8;
    --accent:#38bdf8; --oui:#4ade80; --non:#f87171; --attente:#fbbf24;
  }
  :root:not([data-theme="dark"]) {
    --fond:#f8fafc; --carte:#fff; --bord:#e2e8f0;
    --encre:#0f172a; --terne:#64748b;
    --accent:#0284c7; --oui:#16a34a; --non:#dc2626; --attente:#b45309;
  }
  :root[data-theme="dark"] {
    --fond:#0f172a; --carte:#172033; --bord:rgba(148,163,184,.22);
    --encre:#e2e8f0; --terne:#94a3b8;
    --accent:#38bdf8; --oui:#4ade80; --non:#f87171; --attente:#fbbf24;
  }
  *{box-sizing:border-box}
  body{margin:0;padding:.8rem;background:var(--fond);color:var(--encre);
    font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
  h1{font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;
    color:var(--accent);margin:0 0 .7rem;display:flex;align-items:center;gap:.5rem}
  .compte{min-width:1.4rem;padding:.05rem .4rem;border-radius:999px;
    background:var(--attente);color:#1a1a1a;font-size:.7rem;font-weight:800;
    font-variant-numeric:tabular-nums}
  .bloc{border:1px solid var(--bord);border-radius:10px;background:var(--carte);
    padding:.65rem .75rem;margin-bottom:.6rem}
  .qui{display:flex;align-items:baseline;gap:.5rem;flex-wrap:wrap}
  .nom{font-weight:700}
  .appareil{color:var(--terne);font-size:.78rem}
  .mot{margin:.35rem 0 .5rem;font-size:.82rem;color:var(--terne);overflow-wrap:anywhere}

  /* L'EMPREINTE. Chasse fixe et chiffres tabulaires : elle se compare colonne
     par colonne avec l'écran d'en face. Le `zoom` la grossit pour le demandeur,
     qui la montre à quelqu'un — l'admin, lui, la lit sur son propre écran. */
  .empreinte{font-family:ui-monospace,"SFMono-Regular",Menlo,monospace;
    font-size:.8rem;font-variant-numeric:tabular-nums;letter-spacing:.04em;
    background:color-mix(in srgb,var(--accent) 10%,transparent);
    border:1px solid color-mix(in srgb,var(--accent) 34%,transparent);
    border-radius:6px;padding:.3rem .5rem;margin-bottom:.55rem;overflow-wrap:anywhere}
  .empreinte.zoom{font-size:1.15rem;letter-spacing:.09em;text-align:center;
    padding:.7rem .4rem;line-height:1.7}

  .gestes{display:flex;gap:.4rem;flex-wrap:wrap}
  button{flex:1 1 auto;min-width:5.5rem;padding:.42rem .6rem;border-radius:8px;
    border:1px solid var(--bord);background:transparent;color:var(--encre);
    font:inherit;font-size:.8rem;cursor:pointer}
  button:hover{border-color:var(--accent)}
  button.oui{color:var(--oui);border-color:color-mix(in srgb,var(--oui) 50%,transparent)}
  button.non{color:var(--non);border-color:color-mix(in srgb,var(--non) 50%,transparent)}
  button.fort{background:color-mix(in srgb,var(--accent) 16%,transparent);
    border-color:var(--accent);color:var(--accent);font-weight:600}
  button[disabled]{opacity:.5;cursor:progress}

  label{display:block;font-size:.72rem;color:var(--terne);margin:.5rem 0 .15rem}
  input,textarea{width:100%;padding:.42rem .55rem;border-radius:8px;
    border:1px solid var(--bord);background:var(--fond);color:var(--encre);
    font:inherit;font-size:.82rem}
  textarea{resize:vertical;min-height:3.2rem}

  .etat{display:inline-flex;align-items:center;gap:.4rem;font-size:.76rem;
    font-weight:700;padding:.2rem .55rem;border-radius:999px;
    border:1px solid currentColor}
  .etat.en_attente{color:var(--attente)}
  .etat.acceptee{color:var(--oui)}
  .etat.refusee,.etat.expiree{color:var(--non)}

  .repos,.erreur{color:var(--terne);font-size:.82rem;padding:.9rem .2rem}
  .erreur{color:var(--non)}
  .aide{font-size:.74rem;color:var(--terne);margin:.4rem 0 0;line-height:1.4}
</style>
</head>
<body>

<h1 id="titre">🎟️ Accès <span class="compte" id="compte" hidden>0</span></h1>
<div id="vue"><div class="repos">Chargement…</div></div>

<script>
const API = '/api/v1/users';
const CLE_LOCALE = 'sbxos.invitation';   // { did, jeton } de CET appareil

function jeton(){ try{ return localStorage.getItem('sbx_token')||''; }catch(e){ return ''; } }
function entetes(sup){ var h=sup||{}; var j=jeton(); if(j) h['Authorization']='Bearer '+j; return h; }
function $(id){ return document.getElementById(id); }
function vue(){ return $('vue'); }

function mienne(){
  try{ return JSON.parse(localStorage.getItem(CLE_LOCALE)||'null'); }catch(e){ return null; }
}
function retiens(d){
  try{ localStorage.setItem(CLE_LOCALE, JSON.stringify(d)); }catch(e){}
}

// ── Fabrique d'éléments ──────────────────────────────────────────────────────
// `textContent` partout : nom et message sont saisis par un inconnu. Les
// traiter comme du TEXTE est ce qui rend l'insertion sûre sans avoir à
// échapper quoi que ce soit.
function el(balise, classe, texte){
  var e = document.createElement(balise);
  if (classe) e.className = classe;
  if (texte != null) e.textContent = texte;
  return e;
}
function bouton(texte, classe, action){
  var b = el('button', classe, texte);
  b.onclick = function(){
    b.disabled = true;
    Promise.resolve(action()).then(decide).catch(function(e){
      b.disabled = false; annonce(e.message);
    });
  };
  return b;
}
function annonce(texte, classe){
  vue().textContent = '';
  vue().appendChild(el('div', classe || 'erreur', texte));
}

// ── VISAGE 1 — l'administrateur voit la file ────────────────────────────────

function rendFile(liste){
  $('compte').hidden = liste.length === 0;
  $('compte').textContent = String(liste.length);
  if (!liste.length){ annonce('Aucune demande en attente.', 'repos'); return; }

  vue().textContent = '';
  liste.forEach(function(d){
    var b = el('div','bloc');
    var q = el('div','qui');
    q.appendChild(el('span','nom', d.nom || '(sans nom)'));
    q.appendChild(el('span','appareil', d.appareil || 'appareil inconnu'));
    b.appendChild(q);
    if (d.message) b.appendChild(el('div','mot','« ' + d.message + ' »'));

    var e = el('div','empreinte', d.empreinte || '');
    e.title = "À comparer avec l'empreinte affichée sur l'appareil du demandeur";
    b.appendChild(e);

    var g = el('div','gestes');
    // ON ACCEPTE TOUJOURS EN `user`. Le serveur refuse d'ailleurs `admin` à
    // l'admission : promouvoir est un geste à part, sur un compte qui existe.
    g.appendChild(bouton('Accepter','oui', function(){
      return tranche('accepter', {did:d.did, profil:'user'}); }));
    g.appendChild(bouton('Refuser','non', function(){
      return tranche('refuser', {did:d.did, motif:''}); }));
    b.appendChild(g);
    vue().appendChild(b);
  });
}

function tranche(quoi, corps){
  return fetch(API+'/invitations/'+quoi, {
    method:'POST', credentials:'same-origin',
    headers: entetes({'Content-Type':'application/json'}),
    body: JSON.stringify(corps)
  }).then(function(r){
    if(!r.ok) return r.json().catch(function(){return {};})
      .then(function(j){ throw new Error(j.detail || ('HTTP '+r.status)); });
    return r.json();
  });
}

// ── VISAGE 2 — le demandeur voit SA demande ─────────────────────────────────

const MOTS = {
  en_attente: ['⏳','En attente de validation'],
  acceptee:   ['✅','Accès accordé'],
  refusee:    ['⛔','Demande refusée'],
  expiree:    ['⌛','Demande expirée'],
};

function rendMienne(v){
  $('compte').hidden = true;
  vue().textContent = '';
  var b = el('div','bloc');

  var m = MOTS[v.etat] || ['•', v.etat];
  var e = el('span','etat ' + v.etat, m[0] + ' ' + m[1]);
  b.appendChild(e);

  // ZOOMÉE côté demandeur : c'est LUI qui la montre à quelqu'un d'autre. Elle
  // doit se lire à bout de bras, pas au ras de l'écran.
  var emp = el('div','empreinte zoom', v.empreinte || '');
  b.appendChild(emp);

  if (v.etat === 'en_attente'){
    b.appendChild(el('p','aide',
      "Montrez cette empreinte à l'administrateur : il la compare avec ce que "
      + "montre son écran avant de valider. Rien d'autre n'est à transmettre."));
  } else if (v.etat === 'acceptee'){
    b.appendChild(el('p','aide',
      'Profil accordé : ' + (v.profil || 'user') + '. Le Hall se compose tout seul.'));
  } else {
    var g = el('div','gestes');
    g.appendChild(bouton('Refaire une demande','fort', function(){
      try{ localStorage.removeItem(CLE_LOCALE); }catch(e){}
      return Promise.resolve();
    }));
    b.appendChild(g);
  }
  vue().appendChild(b);
}

// ── VISAGE 3 — l'inconnu remplit le formulaire ──────────────────────────────

function rendFormulaire(){
  $('compte').hidden = true;
  vue().textContent = '';
  var b = el('div','bloc');
  b.appendChild(el('p','aide',
    "Cet appareil n'a pas encore d'accès. Demandez-en un : un administrateur "
    + 'validera, et le Hall se composera tout seul — sans rien réinstaller.'));

  var champs = [
    ['nom','Votre nom','input','text'],
    ['appareil','Cet appareil','input','text'],
    ['message','Un mot (facultatif)','textarea',null],
  ];
  var saisies = {};
  champs.forEach(function(c){
    b.appendChild(el('label', null, c[1]));
    var i = document.createElement(c[2]);
    if (c[3]) i.type = c[3];
    i.maxLength = c[0] === 'message' ? 500 : 60;
    saisies[c[0]] = i;
    b.appendChild(i);
  });
  // Un défaut utile : le navigateur sait à peu près sur quoi il tourne.
  saisies.appareil.value = (navigator.platform || 'appareil');

  var g = el('div','gestes');
  g.style.marginTop = '.6rem';
  g.appendChild(bouton('Demander un accès','fort', function(){
    return demande({
      nom: saisies.nom.value.trim(),
      appareil: saisies.appareil.value.trim(),
      message: saisies.message.value.trim(),
    });
  }));
  b.appendChild(g);
  vue().appendChild(b);
}

/**
 * IDENTITÉ DE L'APPAREIL — V1 SANS BACKEND.
 *
 * Le DID définitif viendra d'une vraie paire de clés engendrée par le client
 * (#1297) ; ici on tire un identifiant aléatoire et stable, mémorisé. C'est
 * assez pour que le parcours soit jouable de bout en bout, et le CONTRAT côté
 * serveur est déjà le bon — seule la fabrication de la clé changera.
 */
function identite(){
  var m = mienne();
  if (m && m.did && m.cle) return m;
  var octets = new Uint8Array(32);
  crypto.getRandomValues(octets);
  var hex = [].map.call(octets, function(o){ return o.toString(16).padStart(2,'0'); }).join('');
  return { did: 'did:sbx:' + hex.slice(0,24), cle: hex };
}

function demande(champs){
  var id = identite();
  if (!champs.nom) return Promise.reject(new Error('Votre nom est nécessaire.'));
  return fetch(API+'/invitation/demande', {
    method:'POST', credentials:'same-origin',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      did: id.did, cle_publique: id.cle,
      nom: champs.nom, appareil: champs.appareil, message: champs.message,
    })
  }).then(function(r){
    if(!r.ok) return r.json().catch(function(){return {};})
      .then(function(j){ throw new Error(j.detail || ('HTTP '+r.status)); });
    return r.json();
  }).then(function(j){
    // Le jeton de suivi n'est rendu QU'UNE FOIS : on le garde, sinon on ne
    // pourra plus jamais consulter l'état de cette demande.
    retiens({ did:id.did, cle:id.cle, jeton:j.jeton });
    return j;
  });
}

// ── Le visage se déduit ─────────────────────────────────────────────────────

function decide(){
  return fetch(API+'/invitations', {
    headers: entetes({Accept:'application/json'}), credentials:'same-origin'
  }).then(function(r){
    if (r.ok) return r.json().then(function(j){ rendFile((j && j.en_attente) || []); });
    if (r.status === 401 || r.status === 403) return visageDemandeur();
    throw new Error('HTTP ' + r.status);
  }).catch(function(e){
    annonce('File injoignable (' + e.message + ').');
  });
}

function visageDemandeur(){
  var m = mienne();
  if (!m || !m.did || !m.jeton){ rendFormulaire(); return; }
  return fetch(API+'/invitation/suivi?did=' + encodeURIComponent(m.did)
               + '&jeton=' + encodeURIComponent(m.jeton))
    .then(function(r){
      // 404 : la demande a disparu côté box (purge, réinstallation). On
      // repart du formulaire plutôt que d'afficher un état qui n'existe plus.
      if (r.status === 404){ try{ localStorage.removeItem(CLE_LOCALE); }catch(e){}
                             rendFormulaire(); return null; }
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function(v){ if (v) rendMienne(v); });
}

decide();
// Trente secondes : assez pour que l'attente paraisse vivante — côté admin une
// demande qui arrive, côté demandeur une validation — sans marteler la box.
setInterval(decide, 30000);
</script>
</body>
</html>
