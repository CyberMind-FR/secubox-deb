location /api/v1/vault/ { proxy_pass http://unix:/run/secubox/vault.sock; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
location /vault/ { alias /usr/share/secubox/www/vault/; try_files $uri $uri/ /vault/index.html; }
