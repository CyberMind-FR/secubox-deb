# /etc/nginx/secubox-routes.d/voice.conf — installé par secubox-voice.

location /api/v1/voice/ {
    proxy_pass http://unix:/run/secubox/voice.sock:/;
    include /etc/nginx/snippets/secubox-proxy.conf;

    # UN ENVOI AUDIO N'EST PAS UNE REQUÊTE DE FORMULAIRE. Le défaut nginx
    # (1 Mo) rejetterait une commande vocale de quelques secondes avec un 413
    # que personne ne saurait interpréter. On aligne sur le garde-fou du
    # service (audio_max_mo = 10) plutôt que de laisser deux limites diverger.
    client_max_body_size 12m;

    # PAS DE proxy_read_timeout ICI. Le snippet partagé le pose déjà (300 s),
    # et nginx refuse le doublon dans le même bloc — `nginx -t` échoue alors sur
    # TOUTE la configuration, pas seulement sur ce fichier. 300 s couvrent
    # largement le chargement d'un modèle à la demande, qui est le cas lent.
}
