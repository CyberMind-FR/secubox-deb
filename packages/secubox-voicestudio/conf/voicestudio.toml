# SecuBox-Deb :: VoiceStudio (#1649, #1917) — moteur vocal « studio » du parc.
# SPDX-License-Identifier: LicenseRef-CMSD-1.0
# Copyright (c) 2026 CyberMind — Gérald Kerma <devel@cybermind.fr>
#
# Le moteur vit dans un LXC natif Debian (jamais podman ni docker). Les
# sources amont sont ÉPINGLÉES par commit ET par empreinte d'archive : une
# mise à jour est un geste (`voicestudioctl mettre-a-jour`), pas une surprise.

[source]
depot    = "https://github.com/debpalash/VoiceStudio"
version  = "0.5.6"
commit   = "3915a62cb482bb43117aaebab57d22745bd1cc21"
sha256   = "111c0df4cd7cddd79864564ea9633b0d12a6e207fd0f7e0db587e963db4d0807"

[lxc]
nom      = "voicestudio"
chemin   = "/data/lxc"
ip       = "10.100.0.230"
memoire  = "4G"        # plafond cgroup du conteneur
swap     = "1G"        # plafond de SWAP du conteneur : au-delà, le moteur est tué et redémarre (échec rapide) au lieu de
                       # s'enliser des minutes dans le swap (gk3 : 3,3 Go swappés, chargements de modèle > 1200 s, #2045)
cpu_poids = 50         # 1–10000 ; 100 = poids par défaut, bas = cède le pas aux autres services

# « permanent » : le LXC démarre avec la box (comportement historique, Lexie
# répond sans délai). « demande » : endormi tant que personne n'appelle ; le
# premier client attend le démarrage à froid (30–60 s), le conteneur se rendort
# après `inactivite_s` sans connexion et rend sa mémoire à l'hôte.
mode     = "permanent"
inactivite_s = 900

[reseau]
# Adresses de l'HÔTE où publier le port 3900 : LAN et maillage, jamais le WAN.
# Vide = seulement 127.0.0.1. « voicestudioctl publier 192.168.1.9 10.10.0.5 »
publier  = []

[moteur]
# MÉMOIRE (gk3 : 8 Go, dont le moteur de synthèse seul veut ≈ 3,6 Go). Le modèle de synthèse est RENDU après `liberation_modele_s`
# secondes sans usage (le moteur le garde sinon 15 min) ; la dictée et le filigrane ne sont pas préchargés au démarrage.
# Poussé dans le LXC par voicestudioctl (fichier d'environnement du moteur) ; modifier = le moteur redémarre.
liberation_modele_s = 60
precharger_dictee   = false
precharger_filigrane = false
# Reconnaissance (faster-whisper) : base = le meilleur compromis vitesse /
# précision mesuré sur un Core i3 pour des commandes courtes (#1649).
asr      = "Systran/faster-whisper-base"

[memoire]
# Avant une SYNTHÈSE (la seule opération qui charge le grand modèle), voicestudioctl vérifie la mémoire de la BOX :
# si `MemAvailable` est sous `besoin_synthese_mo`, il met en sommeil, un par un et du plus gros au plus petit, les AUTRES
# conteneurs endormables (manifeste lifecycle on-demand/eager, par secubox-profilectl : audité, réversible, réveil au
# premier accès) jusqu'à en avoir assez ; s'il n'y arrive pas, la synthèse est REFUSÉE avec les chiffres, jamais tentée
# à l'aveugle (le tueur de mémoire global abattrait le moteur, voire un autre service).
besoin_synthese_mo   = 3800
# Le SWAP DISQUE libre compte pour moitié de ce qu'il offre, jusqu'à `swap_compte_mo` : le noyau y range les pages froides des autres
# services pour faire de la place au modèle. Sans swap disque (zram seul, plein), rien n'est compté — c'est le cas qui tuait gk3.
swap_compte_mo       = 2048
# Au-dessus de cette taille, le moteur a déjà son modèle en mémoire : la synthèse ne demande rien de plus.
modele_residente_mo  = 2500
# Une tentative de libération au plus toutes les N secondes (une salve de synthèses ne rendort pas tout le parc en boucle).
delai_repetition_s   = 120

[rapide]
# VOIX RAPIDE : une voix française légère (Piper, par sherpa-onnx — déjà dans le moteur) qui parle en moins d'une seconde
# là où le grand modèle prend 110 à 140 s sur le processeur. Elle sert « Dire » quand aucune voix précise n'est choisie ;
# le grand modèle (600 langues, clonage) reste pour les voix nommées et le studio. Modèle vérifié par sha256.
activer       = true
port          = 3901
modele_url    = "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-fr_FR-siwis-medium.tar.bz2"
modele_sha256 = "375909aa30842b3a4efa10b1beb1d761af792960ae6873b4d53889f96c66195b"

[interface]
# Interface NATIVE de VoiceStudio (le studio complet : clonage, doublage, bibliothèque de voix…), servie par le moteur
# lui-même une fois construite. Construite DANS le LXC avec bun, comme le fait le Dockerfile amont :
#   bun install --frozen-lockfile   puis   bun run --cwd frontend build        (bun.lock = versions figées)
# bun est téléchargé à l'installation, VÉRIFIÉ par sha256, utilisé, puis supprimé. Aucun Node.
activer     = true
bun_version = "1.4.2"
bun_url     = "https://github.com/oven-sh/bun/releases/download/bun-v1.4.2/bun-linux-x64-baseline.zip"
bun_sha256  = "c678040f14fe0440eb839d37cbd0ce4c051a32da72806ac97de6a6aab6bf728f"
# Préfixe du domaine de CETTE box (`secubox-domaine voicestudio` → voicestudio.<domaine>), derrière HAProxy puis le WAF.
# L'accès est réservé aux administrateurs (auth_request vers le module) ; la clé du moteur est posée par nginx.
domaine     = "voicestudio"

[limites]
# Garde-fous des routes d'USAGER : une synthèse n'est pas un moyen de faire lire
# un livre entier à la box, ni un envoi audio un moyen d'y téléverser un film.
texte_max    = 2000
audio_max_mo = 10
# Délai d'attente du moteur par le module. Mesuré sur gk3 : une synthèse À FROID (chargement du modèle puis calcul sur CPU) prend ≈ 110 s.
delai_s      = 300
