# /etc/nginx/secubox-routes.d/voicestudio.conf — installé par secubox-voicestudio.
# API seulement : le vhost sert déjà /usr/share/secubox/www depuis sa racine.

location /api/v1/voicestudio/ {
    proxy_pass http://unix:/run/secubox/voicestudio.sock:/;
    include /etc/nginx/snippets/secubox-proxy.conf;

    # UN ENVOI AUDIO N'EST PAS UNE REQUÊTE DE FORMULAIRE : le défaut nginx (1 Mo) rejetterait
    # une dictée de quelques secondes par un 413 que personne ne saurait lire. On s'aligne sur
    # le garde-fou du service (limites.audio_max_mo = 10) au lieu de laisser deux limites diverger.
    client_max_body_size 12m;

    # PAS DE proxy_read_timeout ICI : le snippet partagé le pose déjà (300 s) et nginx refuse le
    # doublon dans le même bloc (`nginx -t` échouerait sur TOUTE la configuration). 300 s couvrent
    # le démarrage à froid du LXC en mode « à la demande », qui est le cas lent.
}
