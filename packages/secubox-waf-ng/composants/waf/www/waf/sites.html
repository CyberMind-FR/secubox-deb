<body>
<div class="cadre" id="cadre"><main class="app">

<script>
"use strict";
// ── tronc commun (dossiers) ──
var Q=new URLSearchParams(location.search),DEMO=!!Q.get('demo'),EMB=!!Q.get('embed');
if(EMB)document.body.classList.add('emb');
var NS='http://www.w3.org/2000/svg',$=function(i){return document.getElementById(i);};
function h(tag,cls,txt,title){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;if(title)e.title=title;return e;}
function add(p){for(var i=1;i<arguments.length;i++)if(arguments[i]!=null)p.appendChild(arguments[i]);return p;}
function vide(e){e.textContent='';return e;}
function sv(tag,at,parent){var e=document.createElementNS(NS,tag);for(var k in at)e.setAttribute(k,at[k]);if(parent)parent.appendChild(e);return e;}
function nombre(v){return typeof v==='number'&&isFinite(v);}
function nb(v){return Math.round(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ');}
function mes(v){return nombre(v)?nb(v):'—';}                         // mesure absente = « — » ; 0 est une mesure
function pc(v){return nombre(v)?String(v).replace('.',',')+' %':'—';}
function pl(n,s,p){return nb(n)+' '+(Math.abs(n)<2?s:p);}
function court(n){return n>=1e6?String(Math.round(n/1e5)/10).replace('.',',')+'M':n>=1e4?Math.round(n/1e3)+'k':nb(n);}
function tab(v){return Array.isArray(v)?v:[];}
function hh(ts){return new Date(ts*1000).getHours()+' h';}
function quand(ts){var d=new Date(ts*1000),m=d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  return d.toDateString()===new Date().toDateString()?m:d.toLocaleDateString('fr-FR',{weekday:'short'})+' '+m;}
function age(s){return s<90?'à l’instant':s<5400?'il y a '+Math.round(s/60)+' min':'il y a '+Math.round(s/3600)+' h';}
function genre(c){return c==='r'||c==='o'||c==='v'?c:'';}
function lienSur(u){return typeof u==='string'&&/^\/(?!\/)[A-Za-z0-9\/._\-#:?=&]*$/.test(u)?u:null;}
var TEINTES={arrete:'--rouge',refuse:'--bleu',detourne:'--violet',passe:'--orange',hostiles:'--cyan',recues:'--doux'};
function teinte(k){return 'var('+(Object.prototype.hasOwnProperty.call(TEINTES,k)?TEINTES[k]:'--cyan')+')';}
var REFUS=false,ETAT={liste:null,choisi:null,dossier:null,vu:''},LIM=40;
// {statut, corps} ; jamais d'exception : une source muette se lit, elle ne se devine pas.
function lire(u){
  var hd={Accept:'application/json'};
  try{var t=localStorage.getItem('sbx_token');if(t)hd.Authorization='Bearer '+t;}catch(e){/* stockage interdit */}
  return fetch(u,{headers:hd,credentials:'same-origin',cache:'no-store'}).then(function(r){
    if(r.status===401||r.status===403)REFUS=true;
    return r.ok?r.json().then(function(c){return {statut:200,corps:c};}):{statut:r.status,corps:null};
  }).catch(function(){return {statut:0,corps:null};});
}
function mesurees(s){return tab(s).filter(nombre);}
function mini(s,cls,couleur){
  var g=sv('svg',{'class':cls,viewBox:'0 0 '+s.length*4+' 32',preserveAspectRatio:'none','aria-hidden':'true'}),m=Math.max.apply(null,mesurees(s).concat([1]));
  s.forEach(function(v,i){if(!nombre(v))return;var b=v>0?Math.max(2,v/m*31):1;
    sv('rect',{x:i*4+.4,y:32-b,width:3.2,height:b,rx:.8,fill:v>0?couleur:'var(--doux)','fill-opacity':v>0?(v===m||i===s.length-1?1:.62):.5},g);});
  return g;
}
function couleurItem(x){var e=tab(x.etiquettes)[0];return e&&e[1]==='r'?'var(--rouge)':e&&e[1]==='o'?'var(--orange)':'var(--cyan)';}
function rendListe(){
  var L=ETAT.liste?tab(ETAT.liste.items):[],box=$('liste'),foc=document.activeElement&&box.contains(document.activeElement)?document.activeElement.getAttribute('data-id'):null,y=box.scrollTop;
  vide(box);
  if(!L.length)add(box,h('p','vide',ETAT.liste?ETAT.liste.videTexte:REFUS?'Aucune mesure : session requise.':'Chargement…'));
  L.slice(0,LIM).forEach(function(x){
    var s=mesurees(x.serie).length?x.serie:mesurees(x.serie_jours).length?x.serie_jours:null,b=h('button','item '+genre((tab(x.etiquettes)[0]||[])[1]));
    b.type='button';b.setAttribute('data-id',x.id);b.setAttribute('aria-current',String(x.id===ETAT.choisi));
    add(b,h('b',null,x.titre),h('small',null,x.sous_titre),s?mini(s,'mini',couleurItem(x)):h('span','sans','—','Pas de série mesurée'));
    b.addEventListener('click',function(){choisir(x.id,true);});add(box,b);
  });
  if(L.length>LIM){var p=h('button','plus','Voir '+pl(Math.min(40,L.length-LIM),'dossier','dossiers')+' de plus');p.type='button';p.addEventListener('click',function(){LIM+=40;rendListe();annoncer();});add(box,p);}
  if(ETAT.liste&&ETAT.liste.pied)add(box,ETAT.liste.pied());
  box.scrollTop=y;
  if(foc)[].slice.call(box.querySelectorAll('[data-id]')).some(function(b){if(b.getAttribute('data-id')!==foc)return false;b.focus({preventScroll:true});return true;});
}
$('liste').addEventListener('keydown',function(e){
  var pas={ArrowDown:1,ArrowUp:-1,Home:-1e6,End:1e6}[e.key];if(!pas)return;
  var l=[].slice.call(this.querySelectorAll('button')),i=l.indexOf(document.activeElement);if(i<0)return;
  e.preventDefault();l[Math.max(0,Math.min(l.length-1,i+pas))].focus();
});
function choisir(id,geste){
  ETAT.choisi=id;ETAT.dossier=null;ETAT.vu='';
  rendListe();rendDossier();
  return CHARGER(id).then(function(d){
    if(ETAT.choisi!==id)return;
    ETAT.dossier=d;rendDossier();annoncer();
    if(geste&&!$('retour').hidden&&$('retour').offsetParent){$('dossier').focus({preventScroll:true});$('retour').scrollIntoView({block:'start'});}
  });
}
$('retour').addEventListener('click',function(){var b=$('liste').querySelector('[aria-current=true]')||$('liste').querySelector('button');if(b){b.focus();b.scrollIntoView({block:'center'});}});
function barres(lignes,unite){
  var m=Math.max.apply(null,lignes.map(function(x){return nombre(x.n)?x.n:0;}).concat([1])),box=h('div');
  lignes.forEach(function(x){var l=h('div','lig',null,x.def||x.nom+' : '+mes(x.n)+(unite==='%'?' %':'')),e=h('em'),i=h('i');
    i.style.width=(nombre(x.n)?Math.max(x.n>0?1.5:0,100*x.n/m):0)+'%';i.style.background=x.cle?teinte(x.cle):'var(--bleu)';
    add(box,add(l,h('span',null,x.nom),add(e,i),h('b',null,nombre(x.n)?nb(x.n)+(unite==='%'?' %':''):'—')));});
  return box;
}
// Histogramme empilé. Heure non mesurée : rien (et c'est dit) ; zéro mesuré : trait de base. Une échelle, graduations réelles.
function graphe(x){
  var jours=!x.couches&&mesurees(x.serie_jours).length>0,C=jours?[{cle:'hostiles',nom:'Tentatives',serie:x.serie_jours}]:tab(x.couches).filter(function(c){return tab(c.serie).length;});
  var box=h('div'),n=C.length?C[0].serie.length:0,T=[],i;
  add(box,h('h3',null,jours?'Sept derniers jours, jour par jour':'Les 24 dernières heures'));
  for(i=0;i<n;i++)T.push(C.some(function(c){return !nombre(c.serie[i]);})?null:C.reduce(function(a,c){return a+c.serie[i];},0));
  if(!mesurees(T).length){add(box,h('p','vide','— pas mesuré'+(x.serie_note?' : '+x.serie_note:'')));return box;}
  var W=Math.max(240,Math.floor($('dossier').clientWidth*(($('cadre').clientWidth>=1080)?.56:1)-32)),H=230,G=44,B=24,m=Math.max.apply(null,mesurees(T).concat([4])),p=Math.pow(10,Math.floor(Math.log10(m))),pas=[p/2,p,2*p,5*p].filter(function(q){return q>=1&&m/q<=4;})[0]||p,haut=Math.ceil(m/pas)*pas,larg=(W-G)/n;
  function Y(v){return H-B-v/haut*(H-B-10);}
  function debut(k){return x.debut?x.debut+k*(x.pas||3600):null;}
  function nomCol(k){if(jours){var d=new Date();d.setDate(d.getDate()-(n-1-k));return k===n-1?'aujourd’hui (en cours)':d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric'});}
    return debut(k)?hh(debut(k))+(k===n-1?' (en cours)':''):'heure '+(k+1);}
  function dit(k){return nomCol(k)+' : '+(T[k]===null?'pas mesuré':C.length===1?mes(T[k]):'total '+mes(T[k])+' — '+C.map(function(c){return c.nom.toLowerCase()+' '+mes(c.serie[k]);}).join(', '))+(tab(x.partielles).indexOf(k)>=0&&!jours&&k!==n-1?' (heure mesurée en partie)':'');}
  var pic=0;T.forEach(function(v,k){if(nombre(v)&&(T[pic]===null||v>T[pic]))pic=k;});
  var manque=T.filter(function(v){return v===null;}).length,resume='Pic : '+mes(T[pic])+' ('+nomCol(pic)+')'+(manque?' · '+pl(manque,jours?'jour non mesuré':'heure non mesurée',jours?'jours non mesurés':'heures non mesurées'):'');
  var g=sv('svg',{'class':'graphe',viewBox:'0 0 '+W+' '+H,width:W,height:H,role:'img',tabindex:'0','aria-label':(jours?'Par jour. ':'Par heure. ')+resume});
  g.style.maxWidth='100%';
  for(var v=0;v<=haut+1e-9;v+=pas){sv('line',{x1:G,x2:W,y1:Y(v),y2:Y(v),stroke:'var(--trait)'},g);sv('text',{x:G-7,y:Y(v)+4,'text-anchor':'end'},g).textContent=court(v);}
  var lec=h('p','lecture',resume);lec.setAttribute('aria-live','polite');
  var cols=[],frais=ETAT.vu!==x.id;
  T.forEach(function(t,k){
    var bas=0,bx=G+k*larg+larg*.12,bw=larg*.76;
    if(t!==null){
      if(!t)sv('rect',{x:bx,y:H-B-1.5,width:bw,height:1.5,fill:'var(--doux)','fill-opacity':.6},g);
      C.forEach(function(c){var q=c.serie[k];if(!q)return;var y0=Y(bas),y1=Y(bas+q);
        sv('rect',{'class':(k===n-1&&x.attaque?'vif':frais?'pousse':''),x:bx,y:y1,width:bw,height:Math.max(1,y0-y1-1),rx:1.5,fill:teinte(c.cle)},g);bas+=q;});
    }
    var z=sv('rect',{'class':'col',x:G+k*larg,y:0,width:larg,height:H-B},g);cols.push(z);sv('title',{},z).textContent=dit(k);
    z.addEventListener('pointerenter',function(){montre(k);});z.addEventListener('click',function(){montre(k);});
  });
  var pasT=jours?1:W<420?12:6;
  for(i=0;i<n;i+=pasT){var lab=jours?nomCol(i).slice(0,3):debut(i)?hh(debut(i)):'';if(jours&&i===n-1)lab='auj.';sv('text',{x:G+(i+.5)*larg,y:H-5,'text-anchor':'middle'},g).textContent=lab;}
  if(!jours)sv('text',{x:W,y:H-5,'text-anchor':'end'},g).textContent='en cours';
  var ici=-1;
  function montre(k){ici=k;cols.forEach(function(c,j){c.setAttribute('class','col'+(j===k?' on':''));});lec.textContent=k<0?resume:dit(k);}
  g.addEventListener('pointerleave',function(){if(document.activeElement!==g)montre(-1);});
  g.addEventListener('blur',function(){montre(-1);});
  g.addEventListener('keydown',function(e){var d={ArrowLeft:-1,ArrowRight:1}[e.key];if(!d)return;e.preventDefault();montre(Math.max(0,Math.min(n-1,(ici<0?(d>0?-1:n):ici)+d)));});
  add(box,g);
