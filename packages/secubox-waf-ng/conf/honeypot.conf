#
# LEURRE HTTP (#1290) — drop-in D'EXEMPLE, non actif tel quel.
#
# Pour l'armer :
#   install -D -m 0644 /usr/share/secubox/waf/honeypot.conf \
#     /etc/systemd/system/secubox-waf-ng.service.d/10-honeypot.conf
#   install -d -m 0700 /etc/secubox/secrets
#   head -c 48 /dev/urandom | base64 > /etc/secubox/secrets/filigrane
#   chown secubox-waf:secubox-waf /etc/secubox/secrets/filigrane
#   chmod 0400 /etc/secubox/secrets/filigrane
#   systemctl daemon-reload && systemctl restart secubox-waf-ng
#
# CE QUE ÇA CHANGE. Un hôte NON ROUTÉ reçoit une réponse plausible et inerte au
# lieu d'un 421. Aucun service réel n'est en jeu : le leurre ne vit que dans
# l'espace que la box ne sert à personne, et ne proxifie rien.
#
# CE QUE ÇA NE CHANGE PAS. Aucun ban, aucun blocage — apprentissage seul. La
# première partie (nos propres noms) reste exemptée et garde son 421 : un nom à
# nous non câblé appartient à un de nos utilisateurs, pas à un scanner.
#
# Pour désarmer : supprimer le drop-in, `daemon-reload`, redémarrer.
#
# ExecStart VIDE PUIS REDÉFINI : c'est la seule façon, pour une unité de type
# `simple`, de remplacer la commande au lieu d'en ajouter une seconde. Cette
# liste doit rester le MIROIR de celle de l'unité — un drapeau ajouté là-bas et
# oublié ici disparaîtrait silencieusement à l'armement du leurre.

[Service]
ExecStart=
ExecStart=/usr/sbin/sbxwaf \
  --listen 127.0.0.1:8085 \
  --upstream-timeout 120s \
  --routes /etc/secubox/waf/haproxy-routes.json \
  --rules /etc/secubox/waf/waf-rules.json \
  --on-demand-vhosts /etc/secubox/waf/on-demand-vhosts.json \
  --vhost-signals /var/cache/secubox/waf/vhost-signals.json \
  --threat-log /var/log/secubox/waf/waf-threats.log \
  --cookie-audit-log /var/log/secubox/cookie-audit/server.jsonl \
  --media-cache-dir /var/cache/secubox/waf/media \
  --vhost-profiles /etc/secubox/waf/vhost_profiles.json \
  --nft-ban \
  --honeypot \
  --honeypot-secret /etc/secubox/secrets/filigrane
