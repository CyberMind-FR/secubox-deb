#
# SecuBox #1240 — vhost dédié du module Renseignement (Actor Intelligence).
#
# POURQUOI FERMÉ AU RÉSEAU LOCAL PAR DÉFAUT. sbx-actord ne vérifie aucune
# session : son API ne passe que par l'agrégateur, qui la réserve aux
# administrateurs réels (#1581, #1608), ici comme sur admin.gk2.secubox.in.
# Le panneau lui-même livrerait la forme de la posture de défense à qui passe :
# le filtre d'exposition est donc inclus en plus, et
# il vaut « lan » tant que l'opérateur n'en décide autrement (secubox-exposure
# est l'éditeur de ce fichier). Le moteur reste 100% shadow (il PROPOSE, n'agit
# pas) : ce vhost n'ouvre aucune action, seulement la lecture.
#
# Servi EN DIRECT par nginx (hors des vhosts gérés par haproxyctl), comme
# waf.gk2 : HAProxy route déjà *.gk2.secubox.in vers nginx:9080 et termine le
# TLS (cert wildcard). Aucune entrée haproxy.toml ni route sbxwaf nécessaire.
server {
    listen 9080;
    server_name actor.gk2.secubox.in actor.*;

    # HTTPS PARTOUT (#1370). Ce vhost n'hérite pas de la redirection clair->TLS
    # de HAProxy ; on la pose ici via le schéma réel (X-Forwarded-Proto). L'ACME
    # est intercepté en amont par HAProxy et n'atteint jamais ce bloc.
    if ($http_x_forwarded_proto = "http") { return 301 https://$host$request_uri; }

    # Le filtre d'exposition : présent = appliqué. Créé à « lan » par le postinst
    # si absent, jamais écrasé ensuite.
    include /etc/nginx/snippets/exposure/actor.gk2.secubox.in.conf;

    root /usr/share/secubox/www/actor;
    index index.html;

    # 'unsafe-inline' pour script et style : le panneau porte son propre code ;
    # la police Courier Prime vient de Google Fonts (skin maison hybrid-dark).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self' https://hall.gk2.secubox.in https://hall.gk2.net; base-uri 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    # Un tableau de bord de renseignement n'a rien à faire dans un index de moteur.
    add_header X-Robots-Tag "noindex, nofollow" always;

    access_log /var/log/nginx/secubox-hosts.log sbx_host;

    location = / { try_files /index.html =404; }

    # La feuille de style + le rail partagés du panneau (skin hybrid-dark maison).
    location /shared/ {
        alias /usr/share/secubox/www/shared/;
        expires 1h;
        access_log off;
        try_files $uri =404;
    }

    # API du moteur Actor Intelligence (sbx-actord). Lecture seule.
    #
    # RÉSERVÉE À L'ADMINISTRATEUR RÉEL (#1581, #1608). Le panneau lit la vue
    # complète d'actord (services visés, preuves) ; elle n'est servie qu'à la
    # route qui passe la garde d'administration. On relaie donc par
    # l'agrégateur, qui applique cette garde (401 sans session, 403 pour un
    # appareil ou un non-admin) puis pose lui-même `X-Sbx-Vue: complete`. Le
    # cookie de session est posé sur le domaine parent : un administrateur
    # connecté l'envoie aussi ici. Le filtre LAN ci-dessus s'ajoute à la garde,
    # il ne la remplace pas.
    #
    # L'en-tête de vue ne vient jamais du visiteur : vidé ici (nginx ne
    # l'envoie pas), et l'agrégateur l'écarte de toute façon.
    #
    # LECTURE SEULE : POST /feedback reste l'affaire de la console
    # d'administration (admin.gk2).
    location /api/v1/actor/ {
        limit_except GET { deny all; }
        proxy_pass http://unix:/run/secubox/aggregator.sock:/api/v1/actor/;
        proxy_set_header X-Sbx-Vue "";
        proxy_set_header X-SecuBox-LAN $lan_client;   # verdict LAN (#1354)
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
