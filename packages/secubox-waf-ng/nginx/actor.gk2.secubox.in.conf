#
# SecuBox #1240 — vhost dédié du module Renseignement (Actor Intelligence).
#
# POURQUOI FERMÉ AU RÉSEAU LOCAL PAR DÉFAUT. Les points d'entrée que ce panneau
# consomme — /api/v1/actor/stats, /api/v1/actor/actors — ne demandent PAS de
# jeton : sur admin.gk2.secubox.in ils vivent derrière la porte du panneau. Sur
# un vhost à part, ils livreraient la carte des acteurs corrélés, leurs scores et
# la posture de défense à qui passe. Le filtre d'exposition est donc inclus, et
# il vaut « lan » tant que l'opérateur n'en décide autrement (secubox-exposure
# est l'éditeur de ce fichier). Le moteur reste 100% shadow (il PROPOSE, n'agit
# pas) : ce vhost n'ouvre aucune action, seulement la lecture.
#
# Servi EN DIRECT par nginx (hors des vhosts gérés par haproxyctl), comme
# waf.gk2 : HAProxy route déjà *.gk2.secubox.in vers nginx:9080 et termine le
# TLS (cert wildcard). Aucune entrée haproxy.toml ni route mitmproxy nécessaire.
server {
    listen 9080;
    server_name actor.gk2.secubox.in;

    # HTTPS PARTOUT (#1370). Ce vhost n'hérite pas de la redirection clair->TLS
    # de HAProxy ; on la pose ici via le schéma réel (X-Forwarded-Proto). L'ACME
    # est intercepté en amont par HAProxy et n'atteint jamais ce bloc.
    if ($http_x_forwarded_proto = "http") { return 301 https://$host$request_uri; }

    # Le filtre d'exposition : présent = appliqué. Créé à « lan » par le postinst
    # si absent, jamais écrasé ensuite.
    include /etc/nginx/snippets/exposure/actor.gk2.secubox.in.conf;

    root /usr/share/secubox/www/actor;
    index index.html;

    # 'unsafe-inline' pour script et style : le panneau porte son propre code ;
    # la police Courier Prime vient de Google Fonts (skin maison hybrid-dark).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self' https://hall.gk2.secubox.in https://hall.gk2.net; base-uri 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    # Un tableau de bord de renseignement n'a rien à faire dans un index de moteur.
    add_header X-Robots-Tag "noindex, nofollow" always;

    access_log /var/log/nginx/secubox-hosts.log sbx_host;

    location = / { try_files /index.html =404; }

    # La feuille de style + le rail partagés du panneau (skin hybrid-dark maison).
    location /shared/ {
        alias /usr/share/secubox/www/shared/;
        expires 1h;
        access_log off;
        try_files $uri =404;
    }

    # API du moteur Actor Intelligence (sbx-actord, socket dédié). Lecture seule ;
    # protégée par le filtre d'exposition ci-dessus. sbx-actord enregistre ses
    # routes sous /api/v1/actor/* — on préserve le préfixe.
    location /api/v1/actor/ {
        proxy_pass http://unix:/run/secubox/actor.sock:/api/v1/actor/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
