# /etc/nginx/secubox-routes.d/waf-ai.conf — livré par secubox-waf-ng (#3716).
#
# Gestes du compte de service ai-ban (/api/v1/waf/ai/ban, /unban, /etat) : servis par l'AGRÉGATEUR SEUL, le
# processus qui porte SECUBOX_WAF_GESTES_IA=1 (drop-in secubox-aggregator.service.d/secubox-waf-gestes-ia.conf).
# Le serveur d'administration (sites-enabled/webui.conf, secubox-hub) envoie `location /api/v1/waf/` à waf.sock
# (secubox-waf.service, sans le drapeau) : sans cette route, chaque /ai/* y rendrait 503 « processus ».
# webui.conf inclut secubox-routes.d dans le même serveur : la location préfixe la plus longue gagne, `^~` écarte
# les regex. L'agrégateur monte le WAF sous /api/v1/waf (le sous-routeur voit /ai/…) : le chemin complet est gardé.
# proxy_intercept_errors off : les motifs JSON des 409/503 doivent parvenir au relais tels quels.
location ^~ /api/v1/waf/ai/ {
    proxy_pass http://unix:/run/secubox/aggregator.sock:/api/v1/waf/ai/;
    include /etc/nginx/snippets/secubox-proxy.conf;
    proxy_intercept_errors off;
}
