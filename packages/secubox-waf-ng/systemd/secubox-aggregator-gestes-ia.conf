# Drop-in de secubox-aggregator.service livré par secubox-waf-ng (#3716), installé sous
# /usr/lib/systemd/system/secubox-aggregator.service.d/secubox-waf-gestes-ia.conf.
#
# Les routes /api/v1/waf/ai/* (compte de service ai-ban) gardent en MÉMOIRE DE PROCESSUS les jetons déjà vus
# (usage unique), leur verrou et leurs plafonds. Le code du WAF est importé par DEUX processus : l'agrégateur
# (--workers 1, qui monte le WAF sous /api/v1/waf) et secubox-waf.service (uvicorn sur /run/secubox/waf.sock).
# Servies par les deux, un même jeton passerait deux fois. Seul le processus qui porte ce drapeau sert /ai/* ;
# les autres rendent 503 « processus » avant de lire le jeton.
# Le serveur d'administration (sites-enabled/webui.conf de secubox-hub, gk2 compris) envoie `location /api/v1/waf/`
# à waf.sock, PAS à l'agrégateur : c'est la route /etc/nginx/secubox-routes.d/waf-ai.conf (livrée par ce paquet,
# `location ^~ /api/v1/waf/ai/`, incluse par webui.conf) qui envoie /api/v1/waf/ai/* à aggregator.sock.
#
# Pris en compte au prochain redémarrage de l'agrégateur, que le paquet NE fait PAS (redémarrages groupés, sur le
# go du propriétaire) : d'ici là l'agrégateur sert l'ancien code, sans /ai/*.
[Service]
Environment=SECUBOX_WAF_GESTES_IA=1
