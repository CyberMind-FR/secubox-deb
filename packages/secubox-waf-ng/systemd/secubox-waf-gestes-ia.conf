# Drop-in de secubox-waf.service livré par secubox-waf-ng (#3716), installé sous
# /usr/lib/systemd/system/secubox-waf.service.d/secubox-waf-gestes-ia.conf.
#
# Les routes /api/v1/waf/ai/* (compte de service ai-ban) gardent en MÉMOIRE DE PROCESSUS les jetons déjà vus
# (usage unique), leur verrou et leurs plafonds : UN seul processus doit les servir. C'est secubox-waf.service :
# uvicorn mono-processus (sans --workers) sur /run/secubox/waf.sock, où le serveur d'administration (webui.conf de
# secubox-hub) envoie déjà `location /api/v1/waf/`. L'agrégateur ne monte pas ce module ; s'il le montait un jour,
# il rendrait 503 « processus » sur /ai/* sans lire le jeton (sûr : une seule mémoire de rejeu).
#
# Pris en compte au redémarrage de secubox-waf.service, que le postinst du composant fait à chaque mise à jour
# (après daemon-reload).
[Service]
Environment=SECUBOX_WAF_GESTES_IA=1
