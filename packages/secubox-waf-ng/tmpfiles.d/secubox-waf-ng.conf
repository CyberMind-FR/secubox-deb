# SecuBox — registre cookie-audit de sbxwaf
#
# systemd reapplique ces regles a chaque demarrage : le repertoire retrouve son
# proprietaire meme si un autre composant l'a recree en `secubox`. Sans cela,
# sbxwaf panique a l'ouverture du registre et TOUS les vhosts publics tombent
# en 503 (`admin.gk2` reste a 200, car il contourne le WAF).
#
# Le PARENT /var/log/secubox reste en 0755 : le passer en 0750 casse la
# traversee pour les autres services (cf. project_var_log_secubox_traversal).
d /var/log/secubox            0755 root        root        -
# LE JOURNAL DES MENACES N'ÉTAIT DÉCLARÉ NULLE PART (#1362). Son unité dit
# pourtant l'intention : « le journal des menaces est 0640 secubox-waf, lui seul
# (et le WAF) le lit ». Faute de règle, le répertoire prenait la propriété du
# premier processus qui le créait — sur gk2 : secubox:secubox en 0770.
#
# CONSÉQUENCE MESURÉE : `secubox-waf-campaigns`, qui tourne en secubox-waf, ne
# pouvait même pas ENTRER dans le répertoire. Le service échouait à chaque
# démarrage, laissant systemd « degraded » en permanence — et un rouge
# permanent finit par ne plus rien signaler du tout.
d /var/log/secubox/waf          0750 secubox-waf secubox-waf -
d /var/log/secubox/cookie-audit 0750 secubox-waf secubox-waf -
