#
# SecuBox #1227 — vhost dédié du tableau de bord WAF.
#
# POURQUOI FERMÉ AU RÉSEAU LOCAL PAR DÉFAUT. Les points d'entrée que cette page
# consomme — /stats, /bans, /detections, /visits — ne demandent PAS de jeton :
# sur admin.gk2.secubox.in ils vivent derrière la porte du panneau. Sur un vhost
# à part, ils seraient ouverts à qui passe, et livreraient les adresses des
# attaquants, la liste des bannis et l'état exact de chaque protection — c'est
# une carte du dispositif offerte à qui l'attaque. Le filtre d'exposition est
# donc inclus, et il vaut « lan » tant que l'opérateur n'en décide autrement
# (secubox-exposure est l'éditeur de ce fichier).
server {
    listen 9080;
    server_name waf.gk2.secubox.in;

    # HTTPS PARTOUT (#1370). Ce vhost est servi en direct par nginx (hors des
    # vhosts gérés par haproxyctl), il n'hérite donc pas de la redirection
    # clair->TLS de HAProxy. On la pose ici : HAProxy termine le TLS et
    # transmet le schéma réel via X-Forwarded-Proto ; quand il vaut « http »,
    # on renvoie vers HTTPS. L'ACME est intercepté en amont par HAProxy et
    # n'atteint jamais ce bloc — la redirection ne casse donc pas le
    # renouvellement.
    if ($http_x_forwarded_proto = "http") { return 301 https://$host$request_uri; }

    # Le filtre d'exposition : présent = appliqué. Créé à « lan » par le
    # postinst si absent, jamais écrasé ensuite.
    include /etc/nginx/snippets/exposure/waf.gk2.secubox.in.conf;

    root /usr/share/secubox/www/waf;
    index tableau.html;

    # 'unsafe-inline' pour le script : la page porte son propre code et ses
    # graphiques SVG, sans aucune bibliothèque externe — c'est le prix de
    # l'autonomie, et la CSP interdit tout le reste.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self' https://hall.gk2.secubox.in https://hall.gk2.net; base-uri 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    # Un tableau de bord de sécurité n'a rien à faire dans un index de moteur.
    add_header X-Robots-Tag "noindex, nofollow" always;
    # EMBARQUEMENT DANS LE HALL. `frame-ancestors 'none'` interdisait toute
    # inclusion : le cardlet ne pouvait qu'ouvrir un onglet. On nomme les deux
    # noms du Hall — et EUX SEULS. Un `'self'` seul ne suffirait pas, l'origine
    # du Hall n'etant pas celle de cette page ; un joker ouvrirait la porte a
    # n'importe quel site qui voudrait encadrer le tableau de bord.

    access_log /var/log/nginx/secubox-hosts.log sbx_host;

    location = / { try_files /tableau.html =404; }
    # #1237 — la vue MICRO : la carte que le service sert lui-même au Hall, au
    # lieu que le Hall la compose à sa place. Même règle que pour la radio.
    location = /micro { try_files /micro.html =404; }

    # LA PAGE DE CONNEXION, SERVIE ICI ET PAS AILLEURS (#1363).
    #
    # Sur un 401, `tableau.html` envoie vers `/login.html`. Ce chemin est
    # ABSOLU, donc résolu dans la racine de CE vhost — `…/www/waf` — où la page
    # n'existe pas : 404. La page partagée vit un niveau au-dessus.
    #
    # POURQUOI PAS UNE REDIRECTION VERS admin.gk2. Parce que `login.html`
    # n'accepte QUE des chemins de même origine pour son `?redirect=` — un
    # garde-fou délibéré contre la redirection ouverte. Renvoyer l'opérateur
    # sur admin.gk2 le connecterait, puis le laisserait là : le retour vers
    # waf.gk2 serait refusé par ce garde-fou, à juste titre. La connexion doit
    # donc se faire SUR CETTE ORIGINE.
    #
    # Ça fonctionne parce que le cookie de session est porté par le domaine
    # parent (`sso_cookie_domain = ".gk2.secubox.in"`) : une connexion faite
    # ici vaut pour tout le parc, et réciproquement.
    #
    # `root` STATIQUE, jamais `alias` avec try_files : un alias perdrait
    # l'extension et la page repartirait en application/octet-stream.
    location = /login.html {
        root /usr/share/secubox/www;
    }

    # Sans cette route, la page de connexion s'afficherait mais ne pourrait
    # connecter personne : son formulaire poste sur /api/v1/auth/login, qui
    # n'existait pas sur cette origine. Même bloc que le vhost d'administration.
    location /api/v1/auth/ {
        proxy_pass http://unix:/run/secubox/auth.sock;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # La feuille de style partagée du panneau.
    location /shared/ {
        alias /usr/share/secubox/www/shared/;
        expires 1h;
        access_log off;
        try_files $uri =404;
    }

    location /api/v1/waf/ {
        proxy_pass http://unix:/run/secubox/waf.sock:/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
