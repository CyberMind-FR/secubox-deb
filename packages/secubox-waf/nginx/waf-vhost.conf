#
# SecuBox #1227 — vhost dédié du tableau de bord WAF.
#
# POURQUOI FERMÉ AU RÉSEAU LOCAL PAR DÉFAUT. Les points d'entrée que cette page
# consomme — /stats, /bans, /detections, /visits — ne demandent PAS de jeton :
# sur admin.gk2.secubox.in ils vivent derrière la porte du panneau. Sur un vhost
# à part, ils seraient ouverts à qui passe, et livreraient les adresses des
# attaquants, la liste des bannis et l'état exact de chaque protection — c'est
# une carte du dispositif offerte à qui l'attaque. Le filtre d'exposition est
# donc inclus, et il vaut « lan » tant que l'opérateur n'en décide autrement
# (secubox-exposure est l'éditeur de ce fichier).
server {
    listen 9080;
    server_name waf.gk2.secubox.in;

    # Le filtre d'exposition : présent = appliqué. Créé à « lan » par le
    # postinst si absent, jamais écrasé ensuite.
    include /etc/nginx/snippets/exposure/waf.gk2.secubox.in.conf;

    root /usr/share/secubox/www/waf;
    index tableau.html;

    # 'unsafe-inline' pour le script : la page porte son propre code et ses
    # graphiques SVG, sans aucune bibliothèque externe — c'est le prix de
    # l'autonomie, et la CSP interdit tout le reste.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    # Un tableau de bord de sécurité n'a rien à faire dans un index de moteur.
    add_header X-Robots-Tag "noindex, nofollow" always;

    access_log /var/log/nginx/secubox-hosts.log sbx_host;

    location = / { try_files /tableau.html =404; }

    # La feuille de style partagée du panneau.
    location /shared/ {
        alias /usr/share/secubox/www/shared/;
        expires 1h;
        access_log off;
        try_files $uri =404;
    }

    location /api/v1/waf/ {
        proxy_pass http://unix:/run/secubox/waf.sock:/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
