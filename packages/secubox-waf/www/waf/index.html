<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecuBox - Web Application Firewall</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/shared/design-tokens.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font-display);
            background: var(--bg-deep);
            color: var(--text-dark);
            min-height: 100vh;
            line-height: 1.5;
        }
        .layout { display: flex; min-height: 100vh; }
        .sidebar { width: 180px; }
        .main {
            flex: 1;
            margin-left: 180px;
            padding: var(--space-l);
            background: linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-dark) 100%);
            min-height: 100vh;
        }
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: var(--space-m);
            margin-bottom: var(--space-l);
        }
        .stat-card {
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            padding: var(--space-l);
            text-align: center;
        }
        .stat-card .value {
            font-size: 2.5rem;
            font-weight: 700;
            font-family: var(--font-mono);
            color: var(--text-dark);
        }
        .stat-card .label {
            font-size: 0.7rem;
            color: var(--muted-dark);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: var(--space-xs);
        }
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            padding: var(--space-l);
            margin-bottom: var(--space-m);
        }
        .glass-card h2 {
            font-size: 0.9rem;
            color: var(--muted-dark);
            margin-bottom: var(--space-m);
            display: flex;
            align-items: center;
            gap: var(--space-s);
        }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-m); }
        .tabs {
            display: flex;
            gap: var(--space-m);
            margin-bottom: var(--space-m);
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: var(--space-s);
        }
        .tab {
            padding: var(--space-s) var(--space-m);
            cursor: pointer;
            color: var(--muted-dark);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }
        .tab:hover { color: var(--text-dark); }
        .tab.active { color: var(--root-light); border-bottom-color: var(--root-light); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .progress-bar {
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 4px;
        }
        .progress-bar .fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.3s;
        }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: var(--space-s); text-align: left; border-bottom: 1px solid var(--glass-border); }
        th { color: var(--muted-dark); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; }
        td { font-family: var(--font-mono); font-size: 0.85rem; }
        .btn {
            padding: var(--space-xs) var(--space-m);
            border-radius: var(--radius-sm);
            border: 1px solid var(--glass-border);
            background: var(--glass-bg);
            color: var(--text-dark);
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
        }
        .btn:hover { background: rgba(255,255,255,0.1); }
        .btn.danger { border-color: var(--boot-light); color: var(--boot-light); }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.3); opacity: 0.6; }
        }
        @media (max-width: 1200px) { .cards-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 768px) { .main { margin-left: 0; } .grid-2 { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <nav class="sidebar" id="sidebar"></nav>
    <script src="/shared/sidebar.js"></script>
    <main class="main">
        <div class="cards-grid">
            <div class="stat-card"><div class="value" id="threatsToday">-</div><div class="label">Threats Today</div></div>
            <div class="stat-card"><div class="value" id="totalRules">-</div><div class="label">Active Rules</div></div>
            <div class="stat-card"><div class="value" id="activeCategories">-</div><div class="label">Categories</div></div>
            <div class="stat-card"><div class="value" id="activeBans">-</div><div class="label">Active Bans</div></div>
        </div>

        <div class="glass-card">
            <div class="tabs">
                <div class="tab active" data-tab="alerts" onclick="switchTab('alerts')">Alerts</div>
                <div class="tab" data-tab="categories" onclick="switchTab('categories')">Categories</div>
                <div class="tab" data-tab="bans" onclick="switchTab('bans')">Bans</div>
                <div class="tab" data-tab="stats" onclick="switchTab('stats')">Statistics</div>
            </div>

            <div id="alerts" class="tab-content active">
                <div id="alertsList">Loading...</div>
            </div>

            <div id="categories" class="tab-content">
                <div id="categoriesList">Loading...</div>
            </div>

            <div id="bans" class="tab-content">
                <table>
                    <thead><tr><th>IP Address</th><th>🌍</th><th>Reason</th><th>Duration</th><th>Actions</th></tr></thead>
                    <tbody id="bansTable"><tr><td colspan="5">Loading...</td></tr></tbody>
                </table>
            </div>

            <div id="stats" class="tab-content">
                <div class="grid-2">
                    <div class="glass-card"><h2>📊 By Severity</h2><div id="severityStats" style="display:flex;justify-content:center;"></div></div>
                    <div class="glass-card"><h2>📁 By Category</h2><div id="categoryStats" style="display:flex;justify-content:center;"></div></div>
                </div>
                <div class="grid-2">
                    <div class="glass-card">
                        <h2>🌍 Attack Origins - Global Threat Map</h2>
                        <div id="geomap" style="position:relative;width:100%;height:260px;background:#000a0f;border-radius:8px;overflow:visible;margin-bottom:2.5rem;">
                            <div style="position:absolute;top:0;left:0;width:100%;height:100%;overflow:hidden;">
                                <img src="/waf/wargames-earth.png" alt="World Map" style="width:200%;height:100%;object-fit:cover;object-position:10% 50%;opacity:0.9;">
                            </div>
                            <div id="geomarkers" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;"></div>
                            <div style="position:absolute;bottom:6px;left:10px;font-size:10px;color:#00ff88;font-family:monospace;text-shadow:0 0 6px #00ff41;letter-spacing:2px;">GLOBAL THREAT MONITOR</div>
                            <div id="geoLegend" style="position:absolute;bottom:6px;right:10px;font-size:10px;color:#ff4466;font-family:monospace;text-shadow:0 0 6px #ff4466;"></div>
                        </div>
                    </div>
                    <div class="glass-card"><h2>🎯 Top Attacked Sites</h2><div id="topVhosts">Loading...</div></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const API = '/api/v1/waf';
        const token = () => localStorage.getItem('sbx_token');
        const headers = () => ({ 'Content-Type': 'application/json', ...(token() ? { 'Authorization': 'Bearer ' + token() } : {}) });

        async function api(path, opts = {}) {
            try {
                const res = await fetch(API + path, { ...opts, headers: headers() });
                if (res.status === 401) { window.location = '/login.html'; return {}; }
                return res.json();
            } catch { return {}; }
        }

        function countryToFlag(code) {
            if (!code || code === "LAN" || code.length !== 2) return "🌐";
            return String.fromCodePoint(...[...code.toUpperCase()].map(c => 127397 + c.charCodeAt(0)));
        }

        function getSiteEmoji(host) {
            if (!host) return "🌐";
            const h = host.toLowerCase();
            if (h.includes("git")) return "💻";
            if (h.includes("mail")) return "📧";
            if (h.includes("api")) return "⚡";
            if (h.includes("admin")) return "🔐";
            return "🌐";
        }

        function getCategoryEmoji(cat) {
            if (!cat) return "⚠️";
            const c = cat.toLowerCase();
            if (c.includes("sqli")) return "💉";
            if (c.includes("xss")) return "🔥";
            if (c.includes("rce")) return "💀";
            if (c.includes("scanner")) return "🔍";
            if (c.includes("bot")) return "🤖";
            if (c.includes("router")) return "📡";
            return "⚠️";
        }

        const SEV_COLORS = { critical: '#ef4444', high: '#f97316', medium: '#eab308', low: '#22c55e' };
        const SEV_EMOJI = { critical: '🔴', high: '🟠', medium: '🟡', low: '🟢' };
        const CAT_COLORS = ['#6366f1', '#8b5cf6', '#a855f7', '#d946ef', '#ec4899', '#f43f5e', '#0ea5e9', '#14b8a6'];
        const ARC_COLORS = ['#ff0044', '#ff4400', '#ff8800', '#ffcc00', '#88ff00', '#00ff44', '#00ffcc', '#0088ff', '#4400ff', '#cc00ff'];

        function createSeverityDonut(data, size) {
            size = size || 130;
            if (!data || Object.keys(data).length === 0) return '<p style="color:var(--muted);">No data</p>';
            const entries = Object.entries(data).filter(([k,v]) => v > 0);
            const total = entries.reduce((s, [k,v]) => s + v, 0);
            if (total === 0) return '<p style="color:var(--muted);">No data</p>';
            const center = size / 2;
            const ringWidth = 8;
            const spacing = 3;
            let svg = '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '">';
            entries.forEach(([sev, count], i) => {
                const r = center - 10 - (i * (ringWidth + spacing));
                const pct = count / total;
                const circ = 2 * Math.PI * r;
                const dash = circ * pct;
                const gap = circ - dash;
                const color = SEV_COLORS[sev.toLowerCase()] || '#888';
                const emoji = SEV_EMOJI[sev.toLowerCase()] || '⚪';
                svg += '<circle cx="' + center + '" cy="' + center + '" r="' + r + '" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="' + ringWidth + '"/>';
                svg += '<circle cx="' + center + '" cy="' + center + '" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="' + ringWidth + '" stroke-dasharray="' + dash + ' ' + gap + '" stroke-dashoffset="' + (circ/4) + '" stroke-linecap="round" style="filter:drop-shadow(0 0 3px ' + color + ');"><title>' + emoji + ' ' + sev + ': ' + count + ' (' + Math.round(pct*100) + '%)</title></circle>';
            });
            svg += '<text x="' + center + '" y="' + (center - 2) + '" text-anchor="middle" fill="var(--text)" font-size="16" font-weight="bold">' + total + '</text>';
            svg += '<text x="' + center + '" y="' + (center + 12) + '" text-anchor="middle" fill="var(--muted)" font-size="7">ALERTS</text>';
            svg += '</svg>';
            const legend = entries.map(([sev, count]) => {
                const color = SEV_COLORS[sev.toLowerCase()] || '#888';
                const emoji = SEV_EMOJI[sev.toLowerCase()] || '⚪';
                return '<span style="display:inline-flex;align-items:center;gap:3px;font-size:0.7rem;">' + emoji + ' <span style="color:' + color + '">' + count + '</span></span>';
            }).join(' ');
            return '<div style="display:flex;flex-direction:column;align-items:center;">' + svg + '<div style="margin-top:8px;">' + legend + '</div></div>';
        }

        function createCategoryDonut(data, size) {
            size = size || 130;
            if (!data || Object.keys(data).length === 0) return '<p style="color:var(--muted);">No data</p>';
            const entries = Object.entries(data).slice(0, 6).filter(([k,v]) => v > 0);
            const total = entries.reduce((s, [k,v]) => s + v, 0);
            if (total === 0) return '<p style="color:var(--muted);">No data</p>';
            const center = size / 2;
            const ringWidth = 8;
            const spacing = 3;
            let svg = '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '">';
            entries.forEach(([cat, count], i) => {
                const r = center - 10 - (i * (ringWidth + spacing));
                const pct = count / total;
                const circ = 2 * Math.PI * r;
                const dash = circ * pct;
                const gap = circ - dash;
                const color = CAT_COLORS[i % CAT_COLORS.length];
                const emoji = getCategoryEmoji(cat);
                svg += '<circle cx="' + center + '" cy="' + center + '" r="' + r + '" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="' + ringWidth + '"/>';
                svg += '<circle cx="' + center + '" cy="' + center + '" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="' + ringWidth + '" stroke-dasharray="' + dash + ' ' + gap + '" stroke-dashoffset="' + (circ/4) + '" stroke-linecap="round" style="filter:drop-shadow(0 0 3px ' + color + ');"><title>' + emoji + ' ' + cat + ': ' + count + ' (' + Math.round(pct*100) + '%)</title></circle>';
            });
            svg += '<text x="' + center + '" y="' + (center - 2) + '" text-anchor="middle" fill="var(--text)" font-size="16" font-weight="bold">' + total + '</text>';
            svg += '<text x="' + center + '" y="' + (center + 12) + '" text-anchor="middle" fill="var(--muted)" font-size="7">THREATS</text>';
            svg += '</svg>';
            const legend = entries.slice(0, 5).map(([cat, count], i) => {
                const color = CAT_COLORS[i % CAT_COLORS.length];
                const emoji = getCategoryEmoji(cat);
                return '<span style="display:inline-flex;align-items:center;gap:2px;font-size:0.65rem;"><span style="width:6px;height:6px;background:' + color + ';border-radius:1px;"></span>' + emoji + '</span>';
            }).join(' ');
            return '<div style="display:flex;flex-direction:column;align-items:center;">' + svg + '<div style="margin-top:6px;">' + legend + '</div></div>';
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelector('[data-tab="' + tabName + '"]').classList.add('active');
            document.getElementById(tabName).classList.add('active');
        }

        async function loadStatus() {
            const d = await api('/status');
            document.getElementById('totalRules').textContent = d.total_rules || 0;
            document.getElementById('activeCategories').textContent = d.active_categories || 0;
        }

        async function loadStats() {
            const d = await api('/stats');
            document.getElementById('threatsToday').textContent = d.threats_today || 0;

            // Severity donut
            if (d.by_severity) {
                document.getElementById('severityStats').innerHTML = createSeverityDonut(d.by_severity, 140);
            }

            // Category donut
            if (d.by_category) {
                document.getElementById('categoryStats').innerHTML = createCategoryDonut(d.by_category, 140);
            }

            // Top Vhosts with progress bars
            const vhostsEl = document.getElementById('topVhosts');
            if (d.top_vhosts) {
                let vhostData = Array.isArray(d.top_vhosts)
                    ? d.top_vhosts.map(v => ({host: v.host || v.vhost || v[0], count: v.count || v.threats || v[1] || 0}))
                    : Object.entries(d.top_vhosts).map(([h, c]) => ({host: h, count: typeof c === 'object' ? c.count || 0 : c}));
                const maxVhost = Math.max(...vhostData.map(v => v.count));
                const totalVhost = vhostData.reduce((s, v) => s + v.count, 0);
                vhostsEl.innerHTML = vhostData.slice(0, 6).map(v => {
                    const pct = totalVhost > 0 ? Math.round(v.count / totalVhost * 100) : 0;
                    const width = maxVhost > 0 ? Math.round(v.count / maxVhost * 100) : 0;
                    return '<div style="margin-bottom:8px;"><div style="display:flex;justify-content:space-between;font-size:0.8rem;"><span>' + getSiteEmoji(v.host) + ' ' + v.host + '</span><span style="color:var(--wall-light);">' + v.count + ' <span style="color:var(--muted);">(' + pct + '%)</span></span></div><div class="progress-bar"><div class="fill" style="width:' + width + '%;background:linear-gradient(90deg, var(--wall-light), var(--boot-light));"></div></div></div>';
                }).join('');
            }

            // Geomap
            renderGeomap(d);
        }

        function renderGeomap(d) {
            const geomarkers = document.getElementById('geomarkers');
            const geoLegend = document.getElementById('geoLegend');
            const countryPos = {
                'US': {x:22,y:38}, 'CN': {x:82,y:40}, 'RU': {x:72,y:28}, 'DE': {x:52,y:32},
                'FR': {x:50,y:35}, 'GB': {x:48,y:30}, 'BR': {x:28,y:62}, 'IN': {x:74,y:48},
                'JP': {x:92,y:38}, 'KR': {x:88,y:38}, 'AU': {x:88,y:72}, 'CA': {x:24,y:30},
                'NL': {x:51,y:30}, 'IT': {x:54,y:38}, 'ES': {x:47,y:40}, 'PL': {x:56,y:32},
                'IE': {x:46,y:30}, 'SG': {x:82,y:56}
            };

            if (d.top_ips && Object.keys(d.top_ips).length > 0) {
                const ipCountries = d.top_ips_countries || {};
                const countryThreats = {};
                Object.entries(d.top_ips).forEach(([ip, count]) => {
                    const cc = ipCountries[ip] || '';
                    if (cc) countryThreats[cc] = (countryThreats[cc] || 0) + count;
                });

                const target = {x: 50, y: 35};
                let totalThreats = 0;
                let svgContent = '<svg style="position:absolute;top:0;left:0;width:100%;height:120%;pointer-events:none;overflow:visible;" viewBox="0 0 100 120" preserveAspectRatio="none"><defs><filter id="glow"><feGaussianBlur stdDeviation="0.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>';
                let markers = '';
                let legendFlags = '';
                const entries = Object.entries(countryThreats).sort((a,b) => b[1] - a[1]).slice(0, 8);
                const flagSpacing = 100 / (entries.length + 1);
                const maxCountry = Math.max(...entries.map(e => e[1]));

                entries.forEach(([cc, count], idx) => {
                    totalThreats += count;
                    const pos = countryPos[cc] || {x:50,y:50};
                    const intensity = Math.max(0.3, count / maxCountry);
                    const arcColor = ARC_COLORS[idx % ARC_COLORS.length];
                    const strokeWidth = 0.4 + intensity * 1.2;
                    const size = Math.max(8, Math.min(20, 8 + intensity * 12));
                    const midX = (pos.x + target.x) / 2;
                    const dist = Math.sqrt(Math.pow(pos.x - target.x, 2) + Math.pow(pos.y - target.y, 2));
                    const arcHeight = Math.min(pos.y, target.y) - (dist * 0.35);
                    const pathId = 'arc' + idx;

                    svgContent += '<path id="' + pathId + '" d="M' + pos.x + ',' + pos.y + ' Q' + midX + ',' + arcHeight + ' ' + target.x + ',' + target.y + '" fill="none" stroke="' + arcColor + '" stroke-width="' + strokeWidth + '" opacity="0.7" filter="url(#glow)" stroke-linecap="round"/>';
                    
                    const missileCount = Math.min(4, Math.max(1, Math.floor(intensity * 4)));
                    for (let m = 0; m < missileCount; m++) {
                        const dur = 2.5 - intensity;
                        const delay = idx * 0.2 + m * dur / missileCount;
                        svgContent += '<circle r="' + (0.5 + intensity * 0.5) + '" fill="' + arcColor + '" filter="url(#glow)"><animateMotion dur="' + dur + 's" repeatCount="indefinite" begin="' + delay + 's"><mpath href="#' + pathId + '"/></animateMotion></circle>';
                    }

                    markers += '<div style="position:absolute;left:' + pos.x + '%;top:' + (pos.y * 0.85) + '%;transform:translate(-50%,-50%);z-index:5;"><div style="width:' + size + 'px;height:' + size + 'px;background:radial-gradient(circle,' + arcColor + ' 0%,' + arcColor + '60 50%,transparent 70%);border-radius:50%;animation:pulse ' + (1.5 - intensity * 0.7) + 's infinite;box-shadow:0 0 ' + (size * 1.2) + 'px ' + arcColor + ';"></div></div>';

                    const legendX = flagSpacing * (idx + 1);
                    legendFlags += '<div style="position:absolute;left:' + legendX + '%;top:100%;transform:translate(-50%,4px);text-align:center;z-index:10;"><div style="font-size:14px;filter:drop-shadow(0 0 4px ' + arcColor + ');">' + countryToFlag(cc) + '</div><div style="font-size:8px;color:' + arcColor + ';font-family:monospace;">' + count + '</div></div>';
                    svgContent += '<line x1="' + legendX + '" y1="106" x2="' + pos.x + '" y2="' + pos.y + '" stroke="' + arcColor + '" stroke-width="0.3" stroke-dasharray="1,1" opacity="0.4"/>';
                });

                markers += '<div style="position:absolute;left:' + target.x + '%;top:' + (target.y * 0.85) + '%;transform:translate(-50%,-50%);z-index:10;"><div style="width:18px;height:18px;border:2px solid #00ff41;border-radius:50%;animation:pulse 0.5s infinite;box-shadow:0 0 12px #00ff41;"></div><div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:5px;height:5px;background:#00ff41;border-radius:50%;"></div></div>';
                svgContent += '</svg>';
                geomarkers.innerHTML = svgContent + markers + legendFlags;
                geoLegend.innerHTML = '<span style="animation:pulse 1s infinite;">⚠</span> ' + totalThreats.toLocaleString() + ' INCOMING';
            } else {
                geomarkers.innerHTML = '<div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#00ff41;font-size:12px;">✓ SECURE</div>';
                geoLegend.innerHTML = '<span style="color:#00ff41;">● SECURE</span>';
            }
        }

        async function loadBans() {
            const d = await api('/bans');
            document.getElementById('activeBans').textContent = d.total || 0;
            const tbody = document.getElementById('bansTable');
            if (!d.bans || d.bans.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="color:var(--muted);">No active bans</td></tr>';
                return;
            }
            tbody.innerHTML = d.bans.slice(0, 10).map(b => {
                const ip = b.value || b.ip || '-';
                return '<tr><td>' + ip + '</td><td>' + countryToFlag(b.country || '') + '</td><td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;">' + (b.scenario || b.reason || '-') + '</td><td>' + (b.duration || '-') + '</td><td><button class="btn" onclick="unbanIp(\'' + ip + '\')">Unban</button></td></tr>';
            }).join('');
        }

        async function loadAlerts() {
            const d = await api('/alerts?limit=10&aggregate=true');
            const el = document.getElementById('alertsList');
            if (!d.alerts || d.alerts.length === 0) {
                el.innerHTML = '<p style="color:var(--muted);">No recent alerts</p>';
                return;
            }
            el.innerHTML = d.alerts.map(a => '<div style="display:flex;gap:1rem;align-items:center;padding:0.5rem 0;border-bottom:1px solid var(--glass-border);"><span style="font-size:1.2em;">' + countryToFlag(a.country || '') + '</span><span style="font-family:var(--font-mono);color:var(--root-light);">' + a.client_ip + '</span><span style="background:rgba(239,68,68,0.2);color:#ef4444;padding:2px 8px;border-radius:4px;font-size:0.75rem;">' + (a.max_severity || 'unknown') + '</span><span style="flex:1;color:var(--muted);font-size:0.8rem;overflow:hidden;text-overflow:ellipsis;">' + (a.count || 1) + ' alerts</span><button class="btn danger" onclick="banIpDirect(\'' + a.client_ip + '\')">Ban</button></div>').join('');
        }

        function banIpDirect(ip) { api('/ban', { method: 'POST', body: JSON.stringify({ ip, duration: '4h', reason: 'Manual ban' }) }).then(() => { loadBans(); loadStats(); }); }
        function unbanIp(ip) { api('/unban', { method: 'POST', body: JSON.stringify({ ip }) }).then(() => loadBans()); }

        async function refresh() { await Promise.all([loadStatus(), loadStats(), loadBans(), loadAlerts()]); }
        refresh();
        setInterval(refresh, 30000);
    </script>
</body>
</html>
