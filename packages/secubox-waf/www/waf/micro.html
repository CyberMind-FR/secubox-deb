  SecuBox #1237 — vue MICRO du pare-feu : la carte que le service sert lui-même.

  POURQUOI ELLE EXISTE. Le Hall composait cette carte à sa place — il lisait
  l'API, choisissait les libellés, dessinait les chiffres. C'est exactement ce
  qu'on a corrigé pour la radio : le service sait s'afficher, le Hall n'a pas à
  le redessiner. Une carte peinte par un tiers dérive de ce qu'elle représente,
  et il faut la corriger à deux endroits.

  ELLE TIENT DANS 252 px, la hauteur d'une carte de service, et rien de plus :
  quatre chiffres, les origines, un état. Ce qui demande à être étudié vit dans
  le tableau de bord, vers lequel elle mène.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pare-feu — vue micro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/hybrid-skin.css">
<style>
  /* PALETTE LOCALE, ET C'EST UNE CORRECTION (#1249).
     La carte s'en remettait à /shared/hybrid-skin.css, qui ne connaît NI
     data-theme NI prefers-color-scheme : le Hall posait bien l'attribut, et
     rien ne changeait. Pire, --cyan / --muted / --border n'y sont pas définis
     du tout — en sombre, un texte resté sombre sur une carte sombre.
     Les trois états sont donc écrits ici : :root nu = clair, la requête média
     pour l'état « système » (aucun attribut posé), et [data-theme] pour le
     choix explicite, qui doit gagner dans les DEUX sens. */
  :root { --fond:#ffffff; --texte:#1a1a22; --muted:#6b6b7a; --border:#e2e2ea;
          --cyan:#0f6f8c; --green:#0a7d2c; --red:#b7202c; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --fond:#14141c; --texte:#e8e6d9; --muted:#8a8a99;
            --border:#2a2a36; --cyan:#4fc3e8; --green:#3fbf6a; --red:#e8636f; }
  }
  :root[data-theme="dark"] { --fond:#14141c; --texte:#e8e6d9; --muted:#8a8a99;
          --border:#2a2a36; --cyan:#4fc3e8; --green:#3fbf6a; --red:#e8636f; }

  html, body { margin: 0; height: 100%; overflow: hidden; }
  /* Fond EXPLICITE : un corps transparent emprunte celui de l'hôte, et la
     carte se retrouve peinte dans un thème que son texte ne suit pas. */
  body { background: var(--fond); color: var(--texte); }
  /* Pas d'ascenseur : la vue est taillée pour tenir. Une barre le long du
     liseré signalerait un débordement qu'on ne veut pas voir. */
  html, body { scrollbar-width: none; }
  html::-webkit-scrollbar, body::-webkit-scrollbar { width: 0; display: none; }

  .mw { display: flex; flex-direction: column; height: 100%;
        padding: .75rem .85rem; box-sizing: border-box; gap: .5rem; }
  .tete { display: flex; align-items: baseline; gap: .45rem; }
  .tete .ic { font-size: 1.05rem; }
  .tete b { font-size: .92rem; }
  .tete .etat { margin-left: auto; font-family: 'Courier Prime', monospace;
                font-size: .58rem; letter-spacing: .09em; text-transform: uppercase;
                color: var(--green, #0a7d2c); display: inline-flex; align-items: center; gap: 4px; }
  .tete .led { width: 7px; height: 7px; border-radius: 50%;
               background: var(--green, #0a7d2c); display: inline-block; }
  .tete.ko .etat, .tete.ko .led { color: var(--red, #b7202c); background: initial; }
  .tete.ko .led { background: var(--red, #b7202c); }

  .drapeaux { font-size: 1.25rem; letter-spacing: .12em; line-height: 1; margin-bottom: .15rem; }
  .drapeaux .vide { font-size: .78rem; letter-spacing: 0; color: var(--muted); }

  /* Le `margin-top:auto` était sur les chiffres : il les collait au bas et
     creusait un vide au milieu de la carte. Il n'appartient qu'au lien, seul
     élément qui doit rester en pied. */
  .grille { display: grid; grid-template-columns: 1fr 1fr; gap: .4rem .6rem; }
  .m { display: flex; align-items: baseline; gap: .35rem; font-size: .76rem; }
  .m .n { font-family: 'Courier Prime', monospace; font-weight: 700;
          font-variant-numeric: tabular-nums; color: var(--cyan); font-size: .95rem; }
  .m .l { color: var(--muted); font-size: .66rem; }

  /* DERNIERES ATTAQUES (#1250). Quatre compteurs disent l'ampleur mais pas la
     vie : on ne sait pas si la derniere tentative date d'une minute ou d'hier.
     Trois lignes suffisent — au-dela, la carte devient un journal, et le
     journal a deja son tableau de bord. */
  .recent { display: flex; flex-direction: column; gap: .18rem; margin-top: .1rem; }
  .rl { display: flex; align-items: baseline; gap: .3rem; font-size: .66rem;
        line-height: 1.25; white-space: nowrap; }
  .rl .ic { flex: 0 0 auto; font-size: .74rem; }
  .rl .qui { font-family: 'Courier Prime', monospace; color: var(--texte);
             overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .rl .quoi { color: var(--muted); overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
  .rl .quand { margin-left: auto; flex: 0 0 auto; color: var(--muted);
               font-variant-numeric: tabular-nums; }
  .rl.ban .qui { color: var(--red); }
  .recent .vide { font-size: .66rem; color: var(--muted); }

  .lien { margin-top: auto; display: block; text-align: center; font-family: 'Courier Prime', monospace;
          font-size: .6rem; letter-spacing: .07em; text-transform: uppercase;
          color: var(--muted); text-decoration: none; padding-top: .35rem;
          border-top: 1px solid var(--border); }
  .lien:hover { color: var(--cyan); }
</style>

<div class="mw">
  <div class="tete" id="tete">
    <span class="ic">🛡️</span><b>Pare-feu</b>
    <span class="etat"><i class="led"></i><span id="etat">en veille</span></span>
  </div>

  <div class="drapeaux" id="origines"><span class="vide">origines en lecture…</span></div>

  <div class="grille">
    <div class="m"><span class="n" id="m-bans">—</span><span class="l">🚫 bannis</span></div>
    <div class="m"><span class="n" id="m-jour">—</span><span class="l">🛡️ ce jour</span></div>
    <div class="m"><span class="n" id="m-surf">—</span><span class="l">🛰️ surfaces</span></div>
    <div class="m"><span class="n" id="m-det">—</span><span class="l">🧠 détections</span></div>
  </div>

  <div class="recent" id="recent"><span class="vide">dernières tentatives…</span></div>

  <a class="lien" href="/" target="_top">📊 Tableau de bord</a>
</div>

<script>
  // Le Hall dit le thème par MESSAGE plutôt que de recharger le cadre (#1243) :
  // recharger couperait le son et remettrait le lecteur au début. On applique
  // sans rien recharger. Deux valeurs acceptées, comme pour le paramètre.
  // Le thème d'ARRIVEE vient du paramètre : sans cette lecture, la carte se
  // peint en clair et n'attend le sombre que jusqu'à la première bascule.
  {
    const t = new URLSearchParams(location.search).get('theme');
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
  }

  // RESTER DANS LE HALL (#1266). Un lien de cardlet en target="_top" REMPLACE
  // le Hall par le service : on perd la mosaique, la barre media et tout ce
  // qui joue. Encadre, on demande donc au Hall d'embarquer la page ; hors
  // cadre, le lien fonctionne normalement — la carte reste une page valide,
  // et c'est ce repli qui autorise a garder target="_top" dans le HTML.
  document.addEventListener('click', function (ev) {
    if (parent === window) return;
    var a = ev.target && ev.target.closest ? ev.target.closest('a[href]') : null;
    if (!a || ev.defaultPrevented || ev.button !== 0 || ev.metaKey || ev.ctrlKey) return;
    ev.preventDefault();
    try { parent.postMessage({ sbx: 'ouvre', id: 'waf', url: a.href }, '*'); } catch (e) {}
  }, true);

  addEventListener("message", ev => {
    const d = ev.data;
    if (!d || d.sbx !== "theme") return;
    if (d.theme === "dark" || d.theme === "light") {
      document.documentElement.setAttribute("data-theme", d.theme);
    }
  });

  const API = '/api/v1/waf';
  const nb = n => (Number(n) || 0).toLocaleString('fr-FR');

  // Code ISO → drapeau. Un code inconnu rend le globe plutôt qu'une paire de
  // caractères exotiques que personne ne reconnaît.
  function drapeau(c) {
    c = String(c || '').trim().toUpperCase();
    if (c.length !== 2 || !/^[A-Z]{2}$/.test(c)) return '🌍';
    return String.fromCodePoint(...[...c].map(l => 127397 + l.charCodeAt(0)));
  }

  async function json(chemin) {
    try {
      const r = await fetch(API + chemin, { headers: { 'Accept': 'application/json' } });
      return r.ok ? await r.json() : null;
    } catch (e) { return null; }
  }

  // Une categorie se lit d'un coup d'oeil ou pas du tout : l'emoji porte le
  // sens, le texte ne fait que le confirmer.
  const EMOJI = {
    robots: '🤖', scanners: '🔎', recon_crawler: '🕷️', honeypot: '🍯',
    'host_anomaly:unrouted': '🚧', 'host_anomaly:ip_literal': '🔢',
    sqli: '💉', xss: '⚡', traversal: '📁', bruteforce: '🔑',
    ssh: '🔐', smtp: '📮', imap: '📬'
  };
  const LIBELLE = {
    robots: 'robot', scanners: 'scan', recon_crawler: 'repérage',
    honeypot: 'leurre', 'host_anomaly:unrouted': 'nom inconnu',
    'host_anomaly:ip_literal': 'accès par IP', sqli: 'injection SQL',
    xss: 'script injecté', traversal: 'remontée de chemin', bruteforce: 'force brute'
  };
  const emoji = c => EMOJI[c] || EMOJI[String(c).split(':')[0]] || '⚠️';
  const libelle = c => LIBELLE[c] || LIBELLE[String(c).split(':')[0]] || String(c || 'anomalie');

  // Delai COURT et humain. « il y a 3 min » tient dans la ligne ; une date
  // complete la ferait deborder et n'apprendrait rien de plus a cette taille.
  function delai(iso) {
    const t = Date.parse(iso);
    if (!t) return '';
    const s = Math.max(0, (Date.now() - t) / 1000);
    if (s < 45) return "à l'instant";
    if (s < 3600) return 'il y a ' + Math.round(s / 60) + ' min';
    if (s < 86400) return 'il y a ' + Math.round(s / 3600) + ' h';
    return 'il y a ' + Math.round(s / 86400) + ' j';
  }

  // « local » est notre propre sonde interne : la montrer comme une tentative
  // ferait passer notre surveillance pour une attaque. On garde ce qui vient
  // vraiment de dehors, et on le dit si rien ne vient.
  function dehors(a) {
    const ip = String(a.client_ip || '');
    return ip && ip !== 'local' && ip !== '127.0.0.1' && ip !== '::1';
  }

  function rendRecent(alertes) {
    const box = document.getElementById('recent');
    const l = (alertes || []).filter(dehors).slice(0, 3);
    if (!l.length) { box.innerHTML = '<span class="vide">rien depuis dehors</span>'; return; }
    box.innerHTML = l.map(a => {
      const ban = a.action === 'banned';
      return '<span class="rl' + (ban ? ' ban' : '') + '">'
        + '<span class="ic">' + (ban ? '🚫' : emoji(a.category)) + '</span>'
        + '<span class="qui">' + esc(a.client_ip) + '</span>'
        + '<span class="quoi">' + esc(libelle(a.category)) + '</span>'
        + '<span class="quand">' + esc(delai(a.timestamp)) + '</span>'
        + '</span>';
    }).join('');
  }

  const esc = t => String(t == null ? '' : t).replace(/[&<>"]/g,
    c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  async function majour() {
    // On demande large et on filtre ici : les sondes internes occupent souvent
    // les toutes premieres lignes, et un limit=3 ne rendrait qu'elles.
    const [stats, bans, detec, alertes] = await Promise.all([
      json('/stats'), json('/bans'), json('/detections'), json('/alerts?limit=60')
    ]);
    const tete = document.getElementById('tete');
    const set = (id, v) => { const e = document.getElementById(id); if (e) e.textContent = v; };

    if (!stats) {
      // On ne prétend rien : un tiret, jamais un zéro. « 0 banni » sans avoir
      // pu demander rassurerait à tort.
      tete.classList.add('ko');
      set('etat', 'injoignable');
      ['m-bans', 'm-jour', 'm-surf', 'm-det'].forEach(i => set(i, '—'));
      document.getElementById('recent').innerHTML = '<span class="vide">—</span>';
      return;
    }
    tete.classList.remove('ko');
    set('etat', 'en veille');

    const pays = Object.keys(stats.pays || {}).filter(p => p && p !== 'LAN' && p !== '??').slice(0, 3);
    const org = document.getElementById('origines');
    org.innerHTML = pays.length
      ? pays.map(drapeau).join(' ')
      : '<span class="vide">pas encore d\'origine</span>';

    const detections = (detec && detec.detections) || [];
    set('m-bans', bans ? nb(bans.total) : '—');
    set('m-jour', nb(stats.threats_today));
    set('m-surf', String(Object.keys(stats.par_type || {}).length));
    set('m-det', detections.length ? detections.filter(d => d.actif).length : '—');

    rendRecent(alertes && alertes.alerts);
  }

  majour();
  // Une posture bouge en dizaines de minutes : interroger plus souvent
  // afficherait le même chiffre en chargeant la box.
  setInterval(majour, 60000);
</script>
