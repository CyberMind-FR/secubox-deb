location /api/v1/wazuh/ { proxy_pass http://unix:/run/secubox/aggregator.sock:/api/v1/wazuh/; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
location /wazuh/ { alias /usr/share/secubox/www/wazuh/; try_files $uri $uri/ /wazuh/index.html; }
