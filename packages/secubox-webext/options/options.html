<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SecuBox Companion — Settings</title>
  <style>
    body { font-family: ui-monospace, monospace; background: #0a0a0f; color: #e8e6d9; max-width: 560px; margin: 2rem auto; padding: 0 1rem; }
    h1 { color: #c9a84c; font-size: 1.2rem; }
    label { display: block; margin: 1rem 0 0.3rem; color: #6b6b7a; }
    input { width: 100%; padding: 8px; background: #16161f; color: #e8e6d9; border: 1px solid #2a2a3a; border-radius: 4px; font-family: inherit; }
    button { margin-top: 1.2rem; padding: 8px 16px; background: #16161f; color: #c9a84c; border: 1px solid #c9a84c; border-radius: 4px; cursor: pointer; font-family: inherit; }
    button:hover { background: #c9a84c; color: #0a0a0f; }
    .hint { font-size: 12px; color: #6b6b7a; }
    #saved { color: #00ff41; margin-left: 1rem; }
  </style>
</head>
<body>
  <h1>SecuBox Companion — Settings</h1>

  <label for="hubBase">Hub base URL</label>
  <input id="hubBase" type="url" placeholder="https://admin.gk2.secubox.in">
  <p class="hint">Base URL of your SecuBox dashboard (no trailing slash).</p>

  <label for="modules">Modules to monitor (comma-separated slugs)</label>
  <input id="modules" type="text" placeholder="hub, crowdsec, waf, peertube, photoprism, nextcloud">

  <label for="cookieEndpoint">PeerTube cookie-intake endpoint</label>
  <input id="cookieEndpoint" type="text" placeholder="/api/v1/peertube/import/cookies">

  <div><button id="save">Save</button><span id="saved"></span></div>

  <script src="options.js"></script>
</body>
</html>
