# Catalogue de secubox-webfilter : catégories et sources de listes publiques (#1962).
# AUCUNE liste n'est livrée avec le paquet : elles sont téléchargées par `secubox-webfilter-sync` (https seulement, taille plafonnée).
# Chaque licence est affichée dans le panneau. Phase 1 : seul le mode « observe » existe (rien n'est bloqué).

# Réseaux locaux auxquels s'applique le profil « defaut » (une vue d'Unbound pour tout le réseau ; les appareils assignés ont des entrées plus
# précises, et les appareils d'ad-guard gardent leur vue). VIDE par défaut : le paquet n'applique jamais les réseaux d'un autre site.
# Mettre ceux de VOTRE box, par exemple : lan = ["192.168.1.0/24", "2a01:db8:1:2::/64"]
[reseau]
lan = []

# Plafond de zones ajoutées à Unbound par webfilter (mémoire : environ 0,35 Ko par zone ; le puits d'ad-guard en porte déjà 656 704).
[limites]
zones_max = 1500000

# Appareils assignés à un profil (#3005). Un appareil garde dans la carte appliquée les adresses où on l'a vu pendant `retention_jours`
# (0 à 90 ; 0 = seulement la table de voisinage au moment de l'application) : un portable vu la veille en Wi-Fi reste dans sa vue même s'il
# est ailleurs à 04:00. Une adresse reprise par un autre appareil (bail réattribué) passe au dernier vu. Quand une adresse nouvelle d'un appareil
# assigné apparaît, le démon demande une application, au plus une fois toutes les `reapplication_min` minutes (5 à 1440), jamais pendant une
# application ou une compilation de secubox-dns-listes (une application complète coûte plusieurs minutes de charge).
[appareils]
retention_jours = 14
reapplication_min = 30

[[categorie]]
id = "adulte"
libelle = "Contenu adulte"
mode = "observe"
  [[categorie.source]]
  nom = "hagezi-nsfw"
  url = "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/nsfw-onlydomains.txt"
  format = "domaines"
  licence = "GPL-3.0"
  taille_max = 5000000

[[categorie]]
id = "jeux"
libelle = "Jeux d'argent"
mode = "observe"
  [[categorie.source]]
  nom = "hagezi-gambling-medium"
  url = "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/gambling.medium-onlydomains.txt"
  format = "domaines"
  licence = "GPL-3.0"
  taille_max = 12000000

[[categorie]]
id = "phishing"
libelle = "Phishing et malware"
mode = "observe"
  [[categorie.source]]
  nom = "blp-phishing"
  url = "https://blocklistproject.github.io/Lists/phishing.txt"
  format = "hosts"
  licence = "MIT"
  taille_max = 15000000
  [[categorie.source]]
  nom = "urlhaus"
  url = "https://urlhaus.abuse.ch/downloads/hostfile/"
  format = "hosts"
  licence = "conditions abuse.ch"
  taille_max = 1000000
