# webfilter API (socket propre du module : unité autonome, non servie par l'agrégateur)
location /api/v1/webfilter/ {
    proxy_pass http://unix:/run/secubox/webfilter.sock:/;
    include /etc/nginx/snippets/secubox-proxy.conf;
    proxy_intercept_errors on;
}
