# Dossier d'état réservé au compte du service : l'historique de navigation par appareil n'est lisible par aucun autre module (groupe secubox exclu).
d /var/lib/secubox/webfilter 0700 secubox-webfilter secubox-webfilter -
d /var/lib/secubox/webfilter/listes 0700 secubox-webfilter secubox-webfilter -
# La configuration des profils appartient au service (#3172) : écrite une fois par root en 0600, elle devenait illisible par l'API
# (503 sur /appareils, « rien n'est bloqué » sur la Vigie). `z` la rend au service si elle existe, à l'installation et à chaque démarrage.
z /var/lib/secubox/webfilter/config.json 0600 secubox-webfilter secubox-webfilter -
