# hall.gk2.net — surface publique WebOS (bureau numérique souverain, #1175).
# Écoute sur le port nginx partagé 9080 (comme bbs.gk2), fronté par HAProxy TLS.
# Sert la page statique du Hall + relaie l'API registre vers webos.sock
# (indépendant de l'agrégateur). CSP souveraine : aucune origine tierce
# (polices locales, pas de fetch externe).
# Amont PeerTube pour le relais de meme origine de la carte (#1273).
# nginx local : c'est lui qui sert les vhosts internes du parc.
upstream nginx_local { server 127.0.0.1:9080; }

# ── CE QUE LE HALL ACCEPTE D'ENCADRER (#1323) ──────────────────────────────
#
# C'ÉTAIT UNE LISTE À LA MAIN, ET ELLE NE POUVAIT PAS TENIR. Elle nommait
# vingt-deux origines ; la box en sert CENT QUATRE-VINGT-DOUZE. Cent
# soixante-douze de nos propres services étaient donc refusés par le Hall —
# dont metablogizer, constaté aujourd'hui, et l'immense majorité des sites
# metablog. Le symptôme est le pire qui soit : le cadre reste blanc, sans
# erreur visible ailleurs que dans la console du navigateur.
#
# CE N'ÉTAIT PAS UNE BARRIÈRE, C'ÉTAIT UN ACCIDENT DE MAINTENANCE : la liste
# admettait ce que quelqu'un avait pensé à y ajouter, pas ce qui relevait
# d'une décision. Et ce fichier se contredisait déjà — trois de ses locations
# (surfeur, SBX OS, cadre) employaient le joker depuis longtemps.
#
# LE JOKER N'ÉLARGIT RIEN DE RÉEL. Tout `*.gk2.secubox.in` est servi par CETTE
# board ; les origines du relais surf, qui portent du contenu tiers, y étaient
# déjà admises par les locations ci-dessous. Ce qui protège une page encadrée
# reste son propre `frame-ancestors`, côté serveur qui la sert — pas une liste
# tenue à la main du côté qui l'encadre. Voir le motif de la route déclarée par
# son propre paquet (secubox-waf-route) : même leçon, même remède.
#
# `www.youtube-nocookie.com` reste nommé : il est hors du domaine.

# Les services du domaine de CE Hall, encadrables par lui (#1691) : sur
# hall.gk3.secubox.in, https://*.gk3.secubox.in — la CSP ne nommait que gk2 et
# refusait radio, podcaster, mood et les webui d'admin de gk3.
map $host $sbx_cadres_box {
    # Le kiosque (#1668, #1695) : ses services sont en http sur la boucle
    # locale — l'administration encadrée en admin.localhost:9078 (console) ou
    # :9080. Le motif générique donnerait https://*.localhost, qui n'y répond pas.
    hall.localhost                 "http://*.localhost:9078 http://*.localhost:9080";
    ~^hall\.(?<sbx_cadre_dom>.+)$  "https://*.$sbx_cadre_dom";
    default                        "";
}

# Le mood du domaine de ce Hall, auquel le micro est délégué (#1680).
map $host $sbx_mood_du_hall {
    ~^hall\.(?<sbx_hall_dom>.+)$  "\"https://mood.$sbx_hall_dom\"";
    default                       "";
}

server {
    listen 9080;
    # CONSOLE LOCALE DU KIOSQUE (#1695). Le même Hall, sur un port de la seule
    # boucle locale : le kiosque ouvre http://hall.localhost:9078/. Ce port
    # n'ouvre rien de plus par lui-même : il offre /__console/jeton (plus bas),
    # que l'auth n'honore que pour une connexion appartenant au kiosque.
    listen 127.0.0.1:9078;
    # hall.localhost : l'entrée du KIOSQUE de la box (#1668). Chromium résout
    # *.localhost en boucle locale et le tient pour un contexte sûr ; le Hall y
    # est servi par CE vhost, relais et cartes compris — et non par la copie
    # montée sous /hall/ dans la console, où ses chemins absolus tombaient.
    # hall.* : le Hall de CETTE box sous son propre domaine (hall.gk3.secubox.in
    # relayé par gk2, #1670) — les noms exacts ci-dessus gardent la priorité.
    server_name hall.gk2.net hall.gk2.secubox.in hall.localhost hall.*;

    # JOURNAL PAR HÔTE (#1323). Le format `sbx_host` est défini par
    # secubox-metrics (/etc/nginx/conf.d/secubox-hosts-log.conf) — mais s'en
    # SERVIR demande une ligne par vhost, et celle-ci avait été ajoutée À LA
    # MAIN sur la board. Une modification locale d'un fichier de configuration
    # livré par un paquet, c'est une invite de dpkg à chaque mise à jour, et un
    # jour quelqu'un répond « garder l'ancien » : le correctif suivant ne
    # s'applique jamais. On l'inscrit donc là où elle aurait toujours dû être.
    access_log /var/log/nginx/secubox-hosts.log sbx_host;

    root /usr/share/secubox/www/hall;
    index index.html;

    # FLAG LAN (#1247) : on remplace le marqueur SBX_LAN_FLAG d'index.html par un
    # script qui retire `non-lan` de <html> quand le client est LAN. Les cartes
    # marquées `lan` (Lyrion) restent cachées aux clients WAN. $lan_client vient
    # de secubox-lan-geo.conf (secubox-hub). Portée serveur → couvre index.html
    # quel que soit le location qui le sert ; le marqueur n'existe qu'là.
    sub_filter_once on;
    sub_filter_types text/html;
    sub_filter '<!--SBX_LAN_FLAG-->' '<script>if("$lan_client"==="1"){document.documentElement.classList.remove("non-lan");}</script>';

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-src 'self' https://*.gk2.secubox.in $sbx_cadres_box https://www.youtube-nocookie.com; frame-ancestors 'none'; base-uri 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    # MICRO : accorde EXPLICITEMENT a cette origine seule (#1287, Lexie).
    # Sans en-tete, le navigateur l'autoriserait deja pour un document de
    # premier niveau de meme origine — mais une permission accordee par
    # defaut silencieux est une permission que personne n'a relue. La camera
    # est fermee au passage : le Hall n'en a aucun usage.
    # LE MICRO SE DÉLÈGUE, IL NE SE SUPPOSE PAS (#1323). `microphone=(self)`
    # n'autorise que l'origine du Hall : une carte encadrée depuis un AUTRE
    # hôte — sbxos-audio-mood vit sur mood.gk2.secubox.in — se voyait refuser la
    # permission AVANT même qu'on demande quoi que ce soit à l'utilisateur.
    # Le symptôme est trompeur : ça ressemble à un bug de code, pas à une
    # politique. On nomme donc l'origine, et elle seule ; l'utilisateur garde
    # évidemment le dernier mot, c'est lui qui accorde ou refuse.
    # + le mood du domaine de CE Hall (hall.gk3 → mood.gk3, #1680).
    add_header Permissions-Policy "microphone=(self \"https://mood.gk2.secubox.in\" $sbx_mood_du_hall), camera=()" always;
    add_header Referrer-Policy "same-origin" always;

    # CANONICALISATION (#1239) : hall.gk2.net -> hall.gk2.secubox.in. Depuis .net,
    # les cardlets *.gk2.secubox.in sont CROSS-SITE (Firefox les bloque : Local
    # Network Access + partitionnement d'etat). Sur .secubox.in ils sont
    # SAME-SITE et tout fonctionne, meme en prive. Une origine canonique.
    if ($host = hall.gk2.net) { return 301 https://hall.gk2.secubox.in$request_uri; }

    location = / { try_files /index.html =404; }

    # ROBOTS.TXT EXPLICITE (#1871). Sans lui, le repli du Hall rendait sa PAGE
    # HTML en 200 : aucune directive lisible par un robot. Politique publique,
    # sans exception WAF ni liste d'IP.
    location = /robots.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files /robots.txt =404;
    }

    location /fonts/ {
        alias /usr/share/secubox/www/hall/fonts/;
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # ── GABARIT DES RELAIS (#1609, #1608) ──────────────────────────────────
    #
    # LE HALL PORTE LA CLÉ DE L'APPAREIL : un relais posé ici parle au nom de
    # cette origine. Chaque `location` qui mandate (`proxy_pass`) suit donc le
    # même gabarit, et scripts/verifie-relais-hall.py le vérifie en CI.
    #
    # 1. IL RÉÉCRIT LUI-MÊME LES EN-TÊTES D'ORIGINE. nginx n'hérite d'AUCUN
    #    `proxy_set_header` du niveau serveur dès qu'un `location` en pose un
    #    seul : la ligne se répète donc bloc par bloc, sans exception.
    #        proxy_set_header X-SecuBox-LAN   $lan_client;
    #        proxy_set_header X-Real-IP       $remote_addr;
    #        proxy_set_header X-Forwarded-For $remote_addr;
    #    `$remote_addr` est déjà résolu par real_ip (secubox-lan-geo.conf) :
    #    c'est l'adresse du client, et le Hall est le dernier mandataire. Un
    #    module qui lit la première entrée de X-Forwarded-For lit donc elle.
    #
    # 2. UNE IDENTITÉ NE SE DÉCLARE PAS. Les en-têtes qu'un module tient pour
    #    acquis (X-Sbx-User*, X-Sbx-Vue, X-Acces-Racine…) sont vidés, ou posés
    #    par le relais lui-même — jamais transmis tels que le client les envoie.
    #
    # 3. UN RELAIS DE LECTURE SE NOMME `# relais: lecture` et n'ouvre que ce
    #    que les cartes lisent : location exacte (`=`) ou expression ancrée
    #    (`^…$`) qui énumère les chemins, et `limit_except GET { deny all; }`.
    #    Un préfixe ouvrirait chaque GET du module, y compris ceux qu'aucune
    #    carte n'emploie.

    # Registre normalisé — socket dédié, jamais l'agrégateur.
    # UNE SEULE ROUTE DU PARE-FEU, ET RIEN D'AUTRE (#1272). Le Hall a besoin de
    # l'inventaire des temoins pour le menu profil ; sa CSP impose
    # `connect-src 'self'`, donc l'appel doit etre de meme origine. On expose
    # `= /api/v1/waf/cookies` a l'exclusion de tout le reste de l'API du
    # pare-feu : un `location /api/v1/waf/` ouvrirait bans, regles et
    # detections sur le vhost du Hall.
    # RELAIS DES ETATS DE MODULES (#1286). Les widgets d'acces rapide lisent
    # `/api/v1/<module>/status` de la console d'administration, qui vit sur un
    # autre vhost : la CSP du Hall impose `connect-src 'self'`, donc l'appel
    # doit etre de meme origine.
    #
    # LA LISTE EST FERMEE, module par module. `^/adm/api/v1/.*` aurait ouvert
    # TOUTE l'API d'administration sur le vhost du Hall — y compris ce qui
    # ecrit. Ici, trois noms, et seulement `/status`, qui ne fait que lire.
    location ~ ^/adm/api/v1/(droplet|torrent|ytsas)/status$ {
        # relais: lecture
        limit_except GET { deny all; }
        rewrite ^/adm/(.*)$ /$1 break;
        proxy_pass http://nginx_local;
        proxy_set_header Host admin.gk2.secubox.in;
        proxy_set_header X-SecuBox-LAN   $lan_client;   # verdict LAN (#1351)
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 10s;
    }

    # RELAIS PEERTUBE (#1273). PeerTube est un logiciel AMONT : on ne lui ajoute
    # pas de vue /micro, sa carte vit donc dans le Hall. Mais la CSP du Hall
    # impose `connect-src 'self'` et `img-src 'self'` : sans relais, ni l'API ni
    # les vignettes ne chargeraient. Relacher ces deux directives pour une carte
    # couterait bien plus cher que ce relais.
    #
    # On relaie ce qui est PUBLIC et rien d'autre : le catalogue, les vignettes
    # et le lecteur d'embarquement. Pas /api/v1/users, pas /api/v1/oauth.
    # LE HALL BLOQUAIT SA PROPRE CARTE (#1274). Sa politique declare
    # `frame-ancestors 'none'` — ce qui est juste : personne ne doit encadrer le
    # Hall. Mais la carte PeerTube est servie par CE MEME vhost, et le Hall
    # l'encadre : le navigateur la refusait, avec raison.
    #
    # `add_header` dans un `location` REMPLACE ceux herites, jamais ne les
    # complete : la politique est donc reecrite ici en entier, a un mot pres.
    # Seul /cardlets/ est concerne — la page du Hall reste inencadrable.
    # LA CARTE SURF CADRE DES ORIGINES surf-*.gk2.secubox.in, dynamiques par
    # nature : sa CSP doit les autoriser en bloc (#1337). Location dediee AVANT
    # `location /cardlets/`, sinon la CSP generique — a liste fixe — la
    # bloquerait. `*.gk2.secubox.in` ne couvre que NOS origines, toutes servies
    # par la box.
    location = /cardlets/surf.html {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-src 'self' https://*.gk2.secubox.in $sbx_cadres_box; frame-ancestors 'self'; base-uri 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # FREEBOX TV (#1238) : la cardlet joue du HLS via hls.js (MSE → flux `blob:`),
    # qui fetch les segments .ts en même origine. Sa CSP doit donc autoriser
    # `media-src blob:` et `connect-src blob:` — la CSP générique des cartes ne le
    # fait pas. Location dédiée AVANT `location /cardlets/` (même motif que surf).
    location = /cardlets/freeboxtv.html {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self' blob:; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # VOIX — VoiceStudio (#1917). La carte lit l'audio synthétisé comme un blob: (URL.createObjectURL) : la CSP
    # générique des cartes (`default-src 'self'`) refuse ce média, il lui faut `media-src blob:`. Location
    # dédiée AVANT `location /cardlets/` (même motif que freeboxtv et surf). Pas de `connect-src` étranger :
    # elle ne parle qu'à /api/v1/voicestudio/usager/ de CETTE origine.
    location = /cardlets/voicestudio.html {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location /cardlets/ {
        # Une carte est une vue vivante (#1298) : le cache heuristique du
        # navigateur y gardait des versions d'il y a des heures.
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-src 'self' https://*.gk2.secubox.in $sbx_cadres_box https://www.youtube-nocookie.com; frame-ancestors 'self'; base-uri 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ~ ^/pt/(api/v1/(videos|video-channels|video-playlists)|lazy-static|static|videos/embed|client)(/|$) {
        # POLITIQUE PROPRE AU LECTEUR, ET C'EST INDISPENSABLE (#1275).
        # `add_header` au niveau `server` s'applique AUSSI aux reponses
        # relayees : le lecteur de PeerTube recevait la politique du Hall, qui
        # ne declare pas `media-src`. `default-src 'self'` s'y substituait, et
        # les flux `blob:` du lecteur — HLS, P2P — etaient bloques. La vignette
        # s'affichait, la lecture ne demarrait jamais.
        #
        # On declare donc ici ce dont un LECTEUR a besoin, et rien de plus. Un
        # `add_header` dans un `location` remplace ceux herites : il suffit
        # d'en poser un pour que celui du Hall cesse de s'appliquer.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' blob: ws: wss:; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        rewrite ^/pt/(.*)$ /$1 break;
        proxy_pass http://nginx_local;
        proxy_set_header Host peertube.gk2.secubox.in;
        proxy_set_header X-SecuBox-LAN   $lan_client;   # verdict LAN (#1351)
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        # Le compte PeerTube se déduit de la session, sur le vhost de PeerTube
        # et nulle part ailleurs (#1562) : le Hall ne le transmet jamais.
        proxy_set_header X-Sbx-Peertube-User "";
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 20s;
    }

    # LE LECTEUR DEMANDE SES ASSETS A LA RACINE (#1322).
    # La page d'embarquement de PeerTube reference ses scripts en chemin
    # ABSOLU — `/client/…`, `/plugins/…` — sans savoir qu'elle est servie sous
    # `/pt/`. Ces requetes tombaient donc dans le `location /` du Hall, qui
    # rendait son index.html avec un code 200 : le navigateur recevait du HTML
    # la ou il attendait du JavaScript, le module ne se chargeait pas, et le
    # lecteur affichait « player is not compatible with your web browser ».
    #
    # Un 404 aurait ete plus lisible qu'un 200 de la mauvaise nature ; c'est ce
    # qui a rendu la panne opaque.
    #
    # On ouvre donc ces espaces a la racine. Le Hall n'en utilise aucun — il ne
    # sert que `/fonts/`, `/cardlets/`, `/medaillons/` et ses pages — donc rien
    # n'entre en collision.
    location ~ ^/(client|plugins|lazy-static|static)(/|$) {
        # Meme politique que le bloc `/pt/` ci-dessus, et pour la meme raison :
        # `add_header` dans un `location` remplace ceux herites du `server`.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' blob: ws: wss:; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        rewrite ^ $uri break;   # l'amont reçoit le chemin normalisé admis ci-dessus
        proxy_pass http://nginx_local;
        proxy_set_header Host peertube.gk2.secubox.in;
        proxy_set_header X-SecuBox-LAN   $lan_client;   # verdict LAN (#1351)
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Sbx-Peertube-User "";        # cf. bloc /pt/ (#1562)
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 20s;
    }

    location = /api/v1/waf/cookies {
        # relais: lecture
        limit_except GET { deny all; }
        proxy_pass http://unix:/run/secubox/waf.sock:/cookies;
        proxy_set_header X-SecuBox-LAN   $lan_client;   # verdict LAN (#1351)
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 15s;
    }

    # RELAIS DPI VIVANT (#1360). La carte DPI lit le trafic vivant, mais la CSP
    # du Hall impose `connect-src 'self'` : l'appel doit etre de meme origine. On
    # relaie donc les endpoints DPI de LECTURE vers le routeur PUBLIC AGREGE de
    # l'API DPI (secubox-dpi, dpi.sock), prefixe /pub : compteurs derives du
    # collector (protocoles / apps / categories / talkers / risques / usages /
    # sessions / pays), sans PII, en lecture seule. Meme posture que le socket
    # sbxdpi historique (aggregate, non nominatif, local) mais avec des DONNEES
    # REELLES — sbxdpi restant dark (distributeur nDPId non alimente). On reecrit
    # /api/v1/dpi/<x> -> /pub/<x>. GET UNIQUEMENT, pas de JWT (agrege). Les
    # ecritures (rules/accept, setup_mirred) ne passent PAS par ici : elles
    # restent sur l'API DPI complete derriere le JWT du portail d'admin.
    #
    # LES CINQ LECTURES DE LA CARTE, ET ELLES SEULES (#1609). La carte DPI et
    # sonde.js lisent stats, usage, suggestions, countries et clients ; un
    # préfixe ouvrait aussi tout ce que /pub gagnera demain.
    location ~ ^/api/v1/dpi/(stats|usage|suggestions|countries|clients)$ {
        # relais: lecture
        limit_except GET { deny all; }
        rewrite ^/api/v1/dpi/(.*)$ /pub/$1 break;
        proxy_pass http://unix:/run/secubox/dpi.sock;
        proxy_set_header X-SecuBox-LAN   $lan_client;   # verdict LAN (#1351)
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
    }

    # RELAIS ACTOR INTELLIGENCE (#1240) — GET-only, vers sbx-actord (SHADOW,
    # read-only), qui sert ses routes sous /api/v1/actor/ : le chemin passe tel
    # quel. La couche « Renseignement » du groupe Sécurité lit /stats et
    # /actors.
    #
    # DEUX NIVEAUX DE LECTURE (#1608). Le tableau agrégé (/stats) est public :
    # des compteurs, sans nom. Les acteurs et les campagnes demandent une
    # session SecuBox, vérifiée par l'agrégateur, et le relais pose
    # `X-Sbx-Vue: reduite` — la vue du Hall, sans les cibles internes ; la vue
    # complète reste celle de la console d'administration. La valeur est posée
    # sur CHAQUE relais actor, /stats compris : ce n'est jamais le client qui
    # choisit sa vue.
    #
    # /evidence et /feedback ne sont PAS relayés : les preuves et les retours
    # restent sur le vhost d'administration.
    location = /api/v1/actor/stats {
        # relais: lecture
        limit_except GET { deny all; }
        proxy_pass http://unix:/run/secubox/actor.sock:/api/v1/actor/stats;
        proxy_set_header X-SecuBox-LAN   $lan_client;   # verdict LAN (#1351)
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Sbx-Vue       reduite;       # contrat sbx-actord (#1608)
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
    }

    location ~ ^/api/v1/actor/(actors|actors/[A-Za-z0-9_-]+|campaigns)$ {
        # relais: lecture
        limit_except GET { deny all; }
        auth_request /__sbx_verifie_secubox;
        rewrite ^ $uri break;   # l'amont reçoit le chemin normalisé admis ci-dessus
        proxy_pass http://unix:/run/secubox/actor.sock;
        proxy_set_header X-SecuBox-LAN   $lan_client;   # verdict LAN (#1351)
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Sbx-Vue       reduite;       # contrat sbx-actord (#1608)
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
    }

    # RELAIS COFFRE (#1367 P4) — l'ÉTAT seulement, GET seulement, par
    # l'agrégateur : `vault` est un socket réservé (_SOCKETS_ADMIN), relayé aux
    # seuls administrateurs réels (401/403 sinon). Ouvrir, sceller, poser un
    # secret restent dans la console d'administration, où s'applique le second
    # facteur. Le relais ne parle jamais à vault.sock en direct : ce serait
    # contourner la garde.
    location = /api/v1/vault/etat {
        # relais: lecture
        limit_except GET { deny all; }
        proxy_pass http://unix:/run/secubox/aggregator.sock:/api/v1/vault/etat;
        proxy_set_header X-SecuBox-LAN   $lan_client;   # verdict LAN (#1351)
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
    }

    # ANNUAIRE DES CLÉS OPENPGP (#1738) — la personne publie ou retire SA clé
    # publique, et consulte celles de la box et des box liées. Le démon calcule
    # la personne depuis la session (require_personne) ; l'export signé pour
    # les box liées n'est PAS relayé ici (écoute :8799 seulement), et la marque
    # du maillage est vidée.
    location ~ "^/api/v1/openpgp/(moi|moi/cle|annuaire|annuaire/[0-9A-F]{40}\.asc)$" {
        limit_except GET POST DELETE { deny all; }
        rewrite ^ $uri break;   # l'amont reçoit le chemin normalisé admis ci-dessus
        proxy_pass http://unix:/run/secubox/aggregator.sock;
        proxy_set_header X-SecuBox-LAN   $lan_client;   # verdict LAN (#1351)
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-SecuBox-Maillage "";
        proxy_set_header Host $host;
        client_max_body_size 80k;
        proxy_read_timeout 20s;
    }

    # MON COFFRE (#1367 P5) — le compartiment de la PERSONNE de la session.
    # Lectures et écritures (la serrure voyage dans le corps des POST), par
    # l'agrégateur qui n'admet qu'une personne SBX OS ; le Coffre reconnaît
    # la personne lui-même et exige sa serrure à chaque valeur.
    location ~ ^/api/v1/vault/moi(/[A-Za-z0-9._/-]*)?$ {
        limit_except GET POST { deny all; }
        rewrite ^ $uri break;   # l'amont reçoit le chemin normalisé admis ci-dessus
        proxy_pass http://unix:/run/secubox/aggregator.sock;
        proxy_set_header X-SecuBox-LAN   $lan_client;   # verdict LAN (#1351)
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
        client_max_body_size 96k;
        proxy_read_timeout 15s;
    }

    # LA SESSION SE VÉRIFIE À L'AGRÉGATEUR, comme sur le vhost Nextcloud
    # (/sbx/entrer, #1562) : même route, même verdict. 200 = session vivante
    # (personne ou appareil admis), 401 = pas de session — nginx rend alors
    # 401 au client. Le mode tableau de bord n'ouvre rien ici : /auth/verify
    # ne connaît que la session.
    location = /__sbx_verifie_secubox {
        internal;
        proxy_pass http://unix:/run/secubox/aggregator.sock:/api/v1/auth/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI  $request_uri;
        proxy_set_header X-SecuBox-LAN   $lan_client;   # verdict LAN (#1351)
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 10s;
    }

    # SESSION DE LA CONSOLE LOCALE (#1695). Modèle de Gandalf : administration
    # par le WAN = second facteur ; à la console de la box = sans
    # authentification. « Local » ne peut pas vouloir dire 127.0.0.1 (HAProxy,
    # sbxwaf et tout processus de la box y arrivent aussi) : la session est liée
    # au KIOSQUE. Ici, trois choses que seul ce port peut dire à l'auth :
    #   · le port et l'hôte exacts — un autre hôte sur ce port serait une page
    #     piégée qui vise la boucle locale par rebond DNS ;
    #   · la connexion telle que nginx l'a acceptée ($realip_remote_*, jamais
    #     réécrite par un X-Forwarded-For) : l'auth la retrouve dans
    #     /proc/net/tcp et exige qu'elle appartienne au compte secubox-kiosk ;
    #   · le secret du port console (postinst, 0600 root). Fichier absent :
    #     pas d'en-tête, l'auth refuse. Fermé par défaut.
    location = /__console/jeton {
        if ($server_port != 9078) { return 404; }
        if ($host != "hall.localhost") { return 421; }
        proxy_pass http://unix:/run/secubox/aggregator.sock:/api/v1/auth/console/jeton;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host hall.localhost;
        # L'hôte vérifié, dans un en-tête à lui : l'agrégateur, quand il relaie
        # vers auth.sock, remplace Host par « localhost » (#1695).
        proxy_set_header X-SecuBox-Console-Hote $host;
        proxy_set_header X-SecuBox-Console-Paire "$realip_remote_addr:$realip_remote_port";
        proxy_set_header X-SecuBox-Console "";
        # Verdict LAN comme toute route de module (boucle locale : toujours vrai).
        proxy_set_header X-SecuBox-LAN $lan_client;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        include /etc/nginx/secubox-console/*.conf;
        add_header Cache-Control "no-store" always;
        proxy_read_timeout 10s;
    }

    # LA MÊME VÉRIFICATION, POUR LES SERVICES DE LA BOX EN CONTENEUR (#1665).
    # Le webmail (greffon secubox_sso, #1562) n'a pas d'auth_request : il
    # demande lui-même au Hall à qui est la session qu'on lui présente. Le 404
    # des API non relayées (#1609) lui répondait « personne » — le formulaire
    # revenait. Réservé au pont des conteneurs : ce n'est pas une API publique.
    location = /api/v1/auth/auth/verify {
        allow 10.100.0.0/24;
        allow 127.0.0.1;
        deny  all;
        proxy_pass http://unix:/run/secubox/aggregator.sock:/api/v1/auth/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI  "";
        proxy_set_header X-SecuBox-LAN   $lan_client;   # verdict LAN (#1351)
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 10s;
    }

    # RELAIS FREEBOX TV (#1238) — GET-only, même origine, vers le daemon
    # secubox-freeboxtv, qui sert à sa racine /channels, /hls/<cid>/live.m3u8,
    # /hls/<cid>/<seg> : le préfixe /api/v1/freeboxtv est retiré. Le manifeste
    # peut attendre le 1er segment (démarrage ffmpeg) → read-timeout large.
    #
    # USAGE PERSONNEL, RÉSEAU LOCAL SEULEMENT (#1608). Ce sont les chaînes de
    # TA Freebox, et chaque flux démarre un ffmpeg sur la box : une session
    # ouverte depuis l'extérieur ne suffit pas. Le verrou LAN est posé ici,
    # comme pour Lyrion et Zigbee.
    location = /api/v1/freeboxtv/channels {
        # relais: lecture
        if ($lan_client = 0) { return 403; }
        limit_except GET { deny all; }
        proxy_pass http://unix:/run/secubox/freeboxtv.sock:/channels;
        proxy_set_header X-SecuBox-LAN   $lan_client;   # verdict LAN (#1351)
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    # Le manifeste et ses segments : un identifiant de chaîne numérique, puis
    # un nom de fichier .m3u8 ou .ts — la même borne que le module (_SEG_RE).
    location ~ ^/api/v1/freeboxtv/hls/[0-9]+/[A-Za-z0-9_-][A-Za-z0-9._-]*\.(m3u8|ts)$ {
        # relais: lecture
        if ($lan_client = 0) { return 403; }
        limit_except GET { deny all; }
        rewrite ^/api/v1/freeboxtv/(.*)$ /$1 break;
        proxy_pass http://unix:/run/secubox/freeboxtv.sock;
        proxy_set_header X-SecuBox-LAN   $lan_client;   # verdict LAN (#1351)
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }

    # RELAIS PROFILES LIFECYCLES — GET-only, agrege, SANS JWT (meme posture que
    # dpi /pub). Source de verite UNIQUE (modules.d) : le Hall lit
    # {id, lifecycle, sleep_state} et met les cardlets des modules `on-demand`
    # en mode econome (sonde only-when-visible, cache si `asleep`, ne reveille
    # jamais en fond). Non-sensible ; l'API profiles complete (topologie, rss,
    # ecritures) reste derriere le JWT du portail sur /api/v1/profiles/status.
    # RELAIS MOSAÏQUE DES SITES (#1323) — GET-only, agrégé, SANS JWT. Sert la
    # carte « Mes sites » du Hall. On ne relaie PAS `/sites` : cette route
    # porte les chemins sur disque, les tailles et les sites non publiés,
    # quand le Hall est ouvert aux invités. `public/mosaique` ne rend que ce
    # qui est déjà public par construction — un site publié est un site que
    # n'importe qui peut ouvrir.
    #
    # EN-TÊTES ÉCRITS ICI, PAS PAR LE SNIPPET COMMUN (#1609). Dans
    # secubox-proxy.conf, la ligne du verdict LAN est ajoutée par le postinst
    # de secubox-core, et seulement si nginx l'accepte : ce qui est vrai sur une
    # box ne l'est pas forcément sur la suivante. Le Hall l'écrit donc lui-même,
    # comme partout ailleurs dans ce fichier. La carte est de même origine :
    # les en-têtes CORS du snippet n'y servaient à rien.
    location = /api/v1/metablogizer/public/mosaique {
        # relais: lecture
        limit_except GET { deny all; }
        proxy_pass http://unix:/run/secubox/metablogizer.sock:/public/mosaique;
        proxy_http_version 1.1;
        proxy_set_header Connection      "";
        proxy_set_header X-SecuBox-LAN   $lan_client;   # verdict LAN (#1351)
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 30s;
    }

    # Les VIGNETTES, servies DIRECTEMENT depuis le cache du shotter — comme le
    # fait déjà le vhost d'administration. Pas de détour par le module : ce
    # sont des fichiers déjà produits hors ligne, et 162 tuiles ne doivent pas
    # réveiller 162 fois une API. Motif d'expression régulière repris tel quel
    # de secubox-routes.d/metablogizer.conf : `[^./][^/]*` interdit le point
    # initial et la barre oblique, donc pas de remontée de chemin.
    location ~ ^/api/v1/metablogizer/site/([^./][^/]*)/screenshot$ {
        limit_except GET { deny all; }
        alias /var/cache/secubox/metablogizer/shots/$1/screenshot.png;
        # `default_type` : nginx typerait d'après l'extension de l'URI — qui
        # n'en a pas — et non d'après le fichier aliasé. Sans cela, un PNG part
        # en application/octet-stream et le navigateur ne l'affiche pas.
        default_type image/png;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }


    location = /api/v1/profiles/lifecycles {
        # relais: lecture
        limit_except GET { deny all; }
        proxy_pass http://unix:/run/secubox/profiles.sock:/api/v1/profiles/lifecycles;
        proxy_set_header X-SecuBox-LAN   $lan_client;   # verdict LAN (#1351)
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        # L'état d'une origine se constate côté serveur (réveil des vhosts),
        # il ne s'annonce pas : jamais transmis depuis le client.
        proxy_set_header X-SecuBox-Origin-Status "";
        proxy_set_header Host $host;
        # 30 s, ALIGNE SUR LE RELAIS DE REVEIL ci-dessous. A 10 s, le Hall
        # rendait 504 apres chaque redemarrage de `secubox-profiles` : la
        # reponse sort d'un cache (3 ms a chaud), mais un cache FROID se
        # recalcule dans la requete — 3,8 s mesurees sur gk2 a vide, et
        # davantage sous charge, cette board passant ses journees au-dessus de
        # 4 de load. Le budget etait donc de moins de 3x le cout a froid pour
        # une page que le navigateur rappelle en boucle.
        proxy_read_timeout 30s;
    }

    # RELAIS RÉVEIL — POST-only, AUTHENTIFIÉ (le JWT du portail est validé par
    # l'API profiles elle-même : require_jwt sur POST /wake). Le Hall n'affiche
    # le bouton « réveiller » qu'en session ouverte et envoie Authorization:
    # Bearer <sbx_token>. Wake-seul : /sleep et /lifecycle NE sont PAS relayés
    # ici (ils restent derrière le portail admin). L'en-tête Authorization est
    # transmis tel quel (nginx ne le retire pas).
    location = /api/v1/profiles/wake {
        limit_except POST { deny all; }
        proxy_pass http://unix:/run/secubox/profiles.sock:/api/v1/profiles/wake;
        proxy_set_header X-SecuBox-LAN   $lan_client;   # verdict LAN (#1351)
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-SecuBox-Origin-Status "";    # cf. /lifecycles
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    # RELAIS LYRION — LAN-only (#1247). L'API de contrôle du parc (secubox-lyrion
    # → JSON-RPC LMS) vit sur lyrion.sock, à la RACINE (/players, /now-playing,
    # /player/{id}/action/{verbe}…), relayée en même origine (CSP connect-src
    # 'self'). La carte Lyrion est cachée aux clients WAN (data-lan) ; on refuse
    # AUSSI le relais côté serveur pour qu'un client WAN ne pilote pas en tapant
    # l'API directement. $lan_client vient de secubox-lan-geo.conf (secubox-hub).
    #
    # PAR L'AGREGATEUR, PAS PAR lyrion.sock (#1323). Le module est `on-demand` :
    # son unite dort, et le socket n'existe alors plus. Ce relais rendait donc
    # 502 en boucle — 877 requetes sur la seule matinee du 2026-09-23, la barre
    # media sondant `now-playing` en continu — et rien ne le reveillait, le
    # waker n'agissant que sur les vhosts de sites. L'agregateur repond
    # toujours, et sans allumer le LXC : afficher « rien ne joue » n'exige pas
    # de demarrer un serveur de musique. Le chemin complet passe tel quel :
    # c'est l'agregateur qui demultiplexe, pas le socket du module.
    #
    # CE QUE LA CARTE EMPLOIE, ET RIEN D'AUTRE (#1609). Deux lectures
    # (/players, /now-playing) et quatre gestes sur un lecteur (action,
    # volume, play-url, power). Le reste de l'API — rescan, sync, médiathèque,
    # mise à jour — reste sur le vhost d'administration.
    location ~ ^/api/v1/lyrion/(players|now-playing)$ {
        # relais: lecture
        if ($lan_client = 0) { return 403; }
        limit_except GET { deny all; }
        rewrite ^ $uri break;   # l'amont reçoit le chemin normalisé admis ci-dessus
        proxy_pass http://unix:/run/secubox/aggregator.sock;
        proxy_set_header X-SecuBox-LAN   $lan_client;   # verdict LAN (#1351)
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
        proxy_read_timeout 12s;
    }

    location ~ ^/api/v1/lyrion/player/[^/]+/(action/[a-z]+|volume|play-url|power)$ {
        if ($lan_client = 0) { return 403; }
        limit_except POST { deny all; }
        rewrite ^ $uri break;   # l'amont reçoit le chemin normalisé admis ci-dessus
        proxy_pass http://unix:/run/secubox/aggregator.sock;
        proxy_set_header X-SecuBox-LAN   $lan_client;   # verdict LAN (#1351)
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
        proxy_read_timeout 12s;
    }

    # RELAIS ZIGBEE — LAN-only (#1365). Meme posture que Lyrion, et pour la meme
    # raison : la carte pilote des appareils PHYSIQUES. Elle est deja masquee aux
    # clients WAN (data-lan), mais ce masquage n'est que de l'affichage — on
    # refuse donc AUSSI ici, sans quoi il suffirait d'appeler l'API a la main
    # depuis l'exterieur pour eteindre les lumieres de la maison.
    #
    # DEUX VERROUS, PAS UN. Le LAN dit d'ou l'on appelle ; le module dit QUI
    # appelle — `require_lecture` sur la lecture, `require_jwt` sur l'ecriture,
    # validee par l'API elle-meme (meme montage que le relais reveil). L'en-tete
    # Authorization est transmis tel quel.
    #
    # Le module ecoute a la RACINE de zigbee.sock (cf. sa propre location
    # canonique, qui reecrit /api/v1/zigbee/<x> -> /<x>) : on fait pareil.
    # Le delai est genereux — une lecture interroge six appareils par radio, et
    # une commande attend que l'appareil confirme.
    #
    # DEUX CHEMINS, CEUX DE LA CARTE ET DE LA LAMPE DU HALL (#1608). Lire les
    # appareils, et commander l'un d'eux — la commande reste gardée par le
    # module (jeton exigé). Sauvegardes, accès, composants et état restent sur
    # le vhost d'administration.
    location = /api/v1/zigbee/devices {
        # relais: lecture
        if ($lan_client = 0) { return 403; }
        limit_except GET { deny all; }
        proxy_pass http://unix:/run/secubox/zigbee.sock:/devices;
        proxy_set_header X-SecuBox-LAN   $lan_client;   # verdict LAN (#1351)
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
        proxy_read_timeout 20s;
    }

    location ~ ^/api/v1/zigbee/devices/[^/]+/set$ {
        if ($lan_client = 0) { return 403; }
        limit_except POST { deny all; }
        rewrite ^/api/v1/zigbee/(.*)$ /$1 break;
        proxy_pass http://unix:/run/secubox/zigbee.sock;
        proxy_set_header X-SecuBox-LAN   $lan_client;   # verdict LAN (#1351)
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
        proxy_read_timeout 20s;
    }

    # FOURNISSEUR OPENID CONNECT (#1589) : /oidc/ → secubox-oidc, servi par
    # l'agrégateur. Le témoin de session SecuBox arrive ici — c'est ce qui
    # permet à PhotoPrism, Mastodon… d'ouvrir le compte de la personne sans
    # mot de passe. Découverte, JWKS, token et userinfo sont aussi appelés
    # serveur-à-serveur par ces services.
    location /oidc/ {
        proxy_pass http://unix:/run/secubox/aggregator.sock:/api/v1/oidc/;
        proxy_set_header X-SecuBox-LAN $lan_client;   # verdict LAN (#1351)
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/v1/webos/ {
        proxy_pass http://unix:/run/secubox/webos.sock:/api/v1/webos/;
        proxy_set_header X-SecuBox-LAN $lan_client;   # verdict LAN (#1351)
        proxy_http_version 1.1;
        # Téléversements Nextcloud SANS limite : pas de plafond de corps, et on
        # STREAME la requête vers le backend (pas de tampon disque intégral).
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # L'adresse du client, seule : le module la transmet au dépôt, qui lit
        # la première entrée (cf. gabarit en tête de fichier).
        proxy_set_header X-Forwarded-For $remote_addr;
        # LE PROTOCOLE VIENT DE HAPROXY, PAS DE NOUS (#1269). nginx est un
        # hop INTERNE en clair : `$scheme` y vaut toujours « http », et le
        # module en concluait qu'il servait en clair — permaliens en http://,
        # `_secure()` faux, cookies retombes en SameSite=Lax. HAProxy pose
        # l'en-tete sur ses deux frontends, on le transmet tel quel.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_intercept_errors on;
    }

    # LE VIEWER PARLE AU SAS (#1237). Le lecteur du Hall appelle ytsas en
    # MEME ORIGINE (resolve/list/stream/conserve) : sans ca, `/api/v1/ytsas/`
    # tombe dans le `location /` et rend l'index.html, et la CSP connect-src
    # 'self' interdit d'appeler ytsas.gk2 en cross-origine. On proxifie la
    # SEULE route ytsas vers son LXC (meme adresse que secubox-ytsas), sans
    # tirer tout secubox-routes.d (qui exposerait 100+ API sur cette origine).
    location /api/v1/ytsas/ {
        rewrite ^ $uri break;   # l'amont reçoit le chemin normalisé admis ci-dessus
        proxy_pass http://10.100.0.180:8091;
        proxy_http_version 1.1;
        proxy_set_header X-SecuBox-LAN   $lan_client;   # verdict LAN (#1351)
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_buffering off;               # le /stream sert de la video en flux
        proxy_read_timeout 300s;
    }

    # RELAIS ZIA — le chatbot du Hall en MÊME ORIGINE (cardlet Messagerie, CSP
    # connect-src 'self'). On réplique le strip de zia.conf (/api/v1/zia/ → /) :
    # l'app sert /v1/chat, /health. Lecture publique ; ZIA ne parle qu'au bus.
    location /api/v1/zia/ {
        proxy_pass http://unix:/run/secubox/zia.sock:/;
        proxy_set_header X-SecuBox-LAN   $lan_client;   # verdict LAN (#1351)
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;            # le modèle peut mettre quelques secondes
    }

    # VOIX — Lexie (#1287). Le Hall n'inclut PAS secubox-routes.d : il expose ses
    # API une par une, et c'est voulu — un include global ouvrirait ici tout ce
    # qu'un module déclare ailleurs. Sans ce bloc, /api/v1/voice/ retombait sur
    # le repli SPA et rendait l'index du Hall avec un 200, ce qui est pire qu'un
    # 404 : le client croit avoir une réponse.
    location /api/v1/voice/ {
        proxy_pass http://unix:/run/secubox/voice.sock:/;
        proxy_set_header X-SecuBox-LAN   $lan_client;   # verdict LAN (#1351)
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;

        # UN ENVOI AUDIO N'EST PAS UNE SOUMISSION DE FORMULAIRE. Le défaut nginx
        # (1 Mo) rejetterait une commande de quelques secondes avec un 413 que
        # personne ne sait interpréter. On s'aligne sur le garde-fou du service
        # (audio_max_mo = 10) plutôt que de laisser deux limites diverger.
        client_max_body_size 12m;

        # La synthèse charge son modèle à chaque appel — choix assumé : la box
        # n'a pas la RAM pour le garder résident. 60 s couperaient la première
        # phrase de la journée, celle qui paie le chargement.
        proxy_read_timeout 180s;
    }

    # VOICESTUDIO — l'ÉTAT minimal pour la carte d'administration (#1917). UNE seule route, en correspondance EXACTE :
    # /status est la lecture gardée (require_lecture) qui ne rend que installé / actif / endormi / opération — ni adresse,
    # ni IP du conteneur, ni commit, ni clé. Tout le reste de l'administration (/detail, /cle, /journal…) n'est pas relayé.
    location = /api/v1/voicestudio/status {
        proxy_pass http://unix:/run/secubox/voicestudio.sock:/status;
        proxy_set_header X-SecuBox-LAN   $lan_client;   # verdict LAN (#1351)
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    # VOICESTUDIO — facette d'USAGER (#1917). Le Hall n'inclut pas secubox-routes.d : on n'ouvre ICI que le
    # préfixe /usager/ du module, et rien d'autre. Les routes d'administration (/detail, /cle, /journal,
    # /start…) ne sont donc PAS joignables sur l'origine du Hall, même à la main ; elles restent sur la
    # console d'administration, derrière require_jwt. Les routes /usager/ exigent une personne connectée
    # (require_personne) : la session du Hall suffit, sans jeton à gérer côté carte.
    # Socket absente (module non installé sur cette box) : nginx répond 502, que la carte sait lire.
    location ^~ /api/v1/voicestudio/usager/ {
        proxy_pass http://unix:/run/secubox/voicestudio.sock:/usager/;
        proxy_set_header X-SecuBox-LAN   $lan_client;   # verdict LAN (#1351)
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;

        # Un envoi audio n'est pas une soumission de formulaire (défaut nginx : 1 Mo) : on s'aligne sur le
        # garde-fou du module (limites.audio_max_mo = 10).
        client_max_body_size 12m;

        # Le premier appel d'un moteur endormi paie le démarrage à froid puis la synthèse : ≈ 110 s mesurés sur gk3 ; le module attend 300 s,
        # le relais 330 s (et le frontal public 10 min) : le plus court des trois ne doit pas être le relais.
        proxy_read_timeout 330s;
    }

    # ── SBX OS EST SERVI PAR LE HALL (#1353) ──────────────────────────────
    #
    # Il l'était par admin.gk2, et c'était un contresens sur les deux : le
    # panneau d'administration doit rester INTERNE, et SBX OS est la porte
    # publique — le Hall qui tient dans la poche.
    #
    # LA CONSÉQUENCE TECHNIQUE EST CE QUI TRANCHE. La clé privée de l'appareil
    # vit dans IndexedDB, rangée PAR ORIGINE. Servi depuis admin.gk2, SBX OS ne
    # voyait pas la clé créée par la carlette d'accès sur hall.gk2 : deux
    # identités pour un seul appareil, et une ouverture automatique impossible.
    # Servi ici, il partage le stockage de la carlette — l'appareil admis entre
    # sans rien redemander.
    location /sbxos/ {
        alias /usr/share/secubox/www/sbxos/;
        index index.html;
        # ENCADRABLE PAR LE HALL (#1293) : un `add_header` REMPLACE ceux du
        # serveur, donc la CSP, Permissions-Policy et Referrer-Policy se
        # réécrivent entières ici (#1606). 'unsafe-inline' pour les scripts ne
        # vaut que pour le SBX OS classique ; Aurora a sa location stricte.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; worker-src 'self' blob:; frame-src 'self' https://*.gk2.secubox.in $sbx_cadres_box; frame-ancestors 'self'; form-action 'self'; object-src 'none'; base-uri 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Permissions-Policy "microphone=(self), camera=()" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Cache-Control "no-cache" always;
        # Interrupteur de retour arrière (secubox-sbxosctl, P13) : un glob vide
        # ne coûte rien.
        include /etc/nginx/secubox-sbxos-mode.d/*.conf;
        # Repli SPA : une route inconnue rend la coquille, qui décide ensuite.
        try_files $uri $uri/ /sbxos/index.html;

        # Version de l'application : toujours fraîche (avant la règle des fichiers).
        location ~ ^/sbxos/version\.json$ {
            root /usr/share/secubox/www;
            default_type application/json;
            add_header Cache-Control "no-store" always;
        }

        # MAIS PAS POUR LES FICHIERS : une extension absente doit échouer en
        # 404, jamais ressortir en text/html avec 200.
        location ~ ^/sbxos/.+\.(?:png|jpe?g|webp|avif|svg|ico|css|js|mjs|json|webmanifest|woff2?|mp4|webm|ogg|opus|mp3|wasm|txt)$ {
            # `root` ET NON `alias $variable` : avec une variable, nginx perd
            # l'extension et retombe sur `default_type`.
            root /usr/share/secubox/www;
            include /etc/nginx/mime.types;
            default_type application/octet-stream;
            # Compression des seuls fichiers statiques : jamais au niveau du
            # serveur, où elle toucherait des réponses d'API porteuses de jetons.
            gzip on;
            gzip_static on;
            gzip_types text/css application/javascript application/json application/manifest+json text/plain;
        }

        # Le service worker ne doit JAMAIS être mis en cache par le navigateur.
        location = /sbxos/offline/sw.js {
            alias /usr/share/secubox/www/sbxos/offline/sw.js;
            default_type application/javascript;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Service-Worker-Allowed "/sbxos/" always;
            add_header Content-Security-Policy "default-src 'self'" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Interrupteur d'arrêt du worker et version : toujours frais.
        location = /sbxos/offline/kill.json {
            alias /var/lib/secubox/sbxos/kill.json;
            default_type application/json;
            add_header Cache-Control "no-store" always;
        }

        location = /sbxos/manifest.webmanifest {
            alias /usr/share/secubox/www/sbxos/manifest.webmanifest;
            default_type application/manifest+json;
            add_header Cache-Control "no-cache" always;
        }
    }

    # ── AURORA, APERÇU (#1611) : application construite, CSP STRICTE ──────
    # Aucun script en ligne sauf le drapeau LAN injecté par sub_filter, dont
    # les deux variantes ("1" et "0") sont autorisées par empreinte. Réservé au
    # LAN pendant l'aperçu.
    location ^~ /sbxos/aurora/ {
        if ($lan_client = 0) { return 403; }
        alias /usr/share/secubox/www/sbxos/aurora/;
        index index.html;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-Fkfsz3sIGRHqr45hKjWk4mlczQUmhszeh9IPdmy+j84=' 'sha256-W+RMonBmiQSY1DqW/TQ1rCemSzRmzsv9Y+WP0r+9IdI='; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; worker-src 'self' blob:; frame-src 'self' https://*.gk2.secubox.in $sbx_cadres_box; frame-ancestors 'self'; form-action 'self'; object-src 'none'; base-uri 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Permissions-Policy "microphone=(self), camera=()" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Cache-Control "no-cache" always;
        # Aurora navigue par ?espace= : pas de repli SPA (alias + try_files
        # vers un URI boucle), seulement le fichier ou l'index du dossier.
        try_files $uri $uri/ =404;
    }

    # Fichiers à nom haché de l'application construite : immuables.
    location ^~ /sbxos/assets/ {
        alias /usr/share/secubox/www/sbxos/assets/;
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
        gzip_static on;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'self'" always;
    }

    # Art du SDK (icônes, personnages, décors).
    location ^~ /sbxos/art/ {
        alias /usr/share/secubox/www/sbxos/art/;
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ZIA SUR CETTE ORIGINE (#1658) : sa carte et sa page plein écran, servies
    # par le Hall pour que la saisie vocale partage la session et le micro
    # (micro=(self)). Sans cette location, /zia/ tombait sur le repli SPA et la
    # carte affichait… le Hall. Encadrable par le Hall seulement.
    location ^~ /zia/ {
        alias /usr/share/secubox/www/zia/;
        index index.html;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'; frame-ancestors 'self'; form-action 'self'; object-src 'none'; base-uri 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Permissions-Policy "microphone=(self), camera=()" always;
        add_header Referrer-Policy "same-origin" always;
        try_files $uri $uri/ =404;
    }

    # LA PORTE D'ACCÈS SOUS SON CHEMIN CANONIQUE, sur cette origine aussi.
    # SBX OS importe /acces/appareil.js : sans cet alias il faudrait que le
    # chemin dépende de l'hôte, et un chemin qui change selon l'origine est la
    # meilleure façon de se tromper d'origine.
    location /acces/ {
        alias /usr/share/secubox/www/acces/;
        location ~ ^/acces/.+\.(?:js|mjs|css|json|png|svg|webmanifest)$ {
            root /usr/share/secubox/www;
            include /etc/nginx/mime.types;
            default_type application/octet-stream;
        }
        try_files $uri $uri/ =404;
    }

    # ── ACCÈS : LA SEULE PORTE OUVERTE AUX INCONNUS (#1344, #1346) ────────
    # Le Hall n'inclut PAS secubox-routes.d : il expose les API UNE PAR UNE,
    # pour que personne n'ouvre par inadvertance une surface d'administration
    # sur le vhost public. La contrepartie est qu'une API oubliée ici répond
    # 200 avec l'index du Hall — un 200 qui n'est pas la chose demandée.
    #
    # ON N'OUVRE QUE `/invitation/` ET `/session/`. `/file/` et `/profils/`
    # sont la surface d'administration ; la proximité des noms est précisément
    # ce qui rend important le préfixe à NE PAS écrire.
    location /api/v1/acces/invitation/ {
        proxy_pass http://unix:/run/secubox/aggregator.sock:/api/v1/acces/invitation/;
        proxy_set_header X-SecuBox-LAN $lan_client;   # verdict LAN (#1351)
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Acces-Racine /i/acces/;
        client_max_body_size 16k;
    }

    location /api/v1/acces/session/ {
        proxy_pass http://unix:/run/secubox/aggregator.sock:/api/v1/acces/session/;
        proxy_set_header X-SecuBox-LAN $lan_client;   # verdict LAN (#1351)
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP       $remote_addr;
        # La racine de la page d'invitation est dite par le relais qui sert
        # cette page (/invitation/ ci-dessus), jamais par le client.
        proxy_set_header X-Acces-Racine  "";
        client_max_body_size 8k;
    }

    # LA FILE, POUR L'ADMINISTRATEUR QUI EST DEJA LA (#1366).
    #
    # CE QUE CA CORRIGE. La carlette d'acces essaie `/file` : si la route
    # repond, elle montre la file d'attente ; sinon elle retombe sur « votre
    # demande ». Cette route n'etant PAS relayee ici, un administrateur sur le
    # Hall retombait TOUJOURS sur sa propre fiche — « Session ouverte, profil
    # admin », et rien d'autre. La file existait, il ne pouvait pas la voir, et
    # le demandeur attendait pendant ce temps.
    #
    # `/profils/` RESTE DEHORS, et la proximite des noms est exactement ce qui
    # rend ce choix important : promouvoir et revoquer sont des gestes de
    # gouvernance, ils restent sur le vhost d'administration. Ici on ne relaie
    # que ce que la carlette montre : lire la file, accorder, refuser.
    #
    # DEUX VERROUS. Le LAN d'abord ($lan_client) — un administrateur en
    # deplacement retombe alors sur l'ancien comportement, ce qui est correct.
    # Le profil ensuite : depuis #1366 ces routes exigent `admin` et non plus
    # un simple jeton valide, sans quoi tout porteur authentifie aurait lu les
    # noms et les empreintes de qui demande a entrer.
    location /api/v1/acces/file {
        if ($lan_client = 0) { return 403; }
        proxy_pass http://unix:/run/secubox/aggregator.sock:/api/v1/acces/file;
        proxy_set_header X-SecuBox-LAN $lan_client;   # verdict LAN (#1351)
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Acces-Racine  "";            # cf. /session/
        client_max_body_size 8k;
    }

    # LA CARLETTE EST SERVIE EN MÊME ORIGINE, et ce n'est pas un raffinement.
    # Elle range la clé privée de l'appareil dans IndexedDB ; chargée depuis
    # acces.gk2 dans un cadre de hall.gk2, elle est un contexte TIERS, et les
    # navigateurs y cloisonnent ou refusent le stockage. La carlette n'avait
    # alors plus d'identité — donc plus rien à montrer.
    #
    # Le relais la sert sous hall.gk2, où son stockage est de première partie
    # et où ses appels d'API relatifs tombent sur les deux `location`
    # ci-dessus. Même mécanisme que #1239 pour les autres services encadrés.
    location /i/acces/ {
        alias /usr/share/secubox/www/acces/;
        # LA CSP DOIT ÊTRE REDÉCLARÉE ICI, et c'est le piège qui a coûté trois
        # aller-retours. `add_header` N'EST PAS HÉRITÉ par un `location` qui
        # pose ses propres en-têtes — mais un `location` qui n'en pose AUCUN
        # hérite de celui du serveur, lequel porte `frame-ancestors 'none'`.
        #
        # Et `'none'` interdit TOUT ancêtre, y compris de même origine : la
        # carlette refusait donc d'être encadrée par le Hall qui la sert.
        # Firefox le disait très bien — « hall.gk2.secubox.in will not allow
        # Firefox to display the page if another site has embedded it » — mais
        # en nommant le Hall, pas le fichier servi sous son nom.
        #
        # Les sept autres carlettes redéclarent déjà `frame-ancestors 'self'` :
        # on reprend LEUR politique, mot pour mot. Deux politiques voisines qui
        # divergent sont la panne suivante.
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-src 'self' https://*.gk2.secubox.in $sbx_cadres_box; frame-ancestors 'self'; base-uri 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        # Une extension dit « je veux CE fichier » : sans cette borne, un module
        # absent repartirait en HTML avec un 200, et un `import` qui reçoit du
        # HTML échoue d'une façon illisible.
        try_files $uri $uri/ =404;
    }

    # ── SBX IDENTITY MANAGER (#1422) ────────────────────────────────────
    # Servi SUR CETTE ORIGINE, et c'est la raison d'être de ce bloc : la clé
    # de l'appareil vit dans l'IndexedDB du Hall ; ailleurs, la page ne la
    # verrait pas et ne pourrait pas faire signer un certificat par l'appareil.
    # Même politique que /i/acces/ (CSP redéclarée : frame-ancestors 'self').
    # MON COFFRE (#1367 P5) : servi par le Hall, comme /identite/ — une clé
    # d'appareil WebAuthn est liée au NOM du site, et c'est le Hall que les
    # personnes ouvrent. Page livrée par secubox-vault.
    location /coffre/ {
        alias /usr/share/secubox/www/coffre/;
        index index.html;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri $uri/ =404;
    }
    location /identite/ {
        alias /usr/share/secubox/www/identite/;
        index index.html;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-src 'self' https://*.gk2.secubox.in $sbx_cadres_box; frame-ancestors 'self'; base-uri 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri $uri/ =404;
    }
    # L'administration SBX OS : réseau local ET capacité admin.users (vérifiée
    # par sbxid). Même double verrou que /api/v1/acces/file.
    location /api/v1/sbxid/admin/ {
        if ($lan_client = 0) { return 403; }
        proxy_pass http://unix:/run/secubox/aggregator.sock:/api/v1/sbxid/admin/;
        proxy_set_header X-SecuBox-LAN $lan_client;   # verdict LAN (#1351)
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP       $remote_addr;
        client_max_body_size 8k;
    }
    location /api/v1/sbxid/ {
        proxy_pass http://unix:/run/secubox/aggregator.sock:/api/v1/sbxid/;
        proxy_set_header X-SecuBox-LAN $lan_client;   # verdict LAN (#1351)
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP       $remote_addr;
        client_max_body_size 8k;
    }

    # ── MESSAGERIE (#1446) ──────────────────────────────────────────────
    # Mur public + messages privés, servis sur l'origine du Hall : la session
    # SBX OS (cookie du Hall) signe les messages ; sans elle, un pseudo de
    # visiteur. X-Real-IP = $remote_addr résolu par real_ip : c'est le plafond
    # des visiteurs, jamais le X-Forwarded-For que le client peut forger.
    location /messagerie/ {
        alias /usr/share/secubox/www/messagerie/;
        index index.html;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri $uri/ =404;
    }
    location /api/v1/messagerie/ {
        proxy_pass http://unix:/run/secubox/aggregator.sock:/api/v1/messagerie/;
        proxy_set_header X-SecuBox-LAN $lan_client;   # verdict LAN (#1354)
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 16k;
    }

    # RELAIS RADIO — le chat d'ambiance en même origine (cardlet Messagerie).
    # On n'expose QUE ce que la carte lit/écrit : /current (chat incrémental),
    # /chat (message anonyme), et les vues secondaires. L'app sert le chemin
    # complet /api/v1/radio/… (radio.conf ne dé-préfixe pas), on le passe tel quel.
    location ~ ^/api/v1/radio/(current|chat|stats|playlist|propositions)(/|$) {
        rewrite ^ $uri break;   # l'amont reçoit le chemin normalisé admis ci-dessus
        proxy_pass http://unix:/run/secubox/radio.sock;
        # Identité déclarée par le client : jamais crue (#1430).
        proxy_set_header X-Sbx-User-Id "";
        proxy_set_header X-Sbx-User    "";
        proxy_set_header X-Sbx-Role    "";
        proxy_set_header X-SecuBox-LAN   $lan_client;   # verdict LAN (#1351)
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
    }

    # UNE API QUE LE HALL NE RELAIE PAS RÉPOND 404 (#1609), et non l'index du
    # Hall en 200 : un 200 de la mauvaise nature fait croire au client qu'il a
    # une réponse. Préfixe simple, SANS `^~` : les relais en expression
    # régulière ci-dessus gardent la main sur leurs propres chemins.
    location /api/ {
        default_type application/json;
        return 404 '{"detail":"Not Found"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
