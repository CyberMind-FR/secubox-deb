# hall.gk2.net — surface publique WebOS (bureau numérique souverain, #1175).
# Écoute sur le port nginx partagé 9080 (comme bbs.gk2), fronté par HAProxy TLS.
# Sert la page statique du Hall + relaie l'API registre vers webos.sock
# (indépendant de l'agrégateur). CSP souveraine : aucune origine tierce
# (polices locales, pas de fetch externe).
server {
    listen 9080;
    server_name hall.gk2.net hall.gk2.secubox.in;

    root /usr/share/secubox/www/hall;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-src 'self' https://admin.gk2.secubox.in https://waf.gk2.secubox.in https://bbs.gk2.secubox.in https://radio.gk2.secubox.in https://peertube.gk2.secubox.in https://podcaster.gk2.secubox.in https://nc.gk2.secubox.in https://photoprism.gk2.secubox.in https://metanews.gk2.secubox.in https://social.gk2.secubox.in https://socialrelay.gk2.secubox.in https://webmail.gk2.secubox.in https://kbin.gk2.secubox.in https://billets.gk2.secubox.in https://depot.gk2.secubox.in https://ytsas.gk2.secubox.in https://torrent.gk2.secubox.in; frame-ancestors 'none'; base-uri 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location = / { try_files /index.html =404; }

    location /fonts/ {
        alias /usr/share/secubox/www/hall/fonts/;
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # Registre normalisé — socket dédié, jamais l'agrégateur.
    location /api/v1/webos/ {
        proxy_pass http://unix:/run/secubox/webos.sock:/api/v1/webos/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # LE PROTOCOLE VIENT DE HAPROXY, PAS DE NOUS (#1269). nginx est un
        # hop INTERNE en clair : `$scheme` y vaut toujours « http », et le
        # module en concluait qu'il servait en clair — permaliens en http://,
        # `_secure()` faux, cookies retombes en SameSite=Lax. HAProxy pose
        # l'en-tete sur ses deux frontends, on le transmet tel quel.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_intercept_errors on;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
