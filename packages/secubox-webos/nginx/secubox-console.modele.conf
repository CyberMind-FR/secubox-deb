# SecuBox — MODÈLE de /etc/nginx/secubox-console/secret.conf (#1695).
# Le vrai fichier est écrit par le postinst de secubox-webos (0600 root) depuis
# /etc/secubox/secrets/console.key ; il n'existe jamais dans le dépôt. Ce
# modèle, de même forme, sert au vérificateur des relais du Hall
# (scripts/verifie-relais-hall.py), qui ne compte que ce qu'il peut relire.
proxy_set_header X-SecuBox-Console "<secret du port console, posé par le postinst>";
