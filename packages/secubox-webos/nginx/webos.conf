# WebOS registre — VITAL, indépendant de l'agrégateur (#1175). Socket dédié.
location /api/v1/webos/ {
    proxy_pass http://unix:/run/secubox/webos.sock:/api/v1/webos/;
    proxy_set_header X-SecuBox-LAN $lan_client;   # verdict LAN (#1354)
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # LE PROTOCOLE VIENT DE HAPROXY, PAS DE NOUS (#1269). nginx est un
        # hop INTERNE en clair : `$scheme` y vaut toujours « http », et le
        # module en concluait qu'il servait en clair — permaliens en http://,
        # `_secure()` faux, cookies retombes en SameSite=Lax. HAProxy pose
        # l'en-tete sur ses deux frontends, on le transmet tel quel.
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_intercept_errors on;
}

# Le Hall est écrit pour sa propre racine (hall.<domaine>) : il appelle /fonts/, /domaine.js, /lexie.js, /hall-logo.svg et /medaillons/ en
# chemins ABSOLUS. Servi sous /hall/ à l'adresse IP (live, première installation), ces chemins tombaient dans le repli index.html du vhost par
# défaut : du text/html à la place des polices et des scripts (SBX_DOMAINE non défini, Hall sans polices) (#2449). On les sert depuis le
# dossier du Hall ; un fichier de même nom déjà présent à la racine l'emporte (try_files $uri en premier).
location = /domaine.js    { try_files $uri /hall/domaine.js =404; }
location = /lexie.js      { try_files $uri /hall/lexie.js =404; }
location = /hall-logo.svg { try_files $uri /hall/hall-logo.svg =404; }
location ^~ /fonts/       { try_files $uri /hall$uri =404; }
location ^~ /medaillons/  { try_files $uri /hall$uri =404; }
