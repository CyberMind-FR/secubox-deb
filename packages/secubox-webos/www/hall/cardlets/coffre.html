  SecuBox — carte « Coffre » (secubox-vault 2.0, P4 #1367).

  LECTURE SEULE, ET RIEN QUE L'ÉTAT. La carte lit /api/v1/vault/etat — scellé
  ou ouvert, nombre de secrets et de serrures, intégrité du journal — par
  l'agrégateur, qui ne la relaie qu'à un administrateur réel. Elle ne montre
  jamais une valeur, et n'ouvre rien : ouvrir, sceller, enrôler une clé
  d'appareil se fait dans la console (⚙️), où le second facteur s'applique.

  Même fondation que les autres cardlets du Hall (réf. actor.html) : tokens
  partagés, en-tête « spicy » à filet dégradé, KPIs.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coffre</title>
<style>
  :root{ --fond:#ffffff; --texte:#131722; --muted:#5b6478; --faint:#8a93a6; --line:#e2e6f0;
         --soft:#f5f7fc; --cyan:#0784a8; --up:#0f9d54; --hot:#d64545; --warn:#c87832; --grape:#6e40c9; }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme:dark;
    --fond:#0f1520; --texte:#e7ebf4; --muted:#8791a6; --faint:#5e6779; --line:#232b3b;
    --soft:#10151f; --cyan:#28d6ff; --up:#35d07f; --hot:#ff6a6a; --warn:#e0b46a; --grape:#a88bff; } }
  :root[data-theme="dark"]{ color-scheme:dark; --fond:#0f1520; --texte:#e7ebf4; --muted:#8791a6;
    --faint:#5e6779; --line:#232b3b; --soft:#10151f; --cyan:#28d6ff; --up:#35d07f; --hot:#ff6a6a;
    --warn:#e0b46a; --grape:#a88bff; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden}
  body{background:var(--fond);color:var(--texte);font-family:"IBM Plex Sans",Inter,system-ui,sans-serif;font-size:14px}
  .mw{display:flex;flex-direction:column;height:100%;padding:.55rem .65rem;gap:.5rem}
  .h{display:flex;align-items:center;gap:8px;position:relative;padding-bottom:6px}
  .h::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;border-radius:2px;
    background:linear-gradient(90deg,var(--warn),var(--grape),var(--cyan))}
  .h .ic{font-size:1.05rem} .h b{font-size:.9rem;letter-spacing:.02em}
  .etat{margin-left:auto;display:inline-flex;align-items:center;gap:5px;font-size:.56rem;font-weight:700;
    letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--line);border-radius:20px;padding:2px 9px;
    color:var(--muted)}
  .etat i{width:7px;height:7px;border-radius:50%;background:currentColor}
  .etat.scelle{color:var(--up)} .etat.ouvert{color:var(--warn)} .etat.alerte{color:var(--hot)}
  .kpis{display:flex;gap:6px}
  .kpi{flex:1;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:6px 8px;min-width:0}
  .kpi .v{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:1rem;font-weight:700;line-height:1;
    font-variant-numeric:tabular-nums}
  .kpi .l{font-size:.53rem;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin-top:3px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kpi.ok .v{color:var(--up)} .kpi.ko .v{color:var(--hot)}
  .note{font-size:.7rem;color:var(--muted);line-height:1.4;margin:0}
  .note b{color:var(--texte);font-weight:600}
</style>
<div class="mw">
  <div class="h"><span class="ic">🔐</span><b>Coffre</b>
    <span class="etat" id="etat"><i></i><span id="etat-t">…</span></span></div>
  <div class="kpis" id="kpis" hidden>
    <div class="kpi"><div class="v" id="k-secrets">–</div><div class="l">secrets</div></div>
    <div class="kpi"><div class="v" id="k-serrures">–</div><div class="l">serrures</div></div>
    <div class="kpi"><div class="v" id="k-appareils">–</div><div class="l">clés d'appareil</div></div>
    <div class="kpi" id="kpi-journal"><div class="v" id="k-journal">–</div><div class="l">journal</div></div>
  </div>
  <p class="note" id="note">Lecture de l'état…</p>
</div>
<script src="../sonde.js"></script>
<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };
  function pastille(classe, texte){ $('etat').className = 'etat ' + classe; $('etat-t').textContent = texte; }
  function mmss(s){ s = Math.max(0, s|0); return Math.floor(s/60) + ':' + ('0' + s%60).slice(-2); }

  function rend(e){
    var j = e.journal || {};
    if (!e.initialise){
      pastille('', 'non initialisé'); $('kpis').hidden = true;
      $('note').innerHTML = "Le Coffre attend sa phrase. En SSH sur la box : <b>coffrectl initialiser</b>.";
      return;
    }
    if (j.integre === false) pastille('alerte', 'journal altéré');
    else if (e.ouvert) pastille('ouvert', 'ouvert · ' + mmss(e.reste_s));
    else pastille('scelle', 'scellé');
    var serrures = e.serrures || [], comps = e.compartiments || [];
    $('k-secrets').textContent = comps.reduce(function(n, c){ return n + (c.secrets|0); }, 0);
    $('k-serrures').textContent = serrures.length;
    $('k-appareils').textContent = serrures.filter(function(s){ return s.genre === 'appareil'; }).length;
    $('k-journal').textContent = j.integre === false ? '⚠ l.' + j.ligne_fautive : '✓ ' + (j.lignes|0);
    $('kpi-journal').className = 'kpi ' + (j.integre === false ? 'ko' : 'ok');
    $('kpis').hidden = false;
    $('note').innerHTML = e.ouvert
      ? "Ouvert : il se scelle seul après <b>" + mmss(e.reste_s) + "</b> sans usage."
      : "Scellé : aucun secret n'est lisible. Ouvrir depuis la console ⚙️ (code TOTP hors du LAN).";
  }

  function charge(){
    fetch('/api/v1/vault/etat', {headers:{'Accept':'application/json'}, credentials:'same-origin'})
      .then(function(r){
        if (r.status === 401 || r.status === 403){
          pastille('', 'réservé'); $('kpis').hidden = true;
          $('note').textContent = "Réservé aux administrateurs de la box.";
          return null;
        }
        if (!r.ok) throw new Error(String(r.status));
        return r.json();
      })
      .then(function(e){ if (e) rend(e); })
      .catch(function(){
        pastille('', 'injoignable'); $('kpis').hidden = true;
        $('note').textContent = "Le service du Coffre ne répond pas.";
      });
  }
  charge();
  setInterval(charge, 30000);
})();
</script>
