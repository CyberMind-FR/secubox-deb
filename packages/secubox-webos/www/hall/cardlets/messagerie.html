  SecuBox — cardlet MESSAGERIE & CHATBOX. Une carte, trois surfaces de dialogue,
  choisies par la barre de slices partagée :
    🤖 ZIA    — le chatbot local du Hall (POST /api/v1/zia/v1/chat).
    📻 Radio  — le chat d'ambiance de la webradio (lecture incrémentale de
                /api/v1/radio/current, envoi anonyme via /api/v1/radio/chat).
    💬 MP     — les messages privés du BBS, la vraie page (iframe bbs.gk2/mp),
                chargée à la demande ; l'authentification est celle du BBS.

  Tout passe par des relais de MÊME ORIGINE (hall.vhost.conf) : la CSP du Hall
  est connect-src 'self'. Le sondage du chat radio ne tourne QUE quand sa slice
  est active ET que l'onglet est visible et en ligne — pas de gourmandise.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Messagerie &amp; Chatbox — vue micro</title>
<link rel="stylesheet" href="../slicebar.css">
<script src="../slicebar.js"></script>
<style>
  :root{ --fond:#faf5ea; --texte:#232a5e; --muted:#6a6f92; --faint:#948c73; --line:#ded2b6; --line-soft:#eae0c8;
    --surf2:#f3ecda; --blue:#2e3f9e; --teal:#0a93a6; --teal-ink:#0a7d8e; --fox:#d0622c; --purple:#6a54ad;
    --coral:#d24f65; --leaf:#3c8f66; --accent:#6a54ad; --cyan:#0a93a6; }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
    --fond:#181f4c; --texte:#efe8d6; --muted:#9aa0c4; --faint:#6d7398; --line:#28306e; --line-soft:#202760;
    --surf2:#141b42; --blue:#6076de; --teal:#3fd0e0; --teal-ink:#7fe4f0; --fox:#f2854c; --purple:#a98bff;
    --coral:#ff6c7e; --leaf:#5fc98a; --accent:#a98bff; --cyan:#3fd0e0; } }
  :root[data-theme="dark"]{ --fond:#181f4c; --texte:#efe8d6; --muted:#9aa0c4; --faint:#6d7398; --line:#28306e; --line-soft:#202760;
    --surf2:#141b42; --blue:#6076de; --teal:#3fd0e0; --teal-ink:#7fe4f0; --fox:#f2854c; --purple:#a98bff;
    --coral:#ff6c7e; --leaf:#5fc98a; --accent:#a98bff; --cyan:#3fd0e0; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden}
  body{background:var(--fond);color:var(--texte);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.45}
  .mw{display:flex;flex-direction:column;height:100%}
  .h{display:flex;align-items:center;gap:8px;padding:9px 11px;border-bottom:1px solid var(--line-soft);
    background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 9%,var(--fond)),var(--fond))}
  .h .ic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:1rem;
    background:radial-gradient(circle at 40% 35%,color-mix(in srgb,var(--accent) 30%,var(--fond)),var(--fond));
    border:1px solid color-mix(in srgb,var(--accent) 34%,var(--line))}
  .h b{font-weight:800;font-size:.92rem;letter-spacing:-.01em}
  .h .ctx{font-size:.56rem;color:var(--muted);background:var(--surf2);border:1px solid var(--line-soft);
    border-radius:6px;padding:1px 6px;font-family:ui-monospace,monospace}
  .h .live{margin-left:auto;display:inline-flex;align-items:center;gap:5px;font-size:.54rem;letter-spacing:.08em;
    text-transform:uppercase;color:var(--leaf);font-weight:700}
  .h .live.off{color:var(--faint)}
  .h .dot{width:6px;height:6px;border-radius:50%;background:var(--leaf);animation:pulse 2.4s ease-out infinite}
  .h .live.off .dot{background:var(--faint);animation:none}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--leaf) 55%,transparent)}60%{box-shadow:0 0 0 6px transparent}}

  .stage{flex:1;min-height:0;position:relative}
  .panel{position:absolute;inset:0;display:none;flex-direction:column;min-height:0}
  .panel.on{display:flex}

  /* Flux de bulles (ZIA + radio) */
  .stream{flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin;display:flex;flex-direction:column;gap:9px;padding:11px}
  .msg{display:flex;gap:7px;max-width:92%}
  .msg .av{width:22px;height:22px;border-radius:7px;flex:0 0 auto;display:grid;place-items:center;font-size:.75rem}
  .msg.bot .av{background:radial-gradient(circle at 40% 35%,color-mix(in srgb,var(--fox) 28%,var(--fond)),var(--fond));border:1px solid color-mix(in srgb,var(--fox) 32%,var(--line))}
  .msg.them .av{background:color-mix(in srgb,var(--purple) 18%,var(--fond));border:1px solid color-mix(in srgb,var(--purple) 32%,var(--line))}
  .msg.me{align-self:flex-end;flex-direction:row-reverse}
  .msg.me .av{background:color-mix(in srgb,var(--blue) 20%,var(--fond));border:1px solid color-mix(in srgb,var(--blue) 32%,var(--line))}
  .bub{border-radius:13px;padding:8px 11px;font-size:.85rem;line-height:1.4}
  .msg.bot .bub,.msg.them .bub{background:var(--surf2);border:1px solid var(--line-soft);border-top-left-radius:4px;color:var(--texte)}
  .msg.me .bub{background:color-mix(in srgb,var(--teal) 14%,var(--fond));border:1px solid color-mix(in srgb,var(--teal) 28%,var(--line));border-top-right-radius:4px}
  .bub b{color:var(--blue)} .bub .hh{color:var(--coral)}
  .bub .who{display:block;font-size:.58rem;font-weight:800;letter-spacing:.02em;color:var(--purple);margin-bottom:2px}
  .note{align-self:center;font-size:.66rem;color:var(--muted);background:var(--surf2);border:1px dashed var(--line);border-radius:999px;padding:3px 10px}

  .sugg{display:flex;gap:5px;flex-wrap:wrap;padding:0 11px 6px}
  .sugg button{font:inherit;font-size:.66rem;color:var(--teal-ink);background:none;border:1px solid var(--line);border-radius:999px;padding:3px 9px;cursor:pointer}
  .sugg button:hover{border-color:var(--teal)}

  /* Saisie partagée (routée vers la slice active) */
  form.in{display:flex;align-items:center;gap:7px;padding:9px 11px;border-top:1px solid var(--line-soft);background:var(--surf2)}
  form.in[hidden]{display:none}
  form.in input{flex:1;min-width:0;border:1px solid var(--line);border-radius:11px;padding:8px 12px;background:var(--fond);color:var(--texte);font:inherit;font-size:.85rem}
  form.in input:focus{outline:none;border-color:var(--accent)}
  form.in button{width:34px;height:34px;border-radius:10px;background:var(--accent);color:#fff;border:0;font-size:1rem;cursor:pointer;flex:0 0 auto}

  /* MP : la vraie page du BBS, chargée à la demande */
  .mp-frame{flex:1;width:100%;border:0;background:var(--fond)}
  .mp-hint{padding:11px;font-size:.78rem;color:var(--muted);display:flex;flex-direction:column;gap:9px;align-items:flex-start}
  .mp-hint button{font:inherit;font-size:.82rem;font-weight:700;color:#fff;background:var(--accent);border:0;border-radius:10px;padding:8px 14px;cursor:pointer}

  @media (prefers-reduced-motion:reduce){ .h .dot{animation:none} }
</style>

<div class="mw">
  <div class="h">
    <span class="ic" id="h-ic">💬</span><b>Messagerie</b><span class="ctx" id="h-ctx">chatbox</span>
    <span class="live off" id="h-live"><span class="dot"></span><span id="h-state">—</span></span>
  </div>

  <div class="stage">
    <!-- 🤖 ZIA -->
    <div class="panel on" id="p-zia">
      <div class="stream" id="zia-stream"></div>
      <div class="sugg" id="zia-sugg"></div>
    </div>
    <!-- 📻 Chat radio -->
    <div class="panel" id="p-radio">
      <div class="stream" id="radio-stream"></div>
    </div>
    <!-- 💬 Messages privés du BBS -->
    <div class="panel" id="p-mp">
      <div class="mp-hint" id="mp-hint">
        <span>💬 Vos messages privés du BBS, ici même.</span>
        <button type="button" id="mp-go">Ouvrir la messagerie privée</button>
      </div>
    </div>
  </div>

  <form class="in" id="compose" autocomplete="off">
    <input id="q" placeholder="demande à ZIA…" aria-label="Message">
    <button type="submit" title="Envoyer">➤</button>
  </form>
</div>

<script>
(function(){
  "use strict";
  var el=function(id){return document.getElementById(id);};
  function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c];});}
  function md(t){ return esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/❤/g,'<span class="hh">❤</span>'); }
  function horsService(){ return document.hidden || navigator.onLine===false; }

  var actif='zia';   // slice courante : 'zia' | 'radio' | 'mp'

  // ── En-tête + saisie contextuels ──────────────────────────────────────────
  var META={
    zia:  {ic:'🤖', ctx:'ZIA · chatbot', ph:'demande à ZIA…',        input:true},
    radio:{ic:'📻', ctx:'chat radio',     ph:'écrire au chat radio…',  input:true},
    mp:   {ic:'💬', ctx:'messages privés', ph:'',                       input:false}
  };
  function poseChrome(){
    var m=META[actif]||META.zia;
    el('h-ic').textContent=m.ic; el('h-ctx').textContent=m.ctx;
    el('q').placeholder=m.ph; el('compose').hidden=!m.input;
  }

  // ══ 🤖 ZIA ═════════════════════════════════════════════════════════════════
  var ZAPI='/api/v1/zia', ziaStream=el('zia-stream'), ziaSalue=false;
  function ziaScroll(){ ziaStream.scrollTop=ziaStream.scrollHeight; }
  function ziaMe(t){ ziaStream.insertAdjacentHTML('beforeend','<div class="msg me"><div class="av">🙂</div><div class="bub">'+esc(t)+'</div></div>'); ziaScroll(); }
  function ziaBot(html){ var d=document.createElement('div'); d.className='msg bot'; d.innerHTML='<div class="av">🦊</div><div class="bub">'+html+'</div>'; ziaStream.appendChild(d); ziaScroll(); return d; }
  function ziaObj(o){
    var acts=(o.actions||[]).map(function(a,i){ var lbl={open:'⬚ Ouvrir',play:'▶ Lire',discuss:'💬 Discuter'}[a]||a;
      return '<button data-act="'+esc(a)+'" data-svc="'+esc(o.service)+'" data-type="'+esc(o.type||'')+'" data-url="'+esc(o.url||'')+'" data-title="'+esc(o.title||'')+'" style="font:inherit;font-size:.68rem;margin:4px 4px 0 0;padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surf2);color:var(--texte);cursor:pointer">'+lbl+'</button>';
    }).join('');
    return '<div style="margin-top:7px;border:1px solid var(--line);border-radius:11px;padding:8px 10px;background:var(--fond)">'
      +'<span style="font-family:ui-monospace,monospace;font-size:.56rem;color:#fff;background:var(--blue);border-radius:5px;padding:1px 6px">'+esc(o.service)+'</span>'
      +'<div style="font-weight:600;font-size:.8rem;margin-top:5px">'+esc(o.title||'—')+'</div>'+acts+'</div>';
  }
  function ziaOuvre(svc,type,url,titre){
    if(parent===window){ if(url) location.href=url; return; }
    try{
      if(type==='service'||!url){ parent.postMessage({sbx:'ouvre',id:svc},'*'); return; }
      if(/^media\./.test(type)){ parent.postMessage({sbx:'voir',url:url,titre:titre},'*'); return; }
      var hote=''; try{ hote=new URL(url).hostname; }catch(e){}
      parent.postMessage({sbx:'ouvre-hote',hote:hote,url:url},'*');
    }catch(x){}
  }
  function ziaRender(r){
    var d=ziaBot(md(r.text||'…'));
    (r.objects||[]).forEach(function(o){ d.querySelector('.bub').insertAdjacentHTML('beforeend', ziaObj(o)); });
    // ACTIONS SBX (couche ZIA) : déjà validées côté serveur (whitelist+rôle+valeur).
    // On les RELAIE au Hall — seul à pouvoir commander la cardlet cible, à
    // l'origine précise. ZIA ne touche jamais le DOM d'un autre service.
    (r.actions||[]).forEach(function(a){
      if(!a || a.kind!=='sbx-action') return;
      if(parent!==window){ try{ parent.postMessage({sbx:'action', req:a}, '*'); }catch(e){} }
      d.querySelector('.bub').insertAdjacentHTML('beforeend',
        '<div style="margin-top:6px;font-size:.62rem;opacity:.65">⚡ '+esc(a.service)+' · '+esc(a.action)
        +(a.params&&a.params.value!=null?(' = '+esc(String(a.params.value))):'')+'</div>');
    });
    if(r.engine && actif==='zia'){ el('h-state').textContent=r.engine==='llm'?'modèle':'local'; }
    ziaScroll();
  }
  function ziaEnvoie(m){
    m=(m||'').trim(); if(!m) return;
    ziaMe(m);
    var pending=ziaBot('<span style="opacity:.6">…</span>');
    fetch(ZAPI+'/v1/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m})})
      .then(function(r){return r.ok?r.json():null;})
      .then(function(res){ pending.remove(); if(!res){ ziaBot('Service ZIA injoignable.'); return; } ziaRender(res); })
      .catch(function(){ pending.remove(); ziaBot('Oups, réseau.'); });
  }
  function ziaSalut(){
    if(ziaSalue) return; ziaSalue=true;
    var SUG=['les sujets récents','les podcasts','la dernière vidéo','aide'];
    el('zia-sugg').innerHTML=SUG.map(function(s){return '<button type="button">'+esc(s)+'</button>';}).join('');
    fetch(ZAPI+'/health',{headers:{'Accept':'application/json'}}).then(function(r){return r.ok?r.json():null;}).then(function(h){
      if(h && actif==='zia'){ el('h-state').textContent=h.engine==='llm'?'modèle':'local'; el('h-live').classList.remove('off'); }
      ziaBot('Salut ! 🦊 Je connais ton Hall — demande-moi un média, un doc, un sujet.');
    }).catch(function(){ ziaBot('Salut ! 🦊 (hors ligne)'); });
  }
  el('zia-sugg').addEventListener('click', function(e){ var b=e.target.closest('button'); if(b){ ziaEnvoie(b.textContent); el('zia-sugg').style.display='none'; } });
  ziaStream.addEventListener('click', function(e){ var b=e.target.closest('[data-act]'); if(!b) return;
    ziaOuvre(b.getAttribute('data-svc'),b.getAttribute('data-type'),b.getAttribute('data-url'),b.getAttribute('data-title'));
    var old=b.textContent; b.textContent='✓'; setTimeout(function(){ b.textContent=old; }, 700); });

  // ══ 📻 CHAT RADIO ══════════════════════════════════════════════════════════
  var RAPI='/api/v1/radio', radioStream=el('radio-stream'), curseur=0, radioTimer=null, radioAmorce=false, vus={};
  function radioScroll(){ radioStream.scrollTop=radioStream.scrollHeight; }
  function radioLigne(p){
    var id=p.ID||p.id||0; if(id && vus[id]) return; if(id) vus[id]=1;
    var pseudo=p.Pseudo||p.pseudo||'?', corps=p.Corps||p.corps||'';
    var d=document.createElement('div'); d.className='msg them';
    d.innerHTML='<div class="av">💬</div><div class="bub"><span class="who">'+esc(pseudo)+'</span>'+esc(corps)+'</div>';
    radioStream.appendChild(d);
    while(radioStream.childNodes.length>60) radioStream.removeChild(radioStream.firstChild);
    radioScroll();
  }
  function radioSonde(){
    if(actif!=='radio' || horsService()) return;
    fetch(RAPI+'/current?depuis='+curseur,{headers:{'Accept':'application/json'}})
      .then(function(r){ return r.ok?r.json():null; })
      .then(function(d){
        if(!d) return;
        var c=(d.corps||d); var chat=c.chat||[];
        el('h-live').classList.remove('off'); el('h-state').textContent='en direct';
        chat.forEach(function(p){ curseur=Math.max(curseur,p.ID||p.id||0); radioLigne(p); });
        if(!radioAmorce && !chat.length){ radioAmorce=true;
          radioStream.insertAdjacentHTML('beforeend','<div class="note">Chat d’ambiance de la webradio — dites bonjour 👋</div>'); }
        radioAmorce=true;
      }).catch(function(){ el('h-live').classList.add('off'); el('h-state').textContent='hors ligne'; });
  }
  function radioEnvoie(m){
    m=(m||'').trim(); if(!m) return;
    // Écho optimiste : le message rejoint le chat d'ambiance (anonyme).
    var d=document.createElement('div'); d.className='msg me';
    d.innerHTML='<div class="av">🙂</div><div class="bub">'+esc(m)+'</div>'; radioStream.appendChild(d); radioScroll();
    fetch(RAPI+'/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({corps:m})})
      .then(function(){ radioSonde(); })   // rafraîchit tout de suite
      .catch(function(){ radioStream.insertAdjacentHTML('beforeend','<div class="note">Message non envoyé (réseau).</div>'); });
  }
  function radioDemarre(){ radioSonde(); if(radioTimer) clearInterval(radioTimer); radioTimer=setInterval(radioSonde, 6000); }
  function radioArrete(){ if(radioTimer){ clearInterval(radioTimer); radioTimer=null; } }

  // ══ 💬 MESSAGES PRIVÉS (BBS) ═══════════════════════════════════════════════
  var mpCharge=false;
  function mpActive(){
    if(mpCharge) return; mpCharge=true;
    var t=''; try{ t=new URLSearchParams(location.search).get('theme')||''; }catch(e){}
    var url='https://bbs.gk2.secubox.in/mp'+(t?('?theme='+encodeURIComponent(t)):'');
    var f=document.createElement('iframe'); f.className='mp-frame'; f.id='mp-frame';
    f.title='Messages privés du BBS'; f.src=url;
    var host=el('p-mp'); host.innerHTML=''; host.appendChild(f);
  }
  el('mp-go').addEventListener('click', mpActive);

  // ══ SAISIE PARTAGÉE (routée) ═══════════════════════════════════════════════
  el('compose').addEventListener('submit', function(e){
    e.preventDefault(); var v=el('q').value; el('q').value='';
    if(actif==='zia') ziaEnvoie(v); else if(actif==='radio') radioEnvoie(v);
  });

  // ══ SLICER PARTAGÉ ═════════════════════════════════════════════════════════
  var PANELS={zia:'p-zia', radio:'p-radio', mp:'p-mp'}, CLES=['zia','radio','mp'];
  function montre(k){
    actif=CLES[k]||'zia';
    CLES.forEach(function(c){ var p=el(PANELS[c]); if(p) p.classList.toggle('on', c===actif); });
    poseChrome();
    // Le chat radio ne sonde QUE quand il est visible (perf + réseau).
    if(actif==='radio'){ el('h-live').classList.remove('off'); radioDemarre(); } else radioArrete();
    if(actif==='zia'){ el('h-live').classList.remove('off'); ziaSalut(); }
    if(actif==='mp'){ el('h-live').classList.add('off'); el('h-state').textContent='privé'; mpActive(); }
  }
  if(window.SBXSliceBar){
    SBXSliceBar(el('mw-slbar-mount')||document.querySelector('.mw'), {
      autoMs:0, pauseOnHover:false,
      slices:[{label:'🤖 ZIA'},{label:'📻 Chat radio'},{label:'💬 Messages privés'}],
      onShow:function(k){ montre(k); }
    });
  } else { montre(0); }

  // Reprend la sonde radio au retour d'onglet (réactivité), la coupe si caché.
  document.addEventListener('visibilitychange', function(){
    if(document.hidden){ radioArrete(); }
    else if(actif==='radio'){ radioSonde(); radioDemarre(); }
  });
  addEventListener('online', function(){ if(actif==='radio') radioSonde(); });

  // Thème piloté par le Hall.
  (function(){ var t=new URLSearchParams(location.search).get('theme'); if(t==='dark'||t==='light') document.documentElement.setAttribute('data-theme',t); })();
  addEventListener('message',function(ev){ var d=ev.data; if(d&&d.sbx==='theme'&&(d.theme==='dark'||d.theme==='light')) document.documentElement.setAttribute('data-theme',d.theme); });
})();
</script>

<script src="../aide.js"></script>
<script>window.SBXAide&&SBXAide({zones:function(){return [
  {el:document.querySelector('.h'),label:'En-tête — la surface de dialogue active (ZIA · radio · privés)'},
  {el:document.querySelector('.panel.on .stream')||document.querySelector('.panel.on'),label:'Conversation — le fil de la slice courante'},
  {el:document.getElementById('compose'),label:'Saisie — écrire à ZIA ou au chat radio'},
  {el:document.getElementById('slbar')||document.querySelector('.sbx-bar'),label:'Slices — 🤖 ZIA · 📻 Chat radio · 💬 Messages privés'}
].filter(function(z){return z.el;});}});</script>
