  SecuBox #1323 — carte « Mes sites » : une à la une, les autres en bande.

  MÊME GRAMMAIRE QUE PEERTUBE. Une grande vignette qui tourne, une bande de
  suivantes en dessous, et la barre à pastilles en pied pour changer de tri.
  Un damier figé de 162 tuiles ne dit pas qu'un parc VIT ; c'est la rotation
  qui le montre, et le survol qui la suspend — on ne lit pas un titre qui
  s'échappe.

  ELLE MONTRE CE QUI EST SERVI, ET RIEN D'AUTRE. Source unique :
  /api/v1/metablogizer/public/mosaique — projection étroite des sites PUBLIÉS,
  c'est-à-dire ceux que n'importe qui peut déjà ouvrir. Ni chemin sur disque,
  ni brouillon, ni dépôt d'origine.

  CLIQUER OUVRE DANS LE SURFER, PAS DANS UN ONGLET. Le Hall relaie
  `{sbx:'surf', url}` vers son overlay, mégabarre gardée : on visite ses
  propres sites sans sortir de chez soi. En session, un ⚙ par vignette mène
  à la vue détail en mode édition.
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mes sites — mosaïque</title>
<link rel="stylesheet" href="../spicy.css">
<link rel="stylesheet" href="../slicebar.css">
<script src="../sonde.js"></script>
<script src="../slicebar.js"></script>
<style>
  :root { --fond:#ffffff; --texte:#1a1a22; --muted:#6b6b7a; --border:#e2e2ea;
          --accent:#3d6b4a; --cyan:#0784a8; --chaud:#c8791f; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --fond:#14141c; --texte:#e8e6d9; --muted:#8a8a99;
      --border:#2a2a36; --accent:#6db38a; --cyan:#38d2f0; --chaud:#e0a45c; }
  }
  :root[data-theme="dark"] { --fond:#14141c; --texte:#e8e6d9; --muted:#8a8a99;
    --border:#2a2a36; --accent:#6db38a; --cyan:#38d2f0; --chaud:#e0a45c; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; scrollbar-width:none; }
  html::-webkit-scrollbar, body::-webkit-scrollbar { width:0; display:none; }
  body { background:var(--fond); color:var(--texte);
         font-family:"Inter",system-ui,sans-serif; font-size:14px; line-height:1.45; }
  /* MEGA : la page se déroule. Le marqueur est posé sur <html> AUSSI, parce
     qu'un sélecteur `body[data-mega] html` ne peut rien atteindre — html est
     le PARENT de body. Posé sur body seul, l'ancien `overflow:hidden` de
     <html> tenait bon et la grille dépliée restait invisible sous le pli. */
  html[data-mega], html[data-mega] body { overflow:auto; height:auto; }

  /* LA CARTE S'ADAPTE À SA HAUTEUR, ELLE NE LA DICTE PAS. Le Hall lui donne
     300 px ; une « une » en 16/9 sur 460 px de large en mange 259, plus
     l'en-tête : la bande et la barre à pastilles passaient sous le pli et
     `overflow:hidden` les coupait. Elles étaient bien dans le DOM — le
     journal nginx montrait les 2 287 vignettes demandées — simplement hors
     champ. D'où : en-tête, bande et barre à hauteur FIXE, la une prend ce
     qui reste. `min-height:0` est indispensable, sans quoi un enfant flex
     refuse de rétrécir sous sa taille de contenu. */
  .mw { display:flex; flex-direction:column; height:100%; min-height:0;
        padding:.6rem .72rem .2rem; gap:.42rem; }
  html[data-mega] .mw { height:auto; min-height:100%; padding:1rem 1.1rem .2rem; gap:.62rem; }
  .tete, .bande, #sbxbar { flex:0 0 auto; }

  .tete { display:flex; align-items:center; gap:.45rem; }
  .tete .ic { width:28px; height:28px; border-radius:8px; display:grid; place-items:center;
              font-size:.9rem; color:#fff; background:var(--accent); flex:0 0 auto; }
  .tete b { font-size:.88rem; }
  html[data-mega] .tete b { font-size:1.05rem; }
  .tete .n { margin-left:auto; font-size:.56rem; letter-spacing:.08em; text-transform:uppercase;
             color:var(--muted); font-variant-numeric:tabular-nums; }

  /* À LA UNE — la grande vignette. Le titre repose SUR l'image, en bas, sur un
     voile : une bande de texte sous l'image aurait mangé la hauteur utile. */
  .une { position:relative; display:block; width:100%; border:1px solid var(--border);
         border-radius:11px; overflow:hidden; background:var(--fond); padding:0;
         cursor:pointer; font:inherit; color:inherit; text-align:left;
         flex:1 1 auto; min-height:76px; }
  .une:hover, .une:focus-visible { border-color:var(--cyan); outline:none; }
  .une img { display:block; width:100%; height:100%; object-fit:cover;
             object-position:top center; background:color-mix(in srgb, var(--muted) 12%, transparent); }
  /* En MEGA la page défile : la une reprend un format d'affiche plutôt que
     d'étirer une capture sur toute la hauteur disponible. */
  html[data-mega] .une { flex:0 0 auto; }
  html[data-mega] .une img { height:auto; aspect-ratio:21/9; }
  .une .voile { position:absolute; left:0; right:0; bottom:0; padding:.55rem .6rem .45rem;
                background:linear-gradient(180deg, transparent, rgba(0,0,0,.72)); color:#fff; }
  .une .t { display:block; font-size:.82rem; font-weight:600; line-height:1.25;
            white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  html[data-mega] .une .t { font-size:1rem; }
  .une .d { display:block; font-family:"JetBrains Mono",ui-monospace,monospace;
            font-size:.58rem; opacity:.85; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* LA BANDE — les suivantes. Hauteur FIXE : c'est elle qui garantit que la bande survit au partage de
     la carte. Elle défile horizontalement plutôt que de se tasser — une
     vignette de 40 px ne montre plus rien. */
  .bande { display:flex; gap:.36rem; height:64px; overflow-x:auto; overflow-y:hidden;
           scrollbar-width:none; padding-bottom:.1rem; }
  .bande::-webkit-scrollbar { height:0; display:none; }
  html[data-mega] .bande { flex-wrap:wrap; overflow:visible; height:auto; gap:.62rem; }
  .vig { position:relative; flex:0 0 auto; width:76px; height:100%;
         display:flex; flex-direction:column; border:1px solid var(--border);
         border-radius:8px; overflow:hidden; background:var(--fond); padding:0;
         cursor:pointer; font:inherit; color:inherit; text-align:left; }
  html[data-mega] .vig { width:170px; height:auto; }
  .vig:hover, .vig:focus-visible { border-color:var(--cyan); outline:none; }
  .vig img { display:block; width:100%; flex:1 1 auto; min-height:0; object-fit:cover;
             object-position:top center; background:color-mix(in srgb, var(--muted) 12%, transparent); }
  html[data-mega] .vig img { flex:0 0 auto; aspect-ratio:16/10; }
  .vig .l { display:block; flex:0 0 auto; padding:.16rem .3rem .22rem; font-size:.55rem;
            font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  html[data-mega] .vig .l { font-size:.72rem; padding:.3rem .42rem .38rem; }

  /* Pas encore de capture : une plaque sobre plutôt qu'une image cassée —
     162 sites ne se photographient pas en un tour de shotter. */
  .sans { display:grid; place-items:center; width:100%; flex:1 1 auto; min-height:0;
          font-size:1rem; color:var(--muted);
          background:color-mix(in srgb, var(--muted) 9%, transparent); }
  .une .sans { height:100%; font-size:1.6rem; }
  html[data-mega] .sans { flex:0 0 auto; aspect-ratio:16/10; }
  html[data-mega] .une .sans { height:auto; aspect-ratio:21/9; }

  /* ACCÈS ADMIN, DISCRET ET CONDITIONNEL. Visible seulement en session : un
     invité n'a rien à faire d'un bouton qui le mènerait à une connexion. */
  .reglage { position:absolute; top:.3rem; right:.3rem; display:none;
             width:24px; height:24px; border-radius:7px; border:1px solid var(--border);
             background:color-mix(in srgb, var(--fond) 80%, transparent);
             color:var(--muted); font-size:.72rem; line-height:1; cursor:pointer;
             padding:0; align-items:center; justify-content:center; }
  html[data-admin] .une .reglage { display:flex; }
  .reglage:hover, .reglage:focus-visible { color:var(--chaud); border-color:var(--chaud); outline:none; }

  .etat { color:var(--muted); font-size:.72rem; text-align:center; margin:auto 0; }
  #sbxbar { margin-top:0; }
  html[data-mega] #sbxbar { margin-top:1rem; }
</style>
</head>
<body>

<div class="mw">
  <div class="tete">
    <span class="ic">🌐</span><b>Mes sites</b>
    <span class="n" id="n"></span>
  </div>

  <button type="button" class="une" id="une" hidden>
    <img id="une-img" alt="">
    <span class="sans" id="une-sans" hidden aria-hidden="true">🗒️</span>
    <span class="voile"><span class="t" id="une-t"></span><span class="d" id="une-d"></span></span>
    <span class="reglage" id="une-reg" title="Réglages du site (vue détail, édition)">⚙</span>
  </button>

  <div class="bande" id="bande"></div>
  <p class="etat" id="etat">lecture…</p>
  <div id="sbxbar"></div>
</div>

<script>
(function () {
  "use strict";
  var el = function (id) { return document.getElementById(id); };

  var q = new URLSearchParams(location.search);
  var MEGA = q.get("mega") === "1";
  if (MEGA) { document.documentElement.setAttribute("data-mega", ""); }
  // Le thème vient du Hall : la carte ne décide pas seule de son fond, sinon
  // elle jure avec le cadre qui la porte.
  var th = q.get("theme");
  if (th === "dark" || th === "light") {
    document.documentElement.setAttribute("data-theme", th);
  }

  // SESSION : le jeton du Hall vit dans localStorage, même origine. On ne s'en
  // sert pas pour appeler — seulement pour savoir s'il y a lieu de PROPOSER
  // les réglages. Un invité ne voit pas le bouton.
  try {
    if (localStorage.getItem("sbx_token") || localStorage.getItem("secubox_token")) {
      document.documentElement.setAttribute("data-admin", "");
    }
  } catch (e) { /* stockage refusé : pas de bouton, c'est le repli sûr. */ }

  var ADMIN = "https://admin.gk2.secubox.in";
  var SHOT = "/api/v1/metablogizer/site/";

  // TRIS — plusieurs lectures du MÊME parc, choisies par la barre à pastilles
  // en pied. Rien n'est inventé : tout sort de la même projection publique.
  var TRIS = [
    { lab: "🆕 Récents",  tri: function (a, b) { return (b.last_updated || "").localeCompare(a.last_updated || ""); } },
    { lab: "🖼️ Illustrés", tri: function (a, b) { return (b.vignette - a.vignette) || a.name.localeCompare(b.name); } },
    { lab: "🔤 A–Z",      tri: function (a, b) { return a.name.localeCompare(b.name); } },
    { lab: "🕳️ Sans aperçu", tri: function (a, b) { return (a.vignette - b.vignette) || a.name.localeCompare(b.name); } }
  ];

  var tous = [], liste = [], i = 0, pause = false, battement = null;
  var SUIVANTES = MEGA ? 400 : 10;

  function ouvrir(s) {
    var url = "https://" + s.domain + "/";
    try { parent.postMessage({ sbx: "surf", url: url }, "*"); }
    catch (e) { window.open(url, "_blank", "noopener"); }
  }
  function reglages(s) {
    // La vue détail EN ÉDITION : `edit=1` déplie le formulaire et y pose le
    // curseur, au lieu de laisser chercher en bas de page.
    var url = ADMIN + "/metablogizer/site.html?name=" + encodeURIComponent(s.name) + "&edit=1";
    try { parent.postMessage({ sbx: "surf", url: url }, "*"); }
    catch (e) { window.open(url, "_blank", "noopener"); }
  }

  function pose(n) {
    if (!liste.length) { return; }
    i = ((n % liste.length) + liste.length) % liste.length;
    var s = liste[i];
    el("une").hidden = false;
    el("une-t").textContent = s.title;
    el("une-d").textContent = s.domain;
    var img = el("une-img"), sans = el("une-sans");
    if (s.vignette) {
      img.src = SHOT + encodeURIComponent(s.name) + "/screenshot";
      img.hidden = false; sans.hidden = true;
    } else {
      img.removeAttribute("src"); img.hidden = true; sans.hidden = false;
    }

    // ON RÉUTILISE LES BOUTONS AU LIEU DE LES RECRÉER. Reconstruire innerHTML à
    // chaque rotation DÉTRUIRAIT les <img> et les rechargerait : le temps du
    // chargement, la vignette serait vide — elles « disparaîtraient » par
    // intermittence. On ne change que ce qui bouge.
    var suite = [], k;
    for (k = 1; k <= SUIVANTES && k < liste.length; k++) { suite.push(liste[(i + k) % liste.length]); }
    var bande = el("bande");
    while (bande.children.length < suite.length) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "vig";
      var im = document.createElement("img");
      im.alt = ""; im.loading = "lazy"; im.decoding = "async";
      // Un échec de chargement ne laisse pas de trou : on masque l'image
      // cassée plutôt que d'afficher l'icône de fichier absent.
      im.addEventListener("error", function () { this.style.visibility = "hidden"; });
      im.addEventListener("load", function () { this.style.visibility = ""; });
      var lab = document.createElement("span"); lab.className = "l";
      b.appendChild(im); b.appendChild(lab); bande.appendChild(b);
    }
    while (bande.children.length > suite.length) { bande.removeChild(bande.lastChild); }
    for (k = 0; k < suite.length; k++) {
      (function (bt, s2) {
        var im2 = bt.firstChild, src = s2.vignette ? (SHOT + encodeURIComponent(s2.name) + "/screenshot") : "";
        if (src) { if (im2.getAttribute("src") !== src) { im2.setAttribute("src", src); } }
        else { im2.removeAttribute("src"); im2.style.visibility = "hidden"; }
        bt.lastChild.textContent = s2.title;
        bt.title = s2.title + " — " + s2.domain;
        bt.onclick = function () { ouvrir(s2); };
      })(bande.children[k], suite[k]);
    }
  }

  function applique(k) {
    var t = TRIS[k] || TRIS[0];
    liste = tous.slice().sort(t.tri);
    i = 0;
    pose(0);
  }

  function tourne() {
    if (battement) { clearInterval(battement); }
    // Six secondes : le temps de lire un titre sans que la carte s'agite.
    battement = setInterval(function () { if (!pause && liste.length > 1) { pose(i + 1); } }, 6000);
  }

  // Le survol suspend — on ne lit pas un titre qui s'échappe. Le Hall signale
  // aussi le survol de la carte DANS la mosaïque, par message.
  document.addEventListener("mouseenter", function () { pause = true; }, true);
  document.addEventListener("mouseleave", function () { pause = false; }, true);
  addEventListener("message", function (ev) {
    var d = ev && ev.data; if (!d || !d.sbx) { return; }
    if (d.sbx === "survol" || d.sbx === "pause") { pause = true; }
    else if (d.sbx === "quitte" || d.sbx === "reprend") { pause = false; }
  });
  el("une").addEventListener("click", function () { if (liste[i]) { ouvrir(liste[i]); } });
  el("une-reg").addEventListener("click", function (ev) {
    // `stopPropagation` : sans lui, le clic traverse et OUVRE LE SITE
    // par-dessus les réglages — deux actions pour un geste.
    ev.stopPropagation();
    if (liste[i]) { reglages(liste[i]); }
  });

  function panne(msg) {
    el("etat").hidden = false;
    el("etat").textContent = msg;
    el("une").hidden = true;
    el("n").textContent = "";
  }

  function charge() {
    fetch("/api/v1/metablogizer/public/mosaique", { headers: { Accept: "application/json" } })
      .then(function (r) {
        var ct = r.headers.get("content-type") || "";
        // Le Hall rend sa coquille SPA en 200 pour une route inconnue : sans ce
        // contrôle on parserait du HTML, et la carte resterait muette sans
        // qu'on sache pourquoi.
        if (!r.ok || ct.indexOf("application/json") === -1) { throw new Error("relais absent"); }
        return r.json();
      })
      .then(function (d) {
        tous = (d && d.sites) || [];
        if (!tous.length) { panne("aucun site publié pour l'instant."); return; }
        el("etat").hidden = true;
        var avec = tous.filter(function (s) { return s.vignette; }).length;
        el("n").textContent = tous.length + " sites · " + avec + " illustrés";
        applique(courant);
        tourne();
      })
      .catch(function (e) { panne("mosaïque injoignable (" + e.message + ")."); });
  }

  // BARRE À PASTILLES — la bibliothèque partagée du Hall. Sans elle (page
  // ouverte hors du Hall), on reste sur le premier tri : la carte marche,
  // elle propose simplement moins.
  var courant = 0;
  if (typeof window.SBXSliceBar === "function") {
    window.SBXSliceBar(el("sbxbar"), {
      autoMs: 0, pauseOnHover: false, preview: false,
      slices: TRIS.map(function (t) { return { label: t.lab }; }),
      onShow: function (k) { courant = k; if (tous.length) { applique(k); } }
    });
  }

  charge();
  // Les vignettes changent au rythme du shotter, pas à la seconde.
  setInterval(charge, 300000);
})();
</script>
</body>
</html>
