  SecuBox #1273 — carte PeerTube.

  POURQUOI ELLE EST SERVIE PAR LE HALL, EXCEPTIONNELLEMENT. PeerTube est un
  logiciel amont : on ne lui ajoute pas de vue /micro. La règle « le service
  sert sa carte » ne peut donc pas s'appliquer, et la carte vit ici — mais elle
  ne PEINT rien : elle lit l'API REST publique de PeerTube, qui donne titres,
  vignettes, durées et vues. Aucune donnée n'est inventée, aucune identité
  n'est requise.

  TOUT EST DE MÊME ORIGINE. Le vhost du Hall relaie l'API et les vignettes :
  sa politique impose `connect-src 'self'` et `img-src 'self'`, et relâcher
  l'une ou l'autre pour une carte coûterait plus cher que le relais.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PeerTube — vue micro</title>
<link rel="stylesheet" href="../spicy.css">
<link rel="stylesheet" href="../slicebar.css">
<script src="../slicebar.js"></script>
<style>
  :root { --fond:#ffffff; --texte:#1a1a22; --muted:#6b6b7a; --border:#e2e2ea; --accent:#c0392b; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --fond:#14141c; --texte:#e8e6d9; --muted:#8a8a99;
      --border:#2a2a36; --accent:#ef6b5c; }
  }
  :root[data-theme="dark"] { --fond:#14141c; --texte:#e8e6d9; --muted:#8a8a99;
    --border:#2a2a36; --accent:#ef6b5c; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; scrollbar-width:none; }
  html::-webkit-scrollbar, body::-webkit-scrollbar { width:0; display:none; }
  body { background:var(--fond); color:var(--texte);
         font-family:"Inter",system-ui,sans-serif; font-size:14px; line-height:1.45; }
  .mw { display:flex; flex-direction:column; height:100%; padding:.6rem .7rem; gap:.4rem; }
  .tete { display:flex; align-items:baseline; gap:.4rem; }
  .tete .ic { font-size:1rem; } .tete b { font-size:.88rem; }
  .tete .n { margin-left:auto; font-size:.56rem; letter-spacing:.08em;
             text-transform:uppercase; color:var(--muted); font-variant-numeric:tabular-nums; }

  .une { position:relative; border-radius:10px; overflow:hidden; height:104px;
         background:var(--border); flex:0 0 auto; }
  .une img { width:100%; height:100%; object-fit:cover; display:block; }
  .une .voile { position:absolute; inset:auto 0 0 0; padding:.35rem .45rem .3rem;
                background:linear-gradient(transparent, rgba(0,0,0,.85)); color:#fff; }
  .une .t { font-size:.74rem; font-weight:650; line-height:1.2;
            display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .une .dur { position:absolute; top:6px; right:6px; background:rgba(0,0,0,.7); color:#fff;
              border-radius:4px; padding:1px 5px; font-size:.6rem;
              font-variant-numeric:tabular-nums; }
  /* Le bouton de lecture est GROS et centré : c'est le geste attendu sur une
     vignette vidéo, et le chercher serait déjà un échec. */
  .une .lire { position:absolute; inset:0; display:grid; place-items:center;
               background:none; border:0; cursor:pointer; color:#fff; }
  .une .lire span { width:38px; height:38px; border-radius:50%; display:grid; place-items:center;
                    background:rgba(0,0,0,.55); border:1px solid rgba(255,255,255,.5);
                    font-size:.9rem; transition:transform .12s ease, background .12s ease; }
  .une .lire:hover span { transform:scale(1.08); background:var(--accent); }
  .une iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
  /* AGRANDIR (#1275). Une carte fait 250 px : regarder une video dedans est
     une intention, pas une fatalite. Le bouton reste discret jusqu'au survol —
     il ne doit pas manger l'image. */
  .une .zoom { position:absolute; top:6px; right:6px; width:24px; height:24px;
               border-radius:6px; border:1px solid rgba(255,255,255,.45);
               background:rgba(0,0,0,.55); color:#fff; font-size:.72rem;
               cursor:pointer; opacity:0; transition:opacity .15s; }
  .une:hover .zoom, .une .zoom:focus-visible { opacity:1; }

  .top { display:flex; flex-wrap:wrap; gap:5px; }
  /* Les suivantes en VIGNETTES et non en titres : sur une plateforme vidéo,
     l'image renseigne plus vite que le nom du fichier. */
  .top button { flex:1 1 calc(25% - 4px); min-width:0; border:0; padding:0; background:none; cursor:pointer;
                border-radius:7px; overflow:hidden; position:relative; height:44px; }
  .top button img { width:100%; height:100%; object-fit:cover; display:block; }
  .top button:hover { outline:2px solid var(--accent); outline-offset:1px; }
  .top .vide { flex:1 1 calc(25% - 4px); height:44px; border-radius:7px; background:var(--border); }

  .pied { margin-top:auto; display:flex; align-items:center; gap:6px; padding-top:.3rem;
          border-top:1px solid var(--border); font-size:.57rem; letter-spacing:.07em;
          text-transform:uppercase; color:var(--muted); text-decoration:none; }
  .pied .grow { flex:1; } .pied:hover { color:var(--accent); }
  .pouls { width:5px; height:5px; border-radius:50%; background:var(--accent);
           animation:bat 2.4s ease-in-out infinite; }
  @keyframes bat { 0%,100%{opacity:.28} 50%{opacity:1} }
  @media (prefers-reduced-motion: reduce){ .pouls{animation:none;opacity:.7} }

  /* ── SLICER partagé (SBXSliceBar, #1352) ───────────────────────────────────
     Récentes / Populaires / Catégories / Chaînes / Playlists via la
     bibliothèque commune (/shared → ../slicebar). Ce conteneur la fixe en bas
     et lui rend le filet dégradé + le fond ; --cyan/--line l'accrochent au
     thème. Preview au survol DÉSACTIVÉE ici (elle relancerait un fetch et
     couperait une lecture en cours) — override contextuel de la couche. */
  .mw { padding-bottom:34px; }
  .pt-slbox { position:fixed; left:0; right:0; bottom:0; z-index:20;
              background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 6%,var(--fond)),var(--fond));
              border-top:2px solid transparent;
              border-image:linear-gradient(90deg,var(--accent),#f0b429,#28d6ff) 1;
              box-shadow:0 -8px 20px -14px rgba(0,0,0,.55);
              --cyan:var(--accent); --line:var(--border); }
  .pt-slbox .sbx-bar { border-top:none; padding:7px 12px; }
  .pt-slbox .sbx-dots button.on { box-shadow:0 0 10px -1px var(--accent); }

  /* ── Pop-in helper : survol d'une vignette → titre + chaîne + conseil. */
  .ptpop { position:fixed; z-index:40; max-width:230px; padding:8px 10px; border-radius:10px;
           background:var(--fond); color:var(--texte); font-size:12px; line-height:1.4;
           border:1px solid color-mix(in srgb,var(--accent) 40%,var(--border));
           box-shadow:0 12px 30px -12px rgba(0,0,0,.7),0 0 0 1px color-mix(in srgb,var(--accent) 16%,transparent);
           opacity:0; transform:translateY(4px); pointer-events:none; transition:.15s; overflow:hidden; }
  .ptpop.on { opacity:1; transform:none; }
  .ptpop::before { content:""; position:absolute; left:0; right:0; top:0; height:2px;
           background:linear-gradient(90deg,var(--accent),#f0b429,#28d6ff); }
  .ptpop b { color:var(--accent); } .ptpop .adv { display:block; color:var(--muted); margin-top:4px; font-size:11px; }
</style>

<div class="mw">
  <div class="tete"><span class="ic">📹</span><b>PeerTube</b><span class="n" id="n">…</span></div>
  <div class="une" id="une">
    <img id="une-img" alt="">
    <span class="dur" id="une-dur"></span>
    <button class="lire" id="lire" type="button" title="Lire ici" aria-label="Lire"><span>▶</span></button>
    <span class="voile"><span class="t" id="une-t">lecture du catalogue…</span></span>
  </div>
  <div class="top" id="top"></div>
  <a class="pied" id="pied" href="#" title="Ouvrir dans le viewer"><span class="pouls" id="pouls"></span>
    <span id="pied-t">vidéos</span><span class="grow"></span><span id="rang"></span></a>
</div>

<script>
(function () {
  "use strict";
  // Relais de MEME ORIGINE poses par le vhost du Hall (voir hall.vhost.conf).
  // L'API et les vignettes passent par le relais de MEME origine (la carte
  // vit sous `connect-src 'self'` et `img-src 'self'`) ; le lecteur, lui,
  // reste sur l'origine de PeerTube — voir lance().
  var PT_HOTE = 'peertube.gk2.secubox.in';
  // SLICES (#peertube-slices) : plusieurs sources pour la MÊME carte, choisies
  // par la barre à bullets en bas — comme la radio. Récentes/Populaires sont
  // deux tris de l'API vidéos ; Catégories parcourt le catalogue par genre ;
  // Playlists liste les listes de lecture. Rien n'est inventé : tout vient de
  // l'API REST publique relayée en même origine.
  var VUES = [
    { k:'recentes',   lab:'🆕 Récentes',   url:'/pt/api/v1/videos?count=24&sort=-publishedAt&nsfw=false', kind:'video' },
    { k:'populaires', lab:'🔥 Populaires', url:'/pt/api/v1/videos?count=24&sort=-views&nsfw=false',        kind:'video' },
    { k:'categories', lab:'📂 Catégories', url:null,                                                       kind:'category' },
    { k:'chaines',    lab:'📺 Chaînes',    url:'/pt/api/v1/video-channels?count=18&sort=-createdAt',       kind:'channel' },
    { k:'playlists',  lab:'🎞️ Playlists',  url:'/pt/api/v1/video-playlists?count=18&sort=-updatedAt',      kind:'playlist' }
  ];
  var vue = 0;                  // index de la vue courante
  var cats = null, catIdx = 0;  // {id:nom} des catégories + rotation interne
  var vids = [], i = 0, enPause = false, joue = false;

  var el = function (id) { return document.getElementById(id); };
  var esc = function (t) { return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) {
      return ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' })[c]; }); };
  function mmss(s) {
    s = Math.max(0, Math.floor(Number(s) || 0));
    var h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), r = s % 60;
    return (h ? h + ':' + ('0' + m).slice(-2) : String(m)) + ':' + ('0' + r).slice(-2);
  }
  function vign(v) { return v.thumbnailPath ? '/pt' + v.thumbnailPath : ''; }

  function montre() {
    if (!vids.length || joue) return;
    var v = vids[i % vids.length], img = el('une-img'), src = vign(v);
    if (src) {
      if (img.getAttribute('src') !== src) img.src = src;
      img.style.display = '';
      img.onerror = function () { this.style.display = 'none'; };
    } else { img.style.display = 'none'; }
    el('une-t').textContent = v.name || '—';
    el('une-dur').textContent = v._playlist ? '≡ liste' : v._channel ? '📺 chaîne' : mmss(v.duration);
    el('rang').textContent = ((i % vids.length) + 1) + '/' + vids.length;
    el('pied-t').textContent = (v.channel && v.channel.displayName) || 'vidéos';

    var suite = [], k;
    for (k = 1; k <= 8 && k < vids.length; k++) suite.push({ v: vids[(i + k) % vids.length], idx: (i + 1 + k - 1) % vids.length });

    // ON REUTILISE LES BOUTONS AU LIEU DE LES RECREER (#1349). Reconstruire
    // innerHTML a chaque rotation DETRUISAIT les <img> et les rechargeait : le
    // temps du chargement, la miniature etait vide — d'ou « elles
    // disparaissent parfois ». On garde les memes elements et on ne change que
    // ce qui bouge (src, cible), donc l'ancienne image reste affichee jusqu'a
    // ce que la nouvelle soit prete.
    var top = el('top');
    while (top.children.length < suite.length) {
      var b = document.createElement('button');
      b.type = 'button';
      var im = document.createElement('img');
      im.alt = ''; im.loading = 'eager'; im.decoding = 'async';
      // UN ECHEC DE CHARGEMENT NE LAISSE PLUS DE TROU : on cache l'image
      // cassee plutot que d'afficher l'icone de fichier absent.
      im.addEventListener('error', function () { this.style.visibility = 'hidden'; });
      im.addEventListener('load', function () { this.style.visibility = ''; });
      b.appendChild(im); top.appendChild(b);
    }
    while (top.children.length > suite.length) top.removeChild(top.lastChild);

    for (k = 0; k < suite.length; k++) {
      var bt = top.children[k], w = suite[k].v, sr = vign(w), img2 = bt.firstChild;
      bt.dataset.i = suite[k].idx;
      bt.title = w.name || '';
      // On ne REASSIGNE la src que si elle change : sinon on rechargerait la
      // meme image pour rien, et c'est justement le rechargement qui clignote.
      if (sr && img2.getAttribute('src') !== sr) img2.src = sr;
      bt.style.display = sr ? '' : 'none';
    }
  }

  // LIRE ICI : le lecteur d'embarquement de PeerTube remplace la vignette. On
  // ne recopie pas un lecteur — celui de PeerTube sait deja lire ses formats,
  // ses sous-titres et son P2P.
  var depart = 0;   // position à laquelle la prochaine lecture doit reprendre
  var reprendFait = false;   // la reprise au refresh ne se tente qu'une fois

  function lance(n) {
    var v = vids[n % vids.length];
    if (!v) return;
    // UNE LISTE OU UNE CHAÎNE N'EST PAS UNE VIDÉO : on n'embarque pas un lecteur,
    // on ouvre PeerTube pour parcourir (catalogue complet dans le Hall).
    if (v._browse) {
      if (parent !== window) { try { parent.postMessage({ sbx: 'ouvre', id: 'peertube' }, '*'); } catch (e) {} }
      return;
    }
    i = n; joue = true;
    // LE LECTEUR RESTE SUR SON ORIGINE, ET C'EST UNE CORRECTION (#1276).
    // Relaye sous /pt/, il demandait ses propres ressources a la RACINE du
    // Hall — /client/…, /plugins/… — qui n'existent pas ici : le Hall
    // repondait sa page d'accueil, et le navigateur refusait des modules
    // annonces en text/html. Relayer la moitie de PeerTube pour corriger cela
    // aurait pollue l'espace de noms du Hall pour rien.
    //
    // Le CADRE, lui, n'a pas besoin d'etre de meme origine : seuls `fetch` et
    // les images l'exigent, et ceux-la restent relayes. La politique de la
    // carte nomme deja peertube dans `frame-src`, et HAProxy a reecrit son
    // `frame-ancestors` pour nous laisser l'encadrer.
    var u = 'https://' + PT_HOTE + '/videos/embed/' + encodeURIComponent(v.uuid)
          + '?api=1&autoplay=1&title=0&warningTitle=0&peertubeLink=0'
          // `start` n'est ajouté QUE si le lecteur nous a réellement donné une
          // position : reprendre à une seconde inventée serait pire que de
          // reprendre au début.
          + (depart > 2 ? '&start=' + Math.floor(depart) + 's' : '');
    depart = 0;
    position = depart;
    // ON NE RETIENT PAS ICI (#1280). Lancer n'est pas regarder : retenir des le
    // clic faisait relancer la video a CHAQUE rafraichissement, meme quand on
    // avait juste effleure le bouton avant de partir. On ne retient que ce que
    // le lecteur nous dit LUI-MEME : voir l'ecoute plus bas.
    el('une').innerHTML = '<iframe id="cadre-pt" src="' + esc(u) + '"'
      + ' allow="autoplay; fullscreen" allowfullscreen title="' + esc(v.name) + '"></iframe>'
      + '<button class="zoom" id="zoom" type="button" title="Agrandir" aria-label="Agrandir">⤢</button>';
    annonce(v, true);
    bat(v);
    // ON NE S'ANNONCE PLUS (#1324). C'ETAIT CE QUI TUAIT LE LECTEUR.
    //
    // On envoyait un `__ready` NON SOLLICITE, porteur d'un `id`, douze fois de
    // suite. Or dans jschannel `__ready` n'est pas une requête mais une
    // salutation : elle n'a pas d'`id`, et surtout elle n'arrive QU'UNE FOIS.
    // La deuxième trouve le canal déjà ouvert et le fait tomber —
    //   « Embed player crashed: can't access property "length",
    //     n.publish is undefined »
    // suivi d'une page noire et d'un « player is not compatible with your web
    // browser » qui accusait le navigateur d'une panne qu'on causait nous-mêmes.
    //
    // C'est le lecteur qui salue en premier ; notre seul rôle est de répondre,
    // ce que fait l'écouteur plus bas. Se présenter en plus n'ajoutait rien
    // qu'on n'avait déjà.
  }

  // La barre du Hall doit savoir ce qui joue. On n'a pas la position — le
  // lecteur de PeerTube ne la donne pas sans son API de fenetre — alors on ne
  // l'invente pas : titre et source, et rien d'autre.
  // BATTEMENT (#1287). Le Hall retire un flux qui n'a rien dit depuis dix
  // secondes — c'est ce qui fait disparaitre une rangee quand un service
  // meurt. La carte n'annoncait qu'au lancement : dix secondes plus tard, la
  // pastille s'evanouissait alors que la video jouait toujours.
  //
  // On ne peut pas savoir si le lecteur amont est en pause sans son API de
  // fenetre ; on maintient donc l'annonce tant que le lecteur est POSE, et le
  // `stop` de la carte est ce qui l'arrete. Mieux vaut une pastille presente
  // pendant une pause qu'une pastille absente pendant la lecture.
  var battement = null;
  function bat(v) {
    if (battement) clearInterval(battement);
    battement = setInterval(function () {
      if (!joue || !document.getElementById('cadre-pt')) {
        clearInterval(battement); battement = null; return;
      }
      annonce(v, true);
    }, 2000);
  }

  function annonce(v, actif) {
    if (parent === window) return;
    try {
      parent.postMessage({
        sbx: 'media', id: 'peertube',
        // Le TYPE permet au Hall de traiter une video autrement qu'un flux
        // audio : lui offrir l'agrandissement, et mettre le son en pause
        // ailleurs — trois sources sonores a la fois ne sont pas un bureau,
        // c'est un vacarme.
        type: 'video',
        // L'URL DE VISIONNAGE (#1266). Le Hall s'en sert pour ATTRAPER la video
        // dans son viewer quand on l'agrandit (il en derive l'embed natif a la
        // position `t`), et remet cette carte en vitrine : le flux est deplace,
        // jamais joue a deux endroits.
        href: (v && v.uuid) ? ('https://' + PT_HOTE + '/w/' + encodeURIComponent(v.uuid)) : '',
        titre: (v && v.name) || 'PeerTube',
        sous: (v && v.channel && v.channel.displayName) || 'PeerTube',
        // VIGNETTE DE SOURCE (#1266b) : la miniature de CETTE video, pour que la
        // barre média la montre — différente pour chaque flux. URL /pt de MÊME
        // origine (proxy du Hall), donc chargeable par la barre.
        vignette: vign(v),
        // `t` n'est plus toujours nul : quand le lecteur nous donne sa
        // position, la barre peut la montrer. Quand il se tait, elle vaut 0 et
        // la barre n'affiche rien — pas une position inventee.
        joue: !!actif, t: position || 0,
        d: (v && Number(v.duration)) || 0, fin: !actif
      }, '*');
    } catch (e) {}
  }

  // Le plein ecran porte sur le CONTENEUR et non sur le cadre : on garde ainsi
  // le bouton de sortie et le fond, au lieu d'un cadre nu qui semble bloque.
  function agrandis() {
    var z = el('une');
    if (!z) return;
    if (document.fullscreenElement) { document.exitFullscreen(); return; }
    if (z.requestFullscreen) z.requestFullscreen().catch(function () {});
  }
  el('une').addEventListener('click', function (e) {
    if (e.target.closest('#zoom')) { agrandis(); return; }
    if (e.target.closest('#lire')) lance(i);
  });
  el('top').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-i]');
    if (b) lance(Number(b.dataset.i));
  });
  // LE PIED OUVRE LA PAGE DU SERVICE PEERTUBE (#1237). Pas une video : LIRE une
  // video se fait deja en cliquant une vignette (le lecteur natif remplace
  // alors la vignette dans la carte). Le pied, lui, embarque le SITE peertube
  // complet dans le Hall — comme n'importe quel autre service (openService) —
  // pour naviguer le catalogue, les chaines, la recherche.
  el('pied').addEventListener('click', function (e) {
    e.preventDefault();
    if (parent === window) return;
    try { parent.postMessage({ sbx: 'ouvre', id: 'peertube' }, '*'); } catch (x) {}
  });

  addEventListener('message', function (ev) {
    var d = ev.data;
    if (!d || d.sbx !== 'cmd') return;
    // `stop` rend la carte a son etat de vitrine : c'est le seul ordre qu'on
    // peut honorer sans l'API de fenetre du lecteur amont. On le dit plutot
    // que de faire semblant d'obeir aux autres.
    if (d.action === 'zoom') { agrandis(); return; }
    // `pause` est traite comme `stop` : sans l'API de fenetre du lecteur
    // amont, on ne sait pas le mettre en pause — on sait le RETIRER. On le
    // fait donc, plutot que d'ignorer l'ordre et de laisser deux sons.
    if (d.action === 'stop' || d.action === 'pause') {
      joue = false;
      if (battement) { clearInterval(battement); battement = null; }
      oublie();
      el('une').innerHTML = '<img id="une-img" alt=""><span class="dur" id="une-dur"></span>'
        + '<button class="lire" id="lire" type="button" title="Lire ici" aria-label="Lire">'
        + '<span>▶</span></button><span class="voile"><span class="t" id="une-t"></span></span>';
      montre();
      annonce(vids[i % (vids.length || 1)], false);
    }
  });

  document.addEventListener('mouseenter', function () { enPause = true; }, true);
  document.addEventListener('mouseleave', function () { enPause = false; }, true);

  // ── ÉTAT PERSISTANT (#1277) ───────────────────────────────────────────────
  //
  // La radio et le podcaster survivent au rafraîchissement ; la vidéo repartait
  // de zéro — on rechargeait la page et le film avait disparu. On retient donc
  // ce qui se regardait.
  //
  // CE QU'ON RETIENT, ET CE QU'ON NE PRÉTEND PAS SAVOIR. L'identité de la vidéo,
  // oui. La POSITION, non : le lecteur amont ne la donne pas sans son API de
  // fenêtre, et la déduire du temps écoulé serait fausse dès la première pause.
  // On reprend donc la vidéo, pas la seconde — et on le dit plutôt que
  // d'afficher une position inventée.
  var CLEF = 'sbx.peertube.etat';
  var position = 0;   // secondes, telles que le lecteur les annonce

  function retiens(v) {
    try {
      localStorage.setItem(CLEF, JSON.stringify({
        uuid: v.uuid, quand: Date.now(), pos: Math.floor(position) || 0
      }));
    } catch (e) {}
  }

  // ── ÉCOUTE DU LECTEUR AMONT (#1279) ───────────────────────────────────────
  //
  // Avec `api=1`, le lecteur de PeerTube parle par postMessage — protocole
  // jschannel : une poignée de main `__ready`, puis des notifications dont
  // `playbackStatusUpdate`, qui porte la position.
  //
  // ON ÉCOUTE, ON NE PILOTE PAS. Recevoir une position ne coûte rien et ne
  // casse rien si le lecteur change de protocole : dans ce cas on ne reçoit
  // simplement plus rien, et la reprise retombe sur l'identité seule — ce
  // qu'elle faisait déjà. C'est pour cela qu'on lit DÉFENSIVEMENT, en
  // acceptant plusieurs formes plutôt qu'une seule figée : mieux vaut ne rien
  // comprendre que de croire comprendre.
  function positionDe(d) {
    if (!d || typeof d !== 'object') return null;
    var p = d.params || d.data || d;
    var v = (p && (p.position !== undefined ? p.position : p.currentTime));
    return (typeof v === 'number' && isFinite(v) && v >= 0) ? v : null;
  }
  addEventListener('message', function (ev) {
    var c = document.getElementById('cadre-pt');
    if (!c || ev.source !== c.contentWindow) return;
    var d = ev.data;
    // JSCHANNEL POSTE DES CHAINES, PAS DES OBJETS (#1283). Sa mise en oeuvre
    // sérialise chaque message : `ev.data` arrive en JSON textuel, et le test
    // « est-ce un objet ? » le rejetait en silence. Aucune position n'était
    // donc jamais reçue, et la reprise retombait toujours sur l'identité seule.
    if (typeof d === 'string') {
      try { d = JSON.parse(d); } catch (e) { return; }
    }
    // Poignée de main : sans réponse, jschannel n'émet jamais ses
    // notifications. On répond sans rien demander en retour.
    // JSCHANNEL PREFIXE SES METHODES PAR LA PORTEE (#1311). Le lecteur n'envoie
    // pas `__ready` mais `peertube::__ready` : chercher le nom nu ne pouvait
    // rien trouver, la poignée de main n'aboutissait jamais, et aucune
    // notification de position n'arrivait. On regarde donc la FIN du nom.
    var nomBrut = String((d && d.method) || '');
    if (nomBrut.slice(-7) === '__ready') {
      // ── LA POIGNEE DE MAIN, ENFIN CORRECTE (#1330) ──────────────────────
      //
      // On repondait `params: 'pong'`, une CHAINE. Leur jschannel fait :
      //
      //   n.type === 'publish-request' && notify({… publish: h})
      //   for (var r = 0; r < n.publish.length; r++) …
      //
      // — il lit `params.publish.length`. Sur une chaine, `publish` vaut
      // `undefined`, d'ou « can't access property "length", n.publish is
      // undefined ». Et comme le lecteur installe
      // `window.onerror = displayIncompatibleBrowser`, cette erreur-la — comme
      // n'importe quelle autre — s'affichait en « player is not compatible
      // with your web browser ». Le message accusait le navigateur ; la faute
      // etait dans notre reponse.
      //
      // La bonne reponse est un OBJET, avec une liste de methodes publiees.
      // La notre est vide : on ecoute ses notifications, on ne lui expose
      // aucune methode. Leur boucle tourne alors zero fois, ce qui est
      // exactement ce qu'on veut.
      var p = d.params;
      if (!p || p.type !== 'publish-request') return;
      var reponse = { id: d.id, method: nomBrut,
                      params: { type: 'publish-reply', publish: [] } };
      try {
        c.contentWindow.postMessage(
          (typeof ev.data === 'string') ? JSON.stringify(reponse) : reponse, '*');
      } catch (e) {}
      return;
    }
    // FIN DE VIDEO : LA RANGEE ET LA PASTILLE DISPARAISSENT (#1352). Le lecteur
    // envoie `playbackState:"ended"` a la fin ; a defaut, une position au ras
    // de la duree le dit aussi. On annonce alors `fin` — le Hall retire la
    // rangee et efface la pastille — et on revient a la vitrine.
    var par = (d && d.params) || {};
    var etat = par.playbackState || par.state || '';
    var duree = Number(par.duration) || 0;
    var posC = positionDe(d);
    if (joue && (etat === 'ended' || (duree > 0 && posC !== null && posC >= duree - 1.5))) {
      joue = false;
      if (battement) { clearInterval(battement); battement = null; }
      oublie();
      try { parent.postMessage({ sbx: 'media', id: 'peertube', joue: false, fin: true }, '*'); } catch (e) {}
      el('une').innerHTML = '<img id="une-img" alt=""><span class="dur" id="une-dur"></span>'
        + '<button class="lire" id="lire" type="button" title="Lire ici" aria-label="Lire">'
        + '<span>▶</span></button><span class="voile"><span class="t" id="une-t"></span></span>';
      montre();
      return;
    }

    // On ne retient que ce qui porte une position : le lecteur envoie aussi des
    // acquittements et des évènements qui n'en ont pas.
    var pos = positionDe(d);
    if (pos !== null) {
      position = pos;
      // On écrit rarement : à chaque battement du lecteur, localStorage
      // deviendrait un goulot pour rien. Cinq secondes suffisent à reprendre
      // sans que la perte soit sensible.
      if (!retiens._quand || Date.now() - retiens._quand > 5000) {
        retiens._quand = Date.now();
        var v = vids[i % (vids.length || 1)];
        if (v) retiens(v);
      }
    }
  });
  function oublie() { try { localStorage.removeItem(CLEF); } catch (e) {} }
  function reprend() {
    var e = null;
    try { e = JSON.parse(localStorage.getItem(CLEF) || 'null'); } catch (x) {}
    // DEUX CONDITIONS, ET LES DEUX COMPTENT (#1280).
    //
    // `pos` prouve que le lecteur a REELLEMENT joué : sans lui, on n'a qu'un
    // clic, et un clic ne justifie pas de relancer un film à chaque visite.
    //
    // Cinq minutes, pas six heures : un rafraîchissement pendant qu'on regarde
    // se compte en secondes. Revenir une heure plus tard n'est pas une lecture
    // interrompue, c'est une nouvelle visite — et elle mérite la vitrine, pas
    // un film qui redémarre tout seul.
    if (!e || !e.uuid || !e.pos) return false;
    if ((Date.now() - (e.quand || 0)) > 3e5) { oublie(); return false; }
    depart = Number(e.pos) || 0;
    position = depart;
    // Déjà dans la vue courante : on lance directement.
    for (var k = 0; k < vids.length; k++) if (vids[k].uuid === e.uuid) { lance(k); return true; }
    // Sinon (tranche restaurée différente, ou vue pas encore chargée) : on va
    // chercher la vidéo par son uuid (API PeerTube même origine) — la reprise
    // ne dépend plus de la tranche affichée.
    fetch('/pt/api/v1/videos/' + encodeURIComponent(e.uuid), { headers: { 'Accept': 'application/json' } })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (v) {
        if (!v || !v.uuid) { depart = 0; return; }
        vids = [v]; i = 0; lance(0);
      })
      .catch(function () { depart = 0; });
    return true;   // reprise lancée (asynchrone)
  }

  // Playlists & chaînes prennent la forme d'un item pour réutiliser montre()/le
  // carrousel. `_browse` = un clic ouvre PeerTube (pas un lecteur embarqué).
  function mapPlaylist(p) {
    return {
      name: p.displayName || p.name || 'Liste',
      thumbnailPath: p.thumbnailPath || '',
      duration: 0, uuid: p.uuid, _playlist: true, _browse: true,
      channel: { displayName: (p.videosLength != null ? (p.videosLength + ' vidéos') : 'Playlist') }
    };
  }
  function mapChannel(c) {
    var img = (c.banners && c.banners[0] && c.banners[0].path)
           || (c.avatars && c.avatars[0] && c.avatars[0].path)
           || (c.avatar && c.avatar.path) || '';
    return {
      name: c.displayName || c.name || 'Chaîne',
      thumbnailPath: img,
      duration: 0, uuid: c.name, _channel: true, _browse: true,
      channel: { displayName: (c.followersCount != null ? (c.followersCount + ' abonnés') : 'Chaîne') }
    };
  }

  // Catégories : on découvre les genres une fois, puis on en montre un à la fois
  // (catIdx tourne à chaque entrée dans la vue), en filtrant l'API vidéos.
  function chargeCategorie() {
    function pick() {
      var ids = Object.keys(cats || {});
      if (!ids.length) { vids = []; el('une-t').textContent = 'Pas de catégorie'; return; }
      catIdx = ((catIdx % ids.length) + ids.length) % ids.length;
      var id = ids[catIdx], nom = cats[id];
      // Le genre courant s'affiche dans le libellé de la barre partagée (elle ne
      // le réécrit qu'au prochain changement de slice, donc il tient le temps du
      // parcours des catégories).
      var _lab = (typeof ptbox !== 'undefined' && ptbox) ? ptbox.querySelector('.sbx-lab') : null;
      if (_lab) _lab.textContent = '📂 ' + nom;
      fetch('/pt/api/v1/videos?count=24&categoryOneOf=' + encodeURIComponent(id) + '&sort=-publishedAt&nsfw=false',
        { headers: { 'Accept': 'application/json' } })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (d) {
          vids = (d && d.data) || [];
          el('n').textContent = nom;
          if (!vids.length) { catIdx++; if (catIdx < Object.keys(cats).length) return pick();
            el('une-t').textContent = 'Catégorie vide'; return; }
          el('pouls').style.animation = ''; i = 0; montre();
        })
        .catch(function () { el('une-t').textContent = 'PeerTube injoignable'; });
    }
    if (cats) { pick(); return; }
    fetch('/pt/api/v1/videos/categories', { headers: { 'Accept': 'application/json' } })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) { cats = d || {}; pick(); })
      .catch(function () { el('une-t').textContent = 'PeerTube injoignable'; });
  }

  function charge() {
    // REPRISE AU REFRESH, UNE SEULE FOIS, AVANT TOUT : si une vidéo était en
    // cours (état récent + position), on la relance à sa position — quelle que
    // soit la tranche restaurée par le slicer (reprend() va chercher la vidéo
    // par son uuid au besoin).
    if (!reprendFait) { reprendFait = true; if (reprend()) return; }
    var V = VUES[vue];
    if (V.kind === 'category') { chargeCategorie(); return; }
    fetch(V.url, { headers: { 'Accept': 'application/json' } })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        var data = (d && d.data) || [];
        vids = (V.kind === 'playlist') ? data.map(mapPlaylist)
             : (V.kind === 'channel')  ? data.map(mapChannel) : data;
        el('n').textContent = d && d.total
          ? d.total + ' ' + (V.kind === 'playlist' ? 'listes' : V.kind === 'channel' ? 'chaînes' : 'vidéos') : '';
        if (!vids.length) {
          el('une-t').textContent = (V.kind === 'playlist') ? 'Aucune liste'
            : (V.kind === 'channel') ? 'Aucune chaîne' : 'Aucune vidéo';
          el('pouls').style.animation = 'none';
          return;
        }
        el('pouls').style.animation = '';
        i = 0; montre();
      })
      .catch(function () { el('une-t').textContent = 'PeerTube injoignable'; });
  }

  // ── BARRE À BULLETS (slicer partagé SBXSliceBar, #1352) ────────────────────
  // Click-only (autoMs:0 : pas d'auto-rotation entre vues — chaque vue refait un
  // fetch, on ne martèle pas l'API). Le carrousel de vignettes tourne DANS la
  // vue courante. La lib gère clic (fige) + persistance ; PREVIEW désactivée
  // (elle relancerait un fetch et couperait une lecture en cours).
  function appliqueVue(k) {
    if (VUES[k] && VUES[k].kind === 'category') catIdx++;   // un genre différent à chaque entrée
    vue = k;
    // Changer de vue arrête une lecture en cours et revient à la vitrine.
    if (joue) {
      joue = false; if (battement) { clearInterval(battement); battement = null; }
      oublie();
      el('une').innerHTML = '<img id="une-img" alt=""><span class="dur" id="une-dur"></span>'
        + '<button class="lire" id="lire" type="button" title="Lire ici" aria-label="Lire">'
        + '<span>▶</span></button><span class="voile"><span class="t" id="une-t"></span></span>';
      try { parent.postMessage({ sbx: 'media', id: 'peertube', joue: false, fin: true }, '*'); } catch (e) {}
    }
    charge();
  }
  if (window.SBXSliceBar) {
    var ptbox = document.createElement('div'); ptbox.className = 'pt-slbox';
    (document.querySelector('.mw') || document.body).appendChild(ptbox);
    window.SBXSliceBar(ptbox, {
      autoMs: 0, pauseOnHover: false, preview: false,
      slices: VUES.map(function (v) { return { label: v.lab }; }),
      onShow: function (k) { appliqueVue(k); }   // pilote la vue (charge inclus)
    });
  } else { charge(); }   // repli sans lib : charge la vue par défaut

  // ── POP-IN HELPER : survol d'une vignette → titre + chaîne + conseil. ───────
  (function () {
    var pop = document.createElement('div'); pop.className = 'ptpop'; document.body.appendChild(pop);
    function at(r) {
      var w = pop.offsetWidth, h = pop.offsetHeight, m = 6;
      var top = r.top - h - m; if (top < m) top = r.bottom + m;
      var left = r.left; if (left + w > innerWidth - m) left = innerWidth - m - w; if (left < m) left = m;
      pop.style.left = left + 'px'; pop.style.top = top + 'px';
    }
    function show(html, elm) { pop.innerHTML = html; pop.classList.add('on'); at(elm.getBoundingClientRect()); }
    function hide() { pop.classList.remove('on'); }
    function infoDe(idx) {
      var v = vids[idx]; if (!v) return null;
      var ch = (v.channel && v.channel.displayName) || 'PeerTube';
      var adv = v._playlist ? 'Liste de lecture — un clic ouvre PeerTube pour la parcourir.'
        : v._channel ? 'Chaîne — un clic ouvre PeerTube sur ses vidéos.'
        : 'Un clic lit ici (lecteur souverain PeerTube) ; ⤢ agrandit dans le viewer.';
      var meta = v._browse ? ch : (ch + (v.duration ? (' · ' + mmss(v.duration)) : '')
        + (v.views != null ? (' · ' + v.views + ' vues') : ''));
      return '<b>' + esc(v.name || 'Vidéo') + '</b>' + (meta ? (' · ' + esc(meta)) : '')
        + '<span class="adv">' + adv + '</span>';
    }
    document.addEventListener('mouseover', function (e) {
      var b = e.target.closest && e.target.closest('.top button[data-i]');
      if (b) { var h = infoDe(Number(b.dataset.i)); if (h) show(h, b); return; }
      var une = e.target.closest && e.target.closest('.une');
      if (une && !joue) { var h2 = infoDe(i % (vids.length || 1)); if (h2) show(h2, une); return; }
    });
    document.addEventListener('mouseout', function (e) {
      if (e.target.closest && (e.target.closest('.top button') || e.target.closest('.une'))) hide();
    });
  })();

  // Le premier chargement est piloté par le slicer (onShow au démarrage, ou le
  // repli charge() sans lib) — pas de charge() ici, sinon double fetch.
  setInterval(function () { if (!enPause && !joue && vids.length) { i++; montre(); } }, 7000);
  setInterval(function () { if (!joue) charge(); }, 600000);

  (function () {
    var t = new URLSearchParams(location.search).get('theme');
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
  })();
  addEventListener('message', function (ev) {
    var d = ev.data;
    if (!d || d.sbx !== 'theme') return;
    if (d.theme === 'dark' || d.theme === 'light') {
      document.documentElement.setAttribute('data-theme', d.theme);
    }
  });
})();
</script>

<script>window.SBXAide&&SBXAide({zones:function(){return [
  {el:document.querySelector('.tete'),label:'En-tête — PeerTube et le nombre de vidéos'},
  {el:document.getElementById('une'),label:'À la une — vidéo mise en avant (▶ la lit dans le viewer)'},
  {el:document.getElementById('top'),label:'Top vidéos — les plus regardées récemment'},
  {el:document.querySelector('.pied'),label:'Pied — ouvrir dans le viewer'}
].filter(function(z){return z.el;});}});</script>
