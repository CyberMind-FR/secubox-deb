  SecuBox #1273 — carte PeerTube.

  POURQUOI ELLE EST SERVIE PAR LE HALL, EXCEPTIONNELLEMENT. PeerTube est un
  logiciel amont : on ne lui ajoute pas de vue /micro. La règle « le service
  sert sa carte » ne peut donc pas s'appliquer, et la carte vit ici — mais elle
  ne PEINT rien : elle lit l'API REST publique de PeerTube, qui donne titres,
  vignettes, durées et vues. Aucune donnée n'est inventée, aucune identité
  n'est requise.

  TOUT EST DE MÊME ORIGINE. Le vhost du Hall relaie l'API et les vignettes :
  sa politique impose `connect-src 'self'` et `img-src 'self'`, et relâcher
  l'une ou l'autre pour une carte coûterait plus cher que le relais.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PeerTube — vue micro</title>
<style>
  :root { --fond:#ffffff; --texte:#1a1a22; --muted:#6b6b7a; --border:#e2e2ea; --accent:#c0392b; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --fond:#14141c; --texte:#e8e6d9; --muted:#8a8a99;
      --border:#2a2a36; --accent:#ef6b5c; }
  }
  :root[data-theme="dark"] { --fond:#14141c; --texte:#e8e6d9; --muted:#8a8a99;
    --border:#2a2a36; --accent:#ef6b5c; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; scrollbar-width:none; }
  html::-webkit-scrollbar, body::-webkit-scrollbar { width:0; display:none; }
  body { background:var(--fond); color:var(--texte);
         font-family:"Inter",system-ui,sans-serif; font-size:14px; line-height:1.45; }
  .mw { display:flex; flex-direction:column; height:100%; padding:.6rem .7rem; gap:.4rem; }
  .tete { display:flex; align-items:baseline; gap:.4rem; }
  .tete .ic { font-size:1rem; } .tete b { font-size:.88rem; }
  .tete .n { margin-left:auto; font-size:.56rem; letter-spacing:.08em;
             text-transform:uppercase; color:var(--muted); font-variant-numeric:tabular-nums; }

  .une { position:relative; border-radius:10px; overflow:hidden; height:104px;
         background:var(--border); flex:0 0 auto; }
  .une img { width:100%; height:100%; object-fit:cover; display:block; }
  .une .voile { position:absolute; inset:auto 0 0 0; padding:.35rem .45rem .3rem;
                background:linear-gradient(transparent, rgba(0,0,0,.85)); color:#fff; }
  .une .t { font-size:.74rem; font-weight:650; line-height:1.2;
            display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .une .dur { position:absolute; top:6px; right:6px; background:rgba(0,0,0,.7); color:#fff;
              border-radius:4px; padding:1px 5px; font-size:.6rem;
              font-variant-numeric:tabular-nums; }
  /* Le bouton de lecture est GROS et centré : c'est le geste attendu sur une
     vignette vidéo, et le chercher serait déjà un échec. */
  .une .lire { position:absolute; inset:0; display:grid; place-items:center;
               background:none; border:0; cursor:pointer; color:#fff; }
  .une .lire span { width:38px; height:38px; border-radius:50%; display:grid; place-items:center;
                    background:rgba(0,0,0,.55); border:1px solid rgba(255,255,255,.5);
                    font-size:.9rem; transition:transform .12s ease, background .12s ease; }
  .une .lire:hover span { transform:scale(1.08); background:var(--accent); }
  .une iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
  /* AGRANDIR (#1275). Une carte fait 250 px : regarder une video dedans est
     une intention, pas une fatalite. Le bouton reste discret jusqu'au survol —
     il ne doit pas manger l'image. */
  .une .zoom { position:absolute; top:6px; right:6px; width:24px; height:24px;
               border-radius:6px; border:1px solid rgba(255,255,255,.45);
               background:rgba(0,0,0,.55); color:#fff; font-size:.72rem;
               cursor:pointer; opacity:0; transition:opacity .15s; }
  .une:hover .zoom, .une .zoom:focus-visible { opacity:1; }

  .top { display:flex; gap:5px; }
  /* Les suivantes en VIGNETTES et non en titres : sur une plateforme vidéo,
     l'image renseigne plus vite que le nom du fichier. */
  .top button { flex:1; min-width:0; border:0; padding:0; background:none; cursor:pointer;
                border-radius:7px; overflow:hidden; position:relative; height:44px; }
  .top button img { width:100%; height:100%; object-fit:cover; display:block; }
  .top button:hover { outline:2px solid var(--accent); outline-offset:1px; }
  .top .vide { flex:1; height:44px; border-radius:7px; background:var(--border); }

  .pied { margin-top:auto; display:flex; align-items:center; gap:6px; padding-top:.3rem;
          border-top:1px solid var(--border); font-size:.57rem; letter-spacing:.07em;
          text-transform:uppercase; color:var(--muted); text-decoration:none; }
  .pied .grow { flex:1; } .pied:hover { color:var(--accent); }
  .pouls { width:5px; height:5px; border-radius:50%; background:var(--accent);
           animation:bat 2.4s ease-in-out infinite; }
  @keyframes bat { 0%,100%{opacity:.28} 50%{opacity:1} }
  @media (prefers-reduced-motion: reduce){ .pouls{animation:none;opacity:.7} }
</style>

<div class="mw">
  <div class="tete"><span class="ic">📹</span><b>PeerTube</b><span class="n" id="n">…</span></div>
  <div class="une" id="une">
    <img id="une-img" alt="">
    <span class="dur" id="une-dur"></span>
    <button class="lire" id="lire" type="button" title="Lire ici" aria-label="Lire"><span>▶</span></button>
    <span class="voile"><span class="t" id="une-t">lecture du catalogue…</span></span>
  </div>
  <div class="top" id="top"></div>
  <a class="pied" href="/" target="_top"><span class="pouls" id="pouls"></span>
    <span id="pied-t">vidéos</span><span class="grow"></span><span id="rang"></span></a>
</div>

<script>
(function () {
  "use strict";
  // Relais de MEME ORIGINE poses par le vhost du Hall (voir hall.vhost.conf).
  // L'API et les vignettes passent par le relais de MEME origine (la carte
  // vit sous `connect-src 'self'` et `img-src 'self'`) ; le lecteur, lui,
  // reste sur l'origine de PeerTube — voir lance().
  var API = '/pt/api/v1/videos?count=24&sort=-publishedAt&nsfw=false';
  var PT_HOTE = 'peertube.gk2.secubox.in';
  var vids = [], i = 0, enPause = false, joue = false;

  var el = function (id) { return document.getElementById(id); };
  var esc = function (t) { return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) {
      return ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' })[c]; }); };
  function mmss(s) {
    s = Math.max(0, Math.floor(Number(s) || 0));
    var h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), r = s % 60;
    return (h ? h + ':' + ('0' + m).slice(-2) : String(m)) + ':' + ('0' + r).slice(-2);
  }
  function vign(v) { return v.thumbnailPath ? '/pt' + v.thumbnailPath : ''; }

  function montre() {
    if (!vids.length || joue) return;
    var v = vids[i % vids.length], img = el('une-img'), src = vign(v);
    if (src) { img.src = src; img.style.display = ''; } else { img.style.display = 'none'; }
    el('une-t').textContent = v.name || '—';
    el('une-dur').textContent = mmss(v.duration);
    el('rang').textContent = ((i % vids.length) + 1) + '/' + vids.length;
    el('pied-t').textContent = (v.channel && v.channel.displayName) || 'vidéos';

    var suite = [], k;
    for (k = 1; k <= 4 && k < vids.length; k++) suite.push(vids[(i + k) % vids.length]);
    el('top').innerHTML = suite.map(function (w, j) {
      var s = vign(w);
      return s
        ? '<button type="button" data-i="' + ((i + 1 + j) % vids.length) + '" title="'
            + esc(w.name) + '"><img src="' + esc(s) + '" alt=""></button>'
        : '<span class="vide"></span>';
    }).join('');
  }

  // LIRE ICI : le lecteur d'embarquement de PeerTube remplace la vignette. On
  // ne recopie pas un lecteur — celui de PeerTube sait deja lire ses formats,
  // ses sous-titres et son P2P.
  var depart = 0;   // position à laquelle la prochaine lecture doit reprendre

  function lance(n) {
    var v = vids[n % vids.length];
    if (!v) return;
    i = n; joue = true;
    // LE LECTEUR RESTE SUR SON ORIGINE, ET C'EST UNE CORRECTION (#1276).
    // Relaye sous /pt/, il demandait ses propres ressources a la RACINE du
    // Hall — /client/…, /plugins/… — qui n'existent pas ici : le Hall
    // repondait sa page d'accueil, et le navigateur refusait des modules
    // annonces en text/html. Relayer la moitie de PeerTube pour corriger cela
    // aurait pollue l'espace de noms du Hall pour rien.
    //
    // Le CADRE, lui, n'a pas besoin d'etre de meme origine : seuls `fetch` et
    // les images l'exigent, et ceux-la restent relayes. La politique de la
    // carte nomme deja peertube dans `frame-src`, et HAProxy a reecrit son
    // `frame-ancestors` pour nous laisser l'encadrer.
    var u = 'https://' + PT_HOTE + '/videos/embed/' + encodeURIComponent(v.uuid)
          + '?api=1&autoplay=1&title=0&warningTitle=0&peertubeLink=0'
          // `start` n'est ajouté QUE si le lecteur nous a réellement donné une
          // position : reprendre à une seconde inventée serait pire que de
          // reprendre au début.
          + (depart > 2 ? '&start=' + Math.floor(depart) + 's' : '');
    depart = 0;
    position = depart;
    // ON NE RETIENT PAS ICI (#1280). Lancer n'est pas regarder : retenir des le
    // clic faisait relancer la video a CHAQUE rafraichissement, meme quand on
    // avait juste effleure le bouton avant de partir. On ne retient que ce que
    // le lecteur nous dit LUI-MEME : voir l'ecoute plus bas.
    el('une').innerHTML = '<iframe id="cadre-pt" src="' + esc(u) + '"'
      + ' allow="autoplay; fullscreen" allowfullscreen title="' + esc(v.name) + '"></iframe>'
      + '<button class="zoom" id="zoom" type="button" title="Agrandir" aria-label="Agrandir">⤢</button>';
    annonce(v, true);
    bat(v);
    // ON NE S'ANNONCE PLUS (#1324). C'ETAIT CE QUI TUAIT LE LECTEUR.
    //
    // On envoyait un `__ready` NON SOLLICITE, porteur d'un `id`, douze fois de
    // suite. Or dans jschannel `__ready` n'est pas une requête mais une
    // salutation : elle n'a pas d'`id`, et surtout elle n'arrive QU'UNE FOIS.
    // La deuxième trouve le canal déjà ouvert et le fait tomber —
    //   « Embed player crashed: can't access property "length",
    //     n.publish is undefined »
    // suivi d'une page noire et d'un « player is not compatible with your web
    // browser » qui accusait le navigateur d'une panne qu'on causait nous-mêmes.
    //
    // C'est le lecteur qui salue en premier ; notre seul rôle est de répondre,
    // ce que fait l'écouteur plus bas. Se présenter en plus n'ajoutait rien
    // qu'on n'avait déjà.
  }

  // La barre du Hall doit savoir ce qui joue. On n'a pas la position — le
  // lecteur de PeerTube ne la donne pas sans son API de fenetre — alors on ne
  // l'invente pas : titre et source, et rien d'autre.
  // BATTEMENT (#1287). Le Hall retire un flux qui n'a rien dit depuis dix
  // secondes — c'est ce qui fait disparaitre une rangee quand un service
  // meurt. La carte n'annoncait qu'au lancement : dix secondes plus tard, la
  // pastille s'evanouissait alors que la video jouait toujours.
  //
  // On ne peut pas savoir si le lecteur amont est en pause sans son API de
  // fenetre ; on maintient donc l'annonce tant que le lecteur est POSE, et le
  // `stop` de la carte est ce qui l'arrete. Mieux vaut une pastille presente
  // pendant une pause qu'une pastille absente pendant la lecture.
  var battement = null;
  function bat(v) {
    if (battement) clearInterval(battement);
    battement = setInterval(function () {
      if (!joue || !document.getElementById('cadre-pt')) {
        clearInterval(battement); battement = null; return;
      }
      annonce(v, true);
    }, 2000);
  }

  function annonce(v, actif) {
    if (parent === window) return;
    try {
      parent.postMessage({
        sbx: 'media', id: 'peertube',
        // Le TYPE permet au Hall de traiter une video autrement qu'un flux
        // audio : lui offrir l'agrandissement, et mettre le son en pause
        // ailleurs — trois sources sonores a la fois ne sont pas un bureau,
        // c'est un vacarme.
        type: 'video',
        titre: (v && v.name) || 'PeerTube',
        sous: (v && v.channel && v.channel.displayName) || 'PeerTube',
        // `t` n'est plus toujours nul : quand le lecteur nous donne sa
        // position, la barre peut la montrer. Quand il se tait, elle vaut 0 et
        // la barre n'affiche rien — pas une position inventee.
        joue: !!actif, t: position || 0,
        d: (v && Number(v.duration)) || 0, fin: !actif
      }, '*');
    } catch (e) {}
  }

  // Le plein ecran porte sur le CONTENEUR et non sur le cadre : on garde ainsi
  // le bouton de sortie et le fond, au lieu d'un cadre nu qui semble bloque.
  function agrandis() {
    var z = el('une');
    if (!z) return;
    if (document.fullscreenElement) { document.exitFullscreen(); return; }
    if (z.requestFullscreen) z.requestFullscreen().catch(function () {});
  }
  el('une').addEventListener('click', function (e) {
    if (e.target.closest('#zoom')) { agrandis(); return; }
    if (e.target.closest('#lire')) lance(i);
  });
  el('top').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-i]');
    if (b) lance(Number(b.dataset.i));
  });

  addEventListener('message', function (ev) {
    var d = ev.data;
    if (!d || d.sbx !== 'cmd') return;
    // `stop` rend la carte a son etat de vitrine : c'est le seul ordre qu'on
    // peut honorer sans l'API de fenetre du lecteur amont. On le dit plutot
    // que de faire semblant d'obeir aux autres.
    if (d.action === 'zoom') { agrandis(); return; }
    // `pause` est traite comme `stop` : sans l'API de fenetre du lecteur
    // amont, on ne sait pas le mettre en pause — on sait le RETIRER. On le
    // fait donc, plutot que d'ignorer l'ordre et de laisser deux sons.
    if (d.action === 'stop' || d.action === 'pause') {
      joue = false;
      if (battement) { clearInterval(battement); battement = null; }
      oublie();
      el('une').innerHTML = '<img id="une-img" alt=""><span class="dur" id="une-dur"></span>'
        + '<button class="lire" id="lire" type="button" title="Lire ici" aria-label="Lire">'
        + '<span>▶</span></button><span class="voile"><span class="t" id="une-t"></span></span>';
      montre();
      annonce(vids[i % (vids.length || 1)], false);
    }
  });

  document.addEventListener('mouseenter', function () { enPause = true; }, true);
  document.addEventListener('mouseleave', function () { enPause = false; }, true);

  // ── ÉTAT PERSISTANT (#1277) ───────────────────────────────────────────────
  //
  // La radio et le podcaster survivent au rafraîchissement ; la vidéo repartait
  // de zéro — on rechargeait la page et le film avait disparu. On retient donc
  // ce qui se regardait.
  //
  // CE QU'ON RETIENT, ET CE QU'ON NE PRÉTEND PAS SAVOIR. L'identité de la vidéo,
  // oui. La POSITION, non : le lecteur amont ne la donne pas sans son API de
  // fenêtre, et la déduire du temps écoulé serait fausse dès la première pause.
  // On reprend donc la vidéo, pas la seconde — et on le dit plutôt que
  // d'afficher une position inventée.
  var CLEF = 'sbx.peertube.etat';
  var position = 0;   // secondes, telles que le lecteur les annonce

  function retiens(v) {
    try {
      localStorage.setItem(CLEF, JSON.stringify({
        uuid: v.uuid, quand: Date.now(), pos: Math.floor(position) || 0
      }));
    } catch (e) {}
  }

  // ── ÉCOUTE DU LECTEUR AMONT (#1279) ───────────────────────────────────────
  //
  // Avec `api=1`, le lecteur de PeerTube parle par postMessage — protocole
  // jschannel : une poignée de main `__ready`, puis des notifications dont
  // `playbackStatusUpdate`, qui porte la position.
  //
  // ON ÉCOUTE, ON NE PILOTE PAS. Recevoir une position ne coûte rien et ne
  // casse rien si le lecteur change de protocole : dans ce cas on ne reçoit
  // simplement plus rien, et la reprise retombe sur l'identité seule — ce
  // qu'elle faisait déjà. C'est pour cela qu'on lit DÉFENSIVEMENT, en
  // acceptant plusieurs formes plutôt qu'une seule figée : mieux vaut ne rien
  // comprendre que de croire comprendre.
  function positionDe(d) {
    if (!d || typeof d !== 'object') return null;
    var p = d.params || d.data || d;
    var v = (p && (p.position !== undefined ? p.position : p.currentTime));
    return (typeof v === 'number' && isFinite(v) && v >= 0) ? v : null;
  }
  addEventListener('message', function (ev) {
    var c = document.getElementById('cadre-pt');
    if (!c || ev.source !== c.contentWindow) return;
    var d = ev.data;
    // JSCHANNEL POSTE DES CHAINES, PAS DES OBJETS (#1283). Sa mise en oeuvre
    // sérialise chaque message : `ev.data` arrive en JSON textuel, et le test
    // « est-ce un objet ? » le rejetait en silence. Aucune position n'était
    // donc jamais reçue, et la reprise retombait toujours sur l'identité seule.
    if (typeof d === 'string') {
      try { d = JSON.parse(d); } catch (e) { return; }
    }
    // Poignée de main : sans réponse, jschannel n'émet jamais ses
    // notifications. On répond sans rien demander en retour.
    // JSCHANNEL PREFIXE SES METHODES PAR LA PORTEE (#1311). Le lecteur n'envoie
    // pas `__ready` mais `peertube::__ready` : chercher le nom nu ne pouvait
    // rien trouver, la poignée de main n'aboutissait jamais, et aucune
    // notification de position n'arrivait. On regarde donc la FIN du nom.
    var nomBrut = String((d && d.method) || '');
    if (nomBrut.slice(-7) === '__ready') {
      // UNE SEULE FOIS PAR CADRE. Repondre deux fois a la salutation produit
      // exactement la panne qu'on vient de retirer ci-dessus : le canal est
      // deja ouvert, la seconde reponse le renverse.
      if (c.dataset.salue === '1') return;
      c.dataset.salue = '1';
      // On répond dans la MEME forme et sous le MEME nom que l'on reçoit :
      // jschannel n'accepte ni un objet là où il attend une chaîne, ni une
      // méthode d'une autre portée.
      var pong = { id: d.id, method: nomBrut, params: 'pong' };
      try {
        c.contentWindow.postMessage(
          (typeof ev.data === 'string') ? JSON.stringify(pong) : pong, '*');
      } catch (e) {}
      return;
    }
    // On ne retient que ce qui porte une position : le lecteur envoie aussi des
    // acquittements et des évènements qui n'en ont pas.
    var pos = positionDe(d);
    if (pos !== null) {
      position = pos;
      // On écrit rarement : à chaque battement du lecteur, localStorage
      // deviendrait un goulot pour rien. Cinq secondes suffisent à reprendre
      // sans que la perte soit sensible.
      if (!retiens._quand || Date.now() - retiens._quand > 5000) {
        retiens._quand = Date.now();
        var v = vids[i % (vids.length || 1)];
        if (v) retiens(v);
      }
    }
  });
  function oublie() { try { localStorage.removeItem(CLEF); } catch (e) {} }
  function reprend() {
    var e = null;
    try { e = JSON.parse(localStorage.getItem(CLEF) || 'null'); } catch (x) {}
    // DEUX CONDITIONS, ET LES DEUX COMPTENT (#1280).
    //
    // `pos` prouve que le lecteur a REELLEMENT joué : sans lui, on n'a qu'un
    // clic, et un clic ne justifie pas de relancer un film à chaque visite.
    //
    // Cinq minutes, pas six heures : un rafraîchissement pendant qu'on regarde
    // se compte en secondes. Revenir une heure plus tard n'est pas une lecture
    // interrompue, c'est une nouvelle visite — et elle mérite la vitrine, pas
    // un film qui redémarre tout seul.
    if (!e || !e.uuid || !e.pos) return false;
    if ((Date.now() - (e.quand || 0)) > 3e5) { oublie(); return false; }
    var n = -1, k;
    for (k = 0; k < vids.length; k++) if (vids[k].uuid === e.uuid) { n = k; break; }
    if (n < 0) return false;
    depart = Number(e.pos) || 0;
    position = depart;
    lance(n);
    return true;
  }

  function charge() {
    fetch(API, { headers: { 'Accept': 'application/json' } })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        vids = (d && d.data) || [];
        el('n').textContent = d && d.total ? d.total + ' vidéos' : '';
        if (!vids.length) {
          el('une-t').textContent = 'Aucune vidéo';
          el('pouls').style.animation = 'none';
          return;
        }
        // La reprise passe AVANT la vitrine : sinon la rotation démarrerait et
        // on verrait défiler des vignettes par-dessus ce qu'on regardait.
        if (reprend()) return;
        montre();
      })
      .catch(function () { el('une-t').textContent = 'PeerTube injoignable'; });
  }

  charge();
  setInterval(function () { if (!enPause && !joue && vids.length) { i++; montre(); } }, 7000);
  setInterval(function () { if (!joue) charge(); }, 600000);

  (function () {
    var t = new URLSearchParams(location.search).get('theme');
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
  })();
  addEventListener('message', function (ev) {
    var d = ev.data;
    if (!d || d.sbx !== 'theme') return;
    if (d.theme === 'dark' || d.theme === 'light') {
      document.documentElement.setAttribute('data-theme', d.theme);
    }
  });
})();
</script>
