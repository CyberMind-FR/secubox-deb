  SecuBox #1286 — WIDGET D'ACCÈS RAPIDE.

  POURQUOI CES TROIS-LÀ N'ONT PAS DE CARTE À EUX. Torrent, YTSaS et le Dépôt ne
  se CONSULTENT pas : on y va pour faire quelque chose. Leur montrer une
  vitrine défilante serait leur prêter une vie de publication qu'ils n'ont pas.
  Ce qu'on veut d'eux tient en une ligne de chiffres — combien, combien en
  cours, combien de place reste — et en un accès direct.

  UN SEUL GABARIT POUR LES TROIS. Ils diffèrent par leurs chiffres, pas par
  leur forme : trois fichiers presque identiques auraient été trois endroits où
  corriger, et un seul qu'on pense à corriger.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accès rapide — vue micro</title>
<style>
  :root { --fond:#ffffff; --texte:#1a1a22; --muted:#6b6b7a; --border:#e2e2ea; --accent:#3c6e8f; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --fond:#14141c; --texte:#e8e6d9; --muted:#8a8a99;
      --border:#2a2a36; --accent:#6db3d9; }
  }
  :root[data-theme="dark"] { --fond:#14141c; --texte:#e8e6d9; --muted:#8a8a99;
    --border:#2a2a36; --accent:#6db3d9; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; scrollbar-width:none; }
  html::-webkit-scrollbar, body::-webkit-scrollbar { width:0; display:none; }
  body { background:var(--fond); color:var(--texte);
         font-family:"Inter",system-ui,sans-serif; font-size:14px; line-height:1.45; }

  .mw { display:flex; flex-direction:column; height:100%; padding:.65rem .75rem; gap:.4rem;
        position:relative; }
  /* LES CHIFFRES SONT DANS LE TITRE, et c'est tout le propos : on doit
     connaître l'état du service sans rien déplier. */
  /* Meme en-tete que les cartes classiques et que les cartes deleguees
     (#1302) : trois familles de cartes qui se ressemblent se lisent comme une
     seule interface ; trois qui different se lisent comme un chantier. */
  .tete { display:flex; align-items:center; gap:.45rem; flex-wrap:wrap; }
  .tete .ic { width:28px; height:28px; border-radius:8px; display:grid;
              place-items:center; font-size:.9rem; color:#fff; flex:0 0 auto; }
  .tete b { font-size:.88rem; }
  .tete .m { display:inline-flex; align-items:baseline; gap:.2rem; font-size:.68rem;
             color:var(--muted); font-variant-numeric:tabular-nums; }
  .tete .m b { font-size:.72rem; color:var(--texte); font-weight:650; }
  .tete .m.actif b { color:var(--accent); }
  .hote { font-size:.6rem; color:var(--muted); font-family:"JetBrains Mono";
          overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* LA SURCOUCHE reste rangée jusqu'au survol : un widget d'accès rapide qui
     affiche en permanence ses six boutons n'est plus rapide, il est encombré. */
  .acces { display:flex; flex-wrap:wrap; gap:5px; margin-top:auto; }
  .acces a { flex:1 1 auto; text-align:center; padding:.3rem .45rem; border-radius:7px;
             border:1px solid var(--border); background:none; color:var(--texte);
             text-decoration:none; font-size:.68rem; white-space:nowrap; }
  .acces a:hover { border-color:var(--accent); color:var(--accent); }
  .acces a.p { background:var(--accent); border-color:var(--accent); color:#fff; }
  .acces a.p:hover { opacity:.9; color:#fff; }
  /* LA LISTE AGISSANTE (#1314). Un widget d'acces rapide qui ne fait
     qu'afficher des chiffres est une vitrine ; ce qu'on veut de ces
     trois-la, c'est agir. La liste n'apparait que si l'on est connecte —
     sans identite, il n'y a rien a commander. */
  .items { display:flex; flex-direction:column; gap:.14rem; margin:.1rem 0; }
  .items .it { display:flex; align-items:center; gap:.36rem; font-size:.69rem;
               line-height:1.3; }
  .items .it .nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis;
                   white-space:nowrap; }
  .items .it button { flex:0 0 auto; width:20px; height:20px; border-radius:5px;
                      border:1px solid var(--border); background:none;
                      color:var(--muted); font-size:.6rem; line-height:1;
                      cursor:pointer; padding:0; }
  .items .it button:hover { border-color:var(--accent); color:var(--accent); }
  .items .it .et { flex:0 0 auto; font-size:.58rem; color:var(--muted); }
  .items .it .et.ok { color:var(--accent); }
  .items .it a.nm { color:inherit; text-decoration:none; }
  .items .it a.nm:hover { color:var(--accent); text-decoration:underline; }
  /* ZONE DE DEPOT (#1328). La carte listait et retirait, mais ne DEPOSAIT
     pas — elle parlait d'un service sans savoir faire ce pour quoi il existe.
     Trois gestes menent au meme endroit : glisser, coller, choisir. */
  .depose { display:flex; align-items:center; justify-content:center; gap:.3rem;
    padding:.42rem .5rem; border:1px dashed var(--bord); border-radius:7px;
    font-size:.62rem; color:var(--muted); cursor:pointer; text-align:center;
    transition:border-color .12s, color .12s; }
  .depose:hover, .depose.vise { border-color:var(--accent); color:var(--accent); }
  .depose b { font-weight:600; }
  .depose.envoi { cursor:progress; }
  .jauge { height:3px; border-radius:2px; background:var(--bord); overflow:hidden;
    margin-top:.28rem; }
  .jauge i { display:block; height:100%; width:0; background:var(--accent);
    transition:width .15s; }
  .pied { font-size:.58rem; color:var(--muted); padding:.1rem .1rem 0;
          font-variant-numeric:tabular-nums; }
  .ajout { display:flex; gap:5px; margin-top:.15rem; }
  .ajout input { flex:1; min-width:0; font:inherit; font-size:.68rem;
                 padding:.24rem .4rem; border-radius:6px; color:var(--texte);
                 border:1px solid var(--border); background:var(--fond); }
  .ajout button { flex:0 0 auto; font:inherit; font-size:.68rem; padding:.24rem .55rem;
                  border-radius:6px; border:1px solid var(--accent);
                  background:var(--accent); color:#fff; cursor:pointer; }
  .msg { font-size:.62rem; color:var(--muted); margin:.2rem 0 0; }
  .msg.ko { color:#c0392b; }

  .barre { height:4px; border-radius:3px; background:var(--border); overflow:hidden; }
  .barre i { display:block; height:100%; background:var(--accent); width:0; }
  .note { font-size:.6rem; color:var(--muted); }
  .ko { font-size:.72rem; color:var(--muted); }
</style>

<div class="mw">
  <div class="tete" id="tete"><span class="ic" id="ic">📦</span><b id="nom">…</b></div>
  <div class="hote" id="hote"></div>
  <div class="barre" id="barre" hidden><i id="jauge"></i></div>
  <div class="note" id="note"></div>
  <div class="items" id="items"></div>
  <p class="msg" id="msg"></p>
  <div class="acces" id="acces"></div>
</div>

<script>
(function () {
  "use strict";
  var esc = function (t) { return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) {
      return ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' })[c]; }); };
  var el = function (id) { return document.getElementById(id); };

  // Ce qui distingue les trois : leur nom, leur module d'API, et les chiffres
  // qui MERITENT d'etre en titre. Le reste est commun.
  var SVC = {
    torrent: { ic:'🧲', nom:'Torrent', hote:'torrent.gk2.secubox.in', mod:'torrent',
      couleur:'#3c6e8f',
      chiffres:[['total','📦','au total'],['downloading','⬇','en cours'],
                ['to_peertube','📹','vers PeerTube']],
      acces:[['Ouvrir','/','p'],['Ajouter','/#add','']] },
    // PAS DE BOUTONS (#1320) : la carte fait deja ce que le service fait —
    // une URL, un bouton de capture, et la liste des dernieres. « Ouvrir » et
    // « Nouvelle capture » ne menaient qu'a la meme chose, en plus loin.
    ytsas: { ic:'🎬', nom:'YTSaS', hote:'ytsas.gk2.secubox.in', mod:'ytsas',
      couleur:'#b03030',
      chiffres:[['total','🎞️','captures'],['jobs','⚙️','tâches'],
                ['to_peertube','📹','vers PeerTube']],
      acces:[] },
    depot: { ic:'📦', nom:'Dépôt', hote:'depot.gk2.secubox.in', mod:'droplet',
      couleur:'#3d6b4a',
      chiffres:[['sites_count','🌐','sites'],['apps_count','🧩','applications']],
      acces:[] }
  };

  // Quels widgets savent AGIR, et sous quel nom de module. YTSaS n'y figure
  // pas : sa route d'action reste introuvable, et un bouton qui ne fait rien
  // est pire qu'un bouton absent.
  var ACTIONNABLE = { torrent: 'torrent', depot: 'droplet', ytsas: 'ytsas' };

  // Ce que chaque widget met dans son champ d'ajout. YTSaS n'a qu'UNE
  // fonction — une URL, un bouton — et sa carte doit s'y tenir : lui inventer
  // des options qu'il n'a pas serait promettre ce qu'il ne fait pas.
  var AJOUT = {
    torrent: { champ:'magnet', invite:'magnet:… ou URL', bouton:'Ajouter' },
    ytsas:   { champ:'url',    invite:'URL de la vidéo', bouton:'Capturer' }
  };

  var id = new URLSearchParams(location.search).get('svc') || 'depot';
  var c = SVC[id] || SVC.depot;

  el('ic').textContent = c.ic;
  el('ic').style.background = c.couleur;
  el('nom').textContent = c.nom;
  el('hote').textContent = c.hote;
  el('acces').innerHTML = c.acces.map(function (a) {
    return '<a class="' + a[2] + '" href="https://' + esc(c.hote) + esc(a[1])
      + '" target="_top">' + esc(a[0]) + '</a>';
  }).join('');
  // SANS BOUTONS, LE SERVICE DOIT RESTER ATTEIGNABLE. On ne rajoute rien : on
  // rend cliquable l'hôte, qui était déjà affiché. Une carte qui parle d'un
  // service sans y mener est une impasse.
  if (!c.acces.length) {
    var h = el('hote');
    if (h) {
      h.innerHTML = '<a href="https://' + esc(c.hote) + '/" target="_top">'
        + esc(c.hote) + '</a>';
      h.querySelector('a').style.color = 'inherit';
    }
  }

  function octets(n) {
    n = Number(n) || 0;
    var u = ['o', 'Ko', 'Mo', 'Go', 'To'], i = 0;
    while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
    return (n >= 10 ? Math.round(n) : n.toFixed(1)) + ' ' + u[i];
  }

  function pose(d) {
    var t = el('tete');
    // On repart du pictogramme et du nom : réécrire tout le titre évite de
    // faire diverger l'ordre des chiffres du contenu qu'ils annoncent.
    t.innerHTML = '<span class="ic" style="background:' + esc(c.couleur) + '">'
      + esc(c.ic) + '</span><b>' + esc(c.nom) + '</b>'
      + c.chiffres.map(function (m) {
          var v = d[m[0]];
          // Un chiffre absent n'est PAS un zéro : on ne l'affiche pas plutôt
          // que d'annoncer « 0 » là où le service n'a rien dit.
          if (v === undefined || v === null) return '';
          var actif = (m[0] === 'downloading' || m[0] === 'jobs') && Number(v) > 0;
          return '<span class="m' + (actif ? ' actif' : '') + '" title="' + esc(m[2]) + '">'
            + esc(m[1]) + '<b>' + esc(v) + '</b></span>';
        }).join('');

    if (d.disk_free !== undefined) {
      el('note').textContent = octets(d.disk_free) + ' libres';
    }
    if (d.active !== undefined && Number(d.active) > 0) {
      el('barre').hidden = false;
      el('jauge').style.width = '100%';
    } else {
      el('barre').hidden = true;
    }
  }

  // ── AGIR (#1314) ─────────────────────────────────────────────────────────
  //
  // Tout passe par une route du Hall sous jeton : l'API du module n'est PAS
  // authentifiee, et l'appeler directement depuis la carte ouvrirait l'action
  // a qui charge la page.
  function jeton() { try { return localStorage.getItem('sbx_token') || ''; } catch (e) { return ''; } }
  function api(chemin, opts) {
    opts = opts || {};
    opts.headers = Object.assign({ 'Accept': 'application/json' }, opts.headers || {});
    var j = jeton();
    if (j) opts.headers['Authorization'] = 'Bearer ' + j;
    if (opts.body) opts.headers['Content-Type'] = 'application/json';
    return fetch('/api/v1/webos' + chemin, opts).then(function (r) {
      return r.json().catch(function () { return {}; })
        .then(function (d) { return { code: r.status, corps: d }; });
    });
  }
  function dis(t, ko) {
    var m = el('msg');
    m.className = 'msg' + (ko ? ' ko' : '');
    m.textContent = t || '';
  }

  // Chaque module rend sa liste a sa facon : le torrent un tableau nu, le
  // depot un objet `{droplets:[...]}`. Plutot que d'exiger d'eux un schema
  // commun qu'ils n'ont jamais eu, on lit les deux formes ici.
  function tableau(d) {
    if (Array.isArray(d)) return d;
    if (!d || typeof d !== 'object') return [];
    var k = ['droplets', 'items', 'records', 'torrents', 'videos'];
    for (var i = 0; i < k.length; i++)
      if (Array.isArray(d[k[i]])) return d[k[i]];
    return [];
  }

  function rendItems(l) {
    var z = el('items');
    if (!l || !l.length) { z.innerHTML = ''; return; }
    z.innerHTML = l.slice(0, 3).map(function (x) {
      // Chaque module nomme ses champs a sa facon : le torrent a un `name` et
      // un `complete`, YTSaS un `title` et un etat de conservation. On lit ce
      // qui existe plutot que d'imposer un schema commun a des services qui
      // n'en ont jamais eu.
      var titre = x.name || x.title || '—';
      var fini = String(x.complete) === '1' || x.complete === true;
      var garde = String(x.kept) === '1' || x.kept === true;

      // LE DEPOT : ce qu'il heberge est en ligne ou ne l'est pas, et son nom
      // mene a son domaine. Un depot dont on ne peut pas ouvrir les sites
      // n'affiche que des noms de dossiers.
      if (id === 'depot') {
        var sur = x.enabled === true || String(x.enabled) === '1';
        var dom = x.domain || '';
        var nom = dom
          ? '<a class="nm" href="https://' + esc(dom) + '/" target="_top" title="'
            + esc(dom) + '">' + esc(titre) + '</a>'
          : '<span class="nm" title="' + esc(titre) + '">' + esc(titre) + '</span>';
        return '<span class="it" data-id="' + esc(titre) + '">'
          + nom
          + '<span class="et' + (sur ? ' ok' : '') + '">'
          + (x.type === 'streamlit' ? '🧩' : '🌐')
          + ' ' + (sur ? 'en ligne' : 'arrêté') + '</span>'
          + '<button data-a="supprimer" title="Retirer du dépôt">✕</button>'
          + '</span>';
      }

      var etat = (id === 'ytsas')
        ? (garde ? 'conservé' : 'éphémère')
        : (fini ? 'complet' : 'en cours');
      var boutons = (id === 'ytsas')
        ? (garde ? '' : '<button data-a="conserver" title="Conserver">★</button>')
        : '<button data-a="pause" title="Mettre en pause">❚❚</button>'
          + '<button data-a="reprise" title="Reprendre">▶</button>';
      return '<span class="it" data-id="' + esc(x.infohash || x.id || '') + '">'
        + '<span class="nm" title="' + esc(titre) + '">' + esc(titre) + '</span>'
        + '<span class="et' + ((fini || garde) ? ' ok' : '') + '">' + esc(etat) + '</span>'
        + boutons + '</span>';
    }).join('');
  }

  function chargeItems() {
    if (!ACTIONNABLE[id]) return;
    api('/actions/' + ACTIONNABLE[id] + '/liste').then(function (r) {
      if (r.code === 401 || r.code === 403) {
        el('items').innerHTML = '';
        el('ajout') && el('ajout').remove();
        dis('Connectez-vous à la box pour agir.');
        return;
      }
      var d = r.corps || {};
      if (!d.ok) { dis(d.detail || '', true); return; }
      dis('');
      var l = tableau(d.donnees);
      rendItems(l);
      if (id === 'depot' && !l.length) dis('Dépôt vide.');
      if (id === 'depot') { poseDepot(); chargeStockage(); }
      else poseAjout();
    });
  }

  // CE QUE LE DEPOT A DE PLUS QUE SA LISTE : ce qu'il reste de place. La liste
  // peut etre vide sans que le depot le soit, et c'est la seule mesure qui le
  // dise. Cette route est authentifiee en amont — le jeton est relaye.
  function chargeStockage() {
    api('/actions/droplet/stockage').then(function (r) {
      var d = (r.corps || {}).donnees;
      if (!d || !d.total_human) return;
      var z = el('items');
      var p = document.createElement('div');
      p.className = 'pied';
      p.textContent = d.total_human + ' déposés · ' + (d.file_count || 0)
        + ' fichier' + ((d.file_count || 0) > 1 ? 's' : '')
        + ' · ' + (d.max_upload_mb || '?') + ' Mo par envoi';
      var vieux = z.parentNode.querySelector('.pied');
      if (vieux) vieux.remove();
      z.parentNode.insertBefore(p, el('msg'));
    });
  }

  // ── DEPOSER, LA FONCTION MEME DU SERVICE (#1328, corrige #1329) ─────────
  //
  // DEUX VERBES A NE PAS CONFONDRE, et cette carte s'y etait trompee :
  //   publier un site   — reserve, authentifie, et ce n'est pas ce qu'on
  //                       vient faire ici ;
  //   DEPOSER un fichier — public, sans compte, rien n'est publie.
  // Le second est la raison d'etre du service. C'est celui qu'on offre.
  //
  // Trois gestes, un seul chemin : glisser, coller, choisir. Aucun n'est
  // meilleur que les autres — on prend celui qui tombe sous la main, et une
  // carte qui n'en accepte qu'un force le detour.
  var LIMITES = null;

  function poseDepot() {
    if (el('depose')) return;
    var d = document.createElement('div');
    d.className = 'depose'; d.id = 'depose';
    d.setAttribute('role', 'button'); d.setAttribute('tabindex', '0');
    d.innerHTML = INVITE + CHAMP;
    el('items').parentNode.insertBefore(d, el('msg'));

    // CE QUE LE DEPOSANT DOIT SAVOIR AVANT D'ENVOYER, et qui n'est pas une
    // formalite : ses fichiers ne seront pas publies, et personne ne pourra
    // les relire depuis cette carte. Le dire apres n'aurait servi a rien.
    var n = document.createElement('p');
    n.className = 'note'; n.id = 'note';
    n.textContent = "Ils partent directement sur la box, et une alerte prévient "
      + "son propriétaire. Rien de ce qui est déposé n'est publié, ni relisible "
      + "depuis cette page.";
    d.parentNode.insertBefore(n, d.nextSibling);

    branche();

    // LES PLAFONDS SE DEMANDENT, ILS NE S'ECRIVENT PAS ICI. Les recopier dans
    // la carte, c'est garantir qu'ils divergeront le jour ou le service
    // changera les siens.
    api('/depot/reglages').then(function (r) {
      var x = (r.corps || {}).donnees;
      if (!x) return;
      LIMITES = x;
      if (!x.actif) {
        d.classList.add('ferme');
        d.innerHTML = "<span>L'espace de dépôt est fermé.</span>";
        return;
      }
      var mo = Math.round((x.taille_max || 0) / (1024 * 1024));
      var lim = el('lim');
      if (lim) lim.textContent = x.fichiers_max + ' fichiers · ' +
        (mo >= 1024 ? Math.round(mo / 1024) + ' Go' : mo + ' Mo');
    });

    // GLISSER SUR TOUTE LA CARTE, pas seulement sur la zone. Viser un cadre de
    // 40 px de haut avec un fichier au bout du curseur est un geste ingrat ;
    // la carte entiere est une cible qu'on ne peut pas manquer.
    // `preventDefault` sur `dragover` est OBLIGATOIRE : sans lui le navigateur
    // refuse le depot et OUVRE le fichier a la place, ce qui remplacerait la
    // carte par le fichier.
    ['dragenter', 'dragover'].forEach(function (nom) {
      document.addEventListener(nom, function (e) {
        if (!estFichier(e) || d.classList.contains('ferme')) return;
        e.preventDefault(); d.classList.add('vise');
      });
    });
    ['dragleave', 'dragend'].forEach(function (nom) {
      document.addEventListener(nom, function (e) {
        if (e.relatedTarget) return;      // on sort d'un enfant, pas de la page
        d.classList.remove('vise');
      });
    });
    document.addEventListener('drop', function (e) {
      if (!estFichier(e) || d.classList.contains('ferme')) return;
      e.preventDefault(); d.classList.remove('vise');
      retiens(e.dataTransfer && e.dataTransfer.files);
    });

    // COLLER. Le presse-papiers porte des fichiers quand on copie depuis un
    // gestionnaire de fichiers — c'est le geste le plus court quand on vient
    // d'en fabriquer un.
    document.addEventListener('paste', function (e) {
      if (d.classList.contains('ferme')) return;
      var l = e.clipboardData && e.clipboardData.files;
      if (l && l.length) { e.preventDefault(); retiens(l); }
    });
  }

  var INVITE = '<span>Glissez vos fichiers, collez-les, ou <b>choisissez</b>'
    + '<i id="lim"></i></span>';
  var CHAMP = '<input type="file" id="fich" multiple hidden>';

  function branche() {
    var d = el('depose'), f = el('fich');
    d.onclick = function (e) {
      if (e.target !== f && !d.classList.contains('envoi')
          && !d.classList.contains('ferme')) f.click();
    };
    d.onkeydown = function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); d.onclick(e); }
    };
    if (f) f.onchange = function () { retiens(f.files); };
  }

  function estFichier(e) {
    var t = e.dataTransfer && e.dataTransfer.types;
    if (!t) return false;
    for (var i = 0; i < t.length; i++) if (t[i] === 'Files') return true;
    return false;
  }

  // ON NE PART PAS AU PREMIER FICHIER. Le service accepte un depot de
  // PLUSIEURS fichiers accompagne d'un mot : envoyer des qu'on en pose un
  // ferait autant de depots separes que de fichiers, et perdrait le mot.
  var enAttente = null;

  function retiens(liste) {
    if (!liste || !liste.length) return;
    if (LIMITES && liste.length > LIMITES.fichiers_max) {
      dis('au plus ' + LIMITES.fichiers_max + ' fichiers par dépôt', true);
      return;
    }
    var somme = 0;
    for (var i = 0; i < liste.length; i++) somme += liste[i].size || 0;
    if (LIMITES && LIMITES.taille_max && somme > LIMITES.taille_max) {
      dis('dépôt trop volumineux', true);
      return;
    }
    enAttente = liste;
    var d = el('depose');
    d.innerHTML = '<span>' + liste.length + ' fichier'
      + (liste.length > 1 ? 's' : '') + ' — <b>envoyer ?</b></span>' + CHAMP;
    branche();
    if (!el('mot')) {
      var m = document.createElement('div');
      m.className = 'ajout'; m.id = 'ajout';
      m.innerHTML = '<input id="mot" placeholder="un mot, si vous voulez" '
        + 'autocomplete="off" maxlength="2000"><button id="go">Déposer</button>';
      el('note').parentNode.insertBefore(m, el('note'));
      el('go').addEventListener('click', envoie);
      el('mot').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); envoie(); }
      });
    }
    dis('');
  }

  function envoie() {
    var d = el('depose');
    if (!enAttente || d.classList.contains('envoi')) return;
    d.classList.add('envoi');

    var j = document.createElement('div');
    j.className = 'jauge'; j.innerHTML = '<i></i>';
    d.parentNode.insertBefore(j, d.nextSibling);
    dis('envoi…');

    var fd = new FormData();
    for (var i = 0; i < enAttente.length; i++)
      fd.append('fichiers', enAttente[i], enAttente[i].name);
    fd.append('mot', (el('mot') && el('mot').value) || '');

    // XHR ET NON `fetch` : c'est le seul qui rende la PROGRESSION. Le depot
    // accepte des gigaoctets, et « envoi… » sans jauge ne s'y distingue pas
    // d'un blocage — on recommence pour rien.
    var x = new XMLHttpRequest();
    x.open('POST', '/api/v1/webos/depot');
    x.upload.onprogress = function (ev) {
      if (!ev.lengthComputable) return;
      j.firstChild.style.width = Math.round(ev.loaded / ev.total * 100) + '%';
    };
    function fini(txt, ko) {
      d.classList.remove('envoi'); j.remove();
      enAttente = null;
      var a = el('ajout'); if (a) a.remove();
      d.innerHTML = INVITE + CHAMP;
      branche();
      if (LIMITES) {
        var mo = Math.round((LIMITES.taille_max || 0) / (1024 * 1024));
        el('lim').textContent = LIMITES.fichiers_max + ' fichiers · ' +
          (mo >= 1024 ? Math.round(mo / 1024) + ' Go' : mo + ' Mo');
      }
      dis(txt, ko);
    }
    x.onload = function () {
      var r = {};
      try { r = JSON.parse(x.responseText); } catch (e) {}
      if (r.ok) fini('déposé — le propriétaire est prévenu');
      else fini(r.detail || ('refusé (' + x.status + ')'), true);
    };
    x.onerror = function () { fini('envoi interrompu', true); };
    x.send(fd);
  }

  // Le champ d'ajout n'existe que la ou une action d'ajout est declaree.
  function poseAjout() {
    var cfg = AJOUT[id];
    if (!cfg || el('ajout')) return;
    var d = document.createElement('div');
    d.className = 'ajout'; d.id = 'ajout';
    d.innerHTML = '<input id="mag" placeholder="' + esc(cfg.invite) + '" autocomplete="off">'
      + '<button id="go">' + esc(cfg.bouton) + '</button>';
    el('items').parentNode.insertBefore(d, el('msg'));
    function envoie() {
      var v = el('mag').value.trim();
      if (!v) return;
      dis('envoi…');
      var corps = {}; corps[cfg.champ] = v;
      api('/actions/' + ACTIONNABLE[id] + '/ajouter',
          { method: 'POST', body: JSON.stringify(corps) })
        .then(function (r) {
          var x = r.corps || {};
          if (x.ok) { el('mag').value = ''; dis('accepté'); chargeItems(); }
          else dis(x.detail || 'refusé', true);
        });
    }
    el('go').addEventListener('click', envoie);
    // Entrée vaut le bouton : coller une URL puis viser un bouton de 60 px,
    // c'est un geste de trop pour la seule chose que cette carte sait faire.
    el('mag').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); envoie(); }
    });
  }

  el('items').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-a]');
    if (!b) return;
    var it = b.closest('.it');

    // SUPPRIMER NE SE FAIT PAS AU PREMIER CLIC. Retirer un site du depot est
    // irreversible, et cette carte est petite : le pointeur y derape. Le
    // premier clic arme, le second execute — et l'armement retombe seul.
    if (b.dataset.a === 'supprimer' && b.dataset.arme !== '1') {
      b.dataset.arme = '1';
      b.textContent = '⚠';
      b.title = 'Cliquer à nouveau pour retirer « ' + it.dataset.id + ' »';
      dis('confirmer le retrait ?');
      setTimeout(function () {
        if (!b.parentNode) return;
        b.dataset.arme = ''; b.textContent = '✕';
        b.title = 'Retirer du dépôt'; dis('');
      }, 4000);
      return;
    }

    dis('…');
    // Le depot nomme sa cible `name`, les autres `id` : on envoie les deux,
    // chaque module ne lisant que le champ qu'il declare.
    var cible = (b.dataset.a === 'supprimer')
      ? { name: it.dataset.id } : { id: it.dataset.id };
    api('/actions/' + ACTIONNABLE[id] + '/' + b.dataset.a,
        { method: 'POST', body: JSON.stringify(cible) })
      .then(function (r) {
        var x = r.corps || {};
        dis(x.ok ? 'fait' : (x.detail || 'refusé'), !x.ok);
        if (x.ok) chargeItems();
      });
  });

  function charge() {
    fetch('/adm/api/v1/' + c.mod + '/status', { headers: { 'Accept': 'application/json' } })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (!d) { el('note').innerHTML = '<span class="ko">état indisponible</span>'; return; }
        pose(d);
      })
      .catch(function () { el('note').innerHTML = '<span class="ko">injoignable</span>'; });
  }
  charge();
  chargeItems();
  // Ces chiffres bougent quand on agit, pas tout seuls : une minute suffit.
  setInterval(charge, 60000);

  // Rester dans le Hall (#1266).
  document.addEventListener('click', function (ev) {
    if (parent === window) return;
    var a = ev.target && ev.target.closest ? ev.target.closest('a[href]') : null;
    if (!a || ev.defaultPrevented || ev.button !== 0 || ev.metaKey || ev.ctrlKey) return;
    ev.preventDefault();
    try { parent.postMessage({ sbx: 'ouvre', id: id, url: a.href }, '*'); } catch (e) {}
  }, true);

  (function () {
    var t = new URLSearchParams(location.search).get('theme');
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
  })();
  addEventListener('message', function (ev) {
    var d = ev.data;
    if (!d || d.sbx !== 'theme') return;
    if (d.theme === 'dark' || d.theme === 'light') {
      document.documentElement.setAttribute('data-theme', d.theme);
    }
  });
})();
</script>
