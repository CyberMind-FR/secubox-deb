  SecuBox #1286 — WIDGET D'ACCÈS RAPIDE du Hall, au profil Aurora (.claude/AURORA-REFERENCE.md, #2659).

  POURQUOI CES SERVICES-LÀ N'ONT PAS DE CARTE À EUX. Torrent, YTSaS et le Dépôt ne se CONSULTENT pas : on y va pour faire
  quelque chose. Leur montrer une vitrine défilante serait leur prêter une vie de publication qu'ils n'ont pas. Ce qu'on veut
  d'eux tient en une ligne de chiffres — combien, combien en cours, combien de place reste — et en un accès direct.

  UN SEUL GABARIT POUR TOUS (?svc=torrent|ytsas|nextcloud|photoprism|mail|depot). Ils diffèrent par leurs chiffres, pas par
  leur forme : plusieurs fichiers presque identiques auraient été autant d'endroits où corriger. Encadrée par la carte Cumul
  (cloud, contenu…), elle porte ?embed=1 : l'hôte du service est alors repris par la barre du bas du cumul.

  MÊMES APPELS D'API QU'AVANT : lecture /adm/api/v1/<module>/status, liste /api/v1/webos/public/actions/<m>/liste, actions
  POST /api/v1/webos/actions/<m>/<action>, dépôt POST /api/v1/webos/depot (XHR, progression). Retrait d'un site du dépôt :
  confirmation INTÉGRÉE (Confirmer / Annuler), aucun dialogue natif. Messages vers le Hall inchangés : ouvre, voir.
  ?demo=1 : chiffres et listes fictifs, aucune requête, toutes les actions inertes. Mesure absente = « — » (jamais 0).
  Tout texte venu du serveur passe par textContent.
-->

<style>

  body.emb .marque{display:none} body.dans .marque small{display:none} body.dans .marque h1{font-size:1.05rem} body.dans .marque svg{width:24px;height:24px}

  .onglet[aria-selected="true"]{border-color:var(--cyan);background:rgba(41,182,246,.18);color:var(--texte);font-weight:700}
  .note{color:var(--faible);font-size:.72rem;margin:8px 0 0;overflow-wrap:anywhere} .note b{color:var(--orange);font-weight:600}
  .retour{font-size:.78rem;margin:8px 0 0;padding:6px 10px;border-radius:8px;border:1px solid var(--trait2);background:rgba(8,18,38,.7);overflow-wrap:anywhere}

  .it a.nm.lire{color:var(--cyan);font-weight:600;cursor:pointer}
  .it .et{flex:0 0 auto;font-size:.68rem;color:var(--doux);border:1px solid var(--trait2);border-radius:999px;padding:1px 9px}

  .it button:hover{border-color:var(--cyan)}
  .it button.ok{border-color:var(--rouge);color:var(--rouge)}
  /* ZONE DE DEPOT (#1328) : glisser, coller, choisir — trois gestes, un seul chemin. */

  .depose:hover,.depose.vise{border-color:var(--cyan);color:var(--cyan)}
  .depose b{font-weight:600} .depose i{font-style:normal;color:var(--faible);font-size:.7rem}
  .depose.envoi{cursor:progress} .depose.ferme{cursor:default;opacity:.7}
  .jauge{height:4px;border-radius:2px;background:rgba(159,179,214,.16);overflow:hidden;margin-top:6px}

  .ajout input{flex:1 1 140px}
  .ajout button{flex:0 0 auto;font:inherit;font-size:.78rem;padding:5px 14px;border-radius:8px;border:1px solid var(--cyan);background:var(--cyan);color:#04101e;font-weight:700;cursor:pointer;min-height:34px}
  .pied{font-size:.72rem;color:var(--faible);font-variant-numeric:tabular-nums;margin:8px 0 0}

  /* iPhone (#2733) : EN FIN DE FEUILLE pour passer après `body.dans .cadre{padding:0}` et `body.emb .app{padding:0}` de la carte. Une vraie marge de chaque côté,
     y compris dans l'iframe du Hall : sans elle le contenu touchait le bord (cadre à 0, 8 px de marge intérieure au mieux). */

  <header class="tete" id="tete">

      <span class="ic" id="ic" aria-hidden="true">📦</span>
      <div><h1 id="nom">…</h1><small class="mono" id="hote"></small></div>
    </div>
    <span class="actif neutre" id="etat" aria-live="polite">Lecture…</span>

  <div class="pan" id="panneau" hidden><h3>Éléments récents <i id="routeListe"></i></h3>

</div></div>
<script src="/api/v1/webos/public/hotes.js"></script>
<script src="../domaine.js"></script>
<script src="../sonde.js"></script>
<script>
(function () {
  "use strict";
  var el = function (id) { return document.getElementById(id); };
  function nouveau(tag, cls, texte) { var e = document.createElement(tag); if (cls) e.className = cls; if (texte != null) e.textContent = texte; return e; }

  // Ce qui distingue les services : leur nom, leur module d'API, et les chiffres
  // qui MERITENT d'etre en titre. Le reste est commun.
  var SVC = {
    // PAS DE BOUTONS DU BAS (#1332), comme YTSaS et le Dépôt. « Ouvrir » et
    // « Ajouter » doublaient ce que la carte fait déjà : la liste des torrents
    // avec pause/reprise, et le champ magnet juste dessous. Deux boutons qui
    // menaient au même endroit, en plus loin.
    torrent: { ic:'🧲', nom:'Torrent', hote:SBX_DOMAINE.hote('torrent.gk2.secubox.in'), mod:'torrent',
      couleur:'#3c6e8f',
      chiffres:[['total','📦','au total'],['downloading','⬇','en cours'],
                ['to_peertube','📹','vers PeerTube']],
      acces:[] },
    // PAS DE BOUTONS (#1320) : la carte fait deja ce que le service fait —
    // une URL, un bouton de capture, et la liste des dernieres. « Ouvrir » et
    // « Nouvelle capture » ne menaient qu'a la meme chose, en plus loin.
    ytsas: { ic:'🎬', nom:'YTSaS', hote:SBX_DOMAINE.hote('ytsas.gk2.secubox.in'), mod:'ytsas',
      couleur:'#b03030',
      chiffres:[['total','🎞️','captures'],['jobs','⚙️','tâches'],
                ['to_peertube','📹','vers PeerTube']],
      acces:[] },
    // CLOUD (Nextcloud) : une carte VIVANTE, plus un lien. Elle dit l'état réel du conteneur (en marche, endormi, absent), la
    // version, le nombre de comptes et l'espace utilisé, et « Ouvrir » entre dans Nextcloud avec la session du Hall (/sbx/entrer).
    // La lecture exige la session de la personne : sans elle, la carte le dit au lieu d'afficher des zéros.
    nextcloud: { ic:'☁️', nom:'Cloud', hote:SBX_DOMAINE.hote('nc.gk2.secubox.in'), mod:'nextcloud',
      couleur:'#1655a0',
      chiffres:[['user_count','👥','comptes'],['disk_used','💾','espace utilisé']],
      etat:function(d){ return d.running ? 'en marche' + (d.version ? ' · version ' + d.version : '')
                                         : (d.installed ? 'endormi — se réveille à l’ouverture' : 'non installé'); },
      acces:[['Ouvrir mon cloud','/sbx/entrer','']] },
    // PHOTOS (PhotoPrism) : photos, vidéos, albums, espace — le comptage vient d'un cache côté module (mesuré en arrière-plan).
    photoprism: { ic:'📷', nom:'Photos', hote:SBX_DOMAINE.hote('photoprism.gk2.secubox.in'), mod:'photoprism',
      couleur:'#1f7a58',
      chiffres:[['library_stats.total_photos','📷','photos'],['library_stats.total_videos','🎞️','vidéos'],
                ['library_stats.total_albums','🗂️','albums'],['library_stats.storage_used','💾','espace']],
      absent:function(d){ return d.container_status === 'not_installed'; },
      etat:function(d){
        if (d.container_status === 'not_installed') return 'non installé';
        var ls = d.library_stats || {};
        var base = d.http_reachable ? 'en marche' : (String(d.lxc_state || '').toUpperCase() === 'RUNNING' ? 'démarre…' : 'arrêté');
        return base + (ls.import_pending ? ' · ' + ls.import_pending + ' à importer' : '') + (ls.mesure_en_cours ? ' · comptage en cours' : '');
      },
      acces:[['Ouvrir mes photos','/','']] },
    // MAIL : boîtes, espace, et l'état des deux conteneurs (serveur, webmail) — le diagnostic utile quand « ça ne part pas ».
    mail: { ic:'📧', nom:'Mail', hote:SBX_DOMAINE.hote('webmail.gk2.secubox.in'), mod:'mail',
      couleur:'#c87832',
      chiffres:[['user_count','👥','boîtes'],['storage','💾','espace']],
      etat:function(d){
        var c = d.components || {}, srv = c.mail_server || {}, web = c.webmail || {};
        if (!d.installed && !srv.installed) return 'non installé';
        if (srv.running && web.running) return 'serveur et webmail en marche';
        if (srv.running) return 'serveur en marche · webmail arrêté';
        if (web.running) return 'webmail en marche · serveur arrêté';
        return 'arrêté';
      },
      acces:[['Ouvrir ma messagerie','/','']] },
    depot: { ic:'📦', nom:'Dépôt', hote:SBX_DOMAINE.hote('depot.gk2.secubox.in'), mod:'droplet',
      couleur:'#3d6b4a',
      chiffres:[['sites_count','🌐','sites'],['apps_count','🧩','applications']],
      acces:[] }
  };

  // Quels widgets savent AGIR, et sous quel nom de module. YTSaS n'y figure
  // pas : sa route d'action reste introuvable, et un bouton qui ne fait rien
  // est pire qu'un bouton absent.
  var ACTIONNABLE = { torrent: 'torrent', depot: 'droplet', ytsas: 'ytsas' };

  // Ce que chaque widget met dans son champ d'ajout. YTSaS n'a qu'UNE
  // fonction — une URL, un bouton — et sa carte doit s'y tenir : lui inventer
  // des options qu'il n'a pas serait promettre ce qu'il ne fait pas.
  var AJOUT = {
    torrent: { champ:'magnet', invite:'magnet:… ou URL', bouton:'Ajouter' },
    ytsas:   { champ:'url',    invite:'URL de la vidéo', bouton:'Capturer' }
  };

  var params = new URLSearchParams(location.search);
  var DEMO = !!params.get('demo');
  var id = params.get('svc') || 'depot';
  var c = SVC[id] || SVC.depot;
  if (params.get('embed')) document.body.classList.add('emb');
  try { if (window.top !== window) document.body.classList.add('dans'); } catch (e) { document.body.classList.add('dans'); }
  // EN TRANCHE DE CUMUL (#1266) : l'hôte du service est repris par la barre du
  // bas du cumul (sur la ligne des points). On masque donc NOTRE ligne d'hôte
  // pour ne pas la doubler — la tranche n'en montre qu'une, en bas.
  var enEmbed = params.get('embed') === '1';
  var derniereListe = [];
  if (ACTIONNABLE[id]) el('routeListe').textContent = 'GET /api/v1/webos/public/actions/' + ACTIONNABLE[id] + '/liste';

  el('ic').textContent = c.ic;
  el('ic').style.background = c.couleur;
  el('nom').textContent = c.nom;
  el('hote').textContent = c.hote;
  if (enEmbed) { el('hote').style.display = 'none'; }
  c.acces.forEach(function (a) {
    var l = nouveau('a', 'btn ' + (a[2] || 'p'), a[0]);
    l.href = 'https://' + c.hote + a[1]; l.target = '_top';
    el('acces').appendChild(l);
  });
  // SANS BOUTONS, LE SERVICE DOIT RESTER ATTEIGNABLE. On ne rajoute rien : on
  // rend cliquable l'hôte, qui était déjà affiché. Une carte qui parle d'un
  // service sans y mener est une impasse.
  if (!c.acces.length) {
    var h = el('hote');
    h.textContent = '';
    var lh = nouveau('a', null, c.hote); lh.href = 'https://' + c.hote + '/'; lh.target = '_top';
    h.appendChild(lh);
  }

  function pastille(cls, t) { var e = el('etat'); e.className = 'actif ' + cls; e.textContent = t; }
  function octets(n) {
    n = Number(n) || 0;
    var u = ['o', 'Ko', 'Mo', 'Go', 'To'], i = 0;
    while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
    return (n >= 10 ? Math.round(n) : n.toFixed(1)) + ' ' + u[i];
  }

  // Les chiffres sont des tuiles. Une mesure absente est « — », jamais un zéro.
  function rendTuiles(d) {
    var z = el('tuiles'); z.textContent = '';
    var liste = d ? ((c.absent && c.absent(d)) ? [] : c.chiffres) : c.chiffres;
    z.style.setProperty('--n', String(Math.min(Math.max(liste.length, 1), 4) > 2 ? 2 : Math.max(liste.length, 1)));
    z.style.setProperty('--nl', String(Math.max(Math.min(liste.length, 4), 1)));
    liste.forEach(function (m) {
      var v = d ? m[0].split('.').reduce(function (o, k) { return (o === undefined || o === null) ? undefined : o[k]; }, d) : undefined;
      var absent = (v === undefined || v === null);
      var actif = !absent && (m[0] === 'downloading' || m[0] === 'jobs') && Number(v) > 0;
      var t = nouveau('div', 'tuile ' + (actif ? 'att' : absent ? 'nul' : 'cy'));
      t.title = m[2];
      t.appendChild(nouveau('span', 'l', m[1] + ' ' + m[2]));

  function pose(d) {

    // Un service qui dit lui-même s'il tourne (Nextcloud, Photos, Mail) : on l'écrit, c'est l'information la plus utile d'une
    // carte d'accès. Chaque service dit COMMENT (fonction `etat`), car « endormi », « démarre… » ou « webmail arrêté » diffèrent.
    if (typeof c.etat === 'function') { el('note').textContent = c.etat(d); }

  // ── AGIR (#1314) ─────────────────────────────────────────────────────────
  //
  // Tout passe par une route du Hall sous jeton : l'API du module n'est PAS
  // authentifiee, et l'appeler directement depuis la carte ouvrirait l'action
  // a qui charge la page.
  function jeton() { try { return localStorage.getItem('sbx_token') || ''; } catch (e) { return ''; } }
  function inerte() { dis('Démonstration : action inerte, rien n’est envoyé.'); }
  function api(chemin, opts) {
    opts = opts || {};
    // En démonstration, aucun appel d'écriture ne part : la promesse reste en suspens et le message le dit.
    if (DEMO) { inerte(); return new Promise(function () {}); }
    opts.headers = Object.assign({ 'Accept': 'application/json' }, opts.headers || {});
    var j = jeton();
    if (j) opts.headers['Authorization'] = 'Bearer ' + j;
    if (opts.body) opts.headers['Content-Type'] = 'application/json';
    return fetch('/api/v1/webos' + chemin, opts).then(function (r) {
      return r.json().catch(function () { return {}; })
        .then(function (d) { return { code: r.status, corps: d }; });
    });
  }
  function dis(t, ko) {
    var m = el('msg');
    m.className = 'msg' + (ko ? ' ko' : '');
    m.textContent = t || '';
  }

  // Chaque module rend sa liste a sa facon : le torrent un tableau nu, le
  // depot un objet `{droplets:[...]}`. Plutot que d'exiger d'eux un schema
  // commun qu'ils n'ont jamais eu, on lit les deux formes ici.
  function tableau(d) {
    if (Array.isArray(d)) return d;
    if (!d || typeof d !== 'object') return [];
    var k = ['droplets', 'items', 'records', 'torrents', 'videos'];
    for (var i = 0; i < k.length; i++)
      if (Array.isArray(d[k[i]])) return d[k[i]];

  }

  function bouton(a, titre, texte) { var b = nouveau('button', null, texte); b.type = 'button'; b.dataset.a = a; b.title = titre; b.setAttribute('aria-label', titre); return b; }

  function rendItems(l) {
    var z = el('items'); z.textContent = '';
    derniereListe = l || [];
    el('panneau').hidden = !ACTIONNABLE[id];
    if (!l || !l.length) return;
    l.slice(0, 3).forEach(function (x) {
      // Chaque module nomme ses champs a sa facon : le torrent a un `name` et
      // un `complete`, YTSaS un `title` et un etat de conservation. On lit ce
      // qui existe plutot que d'imposer un schema commun a des services qui
      // n'en ont jamais eu.
      var titre = x.name || x.title || '—';
      var fini = String(x.complete) === '1' || x.complete === true;
      var garde = String(x.kept) === '1' || x.kept === true;
      var ligne = nouveau('div', 'it');

      // LE DEPOT : ce qu'il heberge est en ligne ou ne l'est pas, et son nom
      // mene a son domaine. Un depot dont on ne peut pas ouvrir les sites
      // n'affiche que des noms de dossiers.
      if (id === 'depot') {
        var sur = x.enabled === true || String(x.enabled) === '1';
        var dom = x.domain || '';
        ligne.dataset.id = titre;
        var nom;
        if (dom) { nom = nouveau('a', 'nm', titre); nom.href = 'https://' + dom + '/'; nom.target = '_top'; nom.title = dom; }
        else { nom = nouveau('span', 'nm', titre); nom.title = titre; }
        ligne.appendChild(nom);
        ligne.appendChild(nouveau('span', 'et' + (sur ? ' ok' : ''), (x.type === 'streamlit' ? '🧩' : '🌐') + ' ' + (sur ? 'en ligne' : 'arrêté')));
        ligne.appendChild(bouton('supprimer', 'Retirer du dépôt', '✕'));
        z.appendChild(ligne);
        return;
      }

      var etat = (id === 'ytsas')
        ? (garde ? 'conservé' : 'éphémère')
        : (fini ? 'complet' : 'en cours');
      // ── CAPTURE YTSAS EN CACHE LOCAL : CLIQUABLE VERS LE VIEWER TV (#1237) ──
      // Une capture COMPLETE (ou conservee) est deja dans le cache SOUVERAIN de
      // la box : on peut la jouer sans repasser par YouTube ni Google. Son titre
      // devient un lien de lecture qui ouvre le VIEWER sur le flux souverain
      // /api/v1/ytsas/stream/<id>. Une capture encore EN COURS n'a pas de flux
      // a jouer : elle reste un simple nom.
      var vidY = x.id || x.video_id || '';
      var enCacheY = (id === 'ytsas') && (fini || garde) && vidY;
      var nmY;
      if (enCacheY) {
        nmY = nouveau('a', 'nm lire', '▶ ' + titre);
        nmY.dataset.lire = vidY; nmY.dataset.titre = titre; nmY.setAttribute('role', 'button'); nmY.tabIndex = 0;
        nmY.title = 'Lire dans le viewer (cache souverain) — ' + titre;
      } else { nmY = nouveau('span', 'nm', titre); nmY.title = titre; }
      ligne.dataset.id = x.infohash || vidY;
      ligne.appendChild(nmY);
      ligne.appendChild(nouveau('span', 'et' + ((fini || garde) ? ' ok' : ''), etat));
      if (id === 'ytsas') { if (!garde) ligne.appendChild(bouton('conserver', 'Conserver', '★')); }
      else { ligne.appendChild(bouton('pause', 'Mettre en pause', '❚❚')); ligne.appendChild(bouton('reprise', 'Reprendre', '▶')); }
      z.appendChild(ligne);
    });
  }

  // Données fictives (démonstration) : noms inventés, domaines de documentation, aucune requête.
  var DEMO_STATUT = {
    torrent: { total: 9, downloading: 2, to_peertube: 1, disk_free: 412 * 1024 * 1024 * 1024, active: 2 },
    ytsas: { total: 14, jobs: 1, to_peertube: 0, disk_free: 412 * 1024 * 1024 * 1024, active: 1 },
    nextcloud: { running: true, installed: true, version: '28.0.4', user_count: 4, disk_used: '12,4 Go' },
    photoprism: { container_status: 'running', http_reachable: true, library_stats: { total_photos: 8421, total_videos: 212, total_albums: 37, storage_used: '38 Go', import_pending: 0, mesure_en_cours: false } },
    mail: { installed: true, user_count: 5, storage: '2,1 Go', components: { mail_server: { installed: true, running: true }, webmail: { installed: true, running: true } } },
    depot: { sites_count: 3, apps_count: 2, disk_free: 412 * 1024 * 1024 * 1024 }
  };
  var DEMO_LISTE = {
    torrent: [{ name: 'distribution-libre-demo.iso', complete: 1, infohash: 'demo1' }, { name: 'archives-cartes-demo', complete: 0, infohash: 'demo2' }, { name: 'conference-demo.mkv', complete: 1, infohash: 'demo3' }],
    ytsas: [{ title: 'Conférence fictive sur les réseaux', id: 'demo-a', complete: 1, kept: 0 }, { title: 'Tutoriel fictif', id: 'demo-b', complete: 0, kept: 0 }, { title: 'Concert fictif', id: 'demo-c', complete: 1, kept: 1 }],
    depot: [{ name: 'site-demo', enabled: true, domain: 'site-demo.example', type: 'static' }, { name: 'appli-demo', enabled: false, domain: '', type: 'streamlit' }]
  };

  function chargeItems() {
    if (!ACTIONNABLE[id]) return;
    if (DEMO) {
      rendItems(DEMO_LISTE[id] || []);
      if (id === 'depot') { poseDepot(); chargeStockage(); } else poseAjout();
      return;
    }
    // LISTE PUBLIQUE (#1237) : media partages du parc, visibles meme en invite.
    api('/public/actions/' + ACTIONNABLE[id] + '/liste').then(function (r) {
      if (r.code === 401 || r.code === 403) {
        // PAS DE NAG (#1237) : ces cartes montrent deja leur resume PUBLIC (Go
        // libres, compteurs). La liste actionnable demande une session, mais un
        // invite n'a pas a etre harcele de « connectez-vous » : on masque juste
        // la liste et le bouton d'ajout, le resume reste.
        el('items').textContent = '';
        el('panneau').hidden = true;
        if (el('ajout')) el('ajout').remove();
        dis('');
        return;
      }
      var d = r.corps || {};
      if (!d.ok) { el('panneau').hidden = false; dis(d.detail || '', true); return; }
      dis('');
      var l = tableau(d.donnees);
      rendItems(l);
      if (id === 'depot' && !l.length) dis('Dépôt vide.');
      if (id === 'depot') { poseDepot(); chargeStockage(); }
      else poseAjout();
    });
  }

  // CE QUE LE DEPOT A DE PLUS QUE SA LISTE : ce qu'il reste de place. La liste
  // peut etre vide sans que le depot le soit, et c'est la seule mesure qui le
  // dise. Cette route est authentifiee en amont — le jeton est relaye.
  function pied(d) {
    var p = el('piedStock');
    p.hidden = false;
    p.textContent = d.total_human + ' déposés · ' + (d.file_count || 0)
      + ' fichier' + ((d.file_count || 0) > 1 ? 's' : '')
      + ' · ' + (d.max_upload_mb || '?') + ' Mo par envoi';
  }
  function chargeStockage() {
    if (DEMO) { pied({ total_human: '1,2 Go', file_count: 14, max_upload_mb: 512 }); return; }
    api('/public/actions/droplet/stockage').then(function (r) {
      var d = (r.corps || {}).donnees;
      if (!d || !d.total_human) return;
      pied(d);
    });
  }

  // ── DEPOSER, LA FONCTION MEME DU SERVICE (#1328, corrige #1329) ─────────
  //
  // DEUX VERBES A NE PAS CONFONDRE, et cette carte s'y etait trompee :
  //   publier un site   — reserve, authentifie, et ce n'est pas ce qu'on
  //                       vient faire ici ;
  //   DEPOSER un fichier — public, sans compte, rien n'est publie.
  // Le second est la raison d'etre du service. C'est celui qu'on offre.
  //
  // Trois gestes, un seul chemin : glisser, coller, choisir. Aucun n'est
  // meilleur que les autres — on prend celui qui tombe sous la main, et une
  // carte qui n'en accepte qu'un force le detour.
  var LIMITES = null;

  // La zone de dépôt, construite par le DOM : invite par défaut, ou texte donné.
  function remplisDepose(d, contenu) {
    d.textContent = '';
    if (contenu) {
      var sp = nouveau('span'); contenu(sp); d.appendChild(sp);
    } else {
      var s = nouveau('span');
      s.appendChild(document.createTextNode('Glissez vos fichiers, collez-les, ou '));
      s.appendChild(nouveau('b', null, 'choisissez'));
      var lim = nouveau('i'); lim.id = 'lim'; s.appendChild(document.createTextNode(' ')); s.appendChild(lim);
      d.appendChild(s);
    }
    var f = nouveau('input'); f.type = 'file'; f.id = 'fich'; f.multiple = true; f.hidden = true; f.setAttribute('aria-label', 'Choisir des fichiers');
    d.appendChild(f);
  }
  function affLimites() {
    var lim = el('lim');
    if (lim && LIMITES) {
      var mo = Math.round((LIMITES.taille_max || 0) / (1024 * 1024));
      lim.textContent = LIMITES.fichiers_max + ' fichiers · ' + (mo >= 1024 ? Math.round(mo / 1024) + ' Go' : mo + ' Mo');
    }
  }

  function poseDepot() {
    if (el('depose')) return;
    var d = nouveau('div', 'depose');
    d.id = 'depose';
    d.setAttribute('role', 'button'); d.setAttribute('tabindex', '0');
    remplisDepose(d);
    el('items').parentNode.insertBefore(d, el('msg'));

    // CE QUE LE DEPOSANT DOIT SAVOIR AVANT D'ENVOYER, et qui n'est pas une
    // formalite : ses fichiers ne seront pas publies, et personne ne pourra
    // les relire depuis cette carte. Le dire apres n'aurait servi a rien.
    var n = nouveau('p', 'note');
    n.id = 'noteDepot';
    n.textContent = "Ils partent directement sur la box, et une alerte prévient "
      + "son propriétaire. Rien de ce qui est déposé n'est publié, ni relisible "
      + "depuis cette page.";
    d.parentNode.insertBefore(n, d.nextSibling);

    branche();

    // LES PLAFONDS SE DEMANDENT, ILS NE S'ECRIVENT PAS ICI. Les recopier dans
    // la carte, c'est garantir qu'ils divergeront le jour ou le service
    // changera les siens.
    var lecture = DEMO ? Promise.resolve({ corps: { donnees: { actif: true, fichiers_max: 10, taille_max: 512 * 1024 * 1024 } } }) : api('/depot/reglages');
    lecture.then(function (r) {
      var x = (r.corps || {}).donnees;
      if (!x) return;
      LIMITES = x;
      if (!x.actif) {
        d.classList.add('ferme');
        remplisDepose(d, function (sp) { sp.textContent = "L'espace de dépôt est fermé."; });
        return;
      }
      affLimites();
    });

    // GLISSER SUR TOUTE LA CARTE, pas seulement sur la zone. Viser un cadre de
    // 40 px de haut avec un fichier au bout du curseur est un geste ingrat ;
    // la carte entiere est une cible qu'on ne peut pas manquer.
    // `preventDefault` sur `dragover` est OBLIGATOIRE : sans lui le navigateur
    // refuse le depot et OUVRE le fichier a la place, ce qui remplacerait la
    // carte par le fichier.
    ['dragenter', 'dragover'].forEach(function (nom) {
      document.addEventListener(nom, function (e) {
        if (!estFichier(e) || d.classList.contains('ferme')) return;
        e.preventDefault(); d.classList.add('vise');
      });
    });
    ['dragleave', 'dragend'].forEach(function (nom) {
      document.addEventListener(nom, function (e) {
        if (e.relatedTarget) return;      // on sort d'un enfant, pas de la page
        d.classList.remove('vise');
      });
    });
    document.addEventListener('drop', function (e) {
      if (!estFichier(e) || d.classList.contains('ferme')) return;
      e.preventDefault(); d.classList.remove('vise');
      retiens(e.dataTransfer && e.dataTransfer.files);
    });

    // COLLER. Le presse-papiers porte des fichiers quand on copie depuis un
    // gestionnaire de fichiers — c'est le geste le plus court quand on vient
    // d'en fabriquer un.
    document.addEventListener('paste', function (e) {
      if (d.classList.contains('ferme')) return;
      var l = e.clipboardData && e.clipboardData.files;
      if (l && l.length) { e.preventDefault(); retiens(l); }
    });
  }

  function branche() {
    var d = el('depose'), f = el('fich');
    d.onclick = function (e) {
      if (e.target !== f && !d.classList.contains('envoi')
          && !d.classList.contains('ferme')) f.click();
    };
    d.onkeydown = function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); d.onclick(e); }
    };
    if (f) f.onchange = function () { retiens(f.files); };
  }

  function estFichier(e) {
    var t = e.dataTransfer && e.dataTransfer.types;
    if (!t) return false;
    for (var i = 0; i < t.length; i++) if (t[i] === 'Files') return true;
    return false;
  }

  // ON NE PART PAS AU PREMIER FICHIER. Le service accepte un depot de
  // PLUSIEURS fichiers accompagne d'un mot : envoyer des qu'on en pose un
  // ferait autant de depots separes que de fichiers, et perdrait le mot.
  var enAttente = null;

  function retiens(liste) {
    if (!liste || !liste.length) return;
    if (LIMITES && liste.length > LIMITES.fichiers_max) {
      dis('au plus ' + LIMITES.fichiers_max + ' fichiers par dépôt', true);
      return;
    }
    var somme = 0;
    for (var i = 0; i < liste.length; i++) somme += liste[i].size || 0;
    if (LIMITES && LIMITES.taille_max && somme > LIMITES.taille_max) {
      dis('dépôt trop volumineux', true);
      return;
    }
    enAttente = liste;
    var d = el('depose');
    remplisDepose(d, function (sp) {
      sp.appendChild(document.createTextNode(liste.length + ' fichier' + (liste.length > 1 ? 's' : '') + ' — '));
      sp.appendChild(nouveau('b', null, 'envoyer ?'));
    });
    branche();
    if (!el('mot')) {
      var m = nouveau('div', 'ajout');
      m.id = 'ajout';
      var champ = nouveau('input'); champ.id = 'mot'; champ.type = 'text'; champ.placeholder = 'un mot, si vous voulez'; champ.autocomplete = 'off'; champ.maxLength = 2000;
      champ.setAttribute('aria-label', 'Un mot pour accompagner le dépôt');
      var go = nouveau('button', null, 'Déposer'); go.id = 'go'; go.type = 'button';
      m.appendChild(champ); m.appendChild(go);
      el('noteDepot').parentNode.insertBefore(m, el('noteDepot'));
      go.addEventListener('click', envoie);
      champ.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); envoie(); }
      });
    }
    dis('');
  }

  function envoie() {
    var d = el('depose');
    if (!enAttente || d.classList.contains('envoi')) return;
    if (DEMO) { inerte(); return; }
    d.classList.add('envoi');

    var j = nouveau('div', 'jauge');
    j.appendChild(nouveau('i'));
    d.parentNode.insertBefore(j, d.nextSibling);
    dis('envoi…');

    var fd = new FormData();
    for (var i = 0; i < enAttente.length; i++)
      fd.append('fichiers', enAttente[i], enAttente[i].name);
    fd.append('mot', (el('mot') && el('mot').value) || '');

    // XHR ET NON `fetch` : c'est le seul qui rende la PROGRESSION. Le depot
    // accepte des gigaoctets, et « envoi… » sans jauge ne s'y distingue pas
    // d'un blocage — on recommence pour rien.
    var x = new XMLHttpRequest();
    x.open('POST', '/api/v1/webos/depot');
    x.upload.onprogress = function (ev) {
      if (!ev.lengthComputable) return;
      j.firstChild.style.width = Math.round(ev.loaded / ev.total * 100) + '%';
    };
    function fini(txt, ko) {
      d.classList.remove('envoi'); j.remove();
      enAttente = null;
      var a = el('ajout'); if (a) a.remove();
      remplisDepose(d);
      branche();
      affLimites();
      dis(txt, ko);
    }
    x.onload = function () {
      var r = {};
      try { r = JSON.parse(x.responseText); } catch (e) {}
      if (r.ok) fini('déposé — le propriétaire est prévenu');
      else fini(r.detail || ('refusé (' + x.status + ')'), true);
    };
    x.onerror = function () { fini('envoi interrompu', true); };
    x.send(fd);
  }

  // Le champ d'ajout n'existe que la ou une action d'ajout est declaree.
  function poseAjout() {
    var cfg = AJOUT[id];
    if (!cfg || el('ajout')) return;
    var d = nouveau('div', 'ajout');
    d.id = 'ajout';
    var champ = nouveau('input'); champ.id = 'mag'; champ.type = 'text'; champ.placeholder = cfg.invite; champ.autocomplete = 'off'; champ.setAttribute('aria-label', cfg.invite);
    var go = nouveau('button', null, cfg.bouton); go.id = 'go'; go.type = 'button';
    d.appendChild(champ); d.appendChild(go);
    el('items').parentNode.insertBefore(d, el('msg'));
    function envoie() {
      var v = el('mag').value.trim();
      if (!v) return;
      dis('envoi…');
      var corps = {}; corps[cfg.champ] = v;
      api('/actions/' + ACTIONNABLE[id] + '/ajouter',
          { method: 'POST', body: JSON.stringify(corps) })
        .then(function (r) {
          var x = r.corps || {};
          if (x.ok) { el('mag').value = ''; dis('accepté'); chargeItems(); }
          else dis(x.detail || 'refusé', true);
        });
    }
    go.addEventListener('click', envoie);
    // Entrée vaut le bouton : coller une URL puis viser un bouton de 60 px,
    // c'est un geste de trop pour la seule chose que cette carte sait faire.
    champ.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); envoie(); }
    });
  }

  el('items').addEventListener('click', function (e) {
    // LIRE UNE CAPTURE EN CACHE DANS LE VIEWER TV (#1237). Le lien de lecture
    // n'a pas de href (il n'echappe donc pas au Hall via le handler generique
    // a[href]) : on demande au Hall d'ouvrir le VIEWER sur le flux souverain.
    var lire = e.target.closest && e.target.closest('a.lire[data-lire]');
    if (lire) {
      e.preventDefault();
      var sid = lire.getAttribute('data-lire');
      if (DEMO) { inerte(); return; }
      if (sid && parent !== window) {
        try { parent.postMessage({ sbx: 'voir',
          url: '/api/v1/ytsas/stream/' + encodeURIComponent(sid),
          titre: lire.getAttribute('data-titre') || '' }, '*'); } catch (x) {}
      }
      return;
    }
    var b = e.target.closest('button[data-a]');
    if (!b) return;
    var it = b.closest('.it');

    // ANNULER le retrait : la ligne retrouve son bouton d'origine.
    if (b.dataset.a === 'annuler') { rendItems(derniereListe); dis(''); return; }

    // SUPPRIMER NE SE FAIT PAS AU PREMIER CLIC. Retirer un site du depot est
    // irreversible, et cette carte est petite : le pointeur y derape. Le
    // premier clic demande une confirmation DANS LA PAGE (Confirmer / Annuler).
    if (b.dataset.a === 'supprimer' && b.dataset.confirme !== '1') {
      var conf = bouton('supprimer', 'Confirmer le retrait de « ' + it.dataset.id + ' »', 'Confirmer');
      conf.dataset.confirme = '1'; conf.className = 'ok';
      var ann = bouton('annuler', 'Annuler le retrait', 'Annuler');
      it.replaceChild(conf, b); it.appendChild(ann);
      dis('confirmer le retrait de « ' + it.dataset.id + ' » ?');
      return;
    }

    dis('…');
    // Le depot nomme sa cible `name`, les autres `id` : on envoie les deux,
    // chaque module ne lisant que le champ qu'il declare.
    var cible = (b.dataset.a === 'supprimer')
      ? { name: it.dataset.id } : { id: it.dataset.id };
    api('/actions/' + ACTIONNABLE[id] + '/' + b.dataset.a,
        { method: 'POST', body: JSON.stringify(cible) })
      .then(function (r) {
        var x = r.corps || {};
        dis(x.ok ? 'fait' : (x.detail || 'refusé'), !x.ok);
        if (x.ok) chargeItems();
      });
  });

  function charge() {
    el('maj').textContent = 'Relevé ' + new Date().toLocaleTimeString('fr-FR');
