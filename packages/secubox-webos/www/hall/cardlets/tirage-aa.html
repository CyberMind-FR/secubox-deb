  Cardlet TIRAGE — Anibal Amiot (site partenaire, tirage Yi King).
  ON N'EMBARQUE PAS UNE RÉINVENTION : on EMBARQUE la vraie page de tirage du
  site (index.html : bouton « Tirer aux pièces » + résultat des 64 hexagrammes,
  encodé dans ?tire=), servie EN MÊME ORIGINE via le relais /aa/ (→ vhost
  metablogizer :8900). Le site N'EST JAMAIS MODIFIÉ : on l'affiche et on
  l'adapte à la cardlet depuis NOTRE côté (cadre, échelle). Plus évolutif : si
  le tirage du site change, la cardlet suit sans retouche.
-->
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tirage — Anibal Amiot</title>
<style>
  :root{
    --bg:#0c0b0e; --panel:#141216; --ink:#ece5d5; --dim:#9b937f; --line:#282430;
    --or:#d99a2b; --carmine:#c9536a;
  }
  @media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
    --bg:#e7e1d2; --panel:#efe8d7; --ink:#2b2620; --dim:#6a6152; --line:#d3cab3; --or:#b9791a; --carmine:#93283a;
  }}
  :root[data-theme="light"]{
    --bg:#e7e1d2; --panel:#efe8d7; --ink:#2b2620; --dim:#6a6152; --line:#d3cab3; --or:#b9791a; --carmine:#93283a;
  }
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:"Instrument Sans",system-ui,-apple-system,sans-serif;overflow:hidden}
  .mw{display:flex;flex-direction:column;height:100vh;position:relative}
  .h{display:flex;align-items:center;gap:8px;padding:9px 11px;border-bottom:1px solid var(--line);
     background:linear-gradient(180deg,color-mix(in srgb,var(--or) 10%,var(--panel)),var(--panel))}
  .h .ic{font-size:1.05rem}
  .h b{font-weight:600;font-size:.92rem;letter-spacing:.01em}
  .h .src{margin-left:auto;font-size:.56rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
     font-family:ui-monospace,monospace}
  .h .dot{width:6px;height:6px;border-radius:50%;background:var(--or);margin-right:4px;display:inline-block;
     box-shadow:0 0 0 3px color-mix(in srgb,var(--or) 22%,transparent)}
  /* Le cadre embarque la VRAIE page du site (relais /aa/). En /micro on met à
     l'échelle depuis NOTRE côté pour donner à voir l'outil sans le modifier ;
     en /mega la page reprend sa taille pleine. */
  /* On CADRE la zone tirage : le contenu embarqué est nettoyé de son chrome
     (en-tête/menu/pied) par une feuille injectée côté cardlet (même origine),
     puis on met à l'échelle pour focaliser. En /mega, taille pleine + scroll. */
  .frame{flex:1;position:relative;overflow:hidden;background:var(--panel)}
  /* /micro : on FORCE une largeur logique desktop (≥800px, au-dessus du point de
     rupture responsive du site) pour garder la mise en page 3 colonnes — traits,
     pavage, ET les deux trigrammes à droite — puis fit() met à l'échelle pour
     remplir la carte (recalé en JS ; valeurs ci-dessous = repli pré-JS). */
  iframe{position:absolute;top:0;left:0;border:0;display:block;background:transparent;transform-origin:0 0}
  html:not(.mega) iframe{width:800px;height:1200px;transform:scale(.5)}
  html.mega .frame{overflow:auto;-webkit-overflow-scrolling:touch}
  html.mega iframe{position:static;width:100%;height:100%;transform:none}
  .pied{display:flex;align-items:center;gap:9px;padding:7px 11px;border-top:1px solid var(--line);
     background:var(--panel);font-size:.7rem;color:var(--dim)}
  .pied .retirer{font:inherit;font-size:.76rem;font-weight:600;cursor:pointer;border:0;border-radius:8px;
     padding:6px 12px;background:var(--carmine);color:#f7efe0;display:inline-flex;align-items:center;gap:6px;transition:filter .15s,transform .1s}
  .pied .retirer:hover{filter:brightness(1.08)} .pied .retirer:active{transform:translateY(1px)}
  .pied .hint{color:var(--dim)}
  .pied a{color:var(--or);text-decoration:none;margin-left:auto;white-space:nowrap}
  .pied a:hover{text-decoration:underline}
  .load{position:absolute;inset:0;display:grid;place-items:center;color:var(--dim);font-size:.8rem;
     background:var(--panel);z-index:2;transition:opacity .4s}
  .load.gone{opacity:0;pointer-events:none}
  /* Bulle de DÉTAIL au survol : le « dessous » (image + interprétation + binôme/
     opposé) remonté depuis l'iframe, sans surcharger la carte. */
  /* Ancrée en BAS, hauteur limitée : elle occupe l'espace vide sous le résultat
     compact (qui reste visible en haut) au lieu de le recouvrir. */
  .dbulle{position:absolute;left:8px;right:8px;bottom:44px;z-index:6;max-height:50%;overflow:auto;
     scrollbar-width:thin;background:color-mix(in srgb,var(--panel) 95%,#000);
     border:1px solid var(--line-2,var(--line));border-radius:12px;padding:11px 13px;
     box-shadow:0 -6px 26px rgba(0,0,0,.5);opacity:0;transform:translateY(8px);
     transition:opacity .16s,transform .16s;pointer-events:none}
  .dbulle.on{opacity:1;transform:none;pointer-events:auto}
  .dbulle .db-img{color:var(--or);font-weight:700;font-size:.86rem;letter-spacing:.01em;margin-bottom:7px}
  .dbulle .db-img .kw{font-family:ui-monospace,monospace;font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;
     color:var(--dim);font-weight:400;margin-right:6px}
  .dbulle .db-jg{color:var(--ink);font-size:.78rem;line-height:1.55}
  .dbulle .db-xref{margin-top:9px;padding-top:7px;border-top:1px solid var(--line);
     font-size:.66rem;color:var(--dim);display:flex;gap:10px;flex-wrap:wrap}
  html.mega .dbulle{display:none}
</style>
</head>
<body>
<div class="mw">
  <div class="h"><span class="ic">🎴</span><b>Tirage — Anibal Amiot</b>
    <span class="src"><span class="dot"></span>yi king · partenaire</span></div>
  <div class="frame">
    <div class="load" id="load">Consultation du Yi King…</div>
    <iframe id="fr" src="/aa/" title="Tirage Yi King — Anibal Amiot"
            referrerpolicy="no-referrer" loading="lazy"></iframe>
  </div>
  <div class="dbulle" id="dbulle" aria-hidden="true"></div>
  <div class="pied">
    <button class="retirer" id="retirer" type="button">🎴 Retirer</button>
    <span class="hint">6 traits · un hexagramme</span>
    <a id="grand" href="/aa/" target="_blank" rel="noopener">Ouvrir en grand ↗</a></div>
</div>

<script src="../aide.js"></script>
<script>
(function(){
  "use strict";
  var qs=new URLSearchParams(location.search);
  var MEGA=qs.get('mega')==='1';
  if(MEGA) document.documentElement.classList.add('mega');
  var t=qs.get('theme'); if(t==='dark'||t==='light') document.documentElement.setAttribute('data-theme',t);
  addEventListener('message',function(ev){var d=ev.data;if(d&&d.sbx==='theme'&&(d.theme==='dark'||d.theme==='light'))
    document.documentElement.setAttribute('data-theme',d.theme);});
  // NETTOYAGE de notre VUE embarquée : le relais /aa/ est same-origine, donc on
  // peut injecter une feuille de style dans l'iframe pour masquer le chrome du
  // site (en-tête, menu, pied, palette, guide) et ne garder que la zone TIRAGE
  // (échiquier + « Tirer aux pièces » + résultat). On n'altère PAS les fichiers
  // du site : on adapte notre affichage. Sélecteurs du site — si le site change,
  // on ajuste ces sélecteurs (l'embed, lui, reste évolutif).
  var fr=document.getElementById('fr');
  // On ne garde QUE le résultat (#detail : N° + hexagramme + pavage). Tout le
  // reste (chrome + échiquier + pied) est masqué. `.grid-panel` (qui contient le
  // vrai bouton « Tirer aux pièces ») est sorti du flux HORS-ÉCRAN plutôt que
  // display:none, pour rester CLIQUABLE par notre « Retirer ». Overflow coupé →
  // aucun scroll, ni au-dessus ni en-dessous.
  var CLEAN="header,.book-bar,.site-nav-row,.footer-caduceus,.footer-title-logo,footer,"
    +".palette-picker,#palettePicker,#btnResetPalette,.detail-below,#detailBelow,"
    +"#txt-tirageGuide,.tirage-guide,.positions-guide-panel,.legend"
    +"{display:none!important}"
    +".grid-panel{position:absolute!important;left:-99999px!important;top:0!important;width:640px!important;height:auto!important;overflow:hidden!important}"
    +"html,body{background:transparent!important;margin:0!important;overflow:hidden!important;height:auto!important}"
    +".wrap{display:block!important;max-width:none!important;margin:0!important;padding:6px 12px 10px!important}"
    +".detail-outer,#detail{margin:0!important}"
    // Le DESSOUS (binôme/opposé, image, interprétation) sort de la carte : il est
    // remonté dans une bulle au survol (populée depuis l'iframe, même origine).
    +".xref-row,.keyword,.keyword-sub,.judgement{display:none!important}"
    // iPhone : les traits de l'hexagramme (.lines svg) sont en opacity:0 en
    // attente d'une révélation (scroll/IntersectionObserver) qui ne se déclenche
    // pas dans l'iframe mise à l'échelle + scroll verrouillé → on les force visibles.
    +".lines svg,.mutation-col .lines svg{opacity:1!important;transform:none!important}";
  function nettoie(){
    if(MEGA) return true; // en /mega : outil complet, on n'injecte pas
    try{ var doc=fr.contentDocument; if(!doc||!doc.head) return false;
      var s=doc.getElementById('sbx-embed-clean');
      if(!s){ s=doc.createElement('style'); s.id='sbx-embed-clean'; doc.head.appendChild(s); }
      s.textContent=CLEAN; return true;
    }catch(e){ return false; } // cross-origin (relais indisponible) → page brute
  }
  function hideLoad(){ var l=document.getElementById('load'); if(l) l.classList.add('gone'); }
  // AUTO-ALIGNEMENT : on cale la vue sur le RÉSULTAT (#detail — le N° tiré,
  // l'hexagramme, le pavage) pour qu'il soit cadré en haut, entier.
  function resultEl(){ try{ var d=fr.contentDocument; return d&&(d.getElementById('detail')||d.querySelector('.detail-outer')); }catch(e){ return null; } }
  function aligne(){ if(MEGA) return; try{ var win=fr.contentWindow, el=resultEl(); if(!win||!el) return;
    var r=el.getBoundingClientRect();
    win.scrollTo(Math.max(0,r.left+(win.scrollX||0)-6), Math.max(0,r.top+(win.scrollY||0)-6));
  }catch(e){} }
  // On observe le résultat : à chaque tirage, il change → on re-cale.
  function watch(){ try{ var el=resultEl(); if(!el||el._sbxObs) return !!el;
    var obs=new MutationObserver(function(){ setTimeout(aligne,60); });
    obs.observe(el,{childList:true,subtree:true,characterData:true}); el._sbxObs=obs;
    setTimeout(aligne,60); return true;
  }catch(e){ return false; } }
  // FIT : on impose à l'iframe une largeur LOGIQUE desktop (>768px) pour garder
  // la mise en page 3 colonnes du résultat (dont les trigrammes à droite —
  // sinon iPhone franchit le point de rupture et les perd), puis on met à
  // l'échelle pour remplir exactement la carte.
  var LW=800;
  function fit(){ if(MEGA) return; var frame=document.querySelector('.frame'); if(!frame) return;
    var fw=frame.clientWidth, fh=frame.clientHeight; if(!fw||!fh) return;
    fr.style.transformOrigin='0 0';
    // ÉCRAN LARGE (PC) : l'ancien rendu (172% / .581) était meilleur et donnait
    // déjà les 3 colonnes (largeur logique ~1.72×fw > 768). On le garde. ÉCRAN
    // ÉTROIT (iPhone) SEULEMENT : on force une largeur logique desktop (800px)
    // pour ne pas perdre la 3ᵉ colonne, quitte à réduire.
    if (fw * 1.72 >= 800) {
      fr.style.width = '172%'; fr.style.height = '172%'; fr.style.transform = 'scale(.581)';
    } else {
      var s = fw / LW; fr.style.width = LW + 'px'; fr.style.height = Math.ceil(fh / s) + 'px';
      fr.style.transform = 'scale(' + s + ')';
    }
  }
  function tenter(){ var ok=nettoie(); watch(); fit(); return ok; }
  fit();
  fr.addEventListener('load',function(){ tenter(); hideLoad(); fit(); setTimeout(function(){fit();aligne();},120); });
  var tries=0, iv=setInterval(function(){ if(tenter()||++tries>24){ clearInterval(iv); hideLoad(); fit(); aligne(); } },300);
  // « Retirer » : on déclenche le VRAI bouton du site (« Tirer aux pièces »).
  var rb=document.getElementById('retirer');
  if(rb) rb.addEventListener('click',function(){ try{
    var b=fr.contentDocument.getElementById('drawBtn'); if(b){ b.click(); setTimeout(aligne,140); setTimeout(aligne,420); }
  }catch(e){} });
  addEventListener('resize',function(){ fit(); setTimeout(function(){fit();aligne();},60); });
  // ── Bulle de DÉTAIL au survol : on remonte le « dessous » de l'iframe (image,
  //    interprétation, binôme/opposé) — masqué dans la carte — sans la surcharger.
  //    Même origine (relais /aa/) → on lit le vrai contenu du tirage.
  var bulle=document.getElementById('dbulle');
  function esc2(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c];});}
  function detailHTML(){ try{
    var doc=fr.contentDocument; if(!doc) return '';
    var d=doc.getElementById('detail'); if(!d) return '';
    var kw=d.querySelector('.keyword'), kws=d.querySelector('.keyword-sub'), jg=d.querySelector('.judgement');
    var jt=jg?jg.textContent.trim():''; var kt=kws?kws.textContent.trim():'';
    if(!jt && !kt) return ''; // pas encore de tirage
    var h='';
    if(kt) h+='<div class="db-img">'+(kw?'<span class="kw">'+esc2(kw.textContent.trim())+'</span>':'')+esc2(kt)+'</div>';
    if(jt) h+='<div class="db-jg">'+esc2(jt)+'</div>';
    var xb=d.querySelectorAll('.xref-btn'); if(xb.length){ var p=[];
      Array.prototype.forEach.call(xb,function(b){ p.push('<span>'+esc2(b.textContent.replace(/\s+/g,' ').trim())+'</span>'); });
      if(p.length) h+='<div class="db-xref">'+p.join('')+'</div>'; }
    return h;
  }catch(e){ return ''; } }
  function showBulle(){ if(MEGA) return; var h=detailHTML(); if(!h){ hideBulle(); return; }
    bulle.innerHTML=h; bulle.classList.add('on'); bulle.setAttribute('aria-hidden','false'); }
  function hideBulle(){ bulle.classList.remove('on'); bulle.setAttribute('aria-hidden','true'); }
  // Déclenchement sur l'EN-TÊTE seulement (le centre reste la vue normale du
  // tirage, jamais recouverte). Survoler le haut de la carte → détail ; quitter
  // l'en-tête → on referme.
  var head=document.querySelector('.h');
  if(head){ head.addEventListener('mouseenter',showBulle); head.addEventListener('mouseleave',hideBulle); }

  // Aide reverse-design (bibliothèque partagée). On NE touche PAS au contenu
  // embarqué (cross-doc) : on annote nos zones (en-tête, cadre, pied).
  window.SBXAide && SBXAide({ zones:function(){ return [
    {el:document.querySelector('.h'),     label:'En-tête — cardlet Tirage (site partenaire Anibal Amiot)'},
    {el:document.querySelector('.frame'), label:'Le tirage embarqué — « Tirer aux pièces » (6 traits) → un des 64 hexagrammes'},
    {el:document.querySelector('.pied'),  label:'Pied — ouvrir le tirage en grand (nouvel onglet)'}
  ].filter(function(z){return z.el;}); }});
})();
</script>
</body>
</html>
