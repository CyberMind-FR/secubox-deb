  SecuBox — carte « VoiceStudio » d'ADMINISTRATION (secubox-voicestudio, #1917).

  Même motif que « Coffre » / « Mon coffre » : DEUX entrées dans le Hall pour un module —
    · cette carte-ci (administrateur) : l'ÉTAT du moteur ; agrandie, elle ouvre la console /voicestudio/
      (`mode:"admin"`) — démarrer, arrêter, mode, mémoire, modèle, adresses, clé, essai, journal, sauvegarde ;
    · « Voix » (usager) : dire, dicter.

  LECTURE SEULE, ET RIEN QUE L'ÉTAT. Elle lit /api/v1/voicestudio/status — installé, actif, endormi, opération en
  cours ; ni adresse, ni IP du conteneur, ni commit, ni clé (la topologie reste dans /detail, réservé à
  l'administrateur, que le Hall ne relaie PAS). Elle n'agit sur rien : tout geste passe par la console.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VoiceStudio</title>
<style>
  :root{ --fond:#ffffff; --texte:#131722; --muted:#5b6478; --faint:#8a93a6; --line:#e2e6f0;
         --soft:#f5f7fc; --cyan:#0784a8; --up:#0f9d54; --hot:#d64545; --warn:#c87832; --grape:#6e40c9; }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme:dark;
    --fond:#0f1520; --texte:#e7ebf4; --muted:#8791a6; --faint:#5e6779; --line:#232b3b;
    --soft:#10151f; --cyan:#28d6ff; --up:#35d07f; --hot:#ff6a6a; --warn:#e0b46a; --grape:#a88bff; } }
  :root[data-theme="dark"]{ color-scheme:dark; --fond:#0f1520; --texte:#e7ebf4; --muted:#8791a6;
    --faint:#5e6779; --line:#232b3b; --soft:#10151f; --cyan:#28d6ff; --up:#35d07f; --hot:#ff6a6a;
    --warn:#e0b46a; --grape:#a88bff; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden}
  body{background:var(--fond);color:var(--texte);font-family:"IBM Plex Sans",Inter,system-ui,sans-serif;font-size:14px}
  .mw{display:flex;flex-direction:column;height:100%;padding:.55rem .65rem;gap:.5rem}
  .h{display:flex;align-items:center;gap:8px;position:relative;padding-bottom:6px}
  .h::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;border-radius:2px;
    background:linear-gradient(90deg,var(--warn),var(--grape),var(--cyan))}
  .h .ic{font-size:1.05rem} .h b{font-size:.9rem;letter-spacing:.02em}
  .etat{margin-left:auto;display:inline-flex;align-items:center;gap:5px;font-size:.56rem;font-weight:700;
    letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--line);border-radius:20px;padding:2px 9px;
    color:var(--muted)}
  .etat i{width:7px;height:7px;border-radius:50%;background:currentColor}
  .etat.ok{color:var(--up)} .etat.dort{color:var(--warn)} .etat.ko{color:var(--hot)}
  .kpis{display:flex;gap:6px}
  .kpi{flex:1;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:6px 8px;min-width:0}
  .kpi .v{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.95rem;font-weight:700;line-height:1;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kpi .l{font-size:.53rem;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin-top:3px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kpi.ok .v{color:var(--up)} .kpi.dort .v{color:var(--warn)} .kpi.ko .v{color:var(--hot)}
  .kpis[hidden]{display:none}
  .note{font-size:.7rem;color:var(--muted);line-height:1.4;margin:0}
  .note b{color:var(--texte);font-weight:600}
</style>
<div class="mw">
  <div class="h"><span class="ic">🎙️</span><b>VoiceStudio</b>
    <span class="etat" id="etat"><i></i><span id="etat-t">…</span></span></div>
  <div class="kpis" id="kpis" hidden>
    <div class="kpi" id="kc-install"><div class="v" id="k-install">–</div><div class="l">moteur installé</div></div>
    <div class="kpi" id="kc-actif"><div class="v" id="k-actif">–</div><div class="l">état du moteur</div></div>
    <div class="kpi" id="kc-op"><div class="v" id="k-op">–</div><div class="l">opération</div></div>
  </div>
  <p class="note" id="note">Lecture de l'état…</p>
</div>
<script src="../sonde.js"></script>
<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };
  function pastille(classe, texte){ $('etat').className = 'etat ' + classe; $('etat-t').textContent = texte; }
  function kpi(id, classe, texte){ $('kc-' + id).className = 'kpi ' + classe; $('k-' + id).textContent = texte; }
  var ACTIONS = {start:'démarrage', stop:'arrêt', restart:'redémarrage', installer:'installation'};

  function rend(e){
    var op = e.operation || {}, enCours = op.etat === 'en-cours';
    $('kpis').hidden = false;
    kpi('install', e.installed ? 'ok' : 'dort', e.installed ? 'oui' : 'non');
    if (e.running)      { pastille('ok', 'répond');   kpi('actif', 'ok', 'répond');   }
    else if (e.asleep)  { pastille('dort', 'dort');   kpi('actif', 'dort', 'endormi'); }
    else if (!e.installed){ pastille('', 'à installer'); kpi('actif', 'dort', '—'); }
    else                { pastille('ko', 'muet');     kpi('actif', 'ko', 'muet');     }
    kpi('op', enCours ? 'dort' : 'ok', enCours ? (ACTIONS[op.action] || op.action) + '…' : 'aucune');
    $('note').innerHTML = !e.installed
      ? "Le moteur n'est pas encore installé : <b>agrandir</b> ouvre la console pour le provisionner."
      : (e.running ? "Le moteur répond. <b>Agrandir</b> ouvre la console : démarrer, mode, mémoire, clé, journal."
        : (e.asleep ? "Le moteur dort (mode « à la demande » ou arrêté) : la console le réveille."
          : "Le moteur ne répond pas : la console montre le journal."));
  }

  function charge(){
    fetch('/api/v1/voicestudio/status', {headers:{'Accept':'application/json'}, credentials:'same-origin'})
      .then(function(r){
        if (r.status === 401 || r.status === 403){
          pastille('', 'réservé'); $('kpis').hidden = true;
          $('note').textContent = "Réservé aux administrateurs de la box.";
          return null;
        }
        if (r.status === 502 || r.status === 404){
          pastille('', 'absent'); $('kpis').hidden = true;
          $('note').textContent = "VoiceStudio n'est pas installé sur cette box.";
          return null;
        }
        if (!r.ok) throw new Error(String(r.status));
        return r.json();
      })
      .then(function(e){
        if (!e) return;
        if (e.error){ pastille('ko', 'injoignable'); $('kpis').hidden = true; $('note').textContent = "Le module ne répond pas : " + e.error; return; }
        rend(e);
      })
      .catch(function(){
        pastille('ko', 'injoignable'); $('kpis').hidden = true;
        $('note').textContent = "Le service VoiceStudio ne répond pas.";
      });
  }
  charge();
  setInterval(charge, 15000);
})();
</script>
