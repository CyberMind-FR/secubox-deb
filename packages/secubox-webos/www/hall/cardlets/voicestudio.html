  SecuBox — carte « Voix » (secubox-voicestudio, #1917), au profil Aurora (.claude/AURORA-REFERENCE.md, #2660).

  La FACETTE D'USAGER de VoiceStudio, embarquée dans le Hall : dire un texte, dicter. Même contrat que la
  page /voicestudio/usager.html du module (parité des fonctions utiles) ; l'administration (démarrer, mode,
  clé, journal) reste dans la console du module, ouverte par ⚙️ (`admin:"/voicestudio/"`).

  Le Hall n'expose QUE /api/v1/voicestudio/usager/ à cette origine (nginx/hall.vhost.conf) : aucune route
  d'administration n'y est joignable, même à la main. Ces routes exigent une PERSONNE connectée.

  HONNÊTETÉ (§ 6.4 du guide des cartes) : la carte distingue « le moteur dort », « indisponible » et « pas
  installé sur cette box » (502 : la socket du module n'existe pas) — jamais un blanc muet.
  Le micro : demandé par un CLIC, jamais d'écoute d'elle-même (`micro_audio:true` côté Hall).
  Page autonome. ?demo=1 : état fictif, « dire » et « dicter » inertes (rien n'est envoyé ni enregistré).
  ?embed=1 : sans en-tête, hauteur annoncée au parent. Mesure absente = « — ». Tout texte du serveur passe par textContent.
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voix</title>
<style>
  :root{--fond:#060d1b;--trait:rgba(86,150,255,.22);--trait2:rgba(86,150,255,.38);--texte:#eaf1ff;--doux:#9fb3d6;--faible:#6f84a8;
    --cyan:#29b6f6;--bleu:#3b82f6;--vert:#2ecc71;--rouge:#ff4d5e;--orange:#ff9f1c;--violet:#a78bfa;--jaune:#ffd23f}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{background:radial-gradient(1200px 520px at 85% -10%,rgba(59,130,246,.2),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(255,77,94,.10),transparent 60%),var(--fond);
       color:var(--texte);font-family:"IBM Plex Sans","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.3}
  .cadre{container-type:inline-size;container-name:a;padding:10px}
  body.emb .cadre,body.dans .cadre{padding:6px}
  .app{border:1px solid var(--trait2);border-radius:16px;background:linear-gradient(160deg,rgba(15,32,64,.92),rgba(7,15,32,.96));box-shadow:0 0 0 1px rgba(41,182,246,.10),0 0 38px rgba(41,182,246,.08);padding:14px;display:grid;gap:10px;min-width:0}
  body.emb .app,body.dans .app{padding:10px;gap:8px}
  body.emb .app{border:0;box-shadow:none;background:none;padding:0}
  .app>*{min-width:0}
  [hidden]{display:none!important}
  .tete{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
  .marque{display:flex;gap:10px;align-items:center;min-width:0} .marque h1{margin:0;font-size:1.35rem;font-weight:800} .marque small{color:var(--cyan);font-size:.72rem;display:block}
  body.emb .marque{display:none} body.dans .marque small{display:none} body.dans .marque h1{font-size:1.05rem} body.dans .marque svg{width:24px;height:24px}
  .actif{border:1px solid var(--vert);color:var(--vert);background:rgba(46,204,113,.12);border-radius:999px;padding:3px 12px;font-size:.7rem;font-weight:700;letter-spacing:.04em;overflow-wrap:anywhere}
  .actif i{display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;margin-right:6px;vertical-align:1px}
  .actif.hors{border-color:var(--rouge);color:var(--rouge);background:rgba(255,77,94,.12)} .actif.neutre{border-color:var(--faible);color:var(--doux);background:rgba(159,179,214,.12)} .actif.att{border-color:var(--orange);color:var(--orange);background:rgba(255,159,28,.12)}
  .droite{margin-left:auto;display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;color:var(--doux);font-size:.74rem}
  .btn{font:inherit;font-size:.74rem;padding:5px 12px;border-radius:8px;border:1px solid var(--trait2);background:rgba(10,22,46,.7);color:var(--texte);cursor:pointer;display:inline-block;min-height:34px}
  .btn:hover:not(:disabled){border-color:var(--cyan)} .btn:focus-visible,.onglet:focus-visible,.act:focus-visible{outline:2px solid var(--cyan);outline-offset:2px} .btn:disabled{opacity:.5;cursor:default}
  .demo{background:var(--orange);color:#1a1000;text-align:center;font-weight:700;border-radius:8px;padding:3px 8px;font-size:.78rem}
  .info{border:1px solid var(--cyan);background:rgba(41,182,246,.1);border-radius:10px;padding:8px 12px;font-size:.8rem;overflow-wrap:anywhere}
  .info a{color:var(--cyan)}
  .tuiles{display:grid;gap:8px;grid-template-columns:repeat(2,1fr)}
  @container a (min-width:700px){.tuiles{grid-template-columns:repeat(4,1fr)}}
  body.emb .tuiles,body.dans .tuiles{display:none}
  .tuile{display:flex;flex-direction:column;gap:4px;border:1px solid var(--trait);border-radius:12px;padding:9px 11px;background:linear-gradient(160deg,rgba(18,40,78,.7),rgba(8,18,38,.7));min-width:0}
  .tuile .v{font-size:1.45rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;overflow-wrap:anywhere} .tuile .l{color:var(--doux);font-size:.74rem} .tuile .s{color:var(--faible);font-size:.68rem}
  .tuile .v.long{font-size:1rem;line-height:1.15}
  .tuile.ok .v{color:var(--vert)} .tuile.att .v{color:var(--orange)} .tuile.cy .v{color:var(--cyan)} .tuile.hors .v{color:var(--rouge)}
  .pan{border:1px solid var(--trait);border-radius:12px;padding:10px 12px;background:rgba(10,22,46,.6);min-width:0}
  body.emb .pan,body.dans .pan{padding:8px}
  .pan h3{margin:0 0 8px;font-size:.88rem;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px} .pan h3 i{font-style:normal;font-weight:500;color:var(--faible);font-size:.7rem}
  body.emb .pan h3,body.dans .pan h3{display:none}
  .note{color:var(--faible);font-size:.72rem;margin:8px 0 0;overflow-wrap:anywhere} .note b{color:var(--orange);font-weight:600}
  .retour{font-size:.78rem;margin:8px 0 0;padding:6px 10px;border-radius:8px;border:1px solid var(--trait2);background:rgba(8,18,38,.7);overflow-wrap:anywhere}
  .msg{padding:12px;margin-top:10px;border:1px dashed var(--trait2);border-radius:12px;color:var(--doux);font-size:.84rem;text-align:center;overflow-wrap:anywhere}
  .msg b{color:var(--texte)} .msg.err{color:var(--rouge);border-color:var(--rouge)}
  textarea{width:100%;min-height:6rem;resize:vertical;padding:.5rem .6rem;border:1px solid var(--trait2);border-radius:10px;background:rgba(8,18,38,.7);color:var(--texte);font:inherit;font-size:.9rem}
  textarea:focus-visible{outline:2px solid var(--cyan);outline-offset:1px}
  .rang{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
  .btn.p{border-color:var(--cyan);color:var(--cyan);font-weight:700}
  .btn.enreg{border-color:var(--rouge);color:var(--rouge);background:rgba(255,77,94,.12)}
  .cpt{margin-left:auto;font-size:.72rem;color:var(--faible);font-variant-numeric:tabular-nums}
  .cpt.trop{color:var(--rouge)}
  audio{width:100%;height:34px;margin-top:8px}
  audio[hidden]{display:none}
  .res{font-size:.85rem;line-height:1.4;border:1px solid var(--trait);border-radius:10px;background:rgba(18,40,78,.45);padding:.5rem .65rem;margin-top:8px;max-height:9rem;overflow:auto;overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="cadre"><div class="app">
  <header class="tete">
    <div class="marque">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#a78bfa" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"/></svg>
      <div><h1>Voix</h1><small>Dire un texte, dicter — sur ta box</small></div>
    </div>
    <span class="actif neutre" id="etat" aria-live="polite"><i></i><span id="etat-t">…</span></span>
    <div class="droite"><span id="maj">—</span></div>
  </header>
  <div class="demo" id="demo" hidden>DONNÉES DE DÉMONSTRATION — maquette, rien n'est synthétisé, enregistré ni envoyé</div>
  <section class="tuiles" id="tuiles" aria-label="Indicateurs">
    <div class="tuile cy" id="cMoteur" title="État du moteur de voix de la box, tel que le module le déclare."><span class="l">Moteur</span><span class="v long" id="tMoteur">—</span><span class="s">état annoncé</span></div>
    <div class="tuile cy" title="Nombre de caractères acceptés par une synthèse, selon le module."><span class="l">Texte maximal</span><span class="v" id="tTexte">—</span><span class="s">caractères</span></div>
    <div class="tuile cy" title="Taille maximale d'un enregistrement à transcrire, selon le module."><span class="l">Audio maximal</span><span class="v" id="tAudio">—</span><span class="s">Mo</span></div>
  </section>
  <div class="pan"><h3>Dire un texte <i>POST /api/v1/voicestudio/usager/dire</i></h3>
    <textarea id="texte" placeholder="Ce que la box doit dire…" maxlength="2000" aria-label="Texte à dire"></textarea>
    <div class="rang">
      <button class="btn p" id="b-dire" type="button" disabled>▶ Dire</button>
      <button class="btn" id="b-mic" type="button">🎤 Dicter</button>
      <span class="cpt" id="cpt">0</span>
    </div>
    <audio id="audio" controls hidden></audio>
    <div class="res" id="res" hidden></div>
    <p class="note" id="note" role="status" aria-live="polite">Traité sur votre box : rien ne part dans le nuage.</p>
  </div>
</div></div>
<script src="../sonde.js"></script>
<script>
(function(){
  'use strict';
  var ONGLET = 'voicestudio';
  var API = '/api/v1/voicestudio/usager';
  var Q = new URLSearchParams(location.search), DEMO = !!Q.get('demo') && Q.get('demo') !== '0';
  if(Q.get('embed')) document.body.classList.add('emb');
  try{ if(window.top !== window) document.body.classList.add('dans'); }catch(e){ document.body.classList.add('dans'); }
  var $ = function(id){ return document.getElementById(id); };
  function el(tag, cls, texte){ var e = document.createElement(tag); if(cls) e.className = cls; if(texte != null) e.textContent = texte; return e; }
  /* Texte avec des passages en gras, sans jamais passer par du HTML : parts = ['texte', {b:'gras'}, 'suite']. */
  function gras(cont, parts){
    cont.textContent = '';
    parts.forEach(function(p){ cont.appendChild(typeof p === 'string' ? document.createTextNode(p) : el('b', null, p.b)); });
  }
  /* Hauteur annoncée à l'hôte (iframes) : le bas du cadre, jamais la hauteur du document (AURORA-REFERENCE §7). */
  function annoncer(){
    if(parent === window) return;
    try{ parent.postMessage({sbxVue: Math.ceil(document.querySelector('.cadre').getBoundingClientRect().bottom + scrollY), onglet: ONGLET}, location.origin); }catch(e){ /* hors iframe */ }
  }
  if(window.ResizeObserver) new ResizeObserver(annoncer).observe(document.body);
  addEventListener('resize', annoncer);
  var lim = {texte_max: 2000, audio_max_mo: 10}, rec = null, morceaux = [];

  /* Les classes de l'ancienne carte (ok / dort / ko / vide) gardent leur sens ; l'habillage Aurora les traduit. */
  var PASTILLES = {ok: '', dort: 'att', ko: 'hors', '': 'neutre'};
  function pastille(classe, texte){ $('etat').className = 'actif ' + PASTILLES[classe]; $('etat-t').textContent = texte; $('cMoteur').className = 'tuile ' + (classe === 'ok' ? 'ok' : classe === 'dort' ? 'att' : classe === 'ko' ? 'hors' : 'cy'); $('tMoteur').textContent = texte; $('maj').textContent = 'Relevé ' + new Date().toLocaleTimeString('fr-FR'); annoncer(); }
  function note(t){ $('note').textContent = t; annoncer(); }
  var INERTE = 'Démonstration : action inerte, rien n’est synthétisé, enregistré ni envoyé.';

  /* Les trois états distingués (§ 6.4) + le 502 propre au Hall : la socket du module n'existe pas = module
     absent de CETTE box, ce qui n'est ni une panne ni un droit manquant. */
  function dire_erreur(r, detail){
    if (r.status === 401 || r.status === 403){ pastille('', 'connexion'); return 'Réservé aux personnes connectées.'; }
    if (r.status === 502 || r.status === 404){ pastille('', 'absent'); return "VoiceStudio n'est pas installé sur cette box."; }
    /* 503 / 429 / 413 : le module dit POURQUOI (« Mémoire insuffisante pour la synthèse : il faut ≈ 3,7 Go libres, il en reste… ») ;
       un message générique cacherait une cause que l'usager peut comprendre. Le texte du module est inséré en textContent. */
    if (r.status === 503){ pastille('ko', 'indisponible'); return detail || 'Le moteur est indisponible pour le moment.'; }
    if (r.status === 429){ return detail || 'Trop de demandes, réessayez dans une minute.'; }
    if (r.status === 413){ return detail || 'Trop long ou trop volumineux.'; }
    return 'Erreur ' + r.status + '.';
  }
  /* Le message de l'API (JSON {detail}), sans jamais faire échouer l'affichage d'une erreur. */
  function avec_detail(r){
    return r.json().then(function(d){ return dire_erreur(r, d && typeof d.detail === 'string' ? d.detail.slice(0, 300) : ''); },
                         function(){ return dire_erreur(r, ''); });
  }
  function api(chemin, opts){
    opts = opts || {}; opts.credentials = 'same-origin';
    return fetch(API + chemin, opts);
  }

  function compteur(){
    var n = $('texte').value.length, c = $('cpt');
    c.textContent = n + ' / ' + lim.texte_max; c.className = 'cpt' + (n > lim.texte_max ? ' trop' : '');
    $('b-dire').disabled = n === 0 || n > lim.texte_max;
  }

  function sonde(){
    api('/etat', {headers:{'Accept':'application/json'}}).then(function(r){
      if (!r.ok){ note(dire_erreur(r)); return null; }
      return r.json();
    }).then(function(d){
      if (!d) return;
      if (d.limites){
        lim.texte_max = d.limites.texte_max || lim.texte_max; lim.audio_max_mo = d.limites.audio_max_mo || lim.audio_max_mo; compteur();
        $('tTexte').textContent = d.limites.texte_max || '—'; $('tAudio').textContent = d.limites.audio_max_mo || '—';
      }
      if (d.demarrage){ pastille('dort', 'démarre'); note('Le moteur démarre… quelques secondes.'); }
      else if (d.reveil_necessaire && d.disponible){ pastille('dort', 'dort'); note('Le moteur dort : le premier appel prend 30 à 60 s.'); }
      else if (d.disponible){ pastille('ok', 'répond'); note('Traité sur votre box : rien ne part dans le nuage.'); }
      else { pastille('ko', 'indisponible'); note('Le moteur est indisponible pour le moment.'); }
    }).catch(function(){ pastille('ko', 'injoignable'); note('Le service de voix ne répond pas.'); });
  }

  function dire(){
    if (DEMO){ note(INERTE); return; }
    var t = $('texte').value.trim(); if (!t) return;
    $('b-dire').disabled = true; note('Synthèse…');
    api('/dire', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({texte:t, format:'mp3'})})
      .then(function(r){
        if (!r.ok){ return avec_detail(r).then(function(m){ note(m); return null; }); }
        return r.blob();
      }).then(function(b){
        if (!b) return;
        var a = $('audio'); if (a.dataset.url) URL.revokeObjectURL(a.dataset.url);
        a.dataset.url = URL.createObjectURL(b); a.src = a.dataset.url; a.hidden = false;
        a.play().catch(function(){}); note('Traité sur votre box : rien ne part dans le nuage.');
      }).catch(function(){ note('Synthèse impossible.'); })
      .then(compteur);
  }

  function envoie(blob, nom){
    if (blob.size > lim.audio_max_mo * 1048576){ note('Audio trop volumineux (max ' + lim.audio_max_mo + ' Mo).'); return; }
    var fd = new FormData(); fd.append('fichier', blob, nom); fd.append('langue', 'fr');
    note('Transcription…');
    api('/transcrire', {method:'POST', body: fd}).then(function(r){
      if (!r.ok){ note(dire_erreur(r)); return null; }
      return r.json();
    }).then(function(d){
      if (!d) return;
      var z = $('res'); z.hidden = false; z.textContent = d.vide ? '(aucune parole détectée)' : d.texte;
      note('Traité sur votre box : rien ne part dans le nuage.');
    }).catch(function(){ note('Transcription impossible.'); });
  }

  function micro(){
    var b = $('b-mic');
    if (DEMO){ note(INERTE); return; }
    if (rec){ rec.stop(); return; }
    if (!navigator.mediaDevices || !window.MediaRecorder){ note("Enregistrement indisponible ici (HTTPS requis)."); return; }
    navigator.mediaDevices.getUserMedia({audio:true}).then(function(flux){
      morceaux = []; rec = new MediaRecorder(flux);
      rec.ondataavailable = function(e){ if (e.data.size) morceaux.push(e.data); };
      rec.onstop = function(){
        flux.getTracks().forEach(function(t){ t.stop(); });
        var type = rec.mimeType || 'audio/webm'; rec = null;
        b.classList.remove('enreg'); b.textContent = '🎤 Dicter';
        envoie(new Blob(morceaux, {type:type}), 'dictee.' + (type.indexOf('ogg') >= 0 ? 'ogg' : 'webm'));
      };
      rec.start(); b.classList.add('enreg'); b.textContent = '⏹ Arrêter';
    }).catch(function(){ note('Micro refusé ou indisponible.'); });
  }

  $('texte').addEventListener('input', compteur);
  $('b-dire').addEventListener('click', dire);
  $('b-mic').addEventListener('click', micro);
  compteur();
  if (DEMO){
    $('demo').hidden = false; pastille('ok', 'répond'); $('tTexte').textContent = lim.texte_max; $('tAudio').textContent = lim.audio_max_mo;
    $('maj').textContent = 'Démonstration';
  } else { sonde(); setInterval(sonde, 30000); }
  annoncer();
})();
</script>
</body>
</html>
