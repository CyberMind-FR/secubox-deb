<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecuBox — WireGuard VPN</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/shared/hybrid-skin.css">
    <style>
        :root {
            --p31-dim: #6b7b8b;
            --bg-dark: #0d1117;
            --bg-card: rgba(30, 40, 55, 0.8);
            --bg-row: rgba(20, 30, 45, 0.6);
            --border: rgba(100, 150, 200, 0.2);
            --text: #e8e6d9;
            --red: #ff4466;
            --orange: #ff9944;
            --yellow: #ffcc00;
            --green: #00dd44;
            --blue: #4488ff;
            --purple: #a371f7;
            --cyan: #00d4ff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Courier Prime', monospace; background: var(--bg-dark); color: var(--text); display: flex; min-height: 100vh; }
        .sidebar { width: 220px; position: fixed; height: 100vh; overflow-y: auto; }
        .main { flex: 1; margin-left: 220px; padding: 1.5rem; padding-top: 60px; background: linear-gradient(135deg, rgba(10,15,25,0.95), rgba(15,25,40,0.9)); min-height: 100vh; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 0.5rem; }
        .header h1 { font-size: 1.4rem; color: var(--cyan); text-shadow: 0 0 10px var(--cyan); }
        .header .sub { font-size: 0.7rem; color: var(--p31-dim); margin-top: 0.15rem; }
        .btn { padding: 0.4rem 0.8rem; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text); cursor: pointer; font-size: 0.8rem; font-family: 'Courier Prime', monospace; text-transform: uppercase; transition: all 0.2s; }
        .btn:hover { border-color: var(--cyan); color: var(--cyan); box-shadow: 0 0 8px rgba(0,212,255,0.3); }
        .btn.primary { background: rgba(0,212,255,0.15); border-color: var(--cyan); color: var(--cyan); }
        .btn.danger { background: rgba(255,68,102,0.15); border-color: var(--red); color: var(--red); }
        .btn.good { background: rgba(0,221,68,0.15); border-color: var(--green); color: var(--green); }
        .btn.sm { padding: 0.2rem 0.55rem; font-size: 0.7rem; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-group { display: flex; gap: 0.5rem; flex-wrap: wrap; }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 0.75rem; margin-bottom: 1.2rem; }
        .stat-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 0.7rem; text-align: center; backdrop-filter: blur(5px); }
        .stat-card .value { font-size: 1.5rem; font-weight: bold; text-shadow: 0 0 10px currentColor; font-variant-numeric: tabular-nums; }
        .stat-card .label { font-size: 0.6rem; color: var(--p31-dim); letter-spacing: 0.1em; margin-top: 0.25rem; text-transform: uppercase; }
        .stat-card.cyan .value { color: var(--cyan); }
        .stat-card.green .value { color: var(--green); }
        .stat-card.blue .value { color: var(--blue); }
        .stat-card.purple .value { color: var(--purple); }
        .stat-card.orange .value { color: var(--orange); }

        .section-title { font-size: 0.8rem; color: var(--p31-dim); text-transform: uppercase; letter-spacing: 0.1em; margin: 0.5rem 0 0.75rem; display: flex; align-items: center; gap: 0.4rem; }

        .iface-list { display: flex; flex-direction: column; gap: 0.9rem; margin-bottom: 1.5rem; }
        .iface { background: var(--bg-card); border: 1px solid var(--border); border-left: 4px solid var(--border); border-radius: 8px; backdrop-filter: blur(10px); overflow: hidden; transition: border-color 0.2s; }
        .iface.up { border-left-color: var(--green); }
        .iface.down { border-left-color: var(--red); }
        .iface-head { display: grid; grid-template-columns: 2.2em 1fr auto; align-items: center; gap: 0.75rem; padding: 0.85rem 1rem; cursor: pointer; }
        .iface-head:hover { background: rgba(0,212,255,0.05); }
        .iface-emoji { font-size: 1.6rem; text-align: center; }
        .iface-id .name { font-size: 1rem; font-weight: bold; color: var(--cyan); }
        .iface-id .role { font-size: 0.68rem; color: var(--p31-dim); margin-top: 0.1rem; }
        .iface-meta { display: flex; gap: 1.3rem; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
        .iface-meta .m { text-align: right; }
        .iface-meta .m .mv { font-size: 0.9rem; font-weight: bold; font-variant-numeric: tabular-nums; }
        .iface-meta .m .ml { font-size: 0.55rem; color: var(--p31-dim); text-transform: uppercase; letter-spacing: 0.08em; }
        .iface-meta .m.rx .mv { color: var(--blue); }
        .iface-meta .m.tx .mv { color: var(--purple); }
        .iface-meta .m.peers .mv { color: var(--text); }
        .pill { font-size: 0.62rem; padding: 0.18rem 0.5rem; border-radius: 999px; text-transform: uppercase; letter-spacing: 0.06em; white-space: nowrap; }
        .pill.up { background: rgba(0,221,68,0.15); color: var(--green); border: 1px solid var(--green); }
        .pill.down { background: rgba(255,68,102,0.15); color: var(--red); border: 1px solid var(--red); }
        .chev { color: var(--p31-dim); font-size: 0.8rem; transition: transform 0.2s; }
        .iface.open .chev { transform: rotate(90deg); }

        .iface-body { display: none; border-top: 1px solid var(--border); padding: 0.85rem 1rem; }
        .iface.open .iface-body { display: block; }
        .iface-sub { display: flex; gap: 1rem; flex-wrap: wrap; font-size: 0.7rem; color: var(--p31-dim); margin-bottom: 0.75rem; align-items: center; }
        .iface-sub code { color: var(--cyan); background: var(--bg-row); padding: 0.1rem 0.4rem; border-radius: 4px; }
        .iface-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.75rem; }

        .peer-note { padding: 0.9rem; text-align: center; color: var(--p31-dim); font-size: 0.75rem; background: rgba(255,153,68,0.06); border: 1px dashed var(--orange); border-radius: 6px; }
        .peer-list { display: flex; flex-direction: column; gap: 0.3rem; max-height: 380px; overflow-y: auto; }
        .peer { display: grid; grid-template-columns: 1.4em 1fr auto auto; align-items: center; gap: 0.5rem; padding: 0.4rem 0.55rem; background: var(--bg-row); border-radius: 4px; font-size: 0.72rem; border-left: 3px solid var(--p31-dim); }
        .peer.active { border-left-color: var(--green); }
        .peer .dot { text-align: center; }
        .peer .who { overflow: hidden; }
        .peer .who .ip { color: var(--cyan); font-weight: bold; }
        .peer .who .key { color: var(--p31-dim); font-size: 0.6rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .peer .hs { font-size: 0.62rem; color: var(--p31-dim); text-align: right; white-space: nowrap; }
        .peer .xfer { font-size: 0.62rem; text-align: right; white-space: nowrap; }
        .peer .xfer .rx { color: var(--blue); }
        .peer .xfer .tx { color: var(--purple); }

        .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; margin-bottom: 1rem; backdrop-filter: blur(10px); }
        .card h3 { font-size: 0.85rem; color: var(--cyan); margin-bottom: 0.75rem; }
        .kv { display: grid; grid-template-columns: auto 1fr; gap: 0.3rem 1rem; font-size: 0.75rem; }
        .kv .k { color: var(--p31-dim); }
        .kv .v { color: var(--text); font-variant-numeric: tabular-nums; }
        .kv .v code { color: var(--cyan); }
        pre.cli { background: var(--bg-row); border: 1px solid var(--border); border-radius: 6px; padding: 0.7rem; font-size: 0.7rem; color: var(--green); overflow-x: auto; margin-top: 0.5rem; }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; align-items: center; justify-content: center; }
        .modal.show { display: flex; }
        .modal-content { background: rgba(20,30,45,0.97); border: 1px solid var(--border); border-radius: 8px; padding: 1.5rem; width: 480px; max-width: 92vw; max-height: 88vh; overflow-y: auto; backdrop-filter: blur(10px); }
        .modal-content h3 { margin-bottom: 1rem; color: var(--cyan); }
        .modal-content pre { background: var(--bg-row); border: 1px solid var(--border); border-radius: 6px; padding: 0.7rem; font-size: 0.68rem; color: var(--text); overflow-x: auto; white-space: pre-wrap; word-break: break-all; }
        .modal-content img { display: block; margin: 1rem auto; background: #fff; padding: 8px; border-radius: 6px; max-width: 240px; }
        .form-group { margin-bottom: 0.7rem; }
        .form-group label { display: block; margin-bottom: 0.2rem; font-size: 0.7rem; color: var(--p31-dim); text-transform: uppercase; }
        .form-group input, .form-group select { width: 100%; padding: 0.45rem; background: var(--bg-row); border: 1px solid var(--border); border-radius: 4px; font-family: 'Courier Prime', monospace; font-size: 0.8rem; color: var(--text); }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--cyan); }

        .toast { position: fixed; bottom: 24px; right: 20px; padding: 0.75rem 1rem; background: var(--cyan); color: #000; border-radius: 6px; font-size: 0.8rem; z-index: 2000; opacity: 0; transform: translateY(20px); transition: all 0.3s; box-shadow: 0 0 20px rgba(0,212,255,0.4); max-width: 340px; }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.error { background: var(--red); color: #fff; }

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: rgba(20,30,45,0.5); }
        ::-webkit-scrollbar-thumb { background: var(--p31-dim); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--cyan); }
        @media (max-width: 768px) {
            .main { margin-left: 0; }
            .iface-head { grid-template-columns: 2em 1fr auto; }
            .iface-meta { display: none; }
            .peer { grid-template-columns: 1.2em 1fr auto; }
            .peer .xfer { display: none; }
        }
    </style>
</head>
<body class="hybrid-dark">
    <nav class="sidebar" id="sidebar"></nav>
    <script src="/shared/sidebar.js"></script>
    <main class="main">
        <header class="header">
            <div>
                <h1>🔐 WireGuard VPN</h1>
                <div class="sub" id="subline">Kernel-native tunnels · live status</div>
            </div>
            <div class="btn-group">
                <button class="btn" onclick="refresh()">↻ Refresh</button>
            </div>
        </header>

        <div class="grid" id="statGrid">
            <div class="stat-card cyan"><div class="value" id="sIfaces">–</div><div class="label">🔌 Interfaces</div></div>
            <div class="stat-card green"><div class="value" id="sActive">–</div><div class="label">🟢 Active Peers</div></div>
            <div class="stat-card blue"><div class="value" id="sPeers">–</div><div class="label">👥 Total Peers</div></div>
            <div class="stat-card purple"><div class="value" id="sRx">–</div><div class="label">⬇️ RX</div></div>
            <div class="stat-card orange"><div class="value" id="sTx">–</div><div class="label">⬆️ TX</div></div>
        </div>

        <div class="section-title">🔌 Tunnels <span style="color:var(--p31-dim);font-size:0.65rem">(click to expand peers)</span></div>
        <div class="iface-list" id="ifaceList">Loading…</div>

        <div class="card" id="connectCard" style="display:none">
            <h3>🔗 Connect</h3>
            <div class="kv" id="connectKv"></div>
            <pre class="cli" id="cliBlock"></pre>
        </div>
    </main>

    <!-- Peer config / add modal -->
    <div class="modal" id="modal">
        <div class="modal-content" id="modalContent"></div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const API = '/api/v1/wireguard';
        const PEER_AUTOLOAD_MAX = 60;   // interfaces bigger than this: gate the peer list
        let statusData = null;
        let accessData = null;
        const openIfaces = new Set();     // interface names currently expanded
        const forcedPeers = new Set();    // large interfaces the user chose to load anyway

        function token() {
            try { return localStorage.getItem('sbx_token') || ''; } catch (e) { return ''; }
        }
        function authHeaders(extra) {
            const h = Object.assign({}, extra || {});
            const t = token();
            if (t) h['Authorization'] = 'Bearer ' + t;
            return h;
        }

        function ifaceMeta(name) {
            const n = (name || '').toLowerCase();
            if (n.includes('toolbox')) return { emoji: '🧰', role: 'Toolbox — transparent MITM proxy clients' };
            if (n.includes('mesh'))    return { emoji: '🕸️', role: 'Gondwana mesh — inter-node P2P' };
            if (n.includes('admin'))   return { emoji: '🛡️', role: 'Admin VPN — secure management access' };
            return { emoji: '🔐', role: 'WireGuard tunnel' };
        }

        function fmtBytes(b) {
            b = Number(b) || 0;
            if (b < 1024) return b + ' B';
            const u = ['KB', 'MB', 'GB', 'TB'];
            let i = -1;
            do { b /= 1024; i++; } while (b >= 1024 && i < u.length - 1);
            return b.toFixed(b < 10 ? 1 : 0) + ' ' + u[i];
        }
        function fmtAgo(sec) {
            sec = Number(sec) || 0;
            if (sec <= 0) return 'never';
            if (sec < 60) return sec + 's ago';
            if (sec < 3600) return Math.floor(sec / 60) + 'm ago';
            if (sec < 86400) return Math.floor(sec / 3600) + 'h ago';
            return Math.floor(sec / 86400) + 'd ago';
        }
        function esc(s) {
            return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        async function refresh() {
            try {
                const res = await fetch(API + '/status');
                if (!res.ok) throw new Error('status ' + res.status);
                statusData = await res.json();
                renderStatus();
            } catch (e) {
                document.getElementById('ifaceList').innerHTML =
                    '<div class="peer-note">⚠️ Unable to read WireGuard status — ' + esc(e.message) + '</div>';
            }
        }

        function renderStatus() {
            const d = statusData || {};
            const ifaces = d.interfaces || [];
            document.getElementById('sIfaces').textContent = d.interface_count != null ? d.interface_count : ifaces.length;
            document.getElementById('sActive').textContent = d.active_peers != null ? d.active_peers : '–';
            document.getElementById('sPeers').textContent = d.total_peers != null ? d.total_peers : '–';
            document.getElementById('sRx').textContent = fmtBytes(d.total_rx_bytes);
            document.getElementById('sTx').textContent = fmtBytes(d.total_tx_bytes);

            const up = ifaces.filter(i => i.state === 'up').length;
            document.getElementById('subline').textContent =
                ifaces.length + ' tunnel' + (ifaces.length === 1 ? '' : 's') + ' · ' + up + ' up · kernel-native';

            const el = document.getElementById('ifaceList');
            if (!ifaces.length) { el.innerHTML = '<div class="peer-note">No WireGuard interfaces configured.</div>'; return; }

            el.innerHTML = ifaces.map(i => {
                const meta = ifaceMeta(i.name);
                const isUp = i.state === 'up';
                const open = openIfaces.has(i.name);
                return '' +
                '<div class="iface ' + (isUp ? 'up' : 'down') + (open ? ' open' : '') + '" id="if-' + esc(i.name) + '">' +
                  '<div class="iface-head" data-act="toggle" data-iface="' + esc(i.name) + '">' +
                    '<div class="iface-emoji">' + meta.emoji + '</div>' +
                    '<div class="iface-id"><div class="name">' + esc(i.name) + '</div><div class="role">' + esc(meta.role) + '</div></div>' +
                    '<div class="iface-meta">' +
                      '<div class="m peers"><div class="mv">' + (i.peers != null ? i.peers : '?') + '</div><div class="ml">peers</div></div>' +
                      '<div class="m rx"><div class="mv">' + fmtBytes(i.rx_bytes) + '</div><div class="ml">rx</div></div>' +
                      '<div class="m tx"><div class="mv">' + fmtBytes(i.tx_bytes) + '</div><div class="ml">tx</div></div>' +
                      '<span class="pill ' + (isUp ? 'up' : 'down') + '">' + (isUp ? '● UP' : '○ DOWN') + '</span>' +
                      '<span class="chev">▶</span>' +
                    '</div>' +
                  '</div>' +
                  '<div class="iface-body">' +
                    '<div class="iface-sub">' +
                      '<span>📍 <code>' + esc(i.ip || '—') + '</code></span>' +
                      '<span>🎧 port <code>' + esc(i.listen_port || '—') + '</code></span>' +
                      '<span>👥 <code>' + (i.peers != null ? i.peers : '?') + '</code> peers</span>' +
                    '</div>' +
                    '<div class="iface-actions">' +
                      (isUp
                        ? '<button class="btn danger sm" data-act="down" data-iface="' + esc(i.name) + '">⏹ Bring down</button>'
                        : '<button class="btn good sm" data-act="up" data-iface="' + esc(i.name) + '">▶ Bring up</button>') +
                      '<button class="btn primary sm" data-act="addpeer" data-iface="' + esc(i.name) + '">+ Add peer</button>' +
                    '</div>' +
                    '<div class="peer-host" id="peers-' + esc(i.name) + '"></div>' +
                  '</div>' +
                '</div>';
            }).join('');

            // repopulate any expanded drawers
            openIfaces.forEach(name => {
                const iface = ifaces.find(x => x.name === name);
                if (iface) loadPeers(name, iface.peers);
            });

            renderConnect();
        }

        function toggleIface(name) {
            const box = document.getElementById('if-' + name);
            if (!box) return;
            if (openIfaces.has(name)) {
                openIfaces.delete(name);
                box.classList.remove('open');
            } else {
                openIfaces.add(name);
                box.classList.add('open');
                const iface = (statusData.interfaces || []).find(x => x.name === name);
                loadPeers(name, iface ? iface.peers : 0);
            }
        }

        async function loadPeers(name, peerCount) {
            const host = document.getElementById('peers-' + name);
            if (!host) return;
            // Big tunnels (the transparent-proxy tunnel accrues one peer per
            // client) are shown ONLINE-ONLY by default — offline/never-connected
            // peers are noise. "Show all" opts into the full list.
            const onlineOnly = peerCount > PEER_AUTOLOAD_MAX && !forcedPeers.has(name);
            // Only show the loading note on a cold drawer; on the 15s auto-refresh
            // the drawer already holds content, so leave it (no blink / scroll reset).
            if (!host.hasChildNodes()) {
                host.innerHTML = '<div class="peer-note">Loading peers…</div>';
            }
            try {
                const res = await fetch(API + '/peers?interface=' + encodeURIComponent(name));
                const data = await res.json();
                if (data.success === false) throw new Error(data.error || 'command failed');
                renderPeers(host, data.peers || [], onlineOnly, name, peerCount);
            } catch (e) {
                host.innerHTML = '<div class="peer-note">⚠️ Could not load peers — ' + esc(e.message) + '</div>';
            }
        }

        function forcePeers(name, count) {
            forcedPeers.add(name);
            loadPeers(name, count);
        }

        function renderPeers(host, peers, onlineOnly, name, totalCount) {
            let list = peers;
            let note = '';
            if (onlineOnly) {
                // "online" = active (handshake < 3 min) or recent (< 10 min).
                list = peers.filter(p => p.status === 'active' || p.status === 'recent');
                note = '<div class="peer-note">🧰 Showing <b>' + list.length + ' connected</b> of ' +
                    (totalCount != null ? totalCount : peers.length) + ' peers — idle transparent-proxy clients hidden. ' +
                    '<button class="btn sm" data-act="force" data-iface="' + esc(name) + '" data-count="' +
                    (totalCount != null ? totalCount : peers.length) + '">Show all</button></div>';
            }
            if (!list.length) {
                host.innerHTML = note + '<div class="peer-note">No ' + (onlineOnly ? 'connected ' : '') + 'peers on this tunnel.</div>';
                return;
            }
            // active first, then by last handshake
            list = list.slice().sort((a, b) => (b.status === 'active') - (a.status === 'active') || (b.last_handshake || 0) - (a.last_handshake || 0));
            host.innerHTML = note + '<div class="peer-list">' + list.map(p => {
                const active = p.status === 'active';
                const ip = (p.allowed_ips || '').split(',')[0] || '—';
                return '<div class="peer ' + (active ? 'active' : '') + '">' +
                    '<span class="dot">' + (active ? '🟢' : '⚪') + '</span>' +
                    '<span class="who"><span class="ip">' + esc(ip) + '</span>' +
                        (p.name ? ' <span style="color:var(--text)">' + esc(p.name) + '</span>' : '') +
                        '<div class="key">' + esc(p.public_key) + '</div></span>' +
                    '<span class="hs">🤝 ' + fmtAgo(p.handshake_ago) + '</span>' +
                    '<span class="xfer"><span class="rx">⬇' + fmtBytes(p.rx_bytes) + '</span> <span class="tx">⬆' + fmtBytes(p.tx_bytes) + '</span></span>' +
                    '</div>';
            }).join('') + '</div>';
        }

        async function ifaceToggle(name, dir) {
            // Self-lockout guard: taking down the tunnel you may be reaching this
            // panel through cuts your own access — and you can't bring it back up
            // from a panel you can no longer load. Warn hard on the admin/mesh
            // tunnels before a bring-down.
            const critical = /admin|mesh/i.test(name);
            if (dir === 'down' && critical) {
                if (!confirm('⚠️ Bring DOWN ' + name + '?\n\nIf you are connected through this tunnel this WILL cut your access to SecuBox, and you will not be able to bring it back up from here. Only continue from a connection that does NOT depend on ' + name + '.\n\nType-check: continue?')) return;
            } else if (!confirm((dir === 'up' ? 'Bring up' : 'Bring down') + ' ' + name + '?')) {
                return;
            }
            toast((dir === 'up' ? 'Starting ' : 'Stopping ') + name + '…');
            try {
                const res = await fetch(API + '/interface/' + encodeURIComponent(name) + '/' + dir, { method: 'POST', headers: authHeaders() });
                if (res.status === 401) { toast('🔒 Login required for this action', true); return; }
                const data = await res.json();
                if (data.success === false) { toast('❌ ' + (data.error || 'failed'), true); return; }
                toast('✅ ' + name + ' ' + dir);
                setTimeout(refresh, 800);
            } catch (e) { toast('❌ ' + e.message, true); }
        }

        function showAddPeer(iface) {
            const mc = document.getElementById('modalContent');
            mc.innerHTML =
                '<h3>➕ Add peer to ' + esc(iface) + '</h3>' +
                '<div class="form-group"><label>Peer name</label>' +
                '<input id="peerName" placeholder="alice-phone" autocomplete="off"></div>' +
                '<div class="btn-group" style="margin-top:1rem">' +
                '<button class="btn primary" id="peerGenBtn">Generate config</button>' +
                '<button class="btn" id="peerCancelBtn">Cancel</button></div>';
            // Bind via closures so the interface name never gets interpolated
            // into an inline handler string (avoids any JS-string breakout).
            mc.querySelector('#peerGenBtn').addEventListener('click', () => createPeer(iface));
            mc.querySelector('#peerCancelBtn').addEventListener('click', hideModal);
            document.getElementById('modal').classList.add('show');
            setTimeout(() => { const el = document.getElementById('peerName'); if (el) el.focus(); }, 50);
        }

        async function createPeer(iface) {
            const name = (document.getElementById('peerName').value || '').trim();
            if (!/^[A-Za-z0-9][A-Za-z0-9._-]*$/.test(name)) { toast('Name: letters, digits, . _ - only', true); return; }
            toast('Generating ' + name + '…');
            try {
                const res = await fetch(API + '/peer', {
                    method: 'POST',
                    headers: authHeaders({ 'Content-Type': 'application/json' }),
                    body: JSON.stringify({ name: name, interface: iface })
                });
                if (res.status === 401) { toast('🔒 Login required', true); return; }
                const data = await res.json();
                if (data.success === false) { toast('❌ ' + (data.error || 'failed'), true); return; }
                await showPeerConfig(name, iface);
                setTimeout(refresh, 800);
            } catch (e) { toast('❌ ' + e.message, true); }
        }

        async function showPeerConfig(name, iface) {
            const mc = document.getElementById('modalContent');
            mc.innerHTML = '<h3>✅ ' + esc(name) + '</h3><div class="peer-note">Loading config…</div>';
            let cfg = '', qr = '';
            try {
                const c = await fetch(API + '/peer/' + encodeURIComponent(name) + '/config', { headers: authHeaders() });
                const cj = await c.json();
                cfg = cj.config || cj.output || (cj.error ? '(' + cj.error + ')' : '');
            } catch (e) { cfg = '(config unavailable)'; }
            try {
                const q = await fetch(API + '/peer/' + encodeURIComponent(name) + '/qr', { headers: authHeaders() });
                const qj = await q.json();
                if (qj.qr_base64) qr = 'data:image/png;base64,' + qj.qr_base64;
            } catch (e) {}
            mc.innerHTML =
                '<h3>✅ ' + esc(name) + ' on ' + esc(iface) + '</h3>' +
                (qr ? '<img src="' + qr + '" alt="QR">' : '') +
                (cfg ? '<pre>' + esc(cfg) + '</pre>' : '<div class="peer-note">No config returned.</div>') +
                '<div class="btn-group" style="margin-top:1rem"><button class="btn" onclick="hideModal()">Close</button></div>';
        }

        function hideModal() { document.getElementById('modal').classList.remove('show'); }
        document.getElementById('modal').addEventListener('click', e => { if (e.target.id === 'modal') hideModal(); });

        // Delegated handler for the interface list. Actions carry data-act /
        // data-iface attributes instead of inline onclick, so interface names
        // (and any future peer-derived values) never enter a JS-string context.
        document.getElementById('ifaceList').addEventListener('click', e => {
            const t = e.target.closest('[data-act]');
            if (!t) return;
            const name = t.getAttribute('data-iface');
            const act = t.getAttribute('data-act');
            if (act === 'toggle') toggleIface(name);
            else if (act === 'up' || act === 'down') ifaceToggle(name, act);
            else if (act === 'addpeer') showAddPeer(name);
            else if (act === 'force') forcePeers(name, parseInt(t.getAttribute('data-count'), 10) || 0);
        });

        async function renderConnect() {
            if (!accessData) {
                try { accessData = await (await fetch(API + '/access')).json(); } catch (e) { return; }
            }
            const card = document.getElementById('connectCard');
            const ep = (accessData.endpoints || []).find(e => e.host);
            const kv = [];
            if (ep) {
                kv.push(['Endpoint', '<code>' + esc(ep.host) + ':' + esc(ep.port) + '/' + esc(ep.protocol || 'udp') + '</code>']);
            }
            const dash = (accessData.endpoints || []).find(e => e.url);
            if (dash) kv.push(['Dashboard', '<code>' + esc(dash.url) + '</code>']);
            document.getElementById('connectKv').innerHTML = kv.map(r =>
                '<div class="k">' + r[0] + '</div><div class="v">' + r[1] + '</div>').join('');
            const ex = (accessData.cli && accessData.cli.examples) || [];
            document.getElementById('cliBlock').textContent = ex.map(x => '$ ' + x).join('\n');
            card.style.display = kv.length || ex.length ? 'block' : 'none';
        }

        function toast(msg, isError) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast show' + (isError ? ' error' : '');
            setTimeout(() => t.classList.remove('show'), 3200);
        }

        refresh();
        setInterval(refresh, 15000);
    </script>
</body>
</html>
