# /etc/nginx/sites-available/yacy.conf — public vhost yacy.gk2.secubox.in
# Installed by secubox-yacy (#232, #246).
#
# Routing flow (validated 2026-05-20):
#   Browser → HAProxy:443 (TLS, cert /data/haproxy/certs/yacy.gk2.secubox.in.pem)
#          → mitmproxy WAF (LXC) — entry registered in
#            /srv/mitmproxy/haproxy-routes.json INSIDE the mitmproxy LXC
#          → nginx:9080 (this vhost)
#          → YaCy LXC at 10.100.0.80:8090
#
# Operator-side prerequisites (NOT done by this snippet):
#   1. DNS A record yacy.gk2.secubox.in → public IP
#   2. TLS cert in /data/haproxy/certs/yacy.gk2.secubox.in.pem
#      acme.sh --issue -d yacy.gk2.secubox.in -w /usr/share/secubox/www --keylength ec-256
#      ↑ relies on the ^~ /.well-known/acme-challenge/ block below
#   3. haproxyctl vhost add yacy.gk2.secubox.in nginx_vhosts ssl
#      ↑ CAUTION: known to drop backend defs (see #238 / v2.11.1).
#        Prefer manual ACL injection or restore haproxy.cfg from backup.
#   4. mitmproxy route INSIDE the LXC:
#        lxc-attach -n mitmproxy -- python3 -c \
#          "import json; p='/srv/mitmproxy/haproxy-routes.json'; d=json.load(open(p)); \
#           d['yacy.gk2.secubox.in']=['192.168.1.200',9080]; json.dump(d, open(p,'w'), indent=2, sort_keys=True)"
#        lxc-attach -n mitmproxy -- systemctl restart mitmproxy

server {
    listen 0.0.0.0:9080;
    server_name yacy.gk2.secubox.in;

    # ACME HTTP-01 challenge — MUST come before any other location so
    # acme.sh renewals win against the catch-all proxy below. Without this
    # block, every renewal returns 404 from the YaCy LXC.
    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/secubox/www;
        try_files $uri =404;
    }

    # Health Banner injection (same pattern as the canonical hub vhost)
    sub_filter_types text/html;
    sub_filter_once on;
    sub_filter "</body>" '<script src="/shared/health-banner.js"></script></body>';

    # Shared assets — banner JS, error pages
    location /shared/ {
        add_header Access-Control-Allow-Origin "*" always;
        alias /usr/share/secubox/www/shared/;
    }

    # ── Admin surface — internal zones only (#941) ────────────────────────────
    # This vhost is publicly routed, and YaCy only authenticates its `_p` pages
    # (401). Everything else was reachable from the Internet, including
    # Status.html, ConfigBasic.html, Network.html and ConfigPortal.html — node
    # state, base configuration and peer topology. The search portal itself
    # stays public: `/`, `/index.html`, `/yacysearch*`, `/suggest.json`,
    # `/env/*` do not match the regex below (YaCy admin pages are CamelCase,
    # the portal ones are not).
    #
    # The allow-list is deliberately TIGHTER than the 10.0.0.0/8 used by the
    # exposure snippets: that range covers wg-toolbox (browsing clients) and
    # wg-mesh (other boxes), neither of which has any business reading this
    # node's configuration. Zones are named, not lumped together.
    location ~ ^/(Status|Config|Network|Performance|Settings|Steering|ViewLog|Table_|Index|Crawl|Blacklist|Vocabulary|Terminal|WatchWebStructure|ServerScannerList|Load_RSS|RemoteCrawl|Messages|Access) {
        allow 127.0.0.1;
        allow 192.168.1.0/24;    # LAN principal
        allow 192.168.255.0/24;  # segment lan3
        allow 10.100.0.0/24;     # br-lxc
        allow 10.98.0.0/24;      # wg-admin
        deny all;

        proxy_pass http://10.100.0.80:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
    }

    # YaCy admin UI proxied to the LXC
    location / {
        proxy_pass http://10.100.0.80:8090/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
    }

    access_log /var/log/nginx/yacy_access.log;
    error_log  /var/log/nginx/yacy_error.log;
}
