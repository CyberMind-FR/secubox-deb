# /etc/nginx/secubox.d/yacy.conf
# Installed by secubox-yacy.
#
# Per MODULE-GUIDELINES.md §4 REQUIRED (dual-vhost):
#   /api/v1/yacy/   → host FastAPI on Unix socket
#   /yacy/          → SecuBox admin static page (alias). NOT a proxy.
#                     Real YaCy admin UI lives at its own vhost
#                     yacy.gk2.secubox.in (see yacy-vhost.conf).

location /api/v1/yacy/ {
    auth_request /__sbx_auth_verify;
    error_page 401 = @sbx_auth_login;
    rewrite ^/api/v1/yacy/(.*)$ /$1 break;
    proxy_pass http://unix:/run/secubox/yacy.sock;
    include /etc/nginx/snippets/secubox-proxy.conf;
}

# SecuBox admin static page for YaCy. NOT a proxy to the YaCy UI.
location /yacy/ {
    auth_request /__sbx_auth_verify;
    error_page 401 = @sbx_auth_login;
    alias /usr/share/secubox/www/yacy/;
    index index.html;
    try_files $uri $uri/ /yacy/index.html;
}
