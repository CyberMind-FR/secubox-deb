# SecuBox MESH module — CM-MESH-MPCIE-2026-06 v0.2.1
# Backend FastAPI route layout : /mesh/*, /ap/*, /reg/*, /health
# Edge URL : /api/v1/mesh/<route> → rewritten to /<route> backend-side.

location /api/v1/mesh/ {
    rewrite ^/api/v1/mesh/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:8743;
    include /etc/nginx/snippets/secubox-proxy.conf;
    proxy_intercept_errors on;
}

# Convenience root : /api/v1/mesh (no trailing slash) → /health
location = /api/v1/mesh {
    rewrite ^.*$ /health break;
    proxy_pass http://127.0.0.1:8743;
    include /etc/nginx/snippets/secubox-proxy.conf;
}

# MESH WebUI (frontend à venir)
location /mesh/ {
    alias /usr/share/secubox/www/mesh/;
    index index.html;
    try_files $uri $uri/ =404;
}
