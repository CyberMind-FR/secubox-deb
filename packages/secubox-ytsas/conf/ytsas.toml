# /etc/secubox/ytsas.toml — SecuBox YouTube SAS module configuration
#
# Operator-facing override of the package defaults. Edit values then re-run
# install-lxc.sh (the postinst exports these into YTSAS_* env vars consumed by
# lxc/install-lxc.sh, which writes them into the in-LXC
# /opt/secubox-ytsas/ytsas.env read by the FastAPI app). The [peertube] section
# is read by the host-side secubox-ytsas-conserve drain.

# ── LXC ─────────────────────────────────────────────────────────────────
[lxc]
name    = "ytsas"
ip      = "10.100.0.180"
gateway = "10.100.0.1"
bridge  = "br-lxc"
path    = "/data/lxc"

# ── yt-dlp SAS engine (inside the LXC) ─────────────────────────────────
[ytsas]
port       = 8091
max_active = 3          # bounded concurrent yt-dlp workers

# ── Ephemeral retention (purge sweep) ──────────────────────────────────
[retention]
ephemeral_ttl_hours = 6
disk_floor_gb        = 5

# ── Public exposure (nginx vhost :9080 → LXC :8091; HAProxy SNI ACL) ───
[exposure]
public_domain = "ytsas.gk2.secubox.in"

# ── Conserve → PeerTube (host-side secubox-ytsas-conserve) ─────────────
[peertube]
channel = 1             # PeerTube channel id
privacy = 2             # 1=public 2=unlisted 3=private
