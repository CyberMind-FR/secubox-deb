# /etc/nginx/secubox-routes.d/ytsas-routes.conf — Installed by secubox-ytsas.
# This is the dir the deployed admin webui.conf actually includes
# (`include /etc/nginx/secubox-routes.d/*.conf;`, see common/nginx/webui.conf)
# — NOT the legacy /etc/nginx/secubox.d/ dir.
#
# ytsas is LXC-native: the yt-dlp engine runs entirely inside its dedicated
# LXC (lxc/app/), there is no host-side FastAPI process the aggregator could
# load. Without this file the admin panel's /api/v1/ytsas/ calls 404 — the
# companion PWA vhost (secubox-companion/deploy/nginx-companion.conf) already
# proxies the same path, only the admin vhost was missing it.
#
# The LXC's address is static, not resolved at request time: install-lxc.sh
# assigns it to the container's veth (`lxc.net.0.ipv4.address = $LXC_IP/24`,
# default 10.100.0.180, overridable via SECUBOX_LXC_IP) and it is recorded as
# [lxc].ip in /etc/secubox/ytsas.toml. The public vhost (nginx/ytsas.conf) and
# the companion route already hardcode this same address — kept consistent
# with both here rather than introducing a third resolution mechanism for one
# more route.
# ADMINISTRATION DU FLUX YOUTUBE (#2714). Trois routes seulement, chacune derrière auth_request sur /auth/verify?exige=admin
# (administrateur réel, pas n'importe quelle session). Le jeton partagé X-Sbx-Garde-Admin n'est posé qu'APRÈS ce contrôle ; le snippet
# qui le porte est écrit par install-lxc.sh (lisible de root seul). Absent, l'include ne charge rien et le LXC refuse tout. Ces routes
# n'existent PAS sur le vhost du Hall (son motif ne les admet pas) ni sur le vhost public.
location = /__sbx_ytsas_admin {
    internal;
    proxy_pass http://unix:/run/secubox/aggregator.sock:/api/v1/auth/auth/verify?exige=admin;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
}
location = /api/v1/ytsas/flux/etat {
    limit_except GET { deny all; }
    auth_request /__sbx_ytsas_admin;
    include /etc/nginx/snippets/secubox-proxy.conf;
    include /etc/nginx/snippets/secubox-ytsas-garde*.conf;
    proxy_pass http://10.100.0.180:8091;
}
location ~ "^/api/v1/ytsas/flux/(actualiser|vider)/[a-z]{3,20}\z" {
    limit_except POST { deny all; }
    auth_request /__sbx_ytsas_admin;
    include /etc/nginx/snippets/secubox-proxy.conf;
    include /etc/nginx/snippets/secubox-ytsas-garde*.conf;
    rewrite ^ $uri break;   # l'amont reçoit le chemin normalisé admis ci-dessus
    proxy_pass http://10.100.0.180:8091;
}

location /api/v1/ytsas/ {
    include /etc/nginx/snippets/secubox-proxy.conf;
    # jamais de jeton de garde forgé par le client : il n'existe que sur les routes d'administration ci-dessus
    proxy_set_header X-Sbx-Garde-Admin "";
    proxy_pass http://10.100.0.180:8091;
}
