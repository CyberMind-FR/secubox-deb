# /etc/nginx/sites-available/ytsas.conf — SecuBox YouTube SAS public vhost
# Installed by secubox-ytsas; operator enables with:
#   ln -s ../sites-available/ytsas.conf /etc/nginx/sites-enabled/
#   systemctl reload nginx
#
# IMPORTANT for packaging: this is a full, standalone server{} block with its
# own server_name (ytsas.gk2.secubox.in) — it must go to
# /etc/nginx/sites-available/ (+ sites-enabled symlink), NOT
# /etc/nginx/secubox.d/. secubox.d/*.conf files are location-only snippets that
# get merged into the shared admin/hub server block via
# `include /etc/nginx/secubox.d/*.conf;` — nginx does not allow a nested
# `server {}` inside another `server {}`. Same pattern as the torrent vhost.
#
# Public chain: Browser → HAProxy:443 (TLS) → sbxwaf (WAF, bypassed for media)
#               → nginx:9080 (this vhost) → ytsas LXC at 10.100.0.180:8091.
# Requires: HAProxy waf_bypass vhost (registered by postinst) → nginx_vhosts.
#
# Auth: the shared SecuBox LAN-only gate stub (`/__sbx_auth_verify` +
# `@sbx_auth_login`). Because this is a standalone server{} (own file, not
# merged into the hub's block), the two named locations are re-declared here —
# same pattern as the torrent / grafana / spiderfoot vhosts.
server {
    listen 0.0.0.0:9080;
    server_name ytsas.gk2.secubox.in;

    # Large media downloads/uploads (cookies.txt, conserve staging) — don't cap
    # request body size.
    client_max_body_size 0;

    # ACME HTTP-01 challenge — outside the auth gate so renewals work.
    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/secubox/www;
        try_files $uri =404;
    }

    sub_filter_types text/html;
    sub_filter_once on;
    sub_filter "</body>" '<script src="/shared/health-banner.js"></script></body>';

    location /shared/ {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        add_header Access-Control-Allow-Origin "*" always;
        alias /usr/share/secubox/www/shared/;
    }

    location / {
        auth_request /__sbx_auth_verify;
        error_page 401 = @sbx_auth_login;

        proxy_pass http://10.100.0.180:8091;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;

        # Streaming: don't buffer video data either direction (HTTP Range on
        # /stream/:id/:file), and keep long-lived connections (large fetches).
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;

        # Progress streams (yt-dlp job status) may ride a WebSocket upgrade.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Re-declared per-server because auth_request lives at server scope.
    # LAN-only default-deny — matches zz-sbx-authgate.conf's current
    # (post-Authelia) semantics.
    location = /__sbx_auth_verify {
        internal;
        if ($lan_client) { return 204; }
        return 403;
    }
    location @sbx_auth_login {
        return 403;
    }

    access_log /var/log/nginx/ytsas_access.log;
    error_log  /var/log/nginx/ytsas_error.log;
}
