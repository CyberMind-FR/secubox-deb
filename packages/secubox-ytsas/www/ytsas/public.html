  Lecteur PUBLIC au profil Aurora (.claude/AURORA-REFERENCE.md) : c'est ce que le LXC ytsas sert à "/" sur son propre vhost
  (ytsas.gk2.secubox.in) — récupérateur (coller un lien -> récupérer) + liste de la bibliothèque + lecture. Page autonome :
  ni menu commun (/shared/sidebar.js), ni déconnexion, ni réglages — elle est joignable SANS session d'administration. Le
  tableau de bord d'administration (statistiques + coffre à cookies + retrait/purge) est www/ytsas/index.html, servi
  SEULEMENT par l'agrégateur ; install-lxc.sh installe public.html comme index.html du LXC, les deux ne se heurtent jamais.
  Aucun dépôt de cookie, aucune action destructrice ici : ajouter, lister, lire (+ conserver, sans danger) seulement.
  Mêmes appels qu'avant, sans jeton ni en-tête d'authentification : GET /list, POST /add {url}, POST /conserve/<id>,
  lecture /stream/<id>. Aucun innerHTML : tout le rendu passe par textContent.
-->
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SecuBox — YT-SAS</title>
<style>
:root{--fond:#060d1b;--trait:rgba(86,150,255,.22);--trait2:rgba(86,150,255,.38);--texte:#eaf1ff;--doux:#9fb3d6;--faible:#6f84a8;
  --cyan:#29b6f6;--bleu:#3b82f6;--vert:#2ecc71;--rouge:#ff4d5e;--orange:#ff9f1c;--violet:#a78bfa;--jaune:#ffd23f}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(1200px 520px at 85% -10%,rgba(59,130,246,.2),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(41,182,246,.10),transparent 60%),var(--fond);
  color:var(--texte);font-family:"IBM Plex Sans","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.3}
[hidden]{display:none!important}
.cadre{container-type:inline-size;container-name:a;padding:10px;max-width:56rem;margin:0 auto}
.app{border:1px solid var(--trait2);border-radius:16px;background:linear-gradient(160deg,rgba(15,32,64,.92),rgba(7,15,32,.96));box-shadow:0 0 0 1px rgba(41,182,246,.10),0 0 38px rgba(41,182,246,.08);padding:14px;display:grid;gap:12px;min-width:0}
.app>*{min-width:0}
.tete{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.marque h1{margin:0;font-size:1.35rem;font-weight:800} .marque small{color:var(--cyan);font-size:.72rem;display:block}
.droite{margin-left:auto;display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;color:var(--doux);font-size:.74rem}
.btn{font:inherit;font-size:.74rem;padding:5px 12px;border-radius:8px;border:1px solid var(--trait2);background:rgba(10,22,46,.7);color:var(--texte);cursor:pointer;min-height:30px}
.btn:hover{border-color:var(--cyan)} .btn:focus-visible{outline:2px solid var(--cyan);outline-offset:2px} .btn:disabled{opacity:.5;cursor:default}
.btn.sm{padding:3px 9px;font-size:.72rem;min-height:28px} .btn.prim{border-color:var(--cyan);background:rgba(41,182,246,.18)}
.tuiles{display:grid;gap:8px;grid-template-columns:repeat(2,1fr)}
.tuile{display:flex;flex-direction:column;gap:4px;border:1px solid var(--trait);border-radius:12px;padding:9px 11px;background:linear-gradient(160deg,rgba(18,40,78,.7),rgba(8,18,38,.7));min-width:0}
.tuile .v{font-size:1.45rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums} .tuile .l{color:var(--doux);font-size:.74rem}
.tuile.cy .v{color:var(--cyan)} .tuile.ok .v{color:var(--vert)}
.pan{border:1px solid var(--trait);border-radius:12px;padding:10px 12px;background:rgba(10,22,46,.6);min-width:0}
.pan h3{margin:0 0 8px;font-size:.88rem}
.ajout{display:flex;gap:8px;flex-wrap:wrap}
.ajout input{flex:1 1 14rem;min-width:0;font:inherit;min-height:38px;padding:7px 11px;border-radius:10px;border:1px solid var(--trait2);background:rgba(10,22,46,.7);color:var(--texte)}
.ajout input:focus-visible{outline:2px solid var(--cyan);outline-offset:1px;border-color:var(--cyan)}
.note{color:var(--faible);font-size:.74rem;margin:0}
.ligne{border:1px solid var(--trait);border-left:3px solid var(--trait2);border-radius:10px;padding:8px 10px;margin-bottom:8px;background:rgba(10,22,46,.5)}
.ligne.pret{border-left-color:var(--vert)} .ligne.cours{border-left-color:var(--orange)} .ligne.miroir{border-left-color:var(--violet)} .ligne.erreur{border-left-color:var(--rouge)}
.haut{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.titre{min-width:0;flex:1 1 10rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pastille{display:inline-block;border:1px solid var(--doux);color:var(--doux);background:rgba(159,179,214,.12);border-radius:999px;padding:2px 10px;font-size:.66rem;font-weight:700;letter-spacing:.03em}
.pastille.pret{border-color:var(--vert);color:var(--vert);background:rgba(46,204,113,.12)}
.pastille.cours{border-color:var(--orange);color:var(--orange);background:rgba(255,159,28,.12)}
.pastille.miroir{border-color:var(--violet);color:var(--violet);background:rgba(167,139,250,.12)}
.pastille.erreur{border-color:var(--rouge);color:var(--rouge);background:rgba(255,77,94,.12)}
.barre{height:6px;background:rgba(159,179,214,.16);border-radius:3px;overflow:hidden;margin-top:6px} .barre i{display:block;height:100%;background:var(--cyan)}
.meta{color:var(--faible);font-size:.7rem;margin-top:4px;font-variant-numeric:tabular-nums} .meta.ko{color:var(--rouge)}
.lecteur{margin-top:8px;padding-top:8px;border-top:1px solid var(--trait)}
.lecteur video,.lecteur iframe{display:block;width:100%;max-height:60vh;aspect-ratio:16/9;background:#000;border-radius:8px;border:0}
.toast{position:fixed;left:10px;right:10px;bottom:10px;max-width:24rem;margin-left:auto;padding:9px 14px;border-radius:10px;font-size:.8rem;border:1px solid var(--cyan);background:rgba(7,15,32,.96);color:var(--texte);z-index:50;overflow-wrap:anywhere}
.toast.erreur{border-color:var(--rouge);background:rgba(60,12,20,.96)}
.toast button{float:right;margin-left:10px;background:none;border:0;color:inherit;cursor:pointer;font:inherit;min-width:24px;min-height:24px}
@container a (min-width:700px){.tuiles{grid-template-columns:repeat(2,minmax(0,12rem))}}
</style>
</head>
<body>
<div class="cadre">
 <main class="app">
  <header class="tete">
    <div class="marque"><h1>🎞️ YT-SAS</h1><small id="sub">Colle un lien, on récupère la vidéo — puis tu la regardes ici</small></div>
    <div class="droite"><button class="btn" id="btnRefresh" type="button">↻ Rafraîchir</button></div>
  </header>

  <div class="tuiles">
    <div class="tuile cy" title="Vidéos en cours de récupération"><span class="v" id="statPending">—</span><span class="l">⏳ En cours</span></div>
    <div class="tuile ok" title="Vidéos récupérées, prêtes à être lues"><span class="v" id="statReady">—</span><span class="l">▶ Prêtes</span></div>
  </div>

  <section class="pan">
    <h3>➕ Récupérer une vidéo</h3>
    <div class="ajout">
      <input type="text" id="urlInput" name="url" placeholder="https://www.youtube.com/watch?v=… (tout site supporté)" autocomplete="off" inputmode="url" aria-label="Lien de la vidéo">
      <button class="btn prim" id="btnAdd" type="button">➕ Récupérer</button>
    </div>
  </section>

  <section class="pan">
    <h3>📚 Vidéos</h3>
    <div id="list"><p class="note">Chargement…</p></div>
  </section>
 </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function () {
  'use strict';
  var API = '/api/v1/ytsas';
  var openPlayers = Object.create(null); // id -> bool (lecteur intégré ouvert)

  // progression : fraction 0..1 ou pourcentage 0..100 — normalisée en %.
  function pctOf(p) {
    if (p == null || !isFinite(p)) return null;
    return p <= 1 ? Math.round(p * 100) : Math.round(p);
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  var toastTimer = null;
  function toast(msg) {
    var t = document.getElementById('toast');
    clearTimeout(toastTimer);
    t.textContent = msg;
    t.className = 'toast';
    t.hidden = false;
    toastTimer = setTimeout(function () { t.hidden = true; }, 3000);
  }
  function errorToast(msg) {
    var t = document.getElementById('toast');
    clearTimeout(toastTimer);
    t.textContent = '';
    t.appendChild(document.createTextNode('⚠ ' + msg));
    var x = el('button', null, '✕');
    x.type = 'button';
    x.setAttribute('aria-label', 'Fermer');
    x.addEventListener('click', function () { t.hidden = true; });
    t.appendChild(x);
    t.className = 'toast erreur';
    t.hidden = false;
  }

  function api(path, opts) {
    opts = opts || {};
    var headers = Object.assign({}, opts.headers);
    if (opts.body != null && !headers['Content-Type']) headers['Content-Type'] = 'application/json';
    return fetch(path, Object.assign({}, opts, { headers: headers })).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (body) {
        if (!res.ok) throw new Error(body && body.error ? body.error : ('HTTP ' + res.status));
        return body;
      });
    });
  }

  // Seule une adresse http(s) peut alimenter l'iframe du miroir (pas de javascript:, data:…).
  function urlMiroirSure(u) {
    return typeof u === 'string' && /^https?:\/\//i.test(u);
  }

  function pastille(cls, txt) { return el('span', 'pastille ' + cls, txt); }

  function actionBtn(action, txt, titre) {
    var b = el('button', 'btn sm', txt);
    b.type = 'button';
    b.setAttribute('data-action', action);
    b.title = titre;
    return b;
  }

  function ligne(r) {
    var id = r.id;
    var pct = pctOf(r.progress);
    var complete = r.complete === true || r.job_status === 'complete' || r.job_status === 'done' || pct === 100;
    var errored = r.job_status === 'error' || !!r.error;
    var hasMirror = complete && !!r.peertube_url;
    var playerOpen = !!openPlayers[id];
    var cls = errored ? 'erreur' : (!complete ? 'cours' : (hasMirror ? 'miroir' : 'pret'));

    var item = el('div', 'ligne ' + cls);
    item.setAttribute('data-id', String(id));

    var haut = el('div', 'haut');
    var titre = el('div', 'titre', r.title || r.url || ('#' + id));
    titre.title = r.title || r.url || String(id);
    haut.appendChild(titre);

    var actions = el('div', 'actions');
    if (errored) actions.appendChild(pastille('erreur', '⚠ erreur'));
    else if (!complete) actions.appendChild(pastille('cours', '⏳ en cours' + (pct != null ? ' ' + pct + '%' : '')));
    else if (hasMirror) actions.appendChild(pastille('miroir', '◎ miroir'));
    else actions.appendChild(pastille('pret', '▶ prêt'));

    if (complete && !errored) actions.appendChild(actionBtn('toggle-play', playerOpen ? '⏹ Fermer' : '▶ Lire', 'Lire'));
    // « Conserver » (miroir PeerTube/Lyrion) : sans danger ; ni retrait ni purge ici, cette page n'efface rien.
    if (complete && !errored && !hasMirror && r.job_status !== 'conserving') {
      actions.appendChild(actionBtn('conserve', '💾 Conserver', 'Conserver (miroir PeerTube/Lyrion)'));
    }
    haut.appendChild(actions);
    item.appendChild(haut);

    if (errored) {
      item.appendChild(el('div', 'meta ko', '⚠ échec de récupération'));
    } else if (!complete) {
      var barre = el('div', 'barre');
      var rempli = el('i');
      rempli.style.width = (pct == null ? 0 : pct) + '%';
      barre.appendChild(rempli);
      item.appendChild(barre);
      item.appendChild(el('div', 'meta', '⏳ récupération ' + (pct == null ? '…' : pct + '%')));
    }

    if (playerOpen) {
      var lecteur = el('div', 'lecteur');
      if (hasMirror && urlMiroirSure(r.peertube_url)) {
        var f = document.createElement('iframe');
        f.src = r.peertube_url;
        f.setAttribute('allowfullscreen', '');
        f.loading = 'lazy';
        lecteur.appendChild(f);
      } else if (!hasMirror) {
        var v = document.createElement('video');
        v.controls = true;
        v.autoplay = true;
        v.preload = 'metadata';
        v.src = API + '/stream/' + encodeURIComponent(id);
        lecteur.appendChild(v);
      }
      item.appendChild(lecteur);
    }
    return item;
  }

  function renderList(rows) {
    var cont = document.getElementById('list');
    rows = Array.isArray(rows) ? rows : (rows && rows.items) || [];
    var pending = 0, ready = 0;
    cont.textContent = '';

    if (!rows.length) {
      cont.appendChild(el('p', 'note', 'Rien pour l\'instant — colle un lien ci-dessus.'));
      document.getElementById('statPending').textContent = '0';
      document.getElementById('statReady').textContent = '0';
      return;
    }
    rows.forEach(function (r) {
      var pct = pctOf(r.progress);
      var complete = r.complete === true || r.job_status === 'complete' || r.job_status === 'done' || pct === 100;
      var errored = r.job_status === 'error' || !!r.error;
      if (!errored) { if (!complete) pending++; else ready++; }
      cont.appendChild(ligne(r));
    });
    document.getElementById('statPending').textContent = String(pending);
    document.getElementById('statReady').textContent = String(ready);
  }

  function refreshList() {
    return api(API + '/list').then(function (rows) {
      renderList(rows);
    }).catch(function (e) {
      var cont = document.getElementById('list');
      cont.textContent = '';
      cont.appendChild(el('p', 'note', 'Erreur de chargement.'));
      document.getElementById('statPending').textContent = '—';
      document.getElementById('statReady').textContent = '—';
      console.error(e);
    });
  }

  function onListClick(ev) {
    var actionEl = ev.target.closest('[data-action]');
    if (!actionEl) return;
    var itemEl = ev.target.closest('.ligne');
    if (!itemEl) return;
    var id = itemEl.getAttribute('data-id');
    var action = actionEl.getAttribute('data-action');

    if (action === 'toggle-play') {
      openPlayers[id] = !openPlayers[id];
      refreshList();
      return;
    }
    if (action === 'conserve') {
      api(API + '/conserve/' + encodeURIComponent(id), { method: 'POST' }).then(function () {
        toast('💾 Conservation en cours…');
        refreshList();
      }).catch(function (e) { errorToast('Conserver : ' + e.message); });
      return;
    }
  }

  function addVideo() {
    var input = document.getElementById('urlInput');
    var btn = document.getElementById('btnAdd');
    var val = input.value.trim();
    if (!val) { errorToast('Lien requis'); return; }
    btn.disabled = true;
    api(API + '/add', { method: 'POST', body: JSON.stringify({ url: val }) })
      .then(function (meta) {
        input.value = '';
        if (meta && meta.playlist) {
          toast('🎞️ Playlist : ' + (meta.count || 0) + ' vidéo(s) ajoutée(s)');
        } else {
          toast('➕ Ajouté : ' + (meta.title || meta.id || 'ok'));
        }
        refreshList();
      })
      .catch(function (e) { errorToast('Échec de la récupération : ' + e.message); })
      .finally(function () { btn.disabled = false; });
  }

  document.getElementById('btnRefresh').addEventListener('click', refreshList);
  document.getElementById('btnAdd').addEventListener('click', addVideo);
  document.getElementById('urlInput').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') addVideo();
  });
  document.getElementById('list').addEventListener('click', onListClick);

  refreshList();
  // Actualisation 15 s, onglet visible, hors saisie en cours et sans lecteur ouvert (un rendu relancerait la vidéo).
  setInterval(function () {
    var a = document.activeElement;
    var lecture = Object.keys(openPlayers).some(function (k) { return openPlayers[k]; });
    if (document.hidden || lecture || (a && a.id === 'urlInput' && a.value)) return;
    refreshList();
  }, 15000);
})();
</script>
</body>
</html>
