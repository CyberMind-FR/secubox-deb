# /etc/nginx/secubox-routes.d/zia.conf — installed by secubox-zia.

location /zia/ {
    alias /usr/share/secubox/www/zia/;
    index index.html;
    # ENCADRABLE PAR LE HALL (#1658) : la carte ZIA vient maintenant du Hall
    # (même origine). Le serveur pose frame-ancestors 'none' ; un add_header
    # REMPLACE, donc la politique se réécrit entière — micro limité à la même
    # origine (la saisie vocale), rien d'autre d'ouvert.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'; frame-ancestors 'self'; form-action 'self'; object-src 'none'; base-uri 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "microphone=(self), camera=()" always;
    add_header Referrer-Policy "same-origin" always;
    try_files $uri $uri/ /zia/index.html;
}

location /api/v1/zia/ {
    proxy_pass http://unix:/run/secubox/zia.sock:/;
    include /etc/nginx/snippets/secubox-proxy.conf;
}
