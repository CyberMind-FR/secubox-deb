<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZIA Hall</title>
<style>
  :root{ --bg:#ece3cf; --fond:#faf5ea; --texte:#232a5e; --muted:#6a6f92; --faint:#948c73; --line:#ded2b6; --line-soft:#eae0c8;
    --surf2:#f3ecda; --blue:#2e3f9e; --teal:#0a93a6; --teal-ink:#0a7d8e; --fox:#d0622c; --purple:#6a54ad; --coral:#d24f65; --leaf:#3c8f66; }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
    --bg:#0f1538; --fond:#181f4c; --texte:#efe8d6; --muted:#9aa0c4; --faint:#6d7398; --line:#28306e; --line-soft:#202760;
    --surf2:#141b42; --blue:#6076de; --teal:#3fd0e0; --teal-ink:#7fe4f0; --fox:#f2854c; --purple:#a98bff; --coral:#ff6c7e; --leaf:#5fc98a; } }
  :root[data-theme="dark"]{ --bg:#0f1538; --fond:#181f4c; --texte:#efe8d6; --muted:#9aa0c4; --faint:#6d7398; --line:#28306e; --line-soft:#202760;
    --surf2:#141b42; --blue:#6076de; --teal:#3fd0e0; --teal-ink:#7fe4f0; --fox:#f2854c; --purple:#a98bff; --coral:#ff6c7e; --leaf:#5fc98a; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--texte);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.5;
    display:flex;flex-direction:column;align-items:center;
    background-image:radial-gradient(700px 400px at 85% -6%,color-mix(in srgb,var(--teal) 10%,transparent),transparent 70%)}
  .app{width:100%;max-width:720px;height:100vh;display:flex;flex-direction:column;padding:14px 16px 0}
  .top{display:flex;align-items:center;gap:11px;padding:6px 2px 12px}
  .top .fox{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:1.4rem;
    background:radial-gradient(circle at 40% 35%,color-mix(in srgb,var(--fox) 28%,var(--fond)),var(--fond));border:1px solid color-mix(in srgb,var(--fox) 34%,var(--line))}
  .top b{font-size:1.25rem;font-weight:800;letter-spacing:-.01em} .top b i{font-style:normal;color:var(--teal-ink)}
  .top .sub{font-size:.68rem;color:var(--muted)}
  .top .live{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;color:var(--leaf);font-weight:700}
  .top .dot{width:7px;height:7px;border-radius:50%;background:var(--leaf);animation:pulse 2.4s ease-out infinite}
  .top .mdl{font-family:ui-monospace,monospace;font-size:.6rem;color:var(--muted);background:var(--fond);border:1px solid var(--line);border-radius:7px;padding:2px 8px}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--leaf) 55%,transparent)}60%{box-shadow:0 0 0 7px transparent}}
  .panel{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--fond);border:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -1px 0 var(--line);overflow:hidden}
  .stream{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:11px;padding:16px}
  .msg{display:flex;gap:9px;max-width:82%}
  .msg .av{width:26px;height:26px;border-radius:8px;flex:0 0 auto;display:grid;place-items:center;font-size:.85rem}
  .msg.zia .av{background:radial-gradient(circle at 40% 35%,color-mix(in srgb,var(--fox) 28%,var(--fond)),var(--fond));border:1px solid color-mix(in srgb,var(--fox) 32%,var(--line))}
  .msg.me{align-self:flex-end;flex-direction:row-reverse}
  .msg.me .av{background:color-mix(in srgb,var(--blue) 20%,var(--fond));border:1px solid color-mix(in srgb,var(--blue) 32%,var(--line))}
  .bub{border-radius:15px;padding:10px 14px;font-size:.92rem;line-height:1.45}
  .msg.zia .bub{background:var(--surf2);border:1px solid var(--line-soft);border-top-left-radius:5px}
  .msg.me .bub{background:color-mix(in srgb,var(--teal) 14%,var(--fond));border:1px solid color-mix(in srgb,var(--teal) 28%,var(--line));border-top-right-radius:5px}
  .bub b{color:var(--blue)} .bub .hh{color:var(--coral)}
  .trace{align-self:center;display:inline-flex;align-items:center;gap:6px;font-family:ui-monospace,monospace;font-size:.66rem;color:var(--muted);background:var(--surf2);border:1px dashed var(--line);border-radius:999px;padding:4px 12px}
  .trace b{color:var(--teal-ink)}
  .obj{margin-top:8px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--fond)}
  .obj-b{padding:9px 12px}
  .obj-b .svc{font-family:ui-monospace,monospace;font-size:.58rem;color:#fff;background:var(--blue);border-radius:6px;padding:2px 7px}
  .obj-b .ot{font-weight:600;font-size:.88rem;margin-top:6px} .obj-b .os{font-size:.8rem;color:var(--muted);margin-top:2px}
  .obj-b .om{font-family:ui-monospace,monospace;font-size:.62rem;color:var(--faint);margin-top:4px}
  .obj-a{display:flex;gap:7px;padding:0 12px 11px}
  .obj-a button{flex:1;font:inherit;font-size:.76rem;font-weight:600;padding:7px 4px;border-radius:9px;border:1px solid var(--line);color:var(--texte);background:var(--surf2);cursor:pointer}
  .obj-a button.pri{background:var(--teal);color:#04252a;border:0}
  .deleg{align-self:flex-start;display:inline-flex;align-items:center;gap:7px;font-size:.78rem;color:var(--purple);font-weight:600;margin-left:35px;
    background:color-mix(in srgb,var(--purple) 10%,var(--fond));border:1px solid color-mix(in srgb,var(--purple) 30%,var(--line));border-radius:999px;padding:5px 12px}
  .sugg{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 8px}
  .sugg button{font:inherit;font-size:.76rem;color:var(--teal-ink);background:none;border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer}
  .sugg button:hover{border-color:var(--teal)}
  form.in{display:flex;align-items:center;gap:9px;padding:12px 14px;border-top:1px solid var(--line-soft);background:var(--surf2)}
  form.in input{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:11px 14px;background:var(--fond);color:var(--texte);font:inherit;font-size:.92rem}
  form.in input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px color-mix(in srgb,var(--teal) 18%,transparent)}
  form.in button{width:42px;height:42px;border-radius:12px;background:var(--teal);color:#04252a;border:0;font-size:1.15rem;cursor:pointer;flex:0 0 auto}
  .foot{text-align:center;font-size:.62rem;color:var(--faint);padding:7px}
  .foot b{color:var(--teal-ink)}
  @media (prefers-reduced-motion:reduce){ .top .dot{animation:none} }
</style>

<div class="app">
  <div class="top">
    <div class="fox">🦊</div>
    <div><b>ZIA <i>Hall</i></b><div class="sub">l'IA locale, interface du bus d'objets</div></div>
    <span class="mdl" id="mdl">local</span>
    <span class="live"><span class="dot"></span><span id="eng">local</span></span>
  </div>
  <div class="panel">
    <div class="stream" id="stream"></div>
    <div class="sugg" id="sugg"></div>
    <form class="in" id="form" autocomplete="off"><input id="q" placeholder="demande à ZIA…  ex. « trouve la dernière vidéo sur le WAF »" aria-label="Message à ZIA"><button type="submit" title="Envoyer">➤</button></form>
  </div>
  <div class="foot">🦊 100 % local · le <b>bus</b> reste la source de vérité · le LLM n'est jamais une autorité</div>
</div>

<script>
(function(){
  "use strict";
  var API='/api/v1/zia';
  var el=function(id){return document.getElementById(id);};
  function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c];});}
  function md(t){ return esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/❤/g,'<span class="hh">❤</span>'); }
  var stream=el('stream');
  function scroll(){ stream.scrollTop=stream.scrollHeight; }
  function addMe(t){ stream.insertAdjacentHTML('beforeend','<div class="msg me"><div class="av">🙂</div><div class="bub">'+esc(t)+'</div></div>'); scroll(); }
  function addZia(html){ var d=document.createElement('div'); d.className='msg zia'; d.innerHTML='<div class="av">🦊</div><div class="bub">'+html+'</div>'; stream.appendChild(d); scroll(); return d; }
  function addTrace(tr){ (tr||[]).forEach(function(t){ stream.insertAdjacentHTML('beforeend','<div class="trace">🧰 <b>'+esc(t.tool)+'</b>( '+esc(Object.values(t.args||{}).filter(Boolean).join(', '))+' )</div>'); }); scroll(); }
  function objHTML(o){
    var acts=(o.actions||[]).map(function(a,i){ var lbl={open:'⬚ Ouvrir',play:'▶ Lire',discuss:'💬 Discuter'}[a]||a;
      return '<button class="'+(i===0?'pri':'')+'" data-act="'+esc(a)+'" data-svc="'+esc(o.service)+'" data-type="'+esc(o.type||'')+'" data-url="'+esc(o.url||'')+'" data-title="'+esc(o.title||'')+'">'+lbl+'</button>'; }).join('');
    return '<div class="obj"><div class="obj-b"><span class="svc">'+esc(o.service)+'</span>'
      +'<div class="ot">'+esc(o.title||'—')+'</div>'+(o.summary?'<div class="os">'+esc(o.summary)+'</div>':'')
      +'<div class="om">'+esc(o.uri||'')+'</div></div><div class="obj-a">'+acts+'</div></div>';
  }
  function ouvreObjet(svc, type, url, titre){
    if(parent===window){ if(url) location.href=url; else location.href='/'+svc+'/'; return; }
    try{
      if(type==='service' || !url){ parent.postMessage({sbx:'ouvre', id:svc}, '*'); return; }
      if(/^media\./.test(type)){ parent.postMessage({sbx:'voir', url:url, titre:titre}, '*'); return; }
      var hote=''; try{ hote=new URL(url).hostname; }catch(e){}
      parent.postMessage({sbx:'ouvre-hote', hote:hote, url:url}, '*');
    }catch(x){}
  }
  function render(r){
    var d=addZia(md(r.text||'…'));
    (r.objects||[]).forEach(function(o){ d.querySelector('.bub').insertAdjacentHTML('beforeend', objHTML(o)); });
    if(r.delegate && r.delegate.to){ stream.insertAdjacentHTML('beforeend','<div class="deleg">🦝 délègue à <b style="color:var(--texte)">ZIA · '+esc(r.delegate.to)+'</b> →</div>'); }
    if(r.engine) el('eng').textContent=r.engine==='llm'?'modèle':'local';
    scroll();
  }
  function envoie(m){ m=(m||'').trim(); if(!m) return; addMe(m);
    var p=addZia('<span style="opacity:.6">…</span>');
    fetch(API+'/v1/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m})})
      .then(function(r){return r.ok?r.json():null;}).then(function(res){ p.remove(); if(!res){addZia('Service ZIA injoignable.');return;} addTrace(res.trace); render(res); })
      .catch(function(){ p.remove(); addZia('Oups, réseau.'); }); }
  stream.addEventListener('click', function(e){ var b=e.target.closest('[data-act]'); if(!b) return;
    ouvreObjet(b.getAttribute('data-svc'), b.getAttribute('data-type'), b.getAttribute('data-url'), b.getAttribute('data-title'));
    var old=b.textContent; b.textContent='✓'; setTimeout(function(){ b.textContent=old; }, 700); });
  el('form').addEventListener('submit', function(e){ e.preventDefault(); envoie(el('q').value); el('q').value=''; });
  var SUG=['la dernière vidéo sur le WAF','les podcasts','les sujets récents','que sais-tu faire ?'];
  el('sugg').innerHTML=SUG.map(function(s){return '<button type="button">'+esc(s)+'</button>';}).join('');
  el('sugg').addEventListener('click', function(e){ var b=e.target.closest('button'); if(b){ envoie(b.textContent); } });
  fetch(API+'/health',{headers:{'Accept':'application/json'}}).then(function(r){return r.ok?r.json():null;}).then(function(h){
    if(h){ el('mdl').textContent=h.model||'local'; el('eng').textContent=h.engine==='llm'?'modèle':'local'; }
    addZia('Salut ! 🦊 Je connais ton Hall — tes médias, docs, contacts, sujets. Demande-moi de trouver quelque chose. ❤');
  }).catch(function(){ addZia('Salut ! 🦊'); });
  (function(){ var t=new URLSearchParams(location.search).get('theme'); if(t==='dark'||t==='light') document.documentElement.setAttribute('data-theme',t); })();
})();
</script>
