<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZIA — chat</title>
<style>
  :root{ --fond:#faf5ea; --texte:#232a5e; --muted:#6a6f92; --faint:#948c73; --line:#ded2b6; --line-soft:#eae0c8;
    --surf2:#f3ecda; --blue:#2e3f9e; --teal:#0a93a6; --teal-ink:#0a7d8e; --fox:#d0622c; --purple:#6a54ad; --coral:#d24f65; --leaf:#3c8f66; }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
    --fond:#181f4c; --texte:#efe8d6; --muted:#9aa0c4; --faint:#6d7398; --line:#28306e; --line-soft:#202760;
    --surf2:#141b42; --blue:#6076de; --teal:#3fd0e0; --teal-ink:#7fe4f0; --fox:#f2854c; --purple:#a98bff; --coral:#ff6c7e; --leaf:#5fc98a; } }
  :root[data-theme="dark"]{ --fond:#181f4c; --texte:#efe8d6; --muted:#9aa0c4; --faint:#6d7398; --line:#28306e; --line-soft:#202760;
    --surf2:#141b42; --blue:#6076de; --teal:#3fd0e0; --teal-ink:#7fe4f0; --fox:#f2854c; --purple:#a98bff; --coral:#ff6c7e; --leaf:#5fc98a; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden}
  body{background:var(--fond);color:var(--texte);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.45}
  .mw{display:flex;flex-direction:column;height:100%}
  .h{display:flex;align-items:center;gap:8px;padding:9px 11px;border-bottom:1px solid var(--line-soft);
    background:linear-gradient(90deg,color-mix(in srgb,var(--fox) 9%,var(--fond)),var(--fond))}
  .h .fox{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:1rem;
    background:radial-gradient(circle at 40% 35%,color-mix(in srgb,var(--fox) 30%,var(--fond)),var(--fond));border:1px solid color-mix(in srgb,var(--fox) 34%,var(--line))}
  .h b{font-weight:800;font-size:.92rem;letter-spacing:-.01em}
  .h .mdl{font-size:.56rem;color:var(--muted);background:var(--surf2);border:1px solid var(--line-soft);border-radius:6px;padding:1px 6px;font-family:ui-monospace,monospace}
  .h .live{margin-left:auto;display:inline-flex;align-items:center;gap:5px;font-size:.54rem;letter-spacing:.08em;text-transform:uppercase;color:var(--leaf);font-weight:700}
  .h .dot{width:6px;height:6px;border-radius:50%;background:var(--leaf);animation:pulse 2.4s ease-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--leaf) 55%,transparent)}60%{box-shadow:0 0 0 6px transparent}}
  .stream{flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin;display:flex;flex-direction:column;gap:9px;padding:11px}
  .msg{display:flex;gap:7px;max-width:92%}
  .msg .av{width:22px;height:22px;border-radius:7px;flex:0 0 auto;display:grid;place-items:center;font-size:.75rem}
  .msg.zia .av{background:radial-gradient(circle at 40% 35%,color-mix(in srgb,var(--fox) 28%,var(--fond)),var(--fond));border:1px solid color-mix(in srgb,var(--fox) 32%,var(--line))}
  .msg.me{align-self:flex-end;flex-direction:row-reverse}
  .msg.me .av{background:color-mix(in srgb,var(--blue) 20%,var(--fond));border:1px solid color-mix(in srgb,var(--blue) 32%,var(--line))}
  .bub{border-radius:13px;padding:8px 11px;font-size:.85rem;line-height:1.4}
  .msg.zia .bub{background:var(--surf2);border:1px solid var(--line-soft);border-top-left-radius:4px;color:var(--texte)}
  .msg.me .bub{background:color-mix(in srgb,var(--teal) 14%,var(--fond));border:1px solid color-mix(in srgb,var(--teal) 28%,var(--line));border-top-right-radius:4px}
  .bub b{color:var(--blue)} .bub .hh{color:var(--coral)}
  .trace{align-self:center;display:inline-flex;align-items:center;gap:6px;font-family:ui-monospace,monospace;font-size:.62rem;color:var(--muted);
    background:var(--surf2);border:1px dashed var(--line);border-radius:999px;padding:3px 10px}
  .trace b{color:var(--teal-ink)}
  .obj{margin-top:7px;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--fond)}
  .obj-b{padding:8px 10px}
  .obj-b .svc{font-family:ui-monospace,monospace;font-size:.56rem;color:#fff;background:var(--blue);border-radius:5px;padding:1px 6px}
  .obj-b .ot{font-weight:600;font-size:.8rem;line-height:1.25;margin-top:5px}
  .obj-b .om{font-family:ui-monospace,monospace;font-size:.56rem;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .obj-a{display:flex;gap:5px;padding:0 10px 9px}
  .obj-a button{flex:1;font:inherit;font-size:.68rem;font-weight:600;padding:5px 4px;border-radius:8px;border:1px solid var(--line);color:var(--texte);background:var(--surf2);cursor:pointer}
  .obj-a button.pri{background:var(--teal);color:#04252a;border:0}
  .deleg{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font-size:.7rem;color:var(--purple);font-weight:600;margin-left:29px;
    background:color-mix(in srgb,var(--purple) 10%,var(--fond));border:1px solid color-mix(in srgb,var(--purple) 30%,var(--line));border-radius:999px;padding:4px 10px}
  .sugg{display:flex;gap:5px;flex-wrap:wrap;padding:0 11px 6px}
  .sugg button{font:inherit;font-size:.66rem;color:var(--teal-ink);background:none;border:1px solid var(--line);border-radius:999px;padding:3px 9px;cursor:pointer}
  .sugg button:hover{border-color:var(--teal)}
  form.in{display:flex;align-items:center;gap:7px;padding:9px 11px;border-top:1px solid var(--line-soft);background:var(--surf2)}
  form.in input{flex:1;min-width:0;border:1px solid var(--line);border-radius:11px;padding:8px 12px;background:var(--fond);color:var(--texte);font:inherit;font-size:.85rem}
  form.in input:focus{outline:none;border-color:var(--teal)}
  form.in button{width:34px;height:34px;border-radius:10px;background:var(--teal);color:#04252a;border:0;font-size:1rem;cursor:pointer;flex:0 0 auto}
  .foot{padding:6px 11px;font-size:.56rem;color:var(--faint);text-align:center;border-top:1px solid var(--line-soft);background:var(--fond)}
  .foot b{color:var(--teal-ink)}
  @media (prefers-reduced-motion:reduce){ .h .dot{animation:none} }
</style>

<div class="mw">
  <div class="h"><span class="fox">🦊</span><b>ZIA</b><span class="mdl" id="mdl">local</span>
    <span class="live"><span class="dot"></span><span id="eng">local</span></span></div>
  <div class="stream" id="stream"></div>
  <div class="sugg" id="sugg"></div>
  <form class="in" id="form" autocomplete="off"><input id="q" placeholder="demande à ZIA…" aria-label="Message à ZIA"><button type="submit" title="Envoyer">➤</button></form>
  <div class="foot">🦊 100 % local · le <b>bus</b> reste la source de vérité</div>
</div>

<script>
(function(){
  "use strict";
  var API='/api/v1/zia';
  var el=function(id){return document.getElementById(id);};
  function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c];});}
  function md(t){ return esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/❤/g,'<span class="hh">❤</span>'); }
  var stream=el('stream');
  function scroll(){ stream.scrollTop=stream.scrollHeight; }

  function addMe(t){ stream.insertAdjacentHTML('beforeend','<div class="msg me"><div class="av">🙂</div><div class="bub">'+esc(t)+'</div></div>'); scroll(); }
  function addZia(html){ var d=document.createElement('div'); d.className='msg zia'; d.innerHTML='<div class="av">🦊</div><div class="bub">'+html+'</div>'; stream.appendChild(d); scroll(); return d; }
  function addTrace(tr){ (tr||[]).forEach(function(t){ stream.insertAdjacentHTML('beforeend','<div class="trace">🧰 <b>'+esc(t.tool)+'</b>( '+esc(Object.values(t.args||{}).filter(Boolean).join(', '))+' )</div>'); }); scroll(); }

  function objHTML(o){
    var acts=(o.actions||[]).map(function(a,i){
      var lbl={open:'⬚ Ouvrir',play:'▶ Lire',discuss:'💬 Discuter'}[a]||a;
      return '<button class="'+(i===0?'pri':'')+'" data-act="'+esc(a)+'" data-svc="'+esc(o.service)+'" data-type="'+esc(o.type||'')+'" data-url="'+esc(o.url||'')+'" data-title="'+esc(o.title||'')+'">'+lbl+'</button>';
    }).join('');
    return '<div class="obj"><div class="obj-b"><span class="svc">'+esc(o.service)+'</span>'
      +'<div class="ot">'+esc(o.title||'—')+'</div>'
      +'<div class="om">'+esc(o.uri||'')+'</div></div>'
      +'<div class="obj-a">'+acts+'</div></div>';
  }
  // Ouvre RÉELLEMENT l'objet dans le Hall selon son type/URL :
  //  • service      -> on ouvre le service (sbx:'ouvre').
  //  • média + url  -> le viewer le joue (sbx:'voir').
  //  • page + url   -> on embarque le service à cette URL profonde (sbx:'ouvre-hote').
  function ouvreObjet(svc, type, url, titre){
    if(parent===window){ if(url) location.href=url; return; }
    try{
      if(type==='service' || !url){ parent.postMessage({sbx:'ouvre', id:svc}, '*'); return; }
      if(/^media\./.test(type)){ parent.postMessage({sbx:'voir', url:url, titre:titre}, '*'); return; }
      var hote=''; try{ hote=new URL(url).hostname; }catch(e){}
      parent.postMessage({sbx:'ouvre-hote', hote:hote, url:url}, '*');
    }catch(x){}
  }

  function render(r){
    var d=addZia(md(r.text||'…'));
    (r.objects||[]).forEach(function(o){ d.querySelector('.bub').insertAdjacentHTML('beforeend', objHTML(o)); });
    if(r.delegate && r.delegate.to){ stream.insertAdjacentHTML('beforeend','<div class="deleg">🦝 délègue à <b style="color:var(--texte)">ZIA · '+esc(r.delegate.to)+'</b> →</div>'); }
    if(r.engine){ el('eng').textContent = r.engine==='llm'?'modèle':'local'; }
    scroll();
  }

  function envoie(m){
    m=(m||'').trim(); if(!m) return;
    addMe(m); addTrace([]);   // trace ajoutée après réponse
    var pending=addZia('<span style="opacity:.6">…</span>');
    fetch(API+'/v1/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m})})
      .then(function(r){return r.ok?r.json():null;})
      .then(function(res){
        pending.remove();
        if(!res){ addZia('Service ZIA injoignable.'); return; }
        addTrace(res.trace); render(res);
      }).catch(function(){ pending.remove(); addZia('Oups, réseau.'); });
  }

  // Clic sur une action d'objet → on demande au Hall d'ouvrir le service porteur.
  // (P3+ : résoudre sbx:// en lien profond ; ici on ouvre le service.)
  stream.addEventListener('click', function(e){
    var b=e.target.closest('[data-act]'); if(!b) return;
    ouvreObjet(b.getAttribute('data-svc'), b.getAttribute('data-type'), b.getAttribute('data-url'), b.getAttribute('data-title'));
    var old=b.textContent; b.textContent='✓'; setTimeout(function(){ b.textContent=old; }, 700);
  });

  el('form').addEventListener('submit', function(e){ e.preventDefault(); envoie(el('q').value); el('q').value=''; });

  var SUG=['la dernière vidéo sur le WAF','les podcasts','les sujets récents','aide'];
  el('sugg').innerHTML=SUG.map(function(s){ return '<button type="button">'+esc(s)+'</button>'; }).join('');
  el('sugg').addEventListener('click', function(e){ var b=e.target.closest('button'); if(b){ envoie(b.textContent); el('sugg').style.display='none'; } });

  // Salutation d'accueil (santé + modèle).
  fetch(API+'/health',{headers:{'Accept':'application/json'}}).then(function(r){return r.ok?r.json():null;}).then(function(h){
    if(h){ el('mdl').textContent=h.model||'local'; el('eng').textContent=h.engine==='llm'?'modèle':'local'; }
    addZia('Salut ! 🦊 Je connais ton Hall — demande-moi un média, un doc, un sujet.');
  }).catch(function(){ addZia('Salut ! 🦊 (hors ligne)'); });

  (function(){ var t=new URLSearchParams(location.search).get('theme'); if(t==='dark'||t==='light') document.documentElement.setAttribute('data-theme',t); })();
  addEventListener('message',function(ev){ var d=ev.data; if(d&&d.sbx==='theme'&&(d.theme==='dark'||d.theme==='light')) document.documentElement.setAttribute('data-theme',d.theme); });
})();
</script>

<!-- SPICY + aide reverse-design (#1360) — inline partagé (cross-origin). -->
<style>
.h,.head,.tete,.clh{position:relative}
.h::after,.head::after,.tete::after,.clh::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--accent,var(--cyan,#0784a8)),#28d6ff,#f0b429);opacity:.85}
.sbxaide-ring{position:absolute;border:2px solid var(--accent,var(--cyan,#0784a8));border-radius:8px;z-index:41;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,var(--cyan,#0784a8)) 20%,transparent);pointer-events:none;transition:.18s}
.sbxaide-pin{position:absolute;transform:translate(-50%,-50%);min-width:18px;height:18px;border-radius:10px;z-index:42;background:var(--accent,var(--cyan,#0784a8));color:#fff;font-weight:800;font-size:.66rem;display:grid;place-items:center;padding:0 5px;box-shadow:0 2px 6px rgba(0,0,0,.45);pointer-events:none}
</style>
<script>
(function(){
  function post(m){ if(window.parent!==window){ try{window.parent.postMessage(m,'*'); }catch(e){} } }
  var root=document.querySelector('.mw,.mp,.wrap,.micro,.card,main')||document.body;
  if(getComputedStyle(root).position==='static') root.style.position='relative';
  var on=false,tmr=null,nodes=[];
  function zones(){ var out=[],seen=[];
    function add(sel,label){ var e=root.querySelector(sel); if(e&&seen.indexOf(e)<0){seen.push(e);out.push({el:e,label:label});} }
    add('.h,.head,header,.tete,.clh','En-tête — le service et son état');
    add('.kpis','Indicateurs clés');
    add('form,.msg,.compose,.saisie','Saisie — écrire / coller');
    add('.slice.actif,.slices,.stage,.vue,.np,.list,.mlist,.top,.feed,.threads,.fils,.suite,#chat','Contenu vivant');
    add('#slbar,.sbx-bar,.dots,.footbar,.pied,.bas','Barre du bas');
    return out; }
  function clear(){ nodes.forEach(function(n){n.remove();}); nodes=[]; }
  function draw(){ clear(); var rr=root.getBoundingClientRect(), Z=zones();
    Z.forEach(function(x,k){ if(!x.el)return; var r=x.el.getBoundingClientRect(); if(r.width<2||r.height<2)return;
      var ring=document.createElement('div'); ring.className='sbxaide-ring';
      ring.style.left=(r.left-rr.left-2)+'px'; ring.style.top=(r.top-rr.top-2)+'px';
      ring.style.width=(r.width+4)+'px'; ring.style.height=(r.height+4)+'px'; root.appendChild(ring); nodes.push(ring);
      var pin=document.createElement('div'); pin.className='sbxaide-pin'; pin.textContent=(k+1);
      pin.style.left=(r.left-rr.left+10)+'px'; pin.style.top=(r.top-rr.top)+'px'; root.appendChild(pin); nodes.push(pin);
    });
    report(rr,Z); }
  function report(rr,Z){ rr=rr||root.getBoundingClientRect(); Z=Z||zones();
    post({sbx:'aide-zones',slice:'',vw:rr.width,vh:rr.height,
      zones:Z.map(function(x){ if(!x.el)return null; var r=x.el.getBoundingClientRect(); if(r.width<2||r.height<2)return null;
        return {label:x.label,x:r.left-rr.left,y:r.top-rr.top,w:r.width,h:r.height};}).filter(Boolean)}); }
  function show(v){ on=v; if(v){ draw(); if(tmr)clearInterval(tmr); tmr=setInterval(draw,500);} else { if(tmr){clearInterval(tmr);tmr=null;} clear(); } }
  window.addEventListener('message',function(ev){var d=ev.data; if(!d)return; if(d.sbx==='aide')show(!!d.on); else if(d.sbx==='aide?')report();});
  window.addEventListener('resize',function(){ if(on)draw(); });
})();
</script>
