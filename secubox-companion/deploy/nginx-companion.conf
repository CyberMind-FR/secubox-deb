# Transition Companion 1.x -> 2.0 (#3683) : l'ancien vhost companion.gk2 (PWA servie depuis /data/companion/www, avec
# son proxy d'API) n'existe plus. L'APK, version.json et la page d'association sont désormais livrés par le paquet
# secubox-companion sur le vhost d'administration : https://admin.gk2.secubox.in/companion/.
# À déposer dans sites-enabled sur gk2, puis reload ; routage HAProxy inchangé (companion.gk2 pointe toujours ici).
# À retirer, avec l'entrée HAProxy, une fois les anciennes installations 1.x mises à jour.
server {
    listen 9080;
    server_name companion.gk2.secubox.in;
    add_header X-Content-Type-Options nosniff always;
    location / { return 301 https://admin.gk2.secubox.in/companion/; }
}
