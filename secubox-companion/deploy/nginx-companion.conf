# SecuBox Companion PWA — nginx vhost (static + same-origin API proxy).
# Deploy: copy www/ to /data/companion/www, drop this in sites-enabled, reload.
# Route companion.gk2 via HAProxy `webui_direct` (like admin.gk2) so sbxwaf does
# not strip the SSO session cookie — see issue #861 to remove that bypass.
server {
    listen 9080;
    server_name companion.gk2.secubox.in;
    root /data/companion/www;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    gzip on; gzip_types application/javascript text/css application/json image/svg+xml application/manifest+json;

    # AUTH must hit the canonical auth.sock (records the session jti in
    # sessions.json) — NOT the aggregator copy, whose jti is never recorded → 401.
    location /api/v1/auth/ { include /etc/nginx/snippets/secubox-proxy.conf; proxy_pass http://unix:/run/secubox/auth.sock:/api/v1/auth/; }
    # own-socket modules
    location /api/v1/podcaster/ { include /etc/nginx/snippets/secubox-proxy.conf; proxy_pass http://unix:/run/secubox/podcaster.sock:/; }
    location /api/v1/billets/   { include /etc/nginx/snippets/secubox-proxy.conf; proxy_pass http://unix:/run/secubox/billets.sock:/; }
    # torrent lives in its own LXC (br-lxc), not the aggregator — proxy straight to it.
    location /api/v1/torrent/   { include /etc/nginx/snippets/secubox-proxy.conf; proxy_pass http://10.100.0.160:8090; }
    # everything else → aggregator (auth verify, waf, system, exposure, wireguard, certs, dns…)
    location /api/v1/           { include /etc/nginx/snippets/secubox-proxy.conf; proxy_pass http://unix:/run/secubox/aggregator.sock:/api/v1/; }

    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest { default_type application/manifest+json; }
    location ~* \.woff2$ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location / { try_files $uri $uri/ /index.html; }
}
