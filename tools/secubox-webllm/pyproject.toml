[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secubox-webllm"
version = "0.1.0"
description = "Automatisation locale d'une session de chat web multi-fournisseur, dans un profil de navigateur persistant."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Gérald Kerma", email = "devel@cybermind.fr" }]
dependencies = ["playwright>=1.40"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff", "black"]

[project.scripts]
secubox-webllm = "webllm.cli:main"

[tool.setuptools.packages.find]
include = ["webllm*"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
